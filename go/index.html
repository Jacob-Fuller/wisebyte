87.6,492.2,494.68,502.13,511.13,514.29,523.77,526.58,530.44,531.81,541.89,549.42,558.94,563.02,572.93,576.04,585.19,590.73,600.01,607.26]},"dur":{"f":561.4,"m":612.6},"units":[{"t":"The Fundamental Attribution Error.","c":-1,"k":"title","ps":false},{"t":"Part one. The essay nobody chose.","c":0,"k":"head","ps":false},{"t":"Picture yourself in traffic.","c":0,"k":"s","ps":true},{"t":"A car swerves in front of you with barely a metre to spare, then speeds off.","c":0,"k":"s","ps":false},{"t":"What's your first thought?","c":0,"k":"s","ps":false},{"t":"For most of us, it's something short and unprintable about what kind of person that driver must be.","c":0,"k":"s","ps":false},{"t":"Now picture the last time you cut someone off.","c":0,"k":"s","ps":false},{"t":"You probably didn't think, I'm a terrible person.","c":0,"k":"s","ps":false},{"t":"You thought, I didn't see them, or I was about to miss my exit, or I was running late for something important.","c":0,"k":"s","ps":false},{"t":"That gap in how we explain the same behaviour is what this lesson is about.","c":0,"k":"s","ps":true},{"t":"When other people do something wrong, we tend to blame their character.","c":0,"k":"s","ps":false},{"t":"When we do the same thing, we tend to blame the situation.","c":0,"k":"s","ps":false},{"t":"Psychologists call the first half of this the fundamental attribution error.","c":0,"k":"s","ps":false},{"t":"It's our habit of over-explaining other people's behaviour by who they are, and under-explaining it by the circumstances they're in.","c":0,"k":"s","ps":false},{"t":"One of the earliest demonstrations came in 1967, from the American psychologists Edward Jones and Victor Harris.","c":0,"k":"s","ps":true},{"t":"They gave people short essays about Fidel Castro, the leader of Cuba.","c":0,"k":"s","ps":false},{"t":"Some essays praised Castro and some criticised him.","c":0,"k":"s","ps":false},{"t":"Readers were asked what the writer really thought of him.","c":0,"k":"s","ps":false},{"t":"Here's the clever part.","c":0,"k":"s","ps":false},{"t":"Some readers were told the writer had been free to choose which side to argue.","c":0,"k":"s","ps":false},{"t":"Others were told the writer had been assigned a side, like a debater given a topic.","c":0,"k":"s","ps":false},{"t":"You'd expect the second group to shrug and say, well, you can't tell what they believe.","c":0,"k":"s","ps":false},{"t":"They didn't.","c":0,"k":"s","ps":false},{"t":"Even when they knew the side had been assigned, readers still judged that a pro-Castro essay came from someone fairly pro-Castro.","c":0,"k":"s","ps":false},{"t":"They took the words as a window into the writer's character, even when the situation fully explained them.","c":0,"k":"s","ps":false},{"t":"A decade later, in 1977, the Stanford psychologist Lee Ross gave the effect its grand name.","c":0,"k":"s","ps":true},{"t":"He and his colleagues also ran one of its most elegant tests.","c":0,"k":"s","ps":false},{"t":"Pairs of students were randomly assigned to be either a quizmaster or a contestant.","c":0,"k":"s","ps":false},{"t":"The quizmaster made up ten hard general knowledge questions from their own areas of interest, and the contestant tried to answer them.","c":0,"k":"s","ps":false},{"t":"Of course the contestants struggled.","c":0,"k":"s","ps":false},{"t":"The questions came from the quizmaster's own pet topics.","c":0,"k":"s","ps":false},{"t":"Yet when everyone rated how knowledgeable each person was, the contestants and the observers watching rated the quizmasters as clearly smarter.","c":0,"k":"s","ps":false},{"t":"The roles had been handed out at random, and everyone knew it.","c":0,"k":"s","ps":false},{"t":"People still read the situation's advantage as a difference in brains.","c":0,"k":"s","ps":false},{"t":"Why do we do this?","c":0,"k":"s","ps":true},{"t":"One big reason is simply what fills our view.","c":0,"k":"s","ps":false},{"t":"When we watch someone else, the person is the most visible thing in the scene, while the pressures on them are hidden.","c":0,"k":"s","ps":false},{"t":"When we act ourselves, we can't see our own face, but we see every pressure around us.","c":0,"k":"s","ps":false},{"t":"In 1973, the psychologist Michael Storms tested this with video.","c":0,"k":"s","ps":false},{"t":"After a conversation, he showed people a recording shot from the other person's point of view.","c":0,"k":"s","ps":false},{"t":"Seeing themselves from the outside, people explained their own behaviour more in terms of their personality, and observers who saw things through the actor's eyes leaned more on the situation.","c":0,"k":"s","ps":false},{"t":"Change the camera angle, and the explanation changes with it.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll see just how powerful situations can be, in a study involving a parable about helping strangers.","c":0,"k":"s","ps":true},{"t":"Part two. The hurried Samaritans.","c":1,"k":"head","ps":false},{"t":"In 1973, the psychologists John Darley and Daniel Batson ran a study at Princeton Theological Seminary.","c":1,"k":"s","ps":true},{"t":"The participants were students training for the ministry, people you might expect to be especially kind.","c":1,"k":"s","ps":false},{"t":"Each student was asked to prepare a short talk and then walk to another building to deliver it.","c":1,"k":"s","ps":false},{"t":"Some were asked to speak about the parable of the Good Samaritan, the story of a traveller who stops to help a stranger lying injured by the road.","c":1,"k":"s","ps":false},{"t":"Before they set off, some students were told they had plenty of time.","c":1,"k":"s","ps":false},{"t":"Others were told they were already late and needed to hurry.","c":1,"k":"s","ps":false},{"t":"On the way, each student passed a man slumped in a doorway, coughing and groaning.","c":1,"k":"s","ps":true},{"t":"He was part of the study.","c":1,"k":"s","ps":false},{"t":"The question was simple.","c":1,"k":"s","ps":false},{"t":"Who would stop?","c":1,"k":"s","ps":false},{"t":"The biggest factor wasn't personality or religious outlook.","c":1,"k":"s","ps":true},{"t":"It wasn't even the topic of the talk.","c":1,"k":"s","ps":false},{"t":"It was time.","c":1,"k":"s","ps":false},{"t":"Of the students who thought they had time to spare, about six in ten offered help.","c":1,"k":"s","ps":false},{"t":"Of the students who'd been told to hurry, only about one in ten did.","c":1,"k":"s","ps":false},{"t":"Some of the hurrying students, on their way to give a talk about the Good Samaritan, literally stepped over the man.","c":1,"k":"s","ps":false},{"t":"Now imagine you'd walked past and seen one of those students ignore someone in distress.","c":1,"k":"s","ps":true},{"t":"You'd almost certainly have judged them as cold or selfish.","c":1,"k":"s","ps":false},{"t":"You wouldn't have known they'd just been told they were late.","c":1,"k":"s","ps":false},{"t":"That's the fundamental attribution error in action.","c":1,"k":"s","ps":false},{"t":"We see the behaviour clearly, but the situation is usually invisible to us.","c":1,"k":"s","ps":false},{"t":"The effect isn't the same everywhere.","c":1,"k":"s","ps":true},{"t":"In 1994, Michael Morris and Kaiping Peng compared how an English-language American newspaper and a Chinese-language newspaper reported the same two murder cases in the United States.","c":1,"k":"s","ps":false},{"t":"The American coverage leaned more on the killers' personal traits, such as a bad temper or a mental instability.","c":1,"k":"s","ps":false},{"t":"The Chinese-language coverage leaned more on circumstances, such as relationships, pressures and social isolation.","c":1,"k":"s","ps":false},{"t":"Later research suggests people from more collectivist cultures do still make the error, but often a bit less strongly.","c":1,"k":"s","ps":false},{"t":"There's also an honest caveat.","c":1,"k":"s","ps":true},{"t":"The neat idea that we always blame others' character and our own circumstances has been questioned.","c":1,"k":"s","ps":false},{"t":"A large review in 2006 by Bertram Malle found that this mirror-image pattern is weaker and patchier than textbooks once claimed.","c":1,"k":"s","ps":false},{"t":"But the core finding holds up well.","c":1,"k":"s","ps":false},{"t":"When we watch someone else, we routinely underestimate the pressures they're under.","c":1,"k":"s","ps":false},{"t":"So what do we do with that?","c":1,"k":"s","ps":false},{"t":"Part three. Writing the other story.","c":2,"k":"head","ps":false},{"t":"The first habit is the simplest.","c":2,"k":"s","ps":true},{"t":"When someone does something that annoys you, invent at least one situational explanation before you settle on a character judgement.","c":2,"k":"s","ps":false},{"t":"It doesn't have to be true.","c":2,"k":"s","ps":false},{"t":"It just has to be possible.","c":2,"k":"s","ps":false},{"t":"The American writer David Foster Wallace described this beautifully in a graduation speech he gave at Kenyon College in 2005, which later became known as This Is Water.","c":2,"k":"s","ps":true},{"t":"To paraphrase him, he talks about being stuck in traffic and angry at the driver of a huge car who has just cut him off.","c":2,"k":"s","ps":false},{"t":"Then he points out that it's not impossible that the driver is a father rushing a sick or injured child to hospital, and that his hurry is far more urgent than anyone else's.","c":2,"k":"s","ps":false},{"t":"Wallace wasn't saying that's what was really happening.","c":2,"k":"s","ps":false},{"t":"He was saying we get to choose which story we tell, and the default one isn't the only option.","c":2,"k":"s","ps":false},{"t":"The second habit is to ask what would make a reasonable person do this.","c":2,"k":"s","ps":true},{"t":"A colleague misses a deadline.","c":2,"k":"s","ps":false},{"t":"Instead of deciding they're lazy, ask what would have to be true for a decent, capable person to miss it.","c":2,"k":"s","ps":false},{"t":"Maybe they were given conflicting priorities.","c":2,"k":"s","ps":false},{"t":"Maybe they were never told the date had moved.","c":2,"k":"s","ps":false},{"t":"Asking this question often turns a complaint into a conversation, and it's the conversation that fixes the problem.","c":2,"k":"s","ps":false},{"t":"The third habit is to look for patterns rather than moments.","c":2,"k":"s","ps":true},{"t":"Character is real, and some people really are careless or unkind.","c":2,"k":"s","ps":false},{"t":"But one incident tells you very little.","c":2,"k":"s","ps":false},{"t":"A shop assistant who is short with you might be at the end of a ten-hour shift after a customer just abused them.","c":2,"k":"s","ps":false},{"t":"If you see the same behaviour many times, in many different situations, then it's more reasonable to think it says something about the person.","c":2,"k":"s","ps":false},{"t":"And the fourth habit is to turn the lens around.","c":2,"k":"s","ps":true},{"t":"When you catch yourself explaining away your own mistake with your circumstances, pause and ask whether you'd give someone else the same benefit of the doubt.","c":2,"k":"s","ps":false},{"t":"The aim isn't to be harder on yourself.","c":2,"k":"s","ps":false},{"t":"It's to be as fair to others as you already are to you.","c":2,"k":"s","ps":false},{"t":"Let's recap.","c":2,"k":"s","ps":true},{"t":"The fundamental attribution error is our tendency to explain other people's behaviour by their character while underestimating the situation they're in.","c":2,"k":"s","ps":false},{"t":"Studies from quizmasters to hurried seminary students show how much circumstances drive what people do.","c":2,"k":"s","ps":false},{"t":"So before you judge, imagine a situation that could explain it, and wait for a pattern before deciding who someone really is.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In the Good Samaritan study, what mattered most in whether students stopped to help?","c":3,"k":"q","ps":false},{"t":"Answer. Whether they were in a hurry.","c":3,"k":"a","ps":false},{"t":"Question two. In the quizmaster study, who did people rate as more knowledgeable?","c":3,"k":"q","ps":false},{"t":"Answer. The quizmasters, even though the roles were assigned at random.","c":3,"k":"a","ps":false},{"t":"Question three. What's the first habit for avoiding the fundamental attribution error?","c":3,"k":"q","ps":false},{"t":"Answer. Imagine at least one situational explanation before judging someone's character.","c":3,"k":"a","ps":false},{"t":"That's the end of The Fundamental Attribution Error. Nicely done.","c":3,"k":"end","ps":false}]},"blind5":{"chapters":["Nixon's surprise trips","Learning the wrong lessons","Keeping yourself honest"],"at":{"f":[0.3,3.34,6.25,9.29,13.89,16.92,20.95,25.15,33.89,36.16,41.08,46.49,48.41,51.19,54.23,58.37,64.1,65.71,71.71,76.09,80.39,87.25,89.04,92.24,101.81,105.49,109.47,114.59,117.84,120.35,126.16,127.96,133.74,138.97,141.85,143.42,150.91,155.28,160.29,164.43,168.24,175.79,182.89,189.49,190.79,194.3,196.17,199.11,200.92,203.68,207.02,213.13,220.92,226.37,232.41,236.22,239.33,243.92,252.09,254.02,261.32,271.19,277.6,281.5,285.56,289.35,297.21,303.56,305.72,311.19,319.86,321.43,330.01,335.87,340.73,343.6,346.51,349.35,354.14,364.38,368.74,374.99,378.87,390.27,394.61,397.86,403.56,407.11,410.4,413.79,417.32,421.89,426.03,428.28,435.55,438.42,442.18,445.61,454.13,455.83,463.75,465.36,472.96,478.11,488.06,491.74,501.04,506.23,514.84,517.36,525.12,529.38],"m":[0.3,3.42,6.57,9.95,14.88,18.17,22.94,27.65,37.48,40.23,45.64,51.78,53.81,56.87,60.12,64.68,71.19,73.02,79.72,84.73,89.27,96.54,98.49,101.96,112.59,116.89,121.13,126.93,130.44,133.28,139.81,141.74,148.17,153.89,156.87,158.49,166.76,171.85,177.4,182.09,186.38,194.83,202.74,210.29,211.68,215.74,217.62,220.66,222.65,225.86,229.62,236.46,245.27,251.43,258.19,262.3,265.74,271.01,280.34,282.38,290.15,300.94,308.02,312.33,316.74,320.83,329.5,336.68,339.03,345.05,354.66,356.39,365.84,372.52,377.8,380.76,383.89,387.12,392.49,404.15,408.92,415.85,420.16,433.37,438.21,441.7,447.88,451.91,455.58,459.43,463.52,468.62,473.17,475.71,483.59,486.82,491.03,494.8,504.32,506.17,515.01,516.72,525.11,530.73,541.76,545.84,555.47,560.97,570.22,572.65,580.8,585.28]},"dur":{"f":534.6,"m":591.0},"units":[{"t":"Hindsight Bias.","c":-1,"k":"title","ps":false},{"t":"Part one. Nixon's surprise trips.","c":0,"k":"head","ps":false},{"t":"Think back to a big surprise from the last few years.","c":0,"k":"s","ps":true},{"t":"An election result, a sporting upset, a market crash, a friend's breakup.","c":0,"k":"s","ps":false},{"t":"Now ask yourself honestly, did you see it coming?","c":0,"k":"s","ps":false},{"t":"A lot of people will feel a little voice saying, yes, I sort of did.","c":0,"k":"s","ps":false},{"t":"This lesson is about that little voice, and why it's so often wrong.","c":0,"k":"s","ps":false},{"t":"In early 1972, the American president Richard Nixon was about to make historic visits to China and the Soviet Union.","c":0,"k":"s","ps":true},{"t":"Nobody knew quite what would come of them.","c":0,"k":"s","ps":false},{"t":"Two researchers in Israel, Baruch Fischhoff and Ruth Beyth, saw an opportunity.","c":0,"k":"s","ps":false},{"t":"Before the trips, they asked students to estimate the chances of various possible outcomes.","c":0,"k":"s","ps":false},{"t":"Would Nixon meet Chairman Mao?","c":0,"k":"s","ps":false},{"t":"Would the trip end with a major new agreement?","c":0,"k":"s","ps":false},{"t":"Each student put a probability on each event.","c":0,"k":"s","ps":false},{"t":"After the trips were over, the researchers went back to the same students.","c":0,"k":"s","ps":true},{"t":"They asked them to remember, as accurately as they could, the probabilities they had given before.","c":0,"k":"s","ps":false},{"t":"Something odd happened.","c":0,"k":"s","ps":false},{"t":"For events that had actually occurred, students tended to remember giving higher odds than they really had.","c":0,"k":"s","ps":false},{"t":"For events that hadn't occurred, they tended to remember giving lower odds.","c":0,"k":"s","ps":false},{"t":"Their memories had quietly been rewritten to make them look more prescient.","c":0,"k":"s","ps":false},{"t":"Fischhoff and Beyth published the findings in 1975, under a title that sums it up perfectly.","c":0,"k":"s","ps":false},{"t":"I knew it would happen.","c":0,"k":"s","ps":false},{"t":"That same year, Fischhoff ran another clever study.","c":0,"k":"s","ps":true},{"t":"He gave people a short account of a real but little-known conflict from 1814, between British forces and the Gurkhas of Nepal.","c":0,"k":"s","ps":false},{"t":"Different groups were told different endings, or no ending at all.","c":0,"k":"s","ps":false},{"t":"Then everyone was asked how likely each possible outcome had been.","c":0,"k":"s","ps":false},{"t":"Whatever outcome people were told had happened, they rated as the most likely all along.","c":0,"k":"s","ps":false},{"t":"And they didn't realise the ending had shaped their judgement.","c":0,"k":"s","ps":false},{"t":"Fischhoff called this creeping determinism.","c":0,"k":"s","ps":false},{"t":"Once we know how a story ends, it starts to feel as if it could only ever have ended that way.","c":0,"k":"s","ps":false},{"t":"This is hindsight bias.","c":0,"k":"s","ps":true},{"t":"It's the tendency, after something happens, to believe it was more predictable than it really was.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll see why that isn't just a harmless quirk of memory.","c":0,"k":"s","ps":false},{"t":"Part two. Learning the wrong lessons.","c":1,"k":"head","ps":false},{"t":"Why does this happen?","c":1,"k":"s","ps":true},{"t":"The leading explanation is that our minds are built to make sense of things, not to keep a tidy archive of old opinions.","c":1,"k":"s","ps":false},{"t":"When we learn an outcome, we fold it straight into our understanding of the world.","c":1,"k":"s","ps":false},{"t":"Then we search for the causes that led to it, and those causes suddenly look obvious.","c":1,"k":"s","ps":false},{"t":"The warning signs we'd have dismissed at the time now seem to glow.","c":1,"k":"s","ps":false},{"t":"After a relationship ends, friends say the signs were all there.","c":1,"k":"s","ps":false},{"t":"After a share market fall, commentators explain exactly why it had to happen, though very few of them said so the week before.","c":1,"k":"s","ps":false},{"t":"Once you know the ending, it's almost impossible to unknow it, and to remember how foggy things really looked.","c":1,"k":"s","ps":false},{"t":"Researchers Neal Roese and Kathleen Vohs have described hindsight bias as working on three levels.","c":1,"k":"s","ps":true},{"t":"First, memory.","c":1,"k":"s","ps":false},{"t":"We misremember what we thought before, like Nixon's students.","c":1,"k":"s","ps":false},{"t":"Second, inevitability.","c":1,"k":"s","ps":false},{"t":"We come to feel the outcome was bound to happen.","c":1,"k":"s","ps":false},{"t":"And third, foreseeability.","c":1,"k":"s","ps":false},{"t":"We feel that we, or someone else, should have known.","c":1,"k":"s","ps":false},{"t":"That third level is where the real damage is done.","c":1,"k":"s","ps":false},{"t":"Consider a study by Kim Kamin and Jeffrey Rachlinski, published in 1995.","c":1,"k":"s","ps":true},{"t":"They asked people to play the role of a council deciding whether to pay for a flood protection measure to protect a nearby business.","c":1,"k":"s","ps":false},{"t":"One group made the decision looking forward, with only the information available beforehand.","c":1,"k":"s","ps":false},{"t":"About three quarters of them decided the flood risk was low enough that the precaution wasn't needed.","c":1,"k":"s","ps":false},{"t":"Another group heard the same facts, plus one extra detail.","c":1,"k":"s","ps":false},{"t":"A flood had happened, and the business had been damaged.","c":1,"k":"s","ps":false},{"t":"Now more than half judged the council negligent for not taking the precaution.","c":1,"k":"s","ps":false},{"t":"Even when a third group was specifically warned about hindsight bias and told to ignore the outcome, the result barely moved.","c":1,"k":"s","ps":false},{"t":"You can see why this matters.","c":1,"k":"s","ps":true},{"t":"Doctors, pilots, engineers and managers are all judged after the fact by people who know how things turned out.","c":1,"k":"s","ps":false},{"t":"In one study from 1981, Hal Arkes and his colleagues gave doctors the same case history, but told different groups different final diagnoses.","c":1,"k":"s","ps":false},{"t":"Each group thought the diagnosis they'd been given was the one they'd have been most likely to reach themselves.","c":1,"k":"s","ps":false},{"t":"Hindsight bias also warps how we judge our own decisions.","c":1,"k":"s","ps":true},{"t":"The former professional poker player Annie Duke calls this resulting.","c":1,"k":"s","ps":false},{"t":"It's judging the quality of a decision purely by its outcome.","c":1,"k":"s","ps":false},{"t":"In her book Thinking in Bets, she uses an example from the 2015 Super Bowl, the grand final of American football.","c":1,"k":"s","ps":false},{"t":"With seconds left and his team one yard from scoring, the Seattle coach Pete Carroll called a passing play.","c":1,"k":"s","ps":false},{"t":"It was intercepted, and they lost.","c":1,"k":"s","ps":false},{"t":"The next day, many commentators called it one of the worst decisions in the history of the game.","c":1,"k":"s","ps":false},{"t":"Duke argues the call was reasonable given the odds, and that if the pass had been caught, the same people might have praised it as a masterstroke.","c":1,"k":"s","ps":false},{"t":"That's the core problem.","c":1,"k":"s","ps":true},{"t":"If good outcomes make us think every decision was smart, and bad outcomes make us think every decision was foolish, we learn the wrong lessons.","c":1,"k":"s","ps":false},{"t":"We might double down on a lucky gamble, or abandon a sound approach that just had one bad break.","c":1,"k":"s","ps":false},{"t":"So how do you protect yourself from something that rewrites your own memory?","c":1,"k":"s","ps":false},{"t":"Part three. Keeping yourself honest.","c":2,"k":"head","ps":false},{"t":"The most powerful fix is also the simplest.","c":2,"k":"s","ps":true},{"t":"Record your predictions before you know the outcome.","c":2,"k":"s","ps":false},{"t":"If you're driving right now, don't do anything yet, just file this away for later.","c":2,"k":"s","ps":false},{"t":"When you make a significant decision, such as taking a new job, making an investment or choosing a school, take a minute once you're parked to jot down or record a quick voice note.","c":2,"k":"s","ps":false},{"t":"Say what you expect to happen, roughly how confident you are, and why.","c":2,"k":"s","ps":false},{"t":"Months later, you can compare that note with what really happened, and your memory can't quietly edit it.","c":2,"k":"s","ps":false},{"t":"The second habit is to ask how things could have turned out differently.","c":2,"k":"s","ps":true},{"t":"Back in 1977, Paul Slovic and Baruch Fischhoff found that when people were asked to think about how an alternative outcome might have happened, their hindsight bias shrank.","c":2,"k":"s","ps":false},{"t":"So when you hear yourself saying it was obvious, try building the other story.","c":2,"k":"s","ps":false},{"t":"What would have had to happen for the result to go the other way?","c":2,"k":"s","ps":false},{"t":"If you can easily imagine it, the outcome probably wasn't as certain as it now feels.","c":2,"k":"s","ps":false},{"t":"The third habit is to separate the decision from the result.","c":2,"k":"s","ps":true},{"t":"After something goes wrong, ask two different questions.","c":2,"k":"s","ps":false},{"t":"Given what I knew at the time, was it a sensible choice?","c":2,"k":"s","ps":false},{"t":"And was the bad result down to the decision, or down to luck?","c":2,"k":"s","ps":false},{"t":"Sometimes good decisions turn out badly, and bad decisions turn out well.","c":2,"k":"s","ps":false},{"t":"You can only improve if you judge the decision on its own merits.","c":2,"k":"s","ps":false},{"t":"The fourth habit is about kindness.","c":2,"k":"s","ps":true},{"t":"When a friend, a colleague or a family member makes a call that goes wrong, resist the urge to say you should have seen it coming.","c":2,"k":"s","ps":false},{"t":"Ask what they could reasonably have known at the time.","c":2,"k":"s","ps":false},{"t":"Often the honest answer is, not much more than they did.","c":2,"k":"s","ps":false},{"t":"This is the final episode of The Mind's Blind Spots.","c":2,"k":"s","ps":true},{"t":"Across the series, you've met confirmation bias, the sunk cost trap, anchoring, the fundamental attribution error, and now hindsight bias.","c":2,"k":"s","ps":false},{"t":"They share a common thread.","c":2,"k":"s","ps":false},{"t":"Our minds take shortcuts that usually work, but that quietly bend our view of evidence, money, other people and the past.","c":2,"k":"s","ps":false},{"t":"Let's recap this one.","c":2,"k":"s","ps":true},{"t":"Hindsight bias makes past events feel more predictable than they were, rewriting our memories and making us too quick to blame.","c":2,"k":"s","ps":false},{"t":"It leads us to judge decisions by their outcomes, which teaches us the wrong lessons.","c":2,"k":"s","ps":false},{"t":"To counter it, record your predictions before you know the result, imagine how things could have gone differently, and judge the decision separately from the luck.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In the Nixon study, how did students misremember their earlier predictions?","c":3,"k":"q","ps":false},{"t":"Answer. They remembered giving higher odds to events that actually happened.","c":3,"k":"a","ps":false},{"t":"Question two. What does Annie Duke call judging a decision purely by its outcome?","c":3,"k":"q","ps":false},{"t":"Answer. Resulting.","c":3,"k":"a","ps":false},{"t":"Question three. What's the most powerful fix for hindsight bias?","c":3,"k":"q","ps":false},{"t":"Answer. Record your predictions before you know the outcome.","c":3,"k":"a","ps":false},{"t":"That's the end of Hindsight Bias. Thanks for listening to the whole series.","c":3,"k":"end","ps":false}]},"confused":{"chapters":["Affect or effect","Fewer or less","Three more quick pairs"],"at":{"f":[0.3,3.72,6.38,10.26,15.26,21.29,24.42,27.0,30.26,31.73,34.56,37.46,39.84,44.63,47.74,49.27,52.43,55.31,57.6,61.29,64.55,65.53,68.54,72.17,74.94,78.26,80.68,86.63,90.82,93.66,97.47,100.97,106.0,110.68,114.69,121.05,124.66,128.96,131.1,135.15,136.51,139.42,141.15,143.93,145.34,147.76,152.18,155.54,157.98,162.07,163.44,166.15,168.41,170.76,174.62,176.77,179.7,182.65,186.25,188.59,192.46,195.27,198.19,200.18,204.05,209.92,218.13,219.87,223.97,225.74,228.54,235.49,241.77,247.33,252.63,257.24,264.17,267.86,272.58,276.45,278.12,281.87,286.52,289.23,291.96,297.1,302.1,303.56,309.09,313.08,319.31,320.57,322.24,324.33,327.71,330.48,332.84,334.53,340.83,346.36,355.15,358.04,362.84,367.98,374.38,376.89,382.38,384.33,387.14,391.16,394.28,399.22,404.22,409.15,414.86,419.82,423.92,427.24,429.49,433.17,438.09,440.62,446.45,450.81,454.59,458.23,463.03,468.09,475.76,479.44,486.59,490.91,499.03,505.41,513.51,517.62],"m":[0.3,3.92,6.56,10.8,16.33,23.02,26.55,29.4,33.03,34.58,37.57,40.67,43.42,48.69,52.14,53.79,57.25,60.53,63.01,66.99,70.56,71.63,74.88,78.71,81.63,85.5,88.3,95.02,99.76,102.87,107.16,110.96,116.61,121.79,126.37,133.16,137.17,141.91,144.28,148.8,150.24,153.39,155.32,158.48,159.98,162.72,167.7,171.4,173.89,178.54,179.99,182.82,185.23,187.78,192.35,194.85,197.98,201.08,205.19,207.81,212.12,215.18,218.16,220.43,224.64,231.37,240.45,242.3,246.81,248.92,252.1,259.85,267.09,273.13,278.99,284.19,291.74,295.98,301.32,305.41,307.19,311.33,316.18,319.09,322.05,327.31,332.41,334.12,340.37,344.71,351.5,352.88,354.72,356.97,360.84,363.98,366.56,368.34,375.02,381.07,390.63,393.77,398.5,403.68,410.56,413.31,419.22,421.33,424.28,428.79,432.37,437.71,443.09,448.59,454.99,460.44,464.87,468.69,471.07,475.21,480.58,483.37,490.0,494.81,499.05,503.17,508.33,513.8,522.2,526.28,533.83,538.29,546.7,553.63,562.28,566.59]},"dur":{"f":525.3,"m":575.0},"units":[{"t":"Commonly Confused Words.","c":-1,"k":"title","ps":false},{"t":"Part one. Affect or effect.","c":0,"k":"head","ps":false},{"t":"Some pairs of English words are almost designed to trip us up.","c":0,"k":"s","ps":true},{"t":"They sound alike, or nearly alike, and they live in the same kinds of sentences.","c":0,"k":"s","ps":false},{"t":"In this lesson, we'll untangle five of the most common pairs, with a simple memory trick for each.","c":0,"k":"s","ps":false},{"t":"If you're driving, there's no need to picture the letters.","c":0,"k":"s","ps":false},{"t":"Just listen, and the tricks will do the work.","c":0,"k":"s","ps":false},{"t":"Let's start with the pair that catches out nearly everyone.","c":0,"k":"s","ps":false},{"t":"Affect and effect.","c":0,"k":"s","ps":false},{"t":"Affect is spelled A, F, F, E, C, T.","c":0,"k":"s","ps":false},{"t":"Effect is spelled E, F, F, E, C, T.","c":0,"k":"s","ps":false},{"t":"Here they are in one everyday sentence.","c":0,"k":"s","ps":false},{"t":"The wet weather will affect the footy tonight, and the effect could be a very muddy game.","c":0,"k":"s","ps":false},{"t":"In most everyday sentences, affect is a verb.","c":0,"k":"s","ps":false},{"t":"It's something you do.","c":0,"k":"s","ps":false},{"t":"To affect something means to influence it or change it.","c":0,"k":"s","ps":false},{"t":"Effect, on the other hand, is usually a noun.","c":0,"k":"s","ps":false},{"t":"It's a thing, the result of a change.","c":0,"k":"s","ps":false},{"t":"So the rain affects the game, and the muddy pitch is the effect.","c":0,"k":"s","ps":false},{"t":"There's a popular memory trick for this, and it's a bird.","c":0,"k":"s","ps":false},{"t":"RAVEN.","c":0,"k":"s","ps":false},{"t":"Remember, Affect is a Verb, Effect is a Noun.","c":0,"k":"s","ps":false},{"t":"Here's a second trick that some people find even easier.","c":0,"k":"s","ps":false},{"t":"A is for action, and affect is the action.","c":0,"k":"s","ps":false},{"t":"E is for end result, and effect is the end result.","c":0,"k":"s","ps":false},{"t":"And here's a quick test you can do in your head.","c":0,"k":"s","ps":false},{"t":"If you can put the word the in front of it, as in, the effect, you almost certainly want effect with an E.","c":0,"k":"s","ps":false},{"t":"If you can swap in the word influence, you probably want affect with an A.","c":0,"k":"s","ps":false},{"t":"Now, English being English, there are exceptions.","c":0,"k":"s","ps":false},{"t":"Effect can sometimes be a verb, meaning to bring something about.","c":0,"k":"s","ps":false},{"t":"If a new manager effects change, she makes change happen.","c":0,"k":"s","ps":false},{"t":"If a new manager affects change, she influences a change that's already underway.","c":0,"k":"s","ps":false},{"t":"You'll mostly see that in formal writing, and it's worth knowing so it doesn't throw you.","c":0,"k":"s","ps":false},{"t":"Affect can sometimes be a noun too, but mainly in psychology.","c":0,"k":"s","ps":false},{"t":"Doctors and psychologists talk about a person's affect, meaning the emotion they show on the outside.","c":0,"k":"s","ps":false},{"t":"In that case it's said with the stress at the front, AFF-ect.","c":0,"k":"s","ps":false},{"t":"For everyday life, though, RAVEN will get you through almost every time.","c":0,"k":"s","ps":false},{"t":"Let's try two quick ones in your head.","c":0,"k":"s","ps":false},{"t":"In each sentence, I'll say the word blank where the missing word goes.","c":0,"k":"s","ps":false},{"t":"First sentence.","c":0,"k":"s","ps":false},{"t":"Her new shift pattern had a big blank on her sleep.","c":0,"k":"s","ps":false},{"t":"Which word fills the blank?","c":0,"k":"s","ps":false},{"t":"It's a thing, a result, so it's effect with an E.","c":0,"k":"s","ps":false},{"t":"Second sentence.","c":0,"k":"s","ps":false},{"t":"The long commute started to blank his mood.","c":0,"k":"s","ps":false},{"t":"This time it's an action, something being influenced, so it's affect with an A.","c":0,"k":"s","ps":false},{"t":"Easy once you've got the bird on your side.","c":0,"k":"s","ps":false},{"t":"Part two. Fewer or less.","c":1,"k":"head","ps":false},{"t":"Our second pair appears on supermarket signs all over the world.","c":1,"k":"s","ps":true},{"t":"Fewer and less.","c":1,"k":"s","ps":false},{"t":"Fewer is spelled F, E, W, E, R.","c":1,"k":"s","ps":false},{"t":"Less is spelled L, E, S, S.","c":1,"k":"s","ps":false},{"t":"Here's an example that uses both.","c":1,"k":"s","ps":false},{"t":"There were fewer cars on the road this morning, so there was less traffic.","c":1,"k":"s","ps":false},{"t":"The traditional rule goes like this.","c":1,"k":"s","ps":false},{"t":"Use fewer for things you can count one by one.","c":1,"k":"s","ps":false},{"t":"Fewer cars, fewer people, fewer emails.","c":1,"k":"s","ps":false},{"t":"Use less for things you measure as an amount, rather than count.","c":1,"k":"s","ps":false},{"t":"Less traffic, less water, less noise.","c":1,"k":"s","ps":false},{"t":"A handy trick is to ask yourself, could I put a number in front of it?","c":1,"k":"s","ps":false},{"t":"You can say three cars, so it's fewer cars.","c":1,"k":"s","ps":false},{"t":"You can't say three traffics, so it's less traffic.","c":1,"k":"s","ps":false},{"t":"Here's the classic battleground.","c":1,"k":"s","ps":false},{"t":"That sign at the express checkout that says ten items or less.","c":1,"k":"s","ps":false},{"t":"Strictly by the traditional rule, it should be ten items or fewer, because items can be counted.","c":1,"k":"s","ps":false},{"t":"In 2008, the British supermarket chain Tesco changed its signs after complaints from a group called the Plain English Campaign.","c":1,"k":"s","ps":false},{"t":"Their solution was clever.","c":1,"k":"s","ps":false},{"t":"They sidestepped the whole argument by writing, up to ten items.","c":1,"k":"s","ps":false},{"t":"But here's something interesting.","c":1,"k":"s","ps":false},{"t":"The rule itself is younger than you might think.","c":1,"k":"s","ps":false},{"t":"English speakers have used less with countable things since the time of King Alfred, well over a thousand years ago.","c":1,"k":"s","ps":false},{"t":"The fewer rule is usually traced to a writer called Robert Baker, in 1770.","c":1,"k":"s","ps":false},{"t":"In a book on English usage, he said that fewer would do better than less when speaking of a number.","c":1,"k":"s","ps":false},{"t":"He was only giving his personal preference, but later grammar books turned it into a firm rule.","c":1,"k":"s","ps":false},{"t":"There are also some sensible exceptions that even careful writers accept.","c":1,"k":"s","ps":false},{"t":"We use less with money, time, distance and weight, because we think of them as amounts rather than separate units.","c":1,"k":"s","ps":false},{"t":"So it's less than $20, not fewer than $20.","c":1,"k":"s","ps":false},{"t":"It's less than five kilometres to the shops, and less than two hours to Canberra.","c":1,"k":"s","ps":false},{"t":"And it's perfectly natural to say one less thing to worry about.","c":1,"k":"s","ps":false},{"t":"The takeaway is simple.","c":1,"k":"s","ps":false},{"t":"If you can count them individually, fewer is the safe choice.","c":1,"k":"s","ps":false},{"t":"If it's an amount, or money, time or distance, reach for less.","c":1,"k":"s","ps":false},{"t":"Part three. Three more quick pairs.","c":2,"k":"head","ps":false},{"t":"Our third pair is complement and compliment.","c":2,"k":"s","ps":true},{"t":"Complement with an E is spelled C, O, M, P, L, E, M, E, N, T.","c":2,"k":"s","ps":false},{"t":"Compliment with an I is spelled C, O, M, P, L, I, M, E, N, T.","c":2,"k":"s","ps":false},{"t":"Here they are together.","c":2,"k":"s","ps":false},{"t":"The waiter paid me a compliment on my choice of wine, and said it would complement the lamb perfectly.","c":2,"k":"s","ps":false},{"t":"Complement with an E means to complete something, or go well with it.","c":2,"k":"s","ps":false},{"t":"Notice that complement and complete share the same first six letters, C, O, M, P, L, E.","c":2,"k":"s","ps":false},{"t":"That's your trick.","c":2,"k":"s","ps":false},{"t":"A complement completes.","c":2,"k":"s","ps":false},{"t":"A good sauce complements a dish.","c":2,"k":"s","ps":false},{"t":"A new team member might complement the skills already there.","c":2,"k":"s","ps":false},{"t":"Compliment with an I is a kind remark.","c":2,"k":"s","ps":false},{"t":"The trick here is, I like compliments.","c":2,"k":"s","ps":false},{"t":"There's one small twist.","c":2,"k":"s","ps":false},{"t":"Complimentary with an I also means free, as in complimentary tea and coffee in the waiting room.","c":2,"k":"s","ps":false},{"t":"That's because a free gift was originally a kind of politeness, a compliment from the business.","c":2,"k":"s","ps":false},{"t":"Complementary with an E means things that go together, like complementary colours, or complementary medicine alongside regular treatment.","c":2,"k":"s","ps":false},{"t":"Our fourth pair is stationary and stationery.","c":2,"k":"s","ps":false},{"t":"Stationary with an A is spelled S, T, A, T, I, O, N, A, R, Y.","c":2,"k":"s","ps":false},{"t":"Stationery with an E is spelled S, T, A, T, I, O, N, E, R, Y.","c":2,"k":"s","ps":false},{"t":"For example, the delivery truck was stationary outside the office, unloading boxes of stationery.","c":2,"k":"s","ps":false},{"t":"Stationary with an A means not moving.","c":2,"k":"s","ps":false},{"t":"Stationery with an E means writing materials, like paper, pens and envelopes.","c":2,"k":"s","ps":false},{"t":"The trick is almost too easy.","c":2,"k":"s","ps":false},{"t":"Stationery with an E is for envelopes.","c":2,"k":"s","ps":false},{"t":"Stationary with an A is for a car that's parked, or at a standstill.","c":2,"k":"s","ps":false},{"t":"Our fifth and final pair is principal and principle.","c":2,"k":"s","ps":false},{"t":"Principal ending in A, L is spelled P, R, I, N, C, I, P, A, L.","c":2,"k":"s","ps":false},{"t":"Principle ending in L, E is spelled P, R, I, N, C, I, P, L, E.","c":2,"k":"s","ps":false},{"t":"For example, the school principal explained the principle behind the new phone rules.","c":2,"k":"s","ps":false},{"t":"Principal with A, L can mean the head of a school, or it can mean main, as in the principal reason.","c":2,"k":"s","ps":false},{"t":"In finance, it also means the original amount you borrowed, before interest.","c":2,"k":"s","ps":false},{"t":"Principle with L, E means a rule, a basic truth or a belief.","c":2,"k":"s","ps":false},{"t":"You might refuse to do something as a matter of principle.","c":2,"k":"s","ps":false},{"t":"Two tricks work nicely together here.","c":2,"k":"s","ps":false},{"t":"First, the principal is your pal, and pal ends in A, L.","c":2,"k":"s","ps":false},{"t":"Second, a principle is a rule, and both principle and rule end in L, E.","c":2,"k":"s","ps":false},{"t":"So why do these pairs cause so much trouble?","c":2,"k":"s","ps":false},{"t":"Mostly because we learn words by ear first, and by ear these pairs sound almost identical.","c":2,"k":"s","ps":false},{"t":"Spellcheck won't save you either, because both spellings are real words.","c":2,"k":"s","ps":false},{"t":"That's exactly why a short, silly memory trick works so well.","c":2,"k":"s","ps":false},{"t":"It gives your brain something to hold on to at the moment you're writing.","c":2,"k":"s","ps":false},{"t":"To sum up, affect is usually the action and effect is usually the result.","c":2,"k":"s","ps":false},{"t":"Use fewer for things you can count and less for amounts, money, time and distance.","c":2,"k":"s","ps":false},{"t":"And remember that a complement completes, stationery with an E is for envelopes, and the principal is your pal.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What does the memory trick RAVEN stand for?","c":3,"k":"q","ps":false},{"t":"Answer. Remember, affect is a verb, effect is a noun.","c":3,"k":"a","ps":false},{"t":"Question two. Which word goes with things you can count, fewer or less?","c":3,"k":"q","ps":false},{"t":"Answer. Fewer. Fewer cars, fewer people. Less goes with amounts, like less traffic.","c":3,"k":"a","ps":false},{"t":"Question three. How do you remember which stationery means paper and pens?","c":3,"k":"q","ps":false},{"t":"Answer. Stationery with an E is for envelopes.","c":3,"k":"a","ps":false},{"t":"That's the end of Commonly Confused Words. Nicely done. You'll never look at a supermarket sign the same way.","c":3,"k":"end","ps":false}]},"decide":{"chapters":["One-way and two-way doors","When the pressure's on","Testing a big decision"],"at":{"f":[0.3,3.72,6.81,9.35,13.4,19.74,24.85,27.22,28.68,35.15,48.82,51.65,53.8,55.69,57.9,61.69,63.79,69.55,75.58,78.0,84.5,86.2,88.47,92.43,97.12,98.87,101.54,107.98,111.89,113.15,115.5,120.35,123.63,129.08,137.9,140.11,144.09,149.04,154.2,156.86,159.48,161.12,165.8,177.17,182.95,188.47,190.92,193.0,195.58,198.38,200.45,202.44,208.87,215.75,221.06,225.33,228.48,232.64,242.68,245.8,249.51,259.26,262.93,270.66,276.55,281.75,288.46,292.93,294.98,300.43,305.02,307.08,309.97,311.8,314.24,316.94,329.96,335.2,339.28,345.91,351.19,354.06,360.38,368.9,370.83,373.7,375.01,376.43,380.93,388.79,395.55,397.65,401.36,405.3,409.38,411.43,415.54,417.68,420.69,423.48,431.31,439.61,445.02,454.47,456.37,459.8,462.69,465.49,468.89,472.01,475.27,479.57,480.84,488.84,493.57,499.42,503.1,509.71,514.56,522.47,526.39,533.41,538.59],"m":[0.3,3.9,7.13,10.13,14.67,21.54,27.23,29.89,31.56,38.71,53.74,56.89,59.29,61.29,63.6,68.06,70.32,76.84,83.25,85.98,93.22,95.11,97.7,101.96,107.3,109.26,111.93,119.0,123.3,124.65,127.29,132.5,135.92,141.74,151.54,154.05,158.42,164.09,169.92,172.66,175.37,177.09,182.36,194.8,201.22,207.18,209.91,212.19,214.99,218.08,220.32,222.48,229.23,236.98,243.03,247.78,251.22,255.75,266.82,270.22,274.28,284.93,289.07,297.43,303.79,309.29,316.74,321.76,323.96,329.97,335.18,337.48,340.71,342.6,345.33,348.43,362.54,368.44,373.06,380.55,386.36,389.5,396.73,406.05,408.1,411.37,412.76,414.25,419.21,427.91,435.07,437.43,441.41,445.76,450.46,452.72,457.41,459.8,463.38,466.57,475.19,484.27,490.12,500.85,502.9,506.74,510.02,512.94,516.63,520.11,523.81,528.86,530.23,538.83,544.11,550.43,554.51,561.53,566.87,575.22,579.36,586.68,592.33]},"dur":{"f":543.8,"m":598.1},"units":[{"t":"Deciding Well Under Pressure.","c":-1,"k":"title","ps":false},{"t":"Part one. One-way and two-way doors.","c":0,"k":"head","ps":false},{"t":"Every day you make hundreds of decisions.","c":0,"k":"s","ps":true},{"t":"Most are tiny, like which lane to take or what to have for lunch.","c":0,"k":"s","ps":false},{"t":"A few are big, like a job offer, a move interstate, or a car you'll be paying off for five years.","c":0,"k":"s","ps":false},{"t":"This lesson gives you a small toolkit for both, especially when you're under pressure.","c":0,"k":"s","ps":false},{"t":"The first tool is a single question.","c":0,"k":"s","ps":true},{"t":"Can I undo this?","c":0,"k":"s","ps":false},{"t":"Jeff Bezos, the founder of Amazon, put it memorably in his 2015 letter to shareholders.","c":0,"k":"s","ps":false},{"t":"He wrote that some decisions are consequential and irreversible or nearly irreversible, one-way doors, and these decisions must be made methodically, carefully, slowly, with great deliberation and consultation.","c":0,"k":"s","ps":false},{"t":"But most decisions aren't like that, he went on.","c":0,"k":"s","ps":false},{"t":"They are changeable, reversible.","c":0,"k":"s","ps":false},{"t":"They're two-way doors.","c":0,"k":"s","ps":false},{"t":"Here's the part people often miss.","c":0,"k":"s","ps":true},{"t":"Bezos wasn't mainly warning about rushing the big decisions.","c":0,"k":"s","ps":false},{"t":"He was warning about the opposite.","c":0,"k":"s","ps":false},{"t":"Many people, and many organisations, treat every two-way door as if it were a one-way door.","c":0,"k":"s","ps":false},{"t":"They agonise over small, fixable choices, and the result is slowness and missed chances.","c":0,"k":"s","ps":false},{"t":"So try sorting your decisions this way.","c":0,"k":"s","ps":true},{"t":"Trying a new gym, switching phone plans, testing a different route to work, rearranging the lounge room.","c":0,"k":"s","ps":false},{"t":"These are two-way doors.","c":0,"k":"s","ps":false},{"t":"If it doesn't work, you walk back through.","c":0,"k":"s","ps":false},{"t":"For these, decide quickly, learn from what happens, and adjust.","c":0,"k":"s","ps":false},{"t":"Selling a house, signing a long contract, saying something that can't be unsaid.","c":0,"k":"s","ps":false},{"t":"These are one-way doors.","c":0,"k":"s","ps":false},{"t":"For these, slow down on purpose.","c":0,"k":"s","ps":false},{"t":"The second tool comes from the economist and psychologist Herbert Simon, who later won a Nobel Prize.","c":0,"k":"s","ps":true},{"t":"In 1956 he coined a word that's worth knowing.","c":0,"k":"s","ps":false},{"t":"Satisficing.","c":0,"k":"s","ps":false},{"t":"It's a blend of satisfy and suffice.","c":0,"k":"s","ps":false},{"t":"A satisficer sets a standard of good enough, and picks the first option that meets it.","c":0,"k":"s","ps":false},{"t":"A maximiser keeps searching for the very best.","c":0,"k":"s","ps":false},{"t":"The psychologist Barry Schwartz and his colleagues have studied how these two styles play out.","c":0,"k":"s","ps":true},{"t":"In one study of university students looking for their first jobs, the maximisers ended up with starting salaries about twenty per cent higher.","c":0,"k":"s","ps":false},{"t":"But they felt worse about their jobs.","c":0,"k":"s","ps":false},{"t":"They were more stressed, more anxious and less satisfied with the outcome.","c":0,"k":"s","ps":false},{"t":"Searching for the best can win you a bit more, and still leave you feeling you've missed out.","c":0,"k":"s","ps":false},{"t":"So for everyday two-way doors, decide what good enough looks like before you start looking.","c":0,"k":"s","ps":true},{"t":"Then stop when you find it.","c":0,"k":"s","ps":false},{"t":"Part two. When the pressure's on.","c":1,"k":"head","ps":false},{"t":"Now for the hard part.","c":1,"k":"s","ps":true},{"t":"What happens to your thinking when the clock is ticking, or your heart is pounding?","c":1,"k":"s","ps":false},{"t":"In 1987, the Israeli psychologist Giora Keinan ran a study in which some people believed they might receive mild electric shocks while solving decision problems.","c":1,"k":"s","ps":true},{"t":"Under that stress, people were more likely to settle on an answer before they'd looked at all the options.","c":1,"k":"s","ps":false},{"t":"They also scanned the options less systematically, jumping around rather than working through them.","c":1,"k":"s","ps":false},{"t":"Stress doesn't just make us feel rattled.","c":1,"k":"s","ps":false},{"t":"It narrows what we look at.","c":1,"k":"s","ps":false},{"t":"That narrowing shows up in a quieter way too.","c":1,"k":"s","ps":true},{"t":"We often frame choices as yes or no.","c":1,"k":"s","ps":false},{"t":"Should I take this job or not?","c":1,"k":"s","ps":false},{"t":"Should we buy this house or not?","c":1,"k":"s","ps":false},{"t":"The management researcher Paul Nutt studied well over a hundred real decisions made in organisations.","c":1,"k":"s","ps":false},{"t":"When leaders only weighed a single option, whether or not, about half of those decisions were later judged failures.","c":1,"k":"s","ps":false},{"t":"When they compared two or more genuine alternatives, the failure rate dropped to about a third.","c":1,"k":"s","ps":false},{"t":"So one easy habit under pressure is to ask, what else could I do here?","c":1,"k":"s","ps":false},{"t":"Even one extra option widens the view.","c":1,"k":"s","ps":false},{"t":"And yet some people make excellent decisions under enormous pressure.","c":1,"k":"s","ps":true},{"t":"In the 1980s, the American psychologist Gary Klein studied fireground commanders, the officers who make life and death calls at burning buildings.","c":1,"k":"s","ps":false},{"t":"He expected them to be comparing options quickly.","c":1,"k":"s","ps":false},{"t":"Instead, most of the time they weren't comparing options at all.","c":1,"k":"s","ps":false},{"t":"They recognised the situation from experience, pictured the first sensible course of action playing out in their heads, and went with it unless they spotted a problem.","c":1,"k":"s","ps":false},{"t":"Klein called this recognition-primed decision making.","c":1,"k":"s","ps":false},{"t":"The lesson from Klein is that fast, confident decisions work well when you have real experience in that kind of situation.","c":1,"k":"s","ps":true},{"t":"An experienced nurse, mechanic or parent often knows what to do before they can explain why.","c":1,"k":"s","ps":false},{"t":"Your gut is trustworthy in areas where you've had lots of practice and quick feedback.","c":1,"k":"s","ps":false},{"t":"It's much less trustworthy in unfamiliar territory, like a first investment or a big career change.","c":1,"k":"s","ps":false},{"t":"So when you feel pressure on an unfamiliar decision, the first move is simple.","c":1,"k":"s","ps":true},{"t":"Check whether the deadline is real.","c":1,"k":"s","ps":false},{"t":"A salesperson saying the deal ends today is often creating pressure, not reporting it.","c":1,"k":"s","ps":false},{"t":"If the time pressure is genuine, take one slow breath out before you choose.","c":1,"k":"s","ps":false},{"t":"If it isn't, give yourself time.","c":1,"k":"s","ps":false},{"t":"Sleeping on a big decision is not weakness.","c":1,"k":"s","ps":false},{"t":"It's good practice.","c":1,"k":"s","ps":false},{"t":"The next tool is surprisingly powerful.","c":1,"k":"s","ps":true},{"t":"Ask yourself, what would I tell a friend to do?","c":1,"k":"s","ps":false},{"t":"In 2014, the psychologists Igor Grossmann and Ethan Kross studied what they called Solomon's paradox, named after the wise King Solomon, who was famously poor at running his own life.","c":1,"k":"s","ps":false},{"t":"People reasoned more wisely about a friend's relationship problem than about their own.","c":1,"k":"s","ps":false},{"t":"They were more open to other viewpoints and more aware of what they didn't know.","c":1,"k":"s","ps":false},{"t":"But when people imagined their own problem from a distance, as if it were happening to someone else, the gap disappeared.","c":1,"k":"s","ps":false},{"t":"Stepping outside yourself, even in your imagination, makes you wiser.","c":1,"k":"s","ps":false},{"t":"Part three. Testing a big decision.","c":2,"k":"head","ps":false},{"t":"For one-way doors, here are two final tests you can run in your head, right now, on the way to work.","c":2,"k":"s","ps":true},{"t":"The first is the ten-ten-ten test, popularised by the business writer Suzy Welch, who wrote a whole book about it in 2009.","c":2,"k":"s","ps":true},{"t":"Ask yourself three questions.","c":2,"k":"s","ps":false},{"t":"How will I feel about this decision in ten minutes?","c":2,"k":"s","ps":false},{"t":"In ten months?","c":2,"k":"s","ps":false},{"t":"And in ten years?","c":2,"k":"s","ps":false},{"t":"It works because strong feelings in the moment tend to crowd out the long view.","c":2,"k":"s","ps":false},{"t":"Saying no to a friend's request might feel awful in ten minutes, barely matter in ten months, and be forgotten in ten years.","c":2,"k":"s","ps":false},{"t":"Quitting a secure job might feel terrifying in ten minutes and still turn out to be the best move you ever made.","c":2,"k":"s","ps":false},{"t":"The test doesn't give you the answer.","c":2,"k":"s","ps":false},{"t":"It just puts all three time frames on the table at once.","c":2,"k":"s","ps":false},{"t":"The second is the premortem, another idea from Gary Klein.","c":2,"k":"s","ps":true},{"t":"You've probably heard of a post-mortem, where you look back on what went wrong.","c":2,"k":"s","ps":false},{"t":"A premortem does it in advance.","c":2,"k":"s","ps":false},{"t":"Imagine it's a year from now and your decision has turned out badly.","c":2,"k":"s","ps":false},{"t":"Then ask yourself, what went wrong?","c":2,"k":"s","ps":false},{"t":"Give yourself a moment to come up with the story.","c":2,"k":"s","ps":false},{"t":"This works better than asking, what could go wrong?","c":2,"k":"s","ps":true},{"t":"Klein pointed to earlier research by Deborah Mitchell, Jay Russo and Nancy Pennington, published in 1989.","c":2,"k":"s","ps":false},{"t":"They found that imagining an event has already happened increased people's ability to come up with reasons for it by about thirty per cent.","c":2,"k":"s","ps":false},{"t":"Imagining failure as a fact frees your mind to see risks you'd been quietly ignoring.","c":2,"k":"s","ps":false},{"t":"If you're planning a renovation, a premortem might surface the dodgy quote, the council approval you forgot, or the budget with no room for surprises.","c":2,"k":"s","ps":false},{"t":"Let's try a quick one together.","c":2,"k":"s","ps":true},{"t":"If you're driving, just listen along and think it over later.","c":2,"k":"s","ps":false},{"t":"Think of a decision you're weighing up at the moment.","c":2,"k":"s","ps":false},{"t":"First, is it a one-way or a two-way door?","c":2,"k":"s","ps":false},{"t":"If it's two-way, what's good enough, and could you simply try it?","c":2,"k":"s","ps":false},{"t":"If it's one-way, what would you tell a friend in your shoes?","c":2,"k":"s","ps":false},{"t":"How will it look in ten minutes, ten months and ten years?","c":2,"k":"s","ps":false},{"t":"And if it all goes wrong a year from now, what's the most likely reason?","c":2,"k":"s","ps":false},{"t":"Let's recap.","c":2,"k":"s","ps":true},{"t":"Sort decisions into two-way doors, which you can make quickly and adjust, and one-way doors, which deserve slow and careful thought.","c":2,"k":"s","ps":false},{"t":"Under pressure, check whether the deadline is real, and ask what you'd tell a friend.","c":2,"k":"s","ps":false},{"t":"For the big ones, run the ten-ten-ten test and a quick premortem before you commit.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What is a two-way door decision?","c":3,"k":"q","ps":false},{"t":"Answer. One you can reverse, so you can decide quickly and adjust.","c":3,"k":"a","ps":false},{"t":"Question two. What are the three time frames in the ten-ten-ten test?","c":3,"k":"q","ps":false},{"t":"Answer. Ten minutes, ten months and ten years.","c":3,"k":"a","ps":false},{"t":"Question three. In a premortem, what do you imagine?","c":3,"k":"q","ps":false},{"t":"Answer. That your decision has already failed, and then you explain why.","c":3,"k":"a","ps":false},{"t":"That's the end of Deciding Well Under Pressure. Good call finishing that one.","c":3,"k":"end","ps":false}]},"drift":{"chapters":["Nice, silly and the long road","Worse and better","Broader, narrower and literally"],"at":{"f":[0.3,3.75,7.05,11.02,12.8,19.1,22.68,25.44,26.41,27.87,30.96,34.87,39.4,44.14,46.82,49.89,52.95,59.64,63.67,69.92,75.08,79.97,86.48,89.43,90.34,92.11,96.63,100.88,105.18,108.86,112.42,113.65,120.4,122.53,125.56,128.49,131.57,137.71,139.23,142.61,146.83,151.52,156.33,159.86,164.39,166.75,172.99,176.77,179.24,183.94,184.9,186.58,190.31,193.83,199.28,201.34,203.43,205.63,211.1,213.76,218.87,223.6,227.17,232.73,234.7,235.77,238.43,242.08,248.29,250.63,258.9,263.2,266.31,269.16,273.31,274.46,277.0,283.49,288.99,294.47,297.22,300.95,305.29,308.94,314.83,317.97,318.92,320.62,325.68,329.5,333.99,337.55,345.47,351.34,355.74,364.67,368.04,370.38,373.17,375.78,377.46,378.33,379.97,385.07,390.4,393.91,396.96,401.02,403.52,405.84,414.09,416.13,419.01,426.12,430.15,431.07,432.56,436.49,444.13,455.45,458.69,466.69,469.68,470.7,472.82,476.9,479.57,483.53,488.67,491.45,499.01,503.48,506.87,512.15,517.08,521.95,524.04,527.52,528.57,531.19,536.1,540.67,547.25,554.69,560.76,564.12,568.86,574.94,577.89,585.26,590.21,600.16,601.91,606.85,608.85,610.6,612.82,618.37,622.43,627.73,629.47,634.87,639.9,643.99,646.72,653.88,660.11,667.76,672.46,676.6,679.68,688.3,692.31,699.23,705.23,710.12,715.32,719.0,728.27,731.3,741.25,743.91,753.3,757.79],"m":[0.3,3.84,7.28,11.65,13.6,20.59,24.73,27.71,28.74,30.26,33.68,38.41,43.34,48.46,51.45,54.85,58.02,65.0,69.43,76.17,81.79,87.09,94.42,97.7,98.68,100.46,105.57,110.18,114.82,119.03,122.83,124.17,131.67,134.03,137.05,140.21,143.39,150.07,151.69,155.59,160.42,165.7,171.18,175.08,180.05,182.63,189.45,193.58,196.13,201.22,202.28,204.25,208.44,212.34,218.31,220.52,222.76,225.05,231.29,234.26,239.74,244.84,248.63,254.73,257.0,258.11,260.68,264.79,271.8,274.25,283.22,287.84,291.33,294.35,298.92,300.17,302.95,310.17,316.31,322.18,325.12,329.35,334.17,338.22,344.85,348.27,349.22,351.06,356.46,360.62,365.48,369.21,377.91,384.5,389.34,399.11,402.72,405.19,408.31,411.19,413.03,413.97,415.61,421.25,427.17,431.01,434.31,438.99,441.67,444.11,453.29,455.45,458.77,466.85,471.36,472.36,473.99,478.26,486.7,499.46,503.03,511.92,515.21,516.36,518.62,523.23,526.22,530.82,536.51,539.97,548.18,553.08,556.96,562.6,568.06,573.65,575.96,579.78,580.91,583.81,589.14,594.15,601.52,609.87,616.65,620.2,625.47,632.11,635.4,643.62,649.2,659.92,661.83,667.2,669.39,671.37,673.67,679.93,684.4,690.29,692.17,698.14,703.75,708.1,711.17,719.18,726.19,734.67,739.62,744.44,747.98,757.35,761.79,769.41,775.99,781.62,787.35,791.43,801.29,804.33,814.91,817.51,827.39,832.24]},"dur":{"f":764.5,"m":839.4},"units":[{"t":"Words That Flipped Their Meaning.","c":-1,"k":"title","ps":false},{"t":"Part one. Nice, silly and the long road.","c":0,"k":"head","ps":false},{"t":"Imagine being called nice in the year 1300.","c":0,"k":"s","ps":true},{"t":"You might not have been flattered.","c":0,"k":"s","ps":false},{"t":"In this lesson, we'll look at words that have changed their meanings, sometimes completely, over the centuries.","c":0,"k":"s","ps":false},{"t":"We'll see the main ways words drift, and why it happens at all.","c":0,"k":"s","ps":false},{"t":"Let's begin with the word in that opening line.","c":0,"k":"s","ps":false},{"t":"Nice.","c":0,"k":"s","ps":false},{"t":"N, I, C, E.","c":0,"k":"s","ps":false},{"t":"Here's an everyday example of how we use it now.","c":0,"k":"s","ps":false},{"t":"It was really nice of the neighbours to bring the bins in while we were away.","c":0,"k":"s","ps":false},{"t":"Nice came into English from French in the late 1200s.","c":0,"k":"s","ps":false},{"t":"It goes back to the Latin word nescius, which means not knowing, or ignorant.","c":0,"k":"s","ps":false},{"t":"And that's exactly what it first meant in English.","c":0,"k":"s","ps":false},{"t":"A nice person was foolish, ignorant or silly.","c":0,"k":"s","ps":false},{"t":"From there, the word went on a remarkable journey.","c":0,"k":"s","ps":false},{"t":"Over the next few centuries, nice came to mean timid, then fussy and fastidious, then dainty and delicate.","c":0,"k":"s","ps":false},{"t":"By the 1500s, it could mean precise and careful.","c":0,"k":"s","ps":false},{"t":"You can still hear that meaning today in the phrase a nice distinction, which means a fine or subtle one.","c":0,"k":"s","ps":false},{"t":"Only in the 1700s did nice start to mean pleasant or agreeable.","c":0,"k":"s","ps":false},{"t":"The kind and thoughtful sense came even later, in the 1800s.","c":0,"k":"s","ps":false},{"t":"So in about five hundred years, nice went from foolish to kind, taking several detours along the way.","c":0,"k":"s","ps":false},{"t":"Our second word made almost the opposite journey.","c":0,"k":"s","ps":false},{"t":"Silly.","c":0,"k":"s","ps":false},{"t":"S, I, L, L, Y.","c":0,"k":"s","ps":false},{"t":"For example, don't be silly, you're not going to wear thongs to a job interview.","c":0,"k":"s","ps":false},{"t":"In Old English, the ancestor of silly meant happy, lucky or blessed.","c":0,"k":"s","ps":false},{"t":"It's related to the modern German word selig, which still means blessed.","c":0,"k":"s","ps":false},{"t":"Around 1200, silly came to mean innocent.","c":0,"k":"s","ps":false},{"t":"From innocent, it slid to pitiable, deserving sympathy.","c":0,"k":"s","ps":false},{"t":"Then to weak.","c":0,"k":"s","ps":false},{"t":"Then, by the late 1500s, to feeble-minded and foolish, which is roughly where we are today.","c":0,"k":"s","ps":false},{"t":"You can see the logic at each step.","c":0,"k":"s","ps":false},{"t":"Someone who is innocent may be easily fooled.","c":0,"k":"s","ps":false},{"t":"Someone who is easily fooled may seem simple.","c":0,"k":"s","ps":false},{"t":"And someone who seems simple may be called foolish.","c":0,"k":"s","ps":false},{"t":"Each small step made sense, but after a few centuries, the word had travelled from blessed to brainless.","c":0,"k":"s","ps":false},{"t":"Here's the key point.","c":0,"k":"s","ps":false},{"t":"Words rarely jump straight from one meaning to its opposite.","c":0,"k":"s","ps":false},{"t":"They drift, one small step at a time, usually over generations.","c":0,"k":"s","ps":false},{"t":"Each generation only notices a slight shift, if they notice anything at all.","c":0,"k":"s","ps":false},{"t":"It's only when you line the steps up across centuries that the change looks dramatic.","c":0,"k":"s","ps":false},{"t":"Linguists have names for the main directions words drift in.","c":0,"k":"s","ps":false},{"t":"When a word's meaning gets more negative, like silly, it's called pejoration.","c":0,"k":"s","ps":false},{"t":"That comes from the Latin word for worse.","c":0,"k":"s","ps":false},{"t":"When a word's meaning gets more positive, like nice, it's called amelioration, from the Latin for better.","c":0,"k":"s","ps":false},{"t":"We'll meet both of these many times in the next part.","c":0,"k":"s","ps":false},{"t":"Part two. Worse and better.","c":1,"k":"head","ps":false},{"t":"Let's start with a pair that everyone mentions when they talk about changing words.","c":1,"k":"s","ps":true},{"t":"Awful.","c":1,"k":"s","ps":false},{"t":"A, W, F, U, L.","c":1,"k":"s","ps":false},{"t":"For example, the traffic on the freeway was awful this morning.","c":1,"k":"s","ps":false},{"t":"Awful was originally just what it looks like, full of awe.","c":1,"k":"s","ps":false},{"t":"Around 1300, it meant something that inspired awe, wonder or dread.","c":1,"k":"s","ps":false},{"t":"The presence of God was awful.","c":1,"k":"s","ps":false},{"t":"A great storm at sea was awful.","c":1,"k":"s","ps":false},{"t":"It was a serious, powerful word.","c":1,"k":"s","ps":false},{"t":"But in the early 1800s, people started using it to mean simply very bad.","c":1,"k":"s","ps":false},{"t":"By then, the sense of awe had drained away.","c":1,"k":"s","ps":false},{"t":"Today, awful describes a traffic jam, a cold cup of tea or a bad joke.","c":1,"k":"s","ps":false},{"t":"Its modern replacement is awesome, which took over the job of expressing awe.","c":1,"k":"s","ps":false},{"t":"And of course, awesome itself is now going the same way.","c":1,"k":"s","ps":false},{"t":"When someone calls a sausage roll awesome, nobody's standing in wonder before the Almighty.","c":1,"k":"s","ps":false},{"t":"Our next word went the other way.","c":1,"k":"s","ps":false},{"t":"Terrific.","c":1,"k":"s","ps":false},{"t":"T, E, R, R, I, F, I, C.","c":1,"k":"s","ps":false},{"t":"For example, you did a terrific job on that presentation.","c":1,"k":"s","ps":false},{"t":"Terrific was first used in English in the 1660s, by the poet John Milton.","c":1,"k":"s","ps":false},{"t":"It meant terrifying, causing terror.","c":1,"k":"s","ps":false},{"t":"By the early 1800s, it had weakened to mean very great or severe, as in a terrific storm or a terrific headache.","c":1,"k":"s","ps":false},{"t":"Then, in the late 1800s, it flipped to mean excellent.","c":1,"k":"s","ps":false},{"t":"So awful and terrific both started out frightening.","c":1,"k":"s","ps":false},{"t":"One ended up bad, and one ended up good.","c":1,"k":"s","ps":false},{"t":"Our next word is a lovely example of a word that changed sides.","c":1,"k":"s","ps":false},{"t":"Egregious.","c":1,"k":"s","ps":false},{"t":"E, G, R, E, G, I, O, U, S.","c":1,"k":"s","ps":false},{"t":"For example, charging $12 for a small bottle of water at the airport is an egregious rip-off.","c":1,"k":"s","ps":false},{"t":"Egregious comes from Latin, meaning rising out of the flock, or standing out from the herd.","c":1,"k":"s","ps":false},{"t":"When it came into English in the 1500s, it meant distinguished and excellent.","c":1,"k":"s","ps":false},{"t":"An egregious scholar was an outstanding one.","c":1,"k":"s","ps":false},{"t":"But within a few decades, people started using it ironically.","c":1,"k":"s","ps":false},{"t":"Calling a fool an egregious fool was a sarcastic kind of praise.","c":1,"k":"s","ps":false},{"t":"The irony stuck, and the negative sense slowly took over.","c":1,"k":"s","ps":false},{"t":"Now egregious means outstandingly bad, and almost nobody remembers it was once a compliment.","c":1,"k":"s","ps":false},{"t":"Here's one more worsening word, with a sweet start.","c":1,"k":"s","ps":false},{"t":"Bully.","c":1,"k":"s","ps":false},{"t":"B, U, L, L, Y.","c":1,"k":"s","ps":false},{"t":"For example, the school has a clear plan for dealing with any child who's being a bully.","c":1,"k":"s","ps":false},{"t":"In the 1500s, bully was a term of affection.","c":1,"k":"s","ps":false},{"t":"It meant sweetheart or darling, and it could be used for a man or a woman.","c":1,"k":"s","ps":false},{"t":"It probably came from a Dutch word for lover or brother.","c":1,"k":"s","ps":false},{"t":"In Shakespeare's Henry the Fifth, a character called Pistol declares his affection for the king with the words, I love the lovely bully.","c":1,"k":"s","ps":false},{"t":"Over the next century or so, bully slid from darling, to fine fellow, to a blustering show-off.","c":1,"k":"s","ps":false},{"t":"By the late 1600s, it meant someone who picks on the weak.","c":1,"k":"s","ps":false},{"t":"A trace of the old meaning survives in the phrase bully for you, which means good for you, though today it's usually said sarcastically.","c":1,"k":"s","ps":false},{"t":"Part three. Broader, narrower and literally.","c":2,"k":"head","ps":false},{"t":"Words don't only get better or worse.","c":2,"k":"s","ps":true},{"t":"Sometimes their meanings get wider or narrower.","c":2,"k":"s","ps":false},{"t":"Linguists call these broadening and narrowing.","c":2,"k":"s","ps":false},{"t":"Let's start with narrowing.","c":2,"k":"s","ps":false},{"t":"Deer.","c":2,"k":"s","ps":false},{"t":"D, E, E, R.","c":2,"k":"s","ps":false},{"t":"For example, we slowed right down because a deer was standing by the side of the road.","c":2,"k":"s","ps":false},{"t":"In Old English, the ancestor of deer simply meant animal, any wild animal at all.","c":2,"k":"s","ps":false},{"t":"German still has a close cousin, Tier, which means animal.","c":2,"k":"s","ps":false},{"t":"You can hear the old meaning in Shakespeare's King Lear.","c":2,"k":"s","ps":false},{"t":"A character describes living on mice and rats, and such small deer.","c":2,"k":"s","ps":false},{"t":"He doesn't mean tiny antlered animals.","c":2,"k":"s","ps":false},{"t":"He means small creatures in general.","c":2,"k":"s","ps":false},{"t":"Over time, deer narrowed to mean one particular kind of animal, and the word animal, borrowed from Latin, took over the general job.","c":2,"k":"s","ps":false},{"t":"Meat followed a similar path.","c":2,"k":"s","ps":false},{"t":"In Old English, meat meant food of any kind.","c":2,"k":"s","ps":false},{"t":"That's why we still have the word sweetmeat, for a sweet treat, and the old saying one man's meat is another man's poison.","c":2,"k":"s","ps":false},{"t":"Our next word narrowed too, in a way that surprises most people.","c":2,"k":"s","ps":false},{"t":"Girl.","c":2,"k":"s","ps":false},{"t":"G, I, R, L.","c":2,"k":"s","ps":false},{"t":"For example, the girl at the front desk was incredibly helpful.","c":2,"k":"s","ps":false},{"t":"When girl first appeared in Middle English, around 1300, it meant a child or young person of either sex.","c":2,"k":"s","ps":false},{"t":"In Chaucer's Canterbury Tales, written in the late 1300s, the phrase the young girls of the diocese means the young people of the district, boys and girls alike.","c":2,"k":"s","ps":false},{"t":"Only later did girl narrow to mean a young female.","c":2,"k":"s","ps":false},{"t":"Interestingly, it has stretched a little again since then, because today it's often used for women of any age, as in a girls' night out.","c":2,"k":"s","ps":false},{"t":"Now for broadening, where a meaning gets wider.","c":2,"k":"s","ps":false},{"t":"Holiday.","c":2,"k":"s","ps":false},{"t":"H, O, L, I, D, A, Y.","c":2,"k":"s","ps":false},{"t":"For example, we're taking the kids up the coast for the school holidays.","c":2,"k":"s","ps":false},{"t":"You can probably hear where this one came from.","c":2,"k":"s","ps":false},{"t":"A holiday was originally a holy day, a religious festival.","c":2,"k":"s","ps":false},{"t":"Because people didn't work on holy days, the word gradually came to mean any day off.","c":2,"k":"s","ps":false},{"t":"Then it broadened again, to mean a whole trip away.","c":2,"k":"s","ps":false},{"t":"Today, a holiday can involve a caravan park, a theme park or a week on the couch, with nothing holy about it at all.","c":2,"k":"s","ps":false},{"t":"Dog is another broadening word, though its early history is a little murky.","c":2,"k":"s","ps":false},{"t":"In Old English, the usual word for a dog was hound.","c":2,"k":"s","ps":false},{"t":"The rare word docga seems to have been used for one particular kind of powerful dog.","c":2,"k":"s","ps":false},{"t":"Over time, dog spread to cover every breed, from a Great Dane to a chihuahua.","c":2,"k":"s","ps":false},{"t":"Hound went the opposite way and narrowed, and now it usually means a hunting dog.","c":2,"k":"s","ps":false},{"t":"So the two words swapped places.","c":2,"k":"s","ps":false},{"t":"Our final word is the one people argue about most.","c":2,"k":"s","ps":false},{"t":"Literally.","c":2,"k":"s","ps":false},{"t":"L, I, T, E, R, A, L, L, Y.","c":2,"k":"s","ps":false},{"t":"For example, I was so tired I literally fell asleep standing up on the train.","c":2,"k":"s","ps":false},{"t":"Literally originally meant exactly, word for word, not as a metaphor.","c":2,"k":"s","ps":false},{"t":"But people have been using it as an intensifier, simply to add emphasis, for a surprisingly long time.","c":2,"k":"s","ps":false},{"t":"One well-known early example comes from 1769, in a novel by the writer Frances Brooke.","c":2,"k":"s","ps":false},{"t":"A character says that a lucky man, surrounded by fine women, is literally feeding among the lilies.","c":2,"k":"s","ps":false},{"t":"He isn't, of course, actually grazing in a garden.","c":2,"k":"s","ps":false},{"t":"Much-loved writers like Charles Dickens and Mark Twain used it the same way.","c":2,"k":"s","ps":false},{"t":"When someone says their head literally exploded, they're following a path that very has already travelled.","c":2,"k":"s","ps":false},{"t":"Very comes from an old French word meaning true.","c":2,"k":"s","ps":false},{"t":"It used to mean truly or really, and you can still hear that in old phrases like the very thing, meaning exactly the thing.","c":2,"k":"s","ps":false},{"t":"Over time, very became a simple intensifier, and nobody minds at all.","c":2,"k":"s","ps":false},{"t":"Major dictionaries in Australia, Britain and the United States now record the emphatic sense of literally, usually with a note that some people dislike it.","c":2,"k":"s","ps":false},{"t":"That's what dictionaries do.","c":2,"k":"s","ps":false},{"t":"They describe how people actually use words, rather than dictating how they should.","c":2,"k":"s","ps":false},{"t":"So why do words drift at all?","c":2,"k":"s","ps":false},{"t":"There are a few main reasons.","c":2,"k":"s","ps":false},{"t":"One is that strong words wear out.","c":2,"k":"s","ps":false},{"t":"If you use awful or terrific for everything, they lose their punch, so we reach for new ones.","c":2,"k":"s","ps":false},{"t":"Another is irony and sarcasm, which is how egregious flipped.","c":2,"k":"s","ps":false},{"t":"Say something ironically often enough, and the ironic meaning can become the real one.","c":2,"k":"s","ps":false},{"t":"A third is politeness.","c":2,"k":"s","ps":false},{"t":"When a word for something uncomfortable starts to sound harsh, people swap in a gentler one.","c":2,"k":"s","ps":false},{"t":"Over time, the new word picks up the same negative feeling, and it gets replaced too.","c":2,"k":"s","ps":false},{"t":"The psychologist Steven Pinker called this the euphemism treadmill.","c":2,"k":"s","ps":false},{"t":"Words for the toilet are a classic example.","c":2,"k":"s","ps":false},{"t":"Toilet itself was once a polite word, borrowed from French, for a small cloth used while dressing and doing your hair.","c":2,"k":"s","ps":false},{"t":"It moved to the dressing room, then to the room with the plumbing, and eventually it started to sound a bit blunt.","c":2,"k":"s","ps":false},{"t":"So people reached for bathroom, washroom, restroom and powder room, and Australians, of course, reached for the loo and the dunny.","c":2,"k":"s","ps":false},{"t":"And finally, the world itself changes, and words stretch or shrink to fit it.","c":2,"k":"s","ps":false},{"t":"Knowing all this can make you a bit more relaxed about language change.","c":2,"k":"s","ps":false},{"t":"It can also make old writing easier to understand.","c":2,"k":"s","ps":false},{"t":"When a character in an old novel is called nice, or a hymn describes something as awful, it's worth pausing to ask what the word meant back then.","c":2,"k":"s","ps":false},{"t":"Very often, it meant something quite different from what we'd assume today.","c":2,"k":"s","ps":false},{"t":"The words you grew up with once meant something else, and the words that annoy you now may be perfectly normal in fifty years.","c":2,"k":"s","ps":false},{"t":"To sum up, words drift one small step at a time, getting better or worse, wider or narrower.","c":2,"k":"s","ps":false},{"t":"Nice once meant foolish, silly once meant blessed, and awful once meant full of awe.","c":2,"k":"s","ps":false},{"t":"Language change isn't decay, it's simply what living languages do.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What did nice mean when it first came into English in the 1200s?","c":3,"k":"q","ps":false},{"t":"Answer. Foolish or ignorant.","c":3,"k":"a","ps":false},{"t":"Question two. What's the name for a word's meaning getting worse over time, as happened to silly and bully?","c":3,"k":"q","ps":false},{"t":"Answer. Pejoration.","c":3,"k":"a","ps":false},{"t":"Question three. Deer once meant any animal. Is that an example of broadening or narrowing?","c":3,"k":"q","ps":false},{"t":"Answer. Narrowing. The meaning shrank to one kind of animal.","c":3,"k":"a","ps":false},{"t":"That's the end of Words That Flipped Their Meaning. Terrific work, in every sense. See you next time.","c":3,"k":"end","ps":false}]},"empires":{"chapters":["Two hundred and ten reasons","Rome, the case everyone argues about","When a whole world fell","The big theories","What historians agree on"],"at":{"f":[0.3,3.4,6.45,13.88,22.17,24.75,31.48,33.18,34.78,36.13,37.4,38.36,39.92,41.24,42.55,45.4,46.66,48.1,54.06,60.14,63.08
