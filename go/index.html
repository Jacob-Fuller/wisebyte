planned switch instead of dozens of small unplanned ones.","c":2,"k":"s","ps":false},{"t":"Most messages can wait fifty minutes without anyone noticing.","c":2,"k":"s","ps":false},{"t":"And if something is truly urgent, people usually find a way to call.","c":2,"k":"s","ps":false},{"t":"The fourth habit is one you might be doing right now.","c":2,"k":"s","ps":true},{"t":"Take a proper break outside.","c":2,"k":"s","ps":false},{"t":"In 2008, Marc Berman, John Jonides and Stephen Kaplan, at the University of Michigan, sent people on walks.","c":2,"k":"s","ps":false},{"t":"Some walked through a leafy arboretum.","c":2,"k":"s","ps":false},{"t":"Others walked along busy city streets.","c":2,"k":"s","ps":false},{"t":"Afterwards, the nature walkers did noticeably better on a demanding memory and attention test, improving by about twenty per cent.","c":2,"k":"s","ps":false},{"t":"The street walkers didn't improve much at all.","c":2,"k":"s","ps":false},{"t":"Their idea is that busy streets keep grabbing your attention, while trees, water and sky let it rest and refill.","c":2,"k":"s","ps":false},{"t":"Finally, here's a small attention exercise you can do by ear.","c":2,"k":"s","ps":true},{"t":"If you're driving, keep your eyes and focus on the road, and simply treat the road as your anchor.","c":2,"k":"s","ps":false},{"t":"If you're walking, pick something simple to rest your attention on, like the sound of your footsteps.","c":2,"k":"s","ps":false},{"t":"For the next minute or so, whenever you notice your mind has drifted, quietly say to yourself, wandering, and gently come back.","c":2,"k":"s","ps":false},{"t":"That's the whole exercise.","c":2,"k":"s","ps":false},{"t":"The moment of noticing isn't a failure.","c":2,"k":"s","ps":false},{"t":"It's the actual training.","c":2,"k":"s","ps":false},{"t":"Every time you catch the drift and return, you're strengthening the same skill you'll use at your desk.","c":2,"k":"s","ps":false},{"t":"Let's recap.","c":2,"k":"s","ps":true},{"t":"Our minds wander almost half the time, and multitasking is really rapid switching, with a real cost in time and attention.","c":2,"k":"s","ps":false},{"t":"The fixes are small and practical.","c":2,"k":"s","ps":false},{"t":"Do one thing at a time, add friction to distractions, finish cleanly before you switch, and give your attention regular rest, ideally somewhere green.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In the Killingsworth and Gilbert study, roughly how much of the time were people's minds wandering?","c":3,"k":"q","ps":false},{"t":"Answer. About forty-seven per cent, nearly half the time.","c":3,"k":"a","ps":false},{"t":"Question two. What did Sophie Leroy call the part of your mind that stays stuck on an unfinished task?","c":3,"k":"q","ps":false},{"t":"Answer. Attention residue.","c":3,"k":"a","ps":false},{"t":"Question three. In the Michigan study, which walk improved people's attention more, the city streets or the arboretum?","c":3,"k":"q","ps":false},{"t":"Answer. The walk through the leafy arboretum.","c":3,"k":"a","ps":false},{"t":"That's the end of Training Your Attention. Well focused. See you on the next one.","c":3,"k":"end","ps":false}]},"attach":{"chapters":["From orphanages to the lab","The leap to adult love","What holds up, and what doesn't"],"at":{"f":[0.3,4.1,7.1,16.27,21.6,23.45,26.45,32.8,36.83,48.37,55.52,61.29,65.29,66.96,68.43,73.24,76.63,85.22,93.77,98.05,101.4,104.94,110.6,115.12,120.93,124.29,128.5,137.3,145.23,147.88,152.8,162.16,171.14,175.64,177.35,180.22,186.16,190.24,191.77,200.79,202.36,209.56,215.37,216.62,218.29,219.89,225.86,228.58,239.32,240.9,246.53,254.05,256.96,264.66,271.07,278.59,282.94,289.62,295.84,300.56,307.58,313.11,316.68,319.04,321.41,328.72,331.88,335.85,345.12,349.55,351.32,356.88,358.47,362.55,368.54,376.37,379.92,386.89,393.75,396.07,399.22,404.16,412.84,417.02,420.83,423.57,428.91,434.19,443.18,452.93,457.27,462.4,466.82,469.23,475.57,477.88,482.5,486.03,490.87,493.92,496.94,504.26,507.1,516.99,520.88,525.17,528.86,533.44,537.7,541.92,543.91,549.52,551.33,557.13,558.84,567.71,572.03,575.36,581.99,585.28,596.87,601.97,603.05,611.3,618.65,623.37,626.51,629.88,640.9,646.45,651.01,653.25,662.71,665.3,672.65,683.09,686.43,691.11,692.47,694.22,696.05,703.89,708.12,716.83,723.34,725.51,735.1,743.19,749.5,756.72,760.4,770.83,773.93,782.99,786.11,796.57,799.26],"m":[0.3,4.26,7.56,17.36,22.98,25.02,28.45,35.4,39.71,52.8,60.61,66.93,71.23,73.13,74.84,80.24,84.02,93.5,102.77,107.41,111.19,114.92,121.23,126.45,132.75,136.46,141.11,150.76,159.39,162.33,167.73,177.76,188.03,192.99,194.74,197.98,204.42,209.08,210.74,220.71,222.42,230.08,236.42,237.77,239.42,241.13,247.54,250.43,262.5,264.26,269.97,278.14,281.13,289.85,297.32,305.66,310.55,317.95,324.83,330.19,337.85,343.69,347.77,350.37,352.92,360.87,364.33,368.5,379.13,383.71,385.55,391.44,393.13,397.52,403.87,412.3,416.04,423.94,431.5,434.13,437.52,442.97,452.53,457.01,461.23,464.3,470.18,475.91,485.83,496.34,501.31,507.11,512.12,514.81,522.11,524.73,530.0,533.87,539.26,542.56,545.94,553.99,556.99,567.51,571.65,576.3,580.3,585.25,589.92,594.63,596.84,603.31,605.2,611.63,613.47,623.19,627.96,631.3,638.78,642.53,655.25,660.78,661.95,671.04,678.99,684.04,687.44,691.11,703.31,709.37,714.43,716.88,727.06,729.9,738.01,749.39,752.97,757.99,759.42,761.27,763.39,772.38,776.91,786.63,793.91,796.37,807.03,816.01,822.85,830.49,834.57,845.54,848.82,858.35,861.68,872.65,875.48]},"dur":{"f":806.1,"m":882.8},"units":[{"t":"Attachment Styles in Adult Life.","c":-1,"k":"title","ps":false},{"t":"Part one. From orphanages to the lab.","c":0,"k":"head","ps":false},{"t":"If you've spent any time on social media lately, you've probably seen someone described as anxiously attached, or a partner dismissed as avoidant.","c":0,"k":"s","ps":true},{"t":"Attachment styles have become one of the most popular ideas in modern psychology.","c":0,"k":"s","ps":false},{"t":"Some of it is solid science.","c":0,"k":"s","ps":false},{"t":"Some of it has drifted a long way from the research.","c":0,"k":"s","ps":false},{"t":"Let's walk through where the idea came from, what actually holds up, and what's closer to a horoscope.","c":0,"k":"s","ps":false},{"t":"The story begins with a British psychiatrist called John Bowlby.","c":0,"k":"s","ps":true},{"t":"In the years after the Second World War, Bowlby studied children who had been separated from their parents, some in hospitals, some in orphanages, some evacuated from cities during the bombing.","c":0,"k":"s","ps":false},{"t":"In 1951 he wrote a report for the World Health Organization on children who had lost their families.","c":0,"k":"s","ps":false},{"t":"His conclusion was that a warm, continuous relationship with a caregiver wasn't a luxury.","c":0,"k":"s","ps":false},{"t":"It was as important to a young child's development as food.","c":0,"k":"s","ps":false},{"t":"That sounds obvious now.","c":0,"k":"s","ps":true},{"t":"At the time it wasn't.","c":0,"k":"s","ps":false},{"t":"Many experts believed babies loved their mothers mainly because mothers fed them.","c":0,"k":"s","ps":false},{"t":"Affection was treated as a side effect of being fed.","c":0,"k":"s","ps":false},{"t":"Hospital visiting hours for parents of sick children were often strictly limited, partly on the theory that visits upset the children.","c":0,"k":"s","ps":false},{"t":"Evidence against the feeding theory came from an American psychologist, Harry Harlow, in a set of experiments that are hard to hear about today.","c":0,"k":"s","ps":true},{"t":"Harlow raised baby rhesus monkeys with two artificial mothers.","c":0,"k":"s","ps":false},{"t":"One was made of bare wire and held a bottle of milk.","c":0,"k":"s","ps":false},{"t":"The other was covered in soft cloth but gave no food.","c":0,"k":"s","ps":false},{"t":"The babies went to the wire mother to feed, then spent most of their time clinging to the cloth one.","c":0,"k":"s","ps":false},{"t":"When something frightened them, they ran to the cloth mother, not the one with the milk.","c":0,"k":"s","ps":false},{"t":"Harlow published his findings in 1958 under the title The Nature of Love.","c":0,"k":"s","ps":false},{"t":"Comfort, it turned out, was a need in its own right.","c":0,"k":"s","ps":false},{"t":"Bowlby pulled these threads together into what became attachment theory.","c":0,"k":"s","ps":true},{"t":"His central idea was that children are born with a drive to stay close to a trusted person, especially when they're scared, tired or unwell.","c":0,"k":"s","ps":false},{"t":"That person acts as a safe haven to return to when things go wrong, and a secure base to explore the world from when things are fine.","c":0,"k":"s","ps":false},{"t":"Bowlby didn't think this faded in childhood.","c":0,"k":"s","ps":false},{"t":"He wrote that attachment is part of human life from the cradle to the grave.","c":0,"k":"s","ps":false},{"t":"The person who turned this theory into something you could measure was Mary Ainsworth, an American-Canadian psychologist who had worked with Bowlby in London.","c":0,"k":"s","ps":true},{"t":"After watching mothers and babies in Uganda and later in Baltimore, she designed a short laboratory procedure known as the Strange Situation.","c":0,"k":"s","ps":false},{"t":"A baby of around one year old plays in an unfamiliar room with their mother.","c":0,"k":"s","ps":false},{"t":"A stranger comes in.","c":0,"k":"s","ps":false},{"t":"The mother slips out for a few minutes, then returns.","c":0,"k":"s","ps":false},{"t":"Later the baby is left completely alone for a short time, and then the mother comes back again.","c":0,"k":"s","ps":false},{"t":"What Ainsworth watched most closely wasn't the crying when the mother left.","c":0,"k":"s","ps":true},{"t":"It was the reunion.","c":0,"k":"s","ps":false},{"t":"Most babies in her studies were upset by the separation, went straight to their mother when she returned, were comforted quickly, and then went back to playing.","c":0,"k":"s","ps":false},{"t":"She called them secure.","c":0,"k":"s","ps":false},{"t":"Some babies barely seemed to react to the separation, and tended to ignore their mother or turn away when she came back.","c":0,"k":"s","ps":false},{"t":"Yet later research found that babies like these often had raised heart rates during separations.","c":0,"k":"s","ps":false},{"t":"They were stressed.","c":0,"k":"s","ps":false},{"t":"They just weren't showing it.","c":0,"k":"s","ps":false},{"t":"She called them avoidant.","c":0,"k":"s","ps":false},{"t":"A smaller group were very distressed and hard to settle, seeking comfort while also pushing it away.","c":0,"k":"s","ps":false},{"t":"She called them resistant, or ambivalent.","c":0,"k":"s","ps":false},{"t":"Later, the researchers Mary Main and Judith Solomon described a fourth pattern, called disorganised, in which babies seemed to have no consistent way of coping at all.","c":0,"k":"s","ps":false},{"t":"So those are the roots.","c":0,"k":"s","ps":true},{"t":"Secure, avoidant and anxious started as descriptions of one-year-olds in a playroom.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll see how they jumped from babies to grown-up romance, and what happened to them along the way.","c":0,"k":"s","ps":false},{"t":"Part two. The leap to adult love.","c":1,"k":"head","ps":false},{"t":"In 1987, two researchers at the University of Denver, Cindy Hazan and Phillip Shaver, had a bold idea.","c":1,"k":"s","ps":true},{"t":"What if romantic love was the adult version of the bond Bowlby and Ainsworth had studied in babies?","c":1,"k":"s","ps":false},{"t":"A partner, after all, is often the person we turn to when we're frightened or hurting, and the base we venture out from.","c":1,"k":"s","ps":false},{"t":"To test it, they ran what they called a love quiz in a local newspaper.","c":1,"k":"s","ps":true},{"t":"Readers were asked to pick which of three short paragraphs best described their feelings in close relationships.","c":1,"k":"s","ps":false},{"t":"One described finding it fairly easy to get close to others and not worrying much about being abandoned.","c":1,"k":"s","ps":false},{"t":"One described feeling uncomfortable being close and finding it hard to trust.","c":1,"k":"s","ps":false},{"t":"The third described wanting to get closer than partners seemed to want, and worrying that a partner didn't really love them.","c":1,"k":"s","ps":false},{"t":"The results lined up remarkably well with the proportions in Ainsworth's baby studies.","c":1,"k":"s","ps":true},{"t":"A little over half of the readers chose the secure description.","c":1,"k":"s","ps":false},{"t":"About a quarter chose the avoidant one.","c":1,"k":"s","ps":false},{"t":"And about a fifth chose the anxious one.","c":1,"k":"s","ps":false},{"t":"The secure group also described their most important love relationships as happier, more trusting and longer lasting.","c":1,"k":"s","ps":false},{"t":"The paper sparked a whole new field of research.","c":1,"k":"s","ps":false},{"t":"Since then, the ideas have been refined in two important ways.","c":1,"k":"s","ps":true},{"t":"The first came in 1991, when Kim Bartholomew, working with Leonard Horowitz, pointed out that there seemed to be two different kinds of avoidance.","c":1,"k":"s","ps":false},{"t":"Some avoidant people seemed genuinely content to be self-reliant.","c":1,"k":"s","ps":false},{"t":"She called that dismissing.","c":1,"k":"s","ps":false},{"t":"Others seemed to want closeness but feared it, keeping people at a distance to avoid being hurt.","c":1,"k":"s","ps":false},{"t":"She called that fearful.","c":1,"k":"s","ps":false},{"t":"That's where the four adult styles you often hear about come from.","c":1,"k":"s","ps":false},{"t":"The second refinement matters even more, and it's the part pop psychology usually leaves out.","c":1,"k":"s","ps":true},{"t":"When researchers measured attachment with long questionnaires rather than a single choice, the results didn't fall into neat boxes.","c":1,"k":"s","ps":false},{"t":"Instead, they spread out along two separate sliding scales.","c":1,"k":"s","ps":false},{"t":"One scale is attachment anxiety, which is how much you worry about rejection and whether people will be there for you.","c":1,"k":"s","ps":false},{"t":"The other is attachment avoidance, which is how uncomfortable you are with closeness and depending on others.","c":1,"k":"s","ps":false},{"t":"Everyone sits somewhere on both scales.","c":1,"k":"s","ps":true},{"t":"Someone low on both would be described as secure.","c":1,"k":"s","ps":false},{"t":"Someone high on anxiety but low on avoidance fits the old anxious label.","c":1,"k":"s","ps":false},{"t":"The psychologist Chris Fraley and his colleagues have tested this with statistical methods designed to tell true categories from smooth scales.","c":1,"k":"s","ps":false},{"t":"Their work suggests attachment works more like height than like blood type.","c":1,"k":"s","ps":false},{"t":"There's no line where you stop being secure and become anxious.","c":1,"k":"s","ps":false},{"t":"There's just more or less of each tendency.","c":1,"k":"s","ps":false},{"t":"Researchers also distinguish two quite different ways of measuring adult attachment.","c":1,"k":"s","ps":true},{"t":"Social psychologists mostly use questionnaires about romantic relationships.","c":1,"k":"s","ps":false},{"t":"Developmental psychologists often use a long interview, called the Adult Attachment Interview, about how a person talks about their own childhood.","c":1,"k":"s","ps":false},{"t":"These two methods overlap far less than you might expect, which is a good reminder that attachment in adults isn't one simple thing sitting inside us.","c":1,"k":"s","ps":false},{"t":"If you'd like to try the idea on yourself, you can do it purely by ear.","c":1,"k":"s","ps":true},{"t":"If you're driving, keep your eyes on the road and just let these sit in the back of your mind.","c":1,"k":"s","ps":false},{"t":"When someone you love doesn't reply for hours, how much does it bother you?","c":1,"k":"s","ps":false},{"t":"That's a rough sense of the anxiety scale.","c":1,"k":"s","ps":false},{"t":"And when a partner or close friend wants to talk about feelings, or needs to lean on you, how comfortable is that?","c":1,"k":"s","ps":false},{"t":"That's a rough sense of the avoidance scale.","c":1,"k":"s","ps":false},{"t":"Most people land somewhere in the middle on both, and that's perfectly normal.","c":1,"k":"s","ps":false},{"t":"So the science is richer and less boxy than the labels.","c":1,"k":"s","ps":true},{"t":"In the final part, we'll sort what holds up from what's been oversold.","c":1,"k":"s","ps":false},{"t":"Part three. What holds up, and what doesn't.","c":2,"k":"head","ps":false},{"t":"Let's start with what the research genuinely supports.","c":2,"k":"s","ps":true},{"t":"People differ in how anxious and how avoidant they tend to be in close relationships, and those differences are measurable.","c":2,"k":"s","ps":false},{"t":"They're linked, on average, with real outcomes.","c":2,"k":"s","ps":false},{"t":"People lower on both scales tend to report more satisfying relationships, handle conflict more constructively, and seek and give support more easily.","c":2,"k":"s","ps":false},{"t":"Those links show up across many studies and many countries.","c":2,"k":"s","ps":false},{"t":"There's also good evidence that these tendencies come alive under stress.","c":2,"k":"s","ps":true},{"t":"When people feel threatened, the attachment system switches on.","c":2,"k":"s","ps":false},{"t":"Someone high in anxiety tends to reach out more and seek reassurance.","c":2,"k":"s","ps":false},{"t":"Someone high in avoidance tends to pull back and handle things alone.","c":2,"k":"s","ps":false},{"t":"When life is calm, these differences are much less noticeable.","c":2,"k":"s","ps":false},{"t":"Now for the more doubtful claims.","c":2,"k":"s","ps":true},{"t":"The first is that your attachment style is set in early childhood and stays with you for life.","c":2,"k":"s","ps":false},{"t":"The evidence here is mixed.","c":2,"k":"s","ps":false},{"t":"Some long-term studies that followed babies into adulthood found a fair amount of continuity.","c":2,"k":"s","ps":false},{"t":"Others found almost none.","c":2,"k":"s","ps":false},{"t":"When Chris Fraley combined the results in 2002, he found a real but modest link between attachment in infancy and later in life.","c":2,"k":"s","ps":false},{"t":"In plain terms, your early years matter, but they are not a sentence.","c":2,"k":"s","ps":false},{"t":"Adult attachment also shifts with experience.","c":2,"k":"s","ps":true},{"t":"A long, steady relationship with a dependable partner tends to nudge people towards security over time.","c":2,"k":"s","ps":false},{"t":"A painful betrayal or divorce can push the other way.","c":2,"k":"s","ps":false},{"t":"Researchers use the lovely term earned security for people who describe a difficult childhood but have become secure as adults, often through good relationships or good therapy.","c":2,"k":"s","ps":false},{"t":"The second doubtful claim is that attachment explains everything about a relationship.","c":2,"k":"s","ps":true},{"t":"It doesn't.","c":2,"k":"s","ps":false},{"t":"It's one influence among many, alongside personality, stress, money, health, communication skills and plain compatibility.","c":2,"k":"s","ps":false},{"t":"A relationship that isn't working isn't necessarily an attachment problem, and a secure person can still pick a poor match.","c":2,"k":"s","ps":false},{"t":"Even the strongest links in this research are averages across large groups.","c":2,"k":"s","ps":false},{"t":"They can't tell you how any one couple will fare.","c":2,"k":"s","ps":false},{"t":"The third is the habit of diagnosing other people.","c":2,"k":"s","ps":true},{"t":"Popular books, the best known being Attached by Amir Levine and Rachel Heller, published in 2010, have helped many readers put words to patterns in their relationships.","c":2,"k":"s","ps":false},{"t":"But online, the language often turns into a way of labelling a partner after an argument.","c":2,"k":"s","ps":false},{"t":"Calling someone avoidant because they wanted a quiet night in isn't science.","c":2,"k":"s","ps":false},{"t":"It's a judgement wearing a lab coat.","c":2,"k":"s","ps":false},{"t":"The research measures tendencies across lots of situations, not single moments, and it certainly doesn't sort people into good and bad partners.","c":2,"k":"s","ps":false},{"t":"The fourth is a simple mix-up of names.","c":2,"k":"s","ps":true},{"t":"Attachment parenting, the approach linked with things like baby-wearing and co-sleeping, is a separate parenting philosophy.","c":2,"k":"s","ps":false},{"t":"It borrows the word, but it isn't what Bowlby and Ainsworth studied, and the research doesn't show that you need those particular practices to raise a securely attached child.","c":2,"k":"s","ps":false},{"t":"What mattered in Ainsworth's work was responsiveness.","c":2,"k":"s","ps":false},{"t":"Noticing what a child needs, and reliably responding, most of the time.","c":2,"k":"s","ps":false},{"t":"Not perfectly.","c":2,"k":"s","ps":false},{"t":"Most of the time.","c":2,"k":"s","ps":false},{"t":"So what can you do with all this?","c":2,"k":"s","ps":true},{"t":"If you recognise yourself as higher on anxiety, it can help to notice the moment the alarm goes off, like an unanswered message.","c":2,"k":"s","ps":false},{"t":"Then remind yourself that silence usually means busy, not leaving.","c":2,"k":"s","ps":false},{"t":"If you lean towards avoidance, it can help to notice the urge to withdraw when someone needs you, and to stay present a little longer than feels natural.","c":2,"k":"s","ps":false},{"t":"And in any relationship, the thing that builds security is the same thing Ainsworth saw in those playrooms.","c":2,"k":"s","ps":false},{"t":"Being there, reliably, when it counts.","c":2,"k":"s","ps":false},{"t":"If patterns like these are causing real distress, talking with a counsellor can help, and Relationships Australia is one well-known place to start.","c":2,"k":"s","ps":false},{"t":"To sum up, attachment theory grew from serious research on children and was extended to adult love in 1987.","c":2,"k":"s","ps":true},{"t":"The best evidence treats it as two sliding scales, anxiety and avoidance, rather than fixed types.","c":2,"k":"s","ps":false},{"t":"And your style isn't destiny, because experiences and relationships can shift it towards security.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What was the name of Mary Ainsworth's laboratory procedure for studying babies' attachment?","c":3,"k":"q","ps":false},{"t":"Answer. The Strange Situation.","c":3,"k":"a","ps":false},{"t":"Question two. Modern research measures adult attachment on two scales. What are they?","c":3,"k":"q","ps":false},{"t":"Answer. Anxiety and avoidance.","c":3,"k":"a","ps":false},{"t":"Question three. What do researchers call it when someone with a difficult childhood becomes secure as an adult?","c":3,"k":"q","ps":false},{"t":"Answer. Earned security.","c":3,"k":"a","ps":false},{"t":"That's the end of Attachment Styles in Adult Life. Thanks for listening. Go easy on the labels.","c":3,"k":"end","ps":false}]},"aussie":{"chapters":["How a new accent was born","Why Australians shorten words","Fair dinkum and the ute"],"at":{"f":[0.3,3.63,6.55,14.13,23.44,25.1,31.96,38.56,41.99,44.31,51.25,55.02,60.56,69.93,73.84,78.29,84.4,91.03,93.24,96.75,101.12,107.52,111.2,118.18,123.57,126.13,134.64,137.89,146.12,153.11,158.42,166.59,168.52,178.36,181.62,183.41,184.77,186.72,190.04,192.0,194.93,196.65,200.37,206.36,208.87,215.33,217.77,226.73,231.24,233.15,238.44,242.18,244.81,252.96,258.02,261.95,266.77,273.35,275.05,278.59,281.72,284.81,288.16,291.74,293.5,300.54,305.12,310.55,312.41,314.8,318.12,322.17,325.09,330.04,331.25,332.67,334.73,339.63,342.96,344.72,348.65,350.4,358.01,361.43,368.55,371.01,373.88,383.12,385.31,390.72,396.88,400.01,404.67,406.44,407.75,412.41,418.17,426.48,432.11,436.54,440.3,446.84,452.66,455.07,457.82,469.88,474.22,481.11,488.71,495.91,502.4,506.08,518.28,521.7,530.3,536.96,545.43,550.64],"m":[0.3,3.82,7.04,15.62,26.27,28.06,35.53,42.79,46.56,49.08,56.88,60.96,66.93,76.91,81.03,85.81,92.29,99.5,101.94,105.73,110.5,117.54,121.65,129.36,135.09,137.92,147.75,151.6,160.6,168.22,173.96,183.07,185.09,196.06,199.51,201.5,203.08,205.25,209.22,211.41,214.42,216.19,220.15,226.66,229.48,236.6,239.29,249.23,254.06,256.04,261.83,265.86,268.79,277.77,283.26,287.54,293.14,300.38,302.21,306.0,309.39,312.72,316.35,320.38,322.28,330.25,335.42,341.46,343.52,346.1,349.75,354.05,357.09,362.83,364.14,365.65,367.85,373.37,376.97,378.83,383.18,385.08,393.8,397.45,404.89,407.79,411.03,421.26,423.59,429.91,437.09,440.4,445.5,447.42,448.81,453.86,460.18,469.65,476.01,480.91,485.1,492.17,498.49,501.28,504.32,517.94,522.88,530.79,539.4,547.26,554.58,558.66,571.92,575.69,584.74,592.04,600.91,606.54]},"dur":{"f":557.4,"m":613.9},"units":[{"t":"Aussie English, Explained.","c":-1,"k":"title","ps":false},{"t":"Part one. How a new accent was born.","c":0,"k":"head","ps":false},{"t":"If you've ever had a mate say they'll swing by the servo this arvo, you've heard one of the most distinctive varieties of English in the world.","c":0,"k":"s","ps":true},{"t":"In this lesson, we'll look at where Australian English came from, why it loves shortening words, and the stories behind a few of its most famous expressions.","c":0,"k":"s","ps":false},{"t":"Let's start at the beginning.","c":0,"k":"s","ps":false},{"t":"When the First Fleet arrived in 1788, it brought people from all over Britain and Ireland.","c":0,"k":"s","ps":false},{"t":"There were Londoners, people from the south east of England, people from the north, and a large number of Irish.","c":0,"k":"s","ps":false},{"t":"Each group had its own accent and its own local words.","c":0,"k":"s","ps":false},{"t":"Their children, though, grew up together.","c":0,"k":"s","ps":false},{"t":"Kids pick up language mostly from other kids, and in the colony, they were hearing a mix of all those accents at once.","c":0,"k":"s","ps":false},{"t":"Over a generation or two, the mix settled into something new.","c":0,"k":"s","ps":false},{"t":"Linguists call this process levelling, where lots of different dialects blend into a shared one.","c":0,"k":"s","ps":false},{"t":"Visitors to the colony were remarking that the locally born children sounded different from their parents as early as the 1820s.","c":0,"k":"s","ps":false},{"t":"There are plenty of popular myths about the Australian accent.","c":0,"k":"s","ps":false},{"t":"One says Australians talk through half-closed lips to keep the flies out.","c":0,"k":"s","ps":false},{"t":"Another says the early settlers were so often drunk that their slurred speech became the national accent.","c":0,"k":"s","ps":false},{"t":"That second idea got a lot of media attention in 2015, but linguists were quick to reject it.","c":0,"k":"s","ps":false},{"t":"There's no evidence for either theory.","c":0,"k":"s","ps":false},{"t":"The accent came from mixing, not from flies or rum.","c":0,"k":"s","ps":false},{"t":"Australians have also always enjoyed poking fun at their own speech.","c":0,"k":"s","ps":false},{"t":"In 1965, a book called Let Stalk Strine was published under the pen name Afferbeck Lauder.","c":0,"k":"s","ps":false},{"t":"Say that name out loud, and you'll hear alphabetical order.","c":0,"k":"s","ps":false},{"t":"The author was actually an artist called Alastair Morrison, and the title, of course, means let's talk Australian.","c":0,"k":"s","ps":false},{"t":"His word Strine is still used today as a cheeky name for broad Australian English.","c":0,"k":"s","ps":false},{"t":"Broad is actually a technical term here.","c":0,"k":"s","ps":false},{"t":"In the 1960s, two linguists, Alexander Mitchell and Arthur Delbridge, recorded thousands of Australian high school students.","c":0,"k":"s","ps":false},{"t":"They sorted the accents they heard into three broad groups.","c":0,"k":"s","ps":false},{"t":"Broad, like a classic outback character, general, which most Australians speak, and cultivated, which sounds closer to British English.","c":0,"k":"s","ps":false},{"t":"Since then, the cultivated accent has become much rarer, and general Australian is by far the most common.","c":0,"k":"s","ps":false},{"t":"One more surprising thing is how similar the accent is across such a huge country.","c":0,"k":"s","ps":false},{"t":"Someone from Perth and someone from Brisbane live more than three and a half thousand kilometres apart, yet they sound remarkably alike.","c":0,"k":"s","ps":false},{"t":"There are small differences, though.","c":0,"k":"s","ps":false},{"t":"For example, people in Adelaide are much more likely to say dahnce, while in most other cities, dance with a short A, as in ant, is more common.","c":0,"k":"s","ps":false},{"t":"Part two. Why Australians shorten words.","c":1,"k":"head","ps":false},{"t":"Our first word is arvo.","c":1,"k":"s","ps":true},{"t":"A, R, V, O.","c":1,"k":"s","ps":false},{"t":"Here's an everyday example.","c":1,"k":"s","ps":false},{"t":"Are you free this arvo, or should we catch up on the weekend?","c":1,"k":"s","ps":false},{"t":"Arvo simply means afternoon.","c":1,"k":"s","ps":false},{"t":"And our second word is its close cousin, servo.","c":1,"k":"s","ps":false},{"t":"S, E, R, V, O.","c":1,"k":"s","ps":false},{"t":"For example, I'll grab milk from the servo on the way home.","c":1,"k":"s","ps":false},{"t":"A servo is a service station, or what some other countries call a petrol station or gas station.","c":1,"k":"s","ps":false},{"t":"These words are part of a huge family.","c":1,"k":"s","ps":false},{"t":"Linguists call them hypocoristics, which is a technical name for shortened, familiar forms of words.","c":1,"k":"s","ps":false},{"t":"Australian English is famous for them.","c":1,"k":"s","ps":false},{"t":"Some end in O, like arvo, servo, ambo for an ambulance officer, rego for your car registration, and bottle-o for the bottle shop.","c":1,"k":"s","ps":false},{"t":"Others end in IE, like brekkie, barbie, sunnies, mozzie and Chrissie.","c":1,"k":"s","ps":false},{"t":"Names get the same treatment.","c":1,"k":"s","ps":false},{"t":"A David might become Davo, a Sharon becomes Shazza, and a Barry becomes Bazza.","c":1,"k":"s","ps":false},{"t":"Many outsiders assume all this shortening comes from laziness.","c":1,"k":"s","ps":false},{"t":"But the research tells a more interesting story.","c":1,"k":"s","ps":false},{"t":"In 2011, three Australian researchers, Evan Kidd, Nenagh Kemp and Sara Quinn, published a study of these words.","c":1,"k":"s","ps":false},{"t":"They surveyed more than a hundred Australians, aged from seventeen to eighty-four.","c":1,"k":"s","ps":false},{"t":"They found that hypocoristics aren't random or sloppy at all.","c":1,"k":"s","ps":false},{"t":"They follow regular patterns, much like other ways that English builds new words.","c":1,"k":"s","ps":false},{"t":"And they're used by people of all ages and all levels of education, not just in casual pub talk.","c":1,"k":"s","ps":false},{"t":"Here's another surprise.","c":1,"k":"s","ps":false},{"t":"Many of these short words aren't actually shorter to say.","c":1,"k":"s","ps":false},{"t":"Afternoon has three syllables, and arvo has two.","c":1,"k":"s","ps":false},{"t":"But mosquito has three, and mozzie still has two.","c":1,"k":"s","ps":false},{"t":"Bottle shop is two syllables, and bottle-o is three.","c":1,"k":"s","ps":false},{"t":"If the point were saving effort, bottle-o would make no sense.","c":1,"k":"s","ps":false},{"t":"So what's really going on?","c":1,"k":"s","ps":false},{"t":"Linguists who study Australian English, such as Kate Burridge, have argued that these words are mainly about tone.","c":1,"k":"s","ps":false},{"t":"They signal friendliness, informality and a certain easygoing attitude.","c":1,"k":"s","ps":false},{"t":"Calling the ambulance officer an ambo makes them feel like one of us, rather than an official.","c":1,"k":"s","ps":false},{"t":"It's a bit like a verbal wink.","c":1,"k":"s","ps":false},{"t":"The words also mark you as belonging.","c":1,"k":"s","ps":false},{"t":"Using them well is a quiet way of showing you're a local.","c":1,"k":"s","ps":false},{"t":"And of course, the word Aussie itself is one of them.","c":1,"k":"s","ps":false},{"t":"Part three. Fair dinkum and the ute.","c":2,"k":"head","ps":false},{"t":"Our third expression is probably the most famous piece of Australian English of all.","c":2,"k":"s","ps":true},{"t":"Fair dinkum.","c":2,"k":"s","ps":false},{"t":"F, A, I, R.","c":2,"k":"s","ps":false},{"t":"Then D, I, N, K, U, M.","c":2,"k":"s","ps":false},{"t":"For example, I thought he was joking about winning the raffle, but it was fair dinkum.","c":2,"k":"s","ps":false},{"t":"Fair dinkum means genuine, honest, the real thing.","c":2,"k":"s","ps":false},{"t":"It can be a question, too.","c":2,"k":"s","ps":false},{"t":"If someone tells you a wild story, you might reply, fair dinkum?","c":2,"k":"s","ps":false},{"t":"That means, are you serious?","c":2,"k":"s","ps":false},{"t":"You may have heard that the word came from Chinese miners on the goldfields, supposedly saying din gum, meaning real gold.","c":2,"k":"s","ps":false},{"t":"It's a lovely story, but the evidence doesn't support it.","c":2,"k":"s","ps":false},{"t":"Dictionary researchers have found that dinkum was already a dialect word in parts of England, including Lincolnshire.","c":2,"k":"s","ps":false},{"t":"There it meant work, or a fair share of work.","c":2,"k":"s","ps":false},{"t":"Fair dinkum was used a bit like fair's fair.","c":2,"k":"s","ps":false},{"t":"The first Australian record of dinkum comes from 1888, in Rolf Boldrewood's bushranger novel Robbery Under Arms.","c":2,"k":"s","ps":false},{"t":"There, it simply means hard work.","c":2,"k":"s","ps":false},{"t":"Within a few years, fair dinkum was being used to mean honest or genuine, and it took off.","c":2,"k":"s","ps":false},{"t":"During the First World War, Australian soldiers were sometimes called dinkums, or dinkum Aussies.","c":2,"k":"s","ps":false},{"t":"Dinkum on its own still works as an adjective.","c":2,"k":"s","ps":false},{"t":"A dinkum offer is a genuine one, and a dinkum Aussie is the real deal.","c":2,"k":"s","ps":false},{"t":"Our final word is ute.","c":2,"k":"s","ps":false},{"t":"U, T, E.","c":2,"k":"s","ps":false},{"t":"For example, we threw the surfboards in the back of the ute and headed for the coast.","c":2,"k":"s","ps":false},{"t":"Ute is short for utility, and the vehicle itself is a genuine Australian invention.","c":2,"k":"s","ps":false},{"t":"The story goes that in the early 1930s, a farmer's wife in Victoria wrote to Ford Australia with a simple request.","c":2,"k":"s","ps":false},{"t":"She wanted a vehicle to go to church in on a Sunday, and which could carry the pigs to market on Monday.","c":2,"k":"s","ps":false},{"t":"A young Ford designer in Geelong called Lewis Bandt took up the challenge.","c":2,"k":"s","ps":false},{"t":"He combined the front of a comfortable car with a tray at the back.","c":2,"k":"s","ps":false},{"t":"Henry Ford himself is said to have dismissed it as a kangaroo chaser, but farmers and tradies loved it.","c":2,"k":"s","ps":false},{"t":"Ford released the coupe utility in 1934, and it became a national icon.","c":2,"k":"s","ps":false},{"t":"So how do all these words get recorded?","c":2,"k":"s","ps":false},{"t":"Australian English has its own dictionaries.","c":2,"k":"s","ps":false},{"t":"The Macquarie Dictionary was first published in 1981, and the Australian National Dictionary, put together at the Australian National University, followed in 1988.","c":2,"k":"s","ps":false},{"t":"Both track new words and hunt for the earliest examples of old ones.","c":2,"k":"s","ps":false},{"t":"That's why we can now say with some confidence where fair dinkum came from, and why the goldfields story doesn't hold up.","c":2,"k":"s","ps":false},{"t":"To sum up, Australian English grew out of a mix of British and Irish accents, blended by the children of the early colony.","c":2,"k":"s","ps":false},{"t":"Its shortened words, like arvo and servo, follow real patterns and mainly signal friendliness, not laziness.","c":2,"k":"s","ps":false},{"t":"And expressions like fair dinkum and ute each carry a genuine piece of Australian history.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What did dinkum originally mean in English dialect, and in its first Australian record in 1888?","c":3,"k":"q","ps":false},{"t":"Answer. Work, or a fair share of work.","c":3,"k":"a","ps":false},{"t":"Question two. Name two common endings Australians add to shortened words.","c":3,"k":"q","ps":false},{"t":"Answer. The O ending, as in arvo and servo, and the IE ending, as in brekkie and barbie.","c":3,"k":"a","ps":false},{"t":"Question three. Where was the first coupe utility, the original ute, designed?","c":3,"k":"q","ps":false},{"t":"Answer. At Ford in Geelong, released in 1934.","c":3,"k":"a","ps":false},{"t":"That's the end of Aussie English, Explained. Good on ya. See you next arvo, or whenever suits.","c":3,"k":"end","ps":false}]},"bills":{"chapters":["The price of loyalty","How to compare","Making the call"],"at":{"f":[0.3,3.63,6.37,9.31,15.94,20.97,25.25,28.45,31.5,36.05,42.24,47.4,49.58,66.67,76.89,78.62,86.71,88.58,102.31,107.71,109.96,112.46,118.94,129.27,132.44,135.82,141.42,143.78,145.21,150.78,156.45,162.96,169.23,171.17,179.49,182.55,185.1,189.69,196.65,201.21,204.28,207.41,214.0,222.36,229.0,233.61,235.42,239.18,244.86,249.21,251.68,256.53,262.17,265.63,272.94,274.36,280.11,286.14,291.35,293.85,299.95,304.82,307.14,311.48,315.16,319.25,323.86,325.53,328.18,332.0,334.9,338.77,341.0,342.83,345.47,352.84,358.78,363.48,370.8,374.35,378.77,382.38,388.22,393.28,395.57,400.18,405.94,412.36,418.46,425.16,436.95,444.28,446.21,453.07,459.26,460.53,467.13,475.88,480.59,484.27,498.93,503.12,512.51,518.92,527.39,533.65],"m":[0.3,3.84,6.68,10.08,17.45,23.14,27.78,31.51,34.92,39.72,46.5,52.17,54.57,72.87,84.36,86.15,95.07,97.09,111.98,118.03,120.47,123.27,130.66,142.56,146.22,150.08,156.13,158.46,160.05,165.97,172.36,179.71,186.52,188.57,197.81,201.35,204.08,208.97,216.88,221.78,225.34,228.65,235.86,245.56,253.01,257.9,259.74,264.12,270.37,274.98,277.68,283.37,289.64,293.48,301.39,302.88,309.2,315.92,321.49,324.36,330.99,336.26,338.68,343.39,347.55,352.08,357.21,358.96,361.7,365.96,369.25,373.68,376.07,378.11,381.02,389.21,396.06,401.13,409.51,413.36,418.22,422.1,428.71,434.41,436.93,442.17,448.67,455.7,462.8,470.3,483.43,491.24,493.17,500.9,507.86,509.23,516.19,525.71,530.94,535.02,550.55,554.97,564.75,571.7,580.75,587.37]},"dur":{"f":538.6,"m":592.7},"units":[{"t":"Cutting Your Everyday Bills.","c":-1,"k":"title","ps":false},{"t":"Part one. The price of loyalty.","c":0,"k":"head","ps":false},{"t":"Most of us treat our household bills like the weather.","c":0,"k":"s","ps":true},{"t":"The electricity bill arrives, the phone bill comes out automatically, the insurance renews, and we just pay.","c":0,"k":"s","ps":false},{"t":"But for many of these bills, the price you pay depends partly on whether you ever ask.","c":0,"k":"s","ps":false},{"t":"This lesson is about asking, comparing and, when it's worth it, switching.","c":0,"k":"s","ps":false},{"t":"Let's start with something that surprises a lot of people.","c":0,"k":"s","ps":true},{"t":"In many industries, staying loyal costs you money.","c":0,"k":"s","ps":false},{"t":"Companies often offer their sharpest prices to attract new customers.","c":0,"k":"s","ps":false},{"t":"Meanwhile, existing customers drift onto older plans, and their prices creep up year after year.","c":0,"k":"s","ps":false},{"t":"Economists sometimes call this the loyalty penalty, or the loyalty tax.","c":0,"k":"s","ps":false},{"t":"Electricity is a clear example.","c":0,"k":"s","ps":true},{"t":"In its December 2025 report on the electricity market, the Australian Competition and Consumer Commission found that households who'd been on the same plan for more than three years were paying about $221 a year more than people on newer plans.","c":0,"k":"s","ps":false},{"t":"The commission also found that more than a third of households on market offers were paying at or above the default price, which is meant to be a safety net, not a good deal.","c":0,"k":"s","ps":false},{"t":"Its advice was blunt.","c":0,"k":"s","ps":false},{"t":"The single best thing most people can do to save money is to change plans, either with their current retailer or with a new one.","c":0,"k":"s","ps":false},{"t":"Some countries have stepped in.","c":0,"k":"s","ps":true},{"t":"In Britain, the Financial Conduct Authority brought in rules from January 2022 that stop home and car insurers charging renewing customers more than they'd charge a new customer for the same cover.","c":0,"k":"s","ps":false},{"t":"Here in Australia, the job of checking still falls mostly on us, the customers.","c":0,"k":"s","ps":false},{"t":"Why do companies get away with this?","c":0,"k":"s","ps":true},{"t":"Mainly because most of us never check.","c":0,"k":"s","ps":false},{"t":"Comparing plans feels confusing and a bit boring, and the savings on any one bill don't seem huge.","c":0,"k":"s","ps":false},{"t":"But across electricity, gas, mobile, internet and insurance, a few hundred dollars here and there can add up to well over a thousand dollars a year for some households.","c":0,"k":"s","ps":false},{"t":"The good news is that you don't need to become an expert.","c":0,"k":"s","ps":true},{"t":"You need about an hour, once a year, and a simple routine.","c":0,"k":"s","ps":false},{"t":"We'll cover how to compare, and then exactly what to say when you pick up the phone.","c":0,"k":"s","ps":false},{"t":"Part two. How to compare.","c":1,"k":"head","ps":false},{"t":"Start with energy.","c":1,"k":"s","ps":true},{"t":"The Australian Government runs a free comparison website called Energy Made Easy.","c":1,"k":"s","ps":false},{"t":"If you're in Victoria, the state government runs its own, called Victorian Energy Compare.","c":1,"k":"s","ps":false},{"t":"Unlike many commercial comparison sites, these government sites don't earn a commission on the plans they show you.","c":1,"k":"s","ps":false},{"t":"Have a recent bill in front of you, because your actual usage makes the comparison much more accurate.","c":1,"k":"s","ps":false},{"t":"Your bill itself can help too.","c":1,"k":"s","ps":true},{"t":"Under rules set by the Australian Energy Regulator, energy bills must tell you if your retailer has a cheaper plan available for you.","c":1,"k":"s","ps":false},{"t":"It's often a short message near the top of the bill.","c":1,"k":"s","ps":false},{"t":"If you see it, that's your cue to call.","c":1,"k":"s","ps":false},{"t":"While you're comparing, check whether you're eligible for concessions or rebates.","c":1,"k":"s","ps":true},{"t":"Pensioners, health care card holders and some other groups can get discounts on energy bills that they don't always claim.","c":1,"k":"s","ps":false},{"t":"Your state government's energy or concessions website will list them.","c":1,"k":"s","ps":false},{"t":"It's also worth looking at how your plan charges you.","c":1,"k":"s","ps":true},{"t":"Some plans have a single price for power all day.","c":1,"k":"s","ps":false},{"t":"Others, called time of use plans, charge more in the late afternoon and evening, and less at other times.","c":1,"k":"s","ps":false},{"t":"If you have solar panels, or you can run the dishwasher and washing machine in the middle of the day or overnight, a time of use plan might suit you.","c":1,"k":"s","ps":false},{"t":"If most of your power goes on cooking, heating and screens between five and nine at night, it might cost you more.","c":1,"k":"s","ps":false},{"t":"The comparison sites can show you the difference if you enter your usage.","c":1,"k":"s","ps":false},{"t":"Next, phone and internet.","c":1,"k":"s","ps":true},{"t":"The key question here is whether you're paying for more than you use.","c":1,"k":"s","ps":false},{"t":"Check how much mobile data you actually use in a typical month, and compare that with your plan.","c":1,"k":"s","ps":false},{"t":"Many people pay for a large data allowance and use a fraction of it.","c":1,"k":"s","ps":false},{"t":"Also look at whether you're out of contract.","c":1,"k":"s","ps":false},{"t":"If your phone is paid off, you may be paying a handset price for a phone you already own.","c":1,"k":"s","ps":false},{"t":"Smaller mobile brands often use the same networks as the big companies, at a lower price.","c":1,"k":"s","ps":false},{"t":"For home internet on the NBN, check your speed tier.","c":1,"k":"s","ps":false},{"t":"If one or two people mostly browse and stream, a faster, pricier tier may not make any difference you'd notice.","c":1,"k":"s","ps":false},{"t":"Then insurance.","c":1,"k":"s","ps":true},{"t":"Home and car insurance renewals are one of the biggest places the loyalty penalty hides.","c":1,"k":"s","ps":false},{"t":"Your renewal notice should show last year's premium next to this year's, so you can see the jump at a glance.","c":1,"k":"s","ps":false},{"t":"If it has gone up sharply, get two or three quotes from other insurers before you accept it.","c":1,"k":"s","ps":false},{"t":"But compare the cover, not just the price.","c":1,"k":"s","ps":false},{"t":"Check the excess, the sum insured, and what's actually covered, such as flood or accidental damage.","c":1,"k":"s","ps":false},{"t":"A cheaper policy that doesn't cover what you need isn't a saving.","c":1,"k":"s","ps":false},{"t":"Part three. Making the call.","c":2,"k":"head","ps":false},{"t":"Here's the part many people dread, but it's usually easier than expected.","c":2,"k":"s","ps":true},{"t":"Once you have a better offer in hand, call your current provider.","c":2,"k":"s","ps":false},{"t":"You'll often be put through to someone whose job is to keep customers.","c":2,"k":"s","ps":false},{"t":"If you're driving, just listen along, and save the call for when you're parked.","c":2,"k":"s","ps":false},{"t":"Here's a simple script.","c":2,"k":"s","ps":true},{"t":"Hi, I've been a customer for a few years.","c":2,"k":"s","ps":false},{"t":"I've been comparing prices, and I've found a better deal elsewhere.","c":2,"k":"s","ps":false},{"t":"Before I switch, I wanted to see what you can do.","c":2,"k":"s","ps":false},{"t":"Can you put me on your best available plan for my situation?","c":2,"k":"s","ps":false},{"t":"Then stop talking and let them answer.","c":2,"k":"s","ps":true},{"t":"Be friendly and specific.","c":2,"k":"s","ps":false},{"t":"Name the price you've found, if you have one.","c":2,"k":"s","ps":false},{"t":"If the first person can't help, ask politely whether someone else can, sometimes called the retentions or loyalty team.","c":2,"k":"s","ps":false},{"t":"If they offer a new plan, ask how long any discount lasts, and what the price will be when it ends.","c":2,"k":"s","ps":false},{"t":"Write down the name of the person you spoke to, the date, and any reference number.","c":2,"k":"s","ps":false},{"t":"And before you agree, ask them to email you the new plan details, so you can check the price matches what you were told.","c":2,"k":"s","ps":false},{"t":"A few other questions are worth asking on the same call.","c":2,"k":"s","ps":true},{"t":"Is there a discount for paying on time, or for paying by direct debit?","c":2,"k":"s","ps":false},{"t":"Am I on the right plan for how I actually use this service?","c":2,"k":"s","ps":false},{"t":"Are there any fees I'm paying that I could avoid, such as paper bill fees or card payment fees?","c":2,"k":"s","ps":false},{"t":"Small fees can add up over a year, and they're often dropped as soon as you ask.","c":2,"k":"s","ps":false},{"t":"So when should you switch instead of staying?","c":2,"k":"s","ps":true},{"t":"If your provider won't come close to the better offer, switching is usually simple.","c":2,"k":"s","ps":false},{"t":"For energy, your new retailer normally handles the change for you, and the power doesn't go off.","c":2,"k":"s","ps":false},{"t":"For phones, you can usually keep your number, but check whether you still owe money on a handset or a contract.","c":2,"k":"s","ps":false},{"t":"For insurance, make sure the new policy starts before the old one ends, so there's no gap in cover.","c":2,"k":"s","ps":false},{"t":"If something goes wrong and you can't sort it out with the company, there are free, independent ombudsman services.","c":2,"k":"s","ps":true},{"t":"Most states have an energy and water ombudsman, the Telecommunications Industry Ombudsman handles phone and internet, and the Australian Financial Complaints Authority handles insurance.","c":2,"k":"s","ps":false},{"t":"The government's Moneysmart website also has plain guides on comparing insurance and other everyday costs.","c":2,"k":"s","ps":false},{"t":"Finally, make it a habit.","c":2,"k":"s","ps":true},{"t":"Put a reminder in your calendar once a year, perhaps a month before your insurance renews, to run through every bill.","c":2,"k":"s","ps":false},{"t":"An hour of comparing and a couple of phone calls is often one of the best paid hours of your year.","c":2,"k":"s","ps":false},{"t":"Let's recap.","c":2,"k":"s","ps":true},{"t":"Loyalty often costs money, and long-standing customers can pay hundreds of dollars more than new ones.","c":2,"k":"s","ps":false},{"t":"Use independent comparison tools like Energy Made Easy, check your renewal notices, and then call and ask for the best plan available.","c":2,"k":"s","ps":false},{"t":"If they won't match it, switching is usually easier than you think.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. According to the ACCC's December 2025 report, roughly how much more were households on electricity plans older than three years paying?","c":3,"k":"q","ps":false},{"t":"Answer. About $221 a year more.","c":3,"k":"a","ps":false},{"t":"Question two. What's the name of the Australian Government's free energy comparison website?","c":3,"k":"q","ps":false},{"t":"Answer. Energy Made Easy. Victorians can also use Victorian Energy Compare.","c":3,"k":"a","ps":false},{"t":"Question three. When comparing insurance, what should you check as well as the price?","c":3,"k":"q","ps":false},{"t":"Answer. The cover, including the excess, the sum insured and what's actually included.","c":3,"k":"a","ps":false},{"t":"That's the end of Cutting Your Everyday Bills. See you on the next one.","c":3,"k":"end","ps":false}]},"blind2":{"chapters":["Two ski trips, one weekend","Why we throw good after bad","The clean slate question"],"at":{"f":[0.3,3.43,6.59,8.75,12.57,17.34,20.1,22.95,27.77,29.49,31.27,34.4,36.28,42.2,46.5,57.03,63.85,67.24,71.13,76.36,84.51,87.13,92.77,96.36,104.16,107.1,110.95,112.88,117.95,124.81,129.14,132.55,139.33,141.84,149.48,159.76,163.82,168.61,174.04,176.95,180.09,185.86,187.9,192.24,194.19,196.44,202.13,204.24,207.04,210.97,223.94,229.33,232.77,236.82,238.86,245.71,252.7,255.42,266.23,268.86,272.85,276.09,279.16,284.24,290.18,297.83,301.22,302.92,306.68,310.93,316.66,321.41,326.49,329.36,338.4,344.75,349.29,354.8,360.95,365.05,370.48,377.62,381.16,385.41,387.32,389.09,391.2,396.88,400.45,404.48,409.89,415.74,418.3,424.03,426.62,432.21,435.24,439.29,444.04,446.56,451.73,453.73,456.13,461.88,463.15,472.22,478.52,485.41,489.09,497.88,503.19,513.73,516.89,523.43,529.13],"m":[0.3,3.5,6.8,9.2,13.52,18.79,21.96,24.97,30.31,32.25,34.12,37.52,39.56,46.26,51.15,62.9,70.47,74.1,78.29,84.05,92.84,95.87,102.1,105.92,114.77,117.94,122.35,124.41,129.73,137.3,142.1,146.03,153.57,156.28,164.69,175.77,180.38,185.72,191.54,194.74,198.12,204.41,206.73,211.56,213.76,216.15,222.55,224.79,228.05,232.34,246.78,252.72,256.37,260.72,263.11,270.63,278.03,280.76,292.35,295.14,299.44,303.03,306.46,312.38,318.73,327.17,330.71,332.55,336.78,341.41,347.3,352.46,358.06,361.21,370.88,377.65,382.66,388.53,395.75,400.46,406.65,414.78,418.95,423.66,425.6,427.67,429.99,436.33,440.24,444.74,450.51,457.05,459.9,466.03,468.77,474.8,478.09,482.6,487.94,490.68,496.43,498.56,501.13,507.49,508.86,518.26,525.31,532.85,536.93,546.18,551.88,563.05,566.34,573.33,579.32]},"dur":{"f":533.6,"m":584.2},"units":[{"t":"The Sunk Cost Trap.","c":-1,"k":"title","ps":false},{"t":"Part one. Two ski trips, one weekend.","c":0,"k":"head","ps":false},{"t":"Here's a little dilemma to start with.","c":0,"k":"s","ps":true},{"t":"A few months ago, you paid $100 for a ski weekend.","c":0,"k":"s","ps":false},{"t":"Then you spotted a cheaper deal and booked a second ski weekend for $50.","c":0,"k":"s","ps":false},{"t":"You're fairly sure you'll enjoy the cheaper one more.","c":0,"k":"s","ps":false},{"t":"Better snow, better company, shorter drive.","c":0,"k":"s","ps":false},{"t":"Now you realise both trips are on the same weekend, and neither can be refunded.","c":0,"k":"s","ps":false},{"t":"You can only go on one.","c":0,"k":"s","ps":false},{"t":"Which do you choose?","c":0,"k":"s","ps":false},{"t":"The sensible answer is the one you'll enjoy more.","c":0,"k":"s","ps":true},{"t":"The money is gone either way.","c":0,"k":"s","ps":false},{"t":"Whatever you pick, you've spent $150, and nothing you do now will bring any of it back.","c":0,"k":"s","ps":false},{"t":"The only thing still in play is how good your weekend is going to be.","c":0,"k":"s","ps":false},{"t":"Yet when the psychologists Hal Arkes and Catherine Blumer put this exact dilemma to students in 1985, more than half of them chose the $100 trip.","c":0,"k":"s","ps":true},{"t":"In their version, the trips were to Michigan and Wisconsin, and the students were told they'd enjoy Wisconsin more.","c":0,"k":"s","ps":false},{"t":"They still picked the dearer trip they expected to like less.","c":0,"k":"s","ps":false},{"t":"Somehow, the bigger payment felt like it deserved to be used.","c":0,"k":"s","ps":false},{"t":"Arkes and Blumer then took the idea out of the questionnaire and into the real world.","c":0,"k":"s","ps":true},{"t":"At the ticket window of a university theatre company in Ohio, people buying season tickets were quietly split into three groups.","c":0,"k":"s","ps":false},{"t":"Some paid the full price of $15.","c":0,"k":"s","ps":false},{"t":"Others, chosen at random, got a surprise discount of either $2 or $7.","c":0,"k":"s","ps":false},{"t":"Then the researchers simply tracked who turned up to the plays.","c":0,"k":"s","ps":false},{"t":"Over the first half of the season, the people who had paid full price went to noticeably more shows than the people who'd been given a discount.","c":0,"k":"s","ps":false},{"t":"Same plays, same seats, same free evenings.","c":0,"k":"s","ps":false},{"t":"The only difference was how much they'd already handed over.","c":0,"k":"s","ps":false},{"t":"This is the sunk cost trap.","c":0,"k":"s","ps":true},{"t":"A sunk cost is money, time or effort that you've already spent and can't get back.","c":0,"k":"s","ps":false},{"t":"The trap is letting that spent amount steer your next decision, when really only the future costs and benefits should count.","c":0,"k":"s","ps":false},{"t":"It's why people sit through a dreadful film because they paid for the ticket.","c":0,"k":"s","ps":false},{"t":"It's why we finish a meal we don't want because it wasn't cheap.","c":0,"k":"s","ps":false},{"t":"And it's why a car that keeps breaking down can feel impossible to sell, because you've just put new tyres on it.","c":0,"k":"s","ps":false},{"t":"The trap also has a famous nickname.","c":0,"k":"s","ps":true},{"t":"It's sometimes called the Concorde fallacy, after the supersonic passenger jet developed by the British and French governments.","c":0,"k":"s","ps":false},{"t":"Costs ballooned through the 1960s and 1970s, and it became clear the plane was very unlikely ever to earn back what had been spent.","c":0,"k":"s","ps":false},{"t":"Work carried on anyway, partly because so much had already gone in.","c":0,"k":"s","ps":false},{"t":"Concorde was a technical marvel, but only fourteen ever flew with airlines.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll look at why our minds cling to spent money so stubbornly.","c":0,"k":"s","ps":false},{"t":"Part two. Why we throw good after bad.","c":1,"k":"head","ps":false},{"t":"There isn't just one reason we fall for sunk costs.","c":1,"k":"s","ps":true},{"t":"Several forces push in the same direction, and knowing them makes the trap easier to spot.","c":1,"k":"s","ps":false},{"t":"The first is that we hate waste.","c":1,"k":"s","ps":true},{"t":"Most of us were raised to finish what's on the plate and not to throw things out.","c":1,"k":"s","ps":false},{"t":"That's usually a good instinct.","c":1,"k":"s","ps":false},{"t":"But the sunk cost trap hijacks it.","c":1,"k":"s","ps":false},{"t":"Walking away from a bad investment feels like wasting it, even though the waste has already happened.","c":1,"k":"s","ps":false},{"t":"Staying doesn't un-waste the money.","c":1,"k":"s","ps":false},{"t":"It just adds more time or money on top.","c":1,"k":"s","ps":false},{"t":"The second reason is that losses hurt more than gains feel good.","c":1,"k":"s","ps":true},{"t":"Daniel Kahneman and Amos Tversky, two of the most influential researchers in this field, showed that losing $100 tends to feel roughly twice as bad as winning $100 feels good.","c":1,"k":"s","ps":false},{"t":"As long as you keep going, the loss stays open, and there's still a chance it might turn around.","c":1,"k":"s","ps":false},{"t":"The moment you stop, the loss becomes real and final.","c":1,"k":"s","ps":false},{"t":"So we keep going, hoping to avoid ever having to feel it.","c":1,"k":"s","ps":false},{"t":"The third reason is about pride.","c":1,"k":"s","ps":true},{"t":"In 1976, the organisational psychologist Barry Staw ran a study with business students.","c":1,"k":"s","ps":false},{"t":"Each student played a company executive deciding how to split research money between two divisions of a company.","c":1,"k":"s","ps":false},{"t":"Then they learned how their choice had turned out.","c":1,"k":"s","ps":false},{"t":"When the division they'd backed had done badly, students who had made that original call themselves went on to pour more money into it than students who had inherited the decision from someone else.","c":1,"k":"s","ps":false},{"t":"Staw called this escalation of commitment.","c":1,"k":"s","ps":false},{"t":"Pulling out would have meant admitting the first decision was a mistake.","c":1,"k":"s","ps":false},{"t":"Putting in more money kept that admission at bay.","c":1,"k":"s","ps":false},{"t":"You can see all three forces in ordinary life.","c":1,"k":"s","ps":true},{"t":"Someone stays in a course they no longer want to finish because they've done two years of it.","c":1,"k":"s","ps":false},{"t":"A couple keeps pouring money into a renovation that has blown out, rather than stopping and rethinking.","c":1,"k":"s","ps":false},{"t":"A person on hold with a call centre for forty minutes refuses to hang up, even though calling back tomorrow morning would be quicker.","c":1,"k":"s","ps":false},{"t":"In each case, the past is doing the deciding.","c":1,"k":"s","ps":false},{"t":"It's worth being fair here.","c":1,"k":"s","ps":true},{"t":"Not every decision to keep going is a sunk cost mistake.","c":1,"k":"s","ps":false},{"t":"Sometimes what you've already put in has genuinely changed the future.","c":1,"k":"s","ps":false},{"t":"Two years of study might mean you're only one semester from a qualification that's worth having.","c":1,"k":"s","ps":false},{"t":"The question is whether you're staying for what lies ahead, or for what's behind you.","c":1,"k":"s","ps":false},{"t":"In the final part, we'll look at some practical ways to tell the difference.","c":1,"k":"s","ps":false},{"t":"Part three. The clean slate question.","c":2,"k":"head","ps":false},{"t":"One of the best escapes from the sunk cost trap comes from a story told by Andy Grove, the long-time leader of the computer chip maker Intel.","c":2,"k":"s","ps":true},{"t":"In 1985, Intel was losing badly in the memory chip business it had been built on.","c":2,"k":"s","ps":false},{"t":"Grove and his colleague Gordon Moore had been agonising over it for months.","c":2,"k":"s","ps":false},{"t":"In his book Only the Paranoid Survive, Grove describes asking Moore a simple question.","c":2,"k":"s","ps":false},{"t":"To paraphrase it, if the board kicked us out and brought in a new chief executive, what would that person do?","c":2,"k":"s","ps":false},{"t":"Moore answered straight away that the new boss would get out of memory chips.","c":2,"k":"s","ps":false},{"t":"So Grove suggested, in effect, that they walk out the door, come back in, and do it themselves.","c":2,"k":"s","ps":false},{"t":"They did, and Intel went on to focus on the microprocessors that powered a generation of personal computers.","c":2,"k":"s","ps":false},{"t":"That's the clean slate question, and you can use it on anything.","c":2,"k":"s","ps":true},{"t":"If I were starting fresh today, knowing what I know now, would I choose this?","c":2,"k":"s","ps":false},{"t":"Would I buy this ticket tonight?","c":2,"k":"s","ps":false},{"t":"Would I enrol in this course?","c":2,"k":"s","ps":false},{"t":"Would I buy this car at this price?","c":2,"k":"s","ps":false},{"t":"If the honest answer is no, then what you've already spent is the only thing keeping you there.","c":2,"k":"s","ps":false},{"t":"A second tool is to decide your exit point in advance.","c":2,"k":"s","ps":true},{"t":"Before you start something uncertain, choose the point at which you'd stop.","c":2,"k":"s","ps":false},{"t":"For a renovation, that might be a total budget you won't go past without a proper rethink.","c":2,"k":"s","ps":false},{"t":"For a new business idea, it might be a date by which you need to see a certain number of paying customers.","c":2,"k":"s","ps":false},{"t":"For a film, it might be the half-hour mark.","c":2,"k":"s","ps":false},{"t":"It's much easier to walk away when your calmer, earlier self has already given you permission.","c":2,"k":"s","ps":false},{"t":"A third tool is to borrow some distance.","c":2,"k":"s","ps":true},{"t":"Staw's study showed that people who didn't make the original decision were better at letting it go.","c":2,"k":"s","ps":false},{"t":"So ask someone who wasn't part of the first choice.","c":2,"k":"s","ps":false},{"t":"Or imagine a friend describing your exact situation to you.","c":2,"k":"s","ps":false},{"t":"It's often obvious what they should do, even when it isn't obvious for you.","c":2,"k":"s","ps":false},{"t":"And finally, change the words you use.","c":2,"k":"s","ps":true},{"t":"Instead of saying, I'd be wasting what I spent, try saying, that money is already gone.","c":2,"k":"s","ps":false},{"t":"It sounds harsh, but it's freeing.","c":2,"k":"s","ps":false},{"t":"The money was spent the moment you paid it.","c":2,"k":"s","ps":false},{"t":"The only decision left is what to do with the next hour, the next dollar, or the next year.","c":2,"k":"s","ps":false},{"t":"Let's recap.","c":2,"k":"s","ps":true},{"t":"A sunk cost is anything you've already spent and can't recover, and the trap is letting it drive decisions that should depend only on the future.","c":2,"k":"s","ps":false},{"t":"We fall for it because we hate waste, because losses sting, and because stopping means admitting a mistake.","c":2,"k":"s","ps":false},{"t":"To escape, ask the clean slate question, set your exit point in advance, and get an outside view.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In the theatre ticket study, who went to more plays early in the season?","c":3,"k":"q","ps":false},{"t":"Answer. The people who paid full price, rather than those given a discount.","c":3,"k":"a","ps":false},{"t":"Question two. What did Barry Staw call our tendency to keep investing in a failing decision we made ourselves?","c":3,"k":"q","ps":false},{"t":"Answer. Escalation of commitment.","c":3,"k":"a","ps":false},{"t":"Question three. What's the clean slate question?","c":3,"k":"q","ps":false},{"t":"Answer. If I were starting fresh today, knowing what I know now, would I choose this?","c":3,"k":"a","ps":false},{"t":"That's the end of The Sunk Cost Trap. See you in the next one.","c":3,"k":"end","ps":false}]},"blind3":{"chapters":["The rigged wheel","Anchors all around you","Pulling up the anchor"],"at":{"f":[0.3,4.01,6.33,8.31,13.02,14.54,17.69,20.2,27.78,33.39,37.8,39.6,41.61,46.29,49.61,54.45,56.97,58.19,67.03,75.55,79.68,85.88,92.03,97.5,103.11,107.48,110.62,124.61,131.07,136.51,141.38,144.83,149.01,156.13,158.93,162.77,164.01,170.01,173.31,178.21,184.14,185.67,193.15,200.67,203.22,210.59,221.95,225.12,230.88,236.52,242.74,248.84,250.73,251.87,263.07,267.44,271.78,276.62,281.82,289.11,294.54,297.55,302.06,305.92,310.31,312.47,314.9,320.01,325.06,329.17,335.9,339.88,343.32,345.92,348.54,350.14,353.72,356.69,359.31,363.33,369.17,373.42,378.64,384.1,388.52,390.16,400.1,406.59,412.07,417.23,419.94,428.82,430.64,435.72,438.61,443.97,446.83,454.05,458.64,462.55,463.83,471.74,477.59,487.26,490.94,500.6,508.06,517.5,520.69,528.03,533.11],"m":[0.3,4.07,6.45,8.6,13.94,15.59,19.06,22.01,30.57,36.85,41.87,43.78,46.09,51.17,54.99,60.21,62.95,64.3,73.86,82.93,87.48,93.98,100.43,106.53,112.96,117.57,120.88,136.47,143.69,149.55,154.91,158.91,163.45,171.36,174.22,178.51,179.84,186.79,190.54,195.76,202.44,204.05,212.32,220.33,223.14,231.43,244.0,247.54,254.16,260.41,267.57,274.33,276.45,277.71,289.62,294.66,299.41,304.7,310.57,318.6,324.7,327.95,333.0,337.2,342.01,344.37,347.13,352.65,358.28,362.76,370.42,374.89,378.74,381.45,384.12,385.86,389.83,393.17,395.93,400.33,406.99,411.78,417.75,423.74,428.39,430.18,440.71,447.96,454.04,459.81,462.99,472.69,474.8,480.37,483.46,489.43,492.72,500.61,505.82,510.16,511.53,520.25,526.47,537.22,541.3,551.34,559.49,569.33,572.69,580.5,586.14]},"dur":{"f":537.6,"m":590.9},"units":[{"t":"Anchoring: The First Number Wins.","c":-1,"k":"title","ps":false},{"t":"Part one. The rigged wheel.","c":0,"k":"head","ps":false},{"t":"Let's start with a quick question.","c":0,"k":"s","ps":true},{"t":"Did Mahatma Gandhi die before or after the age of one hundred and forty?","c":0,"k":"s","ps":false},{"t":"Obviously before.","c":0,"k":"s","ps":false},{"t":"Now, roughly how old do you think he was when he died?","c":0,"k":"s","ps":false},{"t":"Hold your guess in your head for a moment.","c":0,"k":"s","ps":false},{"t":"In 1997, the German psychologists Fritz Strack and Thomas Mussweiler asked people almost exactly that.","c":0,"k":"s","ps":true},{"t":"One group was asked whether Gandhi died before or after the age of one hundred and forty.","c":0,"k":"s","ps":false},{"t":"Another group was asked whether he died before or after the age of nine.","c":0,"k":"s","ps":false},{"t":"Both questions are silly.","c":0,"k":"s","ps":false},{"t":"Nobody learns anything from them.","c":0,"k":"s","ps":false},{"t":"Yet when both groups were then asked for their best guess, the answers split apart.","c":0,"k":"s","ps":false},{"t":"The group that heard nine guessed, on average, about fifty.","c":0,"k":"s","ps":false},{"t":"The group that heard one hundred and forty guessed, on average, about sixty-seven.","c":0,"k":"s","ps":false},{"t":"Gandhi was actually seventy-eight.","c":0,"k":"s","ps":false},{"t":"That's anchoring.","c":0,"k":"s","ps":true},{"t":"When we have to estimate a number, the first number we come across tends to pull our estimate towards it, even when we know that number is meaningless.","c":0,"k":"s","ps":false},{"t":"The classic demonstration came from Amos Tversky and Daniel Kahneman, in a famous paper published in 1974.","c":0,"k":"s","ps":true},{"t":"They showed people a wheel of fortune, marked from nought to one hundred.","c":0,"k":"s","ps":false},{"t":"What the participants didn't know was that the wheel was rigged to stop at either ten or sixty-five.","c":0,"k":"s","ps":false},{"t":"After the spin, people were asked what percentage of the countries in the United Nations were African.","c":0,"k":"s","ps":false},{"t":"Those who saw the wheel land on ten gave a typical answer of about twenty-five per cent.","c":0,"k":"s","ps":false},{"t":"Those who saw it land on sixty-five gave a typical answer of about forty-five per cent.","c":0,"k":"s","ps":false},{"t":"A random spin of a wheel shifted their answers by twenty points.","c":0,"k":"s","ps":false},{"t":"Later researchers pushed the idea even further.","c":0,"k":"s","ps":true},{"t":"In a study published in 2003, Dan Ariely, George Loewenstein and Drazen Prelec asked students at the Massachusetts Institute of Technology to write down the last two digits of their American social security number.","c":0,"k":"s","ps":false},{"t":"Then the students bid on everyday items, such as a cordless keyboard, some chocolates and bottles of wine.","c":0,"k":"s","ps":false},{"t":"Students whose numbers happened to be high bid far more than students whose numbers were low.","c":0,"k":"s","ps":false},{"t":"For some items, the top group bid around three times as much as the bottom group.","c":0,"k":"s","ps":false},{"t":"An arbitrary number had set the price in their heads.","c":0,"k":"s","ps":false},{"t":"So anchors don't have to be relevant, and they don't have to be believable.","c":0,"k":"s","ps":true},{"t":"In the next part, we'll look at where anchors show up in everyday life, and why even experts fall for them.","c":0,"k":"s","ps":false},{"t":"Part two. Anchors all around you.","c":1,"k":"head","ps":false},{"t":"Once you know about anchoring, you start noticing anchors everywhere.","c":1,"k":"s","ps":true},{"t":"Take shopping.","c":1,"k":"s","ps":false},{"t":"A jacket marked was $300, now $149, feels like a bargain.","c":1,"k":"s","ps":false},{"t":"But the $300 is doing most of the work.","c":1,"k":"s","ps":false},{"t":"It sets the reference point, and $149 looks small next to it.","c":1,"k":"s","ps":false},{"t":"The same jacket simply priced at $149 would feel much more ordinary.","c":1,"k":"s","ps":false},{"t":"Menus do it too.","c":1,"k":"s","ps":true},{"t":"A very expensive dish near the top can make the other mains look reasonable by comparison, even if you'd never order it.","c":1,"k":"s","ps":false},{"t":"Some wine lists work the same way, with one eye-watering bottle that quietly makes the second cheapest look sensible.","c":1,"k":"s","ps":false},{"t":"Anchors are powerful in negotiations.","c":1,"k":"s","ps":true},{"t":"When you're buying a used car or selling a couch online, the first number put on the table tends to shape where the deal ends up.","c":1,"k":"s","ps":false},{"t":"Research by Adam Galinsky and Thomas Mussweiler found that whoever makes the first offer often gets a better result, because that offer becomes the anchor for everything that follows.","c":1,"k":"s","ps":false},{"t":"Sometimes the anchor is a number from your own past.","c":1,"k":"s","ps":true},{"t":"If you bought a house or a share at a certain price, that figure can stay lodged in your head for years.","c":1,"k":"s","ps":false},{"t":"Every later offer gets judged against it, even though the market has no idea what you paid.","c":1,"k":"s","ps":false},{"t":"The same thing happens with the price you remember paying for a coffee or a tank of petrol a few years ago.","c":1,"k":"s","ps":false},{"t":"An old number can make a fair price today feel like a rip-off, or a poor deal feel like a steal.","c":1,"k":"s","ps":false},{"t":"Surely experts are immune?","c":1,"k":"s","ps":true},{"t":"Not really.","c":1,"k":"s","ps":false},{"t":"In a study from 1987, Gregory Northcraft and Margaret Neale took real estate agents in Arizona through a house for sale and gave them a pack of information about it.","c":1,"k":"s","ps":false},{"t":"The only thing that changed between groups was the listing price in the pack.","c":1,"k":"s","ps":false},{"t":"The agents' own valuations moved up and down with that listing price.","c":1,"k":"s","ps":false},{"t":"And when asked, most of the agents said the listing price hadn't influenced them.","c":1,"k":"s","ps":false},{"t":"Perhaps the most unsettling study involved judges and prosecutors in Germany.","c":1,"k":"s","ps":true},{"t":"Birte Englich, Thomas Mussweiler and Fritz Strack gave experienced legal professionals a realistic shoplifting case.","c":1,"k":"s","ps":false},{"t":"Before deciding a sentence, each one rolled a pair of dice to get the prosecutor's demand.","c":1,"k":"s","ps":false},{"t":"The dice were loaded to land on either three or nine.","c":1,"k":"s","ps":false},{"t":"Those who rolled nine gave sentences of about eight months, on average.","c":1,"k":"s","ps":false},{"t":"Those who rolled three gave sentences of about five months.","c":1,"k":"s","ps":false},{"t":"These were trained professionals, and they knew the number came from dice.","c":1,"k":"s","ps":false},{"t":"Why is anchoring so hard to shake?","c":1,"k":"s","ps":true},{"t":"Researchers think two things are going on.","c":1,"k":"s","ps":false},{"t":"The first is that we start from the anchor and adjust away from it, but we stop too soon.","c":1,"k":"s","ps":false},{"t":"Once an answer feels plausible, we settle, and that's usually still on the anchor's side.","c":1,"k":"s","ps":false},{"t":"The second is that an anchor quietly primes the evidence we think about.","c":1,"k":"s","ps":false},{"t":"If someone asks whether a house is worth more than a million dollars, your mind starts looking for reasons it could be.","c":1,"k":"s","ps":false},{"t":"Those reasons then feel convincing when you make your own estimate.","c":1,"k":"s","ps":false},{"t":"So what can you do about something that works even on judges?","c":1,"k":"s","ps":false},{"t":"That's where we're going next.","c":1,"k":"s","ps":false},{"t":"Part three. Pulling up the anchor.","c":2,"k":"head","ps":false},{"t":"The honest news first.","c":2,"k":"s","ps":true},{"t":"Anchoring is one of the most stubborn biases in psychology.","c":2,"k":"s","ps":false},{"t":"Simply being warned about it doesn't make it go away.","c":2,"k":"s","ps":false},{"t":"But there are habits that weaken its grip.","c":2,"k":"s","ps":false},{"t":"The first habit is to set your own anchor before anyone else does.","c":2,"k":"s","ps":true},{"t":"Before you look at a price tag, a quote or an asking price, decide roughly what you think it's worth.","c":2,"k":"s","ps":false},{"t":"Before you walk into a car yard, check what similar cars have sold for.","c":2,"k":"s","ps":false},{"t":"Before you ask a tradie for a quote, have a rough idea of what the job usually costs.","c":2,"k":"s","ps":false},{"t":"If you arrive with your own number, the other person's number has less room to take over.","c":2,"k":"s","ps":false},{"t":"The second habit might sound familiar from the first episode of this series.","c":2,"k":"s","ps":true},{"t":"Consider the opposite.","c":2,"k":"s","ps":false},{"t":"In a study published in 2000, Thomas Mussweiler, Fritz Strack and Tim Pfeiffer asked car experts to value a used car after hearing a seller's price.","c":2,"k":"s","ps":false},{"t":"When the experts were first asked to list reasons why that price might be wrong, the anchor's pull shrank noticeably.","c":2,"k":"s","ps":false},{"t":"So when you hear a number, ask yourself, what are the reasons this might be too high, or too low?","c":2,"k":"s","ps":false},{"t":"That simple question makes you gather the evidence the anchor was steering you away from.","c":2,"k":"s","ps":false},{"t":"The third habit is to compare like with like.","c":2,"k":"s","ps":true},{"t":"In Australian supermarkets, the larger stores have to show a unit price on the shelf label, such as the price per hundred grams or per litre.","c":2,"k":"s","ps":false},{"t":"That little number is your friend.","c":2,"k":"s","ps":false},{"t":"It ignores the was price and the special sticker and tells you what you're actually paying.","c":2,"k":"s","ps":false},{"t":"The same idea works for bigger purchases.","c":2,"k":"s","ps":false},{"t":"Compare the actual cost with other options, not with the number the seller first showed you.","c":2,"k":"s","ps":false},{"t":"The fourth habit is to use anchors on purpose.","c":2,"k":"s","ps":true},{"t":"If you're selling something, it often pays to name a sensible but ambitious first number, rather than waiting to hear theirs.","c":2,"k":"s","ps":false},{"t":"And if someone throws out an outrageous anchor at you, don't just argue around it.","c":2,"k":"s","ps":false},{"t":"Name it, set it aside, and put your own number on the table.","c":2,"k":"s","ps":false},{"t":"Let's recap.","c":2,"k":"s","ps":true},{"t":"The first number we hear tends to drag our estimates towards it, even when it came from a wheel of fortune or a roll of the dice.","c":2,"k":"s","ps":false},{"t":"It works on shoppers, estate agents and judges, and being warned isn't enough to stop it.","c":2,"k":"s","ps":false},{"t":"Your best defences are to set your own number first, consider why the anchor might be wrong, and compare real costs rather than starting prices.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In the Gandhi study, what happened to people who first heard the number one hundred and forty?","c":3,"k":"q","ps":false},{"t":"Answer. They guessed he died older, at about sixty-seven, compared with about fifty for the group who heard nine.","c":3,"k":"a","ps":false},{"t":"Question two. In the German sentencing study, how was the prosecutor's demand decided?","c":3,"k":"q","ps":false},{"t":"Answer. By rolling loaded dice.","c":3,"k":"a","ps":false},{"t":"Question three. What's one good habit for resisting an anchor?","c":3,"k":"q","ps":false},{"t":"Answer. Set your own number first, or ask why the anchor might be wrong.","c":3,"k":"a","ps":false},{"t":"That's the end of Anchoring: The First Number Wins. Well done.","c":3,"k":"end","ps":false}]},"blind4":{"chapters":["The essay nobody chose","The hurried Samaritans","Writing the other story"],"at":{"f":[0.3,3.97,6.98,8.77,13.28,14.74,20.62,23.27,26.31,33.31,37.86,41.58,44.94,49.52,57.47,65.94,70.36,73.8,76.81,78.4,82.99,87.83,92.79,93.91,101.81,108.41,115.62,119.62,124.94,132.88,135.09,138.5,147.55,151.14,155.77,157.15,160.05,166.14,171.18,176.42,181.9,193.77,197.88,206.45,209.27,217.57,223.38,228.77,237.35,241.12,244.89,249.63,251.27,252.87,254.43,258.2,260.44,261.61,266.37,270.5,277.31,282.55,286.2,289.13,292.06,297.33,299.54,312.36,319.75,327.38,335.12,337.21,343.41,352.38,354.54,359.0,361.56,364.3,366.53,374.35,376.01,378.27,389.94,397.16,407.66,410.8,416.5,420.78,422.79,428.96,431.79,434.37,442.01,445.6,449.79,452.01,458.88,467.21,469.97,478.69,481.22,484.67,485.94,494.98,502.01,510.86,514.54,524.07,527.04,535.88,541.14,549.73,556.54],"m":[0.3,4.29,7.43,9.44,14.6,16.23,22.56,25.5,28.82,36.82,41.82,46.07,49.83,54.99,63.56,72.74,77.68,81.54,84.98,86.73,91.64,97.12,102.61,103.8,112.39,119.33,127.22,131.42,136.96,145.46,147.79,151.37,161.06,165.1,170.24,171.82,175.18,182.12,187.67,193.53,199.51,211.94,216.32,225.71,228.67,237.71,243.98,249.63,258.88,263.15,267.27,272.36,274.17,275.94,277.64,281.74,284.27,285.58,290.85,295.51,302.89,308.8,312.48,315.97,319.35,325.12,327.44,341.84,349.74,357.97,366.22,368.5,375.31,385.14,387.53,392.61,395.37,398.27,400.6,408.81,410.64,413.17,426.18,434.33,445.7,448.96,455.41,460.21,462.41,469.36,472.42,475.53,483.63,4
