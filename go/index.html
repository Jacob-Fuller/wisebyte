2.41,1050.43,1058.63,1063.54,1068.61,1072.69,1084.74,1089.43,1101.58,1107.6,1114.97,1119.99]},"dur":{"f":1024.7,"m":1125.5},"units":[{"t":"How Habits Actually Form.","c":-1,"k":"title","ps":false},{"t":"Part one. Life on autopilot.","c":0,"k":"head","ps":false},{"t":"Think back to this morning.","c":0,"k":"s","ps":true},{"t":"Which side of the bed did you get out of?","c":0,"k":"s","ps":false},{"t":"Which shoe did you put on first?","c":0,"k":"s","ps":false},{"t":"What did you do with your hands while the kettle boiled?","c":0,"k":"s","ps":false},{"t":"Chances are you can't quite remember, and that's not because your memory is bad.","c":0,"k":"s","ps":false},{"t":"It's because you weren't really deciding any of it.","c":0,"k":"s","ps":false},{"t":"You were running on habit.","c":0,"k":"s","ps":false},{"t":"In the late 1890s, the American psychologist William James wrote that all our life, so far as it has definite form, is but a mass of habits.","c":0,"k":"s","ps":true},{"t":"More than a century later, researchers set out to measure how true that was.","c":0,"k":"s","ps":false},{"t":"In a diary study published in 2002, the psychologist Wendy Wood and her colleagues asked university students to note down what they were doing, thinking and feeling.","c":0,"k":"s","ps":false},{"t":"They made an entry once an hour, through the day.","c":0,"k":"s","ps":false},{"t":"About forty-three per cent of their actions were things they did almost every day, in the same place, usually while thinking about something else entirely.","c":0,"k":"s","ps":false},{"t":"That's close to half of daily life on something like autopilot.","c":0,"k":"s","ps":false},{"t":"So what exactly is a habit?","c":0,"k":"s","ps":true},{"t":"In everyday speech we use the word for anything we do often.","c":0,"k":"s","ps":false},{"t":"Researchers mean something narrower.","c":0,"k":"s","ps":false},{"t":"A habit is a behaviour that's triggered automatically by a situation, because you've done it in that situation many times before.","c":0,"k":"s","ps":false},{"t":"The key word is automatically.","c":0,"k":"s","ps":false},{"t":"You don't weigh it up.","c":0,"k":"s","ps":false},{"t":"The situation calls the action out of you, often before you've noticed.","c":0,"k":"s","ps":false},{"t":"That's different from a routine you choose each time.","c":0,"k":"s","ps":true},{"t":"If you go for a run because you've decided you want to be fitter, and you have to talk yourself into it every morning, that's a goal-driven behaviour.","c":0,"k":"s","ps":false},{"t":"It becomes a habit when putting on your running shoes after your morning coffee just happens, the way checking your mirrors happens when you change lanes.","c":0,"k":"s","ps":false},{"t":"Some of the clearest evidence for what's going on in the brain comes from the laboratory of Ann Graybiel at the Massachusetts Institute of Technology.","c":0,"k":"s","ps":true},{"t":"Her team recorded activity in a region deep in the brain called the basal ganglia while rats learned to run a simple T-shaped maze to find a food reward.","c":0,"k":"s","ps":false},{"t":"Early in training, the neurons were busy throughout the run, as the rat sniffed, hesitated and worked things out.","c":0,"k":"s","ps":false},{"t":"As the route became familiar, something striking happened.","c":0,"k":"s","ps":false},{"t":"The activity bunched up at the beginning and the end of the run, and went fairly quiet in the middle.","c":0,"k":"s","ps":false},{"t":"Researchers call this chunking.","c":0,"k":"s","ps":true},{"t":"The brain packages a sequence of actions into a single unit, marked by a clear start signal and a clear finish.","c":0,"k":"s","ps":false},{"t":"Once the chunk is triggered, it tends to run through to the end with little supervision.","c":0,"k":"s","ps":false},{"t":"Think of reversing out of your driveway.","c":0,"k":"s","ps":false},{"t":"Dozens of small movements, but you experience it as one smooth action, started by getting into the car.","c":0,"k":"s","ps":false},{"t":"This is why habits are so useful.","c":0,"k":"s","ps":true},{"t":"They free up attention for other things.","c":0,"k":"s","ps":false},{"t":"Imagine consciously deciding every movement involved in brushing your teeth.","c":0,"k":"s","ps":false},{"t":"But it's also why habits can be so stubborn.","c":0,"k":"s","ps":false},{"t":"A chunk that runs without supervision doesn't stop to ask whether it's still a good idea.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll look at the ingredients that build a habit in the first place.","c":0,"k":"s","ps":true},{"t":"You've probably heard them described as cue, routine and reward.","c":0,"k":"s","ps":false},{"t":"That framework is broadly right, but the research adds some surprising twists.","c":0,"k":"s","ps":false},{"t":"Part two. Cues, routines and rewards.","c":1,"k":"head","ps":false},{"t":"The cue, routine and reward loop was made famous by the journalist Charles Duhigg in his 2012 book The Power of Habit.","c":1,"k":"s","ps":true},{"t":"It's a handy summary.","c":1,"k":"s","ps":false},{"t":"A cue triggers a routine, the routine brings a reward, and repeating that loop makes the link stronger.","c":1,"k":"s","ps":false},{"t":"Let's take each part in turn, starting with the one people most often overlook.","c":1,"k":"s","ps":false},{"t":"Cues can be almost anything that reliably comes just before the behaviour.","c":1,"k":"s","ps":true},{"t":"A place, like your kitchen bench.","c":1,"k":"s","ps":false},{"t":"A time of day.","c":1,"k":"s","ps":false},{"t":"Something you've just finished doing, like hanging up your keys.","c":1,"k":"s","ps":false},{"t":"Other people, like the colleague you always grab a coffee with.","c":1,"k":"s","ps":false},{"t":"Even a mood, like the restless boredom that sends your hand to your phone.","c":1,"k":"s","ps":false},{"t":"A lovely study from 2011 shows how powerful place cues are.","c":1,"k":"s","ps":true},{"t":"David Neal, Wendy Wood and their colleagues handed out popcorn to people as they went into a cinema.","c":1,"k":"s","ps":false},{"t":"Some got fresh popcorn.","c":1,"k":"s","ps":false},{"t":"Others got popcorn that had been popped a week earlier, and was stale, chewy and unpleasant.","c":1,"k":"s","ps":false},{"t":"People who rarely ate popcorn at the movies ate much less of the stale stuff, as you'd expect.","c":1,"k":"s","ps":false},{"t":"But people with a strong movie popcorn habit ate just about as much of the stale popcorn as the fresh.","c":1,"k":"s","ps":false},{"t":"They said they didn't like it.","c":1,"k":"s","ps":false},{"t":"They ate it anyway.","c":1,"k":"s","ps":false},{"t":"Then the researchers ran the same test in a different setting, a university meeting room where people watched music videos.","c":1,"k":"s","ps":true},{"t":"There, even the habitual popcorn eaters ate less of the stale popcorn.","c":1,"k":"s","ps":false},{"t":"Outside the cinema, their habit wasn't triggered, so their taste buds got a vote again.","c":1,"k":"s","ps":false},{"t":"The cue, not the craving, was running the show.","c":1,"k":"s","ps":false},{"t":"The routine is the behaviour itself, and the main thing to know is that simple routines become automatic faster than complicated ones.","c":1,"k":"s","ps":true},{"t":"Drinking a glass of water becomes a habit sooner than doing fifty sit-ups.","c":1,"k":"s","ps":false},{"t":"We'll come back to that shortly.","c":1,"k":"s","ps":false},{"t":"Then there's the reward.","c":1,"k":"s","ps":true},{"t":"When a behaviour produces something pleasant, the brain learns to repeat it.","c":1,"k":"s","ps":false},{"t":"Much of our understanding here comes from the neuroscientist Wolfram Schultz, who recorded the activity of dopamine neurons in monkeys receiving drops of juice.","c":1,"k":"s","ps":false},{"t":"He found that these neurons fired most strongly when a reward was better than expected.","c":1,"k":"s","ps":false},{"t":"Once the reward became perfectly predictable, the burst shifted earlier, to the cue that signalled the juice was coming.","c":1,"k":"s","ps":false},{"t":"That's an important twist.","c":1,"k":"s","ps":true},{"t":"Dopamine is often described as a pleasure chemical, but in this research it behaved more like a teaching signal.","c":1,"k":"s","ps":false},{"t":"It says, pay attention, this cue predicts something good.","c":1,"k":"s","ps":false},{"t":"That helps explain why an unpredictable reward, like a message that might or might not be waiting on your phone, can be so compelling.","c":1,"k":"s","ps":false},{"t":"The uncertainty keeps the teaching signal firing.","c":1,"k":"s","ps":false},{"t":"For building a habit, two practical lessons follow.","c":1,"k":"s","ps":true},{"t":"First, rewards work best when they're immediate.","c":1,"k":"s","ps":false},{"t":"The health benefits of exercise arrive in months, which is far too slow for the brain's habit machinery.","c":1,"k":"s","ps":false},{"t":"The good feeling of a hot shower afterwards, or a favourite podcast you only listen to on your walk, arrives right away.","c":1,"k":"s","ps":false},{"t":"Second, it helps if the behaviour itself becomes enjoyable, because then the reward is built in.","c":1,"k":"s","ps":false},{"t":"And here's the final twist, the one that surprises people most.","c":1,"k":"s","ps":true},{"t":"Once a habit is truly established, it can keep going even when the reward has gone.","c":1,"k":"s","ps":false},{"t":"Remember the stale popcorn.","c":1,"k":"s","ps":false},{"t":"Studies in both animals and people have shown the same pattern.","c":1,"k":"s","ps":false},{"t":"Early in learning, behaviour tracks the reward closely.","c":1,"k":"s","ps":false},{"t":"Once the behaviour becomes habitual, it becomes much less sensitive to whether the reward is still there.","c":1,"k":"s","ps":false},{"t":"That's exactly what makes good habits so durable.","c":1,"k":"s","ps":false},{"t":"It's also what makes bad ones so annoying.","c":1,"k":"s","ps":false},{"t":"Which brings us to the question almost everyone asks.","c":1,"k":"s","ps":true},{"t":"How long does all this take?","c":1,"k":"s","ps":false},{"t":"Part three. How long it really takes.","c":2,"k":"head","ps":false},{"t":"You've probably heard that it takes twenty-one days to form a habit.","c":2,"k":"s","ps":true},{"t":"It's one of the most repeated numbers in self-help.","c":2,"k":"s","ps":false},{"t":"It's also, as far as the research goes, not true.","c":2,"k":"s","ps":false},{"t":"The number seems to trace back to an American plastic surgeon called Maxwell Maltz.","c":2,"k":"s","ps":true},{"t":"In his bestselling 1960 book Psycho-Cybernetics, he observed that it seemed to take patients a minimum of about twenty-one days to get used to a change.","c":2,"k":"s","ps":false},{"t":"He was describing things like adjusting to a new face after surgery, or to the loss of a limb.","c":2,"k":"s","ps":false},{"t":"Notice the word minimum, and notice that he wasn't talking about forming habits at all.","c":2,"k":"s","ps":false},{"t":"Over the decades, a surgeon's rough observation got polished into a rule.","c":2,"k":"s","ps":false},{"t":"The first careful study of how long habits really take was led by the health psychologist Phillippa Lally at University College London, and published in 2010.","c":2,"k":"s","ps":true},{"t":"Ninety-six volunteers each chose a new healthy behaviour to do once a day in the same situation.","c":2,"k":"s","ps":false},{"t":"Some picked something simple, like drinking a bottle of water with lunch.","c":2,"k":"s","ps":false},{"t":"Others picked something harder, like running for fifteen minutes before dinner.","c":2,"k":"s","ps":false},{"t":"Every day for twelve weeks, they rated how automatic the behaviour felt.","c":2,"k":"s","ps":false},{"t":"They answered simple questions, such as whether they did it without having to consciously remember, and whether they'd find it hard not to do it.","c":2,"k":"s","ps":false},{"t":"For most people, automaticity rose quickly at first, then gradually levelled off, a bit like learning to drive.","c":2,"k":"s","ps":true},{"t":"The early repetitions made the biggest difference.","c":2,"k":"s","ps":false},{"t":"The average time to reach that levelling off was sixty-six days.","c":2,"k":"s","ps":false},{"t":"But the range was enormous, from eighteen days for some people to an estimated two hundred and fifty-four days for others.","c":2,"k":"s","ps":false},{"t":"And some people's behaviour never became automatic within the study at all.","c":2,"k":"s","ps":false},{"t":"Simpler behaviours tended to become habits faster than more demanding ones.","c":2,"k":"s","ps":false},{"t":"A larger picture arrived in 2024, when a team led by Ben Singh at the University of South Australia pulled together twenty studies involving more than two and a half thousand people.","c":2,"k":"s","ps":true},{"t":"The typical time to form a health habit, they found, was around two to five months.","c":2,"k":"s","ps":false},{"t":"The median sat at about two months, but individual times stretched from as little as four days to nearly a year.","c":2,"k":"s","ps":false},{"t":"That review turned up some interesting details.","c":2,"k":"s","ps":true},{"t":"In one of the studies it included, stretching done in the morning became habitual faster than stretching done in the evening.","c":2,"k":"s","ps":false},{"t":"Across the research, habits that people chose for themselves tended to form more strongly than ones assigned to them.","c":2,"k":"s","ps":false},{"t":"And a stable context, the same time and place each day, helped a great deal.","c":2,"k":"s","ps":false},{"t":"There's another finding from Lally's study that deserves to be much better known.","c":2,"k":"s","ps":true},{"t":"Missing one day didn't make any real difference to how the habit developed.","c":2,"k":"s","ps":false},{"t":"People who skipped an occasional day still got there.","c":2,"k":"s","ps":false},{"t":"This matters because many of us treat a single slip as proof that we've failed, and give up entirely.","c":2,"k":"s","ps":false},{"t":"The research says a missed day is a bump, not a reset.","c":2,"k":"s","ps":false},{"t":"What seems to matter is not letting one missed day turn into a missed fortnight.","c":2,"k":"s","ps":false},{"t":"So the honest answer to how long a habit takes is this.","c":2,"k":"s","ps":true},{"t":"Usually a couple of months.","c":2,"k":"s","ps":false},{"t":"Sometimes much longer.","c":2,"k":"s","ps":false},{"t":"It depends on the person, on how complicated the behaviour is, and on how consistently it's tied to the same cue.","c":2,"k":"s","ps":false},{"t":"If you're three weeks into a new habit and it still feels like effort, you're not doing it wrong.","c":2,"k":"s","ps":false},{"t":"You're right on schedule.","c":2,"k":"s","ps":false},{"t":"Those questions from Lally's study make a handy self-check, by the way.","c":2,"k":"s","ps":true},{"t":"You don't need a chart or an app.","c":2,"k":"s","ps":false},{"t":"Every so often, just ask yourself two things.","c":2,"k":"s","ps":false},{"t":"Did I do it today without having to remind myself?","c":2,"k":"s","ps":false},{"t":"And would it feel strange to skip it?","c":2,"k":"s","ps":false},{"t":"When the answer to both is a clear yes, the habit is doing the work for you, and you can stop relying on effort.","c":2,"k":"s","ps":false},{"t":"Now let's turn all of this into a practical toolkit, for building habits you want and loosening the ones you don't.","c":2,"k":"s","ps":true},{"t":"Part four. Building and breaking habits.","c":3,"k":"head","ps":false},{"t":"The first tool is the most thoroughly tested.","c":3,"k":"s","ps":true},{"t":"The psychologist Peter Gollwitzer called it an implementation intention, and it's simply a plan in the form, when this happens, I will do that.","c":3,"k":"s","ps":false},{"t":"Not, I'll exercise more.","c":3,"k":"s","ps":false},{"t":"But, when I get home from work on Monday, Wednesday and Friday, I'll put my walking shoes on before I sit down.","c":3,"k":"s","ps":false},{"t":"In a 2002 study in the United Kingdom, Sarah Milne, Sheina Orbell and Paschal Sheeran worked with a group of young adults.","c":3,"k":"s","ps":true},{"t":"They asked some of them to write down exactly when and where they would exercise over the next week.","c":3,"k":"s","ps":false},{"t":"Ninety-one per cent of that group exercised at least once.","c":3,"k":"s","ps":false},{"t":"In the comparison groups, which didn't make a specific plan, fewer than four in ten did.","c":3,"k":"s","ps":false},{"t":"A plan like that works because it builds the cue in advance.","c":3,"k":"s","ps":false},{"t":"You've decided what the trigger is, so your brain has something to attach the new behaviour to.","c":3,"k":"s","ps":false},{"t":"The second tool is related.","c":3,"k":"s","ps":true},{"t":"Link the new habit to one you already have.","c":3,"k":"s","ps":false},{"t":"The behaviour scientist B J Fogg at Stanford University popularised this in his work on tiny habits.","c":3,"k":"s","ps":false},{"t":"After I pour my morning coffee, I'll take my vitamins.","c":3,"k":"s","ps":false},{"t":"After I park the car at work, I'll check my calendar for the day.","c":3,"k":"s","ps":false},{"t":"Your existing habit becomes a ready-made, highly reliable cue.","c":3,"k":"s","ps":false},{"t":"The third tool is to start smaller than feels worthwhile.","c":3,"k":"s","ps":true},{"t":"Remember that simpler behaviours become automatic faster.","c":3,"k":"s","ps":false},{"t":"Two push-ups after brushing your teeth sounds almost silly.","c":3,"k":"s","ps":false},{"t":"But it's easy enough to do every day, and once the cue and action are firmly linked, it's easy to add more.","c":3,"k":"s","ps":false},{"t":"The fourth tool is friction, and it's one of Wendy Wood's favourite themes.","c":3,"k":"s","ps":true},{"t":"Small obstacles have a surprisingly large effect on what we do.","c":3,"k":"s","ps":false},{"t":"If your running gear is laid out by the bed, going for a run is easier.","c":3,"k":"s","ps":false},{"t":"If the biscuits are in a high cupboard behind the flour, snacking is harder.","c":3,"k":"s","ps":false},{"t":"Most of us put far too much faith in willpower, and far too little in rearranging the setting so the right choice is the easy one.","c":3,"k":"s","ps":false},{"t":"Interestingly, research suggests that people who seem to have great self-control often aren't resisting temptation more.","c":3,"k":"s","ps":true},{"t":"They're facing less of it, because they've built routines that keep them out of its way.","c":3,"k":"s","ps":false},{"t":"Self-control, in practice, often looks a lot like good habits.","c":3,"k":"s","ps":false},{"t":"Now for breaking a habit you don't want.","c":3,"k":"s","ps":true},{"t":"Because habits are triggered by cues, the most effective approach is usually to change or avoid the cue, rather than fighting the urge each time it arrives.","c":3,"k":"s","ps":false},{"t":"Charge your phone in the kitchen overnight rather than beside the bed.","c":3,"k":"s","ps":false},{"t":"Take a different route home if the old one goes past the drive-through.","c":3,"k":"s","ps":false},{"t":"Big life changes offer a special opportunity here.","c":3,"k":"s","ps":true},{"t":"In one study, Wendy Wood and her colleagues followed students who transferred to a new university.","c":3,"k":"s","ps":false},{"t":"For students whose old context changed, habits like exercising or watching television were disrupted, and they became more likely to act on their current intentions rather than their old routines.","c":3,"k":"s","ps":false},{"t":"Researchers sometimes call these moments habit discontinuities.","c":3,"k":"s","ps":false},{"t":"Moving house, starting a new job or going through another big change shakes up your cues, which makes it an unusually good time to start something new or leave something behind.","c":3,"k":"s","ps":false},{"t":"If you can't avoid the cue, try replacing the routine rather than simply deleting it.","c":3,"k":"s","ps":true},{"t":"If the three o'clock slump sends you to the vending machine, keep the cue and the break, but swap the routine for a short walk around the block.","c":3,"k":"s","ps":false},{"t":"You still get a reward, just a different one.","c":3,"k":"s","ps":false},{"t":"And just as with building habits, expect it to take a while, and don't let one slip become a surrender.","c":3,"k":"s","ps":false},{"t":"Let's put the whole toolkit together with an example.","c":3,"k":"s","ps":true},{"t":"Imagine someone called Mia who wants to start walking in the evenings, and wants to stop scrolling her phone in bed.","c":3,"k":"s","ps":false},{"t":"For the walk, she makes a plan.","c":3,"k":"s","ps":false},{"t":"When I get home and put my bag down, I'll change into my walking shoes.","c":3,"k":"s","ps":false},{"t":"She leaves the shoes right by the door, which removes friction.","c":3,"k":"s","ps":false},{"t":"She starts with just ten minutes around the block, and saves a favourite podcast for the walk only, so there's an immediate reward.","c":3,"k":"s","ps":false},{"t":"For the scrolling, she doesn't rely on willpower at bedtime.","c":3,"k":"s","ps":false},{"t":"She changes the cue, and charges her phone in the kitchen, with a cheap alarm clock beside the bed instead.","c":3,"k":"s","ps":false},{"t":"Some nights she'll slip.","c":3,"k":"s","ps":false},{"t":"That's fine.","c":3,"k":"s","ps":false},{"t":"In a couple of months, if she keeps at it, the evening walk will probably feel as natural as locking the front door.","c":3,"k":"s","ps":false},{"t":"If you'd like one small thing to try on your next walk or drive, pick a habit you want.","c":3,"k":"s","ps":true},{"t":"Then say to yourself, out loud if you like, when this happens, I will do that.","c":3,"k":"s","ps":false},{"t":"Choose a cue you already meet every day.","c":3,"k":"s","ps":false},{"t":"That single sentence is the most reliable habit tool researchers have found.","c":3,"k":"s","ps":false},{"t":"To sum up, habits are behaviours that situations trigger automatically, and cues matter far more than we tend to think.","c":3,"k":"s","ps":true},{"t":"They usually take around two to five months to form rather than twenty-one days, and missing a single day doesn't reset the clock.","c":3,"k":"s","ps":false},{"t":"To build one, tie it to a clear cue, start small and reduce the friction.","c":3,"k":"s","ps":false},{"t":"To break one, change the cue rather than relying on willpower.","c":3,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":4,"k":"head","ps":false},{"t":"Question one. In Phillippa Lally's 2010 study, what was the average time for a new behaviour to become automatic?","c":4,"k":"q","ps":false},{"t":"Answer. Sixty-six days, with a very wide range.","c":4,"k":"a","ps":false},{"t":"Question two. In the stale popcorn study, why did habitual popcorn eaters keep eating the stale popcorn in the cinema?","c":4,"k":"q","ps":false},{"t":"Answer. The cinema setting triggered the habit, whether or not they liked the popcorn.","c":4,"k":"a","ps":false},{"t":"Question three. What is an implementation intention?","c":4,"k":"q","ps":false},{"t":"Answer. A plan in the form, when this happens, I will do that.","c":4,"k":"a","ps":false},{"t":"That's the end of How Habits Actually Form. See you on the next one.","c":4,"k":"end","ps":false}]},"latin":{"chapters":["Bona fide and ad hoc","Per se and quid pro quo","De facto and the status quo"],"at":{"f":[0.3,3.53,6.54,9.43,16.01,21.03,27.2,31.72,40.62,45.41,47.02,48.31,49.75,51.39,53.34,58.47,61.25,65.45,72.67,79.3,82.33,86.66,89.78,93.72,95.71,99.14,100.89,104.59,106.63,107.68,109.2,113.82,117.63,124.22,127.47,132.14,133.72,136.43,139.83,149.46,152.51,154.39,155.81,157.15,161.85,164.53,168.53,171.78,173.31,175.35,179.88,181.6,186.86,189.66,193.26,196.68,199.03,200.51,202.11,203.53,209.69,212.4,215.98,218.71,224.76,228.53,233.33,236.58,242.97,247.26,251.48,258.95,262.69,265.91,269.34,270.49,271.53,273.33,279.07,281.79,285.25,287.16,290.32,294.16,298.58,300.59,306.12,310.9,318.43,322.98,327.55,333.11,343.04,345.77,347.56,348.98,355.24,359.83,365.96,372.36,377.54,380.56,386.45,393.82,395.92,403.8,407.15,411.17,414.58,416.33,420.39,424.49,429.98,432.52,436.34,439.5,442.1,443.81,447.47,452.52,459.12,465.53,471.98,475.66,482.54,487.12,494.78,500.53,509.87,514.98],"m":[0.3,3.8,6.99,10.39,18.21,23.61,30.32,35.19,44.7,50.1,51.83,53.24,54.73,56.5,58.67,64.49,67.51,71.95,80.06,87.42,90.85,95.61,99.16,103.46,105.69,109.57,111.46,115.6,117.85,119.02,120.63,125.7,129.78,136.9,140.54,145.79,147.42,150.48,154.22,164.8,168.02,170.23,171.65,173.11,178.12,181.18,185.51,189.11,190.8,193.03,198.1,199.97,205.73,208.87,212.9,216.62,219.2,220.83,222.52,224.15,231.15,234.03,238.01,241.0,247.62,251.49,256.63,260.27,267.28,271.86,276.47,284.59,288.48,291.98,295.73,297.02,298.19,300.08,306.45,309.36,313.17,315.41,318.79,323.07,327.89,330.1,336.13,341.46,349.82,354.71,359.91,365.94,376.94,379.91,381.8,383.43,390.42,395.72,402.54,409.53,415.12,418.41,425.01,433.09,435.3,444.15,447.92,452.5,456.35,458.21,462.53,467.22,473.18,475.66,479.95,483.45,486.32,488.17,492.08,497.63,504.81,512.24,519.31,523.39,530.64,535.65,543.76,549.86,559.92,565.4]},"dur":{"f":519.2,"m":570.1},"units":[{"t":"Latin You Already Speak.","c":-1,"k":"title","ps":false},{"t":"Part one. Bona fide and ad hoc.","c":0,"k":"head","ps":false},{"t":"You might not think of yourself as a Latin speaker.","c":0,"k":"s","ps":true},{"t":"But if you've ever talked about the status quo, or said you were a bona fide fan of something, you've been speaking Latin.","c":0,"k":"s","ps":false},{"t":"It's a language that stopped being anyone's mother tongue well over a thousand years ago.","c":0,"k":"s","ps":false},{"t":"Latin lived on for centuries in the church, in universities, in medicine and especially in law.","c":0,"k":"s","ps":false},{"t":"Even today, Australian courts and contracts still use a fair bit of it.","c":0,"k":"s","ps":false},{"t":"Educated English speakers sprinkled it through their writing, and some of those phrases stuck so firmly that we now use them without a second thought.","c":0,"k":"s","ps":false},{"t":"Let's look at six of them, what they actually mean, and how to use them naturally.","c":0,"k":"s","ps":false},{"t":"First, bona fide.","c":0,"k":"s","ps":false},{"t":"It's two words.","c":0,"k":"s","ps":false},{"t":"B, O, N, A.","c":0,"k":"s","ps":false},{"t":"Then F, I, D, E.","c":0,"k":"s","ps":false},{"t":"Here's an everyday example.","c":0,"k":"s","ps":false},{"t":"After twenty years of Saturday matches, she's a bona fide expert on junior netball.","c":0,"k":"s","ps":false},{"t":"Literally, bona fide means in good faith.","c":0,"k":"s","ps":false},{"t":"Bona is good, and fide comes from fides, meaning faith or trust.","c":0,"k":"s","ps":false},{"t":"You can hear the same root in the word fidelity, and even in the old dog name Fido, which in Latin means I trust.","c":0,"k":"s","ps":false},{"t":"In law, a bona fide purchaser is someone who bought something honestly, without knowing there was a problem with it.","c":0,"k":"s","ps":false},{"t":"In everyday speech, the meaning has shifted a little.","c":0,"k":"s","ps":false},{"t":"Bona fide now mostly means genuine, real, the actual thing.","c":0,"k":"s","ps":false},{"t":"A bona fide offer is a real one, not a bluff.","c":0,"k":"s","ps":false},{"t":"A bona fide Aussie legend is someone who has earned the title.","c":0,"k":"s","ps":false},{"t":"You'll hear it pronounced a few ways.","c":0,"k":"s","ps":false},{"t":"Many Australians say bone-a fide, rhyming with side.","c":0,"k":"s","ps":false},{"t":"Others say bone-a fie-dee.","c":0,"k":"s","ps":false},{"t":"Both are widely accepted, so don't let anyone tell you off.","c":0,"k":"s","ps":false},{"t":"Our second phrase is ad hoc.","c":0,"k":"s","ps":false},{"t":"A, D.","c":0,"k":"s","ps":false},{"t":"Then H, O, C.","c":0,"k":"s","ps":false},{"t":"For example, we formed an ad hoc committee to sort out the Christmas party.","c":0,"k":"s","ps":false},{"t":"Ad hoc means for this, as in, for this particular purpose.","c":0,"k":"s","ps":false},{"t":"An ad hoc arrangement is set up to deal with one situation, rather than being part of a permanent plan.","c":0,"k":"s","ps":false},{"t":"If your workplace has a proper roster, that's a system.","c":0,"k":"s","ps":false},{"t":"If three people sort out who's covering Friday in the car park, that's ad hoc.","c":0,"k":"s","ps":false},{"t":"Here's the subtle bit.","c":0,"k":"s","ps":false},{"t":"Ad hoc isn't automatically a criticism.","c":0,"k":"s","ps":false},{"t":"Sometimes a quick, one-off solution is exactly right.","c":0,"k":"s","ps":false},{"t":"But when someone says a company's safety checks were done on an ad hoc basis, they usually mean there was no proper system at all, and that's a problem.","c":0,"k":"s","ps":false},{"t":"Part two. Per se and quid pro quo.","c":1,"k":"head","ps":false},{"t":"Our third phrase is per se.","c":1,"k":"s","ps":true},{"t":"P, E, R.","c":1,"k":"s","ps":false},{"t":"Then S, E.","c":1,"k":"s","ps":false},{"t":"For example, I don't hate camping per se, I just hate sleeping on the ground.","c":1,"k":"s","ps":false},{"t":"Per se means by itself, or in itself.","c":1,"k":"s","ps":false},{"t":"You use it to separate the thing itself from something connected to it.","c":1,"k":"s","ps":false},{"t":"In the camping example, the camping isn't the problem.","c":1,"k":"s","ps":false},{"t":"The hard ground is.","c":1,"k":"s","ps":false},{"t":"That's the real job of per se.","c":1,"k":"s","ps":false},{"t":"It says, I'm talking about this exact thing, not all the stuff that comes with it.","c":1,"k":"s","ps":false},{"t":"Here's another example.","c":1,"k":"s","ps":false},{"t":"The new phone isn't expensive per se, but the plan you need to go with it certainly is.","c":1,"k":"s","ps":false},{"t":"One common mistake is writing it as per say.","c":1,"k":"s","ps":false},{"t":"It's easy to see why, since that's exactly how it sounds.","c":1,"k":"s","ps":false},{"t":"But it's Latin per, meaning by, and se, meaning itself.","c":1,"k":"s","ps":false},{"t":"Our fourth phrase is quid pro quo.","c":1,"k":"s","ps":false},{"t":"Q, U, I, D.","c":1,"k":"s","ps":false},{"t":"Then P, R, O.","c":1,"k":"s","ps":false},{"t":"Then Q, U, O.","c":1,"k":"s","ps":false},{"t":"For example, I'll help you move house on Saturday, but it's a quid pro quo, you're helping me paint the fence.","c":1,"k":"s","ps":false},{"t":"Quid pro quo means something for something.","c":1,"k":"s","ps":false},{"t":"It's a fair exchange, one favour in return for another.","c":1,"k":"s","ps":false},{"t":"Here's a surprising detail from its history.","c":1,"k":"s","ps":false},{"t":"In the 1500s, the phrase was used by apothecaries, the chemists of the day.","c":1,"k":"s","ps":false},{"t":"A quid pro quo was when one medicine was swapped for another.","c":1,"k":"s","ps":false},{"t":"Sometimes that was deliberate, because the proper ingredient was unavailable.","c":1,"k":"s","ps":false},{"t":"Sometimes it was a mistake, which could be dangerous.","c":1,"k":"s","ps":false},{"t":"Over time, the phrase moved away from medicine and came to mean any exchange of one thing for another.","c":1,"k":"s","ps":false},{"t":"Today, it can be perfectly innocent, like our house move and our fence.","c":1,"k":"s","ps":false},{"t":"But in news reports, quid pro quo often carries a shady tone.","c":1,"k":"s","ps":false},{"t":"When a journalist asks whether there was a quid pro quo between a donor and a politician, they're asking whether a favour was bought.","c":1,"k":"s","ps":false},{"t":"So it's worth being a little careful where you use it.","c":1,"k":"s","ps":false},{"t":"Part three. De facto and the status quo.","c":2,"k":"head","ps":false},{"t":"Our fifth phrase is one Australians hear more than most.","c":2,"k":"s","ps":true},{"t":"De facto.","c":2,"k":"s","ps":false},{"t":"D, E.","c":2,"k":"s","ps":false},{"t":"Then F, A, C, T, O.","c":2,"k":"s","ps":false},{"t":"For example, Sam never applied for the job, but he's become the de facto leader of the team.","c":2,"k":"s","ps":false},{"t":"De facto means in fact, or in practice.","c":2,"k":"s","ps":false},{"t":"Its partner phrase is de jure, which means by law.","c":2,"k":"s","ps":false},{"t":"The difference is really useful.","c":2,"k":"s","ps":false},{"t":"Something is de jure when it's official on paper.","c":2,"k":"s","ps":false},{"t":"Something is de facto when it's simply how things actually work.","c":2,"k":"s","ps":false},{"t":"Plenty of countries have a de jure capital city and a de facto one.","c":2,"k":"s","ps":false},{"t":"Bolivia is a good example.","c":2,"k":"s","ps":false},{"t":"Its constitution names Sucre as the capital, but the government actually sits in La Paz.","c":2,"k":"s","ps":false},{"t":"So Sucre is the capital by law, and La Paz is the capital in practice.","c":2,"k":"s","ps":false},{"t":"In a workplace, the manager might be the de jure boss, while the person everyone actually asks is the de facto boss.","c":2,"k":"s","ps":false},{"t":"In Australia, of course, de facto has a second, very everyday meaning.","c":2,"k":"s","ps":false},{"t":"A de facto partner is someone you live with as a couple without being married.","c":2,"k":"s","ps":false},{"t":"Many Australian laws and government services recognise de facto relationships.","c":2,"k":"s","ps":false},{"t":"The rules about what counts can be quite detailed, so if it matters for your situation, check the official sources, like the ATO or Services Australia.","c":2,"k":"s","ps":false},{"t":"Our sixth and final phrase is status quo.","c":2,"k":"s","ps":false},{"t":"S, T, A, T, U, S.","c":2,"k":"s","ps":false},{"t":"Then Q, U, O.","c":2,"k":"s","ps":false},{"t":"For example, the council decided to keep the status quo and leave the car park exactly as it is.","c":2,"k":"s","ps":false},{"t":"Status quo means the existing state of affairs, the way things currently are.","c":2,"k":"s","ps":false},{"t":"It's short for a longer Latin phrase, status quo ante, meaning the state in which things were before.","c":2,"k":"s","ps":false},{"t":"Diplomats used a version of it to describe peace deals that put everything back as it had been before a war.","c":2,"k":"s","ps":false},{"t":"Today, you'll often hear about people who want to challenge the status quo, or defend it.","c":2,"k":"s","ps":false},{"t":"Businesses talk about disrupting the status quo.","c":2,"k":"s","ps":false},{"t":"Older hands at work sometimes defend it, on the grounds that the current way has worked for years.","c":2,"k":"s","ps":false},{"t":"Psychologists even have a name for our tendency to stick with things as they are, simply because change feels like effort.","c":2,"k":"s","ps":false},{"t":"They call it status quo bias.","c":2,"k":"s","ps":false},{"t":"It's one reason so many people stay on the same phone plan or electricity deal for years, even when a better one is available.","c":2,"k":"s","ps":false},{"t":"The phrase is useful precisely because it's neutral.","c":2,"k":"s","ps":false},{"t":"It describes how things are, without saying whether that's good or bad.","c":2,"k":"s","ps":false},{"t":"So how do you use Latin like this without sounding stuffy?","c":2,"k":"s","ps":false},{"t":"Here are three quick tips.","c":2,"k":"s","ps":false},{"t":"First, only use the Latin when it's the shortest, clearest option.","c":2,"k":"s","ps":false},{"t":"Per se is handy because the English alternative takes more words.","c":2,"k":"s","ps":false},{"t":"But saying inter alia instead of among other things just makes you sound like a court document.","c":2,"k":"s","ps":false},{"t":"Second, get the meaning exactly right.","c":2,"k":"s","ps":false},{"t":"Ad hoc doesn't mean random, and bona fide doesn't mean very.","c":2,"k":"s","ps":false},{"t":"Used precisely, these phrases sound confident.","c":2,"k":"s","ps":false},{"t":"Used loosely, they sound like showing off.","c":2,"k":"s","ps":false},{"t":"Third, say them plainly.","c":2,"k":"s","ps":false},{"t":"There's no need for a special accent or a pause for effect.","c":2,"k":"s","ps":false},{"t":"Say de facto the way you'd say any other word, and it'll sound completely natural.","c":2,"k":"s","ps":false},{"t":"To sum up, bona fide means genuine, ad hoc means for one purpose, and per se means in itself.","c":2,"k":"s","ps":false},{"t":"Quid pro quo is an exchange, de facto means in practice, and status quo is the way things are now.","c":2,"k":"s","ps":false},{"t":"Use them when they're the neatest way to say what you mean, and you'll sound clear rather than clever.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What does bona fide literally mean?","c":3,"k":"q","ps":false},{"t":"Answer. In good faith. Today it usually means genuine.","c":3,"k":"a","ps":false},{"t":"Question two. What's the difference between de facto and de jure?","c":3,"k":"q","ps":false},{"t":"Answer. De facto means in fact or in practice. De jure means by law.","c":3,"k":"a","ps":false},{"t":"Question three. What did quid pro quo originally describe in the 1500s?","c":3,"k":"q","ps":false},{"t":"Answer. Swapping one medicine for another, sometimes by mistake.","c":3,"k":"a","ps":false},{"t":"That's the end of Latin You Already Speak. Nicely done.","c":3,"k":"end","ps":false}]},"mathtricks":{"chapters":["Tens, fives and fifteens","Splitting the bill","Discounts and deals"],"at":{"f":[0.3,3.68,7.0,11.27,13.38,15.04,20.83,27.6,30.42,34.96,38.17,41.26,46.49,50.22,54.39,58.62,63.36,66.02,72.25,76.98,80.75,85.89,94.23,99.86,103.94,108.84,112.1,113.98,118.35,120.61,121.67,124.26,131.56,133.13,137.73,140.7,143.17,149.08,150.75,152.68,158.37,162.5,163.93,172.18,177.15,180.28,185.51,193.16,195.58,201.87,205.97,210.69,213.28,217.27,221.66,225.16,229.52,232.24,235.86,244.7,247.89,250.53,257.9,267.11,271.16,273.84,278.34,283.29,293.77,296.39,304.2,308.12,311.01,316.68,322.05,324.75,329.84,334.42,342.06,346.31,349.8,352.61,356.34,358.97,361.11,364.32,371.29,373.1,375.23,377.4,379.71,385.5,387.59,388.68,394.35,396.4,399.19,404.84,408.39,410.88,417.58,421.26,424.49,429.06,431.58,435.99,441.65,445.85,451.26,456.77,462.2,466.0,470.23,478.71,484.66,491.51,493.53,502.04,505.49,513.64,517.32,525.26,531.24,540.51,543.08,552.99,556.54],"m":[0.3,3.75,7.2,11.68,14.02,16.01,22.58,29.94,33.18,38.14,41.74,45.04,50.98,55.0,59.53,64.19,69.62,72.31,79.16,84.24,88.31,94.13,103.4,109.71,114.2,119.75,123.24,125.21,129.98,132.39,133.56,136.37,144.35,146.09,150.95,154.13,156.82,163.39,165.18,167.37,173.58,178.14,179.66,188.45,194.15,197.64,203.53,211.87,214.25,221.39,225.57,230.85,233.61,238.25,243.2,247.2,252.16,255.09,259.1,269.06,272.21,275.15,283.24,293.3,297.88,300.93,305.81,311.46,322.56,325.55,334.14,338.54,341.78,348.12,353.98,356.89,362.42,367.56,376.15,380.97,384.89,387.89,392.01,394.88,397.33,400.94,408.65,410.52,412.74,415.15,417.59,423.79,426.07,427.3,433.48,435.8,438.89,445.02,448.88,451.62,459.16,463.03,466.56,471.71,474.43,479.39,485.68,490.26,496.27,502.32,508.21,512.36,517.02,526.34,532.92,540.28,542.44,551.77,555.53,564.4,568.48,576.83,583.11,592.84,595.52,606.12,609.84]},"dur":{"f":562.3,"m":616.1},"units":[{"t":"Mental Maths Shortcuts.","c":-1,"k":"title","ps":false},{"t":"Part one. Tens, fives and fifteens.","c":0,"k":"head","ps":false},{"t":"Here's a secret that people who are good at mental maths rarely admit.","c":0,"k":"s","ps":true},{"t":"They aren't doing harder sums than you.","c":0,"k":"s","ps":false},{"t":"They're doing easier ones.","c":0,"k":"s","ps":false},{"t":"They break an awkward number into friendly pieces, work out each piece, and add them back together.","c":0,"k":"s","ps":false},{"t":"That's the whole game, and by the end of this lesson you'll have a handful of those friendly pieces ready to use.","c":0,"k":"s","ps":false},{"t":"If you're driving, don't try to work anything out.","c":0,"k":"s","ps":true},{"t":"Just listen along, and try the tricks later when you're standing at a counter.","c":0,"k":"s","ps":false},{"t":"Let's start with percentages, because they're everywhere.","c":0,"k":"s","ps":true},{"t":"The friendliest percentage of all is ten per cent.","c":0,"k":"s","ps":false},{"t":"To find ten per cent of anything, you just move the decimal point one place to the left.","c":0,"k":"s","ps":false},{"t":"Ten per cent of $86 is $8.60.","c":0,"k":"s","ps":false},{"t":"Ten per cent of $240 is $24.","c":0,"k":"s","ps":false},{"t":"Ten per cent of $7.50 is seventy-five cents.","c":0,"k":"s","ps":false},{"t":"Once you have ten per cent, a whole family of other percentages falls out of it.","c":0,"k":"s","ps":true},{"t":"Five per cent is half of ten per cent.","c":0,"k":"s","ps":false},{"t":"So five per cent of $86 is half of $8.60, which is $4.30.","c":0,"k":"s","ps":false},{"t":"Twenty per cent is double ten per cent, so that's $17.20.","c":0,"k":"s","ps":false},{"t":"And fifteen per cent is just ten per cent plus five per cent.","c":0,"k":"s","ps":false},{"t":"Add $8.60 and $4.30 and you get $12.90.","c":0,"k":"s","ps":false},{"t":"Tipping isn't expected in Australia the way it is in the United States, because hospitality wages here don't depend on tips.","c":0,"k":"s","ps":true},{"t":"But plenty of people like to leave something for great service, or chip in extra at a group dinner.","c":0,"k":"s","ps":false},{"t":"With ten per cent in your pocket, a tip becomes a two-second job.","c":0,"k":"s","ps":false},{"t":"For a rough ten per cent, move the decimal and round up to a tidy number.","c":0,"k":"s","ps":false},{"t":"Now here's a trick that genuinely surprises people.","c":0,"k":"s","ps":true},{"t":"Percentages can be flipped.","c":0,"k":"s","ps":false},{"t":"Eight per cent of fifty is exactly the same as fifty per cent of eight.","c":0,"k":"s","ps":false},{"t":"And fifty per cent of eight is easy.","c":0,"k":"s","ps":false},{"t":"It's four.","c":0,"k":"s","ps":false},{"t":"So eight per cent of fifty is four.","c":0,"k":"s","ps":false},{"t":"This works every time, because a percentage is really just two numbers multiplied together and divided by one hundred.","c":0,"k":"s","ps":true},{"t":"The order doesn't matter.","c":0,"k":"s","ps":false},{"t":"So when a percentage looks nasty, swap it around and see if it gets nicer.","c":0,"k":"s","ps":false},{"t":"Four per cent of seventy-five sounds awkward.","c":0,"k":"s","ps":false},{"t":"Seventy-five per cent of four is three.","c":0,"k":"s","ps":false},{"t":"Twelve per cent of twenty-five becomes twenty-five per cent of twelve, which is a quarter of twelve.","c":0,"k":"s","ps":false},{"t":"That's three again.","c":0,"k":"s","ps":false},{"t":"One more Australian special.","c":0,"k":"s","ps":true},{"t":"Most prices you see here already include the goods and services tax, which is ten per cent.","c":0,"k":"s","ps":false},{"t":"You might think the tax inside a price is a tenth of it, but it isn't.","c":0,"k":"s","ps":false},{"t":"It's one eleventh.","c":0,"k":"s","ps":false},{"t":"That's because the price is the original amount plus another ten per cent on top, so it's eleven parts, and the tax is one of them.","c":0,"k":"s","ps":false},{"t":"On a $110 bill, the tax is $10, not $11.","c":0,"k":"s","ps":false},{"t":"On a $55 item, it's $5.","c":0,"k":"s","ps":false},{"t":"When a price divides neatly by eleven, you can find the tax almost instantly.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll take these ideas to the restaurant table and look at splitting a bill without reaching for your phone.","c":0,"k":"s","ps":true},{"t":"Part two. Splitting the bill.","c":1,"k":"head","ps":false},{"t":"Dividing in your head feels harder than multiplying, mostly because we try to do it in one big step.","c":1,"k":"s","ps":true},{"t":"The trick is to break it into small steps that you already know.","c":1,"k":"s","ps":false},{"t":"Splitting between two people is just halving, and most of us are comfortable with that.","c":1,"k":"s","ps":true},{"t":"Splitting between four is halving twice.","c":1,"k":"s","ps":false},{"t":"Say the bill is $236 and there are four of you.","c":1,"k":"s","ps":false},{"t":"Half of $236 is $118.","c":1,"k":"s","ps":false},{"t":"Half of $118 is $59.","c":1,"k":"s","ps":false},{"t":"That's $59 each, and you never had to divide by four.","c":1,"k":"s","ps":false},{"t":"Splitting between eight is halving three times.","c":1,"k":"s","ps":true},{"t":"Splitting between six is halving, then dividing by three.","c":1,"k":"s","ps":false},{"t":"For a $150 bill between six, half is $75, and a third of $75 is $25.","c":1,"k":"s","ps":false},{"t":"Dividing by five has a lovely shortcut too.","c":1,"k":"s","ps":true},{"t":"Double the number, then divide by ten.","c":1,"k":"s","ps":false},{"t":"A $130 bill between five people becomes $260, and then $26 each.","c":1,"k":"s","ps":false},{"t":"It works because dividing by five is the same as dividing by ten and multiplying by two, and the order of those doesn't matter either.","c":1,"k":"s","ps":false},{"t":"When a bill doesn't split evenly, round first and tidy up after.","c":1,"k":"s","ps":true},{"t":"Say it's $97 between three.","c":1,"k":"s","ps":false},{"t":"Ninety-nine would split nicely into three lots of $33.","c":1,"k":"s","ps":false},{"t":"So think of it as $33 each, less a couple of dollars off the total.","c":1,"k":"s","ps":false},{"t":"In practice, two people pay $32 and one pays $33, or everyone pays $33 and the extra two dollars becomes the tip.","c":1,"k":"s","ps":false},{"t":"Near enough really is good enough at dinner.","c":1,"k":"s","ps":false},{"t":"The same round-and-adjust idea is brilliant for multiplying prices that end in ninety-five or ninety-nine cents.","c":1,"k":"s","ps":true},{"t":"Four items at $19.95 each looks fiddly.","c":1,"k":"s","ps":false},{"t":"But each one is five cents short of $20.","c":1,"k":"s","ps":false},{"t":"Four lots of $20 is $80, and four lots of five cents is twenty cents.","c":1,"k":"s","ps":false},{"t":"So the total is $80 less twenty cents, which is $79.80.","c":1,"k":"s","ps":false},{"t":"Round-and-adjust works when adding a list, too.","c":1,"k":"s","ps":true},{"t":"At the supermarket, round each item to the nearest dollar as it goes into the trolley.","c":1,"k":"s","ps":false},{"t":"Some of your roundings go up and some go down, so the errors tend to cancel out.","c":1,"k":"s","ps":false},{"t":"By the checkout you'll usually be within a few dollars of the real total, which is plenty accurate for a sense of where you stand.","c":1,"k":"s","ps":false},{"t":"Now for the most useful skill of all, especially around the big sales.","c":1,"k":"s","ps":true},{"t":"Working out what a discount is really worth.","c":1,"k":"s","ps":false},{"t":"Part three. Discounts and deals.","c":2,"k":"head","ps":false},{"t":"When you see thirty per cent off, there are two ways to think about it.","c":2,"k":"s","ps":true},{"t":"You can work out the discount and subtract it.","c":2,"k":"s","ps":false},{"t":"Or you can go straight to what you'll pay.","c":2,"k":"s","ps":false},{"t":"Thirty per cent off means you pay seventy per cent.","c":2,"k":"s","ps":false},{"t":"For an $80 jacket, ten per cent is $8, so seventy per cent is seven lots of $8.","c":2,"k":"s","ps":false},{"t":"That's $56.","c":2,"k":"s","ps":false},{"t":"One step instead of two.","c":2,"k":"s","ps":false},{"t":"Here's where many shoppers get caught.","c":2,"k":"s","ps":true},{"t":"Stacked discounts don't simply add up.","c":2,"k":"s","ps":false},{"t":"Imagine a store offering twenty per cent off, with an extra ten per cent off at the register.","c":2,"k":"s","ps":false},{"t":"It sounds like thirty per cent off.","c":2,"k":"s","ps":false},{"t":"It isn't.","c":2,"k":"s","ps":false},{"t":"The extra ten per cent comes off the already reduced price, not the original one.","c":2,"k":"s","ps":false},{"t":"Take a $100 item.","c":2,"k":"s","ps":true},{"t":"Twenty per cent off brings it to $80.","c":2,"k":"s","ps":false},{"t":"Then ten per cent off $80 is $8, which brings it to $72.","c":2,"k":"s","ps":false},{"t":"So the real discount is twenty-eight per cent, not thirty.","c":2,"k":"s","ps":false},{"t":"On a small purchase that barely matters.","c":2,"k":"s","ps":false},{"t":"On a fridge or a couch, it's real money, and it's worth knowing before a sign convinces you otherwise.","c":2,"k":"s","ps":false},{"t":"The same thinking helps with the classic multi-buy offers.","c":2,"k":"s","ps":true},{"t":"Buy two, get one free sounds generous, and it is.","c":2,"k":"s","ps":false},{"t":"You get three items for the price of two, which works out to a third off each one.","c":2,"k":"s","ps":false},{"t":"Compare that with second item half price.","c":2,"k":"s","ps":false},{"t":"There you pay for one and a half items and get two, which is a quarter off each.","c":2,"k":"s","ps":false},{"t":"So buy two get one free is the better deal, but only if you'd genuinely use all three.","c":2,"k":"s","ps":false},{"t":"And percentages have one last trap that catches almost everyone.","c":2,"k":"s","ps":true},{"t":"Going up and coming back down by the same percentage doesn't bring you back to where you started.","c":2,"k":"s","ps":false},{"t":"If a share price rises fifty per cent and then falls fifty per cent, you don't break even.","c":2,"k":"s","ps":false},{"t":"A hundred dollars becomes one hundred and fifty, and then half of that is seventy-five.","c":2,"k":"s","ps":false},{"t":"The fall is taken from a bigger number, so it bites harder.","c":2,"k":"s","ps":false},{"t":"Finally, when you're comparing packet sizes, lean on the unit price.","c":2,"k":"s","ps":true},{"t":"Large Australian supermarkets are required to show a unit price on the shelf label, such as the price per hundred grams or per litre.","c":2,"k":"s","ps":false},{"t":"Bigger packs are often cheaper per unit, but not always, and specials can flip the usual pattern.","c":2,"k":"s","ps":false},{"t":"That small number on the label does the mental maths for you, so glance at it before you reach for the bigger box.","c":2,"k":"s","ps":false},{"t":"So here's what to carry with you.","c":2,"k":"s","ps":true},{"t":"Build every percentage from ten per cent, flip a percentage when it looks awkward, and remember that the tax inside a price is one eleventh.","c":2,"k":"s","ps":false},{"t":"Split bills by halving and by rounding then adjusting.","c":2,"k":"s","ps":false},{"t":"And with discounts, think about what you'll actually pay, because stacked deals are always a little less generous than they sound.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What's the quickest way to find fifteen per cent of a bill?","c":3,"k":"q","ps":false},{"t":"Answer. Find ten per cent, halve it to get five per cent, then add the two together.","c":3,"k":"a","ps":false},{"t":"Question two. If a price includes GST, what fraction of the price is the tax?","c":3,"k":"q","ps":false},{"t":"Answer. One eleventh.","c":3,"k":"a","ps":false},{"t":"Question three. Twenty per cent off, then an extra ten per cent off. What's the real total discount?","c":3,"k":"q","ps":false},{"t":"Answer. Twenty-eight per cent, not thirty.","c":3,"k":"a","ps":false},{"t":"That's the end of Mental Maths Shortcuts. Nice work. Enjoy that next bill.","c":3,"k":"end","ps":false}]},"meals":{"chapters":["The six o'clock problem","A fifteen minute system","Making it stick"],"at":{"f":[0.3,3.83,6.71,8.73,13.59,19.81,22.93,26.12,33.6,35.16,37.34,47.33,54.89,59.22,60.94,70.01,79.25,82.02,85.77,93.03,96.1,101.38,103.01,109.58,113.3,119.15,120.85,126.22,129.68,136.91,139.7,142.2,146.42,148.86,153.55,157.04,160.85,163.7,167.95,170.31,176.86,181.53,184.82,187.32,190.93,196.85,199.23,206.98,210.92,213.47,220.2,222.98,227.62,235.34,238.4,241.74,247.37,252.23,257.47,262.23,267.5,277.9,279.75,282.46,287.75,294.26,296.61,300.18,302.7,306.67,311.08,318.22,321.65,329.35,334.05,337.9,343.37,346.56,351.32,353.73,361.94,367.89,375.85,379.86,383.17,385.7,394.63,396.68,401.34,407.5,410.37,415.01,421.1,427.93,432.94,435.23,438.3,441.74,447.69,449.81,455.6,465.06,468.74,479.94,485.78,493.83,501.02,509.45,514.63],"m":[0.3,4.04,7.16,9.29,14.76,21.72,25.32,28.91,36.97,38.55,40.97,51.87,60.22,65.04,66.9,76.59,86.65,89.73,93.83,101.77,105.1,110.8,112.65,119.97,124.09,130.36,132.2,138.06,141.89,149.82,152.82,155.44,160.09,162.68,167.98,171.83,175.79,178.79,183.6,186.41,193.74,198.84,202.49,205.21,209.3,215.59,218.13,226.68,231.09,233.91,241.2,244.31,249.44,258.04,261.46,265.13,271.43,276.85,282.51,287.79,293.59,304.73,306.79,309.86,315.53,322.83,325.25,329.15,331.95,336.29,341.19,348.95,352.57,360.88,365.87,369.87,376.01,379.41,384.62,387.31,396.48,402.9,411.52,415.8,419.37,422.09,431.8,433.95,439.25,446.23,449.15,454.38,461.12,468.83,474.32,476.74,480.12,483.97,490.68,493.01,499.75,509.77,513.85,525.82,532.21,540.75,548.45,557.27,562.76]},"dur":{"f":519.5,"m":567.9},"units":[{"t":"Meal Planning Without the Misery.","c":-1,"k":"title","ps":false},{"t":"Part one. The six o'clock problem.","c":0,"k":"head","ps":false},{"t":"It's six o'clock on a weeknight.","c":0,"k":"s","ps":true},{"t":"You open the fridge and stare into it, as if dinner might appear if you wait long enough.","c":0,"k":"s","ps":false},{"t":"There's half a capsicum, some yoghurt, a bag of spinach that's gone a bit slimy, and a lot of condiments.","c":0,"k":"s","ps":false},{"t":"So it's toast again, or a drive to get takeaway.","c":0,"k":"s","ps":false},{"t":"If that scene sounds familiar, this lesson is for you.","c":0,"k":"s","ps":false},{"t":"We'll build a simple weekly meal plan that takes about fifteen minutes and doesn't require you to become a different person.","c":0,"k":"s","ps":false},{"t":"First, why bother?","c":0,"k":"s","ps":true},{"t":"The most obvious reason is money.","c":0,"k":"s","ps":false},{"t":"End Food Waste Australia, a national research centre, estimates that food wasted at home costs households up to $2,500 a year.","c":0,"k":"s","ps":false},{"t":"That's about $50 a week, much of it in fresh food bought with good intentions and then forgotten at the back of the fridge.","c":0,"k":"s","ps":false},{"t":"A plan means you buy food for meals that will actually happen.","c":0,"k":"s","ps":false},{"t":"There's a health angle too.","c":0,"k":"s","ps":true},{"t":"In 2017, a team of French researchers led by Pauline Ducrot looked at the eating habits of more than forty thousand adults.","c":0,"k":"s","ps":false},{"t":"They found that people who planned their meals, even just occasionally, tended to eat a more varied diet and stick more closely to nutrition guidelines.","c":0,"k":"s","ps":false},{"t":"Planners were also less likely to be obese.","c":0,"k":"s","ps":false},{"t":"Now, that study could only show a link, not cause and effect.","c":0,"k":"s","ps":false},{"t":"As the researchers themselves pointed out, people who already care about healthy eating may simply be more likely to plan.","c":0,"k":"s","ps":false},{"t":"But it fits with what most of us know from experience.","c":0,"k":"s","ps":false},{"t":"The worst food decisions tend to happen when we're tired, hungry and out of ideas.","c":0,"k":"s","ps":false},{"t":"And that's the real point.","c":0,"k":"s","ps":true},{"t":"Deciding what to eat at six o'clock, when you're tired and hungry, is the hardest possible time to decide.","c":0,"k":"s","ps":false},{"t":"Meal planning simply moves that decision to a calmer moment.","c":0,"k":"s","ps":false},{"t":"You make it once, on a quiet morning, instead of seven times on seven tired evenings.","c":0,"k":"s","ps":false},{"t":"It saves time as well.","c":0,"k":"s","ps":true},{"t":"Without a plan, many of us duck into the shops three or four times a week for one missing thing.","c":0,"k":"s","ps":false},{"t":"And that quick trip for milk rarely ends with just milk.","c":0,"k":"s","ps":false},{"t":"One proper shop, with a list, cuts out most of those extra trips and the impulse buys that come with them.","c":0,"k":"s","ps":false},{"t":"Part two. A fifteen minute system.","c":1,"k":"head","ps":false},{"t":"Here's a simple system in four steps.","c":1,"k":"s","ps":true},{"t":"If you're driving, just listen along, and try it out on the weekend.","c":1,"k":"s","ps":false},{"t":"Step one is to pick a planning moment.","c":1,"k":"s","ps":true},{"t":"Choose a regular time each week, ideally the day before you do your main shop.","c":1,"k":"s","ps":false},{"t":"Sunday morning over a coffee works for lots of people.","c":1,"k":"s","ps":false},{"t":"Having a fixed time matters more than having a perfect plan.","c":1,"k":"s","ps":false},{"t":"Step two is to shop your own kitchen first.","c":1,"k":"s","ps":true},{"t":"Before you write anything down, look in the fridge, the freezer and the pantry.","c":1,"k":"s","ps":false},{"t":"What needs using up in the next few days?","c":1,"k":"s","ps":false},{"t":"That half a capsicum and the spinach become the start of a stir fry or a frittata, rather than going in the bin.","c":1,"k":"s","ps":false},{"t":"Planning around what you already have is where most of the savings come from.","c":1,"k":"s","ps":false},{"t":"Step three is to plan fewer meals than there are nights.","c":1,"k":"s","ps":true},{"t":"This is the part most people get wrong.","c":1,"k":"s","ps":false},{"t":"If you plan seven brand new dinners, life gets in the way.","c":1,"k":"s","ps":false},{"t":"Someone works late, a friend invites you out, or you're just too tired, and the ingredients go off.","c":1,"k":"s","ps":false},{"t":"Instead, plan four or five dinners.","c":1,"k":"s","ps":false},{"t":"Leave one night for leftovers, and one flexible night for eggs on toast, a freezer meal, or the odd takeaway without guilt.","c":1,"k":"s","ps":false},{"t":"A plan with breathing room is a plan you'll actually keep.","c":1,"k":"s","ps":false},{"t":"It also helps to give nights a loose theme.","c":1,"k":"s","ps":true},{"t":"For example, Monday could be pasta, Tuesday a stir fry, Wednesday soup, and Thursday tacos or wraps.","c":1,"k":"s","ps":false},{"t":"You're not locked into the same meal every week.","c":1,"k":"s","ps":false},{"t":"You're just choosing from a smaller set of options, which makes planning much faster.","c":1,"k":"s","ps":false},{"t":"Keep a running list of ten or fifteen meals your household actually likes, on your phone or on the fridge, and pick from that.","c":1,"k":"s","ps":false},{"t":"Step four is to write the shopping list from the plan.","c":1,"k":"s","ps":true},{"t":"Go meal by meal and write down only what's missing.","c":1,"k":"s","ps":false},{"t":"Group the list by where things are in the shop, fruit and veg together, dairy together, and so on.","c":1,"k":"s","ps":false},{"t":"You'll be quicker in the supermarket, and you'll wander past fewer tempting extras.","c":1,"k":"s","ps":false},{"t":"If you want to save a bit more, glance at the weekly specials before you plan, not after.","c":1,"k":"s","ps":true},{"t":"If chicken thighs or broccoli are on special, build a meal or two around them.","c":1,"k":"s","ps":false},{"t":"That's much cheaper than choosing meals first and then paying full price for whatever they need.","c":1,"k":"s","ps":false},{"t":"Seasonal fruit and vegetables are usually cheaper and tastier too, and frozen vegetables are a perfectly good, cheap backup that won't go off by Thursday.","c":1,"k":"s","ps":false},{"t":"What about breakfast and lunch?","c":1,"k":"s","ps":true},{"t":"Most people don't need to plan those in detail.","c":1,"k":"s","ps":false},{"t":"Pick two or three breakfasts you rotate, and make sure the ingredients are always on the list.","c":1,"k":"s","ps":false},{"t":"For lunches, leftovers do a lot of the work, and a couple of easy standbys cover the rest.","c":1,"k":"s","ps":false},{"t":"Part three. Making it stick.","c":2,"k":"head","ps":false},{"t":"A few tricks make the system much easier to live with.","c":2,"k":"s","ps":true},{"t":"The first is to cook once and eat twice.","c":2,"k":"s","ps":true},{"t":"When you make a bolognese, a curry or a soup, make a double batch.","c":2,"k":"s","ps":false},{"t":"Have one meal tonight and freeze the rest, or turn it into lunch the next day.","c":2,"k":"s","ps":false},{"t":"Over time you build up a small stock of freezer meals, which is exactly what rescues you on the flexible night.","c":2,"k":"s","ps":false},{"t":"The second is to plan ingredients that do double duty.","c":2,"k":"s","ps":true},{"t":"If you buy a bunch of coriander for tacos on Monday, put something on the plan later in the week that also uses coriander.","c":2,"k":"s","ps":false},{"t":"A roast chicken on Sunday can become wraps on Monday and soup on Tuesday.","c":2,"k":"s","ps":false},{"t":"That way, nothing is bought for one meal and left to wilt.","c":2,"k":"s","ps":false},{"t":"The third is to understand the dates on packets, because they cause a lot of needless waste.","c":2,"k":"s","ps":true},{"t":"In Australia, a use-by date is about safety.","c":2,"k":"s","ps":false},{"t":"Food shouldn't be eaten after its use-by date, even if it looks and smells fine.","c":2,"k":"s","ps":false},{"t":"A best-before date is about quality.","c":2,"k":"s","ps":false},{"t":"Food can still be safe to eat after its best-before date, as long as it isn't damaged or spoiled, though it may have lost a little freshness.","c":2,"k":"s","ps":false},{"t":"Plenty of perfectly good food gets thrown out because people treat the two as the same thing.","c":2,"k":"s","ps":false},{"t":"The fourth is to put leftovers in the fridge promptly once they've stopped steaming, and eat them within a couple of days, or freeze them.","c":2,"k":"s","ps":true},{"t":"Label them with the date, even just a scribble on masking tape.","c":2,"k":"s","ps":false},{"t":"Mystery containers are the ones that end up in the bin.","c":2,"k":"s","ps":false},{"t":"Your freezer is a great friend here too.","c":2,"k":"s","ps":false},{"t":"Bread, grated cheese, cooked rice and ripe bananas all freeze well, so anything you won't get to in time can go in there instead of the bin.","c":2,"k":"s","ps":false},{"t":"The fifth is to share the load.","c":2,"k":"s","ps":true},{"t":"If you live with other people, ask everyone to name one meal they'd like that week.","c":2,"k":"s","ps":false},{"t":"People complain less about dinners they helped choose, and older kids can take a turn cooking their pick.","c":2,"k":"s","ps":false},{"t":"The sixth is to keep an emergency pantry.","c":2,"k":"s","ps":true},{"t":"These are a handful of long-lasting basics that can always become a meal.","c":2,"k":"s","ps":false},{"t":"Think pasta, a tin of tomatoes, tinned tuna or beans, rice, eggs and some frozen peas.","c":2,"k":"s","ps":false},{"t":"With those on hand, even the night when everything goes wrong still ends in a proper dinner, in about fifteen minutes.","c":2,"k":"s","ps":false},{"t":"Replace each item as soon as you use it, so the safety net is always there.","c":2,"k":"s","ps":false},{"t":"Finally, don't aim for perfection.","c":2,"k":"s","ps":true},{"t":"Some weeks the plan will fall apart, and that's fine.","c":2,"k":"s","ps":false},{"t":"Even a rough plan for three nights beats no plan at all.","c":2,"k":"s","ps":false},{"t":"The goal is simply fewer panicked evenings, less food in the bin, and a bit more money left over.","c":2,"k":"s","ps":false},{"t":"So here are the key takeaways.","c":2,"k":"s","ps":true},{"t":"Plan once a week, starting with what's already in your kitchen, and plan fewer meals than there are nights.","c":2,"k":"s","ps":false},{"t":"Cook in batches, choose ingredients that work in more than one meal, and remember that use-by means safety while best-before means quality.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. According to End Food Waste Australia, food wasted at home can cost a household up to how much a year?","c":3,"k":"q","ps":false},{"t":"Answer. About $2,500, or roughly $50 a week.","c":3,"k":"a","ps":false},{"t":"Question two. Why should you plan fewer dinners than there are nights in the week?","c":3,"k":"q","ps":false},{"t":"Answer. To leave room for leftovers and a flexible night, so food doesn't go to waste when plans change.","c":3,"k":"a","ps":false},{"t":"Question three. What's the difference between a use-by date and a best-before date?","c":3,"k":"q","ps":false},{"t":"Answer. Use-by is about safety. Best-before is about quality.","c":3,"k":"a","ps":false},{"t":"That's the end of Meal Planning Without the Misery. Enjoy your dinner.","c":3,"k":"end","ps":false}]}}/*AUDIO:END*/;

async function initDownloads(){
  if (!DL.mode) return;
  try{
    if (DL.mode === "native"){
      await FS.mkdir({path:"audio", directory:"DATA", recursive:true}).catch(()=>{});
      const r = await FS.readdir({path:"audio", directory:"DATA"});
      for (const f of r.files || []){
        const name = typeof f === "string" ? f : f.name;
        const m = name.match(/^(\w+)-(af_heart|am_michael)\.(?:mp4|m4a|mp3)$/); if (!m || !L[m[1]]) continue;
        const v = m[2] === "af_heart" ? "f" : "m";
        const { uri } = await FS.getUri({path:"audio/"+name, directory:"DATA"});
        DL.saved[dkey(m[1], v)] = CAP.convertFileSrc(uri);
        DL.sizes[dkey(m[1], v)] = (typeof f === "object" && f.size) || 0;
      }
    } else {
      const c = await caches.open(CACHE);
      for (const req of await c.keys()){
        const m = req.url.match(/\/(\w+)-(af_heart|am_michael)\.(?:mp4|m4a|mp3)$/); if (!m || !L[m[1]]) continue;
        const k = dkey(m[1], m[2] === "af_heart" ? "f" : "m");
        DL.saved[k] = true;
        try{ DL.sizes[k] = +(await c.match(req)).headers.get("content-length") || 0; }catch(e){}
      }
    }
  }catch(e){ console.warn("Downloads unavailable", e); DL.mode = DL.mode === "web" ? null : DL.mode; }
  renderApp();
}

function blobToBase64(blob){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
async function fetchWithProgress(url, onP){
  const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status);
  const total = +r.headers.get("content-length") || 0;
  if (!r.body || !total) return await r.blob();
  const reader = r.body.getReader(); const parts = []; let got = 0;
  for(;;){ const {done, value} = await reader.read(); if (done) break; parts.push(value); got += value.length; onP(got/total); }
  return new Blob(parts, {type:"audio/mp4"});
}
let dlRenderT = null;

function download(ids, v=S.voice){
  if (!DL.mode) return;
  for (const id of [].concat(ids)){
    if (isSaved(id, v) || DL.queue.some(q=>q.id===id && q.v===v)) continue;
    DL.queue.push({id, v}); DL.busy[id] = DL.busy[id] || 0;
  }
  renderApp(); runDownloads();
}
async function runDownloads(){
  if (DL.running) return; DL.running = true;
  while (DL.queue.length){
    const {id, v} = DL.queue[0];
    try{
      const blob = await fetchWithProgress(absUrl(id, v), p => { DL.busy[id] = p; dlRender(); });
      const k = dkey(id, v);
      if (DL.mode === "native"){
        const path = "audio/" + fileFor(id, v);
        await FS.writeFile({path, directory:"DATA", data: await blobToBase64(blob), recursive:true});
        const { uri } = await FS.getUri({path, directory:"DATA"});
        DL.saved[k] = CAP.convertFileSrc(uri);
      } else {
        const c = await caches.open(CACHE);
        await c.put(absUrl(id, v), new Response(blob, {headers:{"Content-Type":"audio/mp4","Content-Length":String(blob.size)}}));
        DL.saved[k] = true;
      }
      DL.sizes[k] = blob.size;
    }catch(e){
      toast(navigator.onLine === false ? "You're offline. Downloads will need a connection." : "Download failed. Check your connection and try again.");
      DL.queue = DL.queue.filter(q=>q.id!==id); delete DL.busy[id]; continue;
    }
    DL.queue.shift();
    if (!DL.queue.some(q=>q.id===id)) delete DL.busy[id];
    dlRender();
  }
  DL.running = false; renderApp(); if (S.sheetOpen) renderSheet();
}
async function removeDownload(id){
  for (const v of Object.keys(VOICES)){
    const k = dkey(id, v); if (!DL.saved[k]) continue;
    try{
      if (DL.mode === "native") await FS.deleteFile({path:"audio/"+fileFor(id, v), directory:"DATA"});
      else await (await caches.open(CACHE)).delete(absUrl(id, v));
    }catch(e){}
    delete DL.saved[k]; delete DL.sizes[k];
  }
  renderAll();
}
