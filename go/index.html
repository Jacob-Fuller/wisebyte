ps":true},{"t":"Maybe it was about politics at a family barbecue, or whose turn it was to do the dishes, or something a friend posted online.","c":0,"k":"s","ps":false},{"t":"Chances are, at some point, it stopped being about the question and started being about something else.","c":0,"k":"s","ps":false},{"t":"This lesson is about how that happens, and how to steer it back.","c":0,"k":"s","ps":false},{"t":"People have been cataloguing bad arguments for a very long time.","c":0,"k":"s","ps":true},{"t":"More than two thousand three hundred years ago, Aristotle wrote a short work usually known as On Sophistical Refutations.","c":0,"k":"s","ps":false},{"t":"In it, he listed thirteen ways an argument can look convincing while actually being faulty.","c":0,"k":"s","ps":false},{"t":"The sophists were paid teachers of persuasion in ancient Greece, and Aristotle thought many of them cared more about winning than about the truth.","c":0,"k":"s","ps":false},{"t":"Two thousand years later, the German philosopher Arthur Schopenhauer came at it from the other side, with his tongue firmly in his cheek.","c":0,"k":"s","ps":true},{"t":"Around 1830, he wrote a short, sharp essay that was only published after his death.","c":0,"k":"s","ps":false},{"t":"It's usually translated as The Art of Being Right.","c":0,"k":"s","ps":false},{"t":"It lists thirty-eight dirty tricks for winning an argument, whether you're right or not.","c":0,"k":"s","ps":false},{"t":"Exaggerate your opponent's claim.","c":0,"k":"s","ps":false},{"t":"Make them angry.","c":0,"k":"s","ps":false},{"t":"If you're losing, change the subject.","c":0,"k":"s","ps":false},{"t":"Reading it today feels a lot like reading a comment section.","c":0,"k":"s","ps":false},{"t":"So what exactly is a fallacy?","c":0,"k":"s","ps":true},{"t":"In plain English, it's a mistake in reasoning that can make a weak argument sound strong.","c":0,"k":"s","ps":false},{"t":"It helps to separate two parts of any argument.","c":0,"k":"s","ps":false},{"t":"There are the reasons, which philosophers call premises.","c":0,"k":"s","ps":false},{"t":"And there's the conclusion, the thing the reasons are meant to support.","c":0,"k":"s","ps":false},{"t":"An argument can go wrong because the reasons are false.","c":0,"k":"s","ps":false},{"t":"Or it can go wrong because, even if the reasons were true, they wouldn't actually support the conclusion.","c":0,"k":"s","ps":false},{"t":"Most fallacies are the second kind.","c":0,"k":"s","ps":false},{"t":"The link between the reasons and the conclusion is broken, but it doesn't feel broken.","c":0,"k":"s","ps":false},{"t":"Philosophers split fallacies into two families, formal and informal.","c":0,"k":"s","ps":true},{"t":"Formal fallacies are errors in the bare structure of an argument, the kind you'd meet in a logic textbook.","c":0,"k":"s","ps":false},{"t":"Informal fallacies depend on the content and the context.","c":0,"k":"s","ps":false},{"t":"They're the ones you meet at work, at home and in the news, and they're what this lesson is about.","c":0,"k":"s","ps":false},{"t":"Here's something encouraging before we start.","c":0,"k":"s","ps":true},{"t":"Humans are often poor reasoners on our own, but surprisingly good reasoners together.","c":0,"k":"s","ps":false},{"t":"There's a famous logic puzzle called the Wason selection task, which only about one in ten people solve when they try it alone.","c":0,"k":"s","ps":false},{"t":"In a 1998 study, the psychologists David Moshman and Molly Geil gave the same puzzle to small groups who talked it through.","c":0,"k":"s","ps":false},{"t":"About three quarters of the groups got it right.","c":0,"k":"s","ps":false},{"t":"And it wasn't simply that one clever person told everyone else the answer.","c":0,"k":"s","ps":false},{"t":"The groups argued their way there, testing each other's reasons.","c":0,"k":"s","ps":false},{"t":"The French cognitive scientists Hugo Mercier and Dan Sperber have built a whole theory on findings like this.","c":0,"k":"s","ps":true},{"t":"They suggest that human reasoning may have evolved mainly for arguing, for giving reasons to other people and weighing up theirs.","c":0,"k":"s","ps":false},{"t":"We're lazy about checking our own arguments, but sharp at spotting the flaws in someone else's.","c":0,"k":"s","ps":false},{"t":"That's why arguing well matters.","c":0,"k":"s","ps":false},{"t":"Done properly, a disagreement is one of the best tools we have for getting closer to the truth.","c":0,"k":"s","ps":false},{"t":"Done badly, it's just noise, and hurt feelings.","c":0,"k":"s","ps":false},{"t":"Over the next three parts, we'll meet twelve common fallacies, in three groups of four.","c":0,"k":"s","ps":true},{"t":"First, fallacies that attack the wrong target.","c":0,"k":"s","ps":false},{"t":"Then fallacies that rig the choices.","c":0,"k":"s","ps":false},{"t":"Then fallacies built on shaky evidence.","c":0,"k":"s","ps":false},{"t":"For each one, you'll hear what it sounds like, why it's tempting, and a calm way to answer it.","c":0,"k":"s","ps":false},{"t":"In the final part, we'll look at how to disagree without starting a fight, including one mistake that people who know all about fallacies make all the time.","c":0,"k":"s","ps":false},{"t":"If you're driving, there's nothing to write down or remember perfectly.","c":0,"k":"s","ps":true},{"t":"Just listen along, and notice which ones sound familiar.","c":0,"k":"s","ps":false},{"t":"Part two. Attacking the wrong target.","c":1,"k":"head","ps":false},{"t":"Our first group of fallacies share one feature.","c":1,"k":"s","ps":true},{"t":"Instead of dealing with the argument that was actually made, they aim somewhere else.","c":1,"k":"s","ps":false},{"t":"Fallacy number one is the straw man.","c":1,"k":"s","ps":true},{"t":"This is when you swap someone's real position for a weaker, sillier version, then knock that down instead.","c":1,"k":"s","ps":false},{"t":"The name comes from the idea of fighting a scarecrow rather than a real opponent.","c":1,"k":"s","ps":false},{"t":"It's much easier to win.","c":1,"k":"s","ps":false},{"t":"Here's an everyday example.","c":1,"k":"s","ps":true},{"t":"One parent says, I think the kids should have a bit less screen time on school nights.","c":1,"k":"s","ps":false},{"t":"The other replies, so you want to ban all technology and send them back to the Stone Age?","c":1,"k":"s","ps":false},{"t":"Nobody said that.","c":1,"k":"s","ps":false},{"t":"But now the first parent has to defend a position they never held.","c":1,"k":"s","ps":false},{"t":"The straw man is tempting because we often hear other people's views through our own frustration.","c":1,"k":"s","ps":true},{"t":"We remember the most extreme version of what they said, or what someone else on their side once said.","c":1,"k":"s","ps":false},{"t":"A good response is to calmly restate your actual point.","c":1,"k":"s","ps":false},{"t":"Try something like, that's not quite what I'm saying.","c":1,"k":"s","ps":false},{"t":"I'm saying one hour less on school nights.","c":1,"k":"s","ps":false},{"t":"Can we talk about that?","c":1,"k":"s","ps":false},{"t":"Fallacy number two is the ad hominem.","c":1,"k":"s","ps":true},{"t":"That's Latin for to the person.","c":1,"k":"s","ps":false},{"t":"It means attacking the person making an argument, instead of the argument itself.","c":1,"k":"s","ps":false},{"t":"Well, you would say that, you're a public servant.","c":1,"k":"s","ps":false},{"t":"What would you know, you've never run a business.","c":1,"k":"s","ps":false},{"t":"He can't be right about the budget, have you seen the state of his car?","c":1,"k":"s","ps":false},{"t":"Here's the key point.","c":1,"k":"s","ps":true},{"t":"Who someone is doesn't tell you whether their argument holds up.","c":1,"k":"s","ps":false},{"t":"A good argument from a person you dislike is still a good argument.","c":1,"k":"s","ps":false},{"t":"And a bad argument from your favourite person is still a bad one.","c":1,"k":"s","ps":false},{"t":"There's an important exception.","c":1,"k":"s","ps":true},{"t":"Sometimes a person's character or interests really are relevant.","c":1,"k":"s","ps":false},{"t":"Think of a witness in court, or a financial adviser recommending a product that pays them commission.","c":1,"k":"s","ps":false},{"t":"If you're relying on their word, it's fair to ask about their honesty and their incentives.","c":1,"k":"s","ps":false},{"t":"The fallacy is using the person to dismiss an argument whose reasons you could check for yourself.","c":1,"k":"s","ps":false},{"t":"A calm response is to steer back to those reasons.","c":1,"k":"s","ps":false},{"t":"Try, fair enough, but set me aside for a second.","c":1,"k":"s","ps":false},{"t":"What's wrong with the argument itself?","c":1,"k":"s","ps":false},{"t":"Fallacy number three is whataboutism.","c":1,"k":"s","ps":true},{"t":"Its older name is tu quoque, which is Latin for you too.","c":1,"k":"s","ps":false},{"t":"It means answering a criticism by pointing to someone else's bad behaviour, often the critic's own.","c":1,"k":"s","ps":false},{"t":"You tell a mate he shouldn't drive home after four beers, and he says, what about you, you drove after a few last month.","c":1,"k":"s","ps":false},{"t":"The word whataboutism took off during the Cold War.","c":1,"k":"s","ps":false},{"t":"Critics used it to describe how Soviet officials answered criticism of their own record by pointing to problems in the West.","c":1,"k":"s","ps":false},{"t":"The trouble is that two wrongs don't make a right, as your nan probably told you.","c":1,"k":"s","ps":true},{"t":"Your mate's point about you might be fair.","c":1,"k":"s","ps":false},{"t":"You might even be a hypocrite.","c":1,"k":"s","ps":false},{"t":"That still doesn't make his drink driving safe.","c":1,"k":"s","ps":false},{"t":"Both things can be true at once.","c":1,"k":"s","ps":false},{"t":"A good reply accepts the hit and then returns to the point.","c":1,"k":"s","ps":false},{"t":"You're right, I shouldn't have done that either.","c":1,"k":"s","ps":false},{"t":"Let's both leave the car here tonight.","c":1,"k":"s","ps":false},{"t":"Fallacy number four is the red herring.","c":1,"k":"s","ps":true},{"t":"That's bringing up something irrelevant to pull attention away from the real question.","c":1,"k":"s","ps":false},{"t":"The name is usually linked to the idea of dragging a strong-smelling smoked fish across a trail to throw hunting dogs off the scent.","c":1,"k":"s","ps":false},{"t":"Word historians think the English journalist William Cobbett popularised the phrase in 1807, with a story that was probably made up.","c":1,"k":"s","ps":false},{"t":"Red herrings are everywhere in public life.","c":1,"k":"s","ps":true},{"t":"A company is asked why its prices went up, and the spokesperson talks about how many local jobs it creates.","c":1,"k":"s","ps":false},{"t":"A politician is asked about a broken promise and answers with a story about the other side's mistakes.","c":1,"k":"s","ps":false},{"t":"At home, it sounds like, why didn't you pay the phone bill, followed by, well, you never take the bins out.","c":1,"k":"s","ps":false},{"t":"The bins may be a genuine grievance.","c":1,"k":"s","ps":false},{"t":"But they're not the phone bill.","c":1,"k":"s","ps":false},{"t":"The best response is to name the topic, not the tactic.","c":1,"k":"s","ps":true},{"t":"Saying, that's a red herring, can sound like an accusation.","c":1,"k":"s","ps":false},{"t":"Instead, try, that might be worth talking about too.","c":1,"k":"s","ps":false},{"t":"Can we sort out the phone bill first?","c":1,"k":"s","ps":false},{"t":"Then come back to the bins.","c":1,"k":"s","ps":false},{"t":"Often people throw in red herrings not out of cunning but because they feel cornered.","c":1,"k":"s","ps":false},{"t":"Leaving them a dignified path back to the main topic helps.","c":1,"k":"s","ps":false},{"t":"Notice what these four have in common.","c":1,"k":"s","ps":true},{"t":"The straw man attacks a position nobody holds.","c":1,"k":"s","ps":false},{"t":"The ad hominem attacks the person.","c":1,"k":"s","ps":false},{"t":"Whataboutism attacks the critic.","c":1,"k":"s","ps":false},{"t":"And the red herring attacks a different topic altogether.","c":1,"k":"s","ps":false},{"t":"Whenever you feel an argument drifting, ask yourself one quiet question.","c":1,"k":"s","ps":false},{"t":"Are we still talking about the thing we started talking about?","c":1,"k":"s","ps":false},{"t":"Part three. Rigging the choices.","c":2,"k":"head","ps":false},{"t":"The second group of fallacies doesn't dodge the argument.","c":2,"k":"s","ps":true},{"t":"Instead, it quietly limits what's on the table, so that one conclusion seems forced.","c":2,"k":"s","ps":false},{"t":"Fallacy number five is the false dilemma, sometimes called a false choice, or black and white thinking.","c":2,"k":"s","ps":true},{"t":"It presents two options as if they're the only possibilities, when there are others.","c":2,"k":"s","ps":false},{"t":"Either we renovate the whole kitchen or we'll never sell this house.","c":2,"k":"s","ps":false},{"t":"Either you're with me on this or you're against me.","c":2,"k":"s","ps":false},{"t":"If you don't love your job, you should quit.","c":2,"k":"s","ps":false},{"t":"False dilemmas are tempting because they make decisions feel simple and urgent.","c":2,"k":"s","ps":true},{"t":"They're also a favourite of salespeople.","c":2,"k":"s","ps":false},{"t":"You can take the premium plan, or keep putting your family at risk.","c":2,"k":"s","ps":false},{"t":"Those are rarely the only two choices.","c":2,"k":"s","ps":false},{"t":"To answer a false dilemma, you don't need to argue hard for the other option.","c":2,"k":"s","ps":true},{"t":"Just widen the view.","c":2,"k":"s","ps":false},{"t":"Try, are those really the only two options?","c":2,"k":"s","ps":false},{"t":"What about a new benchtop and a fresh coat of paint?","c":2,"k":"s","ps":false},{"t":"Most real problems have a middle path, a third option, or a way to test things before fully committing.","c":2,"k":"s","ps":false},{"t":"Fallacy number six is the slippery slope.","c":2,"k":"s","ps":true},{"t":"It's the claim that one small step will inevitably set off a chain of events ending in disaster.","c":2,"k":"s","ps":false},{"t":"If we let the kids have dessert on a Tuesday, next they'll want it every night, and before you know it they'll be living on lollies.","c":2,"k":"s","ps":false},{"t":"If we allow one more cafe on the main street, the whole town will turn into a food court.","c":2,"k":"s","ps":false},{"t":"Here's where it gets interesting.","c":2,"k":"s","ps":true},{"t":"Not every slippery slope argument is a fallacy.","c":2,"k":"s","ps":false},{"t":"Some chains of events really do happen.","c":2,"k":"s","ps":false},{"t":"The question is whether each step in the chain is actually likely.","c":2,"k":"s","ps":false},{"t":"The fallacy is treating the slide as inevitable, without giving reasons for each link.","c":2,"k":"s","ps":false},{"t":"A calm response is to ask about those links.","c":2,"k":"s","ps":false},{"t":"Okay, walk me through it.","c":2,"k":"s","ps":false},{"t":"Why would dessert on one Tuesday lead to dessert every night?","c":2,"k":"s","ps":false},{"t":"Is there a point where we could just stop?","c":2,"k":"s","ps":false},{"t":"Often the chain turns out to have plenty of sensible places to stop.","c":2,"k":"s","ps":false},{"t":"Fallacy number seven is the loaded question.","c":2,"k":"s","ps":true},{"t":"That's a question with an assumption built into it, so that any direct answer seems to admit the assumption.","c":2,"k":"s","ps":false},{"t":"The textbook example is, have you stopped cheating at cards?","c":2,"k":"s","ps":false},{"t":"Answer yes, and you admit you used to cheat.","c":2,"k":"s","ps":false},{"t":"Answer no, and it sounds even worse.","c":2,"k":"s","ps":false},{"t":"Everyday versions are sneakier.","c":2,"k":"s","ps":false},{"t":"Why are you always so defensive?","c":2,"k":"s","ps":false},{"t":"Are you still wasting money on that gym you never go to?","c":2,"k":"s","ps":false},{"t":"How much longer are you going to ignore the problem?","c":2,"k":"s","ps":false},{"t":"Loaded questions work because questions feel innocent.","c":2,"k":"s","ps":true},{"t":"We're trained from childhood to answer them.","c":2,"k":"s","ps":false},{"t":"The trick is to answer the assumption, not the question.","c":2,"k":"s","ps":false},{"t":"Try, I don't agree that I'm always defensive.","c":2,"k":"s","ps":false},{"t":"Can you tell me what I did just now that felt that way?","c":2,"k":"s","ps":false},{"t":"That turns a trap into a real conversation.","c":2,"k":"s","ps":false},{"t":"Fallacy number eight is the middle ground, sometimes called the argument to moderation.","c":2,"k":"s","ps":true},{"t":"It's assuming the truth must lie halfway between two positions.","c":2,"k":"s","ps":false},{"t":"One engineer says a bridge is safe.","c":2,"k":"s","ps":false},{"t":"Another says it's about to collapse.","c":2,"k":"s","ps":false},{"t":"So the truth must be that it's half safe.","c":2,"k":"s","ps":false},{"t":"That's obviously silly with a bridge.","c":2,"k":"s","ps":false},{"t":"But we fall for it all the time with opinions, because splitting the difference feels fair and reasonable.","c":2,"k":"s","ps":false},{"t":"Compromise is often a great way to make a decision.","c":2,"k":"s","ps":true},{"t":"If you want to spend $400 on a new couch and your partner wants to spend $2,000, meeting somewhere in between might be exactly right.","c":2,"k":"s","ps":false},{"t":"That's a negotiation about preferences, and there's no single correct answer.","c":2,"k":"s","ps":false},{"t":"But when the disagreement is about facts, the midpoint has no special claim to truth.","c":2,"k":"s","ps":false},{"t":"If one person says water boils at one hundred degrees at sea level, and another insists it's fifty, the answer isn't seventy-five.","c":2,"k":"s","ps":false},{"t":"So a good response is to separate matters of taste from matters of fact.","c":2,"k":"s","ps":true},{"t":"Try, I'm happy to meet you halfway on how we do this.","c":2,"k":"s","ps":false},{"t":"But on whether it's true, let's look it up together.","c":2,"k":"s","ps":false},{"t":"That keeps the friendliness of compromise, without pretending that facts can be negotiated.","c":2,"k":"s","ps":false},{"t":"So that's the second group.","c":2,"k":"s","ps":true},{"t":"The false dilemma hides the other options.","c":2,"k":"s","ps":false},{"t":"The slippery slope hides the places you could stop.","c":2,"k":"s","ps":false},{"t":"The loaded question hides an assumption.","c":2,"k":"s","ps":false},{"t":"And the middle ground hides the difference between a fair deal and a true fact.","c":2,"k":"s","ps":false},{"t":"In each case, the answer is to gently reveal what's been hidden, without trying to score points.","c":2,"k":"s","ps":false},{"t":"Part four. Shaky evidence, shaky links.","c":3,"k":"head","ps":false},{"t":"Our third group of fallacies is about evidence.","c":3,"k":"s","ps":true},{"t":"These are the mistakes that turn a story, a coincidence or a label into something that feels like proof.","c":3,"k":"s","ps":false},{"t":"Fallacy number nine is the hasty generalisation.","c":3,"k":"s","ps":true},{"t":"That's drawing a broad conclusion from too few examples.","c":3,"k":"s","ps":false},{"t":"My grandad smoked a pack a day and lived to ninety-five, so smoking can't be that bad.","c":3,"k":"s","ps":false},{"t":"I went to that cafe once and the coffee was cold, so it's a terrible cafe.","c":3,"k":"s","ps":false},{"t":"My neighbour's electric car nearly ran flat on a country road, so they're useless for road trips.","c":3,"k":"s","ps":false},{"t":"The pull here is that one vivid story feels more real than a mountain of statistics.","c":3,"k":"s","ps":true},{"t":"We're built to learn from stories.","c":3,"k":"s","ps":false},{"t":"Your grandad was a real person you loved.","c":3,"k":"s","ps":false},{"t":"A table of health figures is not.","c":3,"k":"s","ps":false},{"t":"But one case, however vivid, can't tell you what usually happens.","c":3,"k":"s","ps":false},{"t":"For every grandad who smoked into his nineties, there were many who never got the chance.","c":3,"k":"s","ps":false},{"t":"A gentle response is to take the story seriously, then ask about the bigger picture.","c":3,"k":"s","ps":true},{"t":"That's a great innings.","c":3,"k":"s","ps":false},{"t":"I wonder how common that is, though.","c":3,"k":"s","ps":false},{"t":"Do we know what happens to most smokers?","c":3,"k":"s","ps":false},{"t":"That honours the person's experience, without letting one story stand in for the evidence.","c":3,"k":"s","ps":false},{"t":"Fallacy number ten has a Latin name, post hoc, ergo propter hoc.","c":3,"k":"s","ps":true},{"t":"It means after this, therefore because of this.","c":3,"k":"s","ps":false},{"t":"It's assuming that because one thing happened after another, the first must have caused the second.","c":3,"k":"s","ps":false},{"t":"I wore my lucky socks and my team won.","c":3,"k":"s","ps":false},{"t":"I started taking a vitamin and my cold cleared up in a week.","c":3,"k":"s","ps":false},{"t":"The new manager started in March, and sales went up in April.","c":3,"k":"s","ps":false},{"t":"Our brains are cause-finding machines, and usually that's useful.","c":3,"k":"s","ps":true},{"t":"If you eat an unfamiliar berry and feel sick an hour later, it's smart to avoid that berry.","c":3,"k":"s","ps":false},{"t":"But things often happen one after another by pure coincidence.","c":3,"k":"s","ps":false},{"t":"Most colds clear up in about a week anyway.","c":3,"k":"s","ps":false},{"t":"Sales might have risen because of the season, or the economy, or a competitor closing down.","c":3,"k":"s","ps":false},{"t":"A close cousin is confusing correlation with causation.","c":3,"k":"s","ps":true},{"t":"Ice cream sales and drownings both rise at the same time of year.","c":3,"k":"s","ps":false},{"t":"Ice cream doesn't cause drowning.","c":3,"k":"s","ps":false},{"t":"Hot weather drives both.","c":3,"k":"s","ps":false},{"t":"When someone tells you one thing caused another, a good calm question is, what else could explain that?","c":3,"k":"s","ps":false},{"t":"Or, what would have happened anyway?","c":3,"k":"s","ps":false},{"t":"Fallacy number eleven is the appeal to nature.","c":3,"k":"s","ps":true},{"t":"It's the assumption that natural means good or safe, and unnatural means bad.","c":3,"k":"s","ps":false},{"t":"It's all natural, so it can't hurt you.","c":3,"k":"s","ps":false},{"t":"That's not natural, so it must be wrong.","c":3,"k":"s","ps":false},{"t":"Australians should be especially immune to this one, because plenty of our most natural things are deadly.","c":3,"k":"s","ps":true},{"t":"The venom of the eastern brown snake is completely natural.","c":3,"k":"s","ps":false},{"t":"So is the box jellyfish.","c":3,"k":"s","ps":false},{"t":"So is the gympie-gympie, a rainforest stinging tree whose sting can hurt for weeks.","c":3,"k":"s","ps":false},{"t":"On the other side, plenty of very unnatural things are extremely good for us, from glasses to clean tap water to vaccines.","c":3,"k":"s","ps":false},{"t":"Natural is also a slippery word.","c":3,"k":"s","ps":true},{"t":"Is bread natural?","c":3,"k":"s","ps":false},{"t":"It doesn't grow on trees.","c":3,"k":"s","ps":false},{"t":"What about a herbal supplement made in a factory and sold in a plastic bottle?","c":3,"k":"s","ps":false},{"t":"When someone leans hard on the word natural, a useful response is to ask about the thing itself, not the label.","c":3,"k":"s","ps":false},{"t":"Try, natural sounds nice, but is it safe, and does it actually work?","c":3,"k":"s","ps":false},{"t":"What's the evidence?","c":3,"k":"s","ps":false},{"t":"Fallacy number twelve has a wonderful name.","c":3,"k":"s","ps":true},{"t":"It's the no true Scotsman.","c":3,"k":"s","ps":false},{"t":"The British philosopher Antony Flew described it in the 1970s with a little story, which goes roughly like this in paraphrase.","c":3,"k":"s","ps":false},{"t":"A Scotsman reads in the paper about a terrible crime committed by an Englishman, and says, no Scotsman would do such a thing.","c":3,"k":"s","ps":false},{"t":"The next day, he reads about an even worse crime, committed by a Scotsman.","c":3,"k":"s","ps":false},{"t":"Instead of changing his mind, he says, well, no true Scotsman would do such a thing.","c":3,"k":"s","ps":false},{"t":"The fallacy is protecting a claim from any evidence against it by quietly redefining the group.","c":3,"k":"s","ps":true},{"t":"You'll hear local versions all the time.","c":3,"k":"s","ps":false},{"t":"No true Aussie dislikes Vegemite.","c":3,"k":"s","ps":false},{"t":"And when you meet an Aussie who can't stand the stuff, well, they're not a real Aussie.","c":3,"k":"s","ps":false},{"t":"No real fan leaves before the final siren.","c":3,"k":"s","ps":false},{"t":"Every counterexample is simply defined away, so the claim can never be shown to be wrong.","c":3,"k":"s","ps":false},{"t":"That's why it's worth answering with one simple question.","c":3,"k":"s","ps":true},{"t":"What would it take to change your mind?","c":3,"k":"s","ps":false},{"t":"If the honest answer is nothing at all, then the claim isn't really about the world anymore.","c":3,"k":"s","ps":false},{"t":"It's about how we've chosen to use a word.","c":3,"k":"s","ps":false},{"t":"A close relative is moving the goalposts.","c":3,"k":"s","ps":false},{"t":"That's when, every time someone meets a standard of evidence, a new and higher standard appears.","c":3,"k":"s","ps":false},{"t":"Across these four, the common thread is this.","c":3,"k":"s","ps":true},{"t":"Stories, sequences, labels and definitions can all feel like evidence without actually being evidence.","c":3,"k":"s","ps":false},{"t":"The calm questions to reach for are these.","c":3,"k":"s","ps":false},{"t":"How typical is that?","c":3,"k":"s","ps":false},{"t":"What else could explain it?","c":3,"k":"s","ps":false},{"t":"What's the actual evidence?","c":3,"k":"s","ps":false},{"t":"And what would change your mind?","c":3,"k":"s","ps":false},{"t":"Part five. Disagreeing without a fight.","c":4,"k":"head","ps":false},{"t":"You now know twelve fallacies.","c":4,"k":"s","ps":true},{"t":"So here's the most important warning in the whole lesson.","c":4,"k":"s","ps":false},{"t":"Knowing the names of fallacies can make you a worse arguer, not a better one.","c":4,"k":"s","ps":false},{"t":"Imagine someone makes a reasonable point in a clumsy way, and you jump in with, that's an ad hominem, or, that's a slippery slope.","c":4,"k":"s","ps":true},{"t":"Even if you're technically right, you've just told them they're foolish.","c":4,"k":"s","ps":false},{"t":"They'll dig in.","c":4,"k":"s","ps":false},{"t":"And there's a deeper problem.","c":4,"k":"s","ps":false},{"t":"An argument with a fallacy in it can still have a true conclusion.","c":4,"k":"s","ps":false},{"t":"Your friend might say the new intersection is dangerous because the engineer who designed it is an idiot.","c":4,"k":"s","ps":false},{"t":"That's an ad hominem.","c":4,"k":"s","ps":false},{"t":"But the intersection might still be dangerous.","c":4,"k":"s","ps":false},{"t":"Rejecting a conclusion just because someone argued for it badly is itself a mistake.","c":4,"k":"s","ps":false},{"t":"It even has a name.","c":4,"k":"s","ps":false},{"t":"The fallacy fallacy.","c":4,"k":"s","ps":false},{"t":"So the goal isn't to catch people out.","c":4,"k":"s","ps":true},{"t":"It's to get closer to the truth together, and keep the relationship in one piece.","c":4,"k":"s","ps":false},{"t":"Here are some tools that help.","c":4,"k":"s","ps":false},{"t":"The first comes from the American philosopher Daniel Dennett.","c":4,"k":"s","ps":true},{"t":"In his 2013 book Intuition Pumps and Other Tools for Thinking, he described what he called Rapoport's rules, named after the mathematician and game theorist Anatol Rapoport.","c":4,"k":"s","ps":false},{"t":"Here they are, in paraphrase.","c":4,"k":"s","ps":false},{"t":"First, restate the other person's position so clearly, vividly and fairly that they say, thanks, I wish I'd thought of putting it that way.","c":4,"k":"s","ps":false},{"t":"Second, list any points where you agree, especially ones that aren't widely shared.","c":4,"k":"s","ps":false},{"t":"Third, mention anything you've learned from them.","c":4,"k":"s","ps":false},{"t":"Only then, fourth, are you allowed to say a single word of criticism.","c":4,"k":"s","ps":false},{"t":"It sounds almost too polite.","c":4,"k":"s","ps":true},{"t":"But think about what it does.","c":4,"k":"s","ps":false},{"t":"By the time you disagree, the other person knows you've actually understood them, so they're far more likely to listen.","c":4,"k":"s","ps":false},{"t":"It's also the exact opposite of the straw man.","c":4,"k":"s","ps":false},{"t":"People sometimes call this steelmanning.","c":4,"k":"s","ps":false},{"t":"You argue against the strongest version of someone's view, rather than the weakest.","c":4,"k":"s","ps":false},{"t":"The second tool is a question.","c":4,"k":"s","ps":true},{"t":"How would that actually work?","c":4,"k":"s","ps":false},{"t":"In 2013, a team led by the cognitive scientist Philip Fernbach worked with Americans who held strong opinions on political issues.","c":4,"k":"s","ps":false},{"t":"They asked them to explain, step by step, how their preferred policy would actually work.","c":4,"k":"s","ps":false},{"t":"Not why they supported it.","c":4,"k":"s","ps":false},{"t":"Just how it would work.","c":4,"k":"s","ps":false},{"t":"After trying, most people realised they understood the issue less well than they'd thought, and their views became less extreme.","c":4,"k":"s","ps":false},{"t":"Interestingly, asking people to list their reasons for their view didn't have the same effect.","c":4,"k":"s","ps":false},{"t":"Listing reasons tends to harden a position.","c":4,"k":"s","ps":false},{"t":"Explaining the mechanics tends to soften it.","c":4,"k":"s","ps":false},{"t":"This builds on an earlier finding called the illusion of explanatory depth.","c":4,"k":"s","ps":true},{"t":"The researchers Leonid Rozenblit and Frank Keil found that people believe they understand everyday things, like zips, flushing toilets and locks, far better than they really do.","c":4,"k":"s","ps":false},{"t":"Ask them to explain one step by step, and their confidence drains away.","c":4,"k":"s","ps":false},{"t":"You can use this kindly in any disagreement.","c":4,"k":"s","ps":false},{"t":"Instead of saying, you're wrong, try, that's interesting, how would that work in practice?","c":4,"k":"s","ps":false},{"t":"And ask it of yourself, too.","c":4,"k":"s","ps":false},{"t":"The third tool is to aim high on what the essayist Paul Graham called the hierarchy of disagreement.","c":4,"k":"s","ps":true},{"t":"In a 2008 essay, he ranked ways of disagreeing from worst to best.","c":4,"k":"s","ps":false},{"t":"At the bottom is name-calling.","c":4,"k":"s","ps":false},{"t":"Then attacking the person.","c":4,"k":"s","ps":false},{"t":"Then responding to their tone rather than their content.","c":4,"k":"s","ps":false},{"t":"Then simple contradiction, just stating the opposite.","c":4,"k":"s","ps":false},{"t":"Higher up comes counterargument, giving reasons for a different view.","c":4,"k":"s","ps":false},{"t":"Then refutation, showing exactly where their argument goes wrong.","c":4,"k":"s","ps":false},{"t":"And at the very top, refuting their central point, not some side issue.","c":4,"k":"s","ps":false},{"t":"Most arguments that go badly never climb past the middle.","c":4,"k":"s","ps":false},{"t":"It's also worth letting go of one popular idea.","c":4,"k":"s","ps":true},{"t":"You may have heard of the backfire effect.","c":4,"k":"s","ps":false},{"t":"That's the claim that correcting people with facts makes them cling even harder to their false belief.","c":4,"k":"s","ps":false},{"t":"It came from a well-known study published in 2010.","c":4,"k":"s","ps":false},{"t":"But when the political scientists Thomas Wood and Ethan Porter tested it with more than ten thousand people, across dozens of issues, they found it was rare.","c":4,"k":"s","ps":false},{"t":"Most people shifted at least a little towards the facts.","c":4,"k":"s","ps":false},{"t":"So facts do help.","c":4,"k":"s","ps":false},{"t":"They just work better when they're offered with respect, and when the other person doesn't have to lose face to accept them.","c":4,"k":"s","ps":false},{"t":"That leads to a final practical point.","c":4,"k":"s","ps":true},{"t":"Give people a way to change their mind with dignity.","c":4,"k":"s","ps":false},{"t":"Nobody likes to admit defeat in front of an audience.","c":4,"k":"s","ps":false},{"t":"Try saying things like, I used to think that too.","c":4,"k":"s","ps":false},{"t":"Or, I can see why that seems right.","c":4,"k":"s","ps":false},{"t":"Or, let's both look it up.","c":4,"k":"s","ps":false},{"t":"Sometimes the best move is to let an argument rest and come back to it tomorrow, when nobody has to win in front of anyone.","c":4,"k":"s","ps":false},{"t":"And be ready to change your own mind.","c":4,"k":"s","ps":true},{"t":"The whole point of spotting fallacies is to reason better, and that includes your own reasoning.","c":4,"k":"s","ps":false},{"t":"If you catch yourself building a straw man, or reaching for a what about you, just say so.","c":4,"k":"s","ps":false},{"t":"It's disarming, and it's honest.","c":4,"k":"s","ps":false},{"t":"So here are the key takeaways.","c":4,"k":"s","ps":true},{"t":"Most fallacies either attack the wrong target, rig the choices, or pass off stories and coincidences as evidence.","c":4,"k":"s","ps":false},{"t":"Each can be answered with a calm question instead of an accusation.","c":4,"k":"s","ps":false},{"t":"A badly argued point can still be true, so understand the strongest version of the other view before you criticise it.","c":4,"k":"s","ps":false},{"t":"And arguing well isn't about winning, it's about getting closer to the truth together.","c":4,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":5,"k":"head","ps":false},{"t":"Question one. What's the name for swapping someone's real position for a weaker version and attacking that instead?","c":5,"k":"q","ps":false},{"t":"Answer. The straw man.","c":5,"k":"a","ps":false},{"t":"Question two. What does post hoc, ergo propter hoc mean?","c":5,"k":"q","ps":false},{"t":"Answer. After this, therefore because of this. Assuming that what came first caused what came next.","c":5,"k":"a","ps":false},{"t":"Question three. What's the fallacy fallacy?","c":5,"k":"q","ps":false},{"t":"Answer. Rejecting a conclusion just because someone argued for it badly. A poorly argued point can still be true.","c":5,"k":"a","ps":false},{"t":"That's the end of How to Argue Well. Go well, and argue kindly.","c":5,"k":"end","ps":false}]},"feelwords":{"chapters":["Why the right word helps","Words borrowed from other languages","Longing and mixed feelings"],"at":{"f":[0.3,3.77,6.55,8.23,14.91,19.34,28.64,30.39,42.5,46.13,52.2,57.56,61.73,68.66,75.04,77.83,81.89,86.19,92.69,98.88,106.31,111.82,113.25,116.37,118.77,120.88,124.1,128.09,130.64,141.55,150.38,156.23,161.83,164.06,169.5,174.32,181.77,190.26,196.89,201.45,207.18,209.93,212.91,216.38,222.13,224.04,225.3,228.88,230.83,237.14,240.55,243.01,246.39,248.28,253.45,257.36,259.31,268.44,273.76,281.74,289.58,294.65,298.91,300.61,306.16,308.67,309.64,311.2,312.82,318.78,321.52,325.08,327.6,329.46,335.88,337.84,341.99,345.89,350.75,353.84,356.68,363.96,371.98,374.8,375.83,377.82,385.07,390.22,392.65,396.26,402.95,410.44,418.24,423.33,427.97,430.98,433.26,434.32,436.55,442.67,445.54,447.27,453.0,455.41,463.65,467.02,468.23,471.04,478.36,481.82,491.28,494.6,505.39,511.71,515.29,523.41,525.34,528.1,533.39,535.97,542.15,548.01,550.31,557.3,561.18,563.72,572.13,579.91,588.19,593.05,600.28,603.8,606.63,607.84,610.46,616.78,620.64,622.66,626.38,632.73,637.3,641.19,644.69,651.79,657.0,663.9,666.18,670.49,676.66,678.53,679.77,683.21,688.69,693.26,698.27,702.24,710.22,718.23,723.39,727.07,738.06,744.89,752.83,757.79,765.16,770.96],"m":[0.3,3.99,6.89,8.9,16.27,21.33,31.67,33.64,47.39,51.37,57.96,63.74,68.29,75.83,82.81,85.63,89.89,94.67,102.35,109.43,117.66,123.49,124.99,128.24,130.88,133.15,136.57,140.86,143.75,155.62,165.01,171.27,177.42,179.77,185.9,191.4,199.57,208.75,215.91,220.77,226.81,229.95,233.18,237.01,243.26,245.34,246.71,250.51,252.68,259.83,263.48,266.21,270.11,272.21,277.82,282.1,284.23,294.07,299.99,308.72,317.01,322.66,327.59,329.25,335.53,338.28,339.4,341.06,342.88,349.55,352.56,356.5,359.16,361.21,368.0,370.15,374.45,379.08,384.37,387.7,391.05,399.17,408.22,411.36,412.51,414.66,422.44,428.08,430.61,434.5,441.87,449.97,458.64,464.15,469.26,472.43,474.94,476.07,478.53,485.27,488.63,490.45,496.78,499.32,508.28,512.12,513.42,516.29,524.4,528.27,538.67,542.47,554.36,561.37,565.42,574.25,576.42,579.27,585.1,587.85,594.85,601.09,603.63,610.99,615.25,618.12,627.02,635.54,644.93,650.28,658.09,662.08,665.35,666.65,669.57,676.55,680.74,682.83,687.13,694.18,699.32,703.38,707.17,715.09,720.84,728.51,731.14,735.97,742.34,744.52,745.82,749.78,756.22,761.3,766.61,770.84,779.61,788.66,794.58,798.66,810.18,817.38,825.98,831.35,839.16,845.44]},"dur":{"f":777.0,"m":852.0},"units":[{"t":"Precise Words for Feelings.","c":-1,"k":"title","ps":false},{"t":"Part one. Why the right word helps.","c":0,"k":"head","ps":false},{"t":"How are you feeling right now?","c":0,"k":"s","ps":true},{"t":"If you're like most people, the first answer that comes to mind is something like fine, good, tired or stressed.","c":0,"k":"s","ps":false},{"t":"Those words are useful, but they're a bit like describing every meal as food.","c":0,"k":"s","ps":false},{"t":"In this lesson, we'll look at why naming feelings more precisely can make a genuine difference, and then we'll collect some wonderfully exact words to do it with.","c":0,"k":"s","ps":false},{"t":"Let's start with the science.","c":0,"k":"s","ps":false},{"t":"In 2007, a team led by the psychologist Matthew Lieberman at the University of California, Los Angeles, put people into a brain scanner and showed them photos of faces.","c":0,"k":"s","ps":false},{"t":"The faces were angry, frightened or otherwise emotional.","c":0,"k":"s","ps":false},{"t":"Sometimes, people were asked to pick the word that described the emotion, such as angry or scared.","c":0,"k":"s","ps":false},{"t":"Other times, they did a different task with the same faces, like matching them by gender.","c":0,"k":"s","ps":false},{"t":"When people named the emotion, activity in the amygdala went down.","c":0,"k":"s","ps":false},{"t":"The amygdala is a small part of the brain that's heavily involved in detecting threats and raising the alarm.","c":0,"k":"s","ps":false},{"t":"At the same time, an area in the front of the brain, linked to managing emotions, became more active.","c":0,"k":"s","ps":false},{"t":"Lieberman's team called this affect labelling.","c":0,"k":"s","ps":false},{"t":"Putting a feeling into words seemed to take a little of the heat out of it.","c":0,"k":"s","ps":false},{"t":"The psychologist Lisa Feldman Barrett has taken this idea further.","c":0,"k":"s","ps":false},{"t":"She uses the term emotional granularity to describe how finely a person can tell their feelings apart.","c":0,"k":"s","ps":false},{"t":"Someone with low granularity might describe a whole range of bad days as just feeling awful.","c":0,"k":"s","ps":false},{"t":"Someone with high granularity might tell the difference between feeling disappointed, embarrassed, lonely and irritated.","c":0,"k":"s","ps":false},{"t":"It's like the difference between a map that only shows states and a map that shows every street.","c":0,"k":"s","ps":false},{"t":"Why would that matter?","c":0,"k":"s","ps":false},{"t":"Because different feelings call for different responses.","c":0,"k":"s","ps":false},{"t":"Disappointment might need a new plan.","c":0,"k":"s","ps":false},{"t":"Loneliness might need a phone call.","c":0,"k":"s","ps":false},{"t":"Irritation might just need a walk around the block.","c":0,"k":"s","ps":false},{"t":"If everything is just awful, it's much harder to know what to do.","c":0,"k":"s","ps":false},{"t":"There's some intriguing evidence behind this.","c":0,"k":"s","ps":false},{"t":"In a 2010 study, Todd Kashdan and his colleagues asked young adult social drinkers in the United States to record their emotions several times a day for three weeks.","c":0,"k":"s","ps":false},{"t":"On days when they felt intensely negative, people who were good at telling their negative feelings apart drank noticeably less than those who weren't.","c":0,"k":"s","ps":false},{"t":"Other studies have linked finer emotional distinctions with handling stress and setbacks better.","c":0,"k":"s","ps":false},{"t":"The research is still developing, and a bigger vocabulary isn't a magic cure for anything.","c":0,"k":"s","ps":false},{"t":"But the direction is encouraging.","c":0,"k":"s","ps":false},{"t":"The more precisely you can name what you feel, the more options you seem to have for dealing with it.","c":0,"k":"s","ps":false},{"t":"And one of the easiest ways to build that precision is to borrow some good words.","c":0,"k":"s","ps":false},{"t":"The cultural historian Tiffany Watt Smith, at Queen Mary University of London, made this the theme of a whole book.","c":0,"k":"s","ps":false},{"t":"Her Book of Human Emotions, published in 2015, gathers one hundred and fifty-four words from around the world for how we feel.","c":0,"k":"s","ps":false},{"t":"Some are ancient, some are modern, and some come from languages that name feelings English barely notices.","c":0,"k":"s","ps":false},{"t":"Her point is that emotions aren't fixed and universal in every detail.","c":0,"k":"s","ps":false},{"t":"The words a culture has can shape which feelings people notice, talk about and take seriously.","c":0,"k":"s","ps":false},{"t":"We won't get through a hundred and fifty-four today.","c":0,"k":"s","ps":false},{"t":"But here are some of the most useful.","c":0,"k":"s","ps":false},{"t":"Part two. Words borrowed from other languages.","c":1,"k":"head","ps":false},{"t":"English is famously good at borrowing, and some of our most precise feeling words come from elsewhere.","c":1,"k":"s","ps":true},{"t":"Our first is from German.","c":1,"k":"s","ps":false},{"t":"Schadenfreude.","c":1,"k":"s","ps":false},{"t":"S, C, H, A, D, E, N, F, R, E, U, D, E.","c":1,"k":"s","ps":false},{"t":"Here's an everyday example.","c":1,"k":"s","ps":false},{"t":"I felt a twinge of schadenfreude when the bloke who cut me off in traffic got pulled over a kilometre later.","c":1,"k":"s","ps":false},{"t":"Schadenfreude is pleasure at someone else's misfortune.","c":1,"k":"s","ps":false},{"t":"The German word is built from two parts.","c":1,"k":"s","ps":false},{"t":"Schaden means harm or damage, and Freude means joy.","c":1,"k":"s","ps":false},{"t":"So it's literally harm joy.","c":1,"k":"s","ps":false},{"t":"It's not a flattering feeling, which is probably why it's so useful to have a word for it.","c":1,"k":"s","ps":false},{"t":"It lets us admit to something we'd otherwise pretend we don't feel.","c":1,"k":"s","ps":false},{"t":"Researchers have studied it too.","c":1,"k":"s","ps":false},{"t":"In 2011, the psychologist Mina Cikara and her colleagues scanned the brains of dedicated baseball fans in the United States.","c":1,"k":"s","ps":false},{"t":"They were supporters of two fierce rivals, the Boston Red Sox and the New York Yankees.","c":1,"k":"s","ps":false},{"t":"When fans watched their rival team fail, even against a third team, areas of the brain linked to reward became more active.","c":1,"k":"s","ps":false},{"t":"The fans who showed the strongest response also said they'd be more likely to heckle, insult or even hit a rival fan.","c":1,"k":"s","ps":false},{"t":"If you've ever enjoyed your footy team's biggest rival losing a close one, you've felt it.","c":1,"k":"s","ps":false},{"t":"The useful thing about naming it is that it gives you a moment of distance.","c":1,"k":"s","ps":false},{"t":"Oh, that's schadenfreude.","c":1,"k":"s","ps":false},{"t":"Once it has a name, it's easier to notice, have a small private laugh at yourself, and move on.","c":1,"k":"s","ps":false},{"t":"Our second borrowed word is from French.","c":1,"k":"s","ps":false},{"t":"Ennui.","c":1,"k":"s","ps":false},{"t":"E, N, N, U, I.","c":1,"k":"s","ps":false},{"t":"It's pronounced on-wee.","c":1,"k":"s","ps":false},{"t":"For example, by the third week of the school holidays, a kind of ennui had settled over the whole house.","c":1,"k":"s","ps":false},{"t":"Ennui isn't the same as ordinary boredom.","c":1,"k":"s","ps":false},{"t":"Boredom is what you feel waiting in a queue at the post office.","c":1,"k":"s","ps":false},{"t":"It's short, and it has an obvious cause.","c":1,"k":"s","ps":false},{"t":"Ennui is deeper and heavier.","c":1,"k":"s","ps":false},{"t":"It's a restless, weary dissatisfaction, a sense that nothing much is interesting or worth the effort.","c":1,"k":"s","ps":false},{"t":"Here's a nice piece of history.","c":1,"k":"s","ps":false},{"t":"Ennui and the English word annoy come from the same Latin source.","c":1,"k":"s","ps":false},{"t":"Both go back to a phrase meaning something like, it is hateful to me.","c":1,"k":"s","ps":false},{"t":"French kept the weary, world-tired sense, while English took the irritated one.","c":1,"k":"s","ps":false},{"t":"Having the word ennui can help you spot a pattern.","c":1,"k":"s","ps":false},{"t":"If you're bored in a queue, you need the queue to move.","c":1,"k":"s","ps":false},{"t":"If you're feeling ennui, you might need something new in your life, a change of routine, a new challenge, or simply more rest.","c":1,"k":"s","ps":false},{"t":"And if a flat, heavy feeling hangs around for weeks, it's worth talking to your GP, or looking at the government's healthdirect website.","c":1,"k":"s","ps":false},{"t":"Our third borrowed word is from Portuguese.","c":1,"k":"s","ps":false},{"t":"Saudade.","c":1,"k":"s","ps":false},{"t":"S, A, U, D, A, D, E.","c":1,"k":"s","ps":false},{"t":"For example, going through my grandmother's recipe book, I felt a deep saudade for those Sunday lunches at her place.","c":1,"k":"s","ps":false},{"t":"Saudade is a longing for someone or something that's absent, and that may never come back.","c":1,"k":"s","ps":false},{"t":"It mixes love and sadness together.","c":1,"k":"s","ps":false},{"t":"It isn't only sad, because the love is part of the feeling.","c":1,"k":"s","ps":false},{"t":"It's often called untranslatable, and in a sense it is, because English needs a whole sentence to capture it.","c":1,"k":"s","ps":false},{"t":"Saudade runs all through Portuguese and Brazilian culture, especially the mournful Portuguese songs called fado.","c":1,"k":"s","ps":false},{"t":"In the 1600s, the Portuguese writer Francisco Manuel de Melo described it in a phrase that's often quoted.","c":1,"k":"s","ps":false},{"t":"Loosely translated, he called it a good that is suffered and an ill that is enjoyed.","c":1,"k":"s","ps":false},{"t":"That captures the strange sweetness of missing someone you loved.","c":1,"k":"s","ps":false},{"t":"Part three. Longing and mixed feelings.","c":2,"k":"head","ps":false},{"t":"Our next word is home-grown English.","c":2,"k":"s","ps":true},{"t":"Wistful.","c":2,"k":"s","ps":false},{"t":"W, I, S, T, F, U, L.","c":2,"k":"s","ps":false},{"t":"For example, she gave a wistful smile as the old family car was driven away by its new owner.","c":2,"k":"s","ps":false},{"t":"Wistful is a gentle, slightly sad longing.","c":2,"k":"s","ps":false},{"t":"It's softer than saudade.","c":2,"k":"s","ps":false},{"t":"It's the feeling of looking back at something with fondness and a small ache, without being truly upset.","c":2,"k":"s","ps":false},{"t":"Its origins are a little uncertain.","c":2,"k":"s","ps":false},{"t":"Dictionary makers think it probably grew from an old word, wistly, meaning intently or longingly, and was influenced by wishful.","c":2,"k":"s","ps":false},{"t":"Our next word is one with a long and colourful history.","c":2,"k":"s","ps":false},{"t":"Melancholy.","c":2,"k":"s","ps":false},{"t":"M, E, L, A, N, C, H, O, L, Y.","c":2,"k":"s","ps":false},{"t":"For example, there's a certain melancholy to a beach town in winter, when the kiosks are shut and the car parks are empty.","c":2,"k":"s","ps":false},{"t":"The word comes from Greek, and it literally means black bile.","c":2,"k":"s","ps":false},{"t":"Ancient Greek doctors believed the body contained four fluids, called humours, and that too much black bile made a person sad, thoughtful and withdrawn.","c":2,"k":"s","ps":false},{"t":"That theory has long been abandoned, but the word stayed.","c":2,"k":"s","ps":false},{"t":"In 1621, the English scholar Robert Burton published an enormous book called The Anatomy of Melancholy, and he kept adding to it for the rest of his life.","c":2,"k":"s","ps":false},{"t":"Today, melancholy usually means a quiet, reflective sadness, often with no single clear cause.","c":2,"k":"s","ps":false},{"t":"It's gentler than grief and more thoughtful than feeling down.","c":2,"k":"s","ps":false},{"t":"Many people find a little melancholy on a rainy Sunday almost pleasant, and plenty of the world's best-loved music lives in that mood.","c":2,"k":"s","ps":false},{"t":"Our next word is nostalgia.","c":2,"k":"s","ps":false},{"t":"N, O, S, T, A, L, G, I, A.","c":2,"k":"s","ps":false},{"t":"For example, hearing that song from year twelve on the radio filled me with nostalgia.","c":2,"k":"s","ps":false},{"t":"Nostalgia has a surprising history.","c":2,"k":"s","ps":false},{"t":"It was coined in 1688 by a Swiss medical student called Johannes Hofer.","c":2,"k":"s","ps":false},{"t":"He built it from two Greek words, nostos, meaning a return home, and algos, meaning pain.","c":2,"k":"s","ps":false},{"t":"Hofer described it as a disease.","c":2,"k":"s","ps":false},{"t":"He'd noticed it in Swiss soldiers fighting far from home, who became so homesick that they stopped eating and grew ill.","c":2,"k":"s","ps":false},{"t":"For a long time, nostalgia was treated as a medical problem.","c":2,"k":"s","ps":false},{"t":"Today, researchers see it very differently.","c":2,"k":"s","ps":false},{"t":"At the University of Southampton, psychologists including Constantine Sedikides and Tim Wildschut have spent years studying it.","c":2,"k":"s","ps":false},{"t":"They've found that nostalgia is usually a mixed but mostly positive feeling, and that it can make people feel more connected to others.","c":2,"k":"s","ps":false},{"t":"In one set of 2012 studies, led by Xinyue Zhou, people felt more nostalgic on colder days, and in colder rooms.","c":2,"k":"s","ps":false},{"t":"When they were asked to call up nostalgic memories, they judged the room to be warmer.","c":2,"k":"s","ps":false},{"t":"And in another experiment, people kept their hands in icy water for longer when they were thinking about nostalgic memories.","c":2,"k":"s","ps":false},{"t":"In a small way, nostalgia really does seem to warm us up.","c":2,"k":"s","ps":false},{"t":"Our final word is one that's often misused.","c":2,"k":"s","ps":false},{"t":"Ambivalent.","c":2,"k":"s","ps":false},{"t":"A, M, B, I, V, A, L, E, N, T.","c":2,"k":"s","ps":false},{"t":"For example, I'm ambivalent about the new job offer, because the money's better but I'd miss my team.","c":2,"k":"s","ps":false},{"t":"Many people use ambivalent to mean they don't care either way.","c":2,"k":"s","ps":false},{"t":"But that's closer to indifferent.","c":2,"k":"s","ps":false},{"t":"Ambivalent means you care a lot, in two directions at once.","c":2,"k":"s","ps":false},{"t":"The word was coined in German, around 1910, by the Swiss psychiatrist Eugen Bleuler.","c":2,"k":"s","ps":false},{"t":"It comes from Latin, ambi, meaning both, and valent, meaning being strong.","c":2,"k":"s","ps":false},{"t":"So ambivalence is two strong feelings pulling against each other.","c":2,"k":"s","ps":false},{"t":"It's a remarkably useful word for big life decisions.","c":2,"k":"s","ps":false},{"t":"Moving house, changing jobs, and even a child leaving home can all feel exciting and sad at the same time.","c":2,"k":"s","ps":false},{"t":"Knowing that this has a name, and that it's completely normal, can make it easier to sit with.","c":2,"k":"s","ps":false},{"t":"Here's a small exercise you can do right now, even if you're driving, because it only takes a moment of attention.","c":2,"k":"s","ps":false},{"t":"Notice how you're feeling at this moment.","c":2,"k":"s","ps":false},{"t":"Instead of fine or tired, try to find the most precise word you can.","c":2,"k":"s","ps":false},{"t":"Is it calm, restless, content, flat, a bit wistful, or quietly looking forward to something?","c":2,"k":"s","ps":false},{"t":"You don't need to change the feeling.","c":2,"k":"s","ps":false},{"t":"Just name it.","c":2,"k":"s","ps":false},{"t":"If you like, try it again at a few set moments in your day.","c":2,"k":"s","ps":false},{"t":"When you first sit down at work, when you walk in the door at home, or when you pull into the driveway.","c":2,"k":"s","ps":false},{"t":"Over a few weeks, you'll probably notice your inner vocabulary getting richer.","c":2,"k":"s","ps":false},{"t":"Fine starts to split into settled, relieved, a bit flat or quietly pleased.","c":2,"k":"s","ps":false},{"t":"And that small shift gives you more choices about what to do next.","c":2,"k":"s","ps":false},{"t":"To sum up, research suggests that naming feelings precisely can take some of the sting out of them and help you respond more wisely.","c":2,"k":"s","ps":false},{"t":"Words like schadenfreude, ennui, saudade, wistful, nostalgia and ambivalent give you sharper tools than just good or bad.","c":2,"k":"s","ps":false},{"t":"The more exact your words, the clearer your map of what's going on inside.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In Matthew Lieberman's brain imaging study, what happened when people put a name to the emotion in a face?","c":3,"k":"q","ps":false},{"t":"Answer. Activity in the amygdala, a brain area involved in threat and alarm, went down.","c":3,"k":"a","ps":false},{"t":"Question two. What does the German word schadenfreude literally combine?","c":3,"k":"q","ps":false},{"t":"Answer. Harm and joy. Pleasure at someone else's misfortune.","c":3,"k":"a","ps":false},{"t":"Question three. Does ambivalent mean you don't care either way?","c":3,"k":"q","ps":false},{"t":"Answer. No. It means you have strong mixed feelings pulling in different directions.","c":3,"k":"a","ps":false},{"t":"That's the end of Precise Words for Feelings. Go gently. See you on the next one.","c":3,"k":"end","ps":false}]},"firstaid":{"chapters":["Before you start","Danger to breathing","CPR and defibrillation"],"at":{"f":[0.3,3.83,6.23,10.87,12.18,14.14,18.6,21.25,23.21,31.38,40.23,42.05,46.5,54.01,57.66,61.95,72.48,75.18,77.4,83.33,86.74,91.54,94.12,96.67,103.46,109.65,112.34,113.9,116.47,121.5,124.85,129.42,131.07,133.14,136.67,137.93,139.22,140.43,141.8,144.99,148.7,150.53,153.44,159.08,164.35,167.16,174.45,176.62,185.23,191.8,194.61,198.94,205.94,207.26,212.19,215.7,220.22,224.73,226.29,230.82,234.81,238.08,243.29,245.2,249.71,256.19,258.1,269.4,273.15,282.14,285.42,290.19,294.63,301.61,305.24,307.11,310.98,313.96,320.03,326.45,330.18,331.43,340.16,342.74,346.84,350.38,352.92,356.34,358.48,365.03,371.74,378.26,386.72,388.75,398.23,403.64,408.04,413.93,421.73,423.7,428.12,431.06,438.97,442.27,446.35,447.8,454.39,457.63,462.02,464.55,475.7,478.21,483.35,487.46,491.14,499.03,505.45,513.88,517.43,525.42,530.8],"m":[0.3,4.03,6.43,11.52,12.91,15.09,19.97,22.78,24.98,34.05,43.32,45.31,50.21,58.61,62.72,67.02,78.61,81.56,83.84,90.21,93.89,99.32,101.96,104.71,111.81,118.47,121.21,122.9,125.75,131.12,134.94,139.89,141.7,143.99,147.82,149.24,150.79,152.18,153.76,157.37,161.53,163.44,166.68,172.85,178.48,181.6,189.36,191.81,201.2,208.27,211.36,216.03,223.89,225.36,230.75,234.51,239.39,244.33,245.97,250.9,255.37,258.86,264.76,266.81,271.9,278.9,281.02,293.76,297.92,307.82,311.47,316.87,321.73,329.55,333.56,335.54,339.98,343.2,349.66,356.8,360.73,362.14,372.03,374.87,379.36,383.25,386.08,389.6,392.02,399.23,406.64,413.92,423.12,425.25,435.9,441.69,446.6,453.12,461.75,464.03,469.03,472.19,480.87,484.62,489.11,490.67,497.86,501.45,506.29,509.08,521.32,524.28,529.92,534.18,538.26,546.43,553.11,562.13,565.79,574.19,580.25]},"dur":{"f":536.0,"m":586.0},"units":[{"t":"First Aid Basics by Ear.","c":-1,"k":"title","ps":false},{"t":"Part one. Before you start.","c":0,"k":"head","ps":false},{"t":"Imagine you're at the shops, and a man a few metres away suddenly collapses.","c":0,"k":"s","ps":true},{"t":"People freeze.","c":0,"k":"s","ps":false},{"t":"Someone says, is he all right?","c":0,"k":"s","ps":false},{"t":"In moments like this, the people who help are rarely the ones who know the most.","c":0,"k":"s","ps":false},{"t":"They're the ones who have a plan in their head.","c":0,"k":"s","ps":false},{"t":"This lesson gives you that plan.","c":0,"k":"s","ps":true},{"t":"We'll focus on the most serious situation, someone who has collapsed and isn't responding, because that's when a calm plan matters most.","c":0,"k":"s","ps":false},{"t":"It follows the current guidelines of the Australian Resuscitation Council, which are the basis of first aid training right across the country.","c":0,"k":"s","ps":false},{"t":"One important thing first.","c":0,"k":"s","ps":false},{"t":"This is a refresher, not a substitute for a proper first aid course.","c":0,"k":"s","ps":false},{"t":"CPR is a physical skill, and the best way to learn it is with your hands on a training manikin and an instructor watching.","c":0,"k":"s","ps":false},{"t":"If you haven't done a course, or it's been a while, please book one.","c":0,"k":"s","ps":false},{"t":"Many trainers suggest refreshing your CPR skills every year.","c":0,"k":"s","ps":false},{"t":"Courses are run by organisations like St John Ambulance and by many registered training providers, and a CPR course often takes only a few hours.","c":0,"k":"s","ps":false},{"t":"The plan has a name that's easy to remember.","c":0,"k":"s","ps":true},{"t":"DRSABCD.","c":0,"k":"s","ps":false},{"t":"It stands for Danger, Response, Send for help, Airway, Breathing, CPR and Defibrillation.","c":0,"k":"s","ps":false},{"t":"One way to remember it is the phrase Doctors ABCD.","c":0,"k":"s","ps":false},{"t":"If you're driving, just listen along, and try saying the letters out loud with me.","c":0,"k":"s","ps":false},{"t":"D, R, S, A, B, C, D.","c":0,"k":"s","ps":false},{"t":"It's also worth knowing that you're protected.","c":0,"k":"s","ps":true},{"t":"Every Australian state and territory has laws that protect people who help in an emergency in good faith.","c":0,"k":"s","ps":false},{"t":"And when it comes to someone who isn't breathing, doing something is always better than doing nothing.","c":0,"k":"s","ps":false},{"t":"Part two. Danger to breathing.","c":1,"k":"head","ps":false},{"t":"D is for Danger.","c":1,"k":"s","ps":true},{"t":"Before you rush in, stop and look around.","c":1,"k":"s","ps":false},{"t":"Is there traffic, fire, electricity, deep water, or someone aggressive nearby?","c":1,"k":"s","ps":false},{"t":"You can't help anyone if you become a second casualty.","c":1,"k":"s","ps":false},{"t":"Only approach when it's safe for you, for bystanders, and for the person.","c":1,"k":"s","ps":false},{"t":"R is for Response.","c":1,"k":"s","ps":true},{"t":"Check whether the person responds.","c":1,"k":"s","ps":false},{"t":"First aid trainers often teach this with the word COWS.","c":1,"k":"s","ps":false},{"t":"Can you hear me?","c":1,"k":"s","ps":false},{"t":"Open your eyes.","c":1,"k":"s","ps":false},{"t":"What's your name?","c":1,"k":"s","ps":false},{"t":"Squeeze my hand.","c":1,"k":"s","ps":false},{"t":"Speak loudly and give their shoulders a firm squeeze.","c":1,"k":"s","ps":false},{"t":"If they don't respond at all, treat it as an emergency.","c":1,"k":"s","ps":false},{"t":"S is for Send for help.","c":1,"k":"s","ps":true},{"t":"Call triple zero, and ask for an ambulance.","c":1,"k":"s","ps":false},{"t":"If someone else is there, point at them and say, you, call triple zero, and come back to tell me.","c":1,"k":"s","ps":false},{"t":"A specific instruction to one person works far better than a general shout for help.","c":1,"k":"s","ps":false},{"t":"Put your phone on speaker so your hands are free.","c":1,"k":"s","ps":false},{"t":"The triple zero call taker will ask where you are and what's happened, and they can talk you through CPR step by step.","c":1,"k":"s","ps":false},{"t":"Don't hang up until they tell you to.","c":1,"k":"s","ps":false},{"t":"The free Emergency Plus app, developed with Australia's emergency services, can show your location if you're somewhere unfamiliar.","c":1,"k":"s","ps":false},{"t":"When you dial triple zero, the first voice you hear will ask whether you need police, fire or ambulance.","c":1,"k":"s","ps":true},{"t":"Say ambulance clearly, and you'll be connected.","c":1,"k":"s","ps":false},{"t":"Triple zero works from any phone, including a mobile with no credit.","c":1,"k":"s","ps":false},{"t":"If you're on your own, call first, put the phone on speaker beside you, and then carry on with the steps while you talk.","c":1,"k":"s","ps":false},{"t":"A is for Airway.","c":1,"k":"s","ps":true},{"t":"Open the person's mouth and check for anything blocking it, like vomit or food.","c":1,"k":"s","ps":false},{"t":"If you see something, roll them onto their side and clear it.","c":1,"k":"s","ps":false},{"t":"Then, with the person on their back, gently tilt the head back and lift the chin.","c":1,"k":"s","ps":false},{"t":"This lifts the tongue away from the back of the throat and opens the airway.","c":1,"k":"s","ps":false},{"t":"B is for Breathing.","c":1,"k":"s","ps":true},{"t":"Look, listen and feel for normal breathing, for no more than ten seconds.","c":1,"k":"s","ps":false},{"t":"Watch the chest, listen near the mouth, and feel for breath on your cheek.","c":1,"k":"s","ps":false},{"t":"Here's something important that catches many people out.","c":1,"k":"s","ps":false},{"t":"In the first minutes after the heart stops, a person may make occasional gasping sounds.","c":1,"k":"s","ps":false},{"t":"That is not normal breathing.","c":1,"k":"s","ps":false},{"t":"If breathing is absent or not normal, you need to start CPR.","c":1,"k":"s","ps":false},{"t":"If the person is unresponsive but breathing normally, roll them onto their side into the recovery position.","c":1,"k":"s","ps":true},{"t":"That helps keep the airway clear.","c":1,"k":"s","ps":false},{"t":"To do it, kneel beside them, place the arm nearest you out at a right angle, lay their other arm across their chest, bend their far knee up, and gently roll them towards you onto their side.","c":1,"k":"s","ps":false},{"t":"Tilt the head back slightly so fluids can drain from the mouth.","c":1,"k":"s","ps":false},{"t":"Keep watching their breathing until help arrives, and if it stops or stops being normal, roll them onto their back and start CPR.","c":1,"k":"s","ps":false},{"t":"Part three. CPR and defibrillation.","c":2,"k":"head","ps":false},{"t":"C is for CPR, which stands for cardiopulmonary resuscitation.","c":2,"k":"s","ps":true},{"t":"Kneel beside the person, who should be lying on their back on a firm surface.","c":2,"k":"s","ps":false},{"t":"Place the heel of one hand in the centre of the chest, on the lower half of the breastbone, and put your other hand on top.","c":2,"k":"s","ps":false},{"t":"Keep your arms straight, and your shoulders over your hands.","c":2,"k":"s","ps":false},{"t":"Push down hard and fast.","c":2,"k":"s","ps":true},{"t":"For an adult, press down about one third of the depth of the chest.","c":2,"k":"s","ps":false},{"t":"Let the chest rise back up fully after each push.","c":2,"k":"s","ps":false},{"t":"The rate is one hundred to one hundred and twenty compressions a minute, which is about two every second.","c":2,"k":"s","ps":false},{"t":"Many people keep time to the beat of the song Stayin' Alive by the Bee Gees, which sits in that range.","c":2,"k":"s","ps":false},{"t":"The pattern is thirty compressions, then two rescue breaths.","c":2,"k":"s","ps":true},{"t":"Thirty to two.","c":2,"k":"s","ps":false},{"t":"For each breath, keep the head tilted and chin lifted, pinch the nose, seal your mouth over theirs, and blow steadily until you see the chest rise.","c":2,"k":"s","ps":false},{"t":"Then go straight back to thirty compressions.","c":2,"k":"s","ps":false},{"t":"Aim for about five rounds of thirty to two every two minutes.","c":2,"k":"s","ps":false},{"t":"If you can't give breaths, or you're not willing to, that's okay.","c":2,"k":"s","ps":true},{"t":"Do compressions only, without stopping.","c":2,"k":"s","ps":false},{"t":"Continuous chest compressions can still save a life.","c":2,"k":"s","ps":false},{"t":"Don't worry about pressing too hard.","c":2,"k":"s","ps":false},{"t":"Ribs can crack during CPR, but without CPR, a person whose heart has stopped will die.","c":2,"k":"s","ps":false},{"t":"Children and babies need a slightly different technique, which is another good reason to do a hands-on course.","c":2,"k":"s","ps":true},{"t":"CPR is tiring, so if someone else is there, swap every two minutes, with as little pause as possible.","c":2,"k":"s","ps":true},{"t":"Keep going until the person starts to respond or breathe normally, until paramedics take over, or until you physically can't continue.","c":2,"k":"s","ps":false},{"t":"D is for Defibrillation.","c":2,"k":"s","ps":true},{"t":"An automated external defibrillator, often called an AED or a defib, is a portable device that can shock the heart back into a normal rhythm.","c":2,"k":"s","ps":false},{"t":"You'll see them in shopping centres, gyms, sports clubs, workplaces and airports.","c":2,"k":"s","ps":false},{"t":"Send someone to find one, but don't stop CPR yourself to go looking.","c":2,"k":"s","ps":false},{"t":"In many areas, the triple zero call taker can tell you where the nearest registered defib is.","c":2,"k":"s","ps":false},{"t":"It's worth noticing where the defibs are at your own workplace, gym or local shopping centre, before you ever need one.","c":2,"k":"s","ps":false},{"t":"You don't need training to use one.","c":2,"k":"s","ps":true},{"t":"Open the lid or press the button, and the machine talks you through every step.","c":2,"k":"s","ps":false},{"t":"It will tell you where to stick the pads on the bare chest.","c":2,"k":"s","ps":false},{"t":"It analyses the heart rhythm and only allows a shock if one is needed, so you can't accidentally shock someone who doesn't need it.","c":2,"k":"s","ps":false},{"t":"When it tells you, make sure nobody is touching the person.","c":2,"k":"s","ps":false},{"t":"Then follow the voice prompts and keep up CPR in between.","c":2,"k":"s","ps":false},{"t":"Every minute counts.","c":2,"k":"s","ps":true},{"t":"The sooner CPR and a defibrillator reach a person whose heart has stopped, the better their chance of surviving.","c":2,"k":"s","ps":false},{"t":"That's why ordinary bystanders make such a difference.","c":2,"k":"s","ps":false},{"t":"An ambulance can take many minutes to arrive, and you're already there.","c":2,"k":"s","ps":false},{"t":"Let's recap with the letters one more time.","c":2,"k":"s","ps":true},{"t":"Danger, Response, Send for help by calling triple zero, Airway, Breathing, CPR at thirty compressions to two breaths, and Defibrillation as soon as a defib arrives.","c":2,"k":"s","ps":false},{"t":"If you remember nothing else, remember this.","c":2,"k":"s","ps":false},{"t":"Call triple zero, push hard and fast in the centre of the chest, and get a defib.","c":2,"k":"s","ps":false},{"t":"And book a hands-on course to make it second nature.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. What does DRSABCD stand for?","c":3,"k":"q","ps":false},{"t":"Answer. Danger, Response, Send for help, Airway, Breathing, CPR, Defibrillation.","c":3,"k":"a","ps":false},{"t":"Question two. What's the ratio of compressions to breaths in adult CPR?","c":3,"k":"q","ps":false},{"t":"Answer. Thirty compressions to two breaths.","c":3,"k":"a","ps":false},{"t":"Question three. Is occasional gasping a sign of normal breathing?","c":3,"k":"q","ps":false},{"t":"Answer. No. If breathing is absent or not normal, start CPR.","c":3,"k":"a","ps":false},{"t":"That's the end of First Aid Basics by Ear. You're better prepared already.","c":3,"k":"end","ps":false}]},"habits":{"chapters":["Life on autopilot","Cues, routines and rewards","How long it really takes","Building and breaking habits"],"at":{"f":[0.3,3.78,6.69,8.37,10.77,12.67,15.52,20.0,22.66,24.58,35.31,39.76,50.48,53.09,62.37,66.63,68.61,72.38,74.49,82.46,84.38,85.76,90.44,93.2,101.58,110.25,119.3,129.07,135.75,139.18,144.94,146.84,153.89,158.72,160.97,167.91,170.09,172.4,176.99,179.56,185.19,189.81,193.77,199.3,202.69,211.2,212.74,219.14,224.3,229.12,231.11,232.39,235.68,239.26,243.85,248.57,254.73,256.49,262.07,268.09,274.71,276.44,278.33,285.46,290.12,295.19,298.36,306.9,311.39,313.58,315.23,319.47,329.47,334.64,342.37,344.11,351.19,354.58,362.61,366.15,369.34,372.24,378.47,385.85,392.18,396.09,401.11,402.98,406.96,410.32,416.57,419.41,422.25,425.57,428.19,431.03,434.79,437.79,441.45,446.9,457.0,463.1,468.13,473.19,483.93,490.44,494.49,498.61,503.0,511.36,518.26,521.28,525.44,532.97,537.46,542.45,555.14,559.
