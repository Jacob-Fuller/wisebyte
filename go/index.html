67.7,1471.54,1475.77,1478.02,1487.33,1489.4,1492.88,1496.97,1499.86,1502.25,1507.71,1517.86,1519.5,1525.72,1536.11,1540.11,1542.61,1545.13,1548.69,1550.89,1555.93,1562.29,1564.6,1566.7,1569.68,1574.02,1580.18,1581.71,1584.35,1595.24,1602.57,1606.25,1617.18,1621.5,1631.89,1637.63,1646.9,1651.59],"m":[0.3,3.57,6.84,15.04,24.35,27.3,34.55,36.45,38.18,39.62,40.98,41.99,43.67,45.06,46.4,49.63,50.94,52.5,59.1,65.62,69.05,76.06,82.18,85.62,98.6,101.4,105.39,109.86,118.81,124.55,134.29,138.01,147.25,151.09,156.82,160.54,164.53,166.8,179.02,184.96,189.79,201.8,208.01,211.02,216.36,221.69,229.45,233.69,237.4,243.81,248.8,255.83,259.85,261.85,269.65,274.07,278.19,284.15,294.81,297.81,302.74,305.68,307.71,315.88,319.38,324.57,331.14,334.69,345.19,351.07,357.52,360.75,365.14,374.52,376.16,380.45,382.44,387.59,390.06,399.34,407.47,417.46,425.57,431.33,435.63,442.88,453.2,457.32,462.42,468.09,479.82,482.11,487.63,494.74,500.1,507.19,509.64,518.1,525.67,534.15,538.69,542.76,554.29,561.8,563.36,565.83,571.49,575.97,586.45,598.17,603.34,609.41,614.23,616.08,624.05,633.75,638.67,648.96,653.85,659.05,666.98,669.88,677.23,682.11,684.53,688.65,693.96,701.1,703.37,709.82,716.68,727.22,730.88,736.19,738.35,744.64,751.74,753.81,755.8,760.54,766.12,768.18,773.12,779.25,782.88,793.32,798.0,801.55,806.81,812.04,822.5,829.17,831.85,833.4,836.69,848.14,856.87,861.89,866.14,873.12,878.27,884.64,890.22,892.2,894.65,903.27,912.09,925.78,932.32,938.32,940.77,943.69,954.44,957.1,960.6,962.91,966.85,976.56,979.25,981.74,984.34,986.59,995.61,1000.91,1007.02,1011.91,1014.46,1017.38,1021.51,1024.24,1027.58,1033.76,1038.54,1046.78,1050.98,1056.0,1063.82,1067.56,1070.39,1076.88,1085.09,1093.3,1101.34,1106.39,1111.44,1114.8,1118.73,1123.76,1127.03,1131.23,1134.55,1138.7,1144.71,1147.92,1152.21,1159.16,1160.97,1164.02,1171.14,1174.43,1180.03,1181.42,1184.83,1188.56,1195.89,1199.82,1207.92,1210.45,1219.13,1222.54,1232.31,1235.93,1240.59,1249.06,1259.35,1261.91,1268.64,1274.91,1278.35,1280.31,1281.74,1283.27,1285.72,1289.94,1297.7,1306.97,1317.0,1322.09,1328.53,1335.01,1338.02,1345.4,1353.64,1356.95,1372.89,1383.02,1394.03,1405.06,1407.75,1414.59,1417.9,1423.64,1424.75,1430.42,1432.12,1435.76,1438.97,1444.06,1447.65,1453.97,1457.33,1464.64,1468.62,1476.52,1483.08,1487.98,1497.49,1504.15,1509.88,1514.24,1518.45,1523.72,1525.35,1526.89,1535.89,1539.03,1545.08,1548.99,1556.55,1560.12,1571.74,1577.66,1580.77,1584.96,1591.62,1601.37,1604.61,1606.67,1610.97,1615.13,1619.55,1621.86,1632.06,1634.34,1638.13,1642.62,1645.48,1648.01,1654.1,1665.65,1667.45,1674.43,1685.87,1690.34,1693.08,1695.74,1700.15,1702.51,1708.06,1715.13,1717.66,1720.01,1723.12,1728.1,1734.7,1736.39,1739.19,1751.17,1759.02,1763.11,1774.53,1779.17,1790.34,1796.54,1806.29,1811.36]},"dur":{"f":1657.2,"m":1817.4},"units":[{"t":"Why Empires Fall.","c":-1,"k":"title","ps":false},{"t":"Part one. Two hundred and ten reasons.","c":0,"k":"head","ps":false},{"t":"In 1984, a German historian called Alexander Demandt did something both useful and slightly funny.","c":0,"k":"s","ps":true},{"t":"He went through centuries of books and articles about the fall of the Roman Empire and collected every cause anyone had seriously suggested.","c":0,"k":"s","ps":false},{"t":"He ended up with a list of two hundred and ten.","c":0,"k":"s","ps":false},{"t":"Arranged alphabetically in German, it runs from superstition all the way to war on two fronts.","c":0,"k":"s","ps":false},{"t":"Some are what you'd expect.","c":0,"k":"s","ps":true},{"t":"Barbarian invasions.","c":0,"k":"s","ps":false},{"t":"Heavy taxes.","c":0,"k":"s","ps":false},{"t":"Civil wars.","c":0,"k":"s","ps":false},{"t":"Plague.","c":0,"k":"s","ps":false},{"t":"Others are stranger.","c":0,"k":"s","ps":false},{"t":"Moral decay.","c":0,"k":"s","ps":false},{"t":"Public baths.","c":0,"k":"s","ps":false},{"t":"Lead poisoning from water pipes and wine pans.","c":0,"k":"s","ps":false},{"t":"Christianity.","c":0,"k":"s","ps":false},{"t":"Soil exhaustion.","c":0,"k":"s","ps":false},{"t":"Even homosexuality and a falling population, both favourites of moralising writers.","c":0,"k":"s","ps":false},{"t":"The list tells you less about Rome than about the people writing, and what they feared in their own times.","c":0,"k":"s","ps":false},{"t":"That's the first thing to know about why empires fall.","c":0,"k":"s","ps":true},{"t":"It's one of history's biggest questions, and people have been arguing about it for as long as there's been history.","c":0,"k":"s","ps":false},{"t":"Every generation looks at a fallen empire and sees a warning about its own problems.","c":0,"k":"s","ps":false},{"t":"The most famous attempt in English came from Edward Gibbon.","c":0,"k":"s","ps":true},{"t":"His giant work, The History of the Decline and Fall of the Roman Empire, came out in six volumes between 1776 and 1789.","c":0,"k":"s","ps":false},{"t":"It's beautifully written and still read today.","c":0,"k":"s","ps":false},{"t":"Near the end, Gibbon summed up his story in a famous line.","c":0,"k":"s","ps":false},{"t":"He wrote, I have described the triumph of barbarism and religion.","c":0,"k":"s","ps":false},{"t":"In other words, he blamed outside invaders, and the new Christian faith that he thought had drawn energy away from public life.","c":0,"k":"s","ps":false},{"t":"But Gibbon also offered a deeper idea, one that historians still find interesting.","c":0,"k":"s","ps":true},{"t":"In a short essay placed partway through his history, he wrote that the decline of Rome was the natural and inevitable effect of immoderate greatness.","c":0,"k":"s","ps":false},{"t":"Prosperity, he said, ripened the principle of decay.","c":0,"k":"s","ps":false},{"t":"He added that as soon as time or accident had removed the artificial supports, the stupendous fabric yielded to the pressure of its own weight.","c":0,"k":"s","ps":false},{"t":"Put simply, Rome got too big to hold itself up.","c":0,"k":"s","ps":false},{"t":"That idea, that success itself creates the conditions for failure, keeps coming back.","c":0,"k":"s","ps":true},{"t":"We'll meet modern versions of it later in this lesson.","c":0,"k":"s","ps":false},{"t":"Before we go further, it's worth asking a basic question.","c":0,"k":"s","ps":true},{"t":"What do we actually mean by fall?","c":0,"k":"s","ps":false},{"t":"Sometimes an empire is conquered outright, like the Aztec Empire, overthrown by Spanish invaders and their Indigenous allies in 1521.","c":0,"k":"s","ps":false},{"t":"Sometimes it breaks into pieces, like the Soviet Union in 1991.","c":0,"k":"s","ps":false},{"t":"Sometimes it slowly shrinks until nobody can point to the day it ended.","c":0,"k":"s","ps":false},{"t":"And sometimes, as we'll see, the people carry on living in the same places, speaking the same languages, while the grand political structure above them simply disappears.","c":0,"k":"s","ps":false},{"t":"Historians who study this often prefer the word collapse, and they use it in a specific way.","c":0,"k":"s","ps":true},{"t":"Collapse means a rapid loss of complexity.","c":0,"k":"s","ps":false},{"t":"Fewer cities, less trade, less writing, simpler buildings, smaller political units.","c":0,"k":"s","ps":false},{"t":"That's a useful definition, because it lets us compare very different societies.","c":0,"k":"s","ps":false},{"t":"It also reminds us that collapse is usually about systems breaking down, not whole populations vanishing.","c":0,"k":"s","ps":false},{"t":"Over the rest of this lesson, we'll look at two famous case studies.","c":0,"k":"s","ps":true},{"t":"First Rome, the empire everybody argues about.","c":0,"k":"s","ps":false},{"t":"Then the Late Bronze Age, when a whole connected world of kingdoms went down within a few decades.","c":0,"k":"s","ps":false},{"t":"After that, we'll look at the big theories people have built from cases like these.","c":0,"k":"s","ps":false},{"t":"And finally, we'll finish with the handful of patterns most historians actually agree on.","c":0,"k":"s","ps":false},{"t":"Part two. Rome, the case everyone argues about.","c":1,"k":"head","ps":false},{"t":"Let's start with some dates.","c":1,"k":"s","ps":true},{"t":"At its height, in the second century, the Roman Empire stretched from northern Britain to Egypt and from Spain to Iraq.","c":1,"k":"s","ps":false},{"t":"Perhaps sixty million people or more lived under Roman rule.","c":1,"k":"s","ps":false},{"t":"That's a large share of everyone alive on Earth at the time.","c":1,"k":"s","ps":false},{"t":"The traditional end date for the western half of the empire is 476.","c":1,"k":"s","ps":true},{"t":"That's when a Germanic general called Odoacer removed the last western emperor, a teenager named Romulus Augustulus, and didn't bother to replace him.","c":1,"k":"s","ps":false},{"t":"But even that date is a bit of a convention.","c":1,"k":"s","ps":false},{"t":"Few people at the time seem to have treated it as the end of the world.","c":1,"k":"s","ps":false},{"t":"And here's the twist that often gets forgotten.","c":1,"k":"s","ps":true},{"t":"Only the western half fell.","c":1,"k":"s","ps":false},{"t":"The eastern half, run from Constantinople, which is modern Istanbul, carried on for nearly another thousand years.","c":1,"k":"s","ps":false},{"t":"Its people called themselves Romans the whole time.","c":1,"k":"s","ps":false},{"t":"It finally fell to the Ottoman Turks in 1453.","c":1,"k":"s","ps":false},{"t":"So any theory of why Rome fell has to explain why the West collapsed while the East survived.","c":1,"k":"s","ps":false},{"t":"In fact, the empire had already nearly fallen once.","c":1,"k":"s","ps":true},{"t":"In the middle of the third century, from about 235 to 284, it went through what historians call the Crisis of the Third Century.","c":1,"k":"s","ps":false},{"t":"Emperor after emperor was murdered or killed in battle, often by his own soldiers.","c":1,"k":"s","ps":false},{"t":"Over those fifty years, more than twenty men were recognised as emperor, and many more tried.","c":1,"k":"s","ps":false},{"t":"For a while the empire split into three pieces.","c":1,"k":"s","ps":false},{"t":"Then a tough soldier-emperor named Diocletian pulled it back together.","c":1,"k":"s","ps":false},{"t":"He did it by making the state bigger, with more officials, more soldiers and heavier taxes, and by sharing power among several emperors.","c":1,"k":"s","ps":false},{"t":"It worked, for a time.","c":1,"k":"s","ps":false},{"t":"But it also left the empire more expensive to run than ever.","c":1,"k":"s","ps":false},{"t":"So what went wrong in the West?","c":1,"k":"s","ps":true},{"t":"For most of the twentieth century, the big debate was between two camps.","c":1,"k":"s","ps":false},{"t":"One camp stressed violence and loss.","c":1,"k":"s","ps":true},{"t":"The Western empire, they argued, was overwhelmed by outside groups, especially Germanic peoples such as the Goths and Vandals.","c":1,"k":"s","ps":false},{"t":"In 378, the Goths destroyed a Roman army and killed the emperor Valens at the Battle of Adrianople.","c":1,"k":"s","ps":false},{"t":"In 410, Alaric and his Goths sacked the city of Rome itself, the first time in about eight hundred years that a foreign enemy had taken it.","c":1,"k":"s","ps":false},{"t":"In 439, the Vandals captured Carthage, in North Africa, one of the richest provinces in the West.","c":1,"k":"s","ps":false},{"t":"Without that tax revenue, the western government could no longer pay its armies properly.","c":1,"k":"s","ps":false},{"t":"And without armies, it could no longer hold on to the rest.","c":1,"k":"s","ps":false},{"t":"The other camp, led by historians like Peter Brown, pushed back on the idea of decline altogether.","c":1,"k":"s","ps":true},{"t":"From the 1970s onwards, Brown and others described the period as late antiquity, a time of transformation, not just ruin.","c":1,"k":"s","ps":false},{"t":"Religion, art, law and ideas flourished in new ways.","c":1,"k":"s","ps":false},{"t":"The newcomers often wanted to become part of the Roman world, not destroy it.","c":1,"k":"s","ps":false},{"t":"Many Germanic kings ruled using Roman law, Roman officials and Latin.","c":1,"k":"s","ps":false},{"t":"Then in 2005, the Oxford archaeologist Bryan Ward-Perkins published a book with a deliberately blunt title, The Fall of Rome and the End of Civilization.","c":1,"k":"s","ps":true},{"t":"He pointed to physical evidence.","c":1,"k":"s","ps":false},{"t":"After Roman rule ended in the West, pottery got cruder and far less common.","c":1,"k":"s","ps":false},{"t":"Roof tiles, which had been everywhere, largely disappeared in many regions, replaced by thatch and wood.","c":1,"k":"s","ps":false},{"t":"Even cattle got smaller, suggesting that breeding and farming had become simpler.","c":1,"k":"s","ps":false},{"t":"In Britain, he argued, living standards fell back to levels not seen since before the Romans arrived.","c":1,"k":"s","ps":false},{"t":"There's even evidence from the Arctic.","c":1,"k":"s","ps":true},{"t":"Roman silver mining released lead pollution into the air, and some of it drifted north and settled on the Greenland ice sheet.","c":1,"k":"s","ps":false},{"t":"In 2018, a team led by Joseph McConnell measured that lead layer by layer in ice cores.","c":1,"k":"s","ps":false},{"t":"It tracks the Roman economy remarkably closely, rising during good times and dropping sharply during plagues and wars.","c":1,"k":"s","ps":false},{"t":"After the western empire fell, it stayed low for centuries.","c":1,"k":"s","ps":false},{"t":"More recently, historians have added nature to the story.","c":1,"k":"s","ps":true},{"t":"In his 2017 book, The Fate of Rome, the historian Kyle Harper argued that climate change and disease played a much bigger role than people had realised.","c":1,"k":"s","ps":false},{"t":"The empire grew during an unusually warm, stable, wet period that suited Mediterranean farming.","c":1,"k":"s","ps":false},{"t":"That period ended.","c":1,"k":"s","ps":false},{"t":"Then came devastating pandemics.","c":1,"k":"s","ps":false},{"t":"The Antonine Plague struck from about 165, possibly smallpox.","c":1,"k":"s","ps":false},{"t":"Another, the Plague of Cyprian, hit in the middle of the third century.","c":1,"k":"s","ps":false},{"t":"Later, the eastern empire was hit by the first well-documented pandemic of bubonic plague, the Plague of Justinian, from 541.","c":1,"k":"s","ps":false},{"t":"And in 536, a series of huge volcanic eruptions helped plunge the northern hemisphere into one of the coldest decades of the last two thousand years.","c":1,"k":"s","ps":false},{"t":"Not everyone agrees with how much weight Harper gives to climate and germs.","c":1,"k":"s","ps":true},{"t":"Critics point out that the empire survived the Antonine Plague and recovered for decades.","c":1,"k":"s","ps":false},{"t":"But almost nobody now thinks the story can be told without them.","c":1,"k":"s","ps":false},{"t":"So where does that leave us?","c":1,"k":"s","ps":true},{"t":"Most historians today would describe the fall of the western empire as the result of many things acting together.","c":1,"k":"s","ps":false},{"t":"Long-term strains, like the huge cost of the army, fierce competition among elites, and repeated civil wars between rival emperors.","c":1,"k":"s","ps":false},{"t":"Plus shocks, like plagues, invasions and the loss of key provinces.","c":1,"k":"s","ps":false},{"t":"The eastern half survived partly because it was richer, partly because Constantinople was extremely hard to capture, and partly because it was lucky.","c":1,"k":"s","ps":false},{"t":"The West had a longer border to defend and fewer resources to do it.","c":1,"k":"s","ps":false},{"t":"That mix of slow-burning weaknesses and sudden shocks turns out to be a pattern.","c":1,"k":"s","ps":true},{"t":"And it shows up even more dramatically in a collapse that happened about seventeen hundred years before Rome's.","c":1,"k":"s","ps":false},{"t":"Part three. When a whole world fell.","c":2,"k":"head","ps":false},{"t":"Around 1200 BC, the eastern Mediterranean was a surprisingly connected place.","c":2,"k":"s","ps":true},{"t":"Historians sometimes compare it to an early version of globalisation.","c":2,"k":"s","ps":false},{"t":"There was Egypt under its pharaohs.","c":2,"k":"s","ps":false},{"t":"There was the Hittite Empire, centred in what is now Turkey.","c":2,"k":"s","ps":false},{"t":"There were the Mycenaean kingdoms of Greece, the world of the Trojan War legends.","c":2,"k":"s","ps":false},{"t":"And there were wealthy trading cities along the coast of what is now Syria and Lebanon, like Ugarit.","c":2,"k":"s","ps":false},{"t":"These kingdoms traded constantly.","c":2,"k":"s","ps":true},{"t":"Their rulers wrote letters to each other, called each other brother, and exchanged gifts and marriages.","c":2,"k":"s","ps":false},{"t":"A famous shipwreck found off the southern coast of Turkey, the Uluburun wreck, shows what this looked like.","c":2,"k":"s","ps":false},{"t":"It carried copper from Cyprus, tin from far to the east, glass, ivory, ebony, gold and goods from half a dozen cultures, all on one ship.","c":2,"k":"s","ps":false},{"t":"The trade in tin and copper was especially important.","c":2,"k":"s","ps":true},{"t":"Those two metals together make bronze, the key material for weapons and tools.","c":2,"k":"s","ps":false},{"t":"Very few places had both.","c":2,"k":"s","ps":false},{"t":"So the whole Bronze Age economy depended on long supply chains working smoothly.","c":2,"k":"s","ps":false},{"t":"Then, within a few decades either side of 1200 BC, much of this world fell apart.","c":2,"k":"s","ps":true},{"t":"The Hittite Empire vanished.","c":2,"k":"s","ps":false},{"t":"Its capital was abandoned.","c":2,"k":"s","ps":false},{"t":"The great palaces of Mycenaean Greece were destroyed or deserted.","c":2,"k":"s","ps":false},{"t":"Along with them went their writing system, an early form of Greek called Linear B.","c":2,"k":"s","ps":false},{"t":"There's a strange irony here.","c":2,"k":"s","ps":false},{"t":"Linear B was written on unbaked clay tablets, which normally crumble.","c":2,"k":"s","ps":false},{"t":"Many of the ones that survive were baked hard by the very fires that destroyed the palaces.","c":2,"k":"s","ps":false},{"t":"The disaster that ended the writing is what preserved it.","c":2,"k":"s","ps":false},{"t":"Greece entered what historians call a dark age, a period of several centuries with far fewer people, simpler settlements, and no writing at all.","c":2,"k":"s","ps":false},{"t":"The trading city of Ugarit was destroyed and never rebuilt.","c":2,"k":"s","ps":false},{"t":"We have a haunting glimpse of Ugarit's final days.","c":2,"k":"s","ps":true},{"t":"Archaeologists found clay tablets with letters from its last king, Ammurapi.","c":2,"k":"s","ps":false},{"t":"In one, written to the king of Cyprus, he describes the enemy's ships arriving.","c":2,"k":"s","ps":false},{"t":"In a well-known English translation, it reads, My father, behold, the enemy's ships came, my cities were burned, and they did evil things in my country.","c":2,"k":"s","ps":false},{"t":"He explains that his troops and chariots were far away helping the Hittites, and his ships were away too.","c":2,"k":"s","ps":false},{"t":"Ugarit was left exposed.","c":2,"k":"s","ps":false},{"t":"Who were the enemy?","c":2,"k":"s","ps":true},{"t":"Egyptian records talk about invaders from the sea.","c":2,"k":"s","ps":false},{"t":"On the walls of his temple at Medinet Habu, near Luxor, the pharaoh Ramesses the Third recorded a great battle in about 1177 BC.","c":2,"k":"s","ps":false},{"t":"The inscription says, in paraphrase, that foreign peoples had conspired in their islands, and that no land could stand before them.","c":2,"k":"s","ps":false},{"t":"It lists the Hittite lands, Cyprus and others as falling one after another.","c":2,"k":"s","ps":false},{"t":"Ramesses claimed a great victory, and Egypt did survive.","c":2,"k":"s","ps":false},{"t":"But it came out weaker and poorer, and within a century or so it had lost its empire in the Levant.","c":2,"k":"s","ps":false},{"t":"For a long time, these so-called Sea Peoples were blamed for the whole collapse.","c":2,"k":"s","ps":true},{"t":"Today, most historians see them as part of the story, perhaps as much a symptom as a cause.","c":2,"k":"s","ps":false},{"t":"Many of them may have been people displaced by hard times, looking for new land.","c":2,"k":"s","ps":false},{"t":"What were those hard times?","c":2,"k":"s","ps":true},{"t":"Evidence for drought keeps piling up.","c":2,"k":"s","ps":false},{"t":"Pollen from sediment cores drilled in the Sea of Galilee shows a dry period around this time, with fewer trees and crops.","c":2,"k":"s","ps":false},{"t":"In 2023, a team led by Sturt Manning analysed the growth rings of ancient juniper wood from central Turkey.","c":2,"k":"s","ps":false},{"t":"They found an especially severe drought lasting about three years, around 1198 to 1196 BC, right as the Hittite Empire was falling apart.","c":2,"k":"s","ps":false},{"t":"Letters from the period also mention urgent grain shipments to the Hittites, suggesting famine.","c":2,"k":"s","ps":false},{"t":"Add to that possible earthquakes, internal rebellions, and the disruption of trade routes.","c":2,"k":"s","ps":true},{"t":"No one of these alone seems enough.","c":2,"k":"s","ps":false},{"t":"Together, they may have been devastating.","c":2,"k":"s","ps":false},{"t":"That's the argument made by the archaeologist Eric Cline in his book 1177 BC, first published in 2014.","c":2,"k":"s","ps":true},{"t":"He describes it as a systems collapse.","c":2,"k":"s","ps":false},{"t":"The kingdoms of the Late Bronze Age were tightly linked.","c":2,"k":"s","ps":false},{"t":"That made them rich in good times.","c":2,"k":"s","ps":false},{"t":"But it also meant that when one part failed, the failure spread.","c":2,"k":"s","ps":false},{"t":"A drought in one region led to famine, which led to migration, which led to raids, which cut trade, which starved others of tin and grain.","c":2,"k":"s","ps":false},{"t":"Each shock made the next one worse.","c":2,"k":"s","ps":false},{"t":"There's a quietly hopeful coda, though.","c":2,"k":"s","ps":true},{"t":"The collapse wasn't the end of the region.","c":2,"k":"s","ps":false},{"t":"Out of the rubble came new things.","c":2,"k":"s","ps":false},{"t":"The Phoenicians developed an alphabet that was later adapted by the Greeks, and from there it led to the letters you're probably used to reading.","c":2,"k":"s","ps":false},{"t":"Iron, which was more widely available than tin, gradually replaced bronze.","c":2,"k":"s","ps":false},{"t":"And Greece eventually re-emerged in a very different form, the world of the city-states.","c":2,"k":"s","ps":false},{"t":"Collapse closed one chapter, but it also opened the next.","c":2,"k":"s","ps":false},{"t":"Part four. The big theories.","c":3,"k":"head","ps":false},{"t":"So far we've looked at particular cases.","c":3,"k":"s","ps":true},{"t":"But for centuries, thinkers have tried to find general rules.","c":3,"k":"s","ps":false},{"t":"Why do empires rise and fall at all?","c":3,"k":"s","ps":false},{"t":"Here are four of the most influential answers.","c":3,"k":"s","ps":false},{"t":"The first comes from Ibn Khaldun, a North African scholar who lived in the fourteenth century.","c":3,"k":"s","ps":true},{"t":"He'd served in several royal courts and seen dynasties come and go.","c":3,"k":"s","ps":false},{"t":"In 1377, he completed an introduction to his history of the world, known as the Muqaddimah.","c":3,"k":"s","ps":false},{"t":"In it he built his theory around a quality he called asabiyyah.","c":3,"k":"s","ps":false},{"t":"It's often translated as group feeling or social solidarity.","c":3,"k":"s","ps":false},{"t":"Ibn Khaldun argued that tough, tightly knit groups, often from the desert or the frontier, have strong asabiyyah.","c":3,"k":"s","ps":true},{"t":"They pull together, win power and found a new dynasty.","c":3,"k":"s","ps":false},{"t":"But once in power, luxury creeps in.","c":3,"k":"s","ps":false},{"t":"The rulers' descendants grow soft, rely on hired soldiers, and squabble among themselves.","c":3,"k":"s","ps":false},{"t":"The group feeling fades, taxes rise to pay for an expensive court, and eventually a new, hungrier group sweeps in.","c":3,"k":"s","ps":false},{"t":"He reckoned a dynasty usually lasted about three generations, roughly a hundred and twenty years by his calculation.","c":3,"k":"s","ps":false},{"t":"It's a tidy story, and too neat to be a law, but many historians admire how much it anticipated later thinking.","c":3,"k":"s","ps":false},{"t":"The second big theory comes from the American anthropologist Joseph Tainter.","c":3,"k":"s","ps":true},{"t":"In 1988 he published The Collapse of Complex Societies.","c":3,"k":"s","ps":false},{"t":"Tainter's idea is about costs and benefits.","c":3,"k":"s","ps":false},{"t":"Societies solve problems by becoming more complex.","c":3,"k":"s","ps":false},{"t":"They add bureaucracy, armies, specialists, infrastructure and rules.","c":3,"k":"s","ps":false},{"t":"At first, each new layer brings big benefits.","c":3,"k":"s","ps":false},{"t":"But over time, the benefits shrink while the costs keep climbing.","c":3,"k":"s","ps":false},{"t":"Economists call this diminishing returns.","c":3,"k":"s","ps":false},{"t":"Rome gives a good example of the kind of squeeze he had in mind.","c":3,"k":"s","ps":true},{"t":"As the costs of the army and government climbed, emperors didn't have enough silver to pay them.","c":3,"k":"s","ps":false},{"t":"So they quietly reduced the silver in the coins.","c":3,"k":"s","ps":false},{"t":"In the first century, the main silver coin was almost pure.","c":3,"k":"s","ps":false},{"t":"By around 270, the standard coin was mostly copper with only a thin coating of silver.","c":3,"k":"s","ps":false},{"t":"People noticed, of course.","c":3,"k":"s","ps":false},{"t":"Prices rose, and trust in money fell.","c":3,"k":"s","ps":false},{"t":"Eventually, Tainter argued, a society reaches a point where it's paying more and more just to stand still.","c":3,"k":"s","ps":true},{"t":"People become less willing to support the system.","c":3,"k":"s","ps":false},{"t":"Then a shock comes along, a war or a drought, that it might once have handled easily.","c":3,"k":"s","ps":false},{"t":"Now it can't.","c":3,"k":"s","ps":false},{"t":"Collapse, in this view, is a kind of economising.","c":3,"k":"s","ps":false},{"t":"The society sheds complexity it can no longer afford.","c":3,"k":"s","ps":false},{"t":"Notice how close this is to Gibbon's idea of immoderate greatness, but with an economist's framing.","c":3,"k":"s","ps":false},{"t":"The third theory is more recent and more controversial.","c":3,"k":"s","ps":true},{"t":"Peter Turchin began as a scientist studying animal populations, then turned his mathematical methods on history.","c":3,"k":"s","ps":false},{"t":"He calls this approach cliodynamics.","c":3,"k":"s","ps":false},{"t":"Turchin and his colleagues have built a large database of past societies to test ideas about how they rise and fall.","c":3,"k":"s","ps":false},{"t":"One of his key ideas is elite overproduction.","c":3,"k":"s","ps":true},{"t":"In good times, the number of people who want elite positions, in wealth, power and status, grows faster than the number of positions available.","c":3,"k":"s","ps":false},{"t":"Frustrated would-be elites compete more and more fiercely.","c":3,"k":"s","ps":false},{"t":"Meanwhile ordinary workers may see their living standards stagnate.","c":3,"k":"s","ps":false},{"t":"Put those together with a strained state budget, and Turchin argues you get cycles of instability, often lasting decades.","c":3,"k":"s","ps":false},{"t":"In 2010, he predicted in the journal Nature that the United States was heading into a period of rising unrest around 2020.","c":3,"k":"s","ps":false},{"t":"Supporters see that as a striking call.","c":3,"k":"s","ps":false},{"t":"Critics point out that his models are hard to test fairly, and that history is full of exceptions.","c":3,"k":"s","ps":false},{"t":"The fourth big name is Jared Diamond, whose 2005 book Collapse became a bestseller.","c":3,"k":"s","ps":true},{"t":"Diamond suggested a checklist of five factors.","c":3,"k":"s","ps":false},{"t":"Environmental damage.","c":3,"k":"s","ps":false},{"t":"Climate change.","c":3,"k":"s","ps":false},{"t":"Hostile neighbours.","c":3,"k":"s","ps":false},{"t":"Loss of friendly trading partners.","c":3,"k":"s","ps":false},{"t":"And, crucially, how a society responds to its problems.","c":3,"k":"s","ps":false},{"t":"He argued that some collapses were partly self-inflicted, through things like deforestation and soil loss.","c":3,"k":"s","ps":false},{"t":"Diamond's most famous example was Rapa Nui, also known as Easter Island, the Pacific island with the giant stone statues.","c":3,"k":"s","ps":true},{"t":"In his telling, the islanders cut down all their trees, their society destroyed itself, and the population crashed before Europeans arrived.","c":3,"k":"s","ps":false},{"t":"It became a powerful parable about environmental destruction.","c":3,"k":"s","ps":false},{"t":"He told a similar story about the Norse settlers of Greenland, who vanished in the fifteenth century.","c":3,"k":"s","ps":true},{"t":"Diamond argued they clung to European farming and wouldn't adapt, even refusing to eat fish.","c":3,"k":"s","ps":false},{"t":"Later archaeology complicated that too.","c":3,"k":"s","ps":false},{"t":"Bones from their rubbish heaps show they ate a great deal of seal, and they seem to have adapted more than he allowed.","c":3,"k":"s","ps":false},{"t":"Colder weather, falling demand for walrus ivory in Europe and simple isolation probably all played a part.","c":3,"k":"s","ps":false},{"t":"But newer research has seriously challenged that story.","c":3,"k":"s","ps":true},{"t":"Archaeologists such as Terry Hunt and Carl Lipo argued that rats, which arrived with the first settlers, ate many of the palm seeds, and that the islanders adapted cleverly, for example with stone gardens that protected crops.","c":3,"k":"s","ps":false},{"t":"In 2024, a study of ancient DNA from Rapa Nui found no sign of a population crash before contact with Europeans.","c":3,"k":"s","ps":false},{"t":"The real catastrophe came afterwards, from introduced diseases and slave raids in the 1860s that carried away much of the population.","c":3,"k":"s","ps":false},{"t":"Many historians now see Rapa Nui less as a warning about self-destruction and more as a story of resilience, followed by outside disaster.","c":3,"k":"s","ps":false},{"t":"That's an important lesson in its own right.","c":3,"k":"s","ps":true},{"t":"Collapse stories often carry a moral, and it's easy to shape the evidence to fit the moral.","c":3,"k":"s","ps":false},{"t":"Part five. What historians agree on.","c":4,"k":"head","ps":false},{"t":"After all that argument, you might wonder whether there's anything solid to hold on to.","c":4,"k":"s","ps":true},{"t":"There is.","c":4,"k":"s","ps":false},{"t":"Historians disagree about a lot, but a handful of patterns come up again and again.","c":4,"k":"s","ps":false},{"t":"Here are five.","c":4,"k":"s","ps":false},{"t":"The first is that there's almost never a single cause.","c":4,"k":"s","ps":true},{"t":"That's why Demandt's list ran to two hundred and ten.","c":4,"k":"s","ps":false},{"t":"Collapses usually come from long-term weaknesses meeting short-term shocks.","c":4,"k":"s","ps":false},{"t":"A drought, a plague or an invasion might be the trigger.","c":4,"k":"s","ps":false},{"t":"But a strong, flexible society can often survive a trigger that finishes off a brittle one.","c":4,"k":"s","ps":false},{"t":"The Roman Empire survived the Antonine Plague.","c":4,"k":"s","ps":false},{"t":"It didn't survive the combination of civil wars, lost provinces and invasions two centuries later.","c":4,"k":"s","ps":false},{"t":"The second is that money and the military matter enormously.","c":4,"k":"s","ps":true},{"t":"Again and again, states get into trouble when the cost of defending themselves outruns their ability to raise taxes.","c":4,"k":"s","ps":false},{"t":"When the western Roman government lost its richest provinces, it lost the money to pay soldiers.","c":4,"k":"s","ps":false},{"t":"When soldiers weren't paid, they rebelled or looked for someone else who would pay.","c":4,"k":"s","ps":false},{"t":"The Spanish Empire went bankrupt several times in the sixteenth and seventeenth centuries, despite huge imports of silver from the Americas.","c":4,"k":"s","ps":false},{"t":"The Soviet Union spent a vast share of its economy on its military while its economy stagnated.","c":4,"k":"s","ps":false},{"t":"Fiscal strain doesn't always cause collapse, but it shows up remarkably often.","c":4,"k":"s","ps":false},{"t":"The third is that elites fighting among themselves is a warning sign.","c":4,"k":"s","ps":true},{"t":"Late Rome had a long run of rival emperors and usurpers.","c":4,"k":"s","ps":false},{"t":"Many dynasties in Chinese history ended amid factional struggles at court.","c":4,"k":"s","ps":false},{"t":"Ibn Khaldun saw it.","c":4,"k":"s","ps":false},{"t":"Turchin measures it.","c":4,"k":"s","ps":false},{"t":"When the people running a system spend more energy fighting each other than solving shared problems, the system weakens from the inside.","c":4,"k":"s","ps":false},{"t":"The fourth is that connection cuts both ways.","c":4,"k":"s","ps":true},{"t":"The Late Bronze Age kingdoms grew rich through trade, then fell together when the network broke.","c":4,"k":"s","ps":false},{"t":"Tight links spread prosperity, but they also spread shocks.","c":4,"k":"s","ps":false},{"t":"That's something people in our own interconnected world think about, from supply chains to financial crises.","c":4,"k":"s","ps":false},{"t":"It's worth being careful with direct comparisons, though.","c":4,"k":"s","ps":false},{"t":"Modern societies have tools the ancients didn't, including scientific knowledge, global communication and the ability to move food across the planet in weeks.","c":4,"k":"s","ps":false},{"t":"The fifth, and perhaps the most important, is that collapse is rarely the end of the people.","c":4,"k":"s","ps":true},{"t":"It's usually the end of a political system.","c":4,"k":"s","ps":false},{"t":"The Classic Maya of Central America are a good example.","c":4,"k":"s","ps":false},{"t":"Between about the eighth and tenth centuries, many of their great cities in the southern lowlands were abandoned.","c":4,"k":"s","ps":false},{"t":"Lake sediments show severe droughts at that time, and a 2018 study estimated that rainfall dropped by roughly half during the worst of them.","c":4,"k":"s","ps":false},{"t":"Warfare between cities also intensified.","c":4,"k":"s","ps":false},{"t":"But the Maya didn't disappear.","c":4,"k":"s","ps":false},{"t":"Other Maya cities in the north thrived for centuries afterwards.","c":4,"k":"s","ps":false},{"t":"Today, millions of people still speak Mayan languages.","c":4,"k":"s","ps":false},{"t":"Some scholars go further and ask who collapse is actually bad for.","c":4,"k":"s","ps":true},{"t":"The political scientist James C.","c":4,"k":"s","ps":false},{"t":"Scott argued that for some ordinary farmers in early states, the end of the state could mean fewer taxes, less forced labour and less conscription.","c":4,"k":"s","ps":false},{"t":"That doesn't make collapse a good thing.","c":4,"k":"s","ps":false},{"t":"It usually brought real suffering, violence and loss.","c":4,"k":"s","ps":false},{"t":"But it's a reminder to ask whose point of view a history is written from.","c":4,"k":"s","ps":false},{"t":"The palace records stop when the palace burns.","c":4,"k":"s","ps":false},{"t":"The villagers often carry on.","c":4,"k":"s","ps":false},{"t":"It's also worth being wary of anyone who claims empires follow a strict timetable.","c":4,"k":"s","ps":true},{"t":"You may come across the claim that every empire lasts about two hundred and fifty years, from a 1976 essay by a retired British general, John Glubb.","c":4,"k":"s","ps":false},{"t":"It's popular online.","c":4,"k":"s","ps":false},{"t":"Most historians don't take it seriously, because the numbers only work if you choose your examples carefully.","c":4,"k":"s","ps":false},{"t":"The researcher Luke Kemp, at the University of Cambridge, looked at dozens of ancient civilisations and found an average lifespan of a little over three hundred years.","c":4,"k":"s","ps":false},{"t":"But the range was enormous, from a few decades to many centuries.","c":4,"k":"s","ps":false},{"t":"An average like that describes the past.","c":4,"k":"s","ps":false},{"t":"It doesn't set a clock for the future.","c":4,"k":"s","ps":false},{"t":"So why does any of this matter on your walk or your drive today?","c":4,"k":"s","ps":true},{"t":"Partly because it's a great story.","c":4,"k":"s","ps":false},{"t":"But also because the patterns historians agree on aren't only about empires.","c":4,"k":"s","ps":false},{"t":"Systems of every size, from companies to clubs to countries, tend to get into trouble in similar ways.","c":4,"k":"s","ps":false},{"t":"Rising costs to keep things running.","c":4,"k":"s","ps":false},{"t":"Leaders fighting among themselves.","c":4,"k":"s","ps":false},{"t":"Too much dependence on a single supply line.","c":4,"k":"s","ps":false},{"t":"And a slow loss of trust that leaves them unable to handle the next shock.","c":4,"k":"s","ps":false},{"t":"Healthy systems, by contrast, keep some slack, share the burden, and adapt when things change.","c":4,"k":"s","ps":false},{"t":"Let's bring it together.","c":4,"k":"s","ps":true},{"t":"Empires rarely fall for one reason.","c":4,"k":"s","ps":false},{"t":"Most collapses come from long-term strains, like the cost of armies, elite infighting and fragile connections, meeting sudden shocks, like drought, disease or invasion.","c":4,"k":"s","ps":false},{"t":"And collapse usually ends a political system rather than a people, who often go on to build something new.","c":4,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":5,"k":"head","ps":false},{"t":"Question one. Which half of the Roman Empire survived for nearly a thousand years after 476?","c":5,"k":"q","ps":false},{"t":"Answer. The eastern half, based in Constantinople.","c":5,"k":"a","ps":false},{"t":"Question two. What did Joseph Tainter argue societies eventually suffer from as they add more complexity?","c":5,"k":"q","ps":false},{"t":"Answer. Diminishing returns. The costs keep rising while the benefits shrink.","c":5,"k":"a","ps":false},{"t":"Question three. What does the Classic Maya collapse show about what usually ends in a collapse?","c":5,"k":"q","ps":false},{"t":"Answer. The political system ends, but the people carry on.","c":5,"k":"a","ps":false},{"t":"That's the end of Why Empires Fall. A big one. Well done for sticking with it.","c":5,"k":"end","ps":false}]},"eponyms":{"chapters":["The earl and the sandwich","A boycott and a cardigan","Shadows and trapezes"],"at":{"f":[0.3,3.71,6.58,10.18,15.31,21.26,22.9,24.01,26.64,28.59,32.84,41.48,51.09,55.61,58.46,61.58,69.95,75.13,82.59,87.31,89.96,97.47,103.24,108.16,113.66,120.44,127.0,130.61,133.73,136.73,137.84,140.14,146.05,149.44,158.07,162.76,170.24,175.88,183.38,189.48,191.9,193.84,198.72,201.18,206.86,210.24,215.22,218.18,220.03,225.89,231.24,233.72,234.76,237.03,241.97,250.53,259.1,265.26,270.04,279.32,286.08,292.76,295.42,299.51,305.88,308.87,310.74,313.53,318.65,323.73,329.34,335.18,338.92,341.11,344.67,352.67,355.16,356.85,364.42,369.06,371.5,373.48,379.32,389.58,394.78,397.44,405.08,410.11,415.84,420.57,422.58,426.13,430.83,435.05,443.37,452.46,457.5,460.47,469.04,475.31,480.2,485.86,489.54,500.83,504.99,515.01,519.65,529.42,535.05],"m":[0.3,3.85,6.8,10.87,16.64,23.33,25.07,26.27,29.07,31.24,35.89,45.5,56.03,61.21,64.3,67.78,77.1,82.68,90.97,95.93,98.78,107.27,113.49,118.76,124.9,132.45,139.97,143.8,147.06,150.37,151.6,153.95,160.55,164.39,174.15,179.35,187.31,193.56,201.56,208.24,210.91,213.05,218.49,221.17,227.56,231.37,237.0,240.08,242.06,248.97,254.86,257.77,258.91,261.33,266.88,276.34,285.95,292.79,297.99,308.22,315.75,322.9,325.89,330.49,337.42,340.59,342.68,345.65,351.29,356.51,362.9,369.36,373.48,375.75,379.92,388.5,391.22,393.1,401.32,406.4,409.12,411.24,417.62,428.87,434.49,437.4,445.95,451.55,457.75,463.01,465.16,469.15,474.22,478.77,487.68,497.56,502.75,505.97,515.42,522.41,527.72,534.05,538.13,550.43,554.72,565.34,570.37,580.27,586.21]},"dur":{"f":539.8,"m":591.3},"units":[{"t":"Words Named After People.","c":-1,"k":"title","ps":false},{"t":"Part one. The earl and the sandwich.","c":0,"k":"head","ps":false},{"t":"Some of the most ordinary words in English are actually people.","c":0,"k":"s","ps":true},{"t":"Real people, with real lives, whose names escaped and became part of the language.","c":0,"k":"s","ps":false},{"t":"A word that comes from a person's name is called an eponym, and in this lesson, we'll meet five of them.","c":0,"k":"s","ps":false},{"t":"Let's begin with lunch.","c":0,"k":"s","ps":false},{"t":"Sandwich.","c":0,"k":"s","ps":false},{"t":"S, A, N, D, W, I, C, H.","c":0,"k":"s","ps":false},{"t":"Here's an everyday example.","c":0,"k":"s","ps":false},{"t":"I grabbed a ham and cheese sandwich from the bakery on the way to work.","c":0,"k":"s","ps":false},{"t":"The sandwich is named after John Montagu, the fourth Earl of Sandwich, an English aristocrat who lived in the 1700s.","c":0,"k":"s","ps":false},{"t":"Sandwich itself is a small town in Kent, in the south east of England, so strictly speaking, your lunch is named after a place by way of a person.","c":0,"k":"s","ps":false},{"t":"Nobody believes the earl invented the idea of putting food between bread.","c":0,"k":"s","ps":false},{"t":"People had been doing that for a very long time.","c":0,"k":"s","ps":false},{"t":"What he did was make it fashionable, and give it a name.","c":0,"k":"s","ps":false},{"t":"The famous story comes from a French travel writer called Pierre-Jean Grosley, who visited London in the 1760s.","c":0,"k":"s","ps":false},{"t":"He reported that a government minister once spent twenty-four hours at a gambling table.","c":0,"k":"s","ps":false},{"t":"The minister was so absorbed in the game, Grosley wrote, that he ate nothing but some beef between slices of toasted bread.","c":0,"k":"s","ps":false},{"t":"This new snack, Grosley said, was named after the minister who invented it.","c":0,"k":"s","ps":false},{"t":"It's a great story, but it may not be fair.","c":0,"k":"s","ps":false},{"t":"The earl's modern biographer, the naval historian Nicholas Rodger, points out that Montagu was a hardworking official.","c":0,"k":"s","ps":false},{"t":"He suggests the earl was just as likely to have eaten his bread and beef at his desk, working late.","c":0,"k":"s","ps":false},{"t":"Either way, the word was already in use by 1762.","c":0,"k":"s","ps":false},{"t":"That year, the historian Edward Gibbon wrote in his journal about a London club he'd visited.","c":0,"k":"s","ps":false},{"t":"He saw some of the most important men in the country there, eating, in his words, a bit of cold meat, or a Sandwich.","c":0,"k":"s","ps":false},{"t":"So a busy aristocrat who didn't want to put down his cards, or his paperwork, gave the world its favourite lunch.","c":0,"k":"s","ps":false},{"t":"And a word he couldn't possibly have predicted.","c":0,"k":"s","ps":false},{"t":"Part two. A boycott and a cardigan.","c":1,"k":"head","ps":false},{"t":"Our second word has a much less cheerful story.","c":1,"k":"s","ps":true},{"t":"Boycott.","c":1,"k":"s","ps":false},{"t":"B, O, Y, C, O, T, T.","c":1,"k":"s","ps":false},{"t":"For example, the whole netball club decided to boycott the café after it doubled its prices.","c":1,"k":"s","ps":false},{"t":"Charles Boycott was a retired British army captain.","c":1,"k":"s","ps":false},{"t":"In 1880, he was working in County Mayo, in the west of Ireland, as a land agent for an absentee landlord.","c":1,"k":"s","ps":false},{"t":"His job was to manage the estate and collect rent from the tenant farmers.","c":1,"k":"s","ps":false},{"t":"Times were hard, harvests had been poor, and Irish tenants were organising to demand lower rents and fairer treatment.","c":1,"k":"s","ps":false},{"t":"The Irish nationalist leader Charles Stewart Parnell had recently suggested a new tactic.","c":1,"k":"s","ps":false},{"t":"Rather than using violence against a landlord or agent who treated tenants unfairly, the community could simply shun him.","c":1,"k":"s","ps":false},{"t":"When Boycott refused the tenants' demands and moved to evict some of them, that's exactly what happened.","c":1,"k":"s","ps":false},{"t":"His farm workers walked off the job.","c":1,"k":"s","ps":false},{"t":"Local shops wouldn't serve him.","c":1,"k":"s","ps":false},{"t":"The blacksmith wouldn't shoe his horses, and even the postman stopped delivering his mail.","c":1,"k":"s","ps":false},{"t":"His crops were left standing in the fields.","c":1,"k":"s","ps":false},{"t":"In the end, a group of volunteers was brought in from the north of Ireland to bring in the harvest.","c":1,"k":"s","ps":false},{"t":"They were guarded by around a thousand soldiers and police.","c":1,"k":"s","ps":false},{"t":"By most accounts, the whole operation cost many times more than the crops were worth.","c":1,"k":"s","ps":false},{"t":"Boycott left Ireland before the year was out.","c":1,"k":"s","ps":false},{"t":"But his name stayed behind.","c":1,"k":"s","ps":false},{"t":"Within weeks, newspapers were using boycott as a verb, and it quickly spread well beyond English.","c":1,"k":"s","ps":false},{"t":"A version of the word is now used in French, German, Dutch and many other languages.","c":1,"k":"s","ps":false},{"t":"Our third word takes us to a battlefield.","c":1,"k":"s","ps":false},{"t":"Cardigan.","c":1,"k":"s","ps":false},{"t":"C, A, R, D, I, G, A, N.","c":1,"k":"s","ps":false},{"t":"For example, take a cardigan, it gets cold on the ferry once the sun goes down.","c":1,"k":"s","ps":false},{"t":"James Brudenell, the seventh Earl of Cardigan, was a wealthy British cavalry officer with a reputation for being arrogant and quarrelsome.","c":1,"k":"s","ps":false},{"t":"In October 1854, during the Crimean War, he led the Charge of the Light Brigade at the Battle of Balaclava.","c":1,"k":"s","ps":false},{"t":"Because of a confused order, hundreds of cavalrymen rode straight down a valley towards Russian guns.","c":1,"k":"s","ps":false},{"t":"Many were killed or wounded, but the earl survived and came home a celebrity.","c":1,"k":"s","ps":false},{"t":"The poet Alfred Tennyson turned the disaster into one of the most famous poems in English, with its line, into the valley of Death rode the six hundred.","c":1,"k":"s","ps":false},{"t":"The charge was a military blunder, but back in Britain it was celebrated as an example of courage and duty.","c":1,"k":"s","ps":false},{"t":"The knitted woollen waistcoat that he and his officers wore to keep warm became fashionable, and it took his name.","c":1,"k":"s","ps":false},{"t":"That same war gave us two more clothing words.","c":1,"k":"s","ps":false},{"t":"The raglan sleeve is named after Lord Raglan, the British commander.","c":1,"k":"s","ps":false},{"t":"And the balaclava is named after the battle itself, though that one's a place, not a person.","c":1,"k":"s","ps":false},{"t":"Part three. Shadows and trapezes.","c":2,"k":"head","ps":false},{"t":"Our fourth word is silhouette.","c":2,"k":"s","ps":true},{"t":"S, I, L, H, O, U, E, T, T, E.","c":2,"k":"s","ps":false},{"t":"For example, we sat on the beach and watched the silhouettes of surfers against the sunset.","c":2,"k":"s","ps":false},{"t":"Étienne de Silhouette was a French finance minister under King Louis the fifteenth.","c":2,"k":"s","ps":false},{"t":"He took the job in 1759, when France was deep in debt from war.","c":2,"k":"s","ps":false},{"t":"He tried to fix the problem with strict savings and new taxes, including taxes aimed at the rich.","c":2,"k":"s","ps":false},{"t":"It didn't go down well, and he lasted only about eight months.","c":2,"k":"s","ps":false},{"t":"His name, though, became a joke.","c":2,"k":"s","ps":false},{"t":"Doing something à la Silhouette came to mean doing it on the cheap.","c":2,"k":"s","ps":false},{"t":"At the time, a popular and inexpensive way to get a portrait was to trace someone's shadow and cut the outline from black paper.","c":2,"k":"s","ps":false},{"t":"These cheap shadow portraits got his name.","c":2,"k":"s","ps":false},{"t":"There's another theory too.","c":2,"k":"s","ps":false},{"t":"Silhouette was said to have enjoyed cutting out paper profiles himself as a hobby, and to have decorated his château with them.","c":2,"k":"s","ps":false},{"t":"Historians aren't sure which explanation is right, and it may be a bit of both.","c":2,"k":"s","ps":false},{"t":"Our fifth and final word is leotard.","c":2,"k":"s","ps":false},{"t":"L, E, O, T, A, R, D.","c":2,"k":"s","ps":false},{"t":"For example, my niece refuses to wear anything except her sparkly gymnastics leotard.","c":2,"k":"s","ps":false},{"t":"Jules Léotard was a French acrobat, and in 1859, in Paris, he performed what is often described as the first flying trapeze act.","c":2,"k":"s","ps":false},{"t":"He swung from one bar to another high above the audience, and he became a sensation.","c":2,"k":"s","ps":false},{"t":"He was only in his early twenties at the time.","c":2,"k":"s","ps":false},{"t":"He practised, the story goes, above the swimming pool his father ran in Toulouse, which would have made the falls a lot softer.","c":2,"k":"s","ps":false},{"t":"A popular song, The Daring Young Man on the Flying Trapeze, was written about him.","c":2,"k":"s","ps":false},{"t":"Léotard wore a tight, one-piece outfit that let him move freely and show off his muscles.","c":2,"k":"s","ps":false},{"t":"He called it a maillot, but after his early death, it became known by his name.","c":2,"k":"s","ps":false},{"t":"So what should we take from all this?","c":2,"k":"s","ps":false},{"t":"First, eponyms are everywhere once you start listening for them.","c":2,"k":"s","ps":false},{"t":"The diesel engine is named after the German engineer Rudolf Diesel.","c":2,"k":"s","ps":false},{"t":"The saxophone is named after its Belgian inventor, Adolphe Sax.","c":2,"k":"s","ps":false},{"t":"Nicotine takes its name from Jean Nicot, a French diplomat who sent tobacco plants back to Paris in the 1500s.","c":2,"k":"s","ps":false},{"t":"Even the humble biro, as Australians call a ballpoint pen, is named after László Bíró, the Hungarian journalist who helped invent it.","c":2,"k":"s","ps":false},{"t":"Second, eponyms remind us that language isn't built only by scholars.","c":2,"k":"s","ps":false},{"t":"It's built by gossip, headlines and fashion.","c":2,"k":"s","ps":false},{"t":"A gambling story, a village protest, a war hero's jumper, a failed minister and a circus star all made it into everyday English.","c":2,"k":"s","ps":false},{"t":"To sum up, sandwich, boycott, cardigan, silhouette and leotard are all named after real people.","c":2,"k":"s","ps":false},{"t":"Some were honoured by their words, like Léotard, and some were mocked, like Silhouette.","c":2,"k":"s","ps":false},{"t":"Next time you pull on a cardigan or make a sandwich, you'll know who you're carrying with you.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. Which word comes from an Irish land agent who was shunned by his whole community in 1880?","c":3,"k":"q","ps":false},{"t":"Answer. Boycott, from Captain Charles Boycott.","c":3,"k":"a","ps":false},{"t":"Question two. The cardigan is named after an earl who led a famous cavalry charge. Which charge?","c":3,"k":"q","ps":false},{"t":"Answer. The Charge of the Light Brigade, in the Crimean War.","c":3,"k":"a","ps":false},{"t":"Question three. Why did the name of a French finance minister come to mean a cheap shadow portrait?","c":3,"k":"q","ps":false},{"t":"Answer. His penny-pinching made his name a byword for doing things on the cheap.","c":3,"k":"a","ps":false},{"t":"That's the end of Words Named After People. Catch you next time.","c":3,"k":"end","ps":false}]},"fallacies":{"chapters":["What a good argument needs","Attacking the wrong target","Rigging the choices","Shaky evidence, shaky links","Disagreeing without a fight"],"at":{"f":[0.3,3.29,6.16,9.14,16.93,22.78,26.78,30.64,38.03,44.0,52.57,60.63,67.12,70.41,75.02,76.96,78.34,80.61,84.69,86.73,92.08,94.89,98.34,102.35,105.76,111.92,114.23,119.53,124.06,130.35,134.27,139.84,142.48,147.58,155.95,164.52,167.07,171.63,175.68,182.73,190.43,196.12,198.12,203.77,207.16,212.13,214.95,217.29,219.85,225.17,234.58,238.65,243.08,246.05,248.97,253.96,256.48,262.83,267.66,269.73,271.68,276.36,281.67,283.11,287.41,293.25,298.75,302.49,305.45,307.92,309.82,312.53,314.47,319.2,321.88,324.46,328.5,330.02,333.67,337.67,341.71,343.61,347.52,353.66,358.77,364.58,367.9,370.88,373.43,376.03,379.59,385.72,392.92,396.03,404.26,408.76,410.98,412.75,415.45,417.44,421.08,423.39,426.02,428.59,433.37,441.52,451.7,454.43,460.96,467.35,473.55,475.99,478.04,481.6,485.23,488.54,490.65,492.42,497.52,501.51,503.87,507.07,509.48,511.74,514.95,519.46,523.44,526.14,529.47,534.9,540.88,545.78,549.58,552.3,555.03,560.04,562.35,566.4,569.24,573.72,575.27,578.05,581.04,587.99,590.74,596.78,603.7,609.23,611.16,614.2,616.65,620.56,625.7,628.65,630.48,634.14,636.41,640.87,643.83,649.89,653.42,656.13,658.61,660.68,662.73,666.23,669.5,672.96,675.32,678.61,681.45,684.56,687.78,693.19,696.92,699.21,701.37,703.67,705.86,712.09,715.35,724.48,729.11,734.09,742.59,747.18,750.33,753.26,759.05,760.8,763.52,766.6,769.25,773.84,780.36,783.66,786.66,793.31,796.74,800.07,805.38,809.97,816.18,821.61,823.64,826.42,828.66,832.65,8
