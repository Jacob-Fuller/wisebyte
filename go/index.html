<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wisebyte - Go</title>
<meta name="description" content="Audio lessons for the walk, the commute and the drive.">
<meta name="theme-color" content="#141210">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wisebyte - Go">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="format-detection" content="telephone=no">
<style>
/* Fonts are bundled with the app (SIL Open Font License, see fonts/), so they work offline */
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond.woff) format("woff");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond-italic.woff) format("woff");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff) format("woff");font-weight:300 900;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff) format("woff");font-weight:100 800;font-style:normal;font-display:swap}
</style>
<style>
:root{
  color-scheme:dark;
  /* Single dark theme, matching Wisebyte - Scroll */
  --ground:#141210; --surface:#1D1A16; --surface-2:#24201B; --line:#353029;
  --ink:#F3EEE6; --ink-2:#A59D91;
  --accent:#C08F5C; --accent-ink:#1A140D; --accent-soft:#3A2C1D;
  --good:#8DB57F; --good-soft:#232B1D; --warn:#D98272; --warn-soft:#3A1D1A;
  --p-knowledge:#C08F5C; --p-vocabulary:#8FB9A2; --p-practical:#D9BB6E; --p-expression:#C99BCB; --p-cognition:#9DB3D2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.greek{font-family:var(--display);letter-spacing:.04em}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 170px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;color:var(--accent);flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:.03em;display:block;line-height:1}
.brand .go{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.12em;padding:3px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);vertical-align:middle;margin-left:6px;position:relative;top:-3px}
.brand small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:12px;background:var(--surface);border:1px solid var(--line)}
.pill svg{width:14px;height:14px;color:var(--accent)}

section{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh h2{font-size:24px}
.link{color:var(--accent);font-weight:600;font-size:14px}

/* trip length picker */
.trip{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.trip h1{font-size:30px}
.trip .gk{font-size:13px;color:var(--ink-2)}
.lens{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.len{padding:12px 4px 10px;border-radius:14px;background:var(--surface-2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid transparent}
.len b{font-family:var(--mono);font-size:20px;line-height:1}
.len span{font-size:11px;font-weight:600;color:var(--ink-2)}
.len[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.len[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}

/* up next hero */
.hero{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .disc{flex:none}
.hero .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hero h3{font-size:22px}
.hero p{font-size:14px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--t)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);align-items:center}
.meta .num{font-size:12px}
.playbig{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.playbig svg{width:26px;height:26px}
.hero-row{display:flex;align-items:center;gap:12px;margin-top:4px}

/* disc (small art) */
.disc{--t:var(--accent);width:78px;height:78px;border-radius:50%;position:relative;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.disc::before,.disc::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid color-mix(in srgb,var(--t) 45%,transparent)}
.disc::after{inset:19px;border-color:color-mix(in srgb,var(--t) 70%,transparent)}
.disc span{font-family:var(--display);font-size:13px;color:var(--t);position:relative;z-index:1;text-align:center;line-height:1}

/* planner */
.plan{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:700}
.stepper output{font-family:var(--mono);font-size:26px;font-weight:700;min-width:3ch;text-align:center}
.stepper small{color:var(--ink-2);font-weight:600}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.qi i{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.qi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi b{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-weight:500}
.fill{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.fill i{height:100%;background:var(--t)}
.fill i+i{border-left:2px solid var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}.btnrow .btn{flex:1 1 auto}
.btn{white-space:nowrap}
.btn svg{flex:none}
.about .link{padding:0;font-size:inherit}

/* pillar chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--t)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.col .gw{font-family:var(--display);font-size:14px;color:var(--t);line-height:1}
.col .shaft{width:26px;height:36px;border-radius:3px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--t) 22%,transparent) 0 4px,color-mix(in srgb,var(--t) 40%,transparent) 4px 5px)}
.col small{font-size:10px;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.row .dur{width:46px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t) 14%,var(--surface));color:var(--t);flex:none}
.row .dur b{font-family:var(--mono);font-size:17px;line-height:1}
.row .dur span{font-size:10px;font-weight:700;letter-spacing:.06em}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .txt strong{font-weight:600;font-size:15px;line-height:1.3}
.row .txt small{color:var(--ink-2);font-size:12.5px;display:flex;gap:4px 10px;flex-wrap:wrap}
.row .pb{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.row .pb svg{width:16px;height:16px}
.row.now{border-color:var(--accent)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.badge.done{background:var(--surface-2);color:var(--ink-2)}
.progress-mini{height:3px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.progress-mini i{display:block;height:100%;background:var(--accent)}

/* series */
.series{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.series header{display:flex;gap:14px;align-items:center}
.series h3{font-size:21px}
.eps{display:flex;flex-direction:column}
.ep{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ep .n{font-family:var(--mono);font-size:13px;color:var(--ink-2);width:22px;flex:none}
.ep .t{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.ep .m{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.ep svg{width:16px;height:16px;color:var(--accent);flex:none}

/* you */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:24px}
.stat span{font-size:12px;color:var(--ink-2);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding:14px 14px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.week i.zero{background:var(--surface-2)}
.week small{font-size:11px;color:var(--ink-2);font-weight:600}
.setting{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.setting label{font-weight:600;font-size:14px}
select{font:inherit;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.note{font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.note b{color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* tab bar + mini player */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock-in{max-width:560px;margin:0 auto;padding:8px 12px 6px;display:flex;flex-direction:column;gap:8px}
.mini{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%}
.mini .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.mini .txt strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .txt small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mini .pp svg{width:18px;height:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink-2)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* equaliser bars */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:16px;width:18px;flex:none}
.eq i{flex:1;background:var(--accent);border-radius:1px;height:30%}
.eq.on i{animation:eq 1s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:-.4s}.eq.on i:nth-child(3){animation-delay:-.7s}.eq.on i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* player sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--ground);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 40px;display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.art{--t:var(--accent);position:relative;width:min(64vw,250px);aspect-ratio:1;max-width:100%;margin:6px auto 0;display:grid;place-items:center}
.art .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--t) 55%,transparent);opacity:.0}
.art .core{position:relative;width:70%;aspect-ratio:1;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px}
.art .core b{font-family:var(--display);font-weight:400;font-size:clamp(22px,7vw,32px);color:var(--t);line-height:1}
.art .core small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.art .static{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--t) 30%,transparent)}
.art .s1{inset:6%}.art .s2{inset:0}
.art.on .ring{animation:ripple 3.6s ease-out infinite}
.art.on .ring:nth-child(2){animation-delay:1.2s}.art.on .ring:nth-child(3){animation-delay:2.4s}
@keyframes ripple{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.ptitle{display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.ptitle h2{font-size:26px}
.ptitle p{font-size:14px;color:var(--ink-2)}
.status{min-height:22px;text-align:center;font-size:13.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px}
.bar{display:flex;flex-direction:column;gap:6px}
.track{height:10px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden;cursor:pointer;touch-action:none}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px;transition:width .5s}
.track b{position:absolute;top:0;bottom:0;width:2px;background:var(--ground);z-index:1}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:18px}
.ctrl{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);position:relative}
.ctrl svg{width:26px;height:26px}
.ctrl svg{width:34px;height:34px}
.ctrl small{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;padding-top:2px}
.ctrl.main{width:84px;height:84px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.ctrl.main svg{width:34px;height:34px}
.subctrls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sub{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.sub svg{width:20px;height:20px;color:var(--ink)}
.sub b{font-family:var(--mono);font-size:15px;color:var(--ink);line-height:20px}
.chapters{display:flex;flex-direction:column;gap:6px}
.chap{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;font-size:14px}
.chap .n{font-family:var(--mono);font-size:12px;color:var(--ink-2);width:20px}
.chap .t{flex:1;min-width:0}
.chap.cur{border-color:var(--accent);background:var(--accent-soft)}
.chap .st{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.transcript{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);max-height:48vh;overflow-y:auto}
.transcript h4{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:18px}
.transcript p{font-size:15.5px;line-height:1.65;max-width:65ch}
.transcript .s{cursor:pointer;border-radius:4px;transition:background .2s}
.transcript .s.cur{background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.transcript .s:hover{text-decoration:underline;text-decoration-color:var(--line)}
.writing{color:var(--ink-2);font-style:italic;font-size:14px}
.alert{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.alert.info{background:var(--accent-soft);color:var(--ink)}

/* drive mode */
.drive{position:fixed;inset:0;z-index:60;background:#0E0C0A;color:#F3EEE6;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);gap:14px}
.drive .dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.drive .dtop .eyebrow{color:#7D766C}
.drive .exit{padding:12px 18px;border-radius:14px;background:#24201B;font-weight:700;color:#F3EEE6}
.drive .dt{display:flex;flex-direction:column;gap:6px}
.drive .dt h2{font-size:clamp(26px,7vw,40px);color:#F3EEE6}
.drive .dt p{font-size:18px;color:#A59D91}
.drive .dstatus{font-size:17px;font-weight:700;color:#D4A26D;min-height:26px}
.drive .dgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr;gap:12px;min-height:0}
.drive .dbtn{border-radius:26px;background:#1D1A16;color:#F3EEE6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:700;border:1px solid #353029}
.drive .dbtn svg{width:48px;height:48px}
.drive .dbtn.main{grid-column:1 / -1;background:#C08F5C;color:#1A140D;border:0}
.drive .dbtn.main svg{width:92px;height:92px}
.drive .dtrack{height:8px;border-radius:9px;background:#24201B;overflow:hidden}
.drive .dtrack i{display:block;height:100%;background:#C08F5C}

/* narrator switch */
.narr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.narr button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;text-align:left}
.narr button .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--display);font-size:16px;color:var(--accent);flex:none}
.narr button span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.narr button b{font-size:14px}
.narr button small{font-size:12px;color:var(--ink-2)}
.narr button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.narr.compact button{padding:8px 10px}
.narr.compact .av{width:28px;height:28px;font-size:14px}
.row.soon{opacity:.62}
.row.soon .pb{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}
.badge.soon{background:var(--surface-2);color:var(--ink-2)}
.drive .dnarr{display:flex;gap:8px}
.drive .dnarr button{flex:1;padding:12px;border-radius:14px;background:#1D1A16;color:#A59D91;font-weight:700;border:1px solid #353029}
.drive .dnarr button[aria-pressed="true"]{background:#2A2117;color:#D4A26D;border-color:#C08F5C}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--ground);font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* downloads */
.row .dl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.row .dl svg{width:18px;height:18px}
.row .dl.saved{color:var(--good)}
.row .dl.busy svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.badge.off{background:var(--good-soft);color:var(--good)}
.dlbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.dlbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.set-row b{font-family:var(--mono);font-weight:700}
/* general-information note */
.gi{font-size:13px;line-height:1.45;color:var(--ink-2);padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.gi b{color:var(--ink)}
/* welcome + drive notice */
.overlay{position:fixed;inset:0;z-index:90;background:var(--ground);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:100%;justify-content:center}
.overlay .logo{width:56px;height:56px;color:var(--accent)}
.overlay h1{font-size:34px}
.overlay .lead{font-size:16px;color:var(--ink-2)}
.feat{display:flex;flex-direction:column;gap:12px}
.feat div{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.feat svg{width:22px;height:22px;color:var(--accent);flex:none;margin-top:1px}
.feat b{display:block}
.feat span{color:var(--ink-2);font-size:14px}
.fine{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.fine a,.about a{color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;z-index:95;background:rgba(7,9,11,.72);display:grid;place-items:center;padding:16px}
.modal-in{max-width:420px;width:100%;background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal-in h2{font-size:26px}
.modal-in p{font-size:15px;color:var(--ink-2)}
.about{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){.row .dl.busy svg{animation:none}.eq.on i,.art.on .ring{animation:none}.art.on .ring{opacity:.5}}
@media (max-width:380px){.len b{font-size:17px}.col .gw{font-size:12px}.ctrls{gap:12px}}
</style>

they went about testing their guesses.","c":0,"k":"s","ps":false},{"t":"Nearly everyone tested sequences that they expected to fit their idea.","c":0,"k":"s","ps":false},{"t":"Almost nobody tried a sequence that might break it, like three, two, one, or one, two, ninety-nine.","c":0,"k":"s","ps":false},{"t":"In Wason's study, only a minority of people found the correct rule on their first announced guess.","c":0,"k":"s","ps":false},{"t":"Here's the key point.","c":0,"k":"s","ps":true},{"t":"If you only ever look for evidence that you're right, you can collect a mountain of it and still be wrong.","c":0,"k":"s","ps":false},{"t":"Every yes felt like progress.","c":0,"k":"s","ps":false},{"t":"But none of those yeses could ever show that the idea was mistaken.","c":0,"k":"s","ps":false},{"t":"The most useful test would have been one designed to prove the idea wrong.","c":0,"k":"s","ps":false},{"t":"This tendency has a name.","c":0,"k":"s","ps":true},{"t":"Confirmation bias. It's the habit of searching for, noticing, interpreting and remembering information in ways that support what we already believe.","c":0,"k":"s","ps":false},{"t":"It's one of the most studied thinking errors in all of psychology, and it isn't a sign of low intelligence.","c":0,"k":"s","ps":false},{"t":"Clever people do it too.","c":0,"k":"s","ps":false},{"t":"Sometimes clever people are even better at it, because they're better at building arguments for what they already think.","c":0,"k":"s","ps":false},{"t":"The idea itself is old.","c":0,"k":"s","ps":true},{"t":"Around four hundred years ago, the English philosopher Francis Bacon described it beautifully.","c":0,"k":"s","ps":false},{"t":"In his book the Novum Organum, published in 1620, he wrote that the human understanding, once it has adopted an opinion, draws all things else to support and agree with it.","c":0,"k":"s","ps":false},{"t":"In other words, our minds don't just hold beliefs.","c":0,"k":"s","ps":false},{"t":"They recruit evidence for them.","c":0,"k":"s","ps":false},{"t":"Why would our minds work this way?","c":0,"k":"s","ps":true},{"t":"One reasonable explanation is efficiency.","c":0,"k":"s","ps":false},{"t":"Checking every belief from scratch would be exhausting.","c":0,"k":"s","ps":false},{"t":"Most of the time, our existing beliefs are good enough, so it makes sense to lean on them.","c":0,"k":"s","ps":false},{"t":"Looking for a quick yes is fast and usually harmless.","c":0,"k":"s","ps":false},{"t":"The trouble starts when the belief is wrong, or when the stakes are high, and our shortcut quietly keeps us from finding out.","c":0,"k":"s","ps":false},{"t":"There's an emotional side too.","c":0,"k":"s","ps":true},{"t":"Being right feels good.","c":0,"k":"s","ps":false},{"t":"Being wrong can sting, especially when a belief is tied up with who we are, our politics, our job, our choices as a parent.","c":0,"k":"s","ps":false},{"t":"Evidence that we're wrong can feel less like information and more like an attack.","c":0,"k":"s","ps":false},{"t":"So we steer around it, often without noticing.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll look at the three main ways confirmation bias works on us.","c":0,"k":"s","ps":true},{"t":"It isn't just about what we search for.","c":0,"k":"s","ps":false},{"t":"It also changes how we read evidence, and even what we remember.","c":0,"k":"s","ps":false},{"t":"Part two. Search, interpret, remember.","c":1,"k":"head","ps":false},{"t":"Confirmation bias shows up in three places.","c":1,"k":"s","ps":true},{"t":"How we search for information.","c":1,"k":"s","ps":false},{"t":"How we interpret it.","c":1,"k":"s","ps":false},{"t":"And how we remember it.","c":1,"k":"s","ps":false},{"t":"Let's take them one at a time.","c":1,"k":"s","ps":false},{"t":"First, search. The two, four, six puzzle was all about search.","c":1,"k":"s","ps":true},{"t":"We ask questions that we expect to answer yes.","c":1,"k":"s","ps":false},{"t":"You see this everywhere in daily life.","c":1,"k":"s","ps":false},{"t":"If you suspect a new colleague is lazy, you'll notice every late arrival and long lunch.","c":1,"k":"s","ps":false},{"t":"You won't go looking for the evening they stayed back to fix a problem.","c":1,"k":"s","ps":false},{"t":"If you've decided a certain car brand is unreliable, you'll search online for breakdown stories, and of course, you'll find plenty.","c":1,"k":"s","ps":false},{"t":"The internet makes this easier than ever.","c":1,"k":"s","ps":false},{"t":"Almost any belief can find a website that agrees with it.","c":1,"k":"s","ps":false},{"t":"Second, interpretation. This one is sneakier.","c":1,"k":"s","ps":true},{"t":"Even when two people look at exactly the same evidence, they can walk away more convinced of opposite conclusions.","c":1,"k":"s","ps":false},{"t":"A famous study at Stanford University in 1979 showed this clearly.","c":1,"k":"s","ps":true},{"t":"The researchers, Charles Lord, Lee Ross and Mark Lepper, gathered people who either strongly supported or strongly opposed the death penalty.","c":1,"k":"s","ps":false},{"t":"They gave everyone the same two studies to read.","c":1,"k":"s","ps":false},{"t":"One study seemed to show that the death penalty deters crime.","c":1,"k":"s","ps":false},{"t":"The other seemed to show it doesn't.","c":1,"k":"s","ps":false},{"t":"It was a balanced set of evidence.","c":1,"k":"s","ps":false},{"t":"You might expect people to move towards the middle.","c":1,"k":"s","ps":true},{"t":"The opposite happened.","c":1,"k":"s","ps":false},{"t":"Supporters rated the pro study as more convincing and picked holes in the other.","c":1,"k":"s","ps":false},{"t":"Opponents did exactly the reverse.","c":1,"k":"s","ps":false},{"t":"And after reading the same mixed evidence, both groups reported feeling more strongly about their original view.","c":1,"k":"s","ps":false},{"t":"Same facts, opposite conclusions, and more confidence all round.","c":1,"k":"s","ps":false},{"t":"Why? Because we don't treat evidence evenly.","c":1,"k":"s","ps":true},{"t":"When something agrees with us, we ask, can I believe this?","c":1,"k":"s","ps":false},{"t":"And usually the answer is yes.","c":1,"k":"s","ps":false},{"t":"When something disagrees with us, we ask a much tougher question.","c":1,"k":"s","ps":false},{"t":"Must I believe this?","c":1,"k":"s","ps":false},{"t":"And it's almost always possible to find a reason why not.","c":1,"k":"s","ps":false},{"t":"Third, memory. Our memories don't store events evenly either.","c":1,"k":"s","ps":true},{"t":"In a study by Mark Snyder and Nancy Cantor, people read a story about a woman called Jane, who did some things that seemed outgoing and some things that seemed shy.","c":1,"k":"s","ps":false},{"t":"Days later, some people were asked whether Jane would suit a job as a real estate agent.","c":1,"k":"s","ps":false},{"t":"Others were asked whether she'd suit a job as a librarian.","c":1,"k":"s","ps":false},{"t":"Each group mostly remembered the parts of the story that fitted the question they were asked.","c":1,"k":"s","ps":false},{"t":"The real estate group recalled her outgoing moments.","c":1,"k":"s","ps":false},{"t":"The librarian group recalled her quiet ones.","c":1,"k":"s","ps":false},{"t":"Same Jane, different memories.","c":1,"k":"s","ps":false},{"t":"This is why horoscopes and psychic readings can feel so accurate.","c":1,"k":"s","ps":true},{"t":"We remember the hits and quietly forget the misses.","c":1,"k":"s","ps":false},{"t":"The prediction that came true feels meaningful.","c":1,"k":"s","ps":false},{"t":"The ten that didn't simply fade away.","c":1,"k":"s","ps":false},{"t":"There's a modern twist on all of this.","c":1,"k":"s","ps":true},{"t":"Many of the apps and feeds we use are designed to show us more of what we already click on.","c":1,"k":"s","ps":false},{"t":"If you watch a few videos with one view on a topic, you'll probably be offered more that agree.","c":1,"k":"s","ps":false},{"t":"Nobody has to be trying to mislead you.","c":1,"k":"s","ps":false},{"t":"The feed is simply giving you more of what you seem to like.","c":1,"k":"s","ps":false},{"t":"But the effect can be a bit like playing the two, four, six game with a partner who only ever hands you sequences that fit your guess.","c":1,"k":"s","ps":false},{"t":"Put these three together and you get a powerful loop.","c":1,"k":"s","ps":true},{"t":"We search for evidence that fits.","c":1,"k":"s","ps":false},{"t":"We interpret mixed evidence in our favour.","c":1,"k":"s","ps":false},{"t":"And we remember the bits that agreed with us.","c":1,"k":"s","ps":false},{"t":"Each step makes the belief feel stronger, even when the world hasn't given us any new reason to hold it.","c":1,"k":"s","ps":false},{"t":"So can we do anything about it?","c":1,"k":"s","ps":true},{"t":"The good news is yes.","c":1,"k":"s","ps":false},{"t":"In the final part, we'll look at some simple habits that researchers have found genuinely help.","c":1,"k":"s","ps":false},{"t":"Part three. How to catch yourself.","c":2,"k":"head","ps":false},{"t":"The first thing to know is that simply telling yourself to be fair doesn't work very well.","c":2,"k":"s","ps":true},{"t":"In a follow-up study, Charles Lord, Mark Lepper and Elizabeth Preston tried exactly that.","c":2,"k":"s","ps":false},{"t":"They asked some people to be as objective and unbiased as possible when weighing evidence.","c":2,"k":"s","ps":false},{"t":"It made little difference.","c":2,"k":"s","ps":false},{"t":"People sincerely believed they were being fair, and they were still biased.","c":2,"k":"s","ps":false},{"t":"What did work was a more specific instruction.","c":2,"k":"s","ps":true},{"t":"The researchers asked another group to consider the opposite.","c":2,"k":"s","ps":false},{"t":"In effect, they said, as you read each study, ask yourself how you'd judge it if it had found the opposite result.","c":2,"k":"s","ps":false},{"t":"That simple question cut the bias noticeably.","c":2,"k":"s","ps":false},{"t":"It forced people to apply the same standards to both sides.","c":2,"k":"s","ps":false},{"t":"So here's the first habit.","c":2,"k":"s","ps":true},{"t":"Consider the opposite.","c":2,"k":"s","ps":false},{"t":"When you find yourself nodding along to something, ask, if this said the reverse, would I accept it this easily?","c":2,"k":"s","ps":false},{"t":"And when you find yourself picking holes in something, ask, would I be this picky if I agreed with it?","c":2,"k":"s","ps":false},{"t":"The second habit is to go looking for disconfirming evidence on purpose.","c":2,"k":"s","ps":true},{"t":"This is exactly what the two, four, six puzzle rewarded.","c":2,"k":"s","ps":false},{"t":"Instead of asking, what would prove me right, ask, what would prove me wrong, and where could I find it?","c":2,"k":"s","ps":false},{"t":"If you think a business idea is brilliant, don't just ask friends who'll say it's great.","c":2,"k":"s","ps":false},{"t":"Ask someone likely to spot the flaws.","c":2,"k":"s","ps":false},{"t":"If you're convinced about a health claim, look for the best argument against it, not the worst one.","c":2,"k":"s","ps":false},{"t":"Charles Darwin had a lovely version of this.","c":2,"k":"s","ps":true},{"t":"In his autobiography, he described what he called a golden rule.","c":2,"k":"s","ps":false},{"t":"Whenever he came across a published fact or a new thought that went against his general results, he wrote a note about it straight away.","c":2,"k":"s","ps":false},{"t":"He'd learned from experience that facts like that were far more likely to slip from his memory than the ones that supported him.","c":2,"k":"s","ps":false},{"t":"Darwin was deliberately working against his own memory bias.","c":2,"k":"s","ps":false},{"t":"The third habit is to hold beliefs with a little looseness.","c":2,"k":"s","ps":true},{"t":"Try putting a rough confidence level on the things you believe.","c":2,"k":"s","ps":false},{"t":"Instead of, I'm right about this, try, I'm about seventy per cent sure.","c":2,"k":"s","ps":false},{"t":"It sounds like a small change.","c":2,"k":"s","ps":false},{"t":"But it leaves room for new evidence to move you, and it makes changing your mind feel like an update rather than a defeat.","c":2,"k":"s","ps":false},{"t":"It's worth knowing that this matters well beyond arguments over dinner.","c":2,"k":"s","ps":true},{"t":"In medicine, doctors are trained to watch for something called premature closure.","c":2,"k":"s","ps":false},{"t":"That's when a diagnosis is settled on early, and later symptoms get explained to fit it rather than questioned.","c":2,"k":"s","ps":false},{"t":"In investing, people who've bought a share often read good news about it closely and skim past the warning signs.","c":2,"k":"s","ps":false},{"t":"In workplaces, a first impression of a new employee can shape how every later piece of their work is judged.","c":2,"k":"s","ps":false},{"t":"In each case, the fix is the same.","c":2,"k":"s","ps":false},{"t":"Build a moment into the process where someone deliberately asks, what else could explain this?","c":2,"k":"s","ps":false},{"t":"And finally, be a bit gentle with other people.","c":2,"k":"s","ps":true},{"t":"Once you understand confirmation bias, it's tempting to spot it in everyone else.","c":2,"k":"s","ps":false},{"t":"That's actually confirmation bias about confirmation bias.","c":2,"k":"s","ps":false},{"t":"Everyone has it, including you and me.","c":2,"k":"s","ps":false},{"t":"The goal isn't to win arguments.","c":2,"k":"s","ps":false},{"t":"It's to be a little less wrong over time.","c":2,"k":"s","ps":false},{"t":"Let's recap the three big takeaways.","c":2,"k":"s","ps":true},{"t":"First, confirmation bias affects how we search for evidence, how we interpret it, and what we remember.","c":2,"k":"s","ps":false},{"t":"Second, just trying to be fair isn't enough, but asking yourself to consider the opposite really helps.","c":2,"k":"s","ps":false},{"t":"Third, the most useful evidence is the kind that could prove you wrong, so go looking for it on purpose, the way Darwin did.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In Peter Wason's puzzle, the example sequence was two, four, six. What was the actual rule?","c":3,"k":"q","ps":false},{"t":"Answer. Any three numbers in ascending order.","c":3,"k":"a","ps":false},{"t":"Question two. In the Stanford death penalty study, what happened after both sides read the same mixed evidence?","c":3,"k":"q","ps":false},{"t":"Answer. Both sides became more convinced of their original views.","c":3,"k":"a","ps":false},{"t":"Question three. What simple instruction reduced bias better than being told to be objective?","c":3,"k":"q","ps":false},{"t":"Answer. Consider the opposite. Ask how you'd judge the evidence if it had found the reverse result.","c":3,"k":"a","ps":false},{"t":"That's the end of Confirmation Bias. Nicely done.","c":3,"k":"end","ps":false}],"at":{"f":[0.3,2.52,5.54,8.36,12.17,14.45,15.71,17.76,24.24,25.6,28.71,29.95,32.59,34.01,37.4,40.75,43.59,44.98,47.99,49.5,51.8,57.03,64.36,67.41,69.83,74.34,80.5,86.81,88.15,93.53,95.29,99.42,104.04,105.71,115.06,121.06,122.63,129.43,131.19,136.69,148.71,151.63,153.68,155.51,158.35,161.16,166.04,169.29,176.6,178.36,179.82,187.32,191.97,195.08,199.72,201.88,206.92,210.03,212.77,214.51,215.87,217.28,219.44,223.27,226.13,228.28,233.49,237.21,245.07,247.45,251.04,253.94,261.01,266.38,274.94,277.64,281.04,282.79,285.01,287.52,288.88,293.75,295.85,302.32,306.61,309.11,312.24,314.16,317.66,319.05,322.82,326.37,336.39,341.95,345.4,350.32,353.5,356.0,358.36,362.13,364.97,367.55,369.94,372.05,377.15,382.27,384.63,387.79,395.79,398.62,400.55,402.86,405.15,411.16,412.95,414.33,420.66,423.37,428.43,434.02,439.57,441.01,445.29,447.87,451.34,457.73,460.68,464.53,466.18,467.64,474.03,479.84,484.12,487.66,492.87,497.57,499.65,505.19,507.88,511.94,519.2,526.29,530.35,533.62,537.2,541.07,542.86,550.11,554.0,558.39,564.7,571.5,578.12,580.27,585.72,588.42,593.24,596.93,599.14,601.07,603.49,605.75,612.04,617.85,625.97,629.7,642.34,645.97,658.59,663.61,675.03,681.9],"m":[0.3,2.68,5.92,9.31,13.39,15.8,17.12,19.36,26.37,27.89,31.16,32.42,35.33,36.77,40.55,44.21,47.25,48.71,51.98,53.5,56.01,61.79,69.83,73.23,76.03,80.88,87.51,94.16,95.57,101.71,103.68,107.94,112.82,114.64,124.68,131.2,132.87,140.26,142.14,148.19,161.28,164.48,166.77,168.8,171.9,174.99,180.43,184.02,192.09,194.02,195.65,204.17,209.14,212.61,217.9,220.44,225.9,229.15,232.12,233.97,235.44,236.98,239.36,243.7,246.7,249.08,254.76,258.84,267.84,270.35,274.22,277.45,285.24,291.25,300.63,303.52,307.44,309.37,311.71,314.49,315.97,321.26,323.5,330.56,335.2,337.93,341.44,343.48,347.43,348.97,352.95,356.93,367.96,374.0,377.96,383.2,386.72,389.57,391.89,395.91,399.18,401.93,404.52,406.8,412.72,418.56,421.2,424.66,433.52,436.7,438.8,441.35,444.04,450.64,452.5,454.04,461.0,463.78,469.34,475.27,481.16,482.73,487.49,490.37,494.14,501.31,504.65,508.74,510.42,512.03,518.99,525.38,529.95,533.88,539.62,544.84,547.2,553.45,556.46,560.93,569.24,576.66,581.15,584.84,588.8,593.17,595.15,603.05,607.48,612.42,619.43,626.77,633.81,636.07,642.06,645.05,650.44,654.67,657.14,659.37,662.19,664.66,671.47,677.72,686.74,690.87,703.97,707.83,721.09,726.47,738.44,745.72]},"dur":{"f":685.6,"m":749.8}},"dunbar":{"chapters":["The number one fifty","Circles within circles","What it means for you"],"units":[{"t":"How Many Friends Can You Really Have?.","c":-1,"k":"title","ps":false},{"t":"Part one. The number one fifty.","c":0,"k":"head","ps":false},{"t":"Think about everyone you know well enough that, if you bumped into them at an airport at two in the morning, you wouldn't feel awkward joining them for a coffee.","c":0,"k":"s","ps":true},{"t":"Not your closest friends.","c":0,"k":"s","ps":false},{"t":"Not strangers. Just people you have a real, personal connection with.","c":0,"k":"s","ps":false},{"t":"How many would that be?","c":0,"k":"s","ps":false},{"t":"Twenty? A hundred?","c":0,"k":"s","ps":false},{"t":"A thousand?","c":0,"k":"s","ps":false},{"t":"In the early 1990s, a British researcher named Robin Dunbar came up with a surprisingly precise answer.","c":0,"k":"s","ps":true},{"t":"Dunbar is an anthropologist and evolutionary psychologist, and he spent much of his career at the University of Oxford.","c":0,"k":"s","ps":false},{"t":"He wasn't studying people at first.","c":0,"k":"s","ps":false},{"t":"He was studying monkeys and apes.","c":0,"k":"s","ps":false},{"t":"Dunbar noticed something about primates.","c":0,"k":"s","ps":true},{"t":"Species that live in bigger social groups tend to have a bigger neocortex, the wrinkly outer layer of the brain that handles complex thinking.","c":0,"k":"s","ps":false},{"t":"That made sense to him.","c":0,"k":"s","ps":false},{"t":"Keeping track of lots of relationships is hard mental work.","c":0,"k":"s","ps":false},{"t":"You need to remember who's friends with whom, who owes whom a favour, and who fell out with whom last week.","c":0,"k":"s","ps":false},{"t":"So Dunbar asked a simple question.","c":0,"k":"s","ps":true},{"t":"If we know the size of the human neocortex, what group size would the pattern predict for us?","c":0,"k":"s","ps":false},{"t":"The answer came out at roughly one hundred and fifty.","c":0,"k":"s","ps":false},{"t":"That figure is now known as Dunbar's number.","c":0,"k":"s","ps":false},{"t":"Here's the key point.","c":0,"k":"s","ps":true},{"t":"Dunbar wasn't saying you can only know one hundred and fifty names.","c":0,"k":"s","ps":false},{"t":"You probably recognise thousands of faces.","c":0,"k":"s","ps":false},{"t":"He was talking about meaningful relationships.","c":0,"k":"s","ps":false},{"t":"People you know as individuals, where you understand how they fit into your life and how they relate to each other.","c":0,"k":"s","ps":false},{"t":"Then he went looking for that number in the real world, and he kept finding something close to it.","c":0,"k":"s","ps":true},{"t":"Estimates for the size of early farming villages came out around there.","c":0,"k":"s","ps":false},{"t":"So did Hutterite communities, the religious farming groups in North America, which traditionally split into two once they grow much beyond that size.","c":0,"k":"s","ps":false},{"t":"Military companies across many armies tend to sit somewhere between about one hundred and two hundred people.","c":0,"k":"s","ps":false},{"t":"One of the most charming tests involved Christmas cards.","c":0,"k":"s","ps":true},{"t":"In a study with Russell Hill, Dunbar looked at who British households sent Christmas cards to.","c":0,"k":"s","ps":false},{"t":"The total number of people in those card networks averaged out at about one hundred and fifty.","c":0,"k":"s","ps":false},{"t":"So is one fifty a hard limit?","c":0,"k":"s","ps":true},{"t":"Not quite. And the more interesting story is what happens inside that number, which is where we're heading next.","c":0,"k":"s","ps":false},{"t":"Part two. Circles within circles.","c":1,"k":"head","ps":false},{"t":"Picture your social world as a set of rings, like the ripples when you drop a stone into a pond.","c":1,"k":"s","ps":true},{"t":"According to Dunbar's research, those rings have fairly predictable sizes.","c":1,"k":"s","ps":false},{"t":"Right at the centre, there are about five people.","c":1,"k":"s","ps":true},{"t":"These are the ones you'd call at three in the morning if something went badly wrong.","c":1,"k":"s","ps":false},{"t":"Partners, family members, your very closest friends.","c":1,"k":"s","ps":false},{"t":"Dunbar calls this the support clique.","c":1,"k":"s","ps":false},{"t":"The next ring holds about fifteen people in total, including those first five.","c":1,"k":"s","ps":true},{"t":"These are good friends.","c":1,"k":"s","ps":false},{"t":"People whose death would genuinely devastate you.","c":1,"k":"s","ps":false},{"t":"Then comes a ring of about fifty.","c":1,"k":"s","ps":false},{"t":"Think of them as the friends you'd invite to a big party or a barbecue.","c":1,"k":"s","ps":false},{"t":"After that comes the famous one hundred and fifty, the people you'd invite to a wedding or a big milestone birthday.","c":1,"k":"s","ps":false},{"t":"Notice the pattern.","c":1,"k":"s","ps":true},{"t":"Each ring is roughly three times the size of the one inside it.","c":1,"k":"s","ps":false},{"t":"Five, fifteen, fifty, one fifty.","c":1,"k":"s","ps":false},{"t":"The pattern even seems to continue outward, to about five hundred acquaintances and about fifteen hundred faces you can put a name to.","c":1,"k":"s","ps":false},{"t":"Why would our social lives be built like this?","c":1,"k":"s","ps":true},{"t":"A big part of the answer is time.","c":1,"k":"s","ps":false},{"t":"Friendship is expensive.","c":1,"k":"s","ps":false},{"t":"In one study, Dunbar and his colleagues found that people spend about forty per cent of their social time on those five closest people.","c":1,"k":"s","ps":false},{"t":"Another twenty per cent or so goes to the next ten.","c":1,"k":"s","ps":false},{"t":"That leaves surprisingly little for everyone else.","c":1,"k":"s","ps":false},{"t":"And friendships need that time to survive.","c":1,"k":"s","ps":true},{"t":"Dunbar's work suggests that if you stop seeing a friend, the emotional closeness starts to fade within months.","c":1,"k":"s","ps":false},{"t":"Family ties are more forgiving.","c":1,"k":"s","ps":false},{"t":"A cousin you rarely see is still a cousin.","c":1,"k":"s","ps":false},{"t":"Friendships, on the other hand, run on contact.","c":1,"k":"s","ps":false},{"t":"This also explains something many people notice in their own lives.","c":1,"k":"s","ps":true},{"t":"When someone starts a new romantic relationship, they often drift from a friend or two.","c":1,"k":"s","ps":false},{"t":"The new partner takes up one of those precious inner-circle places, and something else has to give.","c":1,"k":"s","ps":false},{"t":"One of Dunbar's studies suggested the typical cost was about two close friends.","c":1,"k":"s","ps":false},{"t":"So far this all sounds tidy.","c":1,"k":"s","ps":true},{"t":"But science rarely stays tidy for long, and Dunbar's number has had its critics.","c":1,"k":"s","ps":false},{"t":"That's where we'll finish.","c":1,"k":"s","ps":false},{"t":"Part three. What it means for you.","c":2,"k":"head","ps":false},{"t":"In 2021, a team at Stockholm University, led by Patrik Lindenfors, took another look at the primate brain data using newer statistical methods.","c":2,"k":"s","ps":true},{"t":"Their conclusion was blunt.","c":2,"k":"s","ps":false},{"t":"Depending on how you analyse the data, the predicted human group size could be almost anything, from a handful of people to several hundred.","c":2,"k":"s","ps":false},{"t":"In their view, you simply can't pin it to one hundred and fifty.","c":2,"k":"s","ps":false},{"t":"Dunbar and his supporters pushed back, pointing to the many real-world groups that cluster around that size.","c":2,"k":"s","ps":true},{"t":"The debate is still going.","c":2,"k":"s","ps":false},{"t":"So here's a fair way to hold it.","c":2,"k":"s","ps":false},{"t":"The exact number is contested.","c":2,"k":"s","ps":false},{"t":"The broader idea, that our close relationships are limited and come in layers, is widely accepted.","c":2,"k":"s","ps":false},{"t":"So what can you actually do with this?","c":2,"k":"s","ps":true},{"t":"Here are three practical ideas.","c":2,"k":"s","ps":false},{"t":"First, protect your inner five.","c":2,"k":"s","ps":true},{"t":"They get the largest share of your social time, and for good reason.","c":2,"k":"s","ps":false},{"t":"They're the people who carry you through hard times.","c":2,"k":"s","ps":false},{"t":"If one of those relationships has gone quiet lately, a phone call on your next drive might be the best use of ten minutes you'll have all week.","c":2,"k":"s","ps":false},{"t":"Second, remember that friendship takes time to build, not just to keep.","c":2,"k":"s","ps":true},{"t":"A researcher called Jeffrey Hall, at the University of Kansas, estimated how long it takes to turn an acquaintance into a friend.","c":2,"k":"s","ps":false},{"t":"His figures were roughly fifty hours together to become casual friends, around ninety hours to become real friends, and more than two hundred hours to become close friends.","c":2,"k":"s","ps":false},{"t":"That's why friendships formed at school, university or a new job feel so strong.","c":2,"k":"s","ps":false},{"t":"You were simply spending hours together without trying.","c":2,"k":"s","ps":false},{"t":"Third, don't feel guilty about the outer rings.","c":2,"k":"s","ps":true},{"t":"Nobody can be close to everyone.","c":2,"k":"s","ps":false},{"t":"Having a wider circle of friendly acquaintances is healthy and useful, and it's perfectly normal that you don't keep up with all of them.","c":2,"k":"s","ps":false},{"t":"Let's recap. Robin Dunbar suggested that humans can maintain around one hundred and fifty meaningful relationships.","c":2,"k":"s","ps":true},{"t":"Inside that number are layers of roughly five, fifteen and fifty, each about three times the size of the last.","c":2,"k":"s","ps":false},{"t":"The exact figure is debated, but the lesson holds.","c":2,"k":"s","ps":false},{"t":"Your time is limited, and where you spend it decides who stays close.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. Roughly how many meaningful relationships does Dunbar's number suggest we can maintain?","c":3,"k":"q","ps":false},{"t":"Answer. About one hundred and fifty.","c":3,"k":"a","ps":false},{"t":"Question two. About how many people sit in the innermost support circle?","c":3,"k":"q","ps":false},{"t":"Answer. Around five.","c":3,"k":"a","ps":false},{"t":"Question three. According to Jeffrey Hall, roughly how many hours together does it take to become close friends?","c":3,"k":"q","ps":false},{"t":"Answer. More than two hundred hours.","c":3,"k":"a","ps":false},{"t":"That's the end of How Many Friends Can You Really Have? Nicely done.","c":3,"k":"end","ps":false}],"at":{"f":[0.3,3.05,5.81,13.97,15.52,19.73,21.05,22.47,23.83,30.75,38.49,40.52,42.82,44.87,53.78,55.13,58.97,65.02,67.18,72.52,75.49,78.43,79.77,83.53,86.22,88.83,95.59,100.52,104.53,113.11,119.83,123.0,128.26,133.85,135.85,143.05,146.0,151.44,156.33,158.99,163.27,166.43,168.89,173.45,174.79,177.55,179.51,183.62,190.96,192.25,196.03,198.33,206.66,209.11,211.03,212.72,221.01,224.06,226.97,229.25,235.64,237.59,239.89,243.11,246.97,251.95,257.38,262.56,264.32,269.12,271.41,274.03,284.52,286.19,294.55,298.22,304.46,306.01,307.89,309.85,316.25,318.24,320.67,322.55,326.19,328.75,337.08,341.19,348.77,358.72,363.83,366.96,369.54,371.53,379.74,387.16,394.0,397.23,402.04,405.77,417.69,420.91,430.83,433.47,445.57,448.68],"m":[0.3,3.23,6.03,15.24,17.04,21.69,23.14,24.63,26.11,33.61,42.19,44.36,46.84,49.34,59.19,60.68,64.9,71.82,74.28,80.43,83.73,87.0,88.42,92.7,95.62,98.66,106.28,111.65,116.18,125.7,133.01,136.44,142.38,148.64,150.78,158.83,161.85,167.99,173.58,176.44,181.32,184.82,187.57,192.73,194.3,197.18,199.31,203.99,211.87,213.21,217.34,219.67,228.92,231.61,233.76,235.54,244.33,247.82,251.12,253.7,260.66,262.84,265.35,268.85,273.0,278.55,284.56,290.21,292.24,297.55,299.9,302.67,314.33,316.13,325.34,329.39,336.32,338.0,339.99,342.1,349.08,351.31,353.93,355.86,360.08,362.93,372.08,376.55,384.94,396.14,401.8,405.25,408.19,410.36,419.5,427.53,435.35,438.86,444.15,448.28,460.71,464.14,474.47,477.06,489.83,493.21]},"dur":{"f":452.9,"m":497.9}},"spotlight":{"chapters":["The shirt experiment","The illusion of transparency","The liking gap"],"units":[{"t":"The Spotlight Effect.","c":-1,"k":"title","ps":false},{"t":"Part one. The shirt experiment.","c":0,"k":"head","ps":false},{"t":"Picture this. You walk into a room full of people, and you're wearing a T-shirt with a large, slightly embarrassing face printed on the front.","c":0,"k":"s","ps":true},{"t":"Your cheeks go warm.","c":0,"k":"s","ps":false},{"t":"You're certain every single person has noticed.","c":0,"k":"s","ps":false},{"t":"Now here's the question this lesson is built around.","c":0,"k":"s","ps":false},{"t":"How many of them actually did?","c":0,"k":"s","ps":false},{"t":"In the late 1990s, the psychologist Thomas Gilovich and his colleagues at Cornell University decided to find out.","c":0,"k":"s","ps":true},{"t":"They asked university students to put on a T-shirt showing the singer Barry Manilow.","c":0,"k":"s","ps":false},{"t":"At the time, for a college student, this was about the least cool shirt imaginable.","c":0,"k":"s","ps":false},{"t":"Each student then walked into a room where other students were already sitting and filling in questionnaires.","c":0,"k":"s","ps":false},{"t":"They stayed a short while, then were led back out.","c":0,"k":"s","ps":false},{"t":"Afterwards the researchers asked the shirt-wearers a simple question.","c":0,"k":"s","ps":true},{"t":"How many of the people in that room do you think noticed who was on your shirt?","c":0,"k":"s","ps":false},{"t":"The wearers guessed around half.","c":0,"k":"s","ps":false},{"t":"Then the researchers asked the people in the room.","c":0,"k":"s","ps":false},{"t":"The real figure was closer to a quarter.","c":0,"k":"s","ps":false},{"t":"The wearers had roughly doubled the attention they were getting.","c":0,"k":"s","ps":false},{"t":"Gilovich and his co-authors, Victoria Medvec and Kenneth Savitsky, gave this a name.","c":0,"k":"s","ps":true},{"t":"They called it the spotlight effect.","c":0,"k":"s","ps":false},{"t":"It's the tendency to overestimate how much other people notice our appearance and our behaviour.","c":0,"k":"s","ps":false},{"t":"We feel as though a spotlight follows us around.","c":0,"k":"s","ps":false},{"t":"In reality, the light is much dimmer, and it's pointed at lots of other people too.","c":0,"k":"s","ps":false},{"t":"Why does this happen?","c":0,"k":"s","ps":true},{"t":"The main reason is surprisingly simple.","c":0,"k":"s","ps":false},{"t":"You are the centre of your own experience.","c":0,"k":"s","ps":false},{"t":"You've been living inside your own head all day.","c":0,"k":"s","ps":false},{"t":"You know exactly what you're wearing, what you said in that meeting, and the spot on your chin you noticed in the mirror this morning.","c":0,"k":"s","ps":false},{"t":"All of that information is loud and vivid to you.","c":0,"k":"s","ps":false},{"t":"So when you imagine how others see you, you start from your own view, and then you adjust.","c":0,"k":"s","ps":false},{"t":"The trouble is, we don't adjust nearly enough.","c":0,"k":"s","ps":false},{"t":"Psychologists call this anchoring and adjustment.","c":0,"k":"s","ps":false},{"t":"Your own perspective is the anchor, and it drags your estimate towards itself.","c":0,"k":"s","ps":false},{"t":"There's a second reason too.","c":0,"k":"s","ps":true},{"t":"Everyone else in that room is also living at the centre of their own experience.","c":0,"k":"s","ps":false},{"t":"They're thinking about their questionnaire, their own shirt, their own plans for lunch.","c":0,"k":"s","ps":false},{"t":"Their attention is already full.","c":0,"k":"s","ps":false},{"t":"You're a small part of their day, not the headline.","c":0,"k":"s","ps":false},{"t":"So that's the first idea to take away.","c":0,"k":"s","ps":true},{"t":"The attention you feel is not the attention you get.","c":0,"k":"s","ps":false},{"t":"In the next part, we'll look at a close cousin of the spotlight effect.","c":0,"k":"s","ps":false},{"t":"It shows up whenever you're nervous, and it may change how you feel about public speaking.","c":0,"k":"s","ps":false},{"t":"Part two. The illusion of transparency.","c":1,"k":"head","ps":false},{"t":"Think about the last time you had to speak in front of a group.","c":1,"k":"s","ps":true},{"t":"Maybe a presentation at work, a toast at a wedding, or even asking a question at a meeting.","c":1,"k":"s","ps":false},{"t":"Your heart was racing.","c":1,"k":"s","ps":false},{"t":"Your hands felt shaky.","c":1,"k":"s","ps":false},{"t":"And you were probably convinced that everyone could see how nervous you were.","c":1,"k":"s","ps":false},{"t":"The same research team studied this feeling too.","c":1,"k":"s","ps":true},{"t":"They called it the illusion of transparency.","c":1,"k":"s","ps":false},{"t":"It's the belief that our inner states, our nerves, our thoughts and our emotions, are much more visible to other people than they actually are.","c":1,"k":"s","ps":false},{"t":"We feel transparent, like a glass jar.","c":1,"k":"s","ps":false},{"t":"We're not.","c":1,"k":"s","ps":false},{"t":"In one set of studies, Gilovich, Savitsky and Medvec had people tell lies while others watched and tried to spot the liars.","c":1,"k":"s","ps":true},{"t":"The people telling the lies consistently overestimated how many observers would catch them.","c":1,"k":"s","ps":false},{"t":"Their guilt felt obvious from the inside.","c":1,"k":"s","ps":false},{"t":"From the outside, it mostly wasn't.","c":1,"k":"s","ps":false},{"t":"Then came the part that's genuinely useful.","c":1,"k":"s","ps":true},{"t":"Kenneth Savitsky and Thomas Gilovich ran a study with people giving short public talks.","c":1,"k":"s","ps":false},{"t":"Some speakers were simply told to relax.","c":1,"k":"s","ps":false},{"t":"Others were told about the illusion of transparency.","c":1,"k":"s","ps":false},{"t":"They heard, in effect, that nerves feel obvious to the speaker but are usually hard for an audience to see.","c":1,"k":"s","ps":false},{"t":"Those informed speakers ended up feeling less anxious.","c":1,"k":"s","ps":false},{"t":"And here's the interesting bit.","c":1,"k":"s","ps":false},{"t":"Observers rated their talks as better too.","c":1,"k":"s","ps":false},{"t":"Why would knowing about the illusion help?","c":1,"k":"s","ps":true},{"t":"Because a lot of performance anxiety feeds on itself.","c":1,"k":"s","ps":false},{"t":"You feel nervous.","c":1,"k":"s","ps":false},{"t":"You believe the audience can see it.","c":1,"k":"s","ps":false},{"t":"That belief makes you more nervous, which you assume they can see even more clearly.","c":1,"k":"s","ps":false},{"t":"It's a loop.","c":1,"k":"s","ps":false},{"t":"Knowing that your nerves are mostly invisible cuts the loop.","c":1,"k":"s","ps":false},{"t":"It takes away the fear of being seen as afraid.","c":1,"k":"s","ps":false},{"t":"Here's a practical way to use this.","c":1,"k":"s","ps":true},{"t":"Next time you're nervous before speaking, try telling yourself something like this.","c":1,"k":"s","ps":false},{"t":"They can't see what I'm feeling.","c":1,"k":"s","ps":false},{"t":"Most of this is happening on the inside.","c":1,"k":"s","ps":false},{"t":"You're not pretending the nerves aren't there.","c":1,"k":"s","ps":false},{"t":"You're just correcting the story about who can see them.","c":1,"k":"s","ps":false},{"t":"One caution. The illusion of transparency doesn't mean nobody ever notices anything.","c":1,"k":"s","ps":true},{"t":"A shaky voice or a flushed face can sometimes be seen.","c":1,"k":"s","ps":false},{"t":"The point is that we tend to exaggerate it.","c":1,"k":"s","ps":false},{"t":"The audience sees a person giving a talk.","c":1,"k":"s","ps":false},{"t":"You feel a person barely holding it together.","c":1,"k":"s","ps":false},{"t":"The gap between those two pictures is usually large.","c":1,"k":"s","ps":false},{"t":"In the final part, we'll flip the whole idea around.","c":1,"k":"s","ps":true},{"t":"If people notice our flaws less than we think, what about the good impressions we make?","c":1,"k":"s","ps":false},{"t":"It turns out we get those wrong as well, and not in the direction you might expect.","c":1,"k":"s","ps":false},{"t":"Part three. The liking gap.","c":2,"k":"head","ps":false},{"t":"Imagine you've just met someone new.","c":2,"k":"s","ps":true},{"t":"Maybe it's a neighbour, or a colleague from another team.","c":2,"k":"s","ps":false},{"t":"You chat for a few minutes.","c":2,"k":"s","ps":false},{"t":"Afterwards, walking away, you replay the conversation.","c":2,"k":"s","ps":false},{"t":"Did I talk too much?","c":2,"k":"s","ps":false},{"t":"Was that joke weird?","c":2,"k":"s","ps":false},{"t":"Did they actually like me?","c":2,"k":"s","ps":false},{"t":"In 2018, a group of researchers led by Erica Boothby, working with colleagues including Gus Cooney and Gillian Sandstrom, studied exactly this moment.","c":2,"k":"s","ps":true},{"t":"They paired up strangers and had them talk.","c":2,"k":"s","ps":false},{"t":"Then they asked each person two things.","c":2,"k":"s","ps":false},{"t":"How much did you like your partner?","c":2,"k":"s","ps":false},{"t":"And how much do you think your partner liked you?","c":2,"k":"s","ps":false},{"t":"The pattern was striking.","c":2,"k":"s","ps":true},{"t":"People consistently underestimated how much their conversation partner liked them.","c":2,"k":"s","ps":false},{"t":"The researchers called this the liking gap.","c":2,"k":"s","ps":false},{"t":"And it wasn't a one-off.","c":2,"k":"s","ps":false},{"t":"It showed up in short chats in the lab, and it showed up in longer conversations.","c":2,"k":"s","ps":false},{"t":"In one study, they followed university students who had just started living together, and the gap lasted for months.","c":2,"k":"s","ps":false},{"t":"Why would this happen?","c":2,"k":"s","ps":true},{"t":"Part of it is the same spotlight at work.","c":2,"k":"s","ps":false},{"t":"After a conversation, we focus on our own awkward moments.","c":2,"k":"s","ps":false},{"t":"The pause that felt too long.","c":2,"k":"s","ps":false},{"t":"The thing we wish we'd said differently.","c":2,"k":"s","ps":false},{"t":"Our partner, meanwhile, was busy worrying about their own awkward moments.","c":2,"k":"s","ps":false},{"t":"They barely registered ours.","c":2,"k":"s","ps":false},{"t":"So we judge ourselves on our worst bits, while they judge us on the overall feel of the chat, which was usually warm.","c":2,"k":"s","ps":false},{"t":"Put all three ideas together and a clear picture forms.","c":2,"k":"s","ps":true},{"t":"We think people notice our embarrassing moments more than they do.","c":2,"k":"s","ps":false},{"t":"That's the spotlight effect.","c":2,"k":"s","ps":false},{"t":"We think people can see our nerves more than they can.","c":2,"k":"s","ps":false},{"t":"That's the illusion of transparency.","c":2,"k":"s","ps":false},{"t":"And we think people like us less than they actually do.","c":2,"k":"s","ps":false},{"t":"That's the liking gap.","c":2,"k":"s","ps":false},{"t":"In each case, the harshest critic is the one inside our own head.","c":2,"k":"s","ps":false},{"t":"So what do you do with this?","c":2,"k":"s","ps":true},{"t":"Here are three small experiments for the week ahead.","c":2,"k":"s","ps":false},{"t":"First, the next time you feel self-conscious about something you're wearing or something you said, ask yourself, how much would I have noticed if someone else did this?","c":2,"k":"s","ps":false},{"t":"Usually the honest answer is, barely at all.","c":2,"k":"s","ps":false},{"t":"Second, before your next presentation or tricky conversation, remind yourself that your nerves are mostly invisible.","c":2,"k":"s","ps":false},{"t":"Third, after you meet someone new, assume they liked you a bit more than you think.","c":2,"k":"s","ps":false},{"t":"The research suggests you'll usually be right.","c":2,"k":"s","ps":false},{"t":"Let's recap. The spotlight effect: we overestimate how much others notice us.","c":2,"k":"s","ps":true},{"t":"The illusion of transparency: we overestimate how visible our feelings are.","c":2,"k":"s","ps":false},{"t":"The liking gap: we underestimate how much people enjoy our company.","c":2,"k":"s","ps":false},{"t":"The spotlight is dimmer than it feels, and that's genuinely good news.","c":2,"k":"s","ps":false},{"t":"Quick recall. Answer out loud, or just in your head.","c":3,"k":"head","ps":false},{"t":"Question one. In the Cornell T-shirt study, wearers guessed about half the room noticed their shirt. Roughly how many actually did?","c":3,"k":"q","ps":false},{"t":"Answer. About a quarter. The wearers roughly doubled the attention they were getting.","c":3,"k":"a","ps":false},{"t":"Question two. What's the name for the belief that other people can see our nerves and emotions more clearly than they really can?","c":3,"k":"q","ps":false},{"t":"Answer. The illusion of transparency.","c":3,"k":"a","ps":false},{"t":"Question three. After meeting someone new, do people tend to overestimate or underestimate how much the other person liked them?","c":3,"k":"q","ps":false},{"t":"Answer. Underestimate. That's the liking gap.","c":3,"k":"a","ps":false},{"t":"That's the end of The Spotlight Effect. Nicely done.","c":3,"k":"end","ps":false}],"at":{"f":[0.3,2.4,5.08,13.26,14.66,17.39,20.45,22.71,30.43,35.06,39.77,45.54,48.61,52.54,56.71,58.38,60.86,63.24,66.76,72.3,74.23,79.97,82.63,87.8,89.16,91.57,93.83,96.2,102.96,105.89,110.71,113.32,116.14,120.83,122.41,127.01,131.54,133.42,136.36,138.61,141.64,145.34,151.04,154.31,157.22,162.76,164.21,165.72,170.19,172.75,175.2,183.19,185.66,186.93,194.41,200.1,202.38,204.91,207.36,213.14,215.69,218.56,224.91,228.15,229.87,232.62,234.7,237.96,239.14,241.12,245.54,246.47,249.68,252.51,254.55,258.94,260.48,262.93,265.0,268.17,273.63,276.93,279.44,281.83,284.31,287.78,290.8,295.39,300.97,303.46,305.42,308.34,309.82,313.14,314.5,315.87,317.79,328.22,330.63,332.7,334.53,337.19,338.6,343.81,346.19,347.58,352.3,359.37,360.66,363.09,366.8,368.36,370.26,374.69,376.45,383.35,386.65,390.19,391.73,394.54,396.59,399.66,401.03,405.35,406.82,409.51,418.41,421.19,428.16,432.51,435.24,440.16,444.92,449.11,453.88,457.61,471.33,476.99,490.2,493.6,507.32,511.22],"m":[0.3,2.57,5.34,14.34,15.87,18.9,22.32,24.74,33.08,38.18,43.5,49.68,53.05,57.14,61.75,63.63,66.34,68.95,72.72,78.78,80.94,87. 4,145.79,148.02,149.66,154.07,159.05,162.01,165.57,167.95,171.89,173.47,175.98,181.27,184.7,187.13,194.85,199.77,205.31,207.98,216.97,218.79,223.89,226.05,232.58,240.91,243.8,245.69,256.13,259.93,264.28,273.17,275.93,283.57,292.34,294.82,298.1,303.46,305.76,315.93,319.97,324.78,327.54,330.99,333.96,335.73,339.06,343.08,346.21,360.48,364.43,368.09,371.58,373.43,378.04,381.39,383.87,386.03,390.45,394.21,396.32,402.96,412.3,414.94,423.66,429.22,433.5,438.52,442.14,444.25,453.18,455.72,458.33,466.98,470.02,478.09,482.53,489.0,495.13,503.55,505.5,508.26,510.06,516.77,518.14,526.91,529.42,540.52,544.6,555.46,560.34,570.74,573.73,585.25,589.17]},"dur":{"f":542.6,"m":595.3},"units":[{"t":"Training Your Attention.","c":-1,"k":"title","ps":false},{"t":"Part one. Where your mind goes.","c":0,"k":"head","ps":false},{"t":"Let's start with a quick question.","c":0,"k":"s","ps":true},{"t":"Over the last minute or so, before this lesson began, where was your mind?","c":0,"k":"s","ps":false},{"t":"Was it on the road, the footpath, the thing in front of you?","c":0,"k":"s","ps":false},{"t":"Or was it somewhere else entirely, replaying a conversation or planning tonight's dinner?","c":0,"k":"s","ps":false},{"t":"If it was somewhere else, you're in very good company.","c":0,"k":"s","ps":true},{"t":"In 2010, two Harvard psychologists, Matthew Killingsworth and Daniel Gilbert, ran one of the biggest studies of everyday attention ever done.","c":0,"k":"s","ps":false},{"t":"They built an iPhone app that pinged people at random moments through the day.","c":0,"k":"s","ps":false},{"t":"Each time, it asked three things.","c":0,"k":"s","ps":false},{"t":"What are you doing right now?","c":0,"k":"s","ps":false},{"t":"Are you thinking about something other than what you're doing?","c":0,"k":"s","ps":false},{"t":"And how happy do you feel?","c":0,"k":"s","ps":false},{"t":"More than two thousand adults took part, and the answers added up to a quarter of a million moments.","c":0,"k":"s","ps":true},{"t":"The headline result was striking.","c":0,"k":"s","ps":false},{"t":"People's minds were wandering about forty-seven per cent of the time.","c":0,"k":"s","ps":false},{"t":"Nearly half of waking life, spent somewhere other than where they actually were.","c":0,"k":"s","ps":false},{"t":"The only activity where minds wandered noticeably less often was making love.","c":0,"k":"s","ps":false},{"t":"The second finding was even more interesting.","c":0,"k":"s","ps":true},{"t":"People were generally less happy when their minds were wandering, even when they drifted to pleasant things.","c":0,"k":"s","ps":false},{"t":"The researchers summed it up in the title of their paper.","c":0,"k":"s","ps":false},{"t":"A wandering mind is an unhappy mind.","c":0,"k":"s","ps":false},{"t":"Now, that doesn't mean daydreaming is bad.","c":0,"k":"s","ps":false},{"t":"Mind wandering helps us plan, imagine and solve problems in the background.","c":0,"k":"s","ps":false},{"t":"The point is that it happens far more than we realise, and usually without our permission.","c":0,"k":"s","ps":false},{"t":"So why does attention drift so easily?","c":0,"k":"s","ps":true},{"t":"One helpful way to think about it is that your attention has two bosses.","c":0,"k":"s","ps":false},{"t":"One is you, deciding what to focus on.","c":0,"k":"s","ps":false},{"t":"The other is your brain's built-in alarm system, which constantly scans for anything new, moving or loud.","c":0,"k":"s","ps":false},{"t":"For our ancestors, a rustle in the grass might have been a predator, so the alarm system usually wins.","c":0,"k":"s","ps":false},{"t":"A phone buzzing in your pocket sets off exactly the same machinery.","c":0,"k":"s","ps":false},{"t":"There's also a simple matter of fuel.","c":0,"k":"s","ps":true},{"t":"Holding focus on one thing takes steady effort, and the effort gets harder the longer you go without a break.","c":0,"k":"s","ps":false},{"t":"Drift isn't a character flaw.","c":0,"k":"s","ps":false},{"t":"It's the default setting.","c":0,"k":"s","ps":false},{"t":"The good news is that defaults can be nudged, and that's where we're heading.","c":0,"k":"s","ps":false},{"t":"But first, let's deal with the most popular myth about attention.","c":0,"k":"s","ps":false},{"t":"Part two. The multitasking myth.","c":1,"k":"head","ps":false},{"t":"Plenty of us are proud of being good multitaskers.","c":1,"k":"s","ps":true},{"t":"Answering emails during a meeting.","c":1,"k":"s","ps":false},{"t":"Scrolling through the news while the kids tell us about their day.","c":1,"k":"s","ps":false},{"t":"It feels efficient.","c":1,"k":"s","ps":false},{"t":"The research says something different.","c":1,"k":"s","ps":false},{"t":"For most tasks that need thinking, the brain doesn't really do two things at once.","c":1,"k":"s","ps":true},{"t":"It switches back and forth between them, very quickly.","c":1,"k":"s","ps":false},{"t":"And every switch has a small cost.","c":1,"k":"s","ps":false},{"t":"In 2001, the psychologists Joshua Rubinstein, David Meyer and Jeffrey Evans measured this.","c":1,"k":"s","ps":false},{"t":"They had people flip between different kinds of tasks and timed them carefully.","c":1,"k":"s","ps":false},{"t":"Every switch cost time, and the costs grew as the tasks got more complicated.","c":1,"k":"s","ps":false},{"t":"Each cost might be a fraction of a second.","c":1,"k":"s","ps":false},{"t":"But David Meyer has suggested that across a busy day, switching can eat up as much as forty per cent of someone's productive time.","c":1,"k":"s","ps":false},{"t":"There's a hidden cost too.","c":1,"k":"s","ps":true},{"t":"A business researcher called Sophie Leroy gave it a name in 2009.","c":1,"k":"s","ps":false},{"t":"She called it attention residue.","c":1,"k":"s","ps":false},{"t":"When you leave one task unfinished and jump to another, part of your mind stays stuck on the first one.","c":1,"k":"s","ps":false},{"t":"You're physically on task two, but a slice of your attention is still back on task one, which makes you worse at both.","c":1,"k":"s","ps":false},{"t":"What about people who multitask all the time?","c":1,"k":"s","ps":true},{"t":"Surely they get good at it.","c":1,"k":"s","ps":false},{"t":"In 2009, a team at Stanford University led by Eyal Ophir, working with Clifford Nass and Anthony Wagner, tested exactly that.","c":1,"k":"s","ps":false},{"t":"They compared heavy media multitaskers with light ones.","c":1,"k":"s","ps":false},{"t":"The heavy multitaskers were worse at ignoring distractions.","c":1,"k":"s","ps":false},{"t":"And to the researchers' surprise, they were also worse at switching between tasks, the very skill you'd expect them to have practised.","c":1,"k":"s","ps":false},{"t":"This matters most of all behind the wheel.","c":1,"k":"s","ps":true},{"t":"The psychologist David Strayer, at the University of Utah, has spent years studying drivers on the phone.","c":1,"k":"s","ps":false},{"t":"One of his most important findings is that hands-free calls are not much safer than holding the phone, as far as distraction goes.","c":1,"k":"s","ps":false},{"t":"The problem isn't mainly your hands.","c":1,"k":"s","ps":false},{"t":"It's your attention being pulled into the conversation.","c":1,"k":"s","ps":false},{"t":"That's worth remembering next time a tricky call comes in on the drive home.","c":1,"k":"s","ps":false},{"t":"Our screens make all this harder.","c":1,"k":"s","ps":true},{"t":"Gloria Mark, a researcher at the University of California, Irvine, has timed how long office workers stay on one screen before switching.","c":1,"k":"s","ps":false},{"t":"Back in 2004, it was about two and a half minutes.","c":1,"k":"s","ps":false},{"t":"In her more recent studies, the average was around forty-seven seconds.","c":1,"k":"s","ps":false},{"t":"We're not just being interrupted by others.","c":1,"k":"s","ps":false},{"t":"More and more, we interrupt ourselves.","c":1,"k":"s","ps":false},{"t":"Part three. Small habits that help.","c":2,"k":"head","ps":false},{"t":"So what actually helps?","c":2,"k":"s","ps":true},{"t":"The first habit is to single-task on purpose.","c":2,"k":"s","ps":false},{"t":"Pick one thing and give it a short, protected block of time.","c":2,"k":"s","ps":false},{"t":"Twenty-five minutes works well for many people.","c":2,"k":"s","ps":false},{"t":"That's the idea behind the Pomodoro technique, created by an Italian university student called Francesco Cirillo in the late 1980s, and named after his tomato-shaped kitchen timer.","c":2,"k":"s","ps":false},{"t":"When the block ends, take a short break, then go again.","c":2,"k":"s","ps":false},{"t":"The second habit is to move temptation out of reach.","c":2,"k":"s","ps":true},{"t":"Distractions win most easily when they cost nothing.","c":2,"k":"s","ps":false},{"t":"So add a little friction.","c":2,"k":"s","ps":false},{"t":"Put your phone in another room, or at least face down and on silent.","c":2,"k":"s","ps":false},{"t":"Turn off the notifications you don't truly need.","c":2,"k":"s","ps":false},{"t":"Close the email tab while you write.","c":2,"k":"s","ps":false},{"t":"You're not relying on willpower.","c":2,"k":"s","ps":false},{"t":"You're changing the setting so willpower isn't needed as often.","c":2,"k":"s","ps":false},{"t":"The third habit is to finish cleanly before you switch.","c":2,"k":"s","ps":true},{"t":"Remember attention residue.","c":2,"k":"s","ps":false},{"t":"If you have to leave a task, take ten seconds to note exactly where you're up to and what the next step is.","c":2,"k":"s","ps":false},{"t":"Sophie Leroy's later research found that a quick plan like this helps your mind let go, so you can give the next thing your full attention.","c":2,"k":"s","ps":false},{"t":"A close cousin of this habit is batching.","c":2,"k":"s","ps":true},{"t":"Instead of answering every message the moment it lands, check them at set times, say once an hour, or at the top of each hour.","c":2,"k":"s","ps":false},{"t":"Each check becomes one
