const savedBytes = () => Object.values(DL.sizes).reduce((a,b)=>a+b, 0);
const fmtMB = b => b >= 1e9 ? (b/1e9).toFixed(1)+" GB" : Math.round(b/1e6)+" MB";
// Rough size: recordings run at about 56 kbps.
const estBytes = (id, v=S.voice) => AUDIO[id].dur[v] * 2000;

// Best source for a lesson: a saved local copy when there is one, otherwise stream it.
async function resolveSrc(id, v){
  const s = DL.saved[dkey(id, v)];
  if (typeof s === "string") return s;
  if (s === true){
    try{ const r = await (await caches.open(CACHE)).match(absUrl(id, v)); if (r) return URL.createObjectURL(await r.blob()); }catch(e){}
  }
  return srcFor(id, v);
}

function unitAt(id, v, t){
  const at = AUDIO[id].at[v]; let lo=0, hi=at.length-1, r=0;
  while (lo<=hi){ const mid=(lo+hi)>>1; if (at[mid] <= t+0.05){ r=mid; lo=mid+1; } else hi=mid-1; }
  return r;
}
function chapterStarts(id, v){
  const A = AUDIO[id]; const out=[];
  A.units.forEach((u,i)=>{ if (u.k==="head" && out.length===u.c) out.push(A.at[v][i]); });
  return out; // last one is the recall section when present
}
function curUnit(){ return S.cur ? unitAt(S.cur, S.voice, au.currentTime||0) : 0; }
function curChapter(){ if(!S.cur) return 0; return Math.max(0, AUDIO[S.cur].units[curUnit()].c); }

function load(id, startAt, autoplay){
  S.cur = id; store.set("cur",id);
  S.loading = true; setStatus("Loading…");
  const seekTo = startAt||0;
  const token = (load.token = (load.token||0) + 1);
  const go = src => {
    if (token !== load.token) return;   // a newer lesson was picked meanwhile
    if (au.src && au.src.startsWith("blob:")) { try{ URL.revokeObjectURL(au.src); }catch(e){} }
    au.src = src;
    au.playbackRate = S.rate;
    const onMeta = () => { au.removeEventListener("loadedmetadata", onMeta); try{ au.currentTime = seekTo; }catch(e){} au.playbackRate = S.rate; };
    au.addEventListener("loadedmetadata", onMeta);
    if (autoplay) playNow();
  };
  const local = DL.saved[dkey(id, S.voice)];
  if (local === true) resolveSrc(id, S.voice).then(go);   // browser cache copy
  else go(typeof local === "string" ? local : srcFor(id, S.voice));
  setMediaSession();
  renderAll();
}
function playNow(){
  const p = au.play();
  if (p && p.catch) p.catch(err=>{ if (err && err.name==="NotAllowedError"){ S.playing=false; setStatus("Tap play to start."); renderAll(); } });
}
// If the direct file can't be streamed, fall back to downloading it whole.
au.addEventListener("error", async ()=>{
  const offlineMsg = () => setStatus(navigator.onLine === false && !isSaved(S.cur) ? "You're offline and this lesson isn't downloaded." : "This recording couldn't be loaded. Check your connection and try again.");
  if (!S.cur || !au.src || au.src.startsWith("blob:") || !au.src.includes(CONFIG.audioBase.replace(/^\.?\//,""))) { if (S.cur){ S.loading=false; offlineMsg(); } return; }
  if (navigator.onLine === false){ S.loading=false; offlineMsg(); return; }
  const key = S.cur+S.voice; if (blobTried[key]) return; blobTried[key]=true;
  try{
    const t = S.pos[S.cur]?.t || 0;
    const r = await fetch(srcFor(S.cur,S.voice)); if (!r.ok) throw 0;
    const url = URL.createObjectURL(await r.blob());
    au.src = url; au.addEventListener("loadedmetadata", ()=>{ try{au.currentTime=t;}catch(e){} }, {once:true});
    if (S.playing) playNow();
  }catch(e){ S.loading=false; offlineMsg(); }
});

function startLesson(id, fromQueue){
  if (!ready(id)) return;
  if (!fromQueue) S.queue = S.queue.filter(q=>q!==id);
  if (S.cur===id && au.src){ if (au.paused){ S.playing=true; playNow(); } return; }
  const p = S.pos[id];
  let t = 0;
  if (p){ t = Math.max(0, AUDIO[id].at[S.voice][Math.max(0,p.u)] - 0.2); }
  S.playing = true; requestWake();
  load(id, t, true);
}
function togglePlay(){
  if (!S.cur) return;
  if (!au.src || !au.src.includes(S.cur) && !au.src.startsWith("blob:")){ startLesson(S.cur); return; }
  if (au.paused){ S.playing=true; requestWake(); playNow(); } else { au.pause(); }
}
function seekTo(t){ if (!S.cur) return; const d = au.duration || AUDIO[S.cur].dur[S.voice]; au.currentTime = Math.max(0, Math.min(d-0.3, t)); updateLive(); }
function skip(s){ seekTo((au.currentTime||0)+s); }
function nextChapter(){ if (!S.cur) return; const cs = chapterStarts(S.cur,S.voice); const t=au.currentTime; const n = cs.find(x=>x>t+0.5); if (n!=null) seekTo(n); else if (S.queue.length) finishLesson(); else toast("This is the last part of the lesson."); }
function prevChapter(){ if (!S.cur) return; const cs = chapterStarts(S.cur,S.voice); const t=au.currentTime; let i = cs.findIndex(x=>x>t)-1; if (i<-1) i=cs.length-1; if (i<0){ seekTo(0); return; } seekTo(t-cs[i] > 4 ? cs[i] : cs[Math.max(0,i-1)]); }
function setRate(r){ S.rate=r; store.set("rate",r); au.playbackRate=r; renderAll(); }
function setVoice(v){
  if (!VOICES[v] || v===S.voice) return;
  const id = S.cur;
  if (id && au.src){
    const wasPlaying = !au.paused;
    const u = curUnit(); const off = (au.currentTime||0) - AUDIO[id].at[S.voice][u];
    S.voice = v; store.set("narrator",v);
    const t = AUDIO[id].at[v][u] + Math.max(0, off*0.9);
    au.pause(); S.playing = wasPlaying; load(id, t, wasPlaying);
  } else { S.voice=v; store.set("narrator",v); renderAll(); }
  toast(`${VOICES[v].name} narrator`);
}

function finishLesson(){
  const id = S.cur;
  if (id){ S.done[id]=today(); store.set("done",S.done); delete S.pos[id]; store.set("pos",S.pos); }
  const next = S.queue.shift();
  if (next){ S.playing = true; load(next, 0, true); }
  else { S.playing=false; releaseWake(); setStatus("Finished. Pick another for the road."); renderAll(); }
}

let lastT = 0, lastSave = 0;
au.addEventListener("timeupdate", ()=>{
  const t = au.currentTime;
  if (!au.paused && t>lastT && t-lastT < 3){ logListen((t-lastT)/(au.playbackRate||1)); }  // counts real listening time, not audio time
  lastT = t;
  const now = performance.now();
  if (now-lastSave > 2000 && S.cur){ lastSave=now; S.pos[S.cur] = {u:curUnit(), t}; store.set("pos",S.pos); }
  updateLive();
  try{ if (navigator.mediaSession && au.duration) navigator.mediaSession.setPositionState({duration:au.duration, playbackRate:au.playbackRate, position:Math.min(t,au.duration)}); }catch(e){}
});
au.addEventListener("play", ()=>{ S.playing=true; renderAll(); });
au.addEventListener("playing", ()=>{ S.loading=false; setStatus(""); updateLive(); });
au.addEventListener("waiting", ()=>{ if (!au.paused) setStatus("Loading…"); });
au.addEventListener("canplay", ()=>{ S.loading=false; if (S.status==="Loading…") setStatus(""); });
au.addEventListener("pause", ()=>{ if (!au.ended){ S.playing=false; releaseWake(); if (S.cur){ S.pos[S.cur]={u:curUnit(), t:au.currentTime}; store.set("pos",S.pos);} renderAll(); } });
au.addEventListener("ended", finishLesson);

function logListen(sec){ if (!(sec>0)) return; const k=today(); S.days[k]=(S.days[k]||0)+sec; if (Math.random()<0.1) store.set("days",S.days); }
window.addEventListener("pagehide", ()=>{ store.set("days",S.days); });

/* ---------- lock screen / car controls ---------- */
const artCache = {};
function artwork(p){
  if (artCache[p]) return artCache[p];
  try{
    const c = document.createElement("canvas"); c.width=c.height=512; const x=c.getContext("2d");
    const col = {knowledge:"#B9834C",vocabulary:"#5F9478",practical:"#B39540",expression:"#9A6A9D",cognition:"#6F8DB5"}[p];
    x.fillStyle="#1D1A16"; x.fillRect(0,0,512,512);
    x.strokeStyle=col; x.globalAlpha=.35; x.lineWidth=3;
    [220,190].forEach(r=>{ x.beginPath(); x.arc(256,256,r,0,Math.PI*2); x.stroke(); });
    x.globalAlpha=1; x.fillStyle="#24201B"; x.beginPath(); x.arc(256,256,160,0,Math.PI*2); x.fill();
    x.fillStyle=col; x.font='600 64px "Cormorant Garamond", Georgia, serif'; x.textAlign="center"; x.textBaseline="middle";
    x.fillText(PILLARS[p].gk,256,240);
    x.fillStyle="#A59D91"; x.font='600 26px Figtree, sans-serif'; x.fillText(PILLARS[p].name.toUpperCase(),256,305);
    artCache[p] = c.toDataURL("image/png");
  }catch(e){ artCache[p] = ""; }
  return artCache[p];
}
function setMediaSession(){
  if (!("mediaSession" in navigator) || !S.cur) return;
  const l = L[S.cur];
  try{
    const art = artwork(l.p);
    navigator.mediaSession.metadata = new MediaMetadata({title:l.t, artist:`Wisebyte - Go · ${PILLARS[l.p].name}`, album: l.s ? SERIES.find(x=>x.id===l.s).t : "Wisebyte - Go", artwork: art?[{src:art,sizes:"512x512",type:"image/png"}]:[]});
    const h = {play:()=>{S.playing=true;playNow();}, pause:()=>au.pause(), seekbackward:()=>skip(-15), seekforward:()=>skip(30),
      previoustrack:()=>prevChapter(), nexttrack:()=>nextChapter(), seekto:(d)=>seekTo(d.seekTime)};
    for (const k in h){ try{ navigator.mediaSession.setActionHandler(k, h[k]); }catch(e){} }
  }catch(e){}
}

/* ---------- wake lock (drive mode) ---------- */
let wake = null;
async function requestWake(){ try{ if (S.drive && navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null}); } }catch(e){ wake=null; } }
function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake=null; }
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible" && S.drive) requestWake(); });

/* ---------- voice preview ---------- */
const preview = new Audio(); let previewT=null;
function previewVoice(v){
  const id = "spotlight"; if (!ready(id)) return;
  if (!au.paused) au.pause();
  clearTimeout(previewT);
  preview.src = srcFor(id, v); preview.playbackRate = S.rate;
  const start = AUDIO[id].at[v][2]; // first sentence after the headings
  preview.addEventListener("loadedmetadata", ()=>{ try{preview.currentTime=start;}catch(e){} }, {once:true});
  preview.play().catch(()=>{});
  previewT = setTimeout(()=>preview.pause(), 11000);
}

/* =========================================================
   Planner
   ========================================================= */
const offline = () => navigator.onLine === false;
// When offline, only downloaded lessons can play.
const playable = id => ready(id) && (!offline() || isSaved(id));
function candidates(){ return LESSONS.filter(l=>playable(l.id) && !S.done[l.id] && S.cur!==l.id); }
function planTrip(mins){
  const nextEp = sid => LESSONS.filter(l=>l.s===sid).find(l=>!S.done[l.id] && playable(l.id));
  const usable = candidates().filter(l=>!l.s || nextEp(l.s)?.id===l.id);
  // Subset-sum over whole minutes: fill the trip as fully as possible, with as few lessons as possible.
  const best = new Array(mins+1).fill(null); best[0] = [];
  usable.forEach((l, i)=>{
    const m = realMins(l.id); if (m > mins) return;
    for (let s = mins; s >= m; s--){
      const prev = best[s-m]; if (!prev || prev.length >= 8) continue;
      if (!best[s] || prev.length + 1 < best[s].length) best[s] = prev.concat(i);
    }
  });
  let s = mins; while (s > 0 && !best[s]) s--;
  const out = (best[s] || []).map(i=>usable[i]);
  // vary pillars in play order
  for (let i=1;i<out.length;i++){ if (out[i].p===out[i-1].p){ const j=out.findIndex((x,k)=>k>i && x.p!==out[i-1].p); if (j>0) [out[i],out[j]]=[out[j],out[i]]; } }
  return out;
}
function upNext(){
  const pool = LESSONS.filter(l=>playable(l.id) && !S.done[l.id]);
  const fits = pool.filter(l=>!S.len || bucket(l.id)===S.len);
  const inProg = fits.find(l=>S.pos[l.id]); if (inProg) return inProg;
  if (fits.length) return fits[0];
  // Nothing unheard at that length: offer the closest length instead.
  const any = pool.length ? pool : LESSONS.filter(l=>playable(l.id));
  if (!any.length) return null;
  if (!S.len) return any[0];
  return any.slice().sort((a,b)=>Math.abs(avgMins(a.id)-S.len)-Math.abs(avgMins(b.id)-S.len))[0];
}

/* =========================================================
   Rendering
   ========================================================= */
const $ = s => document.querySelector(s);
function pc(p){ return `--t:var(--p-${p})`; }
function progFrac(id){ const p=S.pos[id]; const A=AUDIO[id]; if (!p||!A) return 0; return Math.min(.97,(p.t||0)/A.dur[S.voice]); }
function dlButton(l){
  if (!DL.mode) return "";
  const saved = isSaved(l.id), busy = l.id in DL.busy;
  const label = busy ? `Downloading ${esc(l.t)}` : saved ? `Remove download of ${esc(l.t)}` : `Download ${esc(l.t)} for offline`;
  return `<button class="dl ${saved?"saved":""} ${busy?"busy":""}" data-act="${saved?"undl":"dl"}" data-id="${l.id}" aria-label="${label}" title="${saved?"Downloaded":"Download"}">${saved?I.saved:I.dl}</button>`;
}
function lessonRow(l){
  const done = S.done[l.id], now = S.cur===l.id, on = now && S.playing, can = playable(l.id);
  const badge = done ? '<span class="badge done">Heard</span>' : isSaved(l.id) ? '<span class="badge off">Offline</span>' : "";
  const series = l.s ? SERIES.find(x=>x.id===l.s).t+" · Ep "+l.ep : PILLARS[l.p].name;
  return `<div class="row ${now?"now":""} ${can?"":"soon"}" style="${pc(l.p)}">
    <div class="dur"><b>${realMins(l.id)}</b><span>MIN</span></div>
    <div class="txt"><strong>${esc(l.t)}</strong><small><span>${esc(series)}</span>${l.psy?'<span>Psychology</span>':""}${badge}</small>
      ${l.id in DL.busy?`<div class="dlbar"><i style="width:${Math.round(DL.busy[l.id]*100)}%"></i></div>`:S.pos[l.id]&&!done?`<div class="progress-mini"><i style="width:${Math.round(progFrac(l.id)*100)}%"></i></div>`:""}</div>
    ${dlButton(l)}
    <button class="pb" data-act="${on?"toggle":"play"}" data-id="${l.id}" aria-label="${on?"Pause":"Play"} ${esc(l.t)}" ${can?"":"disabled"}>${on?I.pause:I.play}</button>
  </div>`;
}
function streak(){ let n=0; const d=new Date(); if (!(S.days[today(d)]>30)) d.setDate(d.getDate()-1); while (S.days[today(d)]>30){ n++; d.setDate(d.getDate()-1); } return n; }
function weekMins(){ let s=0; const d=new Date(); for(let i=0;i<7;i++){ s+=S.days[today(d)]||0; d.setDate(d.getDate()-1);} return Math.round(s/60); }
function narrSwitch(compact){
  return `<div class="narr ${compact?"compact":""}" role="group" aria-label="Narrator">${Object.entries(VOICES).map(([k,v])=>`<button data-act="voice" data-v="${k}" aria-pressed="${S.voice===k}"><span class="av">${v.initial}</span><span><b>${v.name}</b><small>${v.who}</small></span></button>`).join("")}</div>`;
}

function renderListen(){
  const u = upNext();
  const plan = planTrip(S.trip);
  const planMins = plan.reduce((a,l)=>a+realMins(l.id),0);
  const cont = LESSONS.filter(l=>playable(l.id) && S.pos[l.id] && !S.done[l.id] && (!u || l.id!==u.id)).slice(0,3);
  const uOn = u && S.cur===u.id && S.playing;
  const planToGet = DL.mode ? plan.filter(l=>!isSaved(l.id)) : [];
  const planBusy = plan.some(l=>l.id in DL.busy);
  const lens = LENGTHS_AVAILABLE;
  return `
  ${offline() ? `<p class="alert info">You're offline. Downloaded lessons still play.</p>` : ""}
  <section class="trip">
    <div><p class="gk">Listen and learn on the go</p><h1>How long is the trip?</h1></div>
    <div class="lens" role="group" aria-label="Lesson length" style="grid-template-columns:repeat(${lens.length+1},minmax(0,1fr))">
      ${lens.map(m=>`<button class="len" data-act="len" data-m="${m}" aria-pressed="${S.len===m}"><b>${m}</b><span>min</span></button>`).join("")}
      <button class="len" data-act="len" data-m="0" aria-pressed="${!S.len}"><b>∞</b><span>any</span></button>
    </div>
  </section>

  <section>
    <div class="sh"><h2>Up next</h2><span class="eyebrow">${S.len?"About "+S.len+" minutes":"Any length"}</span></div>
    ${!u ? `<p class="alert info">Nothing is downloaded yet. Connect to the internet to listen, or download lessons before you head off.</p>` : `
    ${S.len && bucket(u.id)!==S.len ? `<p class="alert info">You've heard every ${S.len}-minute lesson${offline()?" that's downloaded":""}. Here's the closest length.</p>`:""}
    <div class="hero" style="${pc(u.p)}">
      <div class="disc" style="${pc(u.p)}"><span>${PILLARS[u.p].gk}</span></div>
      <div class="txt">
        <span class="tag"><i></i>${PILLARS[u.p].name}${u.psy?" · Psychology":""}</span>
        <h3>${esc(u.t)}</h3>
        <p>${esc(u.d)}</p>
        <div class="hero-row">
          <button class="playbig" data-act="${uOn?"toggle":"play"}" data-id="${u.id}" aria-label="${uOn?"Pause":"Play"} ${esc(u.t)}">${uOn?I.pause:I.play}</button>
          <div class="meta"><span class="num">${fmt(AUDIO[u.id].dur[S.voice])}</span><span>${S.pos[u.id]?"Resume":VOICES[S.voice].name+" narrator"}</span>${isSaved(u.id)?'<span class="badge off">Offline</span>':""}</div>
        </div>
      </div>
    </div>`}
  </section>

  <section>
    <div class="sh"><h2>Narrator</h2></div>
    ${narrSwitch()}
  </section>

  ${cont.length?`<section><div class="sh"><h2>Continue</h2></div><div class="list">${cont.map(lessonRow).join("")}</div></section>`:""}

  <section class="plan">
    <div class="sh"><h2>Plan a drive</h2></div>
    <div class="stepper">
      <button data-act="trip" data-d="-5" aria-label="Five minutes shorter">−</button>
      <output class="num">${S.trip}</output><small>minutes on the road</small>
      <button data-act="trip" data-d="5" aria-label="Five minutes longer">+</button>
    </div>
    ${plan.length?`
      <div class="fill" aria-hidden="true">${plan.map(l=>`<i style="${pc(l.p)};width:${Math.min(100,realMins(l.id)/S.trip*100)}%"></i>`).join("")}</div>
      <div class="qlist">${plan.map(l=>`<div class="qi" style="${pc(l.p)}"><i></i><span>${esc(l.t)}</span><b>${realMins(l.id)} min</b></div>`).join("")}</div>
      <button class="btn block" data-act="playplan">${I.play} Play ${plan.length} lesson${plan.length>1?"s":""} · ${planMins} min</button>
      ${planToGet.length||planBusy?`<button class="btn ghost block" data-act="dlplan" ${planBusy?"disabled":""}>${I.dl} ${planBusy?"Downloading…":`Download trip · ${fmtMB(planToGet.reduce((a,l)=>a+estBytes(l.id),0))}`}</button>`:(DL.mode?`<p class="muted" style="font-size:13px">All downloaded. This trip will play without signal.</p>`:"")}`
    : `<p class="muted">${offline()?"Nothing downloaded fits that trip. Try a longer trip.":"You've heard everything that fits that trip. Try a longer one."}</p>`}
  </section>

  <section>
    ${PAV().length>1?`<div class="sh"><h2>${PAV().length===5?"The five pillars":"Browse by pillar"}</h2><button class="link" data-act="tab" data-tab="library">Library</button></div>
    <div class="cols">${PAV().map(k=>`<button class="col" style="${pc(k)}" data-act="pillar" data-p="${k}"><span class="gw">${PILLARS[k].gk}</span><span class="shaft"></span><small>${PILLARS[k].name}</small></button>`).join("")}</div>`:""}
  </section>`;
}

function renderLibrary(){
  let list = LESSONS.slice();
  if (S.pillar==="psy") list = list.filter(l=>l.psy);
  else if (S.pillar==="saved") list = list.filter(l=>isSaved(l.id));
  else if (S.pillar!=="all") list = list.filter(l=>l.p===S.pillar);
  if (S.libLen) list = list.filter(l=>bucket(l.id)===S.libLen);
  if (offline()) list.sort((a,b)=>isSaved(b.id)-isSaved(a.id));
  const nSaved = LESSONS.filter(l=>isSaved(l.id)).length;
  return `
  <section>
    <div class="sh"><h2>Library</h2><span class="eyebrow num">${list.length} lesson${list.length===1?"":"s"}</span></div>
    ${offline()?`<p class="alert info">You're offline. Only downloaded lessons can play.</p>`:""}
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-act="pillar" data-p="all" aria-pressed="${S.pillar==="all"}">All</button>
      ${DL.mode&&nSaved?`<button class="chip" style="--t:var(--good)" data-act="pillar" data-p="saved" aria-pressed="${S.pillar==="saved"}"><i></i>Downloaded</button>`:""}
      <button class="chip" style="--t:var(--accent)" data-act="pillar" data-p="psy" aria-pressed="${S.pillar==="psy"}"><i></i>Psychology</button>
      ${PAV().length>1?PAV().map(k=>`<button class="chip" style="${pc(k)}" data-act="pillar" data-p="${k}" aria-pressed="${S.pillar===k}"><i></i>${PILLARS[k].name}</button>`).join(""):""}
    </div>
    <div class="seg" role="group" aria-label="Length">
      ${[0,...LENGTHS_AVAILABLE].map(m=>`<button data-act="liblen" data-m="${m}" aria-pressed="${S.libLen===m}">${m?m+" min":"Any"}</button>`).join("")}
    </div>
    <div class="list">${list.map(lessonRow).join("") || '<p class="muted">No lessons match. Try another filter.</p>'}</div>
  </section>`;
}

function renderSeries(){
  const list = SERIES.map(s=>({s, eps:LESSONS.filter(l=>l.s===s.id)})).filter(x=>x.eps.length);
  if (!list.length) return `<section><div class="sh"><h2>Compendium</h2></div><p class="muted">Audio courses are on the way.</p></section>`;
  return `<section><div class="sh"><h2>Compendium</h2><span class="eyebrow">Audio courses</span></div>
  ${list.map(({s, eps})=>{
    const next = eps.find(l=>!S.done[l.id]) || eps[0];
    const total = eps.reduce((a,l)=>a+realMins(l.id),0);
    const toGet = eps.filter(l=>!isSaved(l.id));

function transcriptHTML(){
  const A = AUDIO[S.cur]; let html = "", para = [], cur = curUnit();
  const flush = () => { if (para.length){ html += `<p>${para.join(" ")}</p>`; para=[]; } };
  A.units.forEach((u,i)=>{
    if (u.k==="title") return;
    if (u.k==="head"){ flush(); html += `<h4 class="s ${i===cur?"cur":""}" data-act="seek" data-u="${i}" id="u-${i}">${esc(u.c < A.chapters.length ? (u.c+1)+". "+A.chapters[u.c] : "Quick recall")}</h4>`; return; }
    if (u.ps || u.k!=="s") flush();
    para.push(`<span class="s ${i===cur?"cur":""}" data-act="seek" data-u="${i}" id="u-${i}">${esc(u.t)}</span>`);
    if (u.k!=="s") flush();
  });
  flush(); return html;
}
function scrollTranscript(){ const cur = document.querySelector(".transcript .s.cur"); const box=$("#transcript"); if (cur && box){ box.scrollTop = cur.offsetTop - box.offsetTop - box.clientHeight/3; } }

let lastUnit = -1, lastCh = -1;
function updateLive(){
  if (!S.cur || !AUDIO[S.cur]) return;
  const dur = au.duration || AUDIO[S.cur].dur[S.voice], t = au.currentTime||0;
  const f=$("#trackFill"); if (f) f.style.width = (t/dur*100)+"%";
  const tr=$("#track"); if (tr) tr.setAttribute("aria-valuenow", Math.round(t));
  const a=$("#tEl"); if (a) a.textContent = fmt(t);
  const b=$("#tLeft"); if (b) b.textContent = "−"+fmt((dur-t)/S.rate);
  const df=$("#dFill"); if (df) df.style.width = (t/dur*100)+"%";
  const u = curUnit(), c = curChapter();
  if (c!==lastCh){ lastCh=c; const lab=chapterLabel();
    const cl=$("#chLabel"); if (cl) cl.textContent = lab;
    const dc=$("#dCh"); if (dc) dc.textContent = lab.replace(" · ",": ");
    const ms=$("#miniSub"); if (ms && !S.status) ms.textContent = lab;
    document.querySelectorAll(".chap").forEach(x=>x.classList.toggle("cur", +x.dataset.c===c));
  }
  if (u!==lastUnit){ lastUnit=u;
    document.querySelectorAll(".transcript .s.cur").forEach(x=>x.classList.remove("cur"));
    const s = document.getElementById("u-"+u); if (s){ s.classList.add("cur"); scrollTranscript(); }
  }
}
function setStatus(t){
  S.status = t||"";

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  switch(b.dataset.act){
    case "tab": S.tab=b.dataset.tab; store.set("tab",S.tab); window.scrollTo(0,0); renderApp(); renderDock(); break;
    case "welcome": showWelcome(); break;
    case "sub": if (WBStore.mode!=="preview"&&WBStore.entitled()) WBStore.manage(); else WBStore.showPaywall({dismissable:true}); break;
    case "restore": WBStore.restore().then(()=>{ setStatus(WBStore.entitled()?"Subscription restored":"No active subscription found"); renderAll(); }); break;
    case "welcomego": closeWelcome(); break;
    case "drivenoticeok": store.set("driveNoticed",true); $("#modal").hidden=true; enterDrive(); break;
    case "modalclose": $("#modal").hidden=true; break;
    case "dl": download(b.dataset.id); break;
    case "undl": removeDownload(b.dataset.id); toast("Download removed"); break;
    case "dlplan": download(planTrip(S.trip).map(l=>l.id)); toast("Downloading your trip"); break;
    case "dlseries": download(LESSONS.filter(l=>l.s===b.dataset.s).map(l=>l.id)); toast("Downloading the course"); break;
    case "dlall": download(LESSONS.map(l=>l.id)); break;
    case "undlall": removeAllDownloads(); break;
    case "len": S.len=+b.dataset.m; store.set("len",S.len); renderApp(); break;
    case "trip": S.trip=Math.min(180,Math.max(10,S.trip+ +b.dataset.d)); store.set("trip",S.trip); renderApp(); break;
    case "pillar": S.pillar=b.dataset.p; S.tab="library"; store.set("tab","library"); renderApp(); renderDock(); break;
    case "liblen": S.libLen=+b.dataset.m; renderApp(); break;
    case "play": startLesson(b.dataset.id); break;
    case "toggle": togglePlay(); break;
    case "playplan": { const p = planTrip(S.trip).map(l=>l.id); if (!p.length) break; S.queue = p.slice(1); S.cur=null; startLesson(p[0], true); toast(`Queued ${p.length} lesson${p.length>1?"s":""} for your trip`); break; }
    case "playseries": { const eps = LESSONS.filter(l=>l.s===b.dataset.s && playable(l.id)); const rest = eps.filter(l=>!S.done[l.id]); const list=(rest.length?rest:eps).map(l=>l.id); if(!list.length) break; S.queue=list.slice(1); startLesson(list[0], true); break; }
    case "open": S.sheetOpen=true; renderSheet(); break;
    case "close": S.sheetOpen=false; renderSheet(); break;
    case "drive": if (S.drive){ S.drive=false; releaseWake(); renderDrive(); } else if (!store.get("driveNoticed",false)) showDriveNotice(); else enterDrive(); break;
    case "back": skip(-15); break;
    case "fwd": skip(30); break;
    case "nextch": nextChapter(); break;
    case "prevch": prevChapter(); break;
    case "chap": seekTo(chapterStarts(S.cur,S.voice)[+b.dataset.c]); if (au.paused){S.playing=true;playNow();} break;
    case "seek": seekTo(AUDIO[S.cur].at[S.voice][+b.dataset.u]); if (au.paused){S.playing=true;playNow();} break;
    case "cyclerate": { const rs=[.85,1,1.15,1.3,1.5]; setRate(rs[(rs.indexOf(S.rate)+1)%rs.length]); break; }
    case "rate": setRate(+b.dataset.r); break;
    case "voice": setVoice(b.dataset.v); break;
    case "preview": previewVoice(b.dataset.v); break;
    case "showtext": S.showText=!S.showText; renderSheet(); break;
    case "clearq": S.queue=[]; renderSheet(); break;
  }
});
// scrub the progress bar
document.addEventListener("pointerdown", e=>{
  const tr = e.target.closest("#track"); if (!tr || !S.cur) return;
  const dur = au.duration || AUDIO[S.cur].dur[S.voice];
  const go = ev => { const r=tr.getBoundingClientRect(); seekTo(Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*dur); };
  go(e); tr.setPointerCapture?.(e.pointerId);
  const mv = ev=>go(ev), up = ()=>{ tr.removeEventListener("pointermove",mv); tr.removeEventListener("pointerup",up); };
  tr.addEventListener("pointermove",mv); tr.addEventListener("pointerup",up);
});
document.addEventListener("keydown", e=>{
  if (e.target.id==="track" && (e.key==="ArrowLeft"||e.key==="ArrowRight")){ e.preventDefault(); skip(e.key==="ArrowLeft"?-15:15); return; }
  if (e.target.matches("input,select,textarea")) return;
  if (e.code==="Space" && S.cur && !e.target.closest("button")){ e.preventDefault(); togglePlay(); }
  if (e.key==="Escape"){ if (S.drive){S.drive=false;releaseWake();renderDrive();} else if (S.sheetOpen){S.sheetOpen=false;renderSheet();} }
});

/* ---------- boot ---------- */
(function boot(){
  const last = store.get("cur",null);
  // Show the last lesson in the mini player; pressing play resumes where they left off.
  if (last && ready(last) && !S.done[last]){ S.cur = last; setMediaSession(); }
  if (!LENGTHS_AVAILABLE.includes(S.len)) S.len = 0;
  if (!["all","psy","saved",...PKEYS].includes(S.pillar)) S.pillar = "all";
  renderAll();
  initDownloads();
  if (!store.get("welcomed", false)) showWelcome();
  WBStore.onChange(ok => { if (ok) WBStore.hidePaywall(); else { if (!au.paused) au.pause(); WBStore.showPaywall(); } if (S.tab === "you") renderAll(); });
  WBStore.init({ app:"go", theme:"stoic", headline:"Learn on the go",
    pitch:"Narrated lessons for the walk, the commute and the drive.",
    features:[`${LESSONS.length} lessons from 10 to 30 minutes, with a female and a male narrator`, (()=>{const c=SERIES.filter(s=>LESSONS.some(l=>l.s===s.id)).map(s=>s.t);return c.length?"Compendium courses: "+c.join(", "):"Lessons across knowledge, words, life skills and thinking";})(), "Download lessons to listen with no signal", "Drive mode, and lock screen and car controls"],
    openDoc:u=>window.open(u,"_blank","noopener"), termsUrl:"terms.html", privacyUrl:CONFIG.privacyUrl }).then(()=>WBStore.require()).catch(()=>{});
  window.addEventListener("online", ()=>renderAll());
  window.addEventListener("offline", ()=>renderAll());
})();
</script>

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
