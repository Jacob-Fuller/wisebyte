/* --- moving through steps --- */
function advance() {
  const s = P.steps[P.i];
  if (s.t === "q" && P.answered === null) return;
  if (s.t === "flash") return;
  if (P.timed && s.t === "q") return nextTimed();
  if (P.timed && s.t === "c-intro") { P.endAt = Date.now() + P.timed * 1000; P.steps.push(P.c.gen()); P.i++; P.answered = null; return drawPlayer(); }
  if (P.memTimer) { clearTimeout(P.memTimer); P.memTimer = null; }
  if (P.i >= P.steps.length - 1) return closePlayer();
  P.i++; P.answered = null; enter(); drawPlayer();
}
function nextTimed() {
  if (Date.now() >= P.endAt) return tick();
  P.steps.push(P.c.gen()); P.i++; P.answered = null; drawPlayer();
}
function answer(i) {
  if (!P || P.answered !== null) return;
  const s = P.steps[P.i], q = s.q, right = i === q.answer;
  P.answered = i; recordAnswer(right);
  if ((P.mode === "recall" || P.mode === "review" || P.mode === "memory") && (q.src === "lesson" || q.src === "word")) day().reviewed = (day().reviewed || 0) + 1;
  if (right) P.score++;
  if (P.mode === "lesson") { if (s.retry) { if (right) P.retryRight++; } else P.results.push({ qi: q.qi, s: q.s, right }); }
  else if (P.mode === "word") { if (right) P.wordRight++; }
  else if (P.mode === "recall") { lessonRecall(q.id, right); if (right) addXp(RULES.xp.recallRight); }
  else if (P.mode === "review" || P.mode === "practice") { updateWord(q.w, right); if (right) addXp(RULES.xp.reviewRight); }
  else if (P.mode === "quiz" || P.mode === "mastery" || P.mode === "memory") { if (P.mode === "memory" && !q.src) {} else if (q.src === "lesson") lessonRecall(q.id, right); else updateWord(q.w, right); }
  else if (P.mode === "vocab") { const t = P.tally[q.lvl]; t[1]++; if (right) t[0]++; }
  save(); drawPlayer();
  if (P.timed) setTimeout(() => { if (P && P.steps[P.i] === s) nextTimed(); }, right ? 300 : 850);
}
function gradeFlash(right) {
  const s = P.steps[P.i]; recordAnswer(right); if (right) P.score++;
  updateWord(s.e.w, right); if (right) addXp(RULES.xp.reviewRight); save();
  P.flipped = false; advance2();
}
function advance2() { if (P.i >= P.steps.length - 1) return closePlayer(); P.i++; P.answered = null; enter(); drawPlayer(); }

/* --- things that happen when a step is entered --- */
function enter() {
  const s = P.steps[P.i];
  if (s.t === "l-score" && !P.scored) {
    P.scored = true;
    const missed = P.results.filter(r => !r.right);
    const add = [];
    missed.slice(0, 2).forEach(r => { add.push({ t: "l-refresh", s: r.s }); add.push({ t: "q", q: qLesson(P.l, r.qi), retry: true, head: "Try it again" }); });
    P.steps.splice(P.i + 1, 0, ...add);
  }
  if (s.t === "l-reward" && !P.reward) P.reward = finishLesson();
  if (s.t === "w-reward" && !P.reward) P.reward = finishWord();
  if (s.t === "w-card" && !s.spoken) { s.spoken = true; setTimeout(() => { if (P && P.steps[P.i] === s) speak(P.e.w); }, 350); }
  if (s.t === "summary" && !P.reward) P.reward = finishSession();
}
function finishLesson() {
  const l = P.l, right = P.results.filter(r => r.right).length, n = l.quiz.length, mult = RULES.levelMult[l.level] || 1, perfect = right === n;
  const lines = [];
  let xp = 0;
  const a = Math.round(right * RULES.xp.lessonCorrect * mult); xp += a; lines.push([`Correct answers (${right}/${n})`, `+${a}`]);
  xp += RULES.xp.lessonComplete; lines.push(["Lesson complete", `+${RULES.xp.lessonComplete}`]);
  if (perfect) { xp += RULES.xp.perfect; lines.push(["Perfect score bonus", `+${RULES.xp.perfect}`]); }
  if (P.retryRight) { const r = P.retryRight * RULES.xp.retryRight; xp += r; lines.push(["Recalled after refresher", `+${r}`]); }
  if (P.replay) { xp = Math.round(xp * RULES.xp.replayFactor); lines.push(["Review", "½ XP"]); }
  if (P.golden) { xp *= 2; lines.push(["Golden Lesson", "2×"]); state.stats.goldens++; }
  addXp(xp);
  const rec = state.lessons[l.id];
  if (!rec) state.lessons[l.id] = { box: 0, due: addDays(today(), 1), learnedAt: today(), best: right, attempts: 1 };
  else { rec.best = Math.max(rec.best, right); rec.attempts++; const was = rec.due; srUpdate(rec, right >= Math.ceil(n * 0.6)); if (rec.due < was) rec.due = was; }
  if (perfect) state.stats.perfectLessons++;

  return { xp, lines, right, n, perfect, out: wrapUp() };
}
function finishWord() {
  const e = P.e, lines = []; let xp = 0;
  const isNew = addWord(e.w, P.isWotd ? "daily" : "library");
  xp += RULES.xp.wordLearn; lines.push([isNew ? "New word learned" : "Word practised", `+${RULES.xp.wordLearn}`]);
  if (P.wordRight) { const a = P.wordRight * RULES.xp.wordExercise; xp += a; lines.push([`Fit the sentence (${P.wordRight}/1)`, `+${a}`]); }
  if (P.sentenceOk) { xp += RULES.xp.sentence; lines.push(["Used it in a sentence", `+${RULES.xp.sentence}`]); }
  if (!isNew) xp = Math.round(xp / 2);
  addXp(xp);
  if (P.wordRight < 2) state.words[e.w].wrong += 0; // first exposure doesn't count against you
  day().word = true;
  return { xp, lines, isNew, out: wrapUp() };
}
function finishSession() {
  const m = P.mode, total = P.mode === "challenge" && P.timed ? P.steps.filter(s => s.t === "q").length : (P.total || P.steps.filter(s => s.t === "q" || s.t === "flash").length);
  const lines = []; let xp = 0, title = "", note = "";
  if (m === "quiz") {
    title = P.trial ? "The Daily Trial" : "Daily quiz";
    if (P.trial) { const d0 = day(); d0.trial = Math.max(d0.trial ?? 0, P.score); state.trialBest = Math.max(state.trialBest ?? 0, P.score); if (P.score === total) state.stats.perfectGk++; }
    const a = P.score * RULES.xp.quizCorrect; xp += a; lines.push([`Correct (${P.score}/${total})`, `+${a}`]);
    if (P.score === total) { xp += RULES.xp.quizPerfect; lines.push(["Perfect score bonus", `+${RULES.xp.quizPerfect}`]); }
    if (!day().quiz) day().quiz = true; else { xp = Math.round(xp / 2); lines.push(["Replay", "½ XP"]); }
  } else if (m === "challenge") {
    const c = P.c, k = today(), y = scoreOn(c.id, addDays(k, -1)), prev = scoreOn(c.id, k);
    title = actName(c) + (P.opt && P.opt.cat ? ` · ${WB.GK_CATS[P.opt.cat]}` : "");
    const perfect = !P.timed && P.score === total;
    if (perfect) { const key = { fob: "perfectFob", timeline: "perfectTimeline", opposites: "perfectOpposites", capitals: "perfectCapitals", critical: "perfectCritical", gk: "perfectGk" }[c.id]; if (key) state.stats[key]++; }
    const a = P.score * RULES.xp.challengePoint; xp += a; lines.push([`Score ${P.score}`, `+${a}`]);
    state.scores[c.id] = state.scores[c.id] || {};
    if (!(P.opt && P.opt.cat) && (prev == null || P.score > prev)) state.scores[c.id][k] = P.score;
    if (!(P.opt && P.opt.cat) && y != null && P.score > y && !(prev > y)) { xp += RULES.xp.beatYesterday; lines.push([`Beat yesterday's ${y}`, `+${RULES.xp.beatYesterday}`]); state.stats.beatYesterday++; }
    else if (y != null) lines.push(["Yesterday's score", String(y)]);
    if (c.id === "speed") state.stats.speedBest = Math.max(state.stats.speedBest, P.score);
    state.stats.challenges++; day().challenges++;
    if (c.id === challengeOfDay().id) day().challenge = true;
    if (perfect) { xp += 10; lines.push(["Perfect score bonus", "+10"]); }
    note = c.id === challengeOfDay().id ? "Today's challenge is ticked off." : `Today's challenge is ${actName(challengeOfDay())}. Play it to tick off your plan.`;
  } else if (m === "recall") {
    title = "Quick recall"; xp = P.score * RULES.xp.recallRight; lines.push([`Remembered (${P.score}/${total})`, `+${xp}`]);
    note = P.score === total ? "Locked in. These lessons come back later, spaced further apart." : "Missed ones come back tomorrow. That's how they stick.";
  } else if (m === "review" || m === "practice") {
    title = m === "review" ? "Word review" : "Practice"; xp = P.score * RULES.xp.reviewRight; lines.push([`Correct (${P.score}/${total})`, `+${xp}`]);
    note = "Words you miss come back sooner. Words you know come back later.";
  } else if (m === "memory") {
    title = "Review"; xp = P.score * RULES.xp.reviewRight; lines.push([`Remembered (${P.score}/${total})`, `+${xp}`]);
    if (!day().review) { day().review = true; xp += 10; lines.push(["Daily review done", "+10"]); }
    note = "Missed ones come back tomorrow. Ones you got right come back later, spaced further apart.";
  } else if (m === "inner") {
    title = { q: "Expert questions", r: "Expert riddles", w: "Lexicon test" }[P.kind];
    xp = P.score * 10; lines.push([`Correct (${P.score}/${total})`, `+${xp}`]);
    state.inner = state.inner || {}; if (state.inner[P.kind] == null || P.score > state.inner[P.kind]) { state.inner[P.kind] = P.score; if (P.score) lines.push(["New personal best", "★"]); }
    note = P.score === total ? "Flawless. Few ever manage that." : "The Inner Circle rewards persistence. Try again.";
  } else if (m === "mastery") {
    const x = P.subject, pass = P.score >= Math.min(RULES.xp.masteryPass, total), first = pass && !state.mastered[x.id];
    title = "Mastery exam"; xp = P.score * RULES.xp.masteryCorrect; lines.push([`Correct (${P.score}/${total})`, `+${xp}`]);
    if (first) { state.mastered[x.id] = today(); xp += RULES.xp.mastery; lines.push([`${x.title} mastered`, `+${RULES.xp.mastery}`]); }
    note = pass ? (first ? `You have mastered ${x.title}. It's on your Me page for good.` : "Passed again. Still a master.") : `You need ${RULES.xp.masteryPass}/10 to pass. Review the lessons you missed, then try again.`;
    P.passed = pass;
  } else if (m === "expr") {

    lines.push(["Quote of the day", `+${RULES.xp.quoteRead}`], [`Correct (${P.score}/${total})`, `+${P.score * RULES.xp.quoteRight}`]);
    if (day().expr) { xp = Math.round(xp / 2); lines.push(["Replay", "½ XP"]); }
    state.quotes[P.quote.i] = state.quotes[P.quote.i] || today(); day().expr = true;
    note = "Quotes you've met come back later to test your memory.";
  } else if (m === "vocab") {
    title = "Vocabulary check";
    const p = n => P.tally[n][1] ? P.tally[n][0] / P.tally[n][1] : 0;
    // Rough estimate: each difficulty band stands for a slice of English vocabulary.
    const est = Math.round((8000 + 8000 * p(1) + 10000 * p(2) + 12000 * p(3)) / 500) * 500;
    state.vocab = { value: est, date: today() };
    lines.push(["Common words", `${P.tally[1][0]}/${P.tally[1][1]}`], ["Intermediate words", `${P.tally[2][0]}/${P.tally[2][1]}`], ["Advanced words", `${P.tally[3][0]}/${P.tally[3][1]}`]);
    note = `Your estimated vocabulary is about ${est.toLocaleString()} words. It's a rough estimate from 15 questions; retake it any time.`;
  }
  // recall and word XP were already added per answer; add the rest here
  if (m === "quiz" || m === "challenge" || m === "expr" || m === "mastery" || m === "inner" || m === "memory") addXp(xp);
  return { title, xp, lines, total, note, out: wrapUp() };
}

/* --- use in a sentence --- */
function checkSentence() {
  const el = $("#sentence"); const text = (el?.value || "").trim(); P.sentence = text;
  const e = P.e, stem = e.w.toLowerCase().slice(0, Math.max(4, e.w.length - 2));
  const words = text.split(/\s+/).filter(Boolean);
  if (!text.toLowerCase().includes(stem)) P.sentenceMsg = `<div class="explain bad"><strong>Almost.</strong>Your sentence needs to include “${esc(e.w)}”.</div>`;
  else if (words.length < 5) P.sentenceMsg = `<div class="explain bad"><strong>A bit longer.</strong>Try a full sentence of at least five words.</div>`;
  else {
    P.sentenceOk = true; state.stats.sentences++;
    const rec = state.words[e.w]; P.pendingSentence = text; if (rec) rec.sentences.push(text);
    P.sentenceMsg = `<div class="explain good"><strong>Saved to your word notes.</strong>Writing your own sentence is one of the best ways to make a word stick.</div>`;
  }
  drawPlayer();
}

let sampleFn = null;
(async () => { try { if (window.claude && claude.use) { sampleFn = await claude.use("sample"); if (tab === "library") render(); } } catch (e) {} })();
function parseLookup(q) {
  q = q.trim().toLowerCase().replace(/[?!.]+$/, "");
  const m = q.match(/(?:what does|what's|whats|define|definition of|meaning of|what is)\s+(?:the\s+(?:word|meaning of)\s+)?["'“‘]?([a-z][a-z' -]*?)["'”’]?(?:\s+mean)?$/);
  return (m ? m[1] : q).replace(/["'“”‘’]/g, "").trim();
}
function renderLookup() {
  const L = lookupState; if (!L) return "";
  if (L.status === "found") { const e = entry(L.w) || L.entry; return `<section class="stack">${wordCardHTML(e)}${state.words[e.w] ? `<span class="badge done" style="align-self:flex-start">In your words</span>` : `<button class="btn" data-act="lookup-add">${ICON.plus}Add to my words</button>`}</section>`; }
  if (L.status === "missing") return `<p class="muted">“${esc(L.w)}” isn't in the Wisebyte library yet.</p>${sampleFn ? `<button class="btn ghost" data-act="lookup-ai">Ask Claude to explain “${esc(L.w)}”</button><p class="muted small">Uses your Claude account. You'll be asked to allow it the first time.</p>` : ""}`;
  if (L.status === "loading") return `<p class="muted">Looking up “${esc(L.w)}”…</p>`;
  if (L.status === "error") return `<p class="muted">${esc(L.msg)}</p>`;
  return "";
}
function doLookup(q) {
  const w = parseLookup(q); if (!w) return;
  const e = WB.WORDS.find(x => x.w === w) || state.custom[w] || WB.WORDS.find(x => w.startsWith(x.w.slice(0, -1)) && Math.abs(w.length - x.w.length) <= 3);
  lookupState = e ? { q, w: e.w, status: "found", entry: e } : { q, w, status: "missing" };
  const out = $("#lookup-out"); if (out) out.innerHTML = renderLookup();
}
async function lookupAI() {
  const L = lookupState; if (!L || !sampleFn) return;
  L.status = "loading"; $("#lookup-out").innerHTML = renderLookup();
  const prompt = `Create a vocabulary card for the English word or phrase "${L.w}" for an Australian adult learner. Reply with only JSON in this shape:
{"w": "the word in lowercase dictionary form", "pos": "part of speech", "ipa": "IPA in slashes, Australian/British", "say": "plain respelling with the stressed syllable in capitals, e.g. yoo-BIK-wih-tus", "def": "one clear sentence", "ex": ["natural example sentence", "second example sentence"], "syn": ["up to 3 synonyms"], "ant": ["up to 2 antonyms, or empty"], "lvl": 1, "cat": "everyday", "origin": "one-sentence etymology", "blank": "one of the examples with the word replaced by ___"}
lvl is 1 (common), 2 (intermediate) or 3 (advanced). cat is one of everyday, business, academic, science, law, people. Use Australian spelling. If "${L.w}" is not a real English word or phrase, reply {"error": "not a word"}.`;
  try {
    const d = await sampleFn.json(prompt, { modelTier: "quick" });
    if (!d || d.error || !d.w || !d.def) { L.status = "error"; L.msg = `Claude couldn't find a meaning for “${L.w}”. Check the spelling and try again.`; }
    else {
      const e = { w: String(d.w).toLowerCase().slice(0, 40), pos: String(d.pos || ""), ipa: String(d.ipa || ""), say: String(d.say || ""), def: String(d.def), ex: (d.ex || []).slice(0, 2).map(String),
        syn: (d.syn || []).slice(0, 3).map(String), ant: (d.ant || []).slice(0, 2).map(String), lvl: [1, 2, 3].includes(+d.lvl) ? +d.lvl : 2,
        cat: WB.WORD_CATS[d.cat] ? d.cat : "everyday", origin: String(d.origin || ""), blank: String(d.blank || ""), custom: true, audience: aud() };
      state.custom[e.w] = e; save();
      Object.assign(L, { status: "found", w: e.w, entry: e });
    }
  } catch (err) {
    L.status = "error"; L.msg = err && (err.code === "not_granted" || err.code === "sampling_disabled") ? "Claude look-ups aren't allowed for this page, so only library words are available." : err && err.code === "rate_limited" ? "Too many look-ups right now. Try again in a minute." : "The look-up didn't work. Try again.";
    if (err && (err.code === "not_granted" || err.code === "sampling_disabled")) sampleFn = null;

  const out = $("#lookup-out"); if (out) out.innerHTML = renderLookup();
}

}
function speak(w) {
  try { const u = new SpeechSynthesisUtterance(w); const v = speechSynthesis.getVoices().find(x => /en-AU/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /en-GB/i.test(x.lang)); if (v) u.voice = v; u.lang = v ? v.lang : "en-AU"; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { toast("Audio isn't available in this browser"); }
}

/* ============ 10. EVENTS ============ */
const toastQ = []; let toastBusy = false;
function toast(msg) { toastQ.push(msg); if (!toastBusy) nextToast(); }
function nextToast() { const t = $("#toast"), m = toastQ.shift(); if (!m) { toastBusy = false; t.hidden = true; return; } toastBusy = true; t.textContent = m; t.hidden = false; setTimeout(nextToast, 2400); }

document.addEventListener("click", ev => {
  if (ev.target.id === "sheet") return closeSheet();
  const ans = ev.target.closest("[data-ans]"); if (ans) return answer(+ans.dataset.ans);
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const { act, id, w } = el.dataset;
  const inPlayer = !!el.closest("#player"), inSheet = !!el.closest("#sheet");
  const leave = () => { if (inSheet) closeSheet(); if (inPlayer && P) closePlayer(); };
  switch (act) {
    case "next": return advance();
    case "close": return closePlayer();
    case "flip": if (P && !P.flipped) { P.flipped = true; drawPlayer(); } return;
    case "grade": return gradeFlash(id === "1");
    case "sentence-check": return checkSentence();
    case "sentence-ai": return sentenceAI();
    case "speak": ev.stopPropagation(); return speak(w);
    case "lesson": leave(); return startLesson(id);
    case "wotd": leave(); return startWord(wordOfDay().w, true);
    case "learn-word": leave(); return startWord(w, false);
    case "recall": leave(); return startRecall();
    case "review-words": leave(); return startWordReview();
    case "review-all": leave(); return startFullReview();
    case "quote-review": leave(); return startQuoteReview();
    case "practice": return startPractice(id);
    case "daily-quiz": case "daily-trial": leave(); return startTrial();
    case "quote": leave(); return startQuote();
    case "inner": leave(); tab = "inner"; render(); return window.scrollTo(0, 0);
    case "inner-play": leave(); return startInner(id);
    case "quote-sheet": return quoteSheet(+id);
    case "lib": libPillar = id || null; libArea = null; libSubject = null; learnCat = "all"; learnLevel = "all"; render(); return window.scrollTo(0, 0);
    case "lib-wcat": libWordCat = id; return render();
    case "goto-words": tab = "library"; libPillar = "vocabulary"; learnCat = "all"; render(); return window.scrollTo(0, 0);
    case "challenge": leave(); return startChallenge(id);
    case "vocab-test": return startVocabTest();
    case "plan-next": { const d = day(); return !d.lesson ? startLesson(lessonOfDay().id) : startWord(wordOfDay().w, true); }
    case "random": { const pool = lessons(), fresh = pool.filter(l => !state.lessons[l.id]); return startLesson(pick(fresh.length ? fresh : pool).id); }
    case "path": case "subject": leave(); closeSheet(); tab = "library"; libSubject = id; render(); return window.scrollTo(0, 0);
    case "area": tab = "library"; libArea = id; libSubject = null; libPillar = null; learnCat = "all"; render(); return window.scrollTo(0, 0);
    case "mastery": leave(); return startMastery(id);
    case "collection": leave(); return collectionSheet(id);
    case "gk-cat": return startChallenge("gk", { cat: id });
    case "word": return wordSheet(w);
    case "ach": return achSheet(id);
    case "sheet-close": return closeSheet();
    case "add-word": addWord(w, "library"); addXp(RULES.xp.wordAdd); wrapUp(); toast(`Added “${w}” to your words`); render(); return wordSheet(w);
    case "remove-word": delete state.words[w]; save(); closeSheet(); toast(`Removed “${w}”`); return render();
    case "lookup-add": { const e = entry(lookupState.w) || lookupState.entry; if (e.custom) state.custom[e.w] = e; state.stats.lookups++; addWord(e.w, "lookup"); addXp(RULES.xp.wordAdd); wrapUp(); toast(`Added “${e.w}” to your words`); return render(); }
    case "lookup-ai": return lookupAI();
    case "share": { const t = $("#share-text")?.textContent || ""; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Copied. Paste it anywhere to share.")).catch(() => { const r = document.createRange(); r.selectNodeContents($("#share-text")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected. Copy it to share."); }); return; }
    case "about": return aboutSheet();
    case "paywall": return paywallSheet();
        case "restore": return WBStore.restore().then(() => toast(WBStore.entitled() ? "Subscription restored" : "No active subscription found"));
    case "manage-sub": return WBStore.manage();
    case "open-doc": return openExternal(id);
    case "reset-sheet": return resetSheet();
