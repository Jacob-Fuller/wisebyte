<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="color-scheme" content="dark">
<title>Wisebyte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wisebyte">
<style>
/* Fonts are bundled with the app (SIL Open Font License, see fonts/), so they work offline */
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond.woff) format("woff");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond-italic.woff) format("woff");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff) format("woff");font-weight:300 900;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff) format("woff");font-weight:100 800;font-style:normal;font-display:swap}
</style>
<style>
/* =========================================================
   WISEBYTE — design tokens
   Light palette on :root, dark palette below.
   ========================================================= */
:root{
  color-scheme:dark;
  /* Single dark theme, matching Wisebyte - Scroll */
  --ground:#141210; --surface:#1D1A16; --surface-2:#24201B; --line:#353029;
  --ink:#F3EEE6; --ink-2:#A59D91;
  --accent:#C08F5C; --accent-ink:#1A140D; --accent-soft:#3A2C1D;
  --spark:#E09A5C; --spark-soft:#3A2717;
  --good:#8DB57F; --good-soft:#232B1D;
  --bad:#D98272; --bad-soft:#3A1D1A;
  --gold:#D9BB6E; --gold-soft:#352C15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
  --p-learn:#C08F5C; --p-learn-soft:#3A2C1D; --p-remember:#8FB9A2; --p-remember-soft:#1D2D25; --p-think:#9DB3D2; --p-think-soft:#1E2733; --p-test:#E08A80; --p-test-soft:#3A1D1A; --p-practical:#D9BB6E; --p-practical-soft:#352C15; --p-expression:#C99BCB; --p-expression-soft:#33232F;
  --p-knowledge:var(--p-learn); --p-knowledge-soft:var(--p-learn-soft); --p-vocabulary:var(--p-remember); --p-vocabulary-soft:var(--p-remember-soft); --p-cognition:var(--p-think); --p-cognition-soft:var(--p-think-soft);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{--pc:var(--accent);--pc-soft:var(--accent-soft)}
body[data-pillar="learn"],#player[data-pillar="learn"]{--accent:var(--p-learn);--accent-soft:var(--p-learn-soft);--pc:var(--p-learn);--pc-soft:var(--p-learn-soft)}
body[data-pillar="remember"],#player[data-pillar="remember"]{--accent:var(--p-remember);--accent-soft:var(--p-remember-soft);--pc:var(--p-remember);--pc-soft:var(--p-remember-soft)}
body[data-pillar="think"],#player[data-pillar="think"]{--accent:var(--p-think);--accent-soft:var(--p-think-soft);--pc:var(--p-think);--pc-soft:var(--p-think-soft)}
body[data-pillar="test"],#player[data-pillar="test"]{--accent:var(--p-test);--accent-soft:var(--p-test-soft);--pc:var(--p-test);--pc-soft:var(--p-test-soft)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1;letter-spacing:0!important}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:14px}
.small{font-size:13px}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 112px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.01em;min-width:0}
.brand svg{width:28px;height:28px;color:var(--accent);flex:none}
.brand small{font-size:13px;font-weight:700;color:var(--accent)}
.pills{display:flex;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:13px}
.pill svg{width:15px;height:15px}
.pill.streak{background:var(--spark-soft);color:var(--spark)}
.pill.xp{background:var(--accent-soft);color:var(--accent)}
.pill.who{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-head h2{font-size:23px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:11px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ---------- today ---------- */
.inbox{display:flex;flex-direction:column;gap:6px}
.nudge{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.nudge .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.nudge .ic svg{width:18px;height:18px}
.nudge.spark .ic{background:var(--spark-soft);color:var(--spark)}
.nudge.good .ic{background:var(--good-soft);color:var(--good)}
.nudge span{flex:1;font-size:14px;font-weight:500}
.nudge .chev{width:16px;height:16px;color:var(--ink-2)}

.plan-top{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .fill{stroke:var(--spark);transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:15px}
.plan-top h2{font-size:21px}
.plan-rows{display:flex;flex-direction:column;gap:8px}
.plan-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);text-align:left;width:100%}
.plan-row .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.plan-row .tick svg{width:15px;height:15px}
.plan-row.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.plan-row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.plan-row .txt small{color:var(--ink-2);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.plan-row .txt strong{font-size:15px;font-weight:600}
.plan-row.done .txt strong{color:var(--ink-2)}
.plan-row .go{font-weight:700;font-size:13px;color:var(--accent);flex:none}
.plan-row.done .go{color:var(--good)}
.reward-strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:14px}
.reward-strip svg{width:18px;height:18px;flex:none}

.recall-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.recall-card h3{font-size:18px}

/* hero cards */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hero::before{content:"";position:absolute;right:-38px;top:-38px;width:120px;height:120px;border-radius:50%;background:var(--t,var(--accent));opacity:.14}
.hero::after{content:"";position:absolute;right:48px;top:-30px;width:56px;height:56px;border-radius:50%;background:var(--ground)}
.hero h1{font-size:28px;letter-spacing:-.02em;position:relative}
.hero p{color:var(--ink-2);max-width:40ch}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t,var(--accent))}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--t,var(--accent))}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* difficulty pips */
.diff{display:inline-flex;align-items:center;gap:5px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.pips{display:inline-flex;gap:2px;align-items:flex-end}
.pips i{width:4px;border-radius:1px;background:var(--line)}
.pips i:nth-child(1){height:6px}.pips i:nth-child(2){height:9px}.pips i:nth-child(3){height:12px}
.pips.l1 i:nth-child(-n+1),.pips.l2 i:nth-child(-n+2),.pips.l3 i{background:var(--dc)}
.pips.l1{--dc:var(--good)}.pips.l2{--dc:var(--spark)}.pips.l3{--dc:var(--bad)}

/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.row:hover{border-color:var(--t,var(--accent))}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--t);flex:none}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .txt strong{font-weight:600;font-size:15px}
.row .txt small{color:var(--ink-2);font-size:13px;display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;flex:none;white-space:nowrap}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.badge.done{background:var(--good-soft);color:var(--good)}
.badge.soon{background:var(--surface-2);color:var(--ink-2)}
.badge.warn{background:var(--bad-soft);color:var(--bad)}
.strength{display:flex;gap:3px;flex:none}
.strength i{width:6px;height:14px;border-radius:2px;background:var(--surface-2)}
.strength i.on{background:var(--good)}

/* learn tab */
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,72%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.path-card{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.path-card h3{font-size:17px}
.path-card p{font-size:13px;color:var(--ink-2);flex:1}
.mini{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.mini i{display:block;height:100%;background:var(--t,var(--accent));border-radius:99px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.cat[aria-pressed="true"]{border-color:var(--t);box-shadow:0 0 0 1px var(--t) inset}
.cat-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cat strong{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.cat strong i{width:9px;height:9px;border-radius:50%;background:var(--t);flex:none}
.cat small{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* words tab */
.lookup{display:flex;gap:8px}
.input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.wstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wstats div{padding:10px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.wstats b{display:block;font-family:var(--mono);font-size:19px}
.wstats span{font-size:11px;color:var(--ink-2);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tile:hover{border-color:var(--accent)}
.tile .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.tile .ic svg{width:17px;height:17px}
.tile strong{font-size:14px}
.tile small{font-size:12px;color:var(--ink-2)}
.tile.hot{border-color:var(--spark);background:var(--spark-soft)}
.tile.hot .ic{background:var(--spark);color:#fff}
.wotd{display:flex;flex-direction:column;gap:8px}
.wotd .word{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1}

/* word card */
.wc{display:flex;flex-direction:column;gap:14px}
.wc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wc-word{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1;word-break:break-word}
.wc-pron{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:6px;font-size:14px;color:var(--ink-2)}
.wc-pron .ipa{font-family:var(--mono);font-size:13px}
.wc-pron em{font-style:italic}
.speak{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.speak svg{width:21px;height:21px}
.wc-def{font-size:19px;line-height:1.45;font-weight:500}
.wc-ex{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.wc-ex li{font-style:italic;color:var(--ink-2);padding-left:14px;position:relative}
.wc-ex li::before{content:"“";position:absolute;left:0;top:-2px;font-family:var(--display);font-size:20px;color:var(--accent);font-style:normal}
.wc-ex b{color:var(--ink);font-weight:700}
.wc-rel{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:baseline;font-size:14px}
.wc-rel dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.wc-rel dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chip-s{padding:3px 9px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500}
.origin{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px}
.origin b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.wc-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}

/* progress */
.rank-card{position:relative;overflow:hidden}
.rank-card h2{font-size:28px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:22px;line-height:1.2}
.stat span{font-size:13px;color:var(--ink-2)}
.know{display:flex;flex-direction:column;gap:11px}
.k-row{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.k-row span:first-child{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.k-row span:first-child i{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.k-row .bar{height:12px}
.k-row .bar i{background:var(--t)}
.k-row .num{font-size:13px;text-align:right}
.goal-row{display:flex;flex-direction:column;gap:5px}
.goal-row div:first-child{display:flex;justify-content:space-between;font-size:14px}
.goal-row .bar{height:8px}
.goal-row.met .bar i{background:var(--good)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--spark) 40%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--spark) 70%,var(--surface-2))}
.heat i.l3{background:var(--spark)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.achs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:12px 6px;border-radius:14px;background:var(--surface-2)}
.ach .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-2)}
.ach .medal svg{width:21px;height:21px}
.ach strong{font-size:13px;line-height:1.2}
.ach small{font-size:11px;color:var(--ink-2);line-height:1.3}
.ach.got{background:var(--gold-soft)}
.ach.got .medal{background:var(--gold);color:var(--surface)}
.ach:not(.got){opacity:.72}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--bad-soft)}
.empty{text-align:center;padding:24px 16px;color:var(--ink-2);align-items:center}
.empty h3{color:var(--ink);font-size:19px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .count{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--good);color:#fff;font-family:var(--mono);font-size:11px;display:grid;place-items:center}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:40;background:var(--ground);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.player-inner{width:100%;max-width:520px;padding-inline:16px;padding-block:12px 16px;display:flex;flex-direction:column;gap:12px;height:100%}
.pbar{display:flex;align-items:center;gap:12px}
.close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.close svg{width:18px;height:18px}
.segs{flex:1;display:flex;gap:3px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.segs i.on{background:var(--t,var(--accent))}
.timer{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--spark);border-radius:99px;transition:width .25s linear}
.pscore{font-family:var(--mono);font-weight:700;font-size:15px;min-width:42px;text-align:right}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex}
.card{flex:1;display:flex;flex-direction:column;gap:16px;padding:22px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:min-content}
.card.enter{animation:in .26s ease both}
.card.tap{cursor:pointer}
@keyframes in{from{transform:translateX(18px);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.card h1{font-size:30px;letter-spacing:-.02em}
.card h2{font-size:24px}
.card .big{font-size:20px;line-height:1.45;font-weight:500}
.card .body{font-size:18px;line-height:1.6}
.card .hint{margin-top:auto;font-size:13px;color:var(--ink-2);text-align:center}
.keypoint{padding:14px 16px;border-radius:14px;background:var(--accent-soft);font-weight:600;font-size:16px;line-height:1.45}
.keypoint b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.golden{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;animation:pop .5s ease both}
.golden svg{width:14px;height:14px}
.qtext{font-size:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{text-align:left;padding:14px 15px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center}
.opts.two .opt{justify-content:center;font-size:18px;font-weight:700;padding:18px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.explain{padding:14px;border-radius:14px;font-size:15px}
.explain.good{background:var(--good-soft)}
.explain.bad{background:var(--bad-soft)}
.explain strong{display:block;margin-bottom:2px}
.reward{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto 0}
.reward .xp{font-family:var(--mono);font-weight:700;font-size:50px;color:var(--accent);animation:pop .55s ease both;line-height:1}
.lines{display:flex;flex-direction:column;gap:6px;width:100%}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;background:var(--surface-2);font-size:15px;text-align:left}
.lines b{font-family:var(--mono);white-space:nowrap}
.lines .ok b{color:var(--good)}
.lines .miss b{color:var(--bad)}
.callout{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;width:100%;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.callout.gold{background:var(--gold-soft);color:var(--gold)}
.callout.spark{background:var(--spark-soft);color:var(--spark)}
.callout.good{background:var(--good-soft);color:var(--good)}
.callout svg{width:18px;height:18px;flex:none}
.pfoot{display:flex;flex-direction:column;gap:8px}
.flash{perspective:1200px;flex:1;display:flex;cursor:pointer}
.flash-in{position:relative;flex:1;transition:transform .45s ease;transform-style:preserve-3d;min-height:320px}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.flash-face.back{transform:rotateY(180deg)}
.fb{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--ground);border-radius:24px 24px 0 0;padding-inline:16px;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{display:flex;justify-content:space-between;align-items:center}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* think & test */
.opts.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.big .opt{justify-content:center;font-size:30px;font-weight:700;padding:14px;font-family:var(--mono)}
.bigq{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.02em;display:block;text-align:center;padding:10px 0}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px 0}
.seq span{min-width:48px;padding:10px 8px;border-radius:12px;background:var(--surface-2);font-family:var(--mono);font-size:22px;font-weight:700;text-align:center}
.seq span.gap{background:var(--accent-soft);color:var(--accent)}
.memnum{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:.18em;text-align:center;padding:24px 0;word-break:break-all}
.stroop{display:block;text-align:center;font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:.02em;padding:8px 0}
.premises{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface-2);font-size:17px;font-weight:500}
.premises .conc{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700}
.arrowbig{display:block;text-align:center;font-size:64px;line-height:1;padding:6px 0}
.steps-list{margin:0;padding-left:20px;font-size:16px;font-weight:500;display:flex;flex-direction:column;gap:4px}
.pairs{display:flex;flex-direction:column;gap:8px}
.pairs div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:16px}
.pairs b{font-weight:700}
.pairs span{color:var(--ink-2);text-align:right}
.claim{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.3}
.coll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.coll button{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.coll button:hover{border-color:var(--accent)}
.coll .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.coll .ic svg{width:19px;height:19px}
.coll strong{font-size:15px}
.coll small{font-size:12px;color:var(--ink-2)}
.skill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.profile-grid div{padding:12px 10px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.profile-grid b{font-family:var(--mono);font-size:19px;line-height:1.2}
.profile-grid span{font-size:12px;color:var(--ink-2);font-weight:600}
.pill.lvl{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--body)}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pillars button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.pillars .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pillars .ic svg{width:17px;height:17px}

/* pillars */
.phero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--pc-soft)}
.phero .pic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--pc);color:var(--accent-ink);flex:none}
.phero .pic svg{width:28px;height:28px}
.phero .eyebrow{color:var(--pc)}
.phero h1{font-size:28px;letter-spacing:-.02em}
.phero p{font-size:14px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.plan-row .txt small{display:flex;align-items:center;gap:6px;color:var(--pc)}
.plan-row .txt small i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.plan-row .tick{border-color:color-mix(in srgb,var(--pc) 45%,var(--line))}
.plan-row .go{color:var(--pc)}
.tab[aria-selected="true"]{color:var(--pc)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:currentColor}


/* ---------- home: the five pillars ---------- */
.dayhead{display:flex;flex-direction:column;gap:10px;padding:4px 2px 0}
.dayhead .date{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dayhead h1{font-size:34px;line-height:1.05}
.quote{margin:0;padding:2px 0 2px 14px;border-left:2px solid var(--accent);font-family:var(--display);font-style:italic;font-size:19px;line-height:1.35;color:var(--ink)}
.quote cite{display:block;margin-top:4px;font-family:var(--body);font-style:normal;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.progress{display:flex;align-items:center;gap:12px}
.progress .bars{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.progress .bars i{height:6px;border-radius:2px;background:color-mix(in srgb,var(--c) 18%,var(--surface-2))}
.progress .bars i.on{background:var(--c)}
.progress b{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.colonnade{display:flex;flex-direction:column;gap:10px}
.pcard{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 16px 16px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:border-color .15s,transform .12s}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.pcard:hover{border-color:color-mix(in srgb,var(--pc) 55%,var(--line))}
.pcard:active{transform:scale(.99)}
.pcard .num-r{font-family:var(--display);font-weight:600;font-size:15px;color:var(--pc);width:22px;flex:none;text-align:center;letter-spacing:.04em}
.pcard .pic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--pc-soft);color:var(--pc);flex:none}
.pcard .pic svg{width:22px;height:22px}
.pcard .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard .txt .nm{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--ink)}
.pcard .txt .tg{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .txt .it{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.pcard .state{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pcard .state .mt{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pcard .seal{width:28px;height:28px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--pc) 45%,var(--line));display:grid;place-items:center;color:var(--pc)}
.pcard .seal svg{width:15px;height:15px}
.pcard.done{background:color-mix(in srgb,var(--pc) 6%,var(--surface))}
.pcard.done .seal{background:var(--pc);border-color:var(--pc);color:var(--surface)}
.pcard.done .txt .it{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-2) 50%,transparent)}
.donebar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:14px}
.donebar svg{width:18px;height:18px;flex:none}
.idea{padding:14px 16px;border-radius:var(--r);background:var(--surface-2);font-size:16px;line-height:1.5}
.idea b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pc,var(--accent));margin-bottom:4px}


/* ---------- the temple ---------- */
.temple-wrap{padding:6px 0 0}
.temple{display:block;width:100%;height:auto;overflow:visible}
.temple .pediment,.temple .entab,.temple .step{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.temple .tympanum{fill:var(--surface-2);stroke:none}
.temple .trig{fill:var(--surface-2)}
.temple .ped-t{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;fill:var(--ink-2);text-anchor:middle}
.temple.complete .pediment,.temple.complete .entab{fill:var(--gold-soft);stroke:var(--gold)}
.temple.complete .tympanum{fill:color-mix(in srgb,var(--gold) 22%,var(--gold-soft))}
.temple.complete .trig{fill:var(--gold)}
.temple.complete .ped-t{fill:var(--gold)}
.temple .col{cursor:pointer;outline:none}
.temple .col .hit{fill:transparent}
.temple .col .ghost>*{fill:color-mix(in srgb,var(--c) 7%,var(--surface));stroke:color-mix(in srgb,var(--c) 55%,var(--line));stroke-width:1.4;stroke-dasharray:4 3}
.temple .col .stone>*:not(.flutes){fill:var(--c);stroke:color-mix(in srgb,var(--c) 70%,#000);stroke-width:1}
.temple .col .flutes line{stroke:color-mix(in srgb,#fff 35%,transparent);stroke-width:1.2}
.temple .col .flutes.faint line{stroke:color-mix(in srgb,var(--c) 25%,transparent);stroke-dasharray:3 4}
.temple .col text{text-anchor:middle}
.temple .col .num{font-family:var(--display);font-weight:700;font-size:14px;fill:var(--c)}
.temple .col .nm{font-family:var(--body);font-weight:700;font-size:11px;fill:var(--ink)}
.temple .col:not(.raised) .nm{fill:var(--ink-2)}
.temple .col>g,.temple .col text{transition:transform .18s ease}
.temple .col:hover>g.ghost,.temple .col:hover>g.faint,.temple .col:focus-visible>g{transform:translateY(-3px)}
.temple .col:focus-visible .ghost>*{stroke-dasharray:none;stroke:var(--c);stroke-width:2}
.temple .stone.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:scaleY(0);opacity:.4}to{transform:scaleY(1);opacity:1}}

body[data-pillar="practical"],#player[data-pillar="practical"]{--accent:var(--p-practical);--accent-soft:var(--p-practical-soft);--pc:var(--p-practical);--pc-soft:var(--p-practical-soft)}
body[data-pillar="expression"],#player[data-pillar="expression"]{--accent:var(--p-expression);--accent-soft:var(--p-expression-soft);--pc:var(--p-expression);--pc-soft:var(--p-expression-soft)}
.bigquote{font-family:var(--display);font-style:italic;font-weight:600;font-size:28px;line-height:1.25;margin:0}
.bigquote::before{content:"“";display:block;font-size:64px;line-height:.6;color:var(--pc,var(--accent));font-style:normal}
.byline{display:flex;flex-direction:column;gap:2px}
.byline b{font-family:var(--display);font-size:22px}
.byline span{font-size:13px;color:var(--ink-2)}
.temple .col .gk{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-anchor:middle;fill:var(--ink-2)}
.temple .col.raised .gk{fill:var(--c)}
.temple.complete .col .gk{fill:var(--gold)}
.pcard .txt .gr{font-family:var(--display);font-style:italic;font-size:15px;color:var(--ink-2);margin-left:6px;font-weight:500;letter-spacing:0;text-transform:none}


/* library: pillars stacked as stone blocks in one column */
.colstack{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:0 4px}
.colstack .cap-a{height:12px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.colstack .cap-e{position:relative;height:12px;margin:-5px 18px 0;border-radius:0 0 10px 10px;background:var(--surface-2);border:1px solid var(--line);border-top:0}
.colstack .cap-e::before,.colstack .cap-e::after{content:"";position:absolute;top:-2px;width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.colstack .cap-e::before{left:-12px}.colstack .cap-e::after{right:-12px}
.colstack .block{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 22px;padding:15px 16px 15px 18px;text-align:left;border-radius:3px;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 26px,color-mix(in srgb,var(--pc) 9%,transparent) 26px 28px),var(--surface)}
.colstack .block::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:3px 0 0 3px;background:var(--pc)}
.colstack .block:hover{border-color:color-mix(in srgb,var(--pc) 60%,var(--line))}
.colstack .block .bt{display:flex;flex-direction:column;gap:1px;min-width:0}
.colstack .block .gk{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
.colstack .block strong{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1}
.colstack .block small{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;flex:0 1 auto;max-width:48%;line-height:1.35}
.colstack .plinth-a{height:10px;margin:0 14px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.colstack .plinth-b{height:12px;margin-top:-2px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}

.cat .cat-tag{font-size:12.5px;line-height:1.35;color:var(--ink-2);flex:1}
.cat{justify-content:space-between}


/* ---------- arena ---------- */
.grow,.arena-hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.grow:hover,.arena-hero:hover{border-color:var(--p-think)}
.grow .gi,.arena-hero .gi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--p-think-soft);color:var(--p-think)}
.grow .gi svg{width:19px;height:19px}
.grow .gt,.arena-hero .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.grow strong{font-size:15px;font-weight:600}
.grow small{font-size:12.5px;color:var(--ink-2)}
.gr-best{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:none}
.arena-hero{padding:16px;border-left:4px solid var(--p-think)}
.arena-hero .gi{width:48px;height:48px;border-radius:12px}
.arena-hero .gi svg{width:24px;height:24px}
.arena-hero .eyebrow{color:var(--p-think)}
.arena-hero strong{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.arena-hero small{font-size:13px;color:var(--ink-2)}
.arena-hero .btn{flex:none;background:var(--p-think);color:var(--surface)}
.chips.wrap{flex-wrap:wrap;overflow:visible}

/* ---------- scroll feed ---------- */
.feed{display:flex;flex-direction:column;gap:12px}
.byte{display:flex;flex-direction:column;gap:10px;padding:20px 18px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t)}
.byte h2{font-size:26px;line-height:1.15}
.byte-key{font-size:17px;font-weight:600;line-height:1.45}
.byte-body{font-size:15px;line-height:1.55;color:var(--ink-2)}
.byte .bigquote{font-size:24px}
.byte-go{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--t);padding:4px 0;text-align:left}
.byte-go svg{width:16px;height:16px;flex:none}
.badge.review{display:inline-flex;align-items:center;gap:4px;background:var(--good-soft);color:var(--good)}
.badge.review svg{width:12px;height:12px}

/* ---------- inner circle ---------- */
.adyton-door{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));
  background:radial-gradient(120% 140% at 0% 50%,color-mix(in srgb,var(--gold) 14%,var(--surface)),var(--surface) 60%)}
.adyton-door .kh{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--gold);color:var(--gold)}
.adyton-door .kh svg{width:24px;height:24px}
.adyton-door .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.adyton-door .eyebrow{color:var(--gold)}
.adyton-door strong{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1}
.adyton-door small{font-size:13px;color:var(--ink-2)}
.adyton-door.open .kh{background:var(--gold);color:var(--surface)}
.adyton-head .eyebrow{color:var(--gold)}
.sealed{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;padding:24px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));background:var(--surface)}
.sealed h2{font-size:28px}
.seal-lock{align-self:center;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold);background:var(--gold-soft)}
.seal-lock svg{width:40px;height:40px}
.sealed .goal-row{text-align:left}
.grow.locked{opacity:.55;cursor:default}

/* ---------- subjects ---------- */
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.area{display:flex;flex-direction:column;gap:6px;text-align:left;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.area:hover{border-color:var(--accent)}
.area strong{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.area small{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.subj{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t)}
.subj:hover{border-color:color-mix(in srgb,var(--t) 55%,var(--line));border-left-color:var(--t)}
.subj .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.subj strong{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15}
.subj small{font-size:13px;color:var(--ink-2)}
.subj .mini{height:5px}
.subj .laurel,.mastered-badge svg{width:26px;height:26px;color:var(--gold);flex:none}
.mastered-badge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--gold-soft);color:var(--gold);font-weight:700}
.steprow{display:flex;align-items:center;gap:10px}
.steprow .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.steprow.done .n{background:var(--good);color:#fff}
.steprow.done .n svg{width:14px;height:14px}
.steprow .row{flex:1;min-width:0}
.exam{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);border:1.5px dashed var(--line);background:var(--surface)}
.exam.open{border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.exam h3{font-size:22px;display:flex;align-items:center;gap:8px}
.exam h3 svg{width:22px;height:22px;color:var(--gold)}

/* ---------- library / review / arena ---------- */
.pagehead{display:flex;flex-direction:column;gap:4px;padding:4px 2px 0}
.pagehead h1{font-size:36px;line-height:1.05}
.pagehead p{color:var(--ink-2);font-size:14px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--ink-2);padding:4px 0}
.back svg{width:16px;height:16px;transform:rotate(180deg)}
.fold{display:flex;flex-direction:column}
.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold-t{display:flex;align-items:baseline;gap:10px;min-width:0}
.fold-t h2{font-size:23px}
.fold-pm{width:30px;height:30px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--accent);position:relative}
.fold-pm::before,.fold-pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;border-radius:1px;background:currentColor;transform:translate(-50%,-50%)}
.fold-pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .2s ease}
.fold[open] .fold-pm::after{transform:translate(-50%,-50%) rotate(0deg)}
.fold[open]>summary{margin-bottom:10px}
.fit-w{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;vertical-align:middle}
.speak.sm{display:inline-grid;width:38px;height:38px;vertical-align:middle;margin-left:8px}
.speak.sm svg{width:18px;height:18px}
.review-hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:var(--r);background:var(--p-remember-soft);border:1px solid color-mix(in srgb,var(--p-remember) 35%,var(--line));border-left:4px solid var(--p-remember)}
.review-hero .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.review-hero .eyebrow{color:var(--p-remember)}
.review-hero strong{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.review-hero small{font-size:13px;color:var(--ink-2)}
.review-hero .btn{flex:none;background:var(--p-remember);color:var(--surface)}
.mem-pct{font-size:22px;font-weight:700;color:var(--p-remember)}
.trial.agon{--h:var(--p-think);border-color:color-mix(in srgb,var(--p-think) 50%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--p-think) 20%,var(--surface)),var(--surface) 70%)}
.trial.agon::after{background:var(--p-think)}
.trial.agon .trial-ic{background:var(--p-think)}
.trial.agon strong{font-size:28px}
.trial.done .trial-ic,.trial.agon.done .trial-ic{background:var(--good)}
.trial.lexis{--h:var(--p-remember);border-color:color-mix(in srgb,var(--p-remember) 50%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--p-remember) 20%,var(--surface)),var(--surface) 70%)}
.trial.lexis::after{background:var(--p-remember)}
.trial.lexis .trial-ic{background:var(--p-remember)}
.trial.lexis.done .trial-ic{background:var(--p-remember)}
.rank-line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rank-line span{overflow:hidden;text-overflow:ellipsis}
.trial.pillarcard{--h:var(--pc);border-color:color-mix(in srgb,var(--pc) 50%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--pc) 20%,var(--surface)),var(--surface) 70%)}
.trial.pillarcard::after{background:var(--pc)}
.trial.pillarcard .trial-ic{background:var(--pc)}
.trial{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:18px 18px 16px;border-radius:20px;color:var(--ink);--h:var(--gold);border:1.5px solid color-mix(in srgb,var(--gold) 50%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 24%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.trial::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--gold);opacity:.1}
.trial-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.trial-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--gold);color:var(--surface);flex:none}
.trial-ic svg{width:26px;height:26px}
.trial .eyebrow,.contest .eyebrow{color:var(--h)}
.gr{text-transform:none;font-family:var(--display);font-style:italic;font-size:13px;letter-spacing:0}
.trial strong{font-family:var(--display);font-weight:700;font-size:clamp(24px,7.4vw,32px);line-height:1.05;white-space:nowrap}
.trial small{font-size:14px;color:var(--ink-2);line-height:1.4;max-width:34ch}
.trial-halves{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.trial-halves span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));font-size:12.5px;font-weight:600;color:var(--ink)}
.trial-halves svg{width:14px;height:14px;color:var(--gold)}
.trial-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trial.done .trial-ic{background:var(--good)}
.contest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;--h:var(--p-think);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--p-think) 40%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--p-think) 16%,var(--surface)),var(--surface) 70%)}
.contest-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--p-think);color:var(--surface);flex:none}
.contest-ic svg{width:23px;height:23px}
.contest .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.contest .eyebrow{font-size:10px}
.contest strong{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.contest small{font-size:13px;color:var(--ink-2)}
.contest .btn{flex:none;background:var(--p-think);color:var(--surface)}
.contest.done .contest-ic{background:var(--good)}
.daily{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 14px 14px;border-radius:18px;color:var(--ink);border:1.5px solid color-mix(in srgb,var(--h) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--h) 22%,var(--surface)),var(--surface) 75%);box-shadow:var(--shadow)}
.dcard.gk{--h:var(--gold)}
.dcard.dq{--h:var(--p-test)}
.dcard::after{content:"";position:absolute;right:-26px;top:-26px;width:84px;height:84px;border-radius:50%;background:var(--h);opacity:.12}
.dcard-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--h);color:var(--surface);margin-bottom:6px}
.dcard-ic svg{width:22px;height:22px}
.dcard .eyebrow{color:var(--h);font-size:10px}
.dcard strong{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.dcard small{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.ddots{display:flex;gap:3px;margin:8px 0 4px}
.ddots i{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--h) 18%,var(--surface-2))}
.ddots i.on{background:var(--h)}
.dcard-cta{margin-top:auto;padding-top:8px;font-weight:700;font-size:13px;color:var(--h)}
.dcard.done .dcard-ic{background:var(--good)}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gtile{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 12px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--h);min-height:112px;transition:border-color .15s,transform .12s}
.gtile:hover{border-color:color-mix(in srgb,var(--h) 55%,var(--line));border-top-color:var(--h)}
.gtile:active{transform:scale(.98)}
.gtile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:auto;padding-bottom:10px}
.gtile-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--hs);color:var(--h);flex:none}
.gtile-ic svg{width:19px;height:19px}
.gtile-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-2);padding:3px 7px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.gtile-badge.new{background:var(--hs);color:var(--h)}
.gtile-badge.done{background:var(--good-soft);color:var(--good)}
.gtile strong{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1}
.gtile small{font-size:12px;color:var(--ink-2)}
.qgroup{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.qgroup-h{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.qgroup-h span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.qgroup-h small{font-size:12.5px;color:var(--ink-2)}
.dayhead,.pagehead{text-align:center;align-items:center}
.pagehead p{max-width:36ch}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-2);pointer-events:none}
.search .input{width:100%;padding-left:40px}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px 13px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc)}
.ptile:hover{border-color:color-mix(in srgb,var(--pc) 55%,var(--line));border-top-color:var(--pc)}
.ptile:last-child{grid-column:span 2}
.ptile .gk{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pc)}
.ptile strong{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.ptile small{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.grouph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.grouph h3{font-size:21px;display:flex;align-items:center;gap:8px}
.grouph h3 i{width:9px;height:9px;border-radius:50%;background:var(--t);flex:none}
.qrow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.qrow:hover{border-color:var(--p-expression)}
.qrow q{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.3;quotes:"“" "”"}
.qrow span{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.results{display:flex;flex-direction:column;gap:14px}


@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- premium, settings, legal ---------- */
.disclaimer{font-size:12.5px;line-height:1.45;color:var(--ink-2);padding:10px 12px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--gold)}
.set-list{display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px}
.set-row small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.set-row .val{font-weight:700;font-size:13px;color:var(--accent);flex:none}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--good)}.switch.on::after{transform:translateX(18px)}
.pw-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.pw-hero .medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.pw-hero .medal svg{width:34px;height:34px}
.pw-hero h2{font-size:30px}
.pw-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.pw-list li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.pw-list li svg{width:18px;height:18px;flex:none;color:var(--good);margin-top:2px}
.plans{display:flex;flex-direction:column;gap:8px}
.plan{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);text-align:left;width:100%}
.plan strong{font-size:16px;display:block}.plan small{color:var(--ink-2);font-size:13px}
.plan .price{font-family:var(--mono);font-weight:700;font-size:16px;text-align:right}
.plan .save{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.plan.best{border-color:var(--gold)}
.fine{font-size:11.5px;line-height:1.5;color:var(--ink-2);text-align:center}
.fine-links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.fine-links button{color:var(--accent);font-weight:600}
</style>

/* ---- generators ---- */
function nearNums(ans, n = 3) { const set = new Set([ans]); for (const d of shuffle([1, -1, 2, -2, 10, -10, 3, -3, 5, -5, 4, -4])) { if (set.size > n) break; if (ans + d >= 0) set.add(ans + d); } return shuffle([...set]); }
function numQ(prompt, ans, explain, sub) { const o = nearNums(ans); return { prompt, sub, options: o.map(String), answer: o.indexOf(ans), explain }; }
function genMaths() {
  const kids = aud() === "kids", op = pick(kids ? ["+", "−", "+", "×"] : ["+", "−", "×", "÷"]);
  let a, b, ans;
  if (op === "+") { a = rand(kids ? 12 : 90) + (kids ? 1 : 10); b = rand(kids ? 12 : 90) + (kids ? 1 : 10); ans = a + b; }
  else if (op === "−") { a = rand(kids ? 15 : 90) + (kids ? 5 : 20); b = rand(a - 1) + 1; ans = a - b; }
  else if (op === "×") { a = rand(kids ? 5 : 11) + 2; b = rand(kids ? 5 : 11) + 2; ans = a * b; }
  else { b = rand(11) + 2; ans = rand(11) + 2; a = b * ans; }
  return { t: "q", q: numQ(`<span class="bigq">${a} ${op} ${b}</span>`, ans, `${a} ${op} ${b} = ${ans}`) };
}
function genPattern() {
  const kids = aud() === "kids", type = pick(kids ? ["arith", "arith", "double"] : ["arith", "double", "triple", "square", "alt", "fib", "tri"]);
  let seq = [], rule = "";
  if (type === "arith") { const a = rand(9) + 1, d = rand(kids ? 4 : 12) + 2; for (let i = 0; i < 6; i++) seq.push(a + i * d); rule = `Add ${d} each time.`; }
  if (type === "double") { const a = rand(4) + 1; for (let i = 0; i < 6; i++) seq.push(a * 2 ** i); rule = "Double each time."; }
  if (type === "triple") { const a = rand(3) + 1; for (let i = 0; i < 5; i++) seq.push(a * 3 ** i); rule = "Multiply by 3 each time."; }
  if (type === "square") { const n = rand(4) + 1; for (let i = 0; i < 6; i++) seq.push((n + i) ** 2); rule = "Square numbers."; }
  if (type === "alt") { const x = rand(6) + 2, y = rand(6) + 2; seq.push(rand(9) + 1); for (let i = 1; i < 7; i++) seq.push(seq[i - 1] + (i % 2 ? x : y)); rule = `Alternately add ${x} and ${y}.`; }
  if (type === "fib") { const a = rand(3) + 1; seq = [a, a + rand(3) + 1]; for (let i = 2; i < 7; i++) seq.push(seq[i - 1] + seq[i - 2]); rule = "Each number is the sum of the two before it."; }
  if (type === "tri") { for (let n = 1; n <= 7; n++) seq.push(n * (n + 1) / 2); rule = "The gaps grow by 1 each time (triangular numbers)."; }
  const h = rand(seq.length - 2) + 2, ans = seq[h];
  return { t: "q", q: numQ(`<span class="seq">${seq.map((v, i) => i === h ? '<span class="gap">?</span>' : `<span>${v}</span>`).join("")}</span>`, ans, rule, "Find the missing number") };
}
function buildMemory() {
  const kids = aud() === "kids", lens = kids ? [3, 3, 4, 4, 5, 5, 6, 6] : [4, 5, 5, 6, 6, 7, 7, 8];
  return lens.flatMap((n, i) => {
    let d = ""; for (let k = 0; k < n; k++) d += k === 0 ? rand(9) + 1 : rand(10);
    const opts = new Set([d]);
    for (let g = 0; opts.size < 4 && g < 40; g++) {
      const arr = d.split(""); const j = rand(n - 1);
      if (g % 2) [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; else arr[j + (rand(2))] = String((+arr[j] + 1 + rand(8)) % 10);
      if (arr[0] !== "0") opts.add(arr.join(""));
    }
    const o = shuffle([...opts]);
    return [{ t: "mem-show", seq: d, head: `Round ${i + 1} of ${lens.length}` }, { t: "q", q: { prompt: "Which number did you see?", options: o, answer: o.indexOf(d), big: n <= 6, explain: `It was ${d}.` }, head: `Round ${i + 1} of ${lens.length}` }];
  });
}
const NONSENSE = ["bloops", "razzies", "wugs", "zorbs", "flims", "gleeps", "tovs", "snarks", "quibs", "drents"];
const LOGIC = [
  { p: ["All {A} are {B}.", "All {B} are {C}."], c: "All {A} are {C}.", v: true, e: "Every {A} is a {B}, and every {B} is a {C}, so every {A} must be a {C}." },
  { p: ["All {A} are {B}.", "Some {B} are {C}."], c: "Some {A} are {C}.", v: false, e: "The {B} that are {C} might not include any {A}." },
  { p: ["No {A} are {B}.", "All {C} are {A}."], c: "No {C} are {B}.", v: true, e: "Every {C} is an {A}, and no {A} is a {B}, so no {C} can be a {B}." },
  { p: ["All {A} are {B}.", "Sam is one of the {A}."], c: "Sam is one of the {B}.", v: true, e: "Sam is an {A}, and all {A} are {B}." },
  { p: ["All {A} are {B}.", "Sam is one of the {B}."], c: "Sam is one of the {A}.", v: false, e: "There may be {B} that aren't {A}. Sam could be one of them." },
  { p: ["Some {A} are {B}.", "All {B} are {C}."], c: "Some {A} are {C}.", v: true, e: "The {A} that are {B} must also be {C}." },
  { p: ["If something is one of the {A}, it glows.", "This thing glows."], c: "This thing is one of the {A}.", v: false, e: "Other things might glow too. This mistake is called affirming the consequent." },
  { p: ["If something is one of the {A}, it glows.", "This thing doesn't glow."], c: "This thing isn't one of the {A}.", v: true, e: "All {A} glow, so something that doesn't glow can't be one of them." },
  { p: ["No {A} are {B}.", "Some {C} are {A}."], c: "Some {C} are not {B}.", v: true, e: "The {C} that are {A} can't be {B}." },
  { p: ["Some {A} are {B}.", "Some {B} are {C}."], c: "Some {A} are {C}.", v: false, e: "The two 'some' groups might not overlap at all." },
];
function genLogic() {
  const t = pick(LOGIC), [A, B, C] = shuffle(NONSENSE); const f = x => x.replaceAll("{A}", A).replaceAll("{B}", B).replaceAll("{C}", C);
  return { t: "q", q: { prompt: `<div class="premises">${t.p.map(x => `<span>${f(x)}</span>`).join("")}<span class="conc">So: ${f(t.c)}</span></div>`, sub: "Does the conclusion definitely follow?", options: ["Yes", "No"], answer: t.v ? 0 : 1, explain: (t.v ? "It follows. " : "It doesn't follow. ") + f(t.e) } };
}
const COLOURS = [["Red", "#E5484D"], ["Blue", "#3E63DD"], ["Green", "#2F9E5B"], ["Orange", "#F76B15"], ["Purple", "#8E4EC6"]];
function genStroop() {
  const [word] = pick(COLOURS); let ink = pick(COLOURS);
  if (Math.random() < 0.75) while (ink[0] === word) ink = pick(COLOURS);
  const others = shuffle(COLOURS.map(c => c[0]).filter(n => n !== ink[0] && n !== word)).slice(0, word === ink[0] ? 3 : 2);
  const o = shuffle([ink[0], ...(word === ink[0] ? [] : [word]), ...others]);
  return { t: "q", q: { prompt: `<span class="stroop" style="color:${ink[1]}">${word.toUpperCase()}</span>`, sub: "What colour is the ink?", options: o, answer: o.indexOf(ink[0]) } };
}
const ARROWS = ["↑", "→", "↓", "←"];
const MOVES = [
  { t: "Rotate 90° clockwise", f: d => (d + 1) % 4 }, { t: "Rotate 90° anticlockwise", f: d => (d + 3) % 4 }, { t: "Rotate 180°", f: d => (d + 2) % 4 },
  { t: "Mirror it left-to-right", f: d => d === 1 ? 3 : d === 3 ? 1 : d }, { t: "Flip it upside down", f: d => d === 0 ? 2 : d === 2 ? 0 : d },
];
function genSpatial() {
  const start = rand(4), n = aud() === "kids" ? 1 : 2 + (Math.random() < 0.35 ? 1 : 0), moves = Array.from({ length: n }, () => pick(MOVES));
  const end = moves.reduce((d, m) => m.f(d), start);
  return { t: "q", q: { prompt: `<span class="arrowbig">${ARROWS[start]}</span><ol class="steps-list">${moves.map(m => `<li>${m.t}</li>`).join("")}</ol>`, sub: "Which way does the arrow point now?", options: ARROWS.slice(), answer: end, big: true, explain: `It ends up pointing ${["up", "right", "down", "left"][end]}.` } };
}
function mcq(item, head) { const o = shuffle(item.o.map((t, i) => ({ t, i }))); return { t: "q", head, q: { prompt: esc(item.q), options: o.map(x => esc(x.t)), answer: o.findIndex(x => x.i === item.a), explain: esc(item.e) } }; }
function bankSteps(bank, n, kind) {
  const pool = bank.filter(x => aud() === "adult" || x.k);
  return shuffle(pool).slice(0, n).map((x, i) => { const s = mcq(x, `${kind === "scenario" ? x.topic : "Brain teaser"} · ${i + 1} of ${Math.min(n, pool.length)}`); return s; });
}
function buildGK(o = {}) {
  let pool = WB.GK.filter(x => aud() === "adult" || x.k);
  if (o.cat) pool = pool.filter(x => x.cat === o.cat);
  const list = o.cat ? shuffle(pool).slice(0, 10) : pool.slice().sort((a, b) => hashStr(today() + a.q) - hashStr(today() + b.q)).slice(0, 10);
  return list.map((x, i) => mcq(x, `${WB.GK_CATS[x.cat]} · ${i + 1} of ${list.length}`));
}
function buildFOB() {
  const pool = WB.CLAIMS.filter(x => aud() === "adult" || x.k), labels = aud() === "kids" ? ["Fact", "Fiction"] : ["Fact", "Fiction"];
  return shuffle(pool).slice(0, 10).map((x, i) => ({ t: "q", head: `${actName(actById("fob"))} · ${i + 1} of ${Math.min(10, pool.length)}`,
    q: { prompt: `<span class="claim">“${esc(x.c)}”</span>`, options: labels, answer: x.t ? 0 : 1, explain: esc(x.e), verdict: x.t ? "It's a fact." : `It's ${labels[1].toLowerCase()}.` } }));
}
function buildCapitals() {
  const five = shuffle(WB.CAPITALS).slice(0, 5), caps = WB.CAPITALS.map(c => c[1]);
  return [{ t: "learn-list", title: "Learn these five capitals", pairs: five }, ...shuffle(five).map(([c, cap], i) => { const m = mcOptions(cap, caps); return { t: "q", head: `Capital cities · ${i + 1} of 5`, q: { prompt: `What is the capital of <b>${esc(c)}</b>?`, options: m.options.map(esc), answer: m.answer, explain: `${esc(cap)} is the capital of ${esc(c)}.` } }; })];
}
/* Which came first? The older event of each pair must clearly predate the other:
   the further back in time, the wider the gap has to be, because older dates are less exact. */
const yearStr = x => (x.c ? "c. " : "") + (x.y < 0 ? Math.abs(x.y) + " BC" : x.y < 1000 ? "AD " + x.y : String(x.y));
function timelineGap(a, b) { const old = Math.min(a.y, b.y); return old < 0 ? 300 : old < 1000 ? 100 : old < 1500 ? 50 : old < 1800 ? 15 : 8; }
function buildTimeline() {
  const ev = shuffle(WB.EVENTS || []), used = new Set(), pairs = [];
  for (let g = 0; pairs.length < 10 && g < 400; g++) {
    const a = pick(ev), b = pick(ev);
    if (a === b || used.has(a) || used.has(b) || Math.abs(a.y - b.y) < timelineGap(a, b) || (a.c || b.c) && Math.abs(a.y - b.y) < 2 * timelineGap(a, b)) continue;
    used.add(a); used.add(b); pairs.push([a, b]);
  }
  return pairs.map(([a, b], i) => { const first = a.y < b.y ? a : b;
    return { t: "q", head: `Which came first? · ${i + 1} of ${pairs.length}`, q: { prompt: "Which happened first?", options: [esc(a.e), esc(b.e)], answer: a === first ? 0 : 1, stack: true,
      explain: `${esc(a.e)}: ${yearStr(a)}.<br>${esc(b.e)}: ${yearStr(b)}.` } }; });
}
function buildMemWords() {
  const pool = lib(), fresh = pool.filter(e => !state.words[e.w]), five = shuffle(fresh.length >= 5 ? fresh : pool).slice(0, 5);
  return [{ t: "learn-list", title: "Memorise these five words", pairs: five.map(e => [e.w, e.def]), words: true }, ...shuffle(five).map((e, i) => ({ ...({ t: "q", q: qFromDef(e) }), head: `Recall · ${i + 1} of 5` }))];
}
function buildActivity(a, o) {
  if (a.build) return a.build(o);
  const steps = [], seen = new Set();
  for (let g = 0; steps.length < a.count && g < 80; g++) { const s = a.gen(); if (!seen.has(s.q.prompt)) { seen.add(s.q.prompt); steps.push(s); } }
  return steps.map((s, i) => ({ ...s, head: s.head || `${actName(a)} · ${i + 1} of ${steps.length}` }));
}

/* ============ 2. STATE — per profile, saved on this device ============ */
const STORE_KEY = "wisebyte.v3";
const freshStats = () => ({ answered: 0, correct: 0, run: 0, bestRun: 0, perfectLessons: 0, goldens: 0, recalls: 0, recallsRight: 0,
  challenges: 0, beatYesterday: 0, dailyCompletes: 0, sentences: 0, lookups: 0, speedBest: 0, perfectFob: 0, perfectTimeline: 0, perfectOpposites: 0, perfectCapitals: 0, perfectCritical: 0, perfectGk: 0 });
const freshProfile = () => ({ xp: 0, streak: 0, best: 0, lastActive: null, freezes: 1, days: {}, lessons: {}, words: {}, custom: {}, ach: {}, scores: {}, vocab: null, quotes: {}, mastered: {}, inner: {}, stats: freshStats() });
const mergeProfile = p => Object.assign(freshProfile(), p || {}, { stats: Object.assign(freshStats(), (p && p.stats) || {}) });
let store = loadStore();
let state = store.profiles[store.active];
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.profiles) return { active: "adult", profiles: { adult: mergeProfile(s.profiles.adult) }, updated: s.updated || 0 };
  } catch (e) {}
  return { active: "adult", profiles: { adult: freshProfile() } };
}
function save() {
  store.updated = Date.now();
  const json = JSON.stringify(store);
  try { localStorage.setItem(STORE_KEY, json); } catch (e) {}
  // In the iPhone app, also keep a copy in native storage (iOS can clear web storage; this can't be).
  try { const pf = nativePrefs(); if (pf) pf.set({ key: STORE_KEY, value: json }); } catch (e) {}
}
const nativePlugin = name => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name]) || null;
const nativePrefs = () => nativePlugin("Preferences");
const isNativeApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
async function hydrateNative() {
  const pf = nativePrefs(); if (!pf) return;
  try {
    const { value } = await pf.get({ key: STORE_KEY });
    const s = value ? JSON.parse(value) : null;
    if (s && s.profiles && (s.updated || 0) > (store.updated || 0)) {
      store = { active: "adult", profiles: { adult: mergeProfile(s.profiles.adult) }, updated: s.updated };
      state = store.profiles.adult; render();
    } else save();
  } catch (e) {}
}

/* ============ 3. HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => keyOf(new Date());

const xpForLevel = n => 50 * (n - 1) * n;           // total XP needed to reach level n
const level = () => { let n = 1; while (state.xp >= xpForLevel(n + 1)) n++; return n; };

  n = Math.round(n); if (n <= 0) return 0;
  const before = level();
  state.xp += n; day().xp += n;
  if (level() > before) pendingLevelUp = level();

}

/* streak: a day counts when the daily goal (a lesson + a new word) is met */
function liveStreak() {
  if (!state.lastActive) return 0;
  const gap = daysBetween(state.lastActive, today());
  if (gap <= 1) return state.streak;
  if (gap === 2 && state.freezes > 0) return state.streak;
  return 0;
}
function touchStreak() {
  const t = today(); if (state.lastActive === t) return;
  const gap = state.lastActive ? daysBetween(state.lastActive, t) : null;
  if (gap === 1) state.streak++;
  else if (gap === 2 && state.freezes > 0) { state.freezes--; state.streak++; toast("A streak freeze saved your streak"); }
  else state.streak = 1;
  state.lastActive = t; state.best = Math.max(state.best, state.streak);

}

/* spaced repetition */
function srUpdate(rec, right) {
  if (right) { if (rec.due <= today()) { rec.box = Math.min(rec.box + 1, RULES.intervals.length - 1); rec.due = addDays(today(), RULES.intervals[rec.box]); } }
  else { rec.box = 0; rec.due = addDays(today(), 1); }
}

  srUpdate(r, right); state.stats.recalls++; if (right) state.stats.recallsRight++;
}
function addWord(w, source) {

  day().words++;

}

const struggling = w => { const r = state.words[w]; return !!r && (r.lapses >= 2 || (r.wrong >= 2 && r.wrong >= r.right)); };

  return items.sort((a, b) => a.due.localeCompare(b.due)).slice(0, reviewsLeft());
}

/* mastery blends your best quiz score with how well you still remember it */
function lessonMastery(l) {
  const r = state.lessons[l.id]; if (!r) return 0;
  return 0.5 * (r.best / l.quiz.length) + 0.5 * Math.min(r.box, 4) / 4;

function mcOptions(right, pool, n = 3) { const others = shuffle(pool.filter(x => x !== right)).slice(0, n); const o = shuffle([right, ...others]); return { options: o, answer: o.indexOf(right) }; }

function qLesson(l, qi, sub) {
  const q = l.quiz[qi]; const o = shuffle(q.o.map((t, i) => ({ t, i })));
  return { src: "lesson", id: l.id, qi, s: q.s, prompt: esc(q.q), sub, options: o.map(x => esc(x.t)), answer: o.findIndex(x => x.i === q.a), explain: esc(q.e) };
}
function qMeaning(e) { const m = mcOptions(e.def, wordPool(e, false).map(x => x.def)); return { src: "word", w: e.w, lvl: e.lvl, prompt: `What does <b>${esc(e.w)}</b> mean?`, options: m.options.map(esc), answer: m.answer, explain: esc(`${e.w}: ${e.def}`) }; }

  const sentence = e.blank && e.blank.includes("___") ? e.blank : `${e.ex[0] || ""}`.replace(new RegExp(e.w, "i"), "___");
  return { src: "word", w: e.w, sub: "Complete the sentence", prompt: esc(sentence).replace("___", "<span class='num'>_____</span>"), options: m.options.map(esc), answer: m.answer, explain: esc(sentence.replace("___", e.w)) };
}
function qTF(e) {

  const d = truth ? e.def : other.def;
  return { src: "word", w: e.w, sub: "True or false?", prompt: `<b>${esc(e.w)}</b> means: ${esc(d)}`, options: ["True", "False"], answer: truth ? 0 : 1, explain: esc(`${e.w}: ${e.def}`) };

}

function recommendNext() {
  const cats = categoryStats().filter(c => c.learned < c.total).sort((a, b) => a.pct - b.pct || a.learned - b.learned);
  for (const c of cats) { const l = lessons().filter(x => x.cat === c.key && !state.lessons[x.id]).sort((a, b) => LEVELS[a.level].n - LEVELS[b.level].n)[0]; if (l) return l; }
  return null;
}
function recommendCard() {
  const r = recommendNext(); if (!r) return "";

}

/* ---------- Scroll: an endless feed of bite-sized ideas ---------- */
let scrollFeed = null, scrollShown = 0;
function buildFeed() {
  const items = [];

  quotePool().forEach(q => items.push({ t: "quote", q }));

  const sh = shuffle(items), out = [];

}

function renderScroll() {

function moreFeed() {
  if (tab !== "scroll" || !scrollFeed) return;
  if (scrollShown >= scrollFeed.length) { scrollFeed = scrollFeed.concat(buildFeed()); }
  const from = scrollShown; scrollShown += 10;
  const f = $("#feed"); if (f) f.insertAdjacentHTML("beforeend", scrollFeed.slice(from, scrollShown).map(feedCard).join(""));

let feedObs = null;
function watchFeed() {

let P = null;
function start(p) {
  P = Object.assign({ i: 0, answered: null, score: 0, t0: Date.now(), drawn: -1 }, p);
  $("#player").hidden = false; document.body.style.overflow = "hidden";
  if (P.timed) { P.endAt = Date.now() + P.timed * 1000; P.timer = setInterval(tick, 250); }
  enter(); drawPlayer();
}
function closePlayer() {
  if (!P) return;
  if (P.timer) clearInterval(P.timer);
  if (P.memTimer) clearTimeout(P.memTimer);
  const secs = Math.min((Date.now() - P.t0) / 1000, 1200); if (secs > 3) day().secs += secs;

function startMastery(id) {
  const x = subjectById(id); if (!x) return;
  const ls = x.steps.map(lessonById).filter(Boolean);
