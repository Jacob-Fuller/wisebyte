<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="color-scheme" content="dark">
<title>Wisebyte - Scroll</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wisebyte - Scroll">
<style>
/* Fonts are bundled with the app (SIL Open Font License, see fonts/), so they work offline */
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond.woff) format("woff");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant-garamond-italic.woff) format("woff");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff) format("woff");font-weight:300 900;font-style:normal;font-display:swap}
</style>
<style>
  /* Single dark theme, matching the Wisebyte app */
  :root{
    color-scheme:dark;
    --bg:#141210; --card:#1D1A16; --card-2:#24201B; --line:#353029;
    --ink:#F3EEE6; --body:#A59D91; --muted:#7D766C;
    --bronze:#C08F5C;
    --good:#8DB57F; --bad:#D98272;
    --f-serif:"Cormorant Garamond","Cormorant",Garamond,"Iowan Old Style","Palatino",Georgia,serif;
    --f-sans:"Figtree","Avenir Next",-apple-system,"Segoe UI",system-ui,sans-serif;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer;padding:0}
  a{color:var(--bronze)}
  :focus-visible{outline:2px solid var(--bronze);outline-offset:3px;border-radius:6px}

  .app{height:100%;display:flex;flex-direction:column}

  /* Header */
  .top{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + var(--sat)) 16px 10px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .top-row,.chips{max-width:640px;width:100%;margin-inline:auto}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .mark{min-width:0;overflow:hidden;text-overflow:clip;font-family:var(--f-serif);font-weight:600;font-size:clamp(1.3rem,5.6vw,1.65rem);line-height:1;letter-spacing:.01em;white-space:nowrap}
  .mark .badge{font-family:var(--f-sans);font-size:12px;font-weight:700;letter-spacing:.12em;padding:3px 7px;border-radius:6px;background:var(--bronze);color:#1A140D;margin-left:4px;position:relative;top:-2px}
  .mark{display:flex;align-items:center;gap:6px;font-size:clamp(1.15rem,5vw,1.65rem)}
  .mark svg{width:20px;height:20px;color:var(--bronze);flex:none}
  @media (max-width:420px){ .stat{padding:0 8px} .stats{gap:4px} }
  .stats{display:flex;gap:5px;align-items:center;flex:none}
  .stat{font-size:.78rem;color:var(--body);min-height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--card)}
  .stat b{color:var(--ink);font-weight:600}
  button.stat:hover{border-color:var(--bronze)}
  .icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--body);flex:none}
  .icon-btn:hover{color:var(--ink)}
  .icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #menuBtn{margin-right:-6px}
  @media (max-width:370px){ #todayStat{display:none} }
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:auto;padding-block:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:40px;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:0 15px;border-radius:999px;border:1px solid var(--line);color:var(--body);background:var(--card)}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze);color:#1A140D}

  /* Feed */
  .feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding-inline:16px;-webkit-overflow-scrolling:touch}
  .list{max-width:640px;margin-inline:auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
  .loader{height:calc(40px + var(--sab))}

  .card{--c:var(--bronze);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:22px;padding:14px 22px 22px;display:flex;flex-direction:column;gap:12px;animation:rise .35s ease-out both}
  @keyframes rise{from{transform:translateY(10px);opacity:.4}}
  .cat{display:flex;align-items:center;gap:9px;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 78%,var(--body));min-height:44px}
  .cat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .cat .acts{margin-left:auto;margin-right:-12px;display:flex}
  .cat .icon-btn{color:var(--muted)}
  .cat .icon-btn svg{width:20px;height:20px}
  .cat .icon-btn:hover{color:var(--ink)}
  .cat [data-keep][aria-pressed="true"]{color:var(--c)}
  .cat [data-keep][aria-pressed="true"] svg{fill:currentColor}

  .title{font-family:var(--f-serif);font-weight:500;font-size:clamp(1.9rem,6.4vw,2.4rem);line-height:1.08;margin:0;text-wrap:balance}
  .head{font-weight:700;font-size:1.17rem;line-height:1.42;margin:0;color:var(--ink);text-wrap:pretty}
  .head.quote{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:1.55rem;line-height:1.32}
  .txt{font-size:1.02rem;line-height:1.65;color:var(--body);margin:0}
  .txt em{color:var(--ink);opacity:.85}
  .meta{font-size:.9rem;color:var(--muted)}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
  ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:1.02rem;line-height:1.55;color:var(--body)}
  ol.steps li::before{content:counter(s);font-weight:700;color:var(--c)}

  .more{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:1.02rem;font-weight:500;color:color-mix(in srgb,var(--c) 80%,var(--body));margin-block:-6px -10px;text-align:left}
  .more:hover{color:var(--c)}
  .more svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .2s;flex:none}
  .more[aria-expanded="true"] svg{transform:rotate(90deg)}
  .extra{border-left:2px solid var(--c);padding-left:14px}

  .choice{display:flex;gap:10px;margin-top:2px}
  .btn{flex:1;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);font-weight:600;font-size:.95rem;letter-spacing:.04em}
  .btn:hover:not([disabled]){border-color:var(--c)}
  .btn[disabled]{cursor:default;opacity:.55}
  .btn.right{border-color:var(--good);color:var(--good);opacity:1}
  .btn.wrong{border-color:var(--bad);color:var(--bad);opacity:1}
  .btn.solid{background:var(--bronze);border-color:var(--bronze);color:#1A140D;flex:none;align-self:flex-start;padding-inline:22px}
  .verdict{font-weight:700;font-size:1rem;margin:0}
  .verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}

  /* Sheet (kept, reader, settings, privacy) */
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
  .sheet-in{background:var(--bg);width:100%;max-width:640px;height:min(88%,calc(100% - var(--sat) - 12px));border-radius:22px 22px 0 0;border-top:3px solid var(--bronze);display:flex;flex-direction:column;animation:up .22s ease-out both}
  @keyframes up{from{transform:translateY(24px);opacity:.5}}
  .sheet-head{flex:none;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;flex:1;font-family:var(--f-serif);font-weight:600;font-size:1.6rem;padding-left:6px}
  .sheet-head .text-btn{min-height:44px;padding:0 12px;color:var(--body);font-weight:500}
  .sheet-head .text-btn:hover{color:var(--ink)}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(24px + var(--sab))}
  .kept-list{list-style:none;margin:0;padding:0}
  .kept-list li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .kept-open{flex:1;min-width:0;text-align:left;padding:12px 0;min-height:56px}
  .kept-list .kl{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .kept-list .kt{font-family:var(--f-serif);font-size:1.25rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .kept-list .rm{min-height:44px;padding:0 8px;color:var(--muted);font-size:.88rem}
  .kept-list .rm:hover{color:var(--bad)}
  .empty{color:var(--body);padding:20px 0;margin:0;line-height:1.5}

  .group{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 18px;overflow:hidden}
  .group-title{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:left;text-decoration:none;color:var(--ink)}
  .row:first-child{border-top:0}
  .row small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
  button.row:hover,a.row:hover{background:var(--card-2)}
  .row .val{color:var(--body);font-variant-numeric:tabular-nums}
  .row.danger{color:var(--bad)}
  .row input[type=time]{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--ink)}
  .switch{position:relative;width:51px;height:31px;flex:none}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
  .switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
  .switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--ink);transition:transform .2s}
  .switch input:checked+span{background:var(--bronze)}
  .switch input:checked+span::after{transform:translateX(20px)}
  .switch input:focus-visible+span{outline:2px solid var(--bronze);outline-offset:3px}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin:8px 0 0;line-height:1.6}
  .prose{color:var(--body);line-height:1.65;font-size:1rem}
  .prose h3{color:var(--ink);font-size:1.02rem;margin:20px 0 4px}
  .prose p{margin:0 0 10px}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;font-weight:500;opacity:0;transition:all .25s;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="bite"><rect width="32" height="32" fill="#fff"/><circle cx="27.5" cy="6.5" r="5.5" fill="#000"/><circle cx="31" cy="14" r="4" fill="#000"/></mask></defs><circle cx="15" cy="17" r="14" fill="currentColor" mask="url(#bite)"/></svg>Wisebyte<span class="badge">SCROLL</span></div>
      <div class="stats">
        <span class="stat" id="todayStat" title="Cards you’ve read today"><b id="today">0</b> today</span>
        <button class="stat" id="keptBtn" type="button" aria-label="Kept cards"><b id="keptCount">0</b> kept</button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Filter"></nav>
  </header>
  <main class="feed" id="feed">
    <div class="list" id="list"></div>
    <div class="loader" id="loader"></div>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button class="icon-btn" id="sheetBack" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="sheetTitle">Kept</h2>
      <button class="text-btn" id="closeSheet" type="button">Close</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="store.js"></script>
<script src="more.js"></script>
<script>
/* ---------- App settings: fill these in before release ---------- */
const CONFIG = {
  version: "1.0.0",
  wisebyteUrl: "",      // App Store link to the main Wisebyte app, e.g. "https://apps.apple.com/au/app/wisebyte/id0000000000". Leave empty to hide.
  supportEmail: "jacob.fuller@outlook.com.au",     // Support email shown in Settings. Leave empty to hide.
  privacyUrl: "privacy.html"        // Public privacy policy URL (optional in-app; the full policy is also built in).
};

/* ---------- Content ---------- */
const FACTS = [["Psychology","The spacing effect","In 1885 Hermann Ebbinghaus found that reviewing material across several days beats cramming the same total time into one session. It is one of the most replicated findings in memory research.","Short reviews spread over days will keep something longer than one long night of study."],["Psychology","Walking through a door makes you forget","Studies by Gabriel Radvansky found people forget more after passing through a doorway than after walking the same distance in one room. The brain seems to treat a doorway as the edge of an “event” and files the old one away.","If you forget why you walked in, go back to where the thought started."],["Psychology","The spotlight effect","In a 2000 study, students wearing an embarrassing T-shirt guessed about half the room would notice. Roughly a quarter actually did. We overestimate how much others pay attention to us.","Most people are too busy worrying about themselves to judge you closely."],["Psychology","The Ben Franklin effect","Franklin wrote that he won over a rival by asking to borrow a rare book. Asking someone for a small favour can make them like you more, because they explain their own kindness to themselves.","A small, genuine request can warm up a cold relationship."],["Psychology","The peak-end rule","Daniel Kahneman showed we judge experiences mostly by their most intense moment and how they end, not by their average. In one study, people preferred a longer painful procedure that ended more gently.","End meetings, holidays and conversations on a good note. That is what gets remembered."],["Psychology","Anchoring","The first number you hear pulls later estimates toward it, even when it is obviously random. In classic experiments, spinning a wheel of fortune changed people’s guesses about unrelated facts.","In any negotiation, the first number on the table has outsized power."],["Psychology","The mere exposure effect","Robert Zajonc found in 1968 that people come to like words, faces and shapes simply because they have seen them before. Familiarity breeds liking more often than contempt.","This is why songs grow on you, and why advertisers repeat themselves."],["Psychology","Loss aversion","Losing $50 feels worse than finding $50 feels good. Kahneman and Tversky estimated losses weigh roughly twice as heavily as equal gains.","Framing a choice as avoiding a loss is more persuasive than offering a gain."],["Psychology","The fundamental attribution error","When someone cuts you off in traffic, you assume they are a bad person. When you do it, you blame the situation. We explain others by character and ourselves by circumstance.","Before judging, ask what situation might make a decent person act that way."],["Psychology","The bystander effect","In 1968 Darley and Latané showed people are slower to help in an emergency when others are present. Responsibility spreads thin across a crowd.","If you need help in public, point to one specific person and ask them directly."],["Psychology","Your working memory is small","George Miller famously suggested we hold about seven items at once. Later research puts the real number closer to four chunks.","Group information into chunks, like phone numbers split into three parts."],["Psychology","The testing effect","Trying to recall something strengthens memory more than re-reading it. The struggle to retrieve is what makes it stick.","Close the book and try to explain it from memory. It feels harder because it works."],["Psychology","Hedonic adaptation","After a pay rise, a new car or a move, happiness tends to drift back toward where it was. People adapt to most good and bad changes faster than they expect.","Experiences and relationships tend to keep giving longer than possessions."],["Psychology","Cognitive dissonance","Leon Festinger proposed in 1957 that holding two conflicting beliefs creates discomfort, so we change one of them, often by rationalising.","When you catch yourself making excuses, it may be dissonance talking."],["Psychology","Negativity bias","One insult tends to outweigh several compliments. Bad events grab attention and are remembered more strongly than good ones of the same size.","Deliberately noticing what went well is not naive. It balances a built-in tilt."],["Psychology","The Zeigarnik effect","Bluma Zeigarnik reported in 1927 that interrupted tasks were remembered better than finished ones. Later studies are mixed, but unfinished business does tend to nag at us.","Writing down where you stopped can quiet the mental loop."],["Psychology","The generation effect","You remember words better when you produce them yourself than when you simply read them. Filling in “hot and c___” beats reading “hot and cold”.","Quizzing yourself or writing summaries beats highlighting."],["History","Oxford is older than the Aztec Empire","Teaching was happening at Oxford by 1096. The Aztec city of Tenochtitlan was founded in 1325.","Timelines in different parts of the world overlap in surprising ways."],["History","Cleopatra and the Moon landing","The Great Pyramid of Giza was built around 2560 BC. Cleopatra died in 30 BC. She lived closer in time to the Moon landing than to the pyramid’s construction.","Ancient Egypt lasted so long that it had its own ancient history."],["History","Why “laconic” means brief","When Philip II of Macedon threatened Sparta, saying that if he invaded he would destroy them, the Spartans reportedly replied with one word: “If.” Sparta sat in the region of Laconia.","Sometimes the shortest answer is the strongest."],["Science","Bananas are berries. Strawberries are not.","Botanically, a berry comes from a single flower with one ovary and has seeds inside. Bananas, grapes and tomatoes qualify. Strawberries do not: their flesh grows from the base of the flower, and each “seed” on the outside is actually a tiny fruit of its own.","Everyday names and scientific categories often disagree."],["Science","A day on Venus outlasts its year","Venus takes about 243 Earth days to spin once, but only about 225 days to orbit the Sun. It also spins backwards compared with most planets.","Even basic ideas like a “day” depend on where you stand."],["Nature","The octopus has three hearts","Two pump blood through the gills and one through the body. Its blood is blue because it uses copper-based haemocyanin instead of iron-based haemoglobin.","Life has solved the same problems in very different ways."],["Science","Your brain is an energy hog","The brain is about 2% of body weight but uses around 20% of the body’s resting energy.","Thinking hard really can leave you tired."],["Science","Sunlight is eight minutes old","Light from the Sun takes about 8 minutes and 20 seconds to reach Earth. If the Sun vanished, you would not know for over eight minutes.","Looking at the sky is always looking into the past."],["Science","The Eiffel Tower grows in summer","Iron expands as it heats, and the tower can be up to about 15 cm taller on a hot day.","Engineers design bridges and railways with gaps for this reason."],["Science","Petrichor was named by Australians","The smell of rain on dry earth was named “petrichor” in 1964 by CSIRO scientists Isabel Joy Bear and Richard Thomas. Part of it comes from oils plants release during dry spells.","Some of the most familiar sensations have surprisingly recent names."],["Nature","Sharks are older than trees","Shark-like fish appear in the fossil record over 400 million years ago, before the first true trees around 385 million years ago.","Sharks have survived every mass extinction since."],["Nature","Wombats make cube-shaped droppings","Varying stiffness in the wombat’s intestine shapes its droppings into cubes. They use them to mark territory, and the flat sides help stop them rolling away.","Nature finds odd solutions, and this one won an Ig Nobel Prize in 2019."],["Geography","Australia is wider than the Moon","The Moon is about 3,474 km across. Australia stretches roughly 4,000 km from east to west.","Scale in space is easy to underestimate."],["Geography","Scotland’s national animal is the unicorn","The unicorn has been a Scottish heraldic symbol since at least the 1400s, standing for purity and power.","National symbols often say more about stories than about biology."],["Psychology","Placebos can work even when you know","In a 2010 Harvard study, patients with irritable bowel syndrome improved more with pills openly labelled as placebo than with no treatment.","Expectation and ritual shape how we feel, even when we know the trick."],["Philosophy","Control what you can","Epictetus opens his handbook by splitting the world in two: what is up to us, and what is not. Our judgements, choices and efforts are ours. Other people, reputation and outcomes are not.","Putting energy only where you have control is the heart of Stoicism, and much of modern resilience training."],["Philosophy","Memento mori","The Stoics kept death in mind on purpose. Marcus Aurelius wrote that you could leave life right now, and to let that decide what you do and say and think.","It is less gloomy than it sounds: remembering time is short makes it easier to spend it well."],["Philosophy","Amor fati","Amor fati is Latin for “love of fate”. The phrase was made famous by Nietzsche, but the idea of embracing whatever happens goes back to the Stoics.","Treating setbacks as material to work with, not as injustice, changes how they feel."],["Philosophy","Occam’s razor","Named after the 14th-century friar William of Ockham, the principle says not to add more assumptions than you need. When two explanations fit, prefer the simpler one.","It is a rule of thumb, not a law. Sometimes the truth is complicated."],["Philosophy","Plato’s cave","In the Republic, Plato imagines prisoners chained in a cave who see only shadows on a wall and take them for reality. One escapes, sees the sun, and returns to be mocked.","It asks how sure we are that what we see is the whole picture."],["Philosophy","The Socratic method","Socrates rarely gave answers. He asked questions until people found the gaps in their own beliefs.","Asking “how do you know that?” is still one of the best thinking tools there is."],["History","Australia’s war against emus","In 1932, Australia sent soldiers with machine guns to fight emus. Farmers in Western Australia had asked for help after roughly 20,000 emus moved onto their wheat fields. The birds scattered, proved very hard to hit, and the operation was widely judged a failure.","Nature rarely co-operates with plans made on paper."],["History","South Australia let women stand first","In 1894, South Australia became the first place in the world to give women the right both to vote and to stand for parliament. New Zealand had given women the vote a year earlier, but not the right to be elected. Aboriginal women in South Australia could also vote.","Rights many people take for granted were won within living memory of our great-grandparents."],["History","The world copied Australia’s secret ballot","In 1856, Victoria held one of the world’s first elections using a secret, government-printed ballot paper. Before this, voting was often public, so bosses and bullies could see your choice. The idea spread so widely that Americans called it the “Australian ballot”.","Privacy in voting protects people from pressure, and it began as an Australian experiment."],["History","The walk-off that won back land","In 1966, about 200 Gurindji workers walked off Wave Hill cattle station in the Northern Territory. Led by Vincent Lingiari, they protested poor pay and conditions, then demanded the return of their land. In 1975, Prime Minister Gough Whitlam poured soil into Lingiari’s hand as a symbol of its return.","Patient, peaceful persistence helped launch the Aboriginal land rights movement."],["History","Australia’s most popular referendum","The 1967 referendum won 90.77 per cent of the vote, the highest “yes” vote in Australian history. It allowed Aboriginal and Torres Strait Islander people to be counted in the census and let the federal government make laws for them. Contrary to a common belief, it did not grant the right to vote.","Knowing what a law actually changed matters as much as remembering that it passed."],["History","Canberra was a compromise","Canberra exists because Sydney and Melbourne each refused to let the other be the capital. The Constitution required the capital to be in New South Wales but at least 100 miles (about 160 km) from Sydney. American architect Walter Burley Griffin, working with his wife Marion Mahony Griffin, won an international competition to design it.","Sometimes the best answer to a rivalry is a third option."],["History","Eureka’s rebels walked free","After the Eureka Stockade clash at Ballarat in 1854, 13 gold miners were charged with high treason. The miners had rebelled against costly mining licences and a lack of any say in government. Melbourne juries refused to convict any of them, and reforms soon followed.","Public opinion, expressed through juries, can check the power of governments."],["History","About 162,000 convicts came to Australia","Between 1788 and 1868, Britain transported about 162,000 convicts to the Australian colonies. Many were sentenced for minor theft. The last convict ship, the Hougoumont, arrived in Western Australia in January 1868.","A large share of modern Australians have convict ancestors, often without knowing it."],["History","A plate left in 1616","The oldest known European object found in Australia is a flattened pewter plate. Dutch captain Dirk Hartog nailed it to a post in 1616 on an island in Shark Bay, Western Australia, to record his visit. It is now held in the Rijksmuseum in Amsterdam.","Europeans were mapping Australia’s coast more than 150 years before Captain Cook arrived."],["History","Aquaculture older than the pyramids","The Gunditjmara people of south-west Victoria built stone channels and traps to farm eels at Budj Bim. Parts of the system are at least 6,600 years old, making it one of the world’s oldest known aquaculture systems. It was added to the UNESCO World Heritage List in 2019.","It challenges the old idea that Aboriginal people did not manage or engineer the land."],["History","The wire that shrank the world","In 1872, the Overland Telegraph Line linked Adelaide to Darwin across about 3,200 km of outback. From Darwin, an undersea cable connected Australia to Asia and on to London. News that once took months by ship could now arrive within hours.","Every leap in communication speed reshapes how a nation sees itself and the world."],["History","Gallipoli’s most successful moment","The best-planned part of the Gallipoli campaign was the retreat. In December 1915, tens of thousands of Allied troops were secretly evacuated with almost no casualties. Rifles rigged to fire on their own, using dripping water, helped convince Ottoman troops the trenches were still manned.","Knowing when and how to withdraw well is a skill, not a failure."],["History","Australia broadcast the Moon walk","When Neil Armstrong stepped onto the Moon in 1969, the television pictures of his first step seen around the world were received at Honeysuckle Creek, near Canberra. The Parkes radio telescope in New South Wales then supplied the TV pictures for most of the rest of the moonwalk. Hundreds of millions of people watched.","Australia’s geography and engineers played a quiet but vital role in the Space Age."],["History","The scheme that built multicultural Australia","The Snowy Mountains Scheme, built from 1949 to 1974, employed more than 100,000 people from over 30 countries. Many were post-war migrants from Europe who stayed and settled in Australia. The project diverts mountain rivers to generate electricity and supply irrigation water.","Big national projects can reshape a country’s population as much as its landscape."],["History","A temple older than farming","Göbekli Tepe, in south-eastern Türkiye, was built around 11,500 years ago, more than 6,000 years before Stonehenge. Its huge carved stone pillars were raised by people who had not yet adopted farming or pottery. Archaeologists once assumed monuments like this came only after agriculture.","Big shared projects may have helped create settled society, not just resulted from it."],["History","Stonehenge’s stones travelled far","Some of Stonehenge’s smaller “bluestones” were brought from the Preseli Hills in Wales, more than 200 km away. In 2024, researchers traced its central Altar Stone to north-east Scotland, over 700 km away. How ancient Britons moved these stones is still debated.","Prehistoric people were far more organised and connected than we often assume."],["History","Writing began with accounting","Some of the earliest known writing, from Mesopotamia more than 5,000 years ago, was mostly bookkeeping. Scribes pressed marks into clay to record grain, beer, livestock and workers’ rations. Poetry, law and letters came later.","Many great inventions begin as solutions to boring, practical problems."],["History","Hammurabi’s laws were set in stone","Around 1754 BC, the Babylonian king Hammurabi had about 282 laws carved onto a tall basalt stone. It includes a version of “an eye for an eye”, though punishments depended on the social class of those involved. The stone is now in the Louvre in Paris.","Publishing laws where people can see them is an early step towards fair rules."],["History","The pyramid builders were not slaves","Most Egyptologists now believe the Giza pyramids were built by paid, organised labourers, not slaves. Excavations near the pyramids uncovered workers’ villages, bakeries and tombs, with signs that injured workers received medical care. Many were likely farmers working in rotating crews.","Evidence often overturns popular stories, even very old ones."],["History","The 3,800-year height record","The Great Pyramid of Giza was the tallest human-made structure on Earth for around 3,800 years. Originally about 146 metres tall, it is thought to have been overtaken in the early 1300s by the spire of Lincoln Cathedral in England. That spire later collapsed, in 1548.","Some ancient achievements stood unmatched for longer than most civilisations have existed."],["History","Cities with drains 4,500 years ago","Around 2500 BC, cities of the Indus Valley, such as Mohenjo-daro, had grid-planned streets and covered drains. Many homes had their own bathing areas connected to the drainage system. Their writing still has not been deciphered.","Good sanitation is one of the oldest markers of a well-run city."],["History","How the Rosetta Stone cracked a code","The Rosetta Stone carries the same decree, from 196 BC, in three scripts: hieroglyphs, Demotic and ancient Greek. Because scholars could read the Greek, it became a key to hieroglyphs. Jean-François Champollion announced his breakthrough in 1822.","Understanding something new is easiest when you can compare it with something you already know."],["History","Cleopatra came from a Greek dynasty","Cleopatra VII came from the Ptolemies, a Macedonian Greek family that ruled Egypt for nearly 300 years. According to the ancient writer Plutarch, she was the first of her dynasty to learn the Egyptian language. She reportedly spoke many languages.","Learning the language of the people you lead builds trust and power."],["History","Athens voted people into exile","In ancient Athens, citizens could vote to banish a powerful person for ten years. Each voter scratched a name onto a broken piece of pottery called an “ostrakon”. This is where the word “ostracise” comes from.","Democracies have always looked for ways to limit anyone who grows too powerful."],["History","Why a marathon is 42.195 km","The marathon distance was fixed by the 1908 London Olympics. The course ran from Windsor Castle to the royal box in the stadium, measuring 26 miles 385 yards, or 42.195 km. It became the official standard in 1921.","Standards we treat as natural are often accidents of history."],["History","The year that lost ten days","In 1582, Catholic countries skipped ten days to fix a calendar that had drifted. Thursday 4 October was followed by Friday 15 October. Britain and its colonies did not switch until 1752, by which time they had to skip eleven days.","Small errors, left alone for centuries, eventually demand big corrections."],["History","The Library of Alexandria faded slowly","The Library of Alexandria probably did not vanish in one dramatic fire. Historians think it declined over centuries through funding cuts, purges of scholars, and several fires and wars. Julius Caesar’s fire in 48 BC may have destroyed some books, but the library outlived it.","Knowledge is more often lost through neglect than through a single disaster."],["History","China’s first emperor standardised everything","After uniting China in 221 BC, Qin Shi Huang standardised writing, coins, weights, measures and even cart axle widths. Matching axles meant carts could use the same road ruts across the empire. A shared script helped hold China together for over 2,000 years.","Common standards can unite people as effectively as armies."],["History","The Terracotta Army was painted","The Terracotta Army was found in 1974 by farmers digging a well near Xi’an, China. Archaeologists estimate it contains around 8,000 life-sized soldiers made to guard the tomb of Qin Shi Huang. The figures were originally painted in bright colours, which often flake away when exposed to air.","Excavating too quickly can destroy what we hope to learn, so some pits remain unopened."],["History","The Great Wall is many walls","The Great Wall of China is not a single wall but many, built by different dynasties over about 2,000 years. A Chinese survey in 2012 measured all its sections at about 21,000 km combined. Much of what tourists visit today was built during the Ming dynasty.","Famous landmarks are often the work of many generations, not one moment."],["History","Movable type came from China","Around the 1040s, a Chinese craftsman named Bi Sheng invented movable type made from baked clay. That was about 400 years before Johannes Gutenberg’s printing press in Germany. Chinese has thousands of characters, which made movable type less of an advantage there than in Europe.","Whether an invention changes the world depends on context as much as the idea."],["History","Gunpowder came from a search for immortality","Gunpowder was discovered by Chinese alchemists, probably in the 9th century, who were experimenting with potions for long life. By 1044, a Chinese military manual recorded formulas for it. Its first military uses included fire arrows and incendiary bombs.","Many major discoveries come from searching for something else entirely."],["History","China printed paper money first","Paper money first appeared in China, where the Song dynasty government began issuing it in the early 11th century. Merchants had found heavy strings of iron coins impractical. When Marco Polo described paper money, many Europeans found it hard to believe.","Money works because people trust it, not because it is made of anything valuable."],["History","The Silk Road was named in 1877","No one who travelled the Silk Road called it that. A German geographer, Ferdinand von Richthofen, coined the term in 1877. The routes carried far more than silk, including spices, paper, religions, ideas and diseases.","Names given long after events can shape how we imagine the past."],["History","Vikings reached America in 1021","Norse explorers reached North America roughly 500 years before Columbus. At L’Anse aux Meadows in Newfoundland, Canada, researchers used traces of an ancient solar storm in tree rings to show wood was cut there in 1021 AD. It is the earliest known European presence in the Americas.","Clever science can pin history to an exact year."],["History","New Zealand was settled late","Aotearoa New Zealand was one of the last large landmasses on Earth to be settled by humans, around 1250 to 1300 AD. Polynesian navigators reached it by canoe, reading stars, ocean swells and bird movements. They had already crossed thousands of kilometres of open Pacific.","Some of history’s greatest navigators used no instruments at all."],["History","A king who crashed the price of gold","In 1324, Mansa Musa, ruler of the Mali Empire, passed through Cairo on pilgrimage to Mecca. He gave away and spent so much gold that its value in Cairo reportedly fell for years afterwards. His journey put Mali on European maps.","Flooding a market with anything, even gold, lowers its value."],["History","Great Zimbabwe’s walls need no mortar","Great Zimbabwe was a major southern African city built between about the 11th and 15th centuries. Its granite walls, some over 10 metres high, were built without mortar. The modern country of Zimbabwe, meaning roughly “houses of stone”, is named after it.","Colonial writers once denied Africans built it, but the evidence proved them wrong."],["History","The Inca kept records in knots","The Inca ran one of the largest empires of its time without any known written script. Officials recorded numbers using “quipu”, bundles of knotted cords where the position and type of each knot carried meaning. The empire also built a road network of roughly 40,000 km.","There is more than one way to store and share information."],["History","Tenochtitlan was a city on a lake","The Aztec capital Tenochtitlan was built on an island in Lake Texcoco and linked to the shore by causeways. When the Spanish arrived in 1519, it was among the largest cities in the world. Mexico City now stands on its ruins.","Great cities can rise in the most unlikely places."],["History","Magna Carta failed within weeks","Magna Carta, sealed by King John in 1215, was annulled by the Pope about ten weeks later. It was reissued several times in revised forms and grew into a symbol of the idea that rulers are bound by law. Only three of its clauses remain law in England today.","Ideas can outlive the documents that first stated them."],["History","The Black Death raised wages","The Black Death killed roughly a third to half of Europe’s population between 1347 and 1351. With far fewer workers, survivors could demand higher wages and better terms. Laws to cap wages largely failed.","Even catastrophes can shift the balance of power in unexpected ways."],["History","The Roman Empire lasted until 1453","The eastern half of the Roman Empire survived nearly 1,000 years after the western half collapsed. Its people called themselves Romans. The name “Byzantine Empire” was applied by historians later, and it ended only when the Ottomans captured Constantinople in 1453.","The labels historians use are not always the ones people used for themselves."],["History","Fewer than 50 Gutenberg Bibles survive","Johannes Gutenberg printed about 180 copies of his Bible around 1455. Only 49 are known to survive today, some of them incomplete. Within 50 years of his press, millions of books had been printed across Europe.","Some inventions spread so fast they transform a continent in a single lifetime."],["History","Magellan did not sail around the world","Ferdinand Magellan’s expedition left Spain in 1519 with five ships and around 270 men. Magellan was killed in the Philippines in 1521. Only one ship, the Victoria, returned to Spain in 1522, with 18 of the original crew.","History often credits the leader, even when others finish the journey."],["History","A king invented an alphabet","In 1443, King Sejong of Korea created a new alphabet, now called Hangul, so ordinary people could read and write. Before this, Koreans wrote using complex Chinese characters that took years to learn. South Korea celebrates Hangul Day every year on 9 October.","Making knowledge easy to access is one of the most powerful things a leader can do."],["History","Angkor Wat began as a Hindu temple","Angkor Wat in Cambodia, the world’s largest religious monument, was built in the early 12th century and dedicated to the Hindu god Vishnu. It later became a Buddhist site and remains one today. It appears on Cambodia’s national flag.","Great buildings often outlive the purposes they were first built for."],["History","The only nation born from a slave revolt","Haiti declared independence in 1804 after enslaved people rose up against French rule in 1791. It became the first independent Black republic. It remains the only nation founded as the result of a successful slave revolt.","The Haitian Revolution shaped debates about freedom across the Americas."],["History","A bad smell built London’s sewers","In the hot summer of 1858, sewage in the River Thames created a stench so bad it was called “The Great Stink”. Parliament, right on the river, finally funded engineer Joseph Bazalgette’s sewer network. Much of it is still in use.","Problems often get fixed only when decision-makers feel them personally."],["History","The shortest war lasted under an hour","The Anglo-Zanzibar War of 27 August 1896 is often called the shortest war in recorded history. It lasted somewhere between 38 and 45 minutes. It ended once British warships had shelled the Sultan’s palace.","Overwhelming imbalances of power can decide conflicts almost instantly."],["History","Railways invented time zones","Before the 1880s, most towns set clocks by their own local noon, so neighbouring cities kept different times. This caused chaos for railway timetables. On 18 November 1883, North American railways adopted standard time zones, a day dubbed “the day of two noons”.","The clock on your wall is a shared agreement, not a law of nature."],["History","Ethiopia defeated a colonial army","In 1896, Ethiopia’s Emperor Menelik II decisively defeated an invading Italian army at the Battle of Adwa. While European powers were carving up Africa, Ethiopia kept its independence. The victory became a lasting symbol of African resistance.","Preparation and unity allowed a nation to defy the odds of its era."],["History","Japan ended the samurai class","In 1868, Japan’s Meiji Restoration began transforming a country that had limited foreign contact for over two centuries. Within a decade the samurai lost their privileges, including the right to wear swords in public. Japan industrialised with remarkable speed.","Deliberate reform can change a nation within a single generation."],["History","The Christmas Truce of 1914","On Christmas 1914, soldiers along parts of the Western Front stopped fighting without official permission. British and German troops sang carols, exchanged gifts and, in some places, played football. Commanders made sure it did not happen on that scale again.","Shared humanity can surface even in the worst circumstances."],["History","Why it was called “Spanish” flu","The 1918 flu pandemic almost certainly did not start in Spain. Spain was neutral in the First World War, so its newspapers reported the illness freely while warring nations censored news. The pandemic killed tens of millions of people, with a common estimate of about 50 million worldwide.","Censorship can make a place look like the source of a problem it was merely reporting."],["History","Amundsen won the race to the South Pole","Norwegian explorer Roald Amundsen reached the South Pole on 14 December 1911, about five weeks before Britain’s Robert Falcon Scott. Amundsen relied on sled dogs, skis and lessons learnt from Arctic peoples. Scott’s party died on the return journey.","Learning from people who already live in harsh conditions can mean the difference between success and failure."],["History","Humanity wiped out smallpox","In 1980, the World Health Organization declared smallpox eradicated. It had killed hundreds of millions of people over the centuries. It is still the only human disease to have been completely eliminated worldwide.","Global co-operation, sustained for years, can achieve what once seemed impossible."],["History","The man who doubted a nuclear alarm","On 26 September 1983, Soviet officer Stanislav Petrov saw an early-warning system report incoming US missiles. He judged it a false alarm and did not pass it up as an attack. He was right: sunlight reflecting off clouds had fooled the satellites.","Good judgement means questioning even the systems you are trained to trust."],["History","The Berlin Wall fell by mistake","On 9 November 1989, East German official Günter Schabowski announced new travel rules at a press conference. Asked when they applied, he said they took effect immediately, which was not the plan. Crowds rushed to the border that night, and guards eventually opened the gates.","A single unscripted moment can set history moving faster than anyone intended."],["Art & Culture","The Pantheon’s dome is still unbeaten","Rome’s Pantheon, completed around 125 AD, still has the world’s largest unreinforced concrete dome. It spans about 43 metres, and the height to the top equals the diameter. Light enters only through a round opening, the oculus, at its peak.","Roman engineers built something that has outlasted almost everything built since."],["Art & Culture","Frankenstein was born in a cold summer","Mary Shelley began writing Frankenstein at 18, during the gloomy summer of 1816 near Lake Geneva. A huge volcanic eruption in Indonesia the year before had cooled the climate, keeping her group indoors. Lord Byron suggested they each write a ghost story.","Boredom and bad weather have inspired some of history’s great creative work."],["Art & Culture","A theft made the Mona Lisa famous","The Mona Lisa became world-famous partly because it was stolen. In 1911, Vincenzo Peruggia, who had worked at the Louvre, walked out with it. The theft made headlines worldwide, and the painting was recovered in Florence in 1913.","Fame often depends on a story, not just on quality."],["Art & Culture","Utzon never saw his Opera House","Danish architect Jørn Utzon won the competition to design the Sydney Opera House in 1957. He resigned in 1966 after disputes with the NSW Government and never returned to Australia. He died in 2008 without seeing the finished building in person.","Great work can outlast the conflicts that surrounded its making."],["Art & Culture","Where “Waltzing Matilda” was written","Banjo Paterson wrote “Waltzing Matilda” in 1895 while staying at Dagworth Station in Queensland. He set his words to a tune played for him by Christina Macpherson, based on a Scottish melody. A “swagman” is a travelling worker and a “jumbuck” is a sheep.","A song written on an outback station became Australia’s unofficial anthem."],["Art & Culture","Australia’s anthem is from 1878","“Advance Australia Fair” was composed by Peter Dodds McCormick and first performed in 1878. It became Australia’s official national anthem only in 1984, replacing “God Save the Queen”. In 2021, the words “young and free” were changed to “one and free”.","National symbols keep evolving as a country rethinks who it is."],["Art & Culture","The Hollywood sign was a real-estate ad","The Hollywood sign went up in 1923 reading “HOLLYWOODLAND” to advertise a housing development. It was meant to be temporary. The last four letters were removed in 1949, when the sign was restored.","Some of the world’s best-known symbols began as ordinary advertising."],["Art & Culture","An early feature film was Australian","“The Story of the Kelly Gang”, made in Melbourne in 1906, is often called the world’s first feature-length narrative film. It ran for about an hour, far longer than typical films of the time. Only fragments survive today.","Australia was a pioneer of cinema long before Hollywood dominated it."],["Art & Culture","Italian food before tomatoes","Tomatoes come from the Americas and only reached Europe in the 1500s. The earliest known published Italian recipe for tomato sauce appeared in Naples in 1692. For centuries, Italian cooking had no tomatoes at all.","Many “traditional” dishes are younger than we assume."],["Art & Culture","Chillies are an American export","Before the 1500s, there were no chillies in Indian, Thai, Sichuan or Korean cooking. Chillies are native to the Americas and were spread around the world by Portuguese and Spanish traders. Over the following centuries they became central to cuisines across Asia.","Global trade reshaped what the whole world eats, faster than you might think."],["Art & Culture","Chocolate was a drink for millennia","For thousands of years, people in Mesoamerica drank chocolate, often bitter and spiced, rather than eating it. The first moulded chocolate bar is usually credited to J. S. Fry & Sons in England in 1847. Milk chocolate followed in Switzerland in 1875.","Everyday treats often have far older and stranger roots than their packaging suggests."],["Art & Culture","The pavlova is named after a dancer","The pavlova was named after the Russian ballerina Anna Pavlova, who toured Australia and New Zealand in 1926. Both countries claim to have invented the dessert. Food historians have found early New Zealand recipes, but the friendly rivalry continues.","Food can become a matter of national pride as fierce as sport."],["Art & Culture","Vegemite began as brewery leftovers","Vegemite was developed in 1922 by food chemist Cyril Callister in Melbourne. He used leftover yeast from breweries to create a local alternative to British Marmite, which had become scarce after the First World War. It is rich in B vitamins.","One industry’s waste can become another’s product."],["Art & Culture","Australia’s oldest known rock painting","A painting of a kangaroo in the Kimberley region of Western Australia is about 17,300 years old. Scientists dated it in 2021 using ancient mud wasp nests found above and below the paint. It is Australia’s oldest known intact rock painting.","Aboriginal art forms one of the longest continuous artistic traditions on Earth."],["Art & Culture","Blue paint once cost more than gold","The finest blue pigment of the Renaissance, ultramarine, was made by grinding lapis lazuli mined in Afghanistan. It could cost more than gold, so painters often reserved it for the robes of the Virgin Mary. A cheap synthetic version was invented in the 1820s.","The colours in old paintings can reveal what their patrons valued, and could afford."],["Art & Culture","The Statue of Liberty was once brown","When the Statue of Liberty was unveiled in 1886, it was the colour of a shiny new copper coin. Over about 20 to 30 years, weathering gave it a green coating called a patina. The patina protects the thin copper beneath.","Some of the changes we try to prevent can actually be protective."],["Art & Culture","Coffee spread from Yemen","The earliest reliable evidence of coffee drinking comes from Sufi religious communities in Yemen in the 15th century. They drank it to stay alert during night-time prayers. The Yemeni port of Mocha gave its name to a style of coffee.","A drink that fuels modern workplaces began as an aid to devotion."],["Art & Culture","Monopoly was designed as a warning","Monopoly grew out of “The Landlord’s Game”, patented by Lizzie Magie in 1904. She designed it to show how landlords could grow rich while tenants fell into poverty. A later version sold by Charles Darrow to Parker Brothers in 1935 made it a hit.","A game meant to criticise greed ended up celebrating it."],["Art & Culture","A teenager invented braille","Louis Braille lost his sight in a childhood accident and developed his reading system at about 15. He adapted a military “night writing” code of raised dots into a simpler six-dot system. He published it in 1829.","Young people can solve problems that experts have left unsolved."],["Art & Culture","One of the first novels was Japanese","“The Tale of Genji” was written in the early 11th century by Murasaki Shikibu, a lady-in-waiting at the Japanese imperial court. Its 54 chapters follow the life and loves of a fictional prince. It is often called one of the world’s first novels.","Deep psychological storytelling is far older than the modern novel."],["Art & Culture","The oldest great story ever written","The Epic of Gilgamesh, from ancient Mesopotamia, is one of the oldest surviving works of literature, with roots over 4,000 years old. It follows a king seeking to escape death. In 1872, a British Museum scholar found it contained a flood story strikingly similar to Noah’s.","Humans have been asking the same big questions about mortality for millennia."],["Art & Culture","Where do-re-mi comes from","Around 1025, the monk Guido of Arezzo taught singers using a hymn whose lines each began on a higher note. The first syllables of those lines, “ut, re, mi, fa, sol, la”, became note names. “Ut” was later replaced by “do”.","A clever memory trick from a thousand years ago still teaches music today."],["Art & Culture","The piano’s name means “soft-loud”","The piano was invented by Bartolomeo Cristofori in Florence around 1700. Unlike the harpsichord, it could play softly or loudly depending on how hard you pressed the keys. Its full name, “pianoforte”, means “soft-loud” in Italian.","Great inventions often solve one clear limitation of the tools before them."],["Art & Culture","“Impressionism” began as an insult","In 1874, critic Louis Leroy mocked Claude Monet’s painting “Impression, Sunrise” in a satirical review. He called the painters “Impressionists”, meaning their work looked unfinished. The artists adopted the name.","Criticism can become a badge of honour when you own it."],["Art & Culture","Australian art painted on cigar boxes","In 1889, Tom Roberts, Arthur Streeton, Charles Conder and others held the “9 by 5 Impression Exhibition” in Melbourne. Most works were painted on cigar-box lids measuring 9 by 5 inches (about 23 by 13 cm). Critics were unimpressed, but the show is now celebrated.","Constraints, like a small canvas, can encourage bold creative choices."],["Art & Culture","Michelangelo painted standing up","Michelangelo did not paint the Sistine Chapel ceiling lying on his back. He stood on a scaffold he designed, reaching overhead for four years, from 1508 to 1512. He wrote a poem complaining about the strain on his neck and back.","Masterpieces are often the product of physical endurance, not just talent."],["Art & Culture","The emoji that joined a museum","In 1999, designer Shigetaka Kurita created a set of 176 emoji for a Japanese mobile phone service. Each was just 12 by 12 pixels. New York’s Museum of Modern Art added the original set to its collection in 2016.","Simple, useful design can become a universal language."],["Art & Culture","Jeans were invented by a tailor","Riveted denim jeans were the idea of Jacob Davis, a tailor in Nevada, who used metal rivets to strengthen work trousers. Unable to afford the patent, he partnered with fabric supplier Levi Strauss. They received the patent in 1873.","Good ideas often need a partner with the resources to scale them."],["Art & Culture","“Robot” comes from a Czech play","The word “robot” was introduced in the 1920 Czech play “R.U.R.” by Karel Čapek. His brother Josef suggested it, from the Czech “robota”, meaning forced labour. In the play, artificial workers rebel against their human makers.","Fears about machines replacing people are more than a century old."],["Art & Culture","Holmes never said “Elementary, my dear Watson”","Sherlock Holmes never says “Elementary, my dear Watson” in any of Arthur Conan Doyle’s stories. He says “Elementary” and “my dear Watson” separately, but never together. The famous phrase spread later through films and other adaptations.","Many “famous quotes” are remembered versions, not the real words."],["Science","Old windows are not flowing glass","Glass does not slowly flow downhill over the centuries. Old panes are often thicker at the bottom because early glassmaking produced uneven sheets, and glaziers usually set the heavy edge lower. Some old panes are even thicker at the top.","A tidy explanation can spread for generations. Check the mechanism before you repeat the story."],["Science","Ice floats, and that saves lakes","Water expands by about 9% when it freezes, which makes ice less dense than the liquid beneath it. So lakes freeze from the top down, and the ice layer insulates the water below, letting fish survive winter.","One odd property of a common substance shapes whole ecosystems."],["Science","Salting pasta water is for flavour","A spoonful of salt in a big pot barely changes the boiling point of water. It raises it by only a fraction of a degree, far too little to cook pasta faster. The real reason to salt the water is taste.","Kitchen habits often have a good reason, just not the one people give."],["Science","Your GPS depends on Einstein","Clocks on GPS satellites tick about 38 microseconds a day faster than clocks on the ground, due to effects predicted by relativity. Engineers correct for this. Without the fix, positions would drift by roughly 10 km every day.","Abstract physics is quietly working every time you open a map on your phone."],["Science","0.999… repeating equals exactly 1","The number 0.999… with nines going on forever is not just close to 1. It is exactly 1. One simple proof: one third is 0.333…, and three times one third is both 0.999… and 1.","Infinity behaves differently from everyday intuition, so trust the maths over the gut."],["Science","You only need 23 people","In a group of just 23 people, there is slightly better than a 50% chance that two share a birthday. With 70 people it rises above 99%. The trick is that you are comparing every possible pair, not just yourself with others.","We underestimate coincidences, which is why “what are the odds?” moments happen so often."],["Science","The Monty Hall problem: always switch","On a game show you pick one of three doors. One hides a car. The host, who knows where it is, opens another door to reveal a goat and lets you switch. Switching wins two times in three.","New information changes the odds, even when it does not feel like it should."],["Science","Google is named after a very big number","A googol is 1 followed by 100 zeros. The name was coined by the young nephew of American mathematician Edward Kasner, who popularised it in a 1940 book. Google’s founders chose their name as a play on the word.","Even a playful child’s word can end up as one of the world’s best-known brands."],["Science","Fold paper 42 times to reach the Moon","Each fold doubles a sheet’s thickness. Starting with paper 0.1 mm thick, 42 folds would give a stack over 400,000 km tall, beyond the Moon. In practice, the record is only about 12 or 13 folds, using a very long sheet.","Doubling grows far faster than our instincts expect, which matters for debt, savings and outbreaks."],["Science","Lightning is hotter than the Sun’s surface","A lightning bolt can heat the air to around 30,000 °C, roughly five times hotter than the visible surface of the Sun. That sudden heating makes the air expand explosively, which is the sound we hear as thunder.","Thunder is not a separate event. It is the sound of lightning itself."],["Science","Count the seconds to find the storm","Light from lightning reaches you almost instantly, but sound travels about 1 km every 3 seconds. Count the seconds between flash and thunder, then divide by three to estimate the distance in kilometres.","If the gap is under 30 seconds, the storm is close enough to be dangerous. Go indoors."],["Science","Bananas are slightly radioactive","Bananas contain potassium, and a tiny fraction of natural potassium is radioactive potassium-40. So do potatoes, nuts and your own body. The dose from eating a banana is far too small to matter.","“Radioactive” is about dose, not presence. Nearly everything around us carries a trace of it."],["Science","Atoms are almost entirely empty","An atom’s nucleus is about 100,000 times smaller across than the atom itself. If an atom were the size of a sports stadium, the nucleus would be about the size of a pea in the centre. The rest is mostly empty space.","Solid objects feel solid because of electric forces, not because matter is packed tight."],["Science","Diamonds are not quite forever","Diamond and pencil graphite are both pure carbon, just arranged differently. At the Earth’s surface, graphite is actually the more stable form. Diamonds do slowly turn into graphite, but so slowly that no one will ever notice.","Stability and permanence are not the same thing. Time scales matter."],["Science","Helium was found in the Sun first","Astronomers spotted helium in 1868 as an unknown yellow line in sunlight during a solar eclipse. It was named after Helios, the Greek god of the Sun. Chemists only found it on Earth in 1895.","We identified an element 150 million km away before finding it under our feet."],["Science","A metal that melts in your hand","Gallium is a soft, silvery metal that melts at about 30 °C. Hold a solid piece in your palm and body heat will turn it to liquid. It is used in computer chips, LEDs and solar cells.","Melting points are not just about how “hard” a metal looks."],["Science","Why the sky is blue","Air molecules scatter short blue wavelengths of sunlight much more strongly than red ones, sending blue light across the whole sky. At sunset, light travels through more air, so most blue is scattered away and reds and oranges remain.","The same process explains both a blue noon and a red evening."],["Science","The first computer “bug” was a real moth","In 1947, engineers on the Harvard Mark II computer found a moth stuck in a relay. They taped it into the logbook with the note “First actual case of bug being found.” The word “bug” for a fault was already in use, which made it a joke.","Great stories are often better when told accurately."],["Science","Your phone would dwarf Apollo’s computer","The Apollo Guidance Computer that helped land astronauts on the Moon had about 4 kilobytes of working memory. A modern smartphone has over a million times more. Apollo succeeded through clever design and careful engineering, not raw power.","Constraints can force brilliant work. More resources do not guarantee better results."],["Science","Sound travels four times faster in water","Sound moves at about 343 metres per second in air but roughly 1,500 metres per second in water. Whales can hear each other across huge distances, and underwater it is hard to tell where a sound is coming from.","How we sense the world depends on the medium around us."],["Science","A liquid you can punch","Mix cornflour with water and you get a strange fluid. Stir it slowly and it flows. Hit it hard and it acts like a solid. It is a non-Newtonian fluid, whose thickness changes with force.","Some materials follow rules that surprise our intuition, and engineers use them in protective gear."],["Science","Why stainless steel does not rust","Stainless steel contains at least 10.5% chromium. The chromium reacts with oxygen to form an invisible, very thin protective layer. If scratched, the layer quickly reforms, protecting the iron underneath.","Sometimes the best protection is a thin layer that repairs itself."],["Science","Aluminium was once a precious metal","In the mid-1800s aluminium was hard to extract and more expensive than silver. In 1884, a small aluminium pyramid was placed on top of the Washington Monument as a prestige metal. A new process in 1886 made it cheap.","Value depends on how hard something is to make, and technology can change that overnight."],["Science","Rainbows are really circles","A rainbow forms a full circle centred on the point directly opposite the Sun. From the ground, the horizon hides the lower part, so we see an arc. From a plane or mountain top, you can sometimes see the whole ring.","What we see is often limited by where we stand."],["Science","Why onions make you cry","Cutting an onion breaks its cells and triggers a reaction that releases a sulfur gas called syn-propanethial-S-oxide. It irritates your eyes, which respond with tears. Chilling onions first and using a sharp knife reduce the effect.","Knowing the cause turns an annoyance into something you can manage."],["Science","Popcorn is a tiny pressure cooker","Each kernel holds a little water inside a tough shell. Heated to about 180 °C, the water turns to steam, the pressure builds until the shell bursts, and the starch puffs into foam. Kernels with too little moisture just stay as “old maids”.","Everyday snacks run on the same physics as industrial pressure vessels."],["Science","Mentos and cola is not a reaction","The famous fountain is mostly physical, not chemical. Cola is full of dissolved carbon dioxide, and the rough surface of the mints gives the gas countless tiny spots to form bubbles all at once. The foam then rushes out of the bottle.","Tiny surface details can release enormous stored energy."],["Science","Your fridge does not make cold","A fridge works by moving heat out of the inside and releasing it into your kitchen. A refrigerant absorbs heat inside, then gives it off through coils, often at the back or sides. That is why those parts of the fridge feel warm.","Cooling is really heat relocation, which is also how heat pumps and air conditioners work."],["Science","Old light bulbs were mostly heaters","A traditional incandescent bulb turns only about 10% of its energy into visible light. The rest is lost as heat. LED bulbs give the same light using at least 75% less energy and last many times longer.","Swapping bulbs is one of the easiest ways to cut a power bill."],["Science","Velcro was inspired by a dog walk","In 1941, Swiss engineer George de Mestral noticed burrs clinging to his dog’s fur. Under a microscope he saw tiny hooks catching on loops. He spent years copying the idea, naming it Velcro from the French “velours” and “crochet”.","Paying close attention to small annoyances can spark great inventions."],["Science","The kilogram used to be a real object","For 130 years, the kilogram was defined by a metal cylinder kept in a vault near Paris. Copies around the world were compared against it. In 2019, scientists redefined the kilogram using a fixed constant of nature instead.","Good standards should not depend on one object that could be damaged or change."],["Science","The metre is defined by light","Since 1983, the metre has been defined as the distance light travels in a vacuum in exactly 1/299,792,458 of a second. The speed of light was fixed by definition, and the metre follows from it.","Measurement is built on things that never change, so anyone, anywhere, can reproduce it."],["Science","Zero had to be invented","Using zero as a number in its own right took a long time. The Indian mathematician Brahmagupta wrote rules for calculating with zero in 628 CE. The idea spread through the Islamic world to Europe centuries later.","Some of our most basic tools were once revolutionary ideas."],["Science","Why so many numbers start with 1","In many real-world datasets, like populations, prices and river lengths, about 30% of numbers begin with the digit 1, while under 5% begin with 9. This pattern is called Benford’s law, and auditors use it to spot fake figures.","Made-up numbers often look too even, and statistics can catch them."],["Science","The black box is orange and Australian","Flight recorders are painted bright orange so they are easier to find after a crash. The cockpit voice recorder was pioneered by Australian scientist David Warren in Melbourne in the 1950s.","Australian research quietly helps make every flight safer."],["Science","Earth’s core rivals the Sun’s surface","The centre of the Earth is estimated at roughly 5,000 to 6,000 °C, about as hot as the visible surface of the Sun. It stays that hot thanks to heat left over from Earth’s formation and slow radioactive decay.","Beneath our feet is a heat engine that drives earthquakes, volcanoes and the magnetic field."],["Science","Why touchscreens ignore your gloves","Most phone screens are capacitive. They detect how your conductive finger disturbs a weak electric field across the glass. Ordinary gloves insulate your skin, so the screen cannot sense it, which is why special gloves have conductive threads in the fingertips.","Understanding how a device senses you explains its quirks."],["Science","QR codes were made for car parts","QR codes were invented in 1994 by Japanese company Denso, part of the Toyota group, to track car parts in factories. They hold much more data than barcodes and can be read even when partly damaged.","Tools built for one purpose often find their biggest use elsewhere."],["Science","The first website is still online","British scientist Tim Berners-Lee published the first website at CERN in Switzerland in 1991. It explained what the World Wide Web was and how to use it. CERN has restored it, and you can still visit it at info.cern.ch.","One modest page launched a technology that now connects billions of people."],["Science","Australia helped invent fast Wi-Fi","In the 1990s, a team at CSIRO, Australia’s national science agency, developed and patented a way to beat the echoes that scrambled indoor wireless signals. Their work became part of the Wi-Fi standards used in billions of devices.","Public science funding can pay off in ways nobody predicts."],["Science","On Everest, water boils at about 70 °C","Lower air pressure at altitude lets water boil at a lower temperature. On the summit of Mount Everest it boils at about 70 °C, too cool to cook many foods properly. That is why climbers and campers use pressure cookers.","Boiling point depends on pressure, which is also how pressure cookers speed up cooking at home."],["Science","Earth’s magnetic poles flip","Earth’s magnetic field has reversed many times, with north and south swapping. The last full reversal happened about 780,000 years ago. Scientists know this from the magnetism frozen into ancient volcanic rocks.","The planet’s protective shield is not fixed, and rocks keep a record of its history."],["Science","Why metal feels colder than wood","A metal railing and a wooden bench in the same shade are usually the same temperature. Metal feels colder because it conducts heat away from your skin much faster. Your skin senses heat loss, not temperature itself.","Our senses measure change, not absolute values, which can easily fool us."],["Science","Why water will not put out chilli","Chilli heat comes from capsaicin, which triggers the same nerve receptors that detect real heat. Capsaicin dissolves in fat, not water, so drinking water just spreads it around. Milk or yoghurt works better.","Fighting a problem works best when you understand its chemistry."],["Science","How soap breaks germs apart","Soap molecules have one end that loves water and another that loves oils. They pull apart the fatty coating on many viruses and lift grease and dirt off your skin so water can rinse them away.","Twenty seconds of proper handwashing does real chemical work."],["Science","Some infinities are bigger than others","In the 1870s and 1890s, mathematician Georg Cantor proved there are different sizes of infinity. You can list the whole numbers one by one, but you can never list all the real numbers, the endless decimals. There are strictly more of them.","Even infinity has structure, and careful reasoning can reveal it."],["Science","You do not need many digits of pi","NASA’s Jet Propulsion Laboratory uses only about 15 decimal places of pi for interplanetary navigation. Around 40 digits would be enough to calculate the size of the observable universe to within the width of an atom.","Precision beyond what you need is wasted effort. Good enough is often perfect."],["Science","A blast heard 4,800 km away","When the Krakatau (Krakatoa) volcano in Indonesia erupted in 1883, the blast was heard about 4,800 km away on the island of Rodrigues in the Indian Ocean. Its pressure wave travelled around the Earth several times. It is often called the loudest sound in recorded history.","Nature can unleash forces that dwarf anything humans have built."],["Science","Kevlar came from a failed experiment","In 1965, chemist Stephanie Kwolek at DuPont made a cloudy, runny solution that would normally have been thrown away. She persuaded a reluctant technician to spin it into fibre. The result was Kevlar, about five times stronger than steel by weight.","Unexpected results deserve a second look before they are thrown away."],["Space","Space has a smell","You cannot sniff a vacuum directly, but after spacewalks astronauts notice a distinct odour on their suits and tools once the airlock fills with air again. Many describe it as seared steak, hot metal or welding fumes.","Scientists still debate what causes it. Some mysteries are right under our noses, even in orbit."],["Space","A spoonful of neutron star","A neutron star packs more mass than the Sun into a ball about 20 km across. It is so dense that a single teaspoon of its material would weigh billions of tonnes on Earth.","The universe contains states of matter far beyond anything we can make."],["Space","Saturn would float in water","Saturn is mostly hydrogen and helium, and its average density is less than that of water. In theory, if you could find a big enough bath, it would float. It is the only planet in our solar system less dense than water.","Size and weight are not the same thing as density."],["Space","The solar system’s tallest volcano","Olympus Mons on Mars rises about 22 km, roughly two and a half times the height of Mount Everest. Its base is about 600 km wide, making it a giant but gently sloping shield volcano.","Low gravity and no moving plates let Martian volcanoes grow truly enormous."],["Space","Venus is hotter than Mercury","Mercury is closest to the Sun, but Venus is the hottest planet. Its thick carbon dioxide atmosphere traps heat, keeping the surface around 465 °C, hot enough to melt lead, day and night.","Venus is an extreme example of the greenhouse effect at work."],["Space","A storm bigger than Earth","Jupiter’s Great Red Spot is a giant storm that has been observed for at least 150 years. It is wider than the Earth, though it has been shrinking over recent decades. Nobody knows exactly how long it will last.","Some weather systems outlast human lifetimes and even whole centuries of observation."],["Space","Uranus spins on its side","Uranus is tilted about 98 degrees, so it rolls around the Sun almost on its side. Each pole gets about 42 years of sunlight followed by 42 years of darkness. A massive ancient collision is the likely cause.","One ancient impact can shape a planet for billions of years."],["Space","The Moon is drifting away","Each year the Moon moves about 3.8 cm further from Earth, roughly as fast as your fingernails grow. Scientists measure this by bouncing lasers off mirrors left on the Moon by Apollo astronauts.","Even the heavens change slowly, and old experiments can keep giving data for decades."],["Space","The Moon only shows one face","The Moon spins exactly once for every orbit around Earth, so the same face always points towards us. The far side is not dark. It gets just as much sunlight. We simply cannot see it from here.","“Dark side of the Moon” is a myth. It is only the far side."],["Space","Seeing 2.5 million years into the past","On a dark night, the Andromeda Galaxy is visible to the naked eye as a faint smudge. Its light left about 2.5 million years ago. It is the most distant object most people can see without a telescope.","Looking up is looking back in time. Every star you see is a message from the past."],["Space","The Sun is almost everything","The Sun holds about 99.8% of all the mass in our solar system. You could fit roughly 1.3 million Earths inside it. All the planets, moons and asteroids together make up just a tiny remainder.","Our solar system is really the Sun, with a few crumbs orbiting it."],["Space","Voyager 1 is still tal
