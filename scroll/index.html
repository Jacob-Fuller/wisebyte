t extra day is also why your birthday shifts one weekday later each year."],["Adding 1 to 100","What is the sum of all whole numbers from 1 to 100?","5,050. Pair them from the ends: 1 + 100, 2 + 99, 3 + 98 and so on. That is 50 pairs, each adding up to 101, and 50 × 101 = 5,050."],["Divisible by 3?","Is 123,456,789 divisible by 3?","Yes. A number is divisible by 3 if its digits add up to a multiple of 3. These digits sum to 45, so it is divisible by 3 (and by 9 as well)."],["Near a hundred","What is 97 × 96?","9,312. Both are just below 100: 3 short and 4 short. Take either number minus the other’s shortfall (97 − 4 = 93), then multiply the shortfalls (3 × 4 = 12). Join them: 9,312."],["Squares on a chessboard","How many squares of any size are there on a standard 8 × 8 chessboard?","204. There are 64 small squares, 49 of size 2 × 2, 36 of size 3 × 3, and so on down to one 8 × 8. Adding 64 + 49 + 36 + 25 + 16 + 9 + 4 + 1 gives 204."],["What comes next? (1)","2, 6, 12, 20, 30, …","42. The gaps grow by 2 each time (4, 6, 8, 10, 12). Each term is also n × (n + 1): 6 × 7 = 42."],["What comes next? (2)","O, T, T, F, F, S, S, E, …","N. They are the first letters of One, Two, Three, Four, Five, Six, Seven, Eight, so next is Nine."],["What comes next? (3)","J, F, M, A, M, J, J, …","A. They are the first letters of the months, January to July, so next is August."],["What comes next? (4)","3, 5, 9, 17, 33, …","65. Each number is double the previous one minus 1 (33 × 2 − 1 = 65). The gaps also double: 2, 4, 8, 16, 32."],["What comes next? (5)","1, 11, 21, 1211, 111221, …","312211. Each line describes the one before out loud: 111221 is “three 1s, two 2s, one 1”, written 31 22 11."],["What comes next? (6)","A, C, F, J, O, …","U. The gaps between letters grow by one each time: skip 1, 2, 3, 4, then 5. In number terms: 1, 3, 6, 10, 15, then 21, which is U."],["Once in a minute","What occurs once in a minute, twice in a moment, but never in a thousand years?","The letter M."],["Spelled wrong","Which word is spelled incorrectly in every dictionary?","“Incorrectly”. It is spelled i-n-c-o-r-r-e-c-t-l-y in every dictionary."],["Double, double, double","Which common English word has three pairs of double letters in a row?","Bookkeeper (or bookkeeping): b-OO-KK-EE-per."],["Remembering pi","Count the letters in each word of this sentence: “How I wish I could calculate pi.” What number do you get?","3.141592, the first seven digits of pi. Sentences like this, where word lengths encode digits, are called “piems” and are an old memory trick."],["The knuckle calendar","Without a calendar, how can you tell which months have 31 days using only your fists?","Put your fists together and count months across the knuckles and the dips between them. Knuckles are 31-day months, dips are shorter months. January is a knuckle, February a dip, and July and August fall on two knuckles side by side."],["Up or down?","Stalactites and stalagmites form in caves. Which one hangs from the ceiling, and how can you remember?","Stalactites hang from the ceiling. Stalactites have a “c” for ceiling, and stalagmites have a “g” for ground."],["Port or starboard?","On a ship, facing forward, which side is port?","The left. “Port” and “left” both have four letters. Port side navigation lights are also red, like port wine."],["The nines on your fingers","How can you work out 9 × 7 using only your ten fingers?","63. Hold up all ten fingers and fold down the 7th from the left. There are 6 fingers to the left of it (tens) and 3 to the right (ones). It works for 9 × 1 up to 9 × 10."],["Daylight saving","When daylight saving starts, do clocks go forward or back an hour? How can you remember?","Forward. “Spring forward, fall back”: clocks spring ahead an hour in spring and fall back in autumn. In the states that use it, that means forward in October and back in April."],["Count the Fs","Read once and count the letter F: “FINISHED FILES ARE THE RESULT OF YEARS OF SCIENTIFIC STUDY COMBINED WITH THE EXPERIENCE OF YEARS.”","Six. Most people count three because the brain skims over “OF”, where the F sounds like a V. There are three “OF”s plus FINISHED, FILES and SCIENTIFIC."],["Fewest coins","Using Australian coins, what is the fewest coins you need to make exactly 95 cents?","Four: 50c + 20c + 20c + 5c. Three coins can reach at most 90c without going over, using 50c + 20c + 20c."]];

/* ---------- Native bridge (Capacitor). Everything falls back gracefully in a browser. ---------- */
const Cap = window.Capacitor;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
function plugin(name){
  if(!isNative) return null;
  try{ return (Cap.Plugins && Cap.Plugins[name]) || (Cap.registerPlugin ? Cap.registerPlugin(name) : null); }catch(e){ return null; }
}
const Prefs = plugin("Preferences"), Share = plugin("Share"), Notes = plugin("LocalNotifications"), StatusBar = plugin("StatusBar"), Splash = plugin("SplashScreen");

/* ---------- Storage: native Preferences on iPhone (not wiped by iOS), localStorage in a browser ---------- */
const KEYS = ["wbs-day","wbs-kept","wbs-seen","wbs-total","wbs-settings","wbs-welcomed"];
const mem = {};
const store = {
  async init(){
    for(const k of KEYS){
      let raw = null;
      try{
        if(Prefs){ raw = (await Prefs.get({key:k})).value; }
        if(raw==null){ raw = localStorage.getItem(k); }
      }catch(e){}
      if(raw!=null){ try{ mem[k]=JSON.parse(raw); }catch(e){} }
    }
  },
  get(k,d){ return k in mem ? mem[k] : d; },
  set(k,v){
    mem[k]=v; const raw=JSON.stringify(v);
    try{ localStorage.setItem(k,raw); }catch(e){}
    if(Prefs){ Prefs.set({key:k,value:raw}).catch(()=>{}); }
  }
};

/* ---------- State ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const feed=$("#feed"), list=$("#list");
const dateKey = ()=>new Date().toLocaleDateString("en-CA");
let day, kept, seen, total, settings;
let filter="all", decks={}, lastCat=null, lastP=null, ready=false;
const onScreen = new Set();

function loadState(){
  day = store.get("wbs-day",{d:dateKey(),n:0});
  kept = store.get("wbs-kept",[]).filter(id=>BY_ID[id]);
  seen = new Set(store.get("wbs-seen",[]).filter(id=>BY_ID[id]));
  total = store.get("wbs-total",0);
  settings = Object.assign({remind:false,time:"08:00"}, store.get("wbs-settings",{}));
  rollDay();
}
/* Resets the "today" count after midnight, even if the app stayed open */
function rollDay(){ const k=dateKey(); if(day.d!==k){ day={d:k,n:0}; store.set("wbs-day",day); } $("#today").textContent=day.n; }
function markRead(id){
  rollDay(); day.n++; total++; store.set("wbs-day",day); store.set("wbs-total",total); $("#today").textContent=day.n;
  if(!seen.has(id)){ seen.add(id); store.set("wbs-seen",[...seen]); }
}

/* ---------- Deck ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refill(p){
  const src=BY_P[p];
  let fresh=src.filter(x=>!seen.has(x.id) && !onScreen.has(x.id));
  if(!fresh.length){
    src.forEach(x=>seen.delete(x.id)); store.set("wbs-seen",[...seen]);
    fresh=src.filter(x=>!onScreen.has(x.id)); if(!fresh.length) fresh=src.slice();
    if(filter!=="all" && list.children.length) toast("You’ve read them all. Starting a fresh round.");
  }
  decks[p]=shuffle(fresh);
}
function pickPillar(){
  if(filter!=="all") return filter;
  const roll=()=>{ let r=Math.random(); for(const [p,w] of Object.entries(WEIGHTS)){ if((r-=w)<=0) return p; } return "k"; };
  let p=roll(); if(p===lastP && p!=="k") p=roll(); return p;
}
function draw(){
  const p=pickPillar();
  if(!decks[p]||!decks[p].length) refill(p);
  const d=decks[p]; let idx=d.length-1;
  for(let i=d.length-1;i>=0;i--){ if(d[i].cat!==lastCat && !onScreen.has(d[i].id)){idx=i;break} }
  const x=d.splice(idx,1)[0]; lastCat=x.cat; lastP=p; return x;
}

/* ---------- Cards ---------- */
const ICON_KEEP='<svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>';
const ICON_SHARE='<svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 11.5v8a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-8"/></svg>';
const CHEV='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const more=(label)=>`<button class="more" data-more aria-expanded="false" type="button">${esc(label)} ${CHEV}</button>`;

function inner(x){
  switch(x.type){
    case "fact": return `<h2 class="title">${esc(x.t)}</h2><p class="head">${esc(x.h)}</p>
      ${x.b?`<p class="txt">${esc(x.b)}</p>`:""}
      ${more("Why it matters")}<p class="txt extra" hidden>${esc(x.m)}</p>`;
    case "myth": return `<h2 class="title">${esc(x.t)}</h2><p class="head">${esc(x.h)}</p>
      <div class="choice"><button class="btn" data-guess="1" type="button">Fact</button><button class="btn" data-guess="0" type="button">Fiction</button></div>
      <div class="extra" hidden><p class="verdict"></p><p class="txt">${esc(x.e)}</p></div>`;
    case "word": return `<h2 class="title">${esc(x.t)}</h2><p class="head">${esc(x.h)}</p>
      <p class="txt"><span class="meta">/${esc(x.pr)}/ · ${esc(x.pos)}</span><br><em>“${esc(x.ex)}”</em></p>
      ${more("Where the word comes from")}<p class="txt extra" hidden>${esc(x.o)}</p>`;
    case "quote": return `<h2 class="title">${esc(x.t)}</h2><p class="head quote">“${esc(x.h)}”</p>
      <p class="txt">${esc(x.src)}</p>
      ${more("The context")}<p class="txt extra" hidden>${esc(x.n)}</p>`;
    case "skill": return `<h2 class="title">${esc(x.t)}</h2><ol class="steps">${x.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${more("Why it works")}<p class="txt extra" hidden>${esc(x.n)}</p>`;
    case "puzzle": return `<h2 class="title">${esc(x.t)}</h2><p class="head">${esc(x.h)}</p>
      ${more("Show the answer")}<p class="txt extra" hidden>${esc(x.a)}</p>`;
  }
}
function card(x){
  const el=document.createElement("article");
  el.className="card"; el.dataset.id=x.id;
  el.style.setProperty("--c",CATS[x.cat].c);
  const on=kept.includes(x.id);
  el.innerHTML=`<div class="cat">${esc(x.cat)}<span class="acts">
      <button class="icon-btn" data-share aria-label="Share" type="button">${ICON_SHARE}</button>
      <button class="icon-btn" data-keep aria-pressed="${on}" aria-label="${on?"Remove from kept":"Keep"}" type="button">${ICON_KEEP}</button>
    </span></div>${inner(x)}`;
  return el;
}
function welcomeCard(){
  const el=document.createElement("article");
  el.className="card"; el.dataset.welcome="1";
  el.innerHTML=`<div class="cat">Welcome</div><h2 class="title">Scroll as long as you like.</h2>
    <p class="txt">Every card is a small, true idea worth knowing: facts, words, quotes, life skills and puzzles. Tap the bookmark to keep a card for later, or the share arrow to send it to someone. Use the filters above to focus on one kind.</p>
    <button class="btn solid" data-welcome-ok type="button">Start reading</button>`;
  return el;
}

/* Reading count: a card counts once it has stayed mostly on screen for a moment
   (so cards that only flash past, or show on reopening the app, aren’t counted as read) */
const readIO=new IntersectionObserver(es=>es.forEach(en=>{
  const t=en.target;
  if(t.dataset.read) return;
  if(en.isIntersecting){ if(!t._rt) t._rt=setTimeout(()=>{ t.dataset.read="1"; readIO.unobserve(t); markRead(t.dataset.id); },1500); }
  else if(t._rt){ clearTimeout(t._rt); t._rt=null; }
}),{root:feed,threshold:.7});

/* Endless loading */
function append(n){ for(let i=0;i<n;i++){ const x=draw(), c=card(x); onScreen.add(x.id); list.appendChild(c); readIO.observe(c); } prune(); }
new IntersectionObserver(es=>{ if(es[0].isIntersecting && ready) append(8); },{root:feed,rootMargin:"0px 0px 1200px 0px"}).observe($("#loader"));

function prune(){
  if(list.children.length<=70) return;
  let removed=0;
  while(list.children.length>45){
    const c=list.firstElementChild, r=c.getBoundingClientRect();
    if(r.bottom>0) break;
    removed += c.offsetHeight + 16; readIO.unobserve(c); if(c.dataset.id) onScreen.delete(c.dataset.id); c.remove();
  }
  if(removed) feed.scrollTop -= removed;
}
function reset(){
  list.innerHTML=""; onScreen.clear(); decks={}; lastCat=null; lastP=null;
  if(!store.get("wbs-welcomed",false) && filter==="all") list.appendChild(welcomeCard());
  append(10); feed.scrollTop=0;
}

/* ---------- Sharing ---------- */
function shareText(x){
  switch(x.type){
    case "fact": return `${x.t}\n\n${x.h}${x.b?" "+x.b:""}`;
    case "myth": return `Fact or fiction? ${x.h}\n\n${x.a?"Fact.":"Fiction."} ${x.e}`;
    case "word": return `${x.t} (${x.pos}): ${x.h}\n\n“${x.ex}”`;
    case "quote": return `“${x.h}”\n\n${x.t}, ${x.src}`;
    case "skill": return `${x.t}\n\n${x.steps.map((s,i)=>`${i+1}. ${s}`).join("\n")}`;
    case "puzzle": return `${x.t}: ${x.h}`;
  }
}
async function shareCard(x){
  const text = shareText(x) + "\n\nFrom Wisebyte - Scroll" + (CONFIG.wisebyteUrl?` ${CONFIG.wisebyteUrl}`:"");
  try{
    if(Share){ await Share.share({title:x.t, text, dialogTitle:"Share"}); return; }
    if(navigator.share){ await navigator.share({title:x.t, text}); return; }
  }catch(e){ if(e && (e.name==="AbortError" || /cancel/i.test(e.message||""))) return; }
  try{ await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
  catch(e){ toast("Sharing isn’t available here"); }
}

/* ---------- Card interactions (feed and sheet) ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-welcome-ok]")){
    store.set("wbs-welcomed",true); const w=e.target.closest(".card"); const h=w.offsetHeight+16; w.remove(); feed.scrollTop=Math.max(0,feed.scrollTop-h); return;
  }
  const art=e.target.closest(".card[data-id]"); if(!art) return;
  const x=BY_ID[art.dataset.id];
  const m=e.target.closest("[data-more]");
  if(m){ const open=m.getAttribute("aria-expanded")!=="true"; m.setAttribute("aria-expanded",open); art.querySelector(".extra").hidden=!open; return; }
  const g=e.target.closest("[data-guess]");
  if(g){
    const ok=(g.dataset.guess==="1")===x.a;
    art.querySelectorAll("[data-guess]").forEach(b=>{ b.disabled=true; if((b.dataset.guess==="1")===x.a) b.classList.add("right"); else if(b===g) b.classList.add("wrong"); });
    const v=art.querySelector(".verdict"); v.textContent=(ok?"Correct. ":"Not quite. ")+(x.a?"It’s a fact.":"It’s fiction."); v.className="verdict "+(ok?"good":"bad");
    art.querySelector(".extra").hidden=false; return;
  }
  if(e.target.closest("[data-share]")){ shareCard(x); return; }
  if(e.target.closest("[data-keep]")){
    const on=!kept.includes(x.id);
    kept=on?[x.id,...kept]:kept.filter(id=>id!==x.id); store.set("wbs-kept",kept);
    syncKeep(x.id); toast(on?"Kept":"Removed from kept");
  }
});
function syncKeep(id){
  const on=kept.includes(id);
  document.querySelectorAll(`.card[data-id="${id}"] [data-keep]`).forEach(b=>{ b.setAttribute("aria-pressed",on); b.setAttribute("aria-label",on?"Remove from kept":"Keep"); });
  $("#keptCount").textContent=kept.length;
}
let tt; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1400); }

/* ---------- Filters ---------- */
const chips=$("#chips");
[["all","All"],...Object.entries(PILLARS)].forEach(([k,label])=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=label; b.dataset.f=k; b.setAttribute("aria-pressed",k===filter); chips.appendChild(b);
});
chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b||b.dataset.f===filter) return;
  filter=b.dataset.f; chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); reset();
});

/* ---------- Sheet: kept list, reader, settings, privacy ---------- */
const sheet=$("#sheet"), sheetBody=$("#sheetBody"), sheetTitle=$("#sheetTitle"), sheetBack=$("#sheetBack");
let sheetBackTo=null, lastFocus=null;
function openSheet(title, html, backTo){
  if(sheet.hidden) lastFocus=document.activeElement;
  sheetTitle.textContent=title; sheetBody.innerHTML=html; sheetBody.scrollTop=0;
  sheetBackTo=backTo||null; sheetBack.hidden=!backTo;
  sheet.hidden=false; (backTo?sheetBack:$("#closeSheet")).focus();
}
function closeSheet(){ sheet.hidden=true; sheetBody.innerHTML=""; if(lastFocus) lastFocus.focus(); }
function showKept(){
  openSheet("Kept", kept.length
    ? `<ul class="kept-list">${kept.map(id=>{const x=BY_ID[id];return `<li data-id="${id}"><button class="kept-open" data-open type="button"><div class="kl" style="color:${CATS[x.cat].c}">${esc(x.cat)}</div><div class="kt">${esc(x.type==="myth"?x.h:x.t)}</div></button><button class="rm" data-remove type="button" aria-label="Remove ${esc(x.t)}">Remove</button></li>`}).join("")}</ul>`
    : `<p class="empty">Nothing kept yet. Tap the bookmark on any card to save it here.</p>`);
}
function showReader(id){
  openSheet("Kept", "", showKept);
  sheetBody.appendChild(card(BY_ID[id]));
}
function showSettings(){
  const readAll=`<div class="group">
      <div class="row"><span>Read today</span><span class="val">${day.n}</span></div>
      <div class="row"><span>Read all time</span><span class="val">${total}</span></div>
      <div class="row"><span>Cards in the library</span><span class="val">${POOL.length.toLocaleString("en-AU")}</span></div>
    </div>`;
  const remind = isNative && Notes ? `<p class="group-title">Daily reminder</p><div class="group">
      <label class="row"><span>Remind me to read<small>A gentle nudge once a day</small></span><span class="switch"><input type="checkbox" id="remindOn" ${settings.remind?"checked":""}><span></span></span></label>
      <label class="row" id="remindTimeRow" ${settings.remind?"":"hidden"}><span>Time</span><input type="time" id="remindTime" value="${esc(settings.time)}"></label>
    </div>` : "";
  const links = `<div class="group">
      ${CONFIG.wisebyteUrl?`<a class="row" href="${esc(CONFIG.wisebyteUrl)}" target="_blank" rel="noopener"><span>Get Wisebyte<small>Lessons, vocabulary and brain training</small></span><span class="val">›</span></a>`:""}
      <button class="row" data-sub type="button"><span>Subscription<small>${esc(WBStore.status())}</small></span><span class="val">${WBStore.mode!=="preview"&&WBStore.entitled()?"Manage":"Plans"} ›</span></button>
      <button class="row" data-restore type="button"><span>Restore purchases</span><span class="val">›</span></button>
      <button class="row" data-privacy type="button"><span>Privacy policy</span><span class="val">›</span></button>
      <button class="row" data-terms type="button"><span>Terms of Use</span><span class="val">›</span></button>
      ${CONFIG.supportEmail?`<a class="row" href="mailto:${esc(CONFIG.supportEmail)}?subject=Wisebyte%20-%20Scroll%20support"><span>Contact support<small>${esc(CONFIG.supportEmail)}</small></span><span class="val">›</span></a>`:""}
    </div>`;
  const danger = `<p class="group-title">Your data</p><div class="group">
      <button class="row danger" data-confirm="history" type="button"><span>Reset reading history<small>Clears what you’ve read and your counts</small></span></button>
      <button class="row danger" data-confirm="kept" type="button"><span>Clear kept cards</span></button>
    </div>`;
  openSheet("Settings", `<p class="group-title">Your reading</p>${readAll}${remind}${links}${danger}
    <p class="foot">Wisebyte - Scroll ${esc(CONFIG.version)}<br>Everything you do stays on this device.</p>`);
}
const PRIVACY = `<div class="prose">
  <p><em>Last updated: 27 September 2026</em></p>
  <p>Wisebyte - Scroll is designed so that nothing about you leaves your device.</p>
  <h3>What we collect</h3><p>Nothing. The app has no accounts, no analytics, no advertising and no tracking. We do not collect, store or share any personal information.</p>
  <h3>What stays on your device</h3><p>The cards you keep, which cards you’ve read, your reading counts and your reminder setting are saved only on your phone so the app can remember them. Deleting the app removes them. You can also clear them any time in Settings.</p>
  <h3>Subscriptions and payments</h3>
<p>Wisebyte - Scroll is available by monthly subscription, either on its own or as part of Wisebyte All Access, which also unlocks our other Wisebyte apps. Subscriptions are sold and managed by Apple (App Store) or Microsoft (Microsoft Store), depending on where you got the app. We never receive your payment details. The store tells the app only whether your account has an active subscription. See <a href="https://www.apple.com/legal/privacy/">Apple's Privacy Policy</a> and the <a href="https://privacy.microsoft.com/privacystatement">Microsoft Privacy Statement</a> for how they handle your information.</p>
<p>If you have Wisebyte All Access, the app saves a small note on your device (on iPhone and iPad, in storage shared only between our own Wisebyte apps) saying that All Access is active and when that was last confirmed, so your other Wisebyte apps on the same device can unlock too. It contains no personal information.</p>

  <h3>Sharing</h3><p>When you share a card, the text goes only to the app you choose, using your phone’s standard share sheet.</p>
  <h3>Children</h3><p>The app is intended for a general audience aged 12 and over and does not knowingly collect any information from anyone.</p>
  <h3>Changes</h3><p>If this policy changes, the updated version will appear here and on our website.</p>
  ${CONFIG.supportEmail?`<h3>Contact</h3><p>Questions? Email <a href="mailto:${esc(CONFIG.supportEmail)}">${esc(CONFIG.supportEmail)}</a>.</p>`:""}
</div>`;

$("#keptBtn").addEventListener("click",showKept);
$("#menuBtn").addEventListener("click",showSettings);
$("#closeSheet").addEventListener("click",closeSheet);
sheetBack.addEventListener("click",()=>{ if(sheetBackTo) sheetBackTo(); });
sheet.addEventListener("click",e=>{
  if(e.target===sheet){ closeSheet(); return; }
  const li=e.target.closest(".kept-list li");
  if(li && e.target.closest("[data-open]")){ showReader(li.dataset.id); return; }
  if(li && e.target.closest("[data-remove]")){ const id=li.dataset.id; kept=kept.filter(k=>k!==id); store.set("wbs-kept",kept); syncKeep(id); showKept(); return; }
  if(e.target.closest("[data-privacy]")){ openSheet("Privacy", PRIVACY, showSettings); return; }
  if(e.target.closest("[data-terms]")){ openDoc("terms.html"); return; }
  if(e.target.closest("[data-sub]")){ if(WBStore.mode!=="preview"&&WBStore.entitled()) WBStore.manage(); else { closeSheet&&closeSheet(); WBStore.showPaywall({dismissable:true}); } return; }
  if(e.target.closest("[data-restore]")){ WBStore.restore().then(()=>toast(WBStore.entitled()?"Subscription restored":"No active subscription found")); return; }
  const c=e.target.closest("[data-confirm]");
  if(c){
    if(!c.dataset.armed){ c.dataset.armed="1"; c.querySelector("span").firstChild.textContent="Tap again to confirm"; setTimeout(()=>{ if(c.isConnected) showSettings(); },3500); return; }
    if(c.dataset.confirm==="history"){ seen=new Set(); day={d:dateKey(),n:0}; total=0; store.set("wbs-seen",[]); store.set("wbs-day",day); store.set("wbs-total",0); store.set("wbs-welcomed",false); $("#today").textContent=0; toast("Reading history cleared"); }
    else { kept=[]; store.set("wbs-kept",[]); document.querySelectorAll("[data-keep]").forEach(b=>{b.setAttribute("aria-pressed",false);b.setAttribute("aria-label","Keep")}); $("#keptCount").textContent=0; toast("Kept cards cleared"); }
    showSettings();
  }
});
sheet.addEventListener("change",async e=>{
  if(e.target.id==="remindOn"){ settings.remind=e.target.checked; $("#remindTimeRow").hidden=!settings.remind; await applyReminder(); }
  if(e.target.id==="remindTime" && e.target.value){ settings.time=e.target.value; await applyReminder(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !sheet.hidden) closeSheet(); });

/* ---------- Daily reminder (iPhone only) ---------- */
async function applyReminder(){
  if(!Notes) return;
  try{
    await Notes.cancel({notifications:[{id:1}]});
    if(settings.remind){
      let perm = await Notes.checkPermissions();
      if(perm.display!=="granted") perm = await Notes.requestPermissions();
      if(perm.display!=="granted"){
        settings.remind=false; const t=$("#remindOn"); if(t) t.checked=false; const r=$("#remindTimeRow"); if(r) r.hidden=true;
        toast("Allow notifications in Settings to get reminders");
      }else{
        const [hour,minute]=settings.time.split(":").map(Number);
        await Notes.schedule({notifications:[{id:1,title:"Wisebyte - Scroll",body:"A few new ideas are waiting for you.",schedule:{on:{hour,minute},allowWhileIdle:true}}]});
        toast(`Reminder set for ${new Date(2000,0,1,hour,minute).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}`);
      }
    }
  }catch(e){ toast("Couldn’t set the reminder"); }
  store.set("wbs-settings",settings);
}

function openDoc(url){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))";
  d.innerHTML=`<iframe src="${esc(url)}" title="Document" style="flex:1;width:100%;max-width:720px;margin:0 auto;border:0;border-radius:14px;background:var(--bg)"></iframe><button class="btn solid" style="margin:10px auto 0">Close</button>`;
  d.querySelector("button").onclick=()=>d.remove(); document.body.appendChild(d);
}
/* ---------- Start ---------- */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) rollDay(); });
(async function start(){
  await store.init();
  loadState();
  $("#keptCount").textContent=kept.length;
  ready=true;
  reset();
  WBStore.onChange(ok=>{ if(ok) WBStore.hidePaywall(); else WBStore.showPaywall(); });
  WBStore.init({app:"scroll",theme:"stoic",headline:"Keep scrolling, keep learning",
    pitch:"An endless feed of small, true ideas worth knowing.",
    features:[`More than ${Math.floor(POOL.length/100)*100} cards: facts, words, quotes, life skills and puzzles`,"Keep the cards you love and come back to them","New cards added regularly"],
    openDoc:u=>openDoc(u), termsUrl:"terms.html", privacyUrl:"privacy.html"}).then(()=>WBStore.require()).catch(()=>{});
  try{ if(StatusBar) await StatusBar.setStyle({style:"DARK"}); }catch(e){}
  try{ if(Splash) await Splash.hide(); }catch(e){}
})();
