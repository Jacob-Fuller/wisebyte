king to us","Launched in 1977, Voyager 1 is the most distant human-made object, now more than 24 billion km away. Its radio signals take about a full day to reach Earth. It carries a golden record of sounds and music from Earth.","Built with 1970s technology, it is still sending data, proof that great engineering lasts."],["Space","Sixteen sunrises a day","The International Space Station orbits Earth about every 90 minutes at roughly 28,000 km/h. That means astronauts see around 16 sunrises and sunsets every day. You can often spot it from Earth as a bright, steady moving light.","Check a space station tracker, and you can see people living in space from your backyard."],["Space","Astronauts grow taller in space","Without gravity compressing the spine, astronauts can grow up to about 3% taller during long missions. They shrink back after returning to Earth, often with some back pain as the spine readjusts.","Our bodies are shaped by gravity in ways we never notice on the ground."],["Space","Mars has blue sunsets","On Mars the daytime sky looks butterscotch, but sunsets glow blue. Fine Martian dust scatters blue light forward, near the direction of the Sun. NASA rovers have photographed these cool blue evenings.","The same physics can produce opposite colours on different worlds."],["Space","A Martian day is almost ours","A day on Mars, called a sol, lasts about 24 hours and 39 minutes. Mission teams working on Mars time must shift their schedule by roughly 40 minutes every day, which is exhausting over weeks.","Small differences add up. A 40-minute shift daily can scramble a whole team’s body clocks."],["Space","Pluto has not finished a lap","Pluto takes about 248 Earth years to orbit the Sun. Since it was discovered in 1930, it has completed less than half of one orbit. It was reclassified as a dwarf planet in 2006.","Some cycles are longer than human history, which makes patience a scientific virtue."],["Space","Neptune was found with maths","Uranus was not moving quite as predicted, so French mathematician Urbain Le Verrier calculated where an unseen planet must be. In 1846, astronomer Johann Galle pointed his telescope there and found Neptune within about a degree.","Careful reasoning about small errors can reveal something enormous."],["Space","A moon that sprays water into space","Saturn’s small icy moon Enceladus shoots jets of water vapour and ice from cracks near its south pole. NASA’s Cassini spacecraft flew through them and found salts and organic molecules from an ocean beneath the ice.","Places that could support life may be hiding under the ice of distant moons."],["Space","Europa may hold more water than Earth","Jupiter’s moon Europa is covered in ice, and beneath it scientists believe lies a salty ocean. Though Europa is smaller than our Moon, that ocean may hold about twice as much water as all of Earth’s oceans.","Water, a key ingredient for life, may be common in our solar system."],["Space","Titan has lakes, but not of water","Saturn’s moon Titan is the only place besides Earth known to have stable liquid on its surface. Its lakes and seas are filled with liquid methane and ethane, and it even rains hydrocarbons.","The same processes that shape Earth can play out with completely different chemistry."],["Space","Why stars twinkle but planets barely do","Stars are so distant they appear as single points of light, which turbulent air easily jiggles. Planets are close enough to appear as tiny discs, so the wobbles largely average out. A steady bright “star” is often a planet.","Next clear night, you can pick out planets with your naked eye."],["Space","Space is only 100 km away","The Kármán line, a widely used boundary of space, is 100 km above sea level. That is roughly the distance of an hour’s drive on a highway. Most of Earth’s air lies within the lowest 10 to 15 km.","Our atmosphere is a thin, fragile layer, which is why protecting it matters."],["Space","Shooting stars are space dust","Most meteors are specks of rock no bigger than a grain of sand, burning up as they hit our atmosphere at high speed. Meteor showers happen when Earth passes through dust trails, usually left behind by comets.","Something tiny can put on a spectacular show when it moves fast enough."],["Space","The Moon is as dark as asphalt","The Moon looks brilliant at night, but its surface reflects only about 12% of the sunlight hitting it, similar to worn asphalt. It only seems bright because it is lit by full sunlight against a black sky.","Brightness is relative. Context changes how we perceive everything."],["Space","Earth is closest to the Sun in January","Earth’s orbit is slightly oval, and we are nearest the Sun in early January. That is summer in Australia but winter in the north. Seasons are caused by Earth’s tilt, not its distance from the Sun.","The obvious explanation is often wrong. Look for the real cause."],["Space","The first human in space","On 12 April 1961, Soviet cosmonaut Yuri Gagarin became the first person in space. His Vostok 1 flight made one orbit of Earth and lasted about 108 minutes. He was 27 years old.","It took less than a lifetime to go from the first plane flights to human spaceflight."],["Space","Only 12 people have walked on the Moon","So far, just 12 people have walked on the Moon, all American astronauts on six Apollo missions between 1969 and 1972. No one has set foot there since Apollo 17 left in December 1972.","Progress is not always a straight line. Some achievements go unmatched for decades."],["Space","The Sun is white, not yellow","The Sun gives off light across all visible colours, so from space it looks white. It seems yellow, orange or red from the ground because our atmosphere scatters away some of the blue light.","What we see is filtered by our surroundings, and not just in astronomy."],["Space","Australia has its own aurora","The aurora australis, or southern lights, forms when charged particles from the Sun collide with gases high in our atmosphere. It is often visible from Tasmania and, during strong solar storms, from much further north.","You do not need to travel to the Arctic to see the sky glow."],["Space","The first photo of a black hole","In 2019, the Event Horizon Telescope team released the first image of a black hole’s shadow, in the galaxy M87. They linked radio dishes across the globe to create a virtual telescope as wide as the Earth.","Global teamwork can accomplish what no single nation or instrument could."],["Space","Our nearest star is still very far","Proxima Centauri, the closest star to the Sun, is about 4.2 light-years away. Travelling at Voyager 1’s speed, the journey would take more than 70,000 years.","The distances between stars make interstellar travel one of the hardest problems there is."],["Space","You are made of stardust","The hydrogen in your body formed soon after the Big Bang. Most heavier elements, like the carbon in your cells, the calcium in your bones and the iron in your blood, were forged inside stars and scattered when they died.","You are literally part of the universe’s long story."],["Space","The Big Bang’s afterglow was on TV","Old analogue TVs showed static when tuned between channels. A small part of that static came from the cosmic microwave background, the faint afterglow of the early universe, released about 380,000 years after the Big Bang.","Evidence for the universe’s origin was hiding in plain sight in ordinary living rooms."],["Space","The Southern Cross is the smallest constellation","Crux, the Southern Cross on the Australian flag, is the smallest of the 88 official constellations. Travellers have long used it to find south: extend its long axis about four and a half times to locate the south celestial pole.","A small group of stars has guided navigators for centuries."],["Space","Halley’s Comet returns every 76 years","Halley’s Comet comes back to the inner solar system about every 76 years. It last appeared in 1986 and is expected again in 2061. Edmond Halley correctly predicted its return, though he died before it arrived.","Good science makes predictions that outlive the people who make them."],["Space","The cosmic coincidence behind eclipses","The Sun is about 400 times wider than the Moon, and also about 400 times further away. So both look almost exactly the same size in our sky. That lucky match lets the Moon cover the Sun almost exactly during a total eclipse.","Total solar eclipses are a rare, fleeting gift. Catch one if you can."],["Space","Webb telescope lives 1.5 million km away","The James Webb Space Telescope, launched on 25 December 2021, orbits a point about 1.5 million km from Earth. There, its giant sunshield can block the Sun, Earth and Moon at once, keeping it cold enough to detect faint infrared light from the earliest galaxies.","Where you place a tool can matter as much as the tool itself."],["Space","The Sun will become a red giant","In about 5 billion years, the Sun will run low on hydrogen in its core and swell into a red giant, likely swallowing Mercury and Venus. Earth’s fate is uncertain, but it will be scorched long before.","Even stars have life cycles. Nothing lasts forever, which gives the present its value."],["Nature","The platypus hunts with electricity","The platypus finds food by sensing the tiny electrical signals made by the muscles of its prey. Underwater it closes its eyes, ears and nostrils and relies on thousands of receptors in its bill. It is also one of the few mammals that lay eggs.","Some of the strangest solutions in nature belong to animals we think we already know."],["Nature","Koalas have fingerprints like ours","Koalas have fingerprints remarkably similar to human ones. Their loops and whorls are so alike that even under a microscope they can be hard to tell apart. Scientists think they evolved independently, perhaps to help koalas grip branches and handle leaves.","Unrelated species facing similar problems often arrive at similar solutions, a process called convergent evolution."],["Nature","A joey starts life jellybean-sized","A newborn kangaroo is about the size of a jellybean. Blind and hairless, it crawls unaided into its mother’s pouch, where it stays attached to a teat for months. Females can even pause the development of a spare embryo until conditions improve.","Marsupials invest in their young mostly after birth, a strategy that suits Australia’s unpredictable seasons."],["Nature","Cassowary dads do all the parenting","Male cassowaries raise the chicks entirely on their own. After the female lays her eggs, the male incubates them for around 50 days, then guards the striped chicks for about nine months. Cassowaries also spread the seeds of many rainforest plants by swallowing fruit whole.","Losing one key animal can quietly change a whole rainforest."],["Nature","A baby echidna is called a puggle","A baby echidna is called a puggle. The mother lays a single soft-shelled egg straight into a temporary pouch, and the puggle hatches about ten days later. It leaves the pouch once its spines begin to grow.","Echidnas and the platypus are the only living monotremes, the egg-laying mammals."],["Nature","The reef built by tiny animals","The Great Barrier Reef is the largest structure built by living things. It stretches about 2,300 km along the Queensland coast and is made up of roughly 3,000 individual reefs. It was built over thousands of years by tiny animals called coral polyps.","Small efforts repeated over a long time can build something immense."],["Nature","The lyrebird can copy almost anything","The superb lyrebird is one of the world’s finest mimics. Males copy the calls of many other bird species and weave them into their own song to impress females. Some have been recorded imitating human-made sounds such as camera shutters and car alarms.","A lyrebird’s song is a living record of the sounds of its forest."],["Nature","The devil’s contagious cancer","Tasmanian devils are threatened by a cancer that spreads like an infection. Devil facial tumour disease passes between animals when they bite each other, transferring living cancer cells. Since it was first seen in the 1990s, devil numbers have fallen sharply.","Contagious cancers are extremely rare, which makes the devil important to cancer research as well as conservation."],["Nature","The kingfisher that rarely fishes","The kookaburra is a giant kingfisher that rarely eats fish. Laughing kookaburras mostly hunt lizards, insects, snakes and small mammals on land. Their famous laugh is a territorial call, often performed as a family chorus at dawn and dusk.","Names can mislead: a family name tells you about ancestry, not necessarily habits."],["Nature","Salties are not just for the sea","The saltwater crocodile is the world’s largest living reptile. Large males can grow beyond 6 metres and weigh about a tonne. Despite the name, they live in rivers, estuaries and billabongs across northern Australia as well as the sea.","In the Top End, any waterway can hold crocodiles, so always obey warning signs."],["Nature","Tiny animals that survived space","Tardigrades have survived exposure to outer space. In 2007, these tiny eight-legged animals were sent into orbit on a satellite, and some survived the vacuum and radiation. They endure extremes by drying out and entering a state of suspended animation.","Resilience can mean knowing when to shut down and wait for better conditions."],["Nature","The forest that is one tree","A grove in Utah that looks like a forest is really a single living thing. Pando is made of tens of thousands of aspen trunks that share one root system and identical genes. It covers about 43 hectares and is one of the heaviest organisms known.","What looks like many separate things is sometimes one connected system."],["Nature","The giant fungus under Oregon","One of the largest organisms on Earth is a fungus. A single honey fungus in Oregon’s Blue Mountains spreads underground across almost 10 square kilometres. Most of it is hidden, with only clumps of mushrooms appearing at the surface in autumn.","Much of the living world is out of sight, below our feet."],["Nature","Half of Earth’s oxygen is made at sea","Around half of the oxygen produced on Earth comes from the ocean. It comes from phytoplankton, microscopic drifting organisms that photosynthesise near the surface. One of them, a bacterium called Prochlorococcus, is thought to be the most abundant photosynthesising organism on Earth.","Healthy oceans matter even to people who live far from the coast."],["Nature","The biggest animal eats the smallest food","The blue whale is the largest animal known to have ever lived. It can reach about 30 metres long and weigh well over 100 tonnes, heavier than any known dinosaur. Yet it feeds mainly on krill, crustaceans only a few centimetres long.","Huge things can be powered by tiny resources, as long as there are enough of them."],["Nature","Most magpies never swoop","Magpies that swoop are usually males protecting their nests. Swooping season generally runs from about August to November, while there are eggs or chicks in the nest. Only a minority of magpies swoop at all, and they may learn to recognise individual people.","For a few weeks, a different route is usually the simplest fix."],["Nature","Crows that make their own tools","New Caledonian crows make their own tools. They shape twigs and leaves into hooks and probes to pull insects out of holes, and young birds learn by watching adults. In experiments, they have solved puzzles that require several steps in the right order.","Intelligence evolved more than once, in brains built very differently from ours."],["Nature","The salamander that regrows its limbs","The axolotl can regrow lost body parts without scarring. This Mexican salamander can regenerate legs, its tail, parts of its spinal cord and even parts of its heart and brain. Scientists study it hoping to improve wound healing in people.","Axolotls are critically endangered in the wild, surviving mainly in canals around Mexico City."],["Nature","Owls cannot move their eyes","Owls cannot move their eyes in their sockets. Their eyes are tube-shaped and fixed in place, so owls turn their heads instead, up to about 270 degrees. Special adaptations in their neck blood vessels keep blood flowing to the brain as they twist.","Every body design is a trade-off: huge, forward-facing eyes gave owls superb night vision but fixed them in place."],["Nature","The lake where lightning rarely stops","Lake Maracaibo in Venezuela is the lightning capital of the world. NASA satellite data found about 233 flashes per square kilometre each year there, more than anywhere else on Earth. Storms build over the lake on most nights of the year, and sailors once used the flickering glow as a natural lighthouse.","Local geography can create weather that is almost as reliable as clockwork."],["Nature","The bird that decorates in blue","Male satin bowerbirds build a stick structure called a bower and decorate it almost entirely with blue objects. Near towns they collect bottle caps, pegs and straws to impress females. They even paint the inner walls with a mix of chewed plants and saliva.","Around Australian homes, a missing blue peg may have been taken by a hopeful bowerbird."],["Nature","Why snowflakes have six sides","Almost every snowflake has six sides or six arms. This comes from the way water molecules bond together as they freeze, forming a hexagonal pattern. The endless variety of shapes depends on the temperature and humidity each crystal meets as it falls.","Simple rules, applied in slightly different conditions, can create endless variety."],["Nature","A jellyfish with 24 eyes","The box jellyfish has no brain, yet it has 24 eyes. They sit in four clusters around its bell, and some even have lenses that can form images. Box jellyfish use them to steer around obstacles and find their way through murky coastal water.","Found in northern Australian waters, box jellyfish are why many tropical beaches have stinger nets and vinegar stations."],["Nature","A westerly comes from the west","Winds are named for the direction they blow from. A westerly blows from the west towards the east, and a sea breeze blows in from the sea. That is why Sydney’s famous “southerly buster” brings a sudden rush of cool air up from the south.","Knowing this makes weather forecasts much easier to read."],["Nature","The Venus flytrap can count","The Venus flytrap can count. Its trap snaps shut only when trigger hairs are touched twice within about 20 seconds, which avoids wasting energy on raindrops or debris. After about five touches, it starts making digestive enzymes.","Even without a brain, living things can make surprisingly careful decisions."],["Nature","Young sunflowers follow the Sun","Young sunflowers track the Sun across the sky. During the day the stem grows faster on one side, turning the bud from east to west, and at night it swings back. Once mature, most face east permanently, which warms the flowers and attracts more bees.","Plants move more than we realise, just too slowly for us to notice."],["Nature","A “fossil” tree found near Sydney","The Wollemi pine was known only from fossils until 1994. That year a national parks officer on a bushwalk found living trees in a remote gorge in Wollemi National Park, north-west of Sydney. Fewer than 100 adult trees grow in the wild, and their location is kept secret.","Major discoveries can still happen close to big cities. During the 2019–20 bushfires, firefighters worked specially to save the grove."],["Nature","Why the Blue Mountains look blue","The Blue Mountains get their colour from eucalyptus trees. Eucalypts release oils into the air, and the tiny droplets scatter blue light, giving the distant ridges a soft blue haze. The effect is strongest on warm, still days.","A landscape’s character can come from something invisible in its air."],["Nature","Gum trees are built for bushfire","Many eucalypts are built to survive bushfire. Buds hidden under their thick bark sprout new leaves after a fire, which is why blackened trunks turn fuzzy green within weeks. Some species also regrow from a woody swelling at their base called a lignotuber.","Fire has shaped Australian plants for millions of years, and many rely on it to regenerate."],["Nature","The world’s biggest plant is a seagrass","The largest known plant on Earth is a seagrass in Western Australia. In 2022, scientists found that a meadow in Shark Bay covering about 200 square kilometres is a single plant that spread by cloning itself. It is estimated to be at least 4,500 years old.","Seagrass meadows shelter marine life and store carbon, so protecting them helps the climate."],["Nature","Male seahorses give birth","In seahorses, it is the male that gives birth. The female places her eggs in a pouch on the male’s belly, where he fertilises and carries them for a few weeks. He then releases the tiny, fully formed young, sometimes hundreds at a time.","Nature has far more variety in parenting roles than we tend to assume."],["Nature","Every clownfish starts out male","Every clownfish matures first as a male. They live in small groups led by a single breeding female, who is the largest fish. If she dies, the biggest male changes sex and takes her place.","Some fish can change sex during life, a trait found in hundreds of species."],["Nature","Dolphins sleep with half a brain","Dolphins sleep with one half of their brain at a time. One hemisphere rests while the other stays alert, so they can keep surfacing to breathe and watch for danger. They often close the eye opposite the sleeping half.","Sleep is so vital that even animals that can never fully switch off have found a way to get it."],["Nature","Honeybees give directions by dancing","Honeybees tell each other where food is by dancing. In the “waggle dance”, the angle of the dance shows the direction of the food relative to the Sun, and the length of the waggle shows the distance. Karl von Frisch shared a Nobel Prize in 1973 for decoding it.","Complex communication does not require words, or even a large brain."],["Nature","There are 20 quadrillion ants","There are roughly 20 quadrillion ants on Earth. A 2022 study estimated that is about 2.5 million ants for every person. Together they outweigh all the world’s wild birds and wild mammals combined.","Small creatures, in vast numbers, quietly run many of Earth’s ecosystems."],["Nature","Termite mounds that face north","Some termites in the Northern Territory build compass-aligned mounds. Magnetic termite mounds are thin, flat wedges that point roughly north to south. Their broad sides catch the gentle morning and afternoon sun, while the narrow edge faces the harsh midday heat.","It is natural climate control, and engineers study mounds like these to design cooler buildings."],["Nature","The numbat eats 20,000 termites a day","A numbat can eat up to 20,000 termites a day. This striped marsupial from Western Australia uses a long, sticky tongue to lick them out of shallow soil tunnels. Unusually for a marsupial, it is active by day, matching the termites’ timetable.","The numbat is endangered, and fox control has been key to its recovery."],["Nature","A shark that may live 400 years","The Greenland shark may live for around 400 years. A 2016 study dated tissue in the eyes of these slow-growing Arctic sharks and estimated the oldest was at least 270 years old, and possibly far older. That makes it the longest-lived vertebrate known.","Some sharks alive today were born before Captain Cook reached Australia."],["Nature","Why coral turns white","Corals get most of their food from tiny algae living inside them. When the water gets too warm, corals expel these algae and turn white, which is called bleaching. If high temperatures last too long, the corals can starve and die.","Even a small rise in sea temperature, held for weeks, can damage an entire reef."],["Nature","Hurricanes, typhoons and cyclones","Hurricanes, typhoons and cyclones are the same kind of storm. The name depends on where it forms: hurricanes in the Atlantic and north-east Pacific, typhoons in the north-west Pacific, and cyclones in the South Pacific and Indian Ocean. In the Southern Hemisphere they spin clockwise.","One weather system, three names: geography, not strength, decides the label."],["Nature","The coldest place ever measured","The coldest air temperature reliably recorded on Earth is minus 89.2°C. It was measured in 1983 at the Soviet (now Russian) Vostok Station, high on the Antarctic ice sheet. Satellites have detected even colder surface temperatures in parts of East Antarctica.","Antarctica’s extremes make it a natural laboratory for studying Earth’s climate."],["Nature","The biggest flower has no leaves","The world’s largest single flower has no leaves, stem or roots. Rafflesia arnoldii, from the rainforests of Sumatra and Borneo, can grow about a metre across. It lives as a parasite inside a vine and smells like rotting meat to attract flies.","Plants do not all make their own food: some survive entirely by stealing it."],["Nature","Birds are living dinosaurs","Birds are living dinosaurs. They descend from small feathered theropods, the same group that includes Tyrannosaurus and Velociraptor. When you watch a magpie or an emu, you are seeing a dinosaur lineage that survived the mass extinction 66 million years ago.","Dinosaurs never entirely disappeared: around 10,000 species of them are still flying around."],["Nature","A non-stop flight to Tasmania","A bar-tailed godwit once flew 13,560 km without stopping. In 2022, a young bird tagged in Alaska flew to Tasmania in about 11 days, without eating, drinking or landing. Godwits make similar journeys to Australia and New Zealand each year.","Protecting migratory birds means protecting wetlands across many countries."],["Nature","Butterflies taste with their feet","Butterflies taste with their feet. Sensors on their legs detect chemicals when they land. This helps females check whether a plant is the right food for their caterpillars before laying eggs.","Animals sense the world in ways that can be very different from our own."],["Nature","The frog that freezes solid","The wood frog can freeze solid and survive. In North American winters, around two thirds of its body water turns to ice and its heart stops beating. It floods its cells with glucose as a natural antifreeze and thaws back to life in spring.","Researchers study it for ideas on preserving human organs for transplant."],["Nature","Australia’s metre-long earthworm","Victoria is home to one of the world’s biggest earthworms. The giant Gippsland earthworm averages about a metre long and can stretch much further. It lives in deep, moist burrows, and you can sometimes hear it gurgling as it moves underground.","It is found nowhere else on Earth and is threatened by soil disturbance."],["Nature","Funnel-web antivenom works","There have been no recorded deaths from funnel-web spider bites since antivenom was introduced in 1981. The antivenom is made using venom milked from spiders, some caught by the public and handed in to the Australian Reptile Park. First aid is a pressure immobilisation bandage and calling 000.","A dangerous animal becomes far less deadly when good first aid and treatment are close at hand."],["Nature","Cane toads were brought in on purpose","Cane toads were introduced to Australia deliberately. In 1935, about 100 toads were brought from Hawaii to Queensland and bred, and thousands of their young were released to eat beetles damaging sugar cane. They did little to control the beetles, and their descendants have spread across much of northern Australia.","Fixes that ignore the whole ecosystem can create bigger problems than the ones they solve."],["Nature","A tree older than the pyramids","Some living trees were already growing when the Great Pyramid was built. A Great Basin bristlecone pine in California known as Methuselah is more than 4,800 years old. Its exact location is kept secret to protect it.","Harsh, slow-growing conditions can produce the longest lives."],["Geography","Canada has the longest coastline","Canada has the longest coastline of any country. Including its thousands of islands, it runs for more than 200,000 kilometres. That is several times the length of Australia’s mainland coast.","Coastline length depends on how finely you measure, a puzzle known as the coastline paradox."],["Geography","France has the most time zones","France covers more time zones than any other country. Thanks to overseas territories in the Pacific, the Caribbean and the Indian Ocean, it spans 12 time zones. Russia, the largest country by area, has 11.","Old empires left long shadows on the map, from territories to time zones."],["Geography","The lake holding a fifth of fresh water","Lake Baikal in Siberia holds about a fifth of the world’s unfrozen fresh surface water. It is the deepest lake on Earth, reaching about 1,640 metres, and one of the oldest, at around 25 million years. It holds more water than all five North American Great Lakes combined.","A single lake can be one of the planet’s most valuable natural resources."],["Geography","The lowest land on Earth","The shores of the Dead Sea are the lowest land on Earth. They lie more than 430 metres below sea level and drop further each year as the water level falls by about a metre annually. Its water is so salty that people float with ease.","The Dead Sea is shrinking mainly because the water that once fed it is used upstream."],["Geography","The smallest country in the world","The smallest country in the world is smaller than many city parks. Vatican City covers about 0.44 square kilometres inside Rome. It has its own flag, post office and passports, but a population of only a few hundred.","Sovereignty is about recognition and law, not size."],["Geography","Australians hug the coast","Most Australians live within about 50 km of the coast. The country is roughly the size of the mainland United States, yet much of its interior is very sparsely populated. Australia is also one of the most urbanised nations on Earth, with most people living in a handful of coastal cities.","A map of land area says little about where people actually live."],["Geography","Australia’s lowest point is a lake","Australia’s lowest point is a lake that is usually dry. Kati Thanda–Lake Eyre in South Australia sits about 15 metres below sea level. It fills completely only rarely, and when it does, pelicans and other waterbirds flock there from far away.","Outback ecosystems are built around rare booms, not steady conditions."],["Geography","Some of Earth’s cleanest air","Some of the cleanest air on Earth is measured in north-west Tasmania. The Cape Grim station samples winds that have crossed thousands of kilometres of Southern Ocean. Its records, going back to 1976, help scientists track global changes in the atmosphere.","Clean baseline air lets scientists measure the whole planet’s atmosphere, not just local pollution."],["Geography","An 85-letter place name","A hill in New Zealand has one of the world’s longest place names. Its Māori name, usually shortened to Taumata, runs to 85 letters. It tells of Tamatea, an ancestor said to have played his flute there to a loved one.","Place names can carry whole stories, not just labels."],["Geography","The longest river is disputed","Nobody can say for certain whether the Nile or the Amazon is longer. Both are roughly 6,400 to 7,000 kilometres long, and the answer depends on where you decide each river begins and ends. Most references list the Nile first.","Even simple-sounding facts can depend on definitions."],["Geography","The Amazon’s enormous flow","The Amazon carries more water than any other river. It delivers roughly a fifth of all the fresh water that rivers pour into the oceans. Its outflow is so strong that fresh water pushes far out into the Atlantic.","The Amazon basin’s health affects rainfall and climate well beyond South America."],["Geography","Africa is bigger than it looks","Africa is about 14 times bigger than Greenland, even though many maps make them look similar. The familiar Mercator projection, created in 1569 for sailors, stretches areas more and more towards the poles. It is great for navigation but badly distorts size.","Every flat map distorts something, so it pays to know which trade-off a map has made."],["Geography","The loneliest place in the ocean","The most remote spot in the ocean is called Point Nemo. It lies in the South Pacific about 2,700 km from the nearest land. Space agencies use the area as a graveyard for old spacecraft, and at times the nearest humans are astronauts on the International Space Station.","Remoteness is relative: sometimes the closest people are overhead, not on Earth."],["Geography","About 7,000 languages are spoken","About 7,000 languages are spoken in the world today. Yet more than half the world’s population speaks one of just 23 of them. Around 40 per cent of all languages are endangered, many with fewer than 1,000 speakers.","When a language disappears, a unique way of seeing the world goes with it."],["Geography","The country with 840 languages","Papua New Guinea has more languages than any other country. Around 840 are spoken there, more than a tenth of the world’s total. Rugged mountains, valleys and forests kept communities apart for thousands of years, letting languages develop separately.","Geography does not just shape landscapes, it shapes how people speak."],["Geography","The world’s most spoken language","Mandarin Chinese has the most native speakers, but English has the most speakers overall. Only about 400 million people speak English as a first language, yet around 1.5 billion speak it in total. For most of them it is a second language.","English is now mostly spoken by non-native speakers, which shapes how it is used worldwide."],["Geography","Australia’s first languages","Before 1788, more than 250 distinct languages were spoken across Australia. Counting dialects, there were around 800 varieties. Many place names, such as Parramatta, Wagga Wagga and Uluru, come from First Nations languages, and communities today are working to revive them.","Place names are a daily reminder of the languages that shaped the land first."],["Geography","Two countries are doubly landlocked","Only two countries in the world are doubly landlocked. Liechtenstein and Uzbekistan are surrounded entirely by other landlocked countries, so reaching the sea means crossing at least two borders. Liechtenstein sits between Switzerland and Austria.","Access to the sea has shaped trade, and history, for thousands of years."],["Geography","The country with the highest low point","Lesotho is a country completely surrounded by South Africa. It is also the only independent country lying entirely above 1,000 metres. Its lowest point is about 1,400 metres above sea level, the highest lowest point of any nation.","High altitude gives Lesotho cold winters and snow, unusual for southern Africa."],["Geography","The longest border in the world","The border between Canada and the United States is the longest international border in the world. It runs for about 8,900 kilometres, including the long land border with Alaska. For about 2,000 km in the west, it follows a straight line along the 49th parallel.","Many borders are drawn by treaty on a map, not by rivers or mountains."],["Geography","Two islands, almost a day apart","Two islands less than 4 km apart are nearly a full day apart in time. Big Diomede belongs to Russia and Little Diomede to the United States, with the International Date Line running between them. In winter, the sea between them can freeze over.","The date line is an agreed convention, not a physical feature."],["Geography","The first country to see New Year","Kiribati is the first country to welcome each New Year. Its Line Islands sit in the UTC+14 time zone, the earliest on Earth. In 1995, Kiribati shifted the International Date Line so the whole country would share the same calendar day.","Countries can, and do, redraw the invisible lines that organise time."],["Geography","The peak farthest from Earth’s centre","The point on Earth farthest from its centre is not the top of Everest. Because Earth bulges at the equator, the summit of Chimborazo in Ecuador is about 2 km further from the centre than Everest’s peak, even though it is lower above sea level.","The answer to “highest” depends on what you measure from."],["Geography","Australia’s highest mountain isn’t Kosciuszko","Australia’s highest mountain is not Kosciuszko. Mount Kosciuszko, at 2,228 metres, is the highest on the mainland. But Mawson Peak, an active volcano on Heard Island in the sub-Antarctic, rises to about 2,745 metres, the highest peak on Australian territory outside Antarctica.","Australia’s external territories stretch from the Indian Ocean to Antarctica."],["Geography","The Sahara is mostly not sand","The Sahara is roughly the size of the United States. Yet only about a quarter of it is covered in sand dunes. Most of it is rocky plateaus, gravel plains and mountains, some of which occasionally see snow.","Deserts are defined by lack of rain, not by sand."],["Geography","The largest desert is icy","Antarctica is the largest desert on Earth. A desert is defined by low precipitation, not heat, and much of the Antarctic interior receives very little snow each year. Yet its ice sheet holds about 70 per cent of the world’s fresh water.","If all of Antarctica’s ice melted, sea levels would rise by many tens of metres."],["Geography","The only non-rectangular flag","Nepal has the only national flag that is not a rectangle or square. It is made of two stacked triangular pennants, bearing a Moon and a Sun. Nepal’s constitution sets out the exact geometric steps for drawing it.","Symbols are designed with remarkable care when they represent a nation."],["Geography","The world’s highest seat of government","Bolivia has two capitals. Sucre is the constitutional capital, while the government sits in La Paz, which at about 3,600 metres is the highest seat of government in the world. Visitors often need a few days to adjust to the thin air.","Altitude affects everything there, from breathing to the temperature at which water boils."],["Geography","Alaska is the most eastern state","Alaska is the northernmost, westernmost and easternmost US state. Its Aleutian Islands stretch so far that some cross the 180° meridian into the Eastern Hemisphere. By that measure, parts of Alaska are further east than Maine.","Directions on a round planet can defy common sense."],["Geography","Reno is west of Los Angeles","Reno, Nevada, is further west than Los Angeles. California’s coast slants eastward as it heads south, so LA lies further east than most people picture. Our mental maps tend to straighten out real coastlines.","Checking a map often beats trusting your sense of direction."],["Geography","The Panama Canal runs backwards","Sailing through the Panama Canal from the Atlantic to the Pacific, you travel south-east. The Isthmus of Panama bends in an S shape, so the canal’s Pacific end is actually further east than its Atlantic end.","Geography rarely matches the neat assumptions in our heads."],["Geography","Ecuador is named after the equator","Ecuador is simply Spanish for “equator”. The line passes just north of the capital, Quito, where a monument marks the “Middle of the World”. The equator also crosses 12 other countries, from Brazil and Kenya to Indonesia.","Even a country’s name can be a geography lesson."],["Geography","Greenland’s name was a sales pitch","Greenland was named to attract settlers. According to Icelandic sagas, Erik the Red chose the name in the 980s, reasoning that people would be more willing to go to a land with an appealing name. Today about 80 per cent of the island is covered by ice.","Marketing is far older than advertising agencies."],["Geography","Australia is on the move","Australia moves about 7 centimetres north each year. It rides on one of the fastest-moving continental plates. The drift adds up, so a new official datum released in 2017, GDA2020, shifted the country’s map coordinates by about 1.8 metres to keep GPS positions accurate.","The ground beneath us is slowly moving, and modern navigation has to account for it."],["Geography","The world’s largest lake is a “sea”","The world’s largest lake is called a sea. The Caspian Sea covers about 370,000 square kilometres, larger than Germany, and is bordered by five countries. Its water is salty, but only about a third as salty as the ocean.","What we call something is not always what it is."],["Geography","The biggest waterfall is underwater","The world’s biggest waterfall is underwater. Beneath the Denmark Strait, between Greenland and Iceland, cold dense water plunges about 3,500 metres down the seafloor. Its flow dwarfs that of any waterfall on land.","Some of Earth’s largest features are hidden beneath the waves."],["Geography","The countries with the most neighbours","China and Russia each share land borders with 14 countries. That is more than any other nation. China’s neighbours range from North Korea and Vietnam to Afghanistan and Kazakhstan.","More neighbours means more trade, but also more borders to manage."],["Geography","Singapore has grown by a quarter","Singapore has grown about 25 per cent bigger since the 1960s. By reclaiming land from the sea, it has expanded from roughly 580 to more than 720 square kilometres. Parts of Changi Airport and the Marina Bay area sit on land that was once water.","When land runs out, some countries build more of it."],["Geography","The country below sea level","About a quarter of the Netherlands lies below sea level. Dykes, dunes and pumping stations keep the water out, and much of this land was reclaimed from lakes and the sea. The lowest point is almost 7 metres below sea level.","With planning and engineering, people can live safely where nature would put water."],["Geography","The world’s largest sand island","K’gari, formerly Fraser Island, is the largest sand island in the world. It stretches about 120 km along the Queensland coast. Remarkably, rainforest grows in its sand, and it has around 100 freshwater lakes.","K’gari is World Heritage-listed, recognised as a natural wonder of global importance."],["Geography","Switzerland has four national languages","Switzerland has four national languages. German, French, Italian and Romansh are all recognised, though Romansh is the first language of less than 1 per cent of people. Swiss coins use the Latin name Helvetia, which favours none of them.","A shared identity does not require a single shared language."],["Geography","Australia has no official language","Australia has no official language in law. English is the national language in practice. In the 2021 Census, more than a fifth of Australians spoke a language other than English at home.","Diversity of language is part of everyday Australian life."],["Geography","A naturally pink lake","Western Australia has a lake that is naturally bubblegum pink. Lake Hillier, on Middle Island off the coast near Esperance, gets its colour from salt-loving microalgae and bacteria. The pink stays even when the water is scooped into a glass.","Tiny organisms can transform an entire landscape."],["Geography","The fence that crosses Australia","One of the world’s longest fences stretches across Australia. The Dingo Fence runs about 5,600 km through Queensland, New South Wales and South Australia. It was built to keep dingoes out of sheep-grazing land in the south-east.","Human barriers reshape ecosystems, often in ways no one planned."],["Psychology","The Dunning–Kruger effect, honestly","In a 1999 study, people who scored lowest on tests of logic and grammar greatly overestimated how well they had done. Later researchers argue part of the pattern is a statistical artefact, and most people misjudge themselves somewhat. The effect is real but smaller than internet memes suggest.","Feeling confident is not evidence of skill. Seek outside feedback, especially in areas where you are new."],["Psychology","You hunt for proof you’re right","People tend to search for, notice and remember information that supports what they already believe. This confirmation bias is one of the most consistently demonstrated findings in psychology. It shapes everything from medical diagnoses to online arguments.","Before deciding, ask yourself: what evidence would change my mind, and have I actually looked for it?"],["Psychology","Easy to recall feels more likely","We judge how common something is by how easily examples come to mind. In a classic 1973 study, people guessed more English words start with K than have K as the third letter. The reverse is true, but first letters are simply easier to search.","Vivid news stories distort your sense of risk. Check real statistics before worrying about rare dangers."],["Psychology","Everything takes longer than you think","In a 1994 study, students predicted they would finish their thesis in about 34 days on average. It actually took about 56. Even their “worst case” estimates were too optimistic, a pattern called the planning fallacy.","Base estimates on how long similar past projects really took, not on how this one feels."],["Psychology","The IKEA effect","People value things more when they have built them themselves. In studies published in 2012, participants were willing to pay more for storage boxes they had assembled than for identical pre-built ones, and valued their own clumsy origami almost as much as expert work.","Effort creates attachment. Be careful when judging your own projects, and involve others to build their buy-in."],["Psychology","Owning something raises its price","In a famous 1990 experiment, students given a university coffee mug asked roughly twice as much to sell it as other students would pay to buy it. Simply owning an object makes it feel more valuable. Economists call this the endowment effect.","When selling or decluttering, ask what you would pay for the item today if you didn’t already own it."],["Psychology","The sunk cost trap","People keep investing in failing plans because of what they have already spent. We finish bad films, hold losing shares and stay in doomed projects to avoid “wasting” past effort. But money and time already spent are gone whatever you decide next.","Judge every choice by its future costs and benefits only. The past is spent either way."],["Psychology","Same facts, different choices","In a 1981 study, people facing a disease expected to kill 600 mostly chose a plan that “saves 200 people”. When the identical plan was described as “400 people will die”, most rejected it. Only the wording changed, a result known as the framing effect.","Reframe important decisions both ways, as gains and as losses, and see whether your choice survives."],["Psychology","The decoy that steers your choice","Adding a clearly worse option can shift people toward a nearby better one. Researchers documented this “decoy effect” in 1982. It is why a medium drink priced just below the large one makes the large look like a bargain.","When a menu or price list feels designed, ask which option exists only to make another look good."],["Psychology","Too many jams? Maybe not","A famous 2000 study found shoppers were far more likely to buy jam from a display of 6 flavours than one of 24. It launched the idea that too much choice paralyses us. But a 2010 review of many studies found the average effect was close to zero.","Choice overload happens in some situations, not all. Be wary of neat stories built on one study."],["Psychology","Willpower may not be a fuel tank","The popular theory of “ego depletion” said self-control runs out like fuel after use. Many studies seemed to support it. But a 2016 replication across 23 labs and over 2,000 people found almost no effect.","Don’t count on a “willpower tank” theory. Designing your environment beats relying on self-control."],["Psychology","Power posing didn’t hold up","A 2010 study claimed standing in expansive “power poses” for two minutes changed hormone levels and risk-taking. Larger follow-up studies failed to reproduce the hormone effects, and one of the original authors publicly said she no longer believed them. Some people may still feel slightly more confident.","A famous finding is not proof. Look for findings that have been independently replicated."],["Psychology","The marshmallow test, revisited","Stanford studies from the 1960s and 70s found children who waited longer for a second treat did better years later. A larger, more diverse 2018 replication found the link was much weaker, and shrank further once family background was taken into account.","Self-control matters, but circumstances shape behaviour more than a single childhood test can reveal."],["Psychology","The Stanford Prison Experiment’s flaws","The 1971 Stanford Prison Experiment was stopped after six days, supposedly because ordinary students became cruel guards. Later-released recordings and interviews show researchers encouraged the guards to be tough. Many psychologists now see it as a demonstration of expectations, not proof of human nature.","Famous studies can be wrong. Situations matter, but so do the instructions and pressure people receive."],["Psychology","Most people obeyed to the end","In Stanley Milgram’s 1960s obedience studies, about 65% of participants in the main version kept giving what they believed were 450-volt shocks when instructed. The shocks were fake and the “victim” was an actor. A partial 2009 replication found similar willingness, up to the point it tested.","Ordinary people can do harmful things under authority. Knowing this makes it easier to be the one who refuses."],["Psychology","Wrong answers, because everyone else said so","In Solomon Asch’s 1950s experiments, people judged which line matched another in length. When actors in the group gave obviously wrong answers, about 75% of participants went along at least once. Alone, people almost never made mistakes.","Just one other dissenting voice sharply reduced conformity in Asch’s studies. Be that voice when it counts."],["Psychology","“I knew it all along”","After an event, people overestimate how predictable it was. Studies since the 1970s show that once people learn an outcome, they misremember their earlier predictions as more accurate. This hindsight bias makes the past look obvious and past decisions look foolish.","Write predictions down before outcomes are known. Judge decisions by the information available at the time."],["Psychology","One good trait colours everything","In 1920, psychologist Edward Thorndike noticed that army officers who rated a soldier highly on one quality tended to rate him highly on all of them. This halo effect means attractive or confident people are often assumed to be smarter and kinder too.","In hiring and judging, score qualities separately and independently, ideally before meeting the person."],["Psychology","Firsts and lasts stick","When people memorise a list, they recall the first and last items best and forget the middle. Early items get more rehearsal, while the latest ones are still fresh in mind. Psychologists call this the serial position effect.","Put your most important points at the start and end of a talk, meeting or email."],["Psychology","The forgetting curve","In the 1880s, Hermann Ebbinghaus memorised nonsense syllables and tested himself over weeks. He found most forgetting happens quickly, within the first hours and days, and then levels off. A 2015 replication produced a very similar curve.","If you want to keep something, review it soon after learning it, before the steep drop."],["Psychology","One word can change a memory","In a 1974 study, people watched a car crash film. Those asked how fast the cars “smashed” into each other gave higher speed estimates than those asked about cars that “hit”. A week later, the “smashed” group was more likely to remember broken glass that never existed.","Memory is reconstructed, not replayed. Leading questions can quietly rewrite what witnesses believe they saw."],["Psychology","Vivid memories aren’t more accurate","Researchers asked students to record their memories of the 11 September 2001 attacks the next day, and of an ordinary event. Over the following months, both memories changed by similar amounts. But confidence in the dramatic memory stayed high.","Feeling certain about a memory is not proof it is accurate. Keep records of what really matters."],["Psychology","Habits take longer than 21 days","The popular “21 days to form a habit” idea comes from a 1960 self-help book, not research. A 2010 University College London study found new daily habits took a median of 66 days to become automatic, ranging from 18 to 254 days.","Don’t quit at week three. Expect a couple of months, and know that missing one day barely matters."],["Psychology","The power of “if-then” plans","Plans phrased as “If situation X happens, then I will do Y” make people far more likely to follow through. A 2006 review of 94 studies found these implementation intentions had a medium-to-large effect on reaching goals. They link a cue to an action in advance.","Turn vague goals into specific triggers, like “When I pour my morning coffee, I’ll write for ten minutes.”"],["Psychology","Rewards can kill enjoyment","In a 1973 study, preschoolers who enjoyed drawing were promised a certificate for doing it. Later, in free time, they drew less than children who had not expected a reward. Being paid for something you already love can make it feel like work.","Protect activities you do for joy. Praise effort and interest rather than attaching rewards to everything."],["Psychology","The four horsemen of relationships","Psychologist John Gottman identified four conflict habits linked to relationship breakdown: criticism, contempt, defensiveness and stonewalling. In his research, contempt, such as eye-rolling or mockery, was an especially strong warning sign. Each has a healthier alternative, like complaining about a behaviour rather than attacking character.","How you argue matters more than whether you argue. Watch for contempt above all."],["Psychology","How you react to good news matters","A 2004 study found that how partners respond to each other’s good news predicts relationship quality. Enthusiastic, curious responses were linked to more satisfying relationships. Dismissive or distracted replies, even when not hostile, were linked to worse ones.","When someone shares a win, ask questions and show real excitement. It builds connection."],["Psychology","An 80-year study on happiness","The Harvard Study of Adult Development began following young men in 1938 and has continued for over 80 years, later adding their families. Its directors report that warm, close relationships were among the strongest predictors of health and happiness in later life. Wealth and fame were far less important.","Invest in friendships and family. Relationships appear to be a long-term health habit, not a luxury."],["Psychology","Dunbar’s number is shakier than it sounds","Anthropologist Robin Dunbar proposed in the 1990s that humans can maintain about 150 stable relationships, based on primate brain size. It became famous in business and pop science. A 2021 reanalysis using updated data found the estimate could plausibly range from a handful to several hundred.","Social limits exist, but there is no magic number. Focus on the quality of your connections."],["Psychology","Defaults decide for us","A 2003 study compared organ donor consent across Europe. In Austria, where people are donors unless they opt out, consent was nearly universal. In neighbouring Germany, where people must opt in, it was about 12%. Most people simply keep whatever option is preselected.","Check the defaults in your super, subscriptions and settings. Doing nothing is still a choice."],["Psychology","The curse of knowledge","In a 1990 Stanford study, people tapped out well-known songs like “Happy Birthday” on a table and predicted listeners would name about half of them. Listeners guessed just 3 out of 120. Once you know something, it is hard to imagine not knowing it.","When explaining, assume less background than feels necessary and test your explanation on a newcomer."],["Psychology","Repetition makes things feel true","Since a 1977 study, research has shown that statements heard repeatedly are rated as more believable. A 2015 study found this “illusory truth effect” works even when people already know the correct answer. Familiarity is easily mistaken for accuracy.","A claim you’ve seen many times isn’t more likely to be true. Check the source, not the frequency."],["Psychology","Black came up 26 times in a row","In 1913, at the Monte Carlo Casino, a roulette ball reportedly landed on black 26 times in a row. Gamblers bet heavily on red, sure it was “due”. But each spin is independent, and the belief otherwise is called the gambler’s fallacy.","Past random outcomes do not change future odds. Streaks in chance events are not signals."],["Psychology","A small blunder can make you likeable","In a 1966 study, people listened to a recording of a highly skilled quiz contestant. When he clumsily spilled coffee at the end, listeners rated him more likeable. The same blunder made an average contestant seem less likeable. Psychologists call this the pratfall effect.","If you are clearly competent, admitting a small mistake can make you more relatable, not less respected."],["Psychology","Why criticism seems to work","Daniel Kahneman described flight instructors who believed praise made pilots worse and shouting made them better. In reality, an unusually good landing is usually followed by a more average one, and a bad one by a better one. This regression to the mean happens regardless of feedback.","Extreme results tend to be followed by ordinary ones. Don’t credit or blame your reaction for the change."],["Psychology","The invisible gorilla","In a 1999 study, people counted basketball passes in a short video. About half failed to notice a person in a gorilla suit walking through the scene. When focused on one task, we can miss something obvious right in front of us.","Attention is narrow. When driving or doing risky tasks, a “quick glance” at your phone matters."],["Psychology","Your brain listens for your name","In a noisy room you can tune into one conversation, yet still catch your name spoken elsewhere. Researchers named this the cocktail party effect in the 1950s. In a 1959 study, about a third of people noticed their own name in a message they were told to ignore.","Using someone’s name is a genuine way to grab attention. Use it sparingly and sincerely."],["Psychology","Small yeses lead to bigger ones","In a 1966 study, homeowners were asked to put a large, ugly “Drive Carefully” sign on their front lawn. Only about 17% agreed. But among those who had earlier agreed to a tiny request, about 76% said yes. This is the foot-in-the-door technique.","Start big goals, and big requests, with a small first step. Also notice when others use this on you."],["Psychology","Groups make people slack off","In the 1880s, French engineer Maximilien Ringelmann found people pulled less hard on a rope as more joined in. Later studies confirmed this “social loafing” in shouting, clapping and teamwork. When individual effort is hidden, people tend to coast.","Give each team member clear, visible responsibilities so that everyone’s contribution counts."],["Psychology","Name it to tame it","Putting feelings into words can dial them down. A 2007 brain imaging study found that labelling emotional images with words, such as “angry”, reduced activity in the amygdala, a region involved in emotional reactions. This is called affect labelling.","When upset, try naming the exact feeling. It can create a little distance and help you think clearly."],["Philosophy","The trolley problem","A runaway trolley will kill five people unless you pull a lever to divert it, killing one. Philosopher Philippa Foot raised the scenario in 1967, and Judith Jarvis Thomson later named it. Most people say they would pull the lever, but far fewer would push a person off a bridge to stop it.","Our moral intuitions care about how harm happens, not just how many people are affected."],["Philosophy","The ship of Theseus","If every plank of a ship is replaced one by one, is it still the same ship? The puzzle appears in Plutarch’s writing, nearly 2,000 years ago. Thomas Hobbes later added a twist: what if someone rebuilt a ship from all the old planks?","The same question applies to you. Your body and beliefs change constantly. What makes you still you?"],["Philosophy","Would you plug into the machine?","In 1974, philosopher Robert Nozick imagined a machine that could give you any experiences you wanted, perfectly simulated, for life. Most people say they would not plug in. Nozick argued this shows we value more than pleasant feelings: we want to actually do things and be connected to reality.","If pleasure alone isn’t the goal, ask what real achievements and relationships you want your life to contain."],["Philosophy","The veil of ignorance","John Rawls proposed a test for fairness in 1971. Design society’s rules without knowing who you will be in it: rich or poor, healthy or sick, talented or not. From behind this “veil of ignorance”, he argued, people would choose to protect the worst off.","A handy fairness check: would you still accept this rule if you didn’t know which side of it you’d land on?"],["Philosophy","The ring of invisibility","In Plato’s Republic, Glaucon tells of the Ring of Gyges, which makes its wearer invisible. He asks whether anyone would stay just if they could never be caught. Plato used the story to ask whether we are good only because we fear the consequences.","Character is what you do when no one is watching. It’s a useful question to ask yourself honestly."],["Philosophy","Achilles can never catch the tortoise","The Greek philosopher Zeno of Elea argued that swift Achilles can never overtake a tortoise with a head start. Each time he reaches where it was, it has moved a little further. Modern mathematics resolves it: infinitely many ever-smaller steps can add up to a finite distance and time.","Paradoxes are useful. Puzzles that seem absurd have pushed thinkers towards deep ideas about infinity."],["Philosophy","Buridan’s donkey isn’t Buridan’s","A donkey stands exactly between two identical piles of hay and starves because it cannot choose. The puzzle is named after the 14th-century philosopher Jean Buridan, but it does not appear in his surviving writings. A similar idea appears much earlier in Aristotle.","Waiting for the perfect choice can cost more than picking a good option and moving on."],["Philosophy","“I think, therefore I am” was first French","René Descartes first wrote his famous line in French, as “je pense, donc je suis”, in his 1637 Discourse on the Method. The Latin “cogito, ergo sum” appeared in his later Principles of Philosophy. He was searching for one thing he could not possibly doubt.","Doubting everything can be a method. Descartes used it to find a firm foundation for knowledge."],["Philosophy","You can’t get an “ought” from an “is”","Scottish philosopher David Hume noticed that writers often slide from describing how things are to claiming how they ought to be. In his Treatise of Human Nature (1739–40), he argued facts alone cannot prove moral conclusions. This became known as the is–ought problem.","“That’s how it’s always been done” describes a fact. It doesn’t prove it’s the right way."],["Philosophy","Australia’s black swans broke a proverb","For centuries in Europe, a “black swan” was a figure of speech for something impossible. Then in 1697, Dutch explorer Willem de Vlamingh’s crew saw black swans in Western Australia. The story became a classic illustration of the problem of induction: no number of observations can prove a general rule.","Past experience is not proof about the future. Stay open to the case you haven’t seen yet."],["Philosophy","A three-page paper that shook philosophy","For centuries, many philosophers defined knowledge as a justified, true belief. In 1963, Edmund Gettier published a paper of about three pages showing cases where someone has a justified true belief by pure luck. Philosophers still debate how to fix the definition.","Being right for the wrong reasons is not the same as knowing. Check how you reached a conclusion."],["Philosophy","Mary’s black-and-white room","Australian philosopher Frank Jackson imagined Mary, a scientist who knows every physical fact about colour but has lived only in a black-and-white room. When she first sees red, does she learn something new? Jackson argued yes, though he later changed his mind.","Knowing about something is not the same as experiencing it. Some knowledge only comes firsthand."],["Philosophy","The Stoics rehearsed disaster","Stoic philosophers such as Seneca recommended imagining setbacks in advance: losing money, health or status. The practice is often called premeditatio malorum, the “premeditation of evils”. The aim was not gloom but preparation, so misfortune would not catch them off guard.","Briefly picturing what could go wrong makes you calmer, better prepared and more grateful for what you have."],["Philosophy","Would you ruin your shoes to save a child?","In 1972, Melbourne-born philosopher Peter Singer asked: if you saw a child drowning in a shallow pond, would you wade in, even if it ruined your expensive shoes? Almost everyone says yes. Singer argued that distance should not change the duty, so we should also help people dying of poverty far away.","A useful test of your values is whether they still hold when the person in need is out of sight."],["Philosophy","Epicurus was no party animal","Today “epicurean” suggests luxury, but Epicurus taught that the pleasant life was a simple one. He valued friendship, modest food and freedom from fear and pain. His school, founded in Athens around 306 BCE, was called the Garden.","Happiness often comes from reducing wants, not endlessly adding pleasures."],["Philosophy","Diogenes told Alexander to move","The Cynic philosopher Diogenes lived in a large ceramic jar in Athens and rejected comfort and convention. Ancient accounts say Alexander the Great offered to grant him any wish. Diogenes replied that Alexander could stand out of his sunlight.","Needing little makes you hard to buy or intimidate. Freedom can come from wanting less."],["Philosophy","Socrates never wrote a word","The most famous philosopher of ancient Athens left no writings of his own. Everything we know about Socrates comes from others, mainly his student Plato, the historian Xenophon and the playwright Aristophanes. Scholars still debate which of Plato’s views are really Socrates’.","Ideas can outlive their authors through others. Much of Socrates survives only because of his students."],["Philosophy","Aristotle’s golden mean","Aristotle argued that most virtues sit between two vices. Courage lies between cowardice and recklessness, and generosity between stinginess and wastefulness. The right point is not a simple average but depends on the person and situation.","When a strength starts to cause problems, you may have pushed it to an extreme. Look for balance."],["Philosophy","Chesterton’s fence","In his 1929 book The Thing, writer G. K. Chesterton imagined a reformer who finds a fence across a road and wants it removed because he sees no use for it. Chesterton’s reply: go away and find out why it was put there first. Only then can you decide whether to take it down.","Before scrapping a rule or routine, find out what problem it was meant to solve."],["Philosophy","Wu wei: effortless action","In Daoist philosophy, wu wei means “non-action” or “effortless action”. It does not mean laziness but acting in harmony with the natural flow of things, without forcing. The Daodejing praises water, which is soft and yielding yet overcomes the hard and strong.","Sometimes the best results come from easing off, not pushing harder."],["Philosophy","The second arrow","An early Buddhist text compares pain to being struck by an arrow. Most people then add a second arrow: worry, resentment and dwelling on the pain. The first arrow may be unavoidable, but the second is our own reaction, the text suggests.","You can’t always avoid setbacks, but you can avoid piling extra suffering on top of them."],["Philosophy","Hanlon’s razor","“Never attribute to malice that which is adequately explained by stupidity.” The saying is credited to Robert J. Hanlon, who submitted it to a 1980 joke book of Murphy’s Law variations. Similar ideas appear much earlier, including in Goethe’s 1774 novel The Sorrows of Young Werther.","When someone lets you down, assume a mistake or oversight before assuming bad intent. You will usually be right, and calmer."],["Philosophy","Kant wouldn’t lie to a murderer","Immanuel Kant argued that lying is always wrong. In a 1797 essay, he accepted the hardest case: you should not lie even to a murderer asking where your friend is hiding. Many readers find this conclusion shows the limits of strict rules.","Moral principles are useful, but testing them against extreme cases reveals where they may break."],["Philosophy","Bentham still attends university","Jeremy Bentham, founder of utilitarianism, asked that his body be preserved after his death in 1832. His skeleton, dressed in his own clothes and topped with a wax head, is on public display at University College London. His real preserved head is stored separately.","Bentham wanted to be useful even after death. His philosophy measured everything by its consequences."],["Philosophy","Imagine Sisyphus happy","In Greek myth, Sisyphus is condemned to roll a boulder up a hill forever, only to watch it roll down again. In 1942, Albert Camus argued the struggle itself can give life meaning. He concluded: “One must imagine Sisyphus happy.”","Meaning may come from how we engage with repetitive tasks, not from finishing them."],["Philosophy","The prisoner’s dilemma","Two suspects each do better by betraying the other, yet both end up worse off if both betray. The dilemma was developed at the RAND Corporation in 1950. In Robert Axelrod’s later computer tournaments, a simple strategy called “tit for tat”, which starts by cooperating, performed best.","In repeated relationships, start by cooperating, respond fairly and be quick to forgive."],["Philosophy","The Meditations were a private diary","Marcus Aurelius, Roman emperor, never meant the Meditations for publication. He wrote them in Greek as personal notes, probably during military campaigns. The title was added later, and the work is often described as addressed “to himself”.","Some of history’s most quoted advice was written as self-reminders. Journaling can help you think like a philosopher."],["Philosophy","Epictetus was born enslaved","The Stoic teacher Epictetus was born into slavery around 50 CE, and his name means “acquired”. He later gained his freedom and founded a school. He wrote nothing himself: his student Arrian recorded his teachings.","His focus on what we can control came from real experience of having very little control."],["Philosophy","How many grains make a heap?","One grain of sand is not a heap, and adding a single grain never seems to turn a non-heap into a heap. Yet a million grains clearly is one. This is the sorites paradox, from the Greek word for heap, first posed in ancient Greece.","Many real concepts, like “tall” or “old”, have blurry edges. Arguing over the exact line can miss the point."],["Philosophy","The straw man fallacy","A straw man argument attacks a weaker, distorted version of someone’s view instead of what they actually said. It is easy to knock over, like a figure stuffed with straw. It feels like winning but avoids the real disagreement.","Before disagreeing, restate the other person’s view so well that they agree with your summary."],["Philosophy","Attack the argument, not the person","An ad hominem fallacy, Latin for “to the person”, dismisses an argument by attacking the person who made it. A cousin is “tu quoque” (“you too”): rejecting advice because the adviser doesn’t follow it. A smoker who warns against smoking can still be right.","The truth of a claim doesn’t depend on who says it. Judge the reasoning and evidence."],["Philosophy","The false dilemma","A false dilemma presents only two options when more exist: “You’re either with us or against us.” It pressures people into choosing an extreme. Real situations usually allow middle grounds, combinations or entirely different paths.","When offered only two choices, ask: what are the other options nobody has mentioned?"],["Philosophy","After this, therefore because of this","The Latin phrase “post hoc ergo propter hoc” names the mistake of assuming that because one thing followed another, the first caused it. You wore lucky socks and your team won. Sequence alone does not prove cause.","Before crediting a cause, ask what else changed and whether the result would have happened anyway."],["Philosophy","The no true Scotsman fallacy","Someone claims no Scotsman puts sugar on porridge. Shown a Scotsman who does, they reply, “No true Scotsman puts sugar on porridge.” Philosopher Antony Flew named this move, which protects a claim by redefining terms to exclude counterexamples.","If a claim can never be proven wrong because the goalposts keep moving, it isn’t saying much."],["Philosophy","Natural doesn’t mean good","The appeal to nature fallacy assumes that anything natural is good or safe, and anything artificial is bad. But arsenic, snake venom and poison mushrooms are natural, while vaccines and eyeglasses are not. Whether something is natural says little about whether it helps or harms.","Judge products and choices by evidence of their effects, not by labels like “natural”."],["Human Body","You are taller in the morning","You are roughly a centimetre taller when you wake up than when you go to bed. During the day, gravity squeezes fluid out of the soft discs between your vertebrae, and they plump up again while you lie down at night. Astronauts in orbit can grow several centimetres for the same reason.","Your height is not a fixed number, so measure it at the same time of day if you want to compare."],["Human Body","Babies have more bones than adults","A newborn has roughly 270 to 300 bones, while an adult has 206. Many of a baby’s bones start as separate pieces that fuse as the child grows, including parts of the skull, spine and pelvis. The soft gaps in a baby’s skull, called fontanelles, close over the first couple of years.","Growing up is partly a process of bones joining together."],["Human Body","Your smallest bone is in your ear","The smallest bone in your body is the stapes, deep in your middle ear, and it is only about 3 millimetres long. Shaped like a stirrup, it passes sound vibrations from the eardrum to the fluid-filled inner ear. Without it, hearing would be badly muffled.","Some of the body’s most important parts are also its tiniest."],["Human Body","Each eye has a hole in its vision","Every eye has a blind spot where the optic nerve leaves the retina, because there are no light-sensing cells there. You never notice it because your brain fills in the gap using the surrounding scene and the view from your other eye.","What you “see” is partly a guess your brain makes, not a perfect recording."],["Human Body","Your eyes see the world upside down","The lens of your eye projects an upside-down image onto the retina, just as a camera lens does. Your brain flips and interprets the signal so the world looks the right way up. You never experience the raw, inverted image at all.","Perception is an interpretation, and the brain does a huge amount of work you never notice."],["Human Body","Why smells unlock old memories","A familiar smell can bring back a memory from decades ago in an instant. Smell signals travel very directly to brain areas involved in emotion and memory, such as the amygdala and hippocampus, rather than taking the longer route most other senses use. That is why a scent can feel so vivid and emotional.","Scents are powerful memory cues, so linking a smell to a moment can help you remember it."],["Human Body","Most of flavour is really smell","Much of what we call taste is actually smell. Your tongue detects only a few basic tastes, while aromas rising from food in your mouth to the back of your nose provide most of the rich detail. This is why food tastes bland when you have a blocked nose.","To enjoy food fully, slow down and breathe, because your nose is doing much of the tasting."],["Human Body","The tongue map is wrong","The famous map showing sweet at the tip and bitter at the back is a myth. It grew from a misreading of a 1901 German study, and in fact every region of the tongue with taste buds can detect all the basic tastes. Sensitivity varies only slightly from place to place.","Even diagrams printed in textbooks for decades can be wrong, so check the original source."],["Human Body","Umami: the fifth taste","In 1908, Japanese chemist Kikunae Ikeda identified the savoury taste he called umami. He traced it to glutamate in kombu seaweed broth. Scientists later found dedicated taste receptors for it, and umami is now accepted alongside sweet, sour, salty and bitter.","The savoury depth of tomatoes, parmesan and mushrooms is a real, distinct taste."],["Human Body","Your body is paralysed when you dream","During REM sleep, when most vivid dreaming happens, your brain switches off most of your voluntary muscles. This temporary paralysis stops you from acting out your dreams. Your eyes and breathing muscles keep working, which is how REM sleep got its name: rapid eye movement.","Sleep is not the brain switching off but a carefully controlled state."],["Human Body","Sleep runs in 90-minute cycles","Sleep is not one continuous state but a series of cycles, each lasting roughly 90 minutes. Each cycle moves through lighter sleep, deep sleep and REM sleep, and most adults go through about four to six cycles a night. Deep sleep dominates early in the night, while REM grows longer towards morning.","Waking at the end of a cycle, rather than in deep sleep, can help you feel less groggy."],["Human Body","Your brain cleans itself while you sleep","Sleep appears to help your brain wash away waste. In a 2013 study in mice, the spaces between brain cells widened during sleep, letting fluid flush out waste products much faster than during waking hours. Researchers are still working out exactly how this applies to humans.","Sleep is maintenance time, not wasted time."],["Human Body","Tired driving is like drink-driving","An Australian and New Zealand study found that staying awake for about 17 to 19 hours impaired performance roughly as much as a blood alcohol level of 0.05%. Longer periods without sleep produced impairment similar to higher alcohol levels. Tired people also have brief “microsleeps” they may not notice.","A long day followed by a long drive is a genuine safety risk, so rest first."],["Human Body","Your body clock is not quite 24 hours","Your internal body clock runs on a cycle slightly longer than 24 hours for most people. Daylight, especially morning light, resets it each day and keeps it in step with the sun. This is why a cycle of light and dark matters so much for good sleep.","Getting outside in the morning helps set your body clock for the day ahead."],["Human Body","Your brain cannot feel pain","The brain itself has n
