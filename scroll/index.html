o pain receptors, so it cannot feel being touched or cut. This is why surgeons can operate on some patients while they are awake and talking. Headaches come from surrounding structures, such as blood vessels, nerves and the membranes around the brain.","The organ that registers all your pain feels none of its own."],["Human Body","You have about 86 billion neurons","The human brain contains roughly 86 billion neurons, according to a 2009 study that counted them by dissolving brain tissue into countable nuclei. The older figure of 100 billion was a rough estimate that had never been properly counted. Each neuron can connect to thousands of others.","Even a widely repeated number deserves checking, because someone eventually has to count."],["Human Body","The small brain holding most neurons","Your cerebellum, the small wrinkled structure at the back of your brain, holds about 80% of your neurons. It makes up only around a tenth of the brain’s mass. It helps coordinate movement, balance and timing, and plays roles in learning and thinking too.","Size is a poor guide to importance, in brains as elsewhere."],["Human Body","London cabbies grow their memory centre","A famous 2000 study found that London taxi drivers had a larger rear hippocampus, a region vital for spatial memory, than non-drivers. The longer they had driven, the bigger it tended to be. Drivers must memorise thousands of streets to pass a test called “the Knowledge”.","Your brain physically adapts to what you practise, even in adulthood."],["Human Body","Nerve signals can outpace a race car","The fastest nerve signals in your body travel at about 120 metres per second, roughly 430 km/h. They race along nerve fibres wrapped in a fatty insulating layer called myelin. Signals in thin, uninsulated fibres can crawl along at around a metre per second.","Fast signals and spinal reflexes let you pull your hand off a hot stove before the pain fully registers."],["Human Body","Two metres of DNA in every cell","If you stretched out the DNA from a single one of your cells, it would be about 2 metres long. It is packed into a nucleus far narrower than a human hair by winding around proteins like thread on spools. You have trillions of cells, each carrying this tightly folded code.","Nature solved an extreme storage problem long before engineers did."],["Human Body","Humans have surprisingly few genes","Humans have only about 20,000 protein-coding genes, far fewer than the 100,000 some scientists once predicted. That is roughly the same number as a mouse. Genes that code for proteins make up only around 1 to 2% of our DNA, while some of the rest helps control when genes switch on.","Complexity comes less from the number of genes than from how they are used."],["Human Body","Identical twins have different fingerprints","Even identical twins, who share almost exactly the same DNA, have different fingerprints. Fingerprint ridges form in the womb and are shaped by tiny differences in position, pressure and growth. Even the ten prints on your own fingers all differ from each other.","Genes set the blueprint, but development adds details that make everyone unique."],["Human Body","You are half bacteria, roughly","Your body carries roughly as many bacterial cells as human cells. A 2016 study estimated about 38 trillion bacteria and 30 trillion human cells in a typical adult. The long-quoted claim that bacteria outnumber us ten to one was based on an old rough estimate.","You are an ecosystem, and most of those microbes live peacefully in your gut."],["Human Body","Red blood cells live about four months","A red blood cell lives for about 120 days before it is recycled. To keep up, your bone marrow makes roughly two million new red blood cells every second. Mature red blood cells have no nucleus, which leaves more room for oxygen-carrying haemoglobin.","Your body is constantly rebuilding itself, even while you sit still."],["Human Body","Your heart beats 100,000 times a day","At around 70 beats a minute, your heart beats roughly 100,000 times a day. Over a long life, that adds up to more than 2.5 billion beats. It rests only in the brief pause between each beat.","A small effort, repeated for decades, becomes something enormous, as your heart shows."],["Human Body","Your heart has its own pacemaker","Your heartbeat starts inside the heart itself, in a small cluster of cells called the sinoatrial node. It fires electrical signals on its own, while nerves and hormones only speed it up or slow it down. This is why a transplanted heart can beat even though its nerves were cut.","The heart does not wait for orders from the brain to keep you alive."],["Human Body","Your stomach survives its own acid","Your stomach produces hydrochloric acid strong enough to have a pH of around 1.5 to 3.5. It avoids digesting itself thanks to a thick layer of protective mucus. The cells lining it are also replaced every few days.","Constant renewal is one of the body’s best defences."],["Human Body","The liver can regrow itself","The liver can regrow to near its full size even after up to about two-thirds of it is removed. This remarkable ability makes living-donor transplants possible, where a healthy person gives part of their liver. Both the donor’s and the recipient’s portions grow back within months.","Few organs can repair themselves so completely, making the liver a standout exception."],["Human Body","Muscles can only pull, never push","Every muscle in your body works by contracting, which means it can only pull. To move a joint back and forth, muscles work in opposing pairs. Your biceps bends your elbow and your triceps straightens it again.","Every push you make is really a clever arrangement of pulls."],["Human Body","Why you cannot tickle yourself","You cannot tickle yourself because your brain predicts the sensation. When you move, your cerebellum forecasts what you will feel and dampens the response. Experiments in the late 1990s found that adding a delay between a person’s movement and a robotic touch made it feel more ticklish.","The brain constantly filters out predictable signals so surprises stand out."],["Human Body","Your pupils widen when you think hard","Your pupils widen slightly when you concentrate hard, not just when the light is dim. Psychologists in the 1960s found pupil size rose as mental tasks got harder, then shrank once the answer was found. It is one of the few visible signs of mental effort.","Thinking hard is real physical work, and your eyes quietly show it."],["Human Body","Normal body temperature isn’t exactly 37 °C","The famous 37 °C figure was popularised by German physician Carl Wunderlich in the 1800s. Modern studies suggest the average is a little lower, around 36.6 °C. Temperature also varies between people and rises and falls through the day.","“Normal” in the body is usually a range, not a single number."],["Human Body","Goosebumps are a leftover from fur","Goosebumps are a reflex inherited from our hairier ancestors. Tiny muscles at the base of each hair contract when you are cold or feel a strong emotion, pulling the hairs upright. In furry animals this traps a warmer layer of air or makes them look bigger, like a cat’s puffed-up tail.","Some of your body’s reactions are left over from a time when they were far more useful."],["Human Body","Your brain hides the blur","Your eyes jump several times a second in quick movements called saccades. During each jump, your brain suppresses the blurry image so you never notice the motion. Try watching your own eyes move in a mirror and you will not see them shift.","Your smooth view of the world is carefully edited by your brain."],["Human Body","Your corneas breathe the air","The cornea, the clear front window of your eye, has no blood vessels. Instead, it takes in much of its oxygen directly from the air. Having no blood vessels keeps it perfectly transparent so light can pass through clearly.","Some tissues trade a blood supply for clarity."],["Human Body","Tooth enamel cannot grow back","Tooth enamel is the hardest substance in the human body. It is made mostly of mineral crystals and contains no living cells, so once it is lost it cannot regrow. Bone, by contrast, is living tissue that repairs itself.","The hardest part of you is also one of the few that cannot heal."],["Human Body","About 1 in 12 men is colour blind","Around 1 in 12 men and about 1 in 200 women of Northern European descent have red-green colour blindness. The genes for red and green light receptors sit on the X chromosome. Men have only one X, so a single faulty copy is enough to affect them.","A colour-coded chart may be unreadable for a noticeable share of your audience."],["Human Body","Wrinkly fingers are controlled by nerves","Fingers wrinkle in water because nerves signal blood vessels to narrow, not simply because skin soaks up water. Fingers with damaged nerves often do not wrinkle at all. One idea is that the wrinkles improve grip on wet objects, though studies disagree.","Even something that seems passive can be an active response from your nervous system."],["Human Body","Darwin found blushing puzzling","Charles Darwin wrote that blushing is “the most peculiar and the most human of all expressions.” In 1872 he noted that a blush cannot be produced at will, and linked it to thinking about what others think of us. Scientists still debate why it evolved.","Blushing may signal to others that you care about their opinion."],["Human Body","Blood types were found in 1901","In 1901, Austrian scientist Karl Landsteiner discovered that human blood comes in different groups. Mixing incompatible blood caused clumping, which explained why many early transfusions failed. His work made transfusions far safer and earned him a Nobel Prize in 1930.","One careful observation has since helped save many millions of lives."],["Money","Start early, even with less","Time can matter more than the amount you save. At a hypothetical 7% annual return, compounding monthly, someone investing $200 a month from 25 to 35, then stopping, would have about $281,000 at 65. Someone investing the same monthly amount from 35 to 65 would contribute three times as much but end with about $244,000.","Compound growth rewards time. The earliest dollars do the heaviest lifting."],["Money","Small fees take a big bite","A 1% yearly fee can quietly eat about a quarter of your final balance over 30 years. $10,000 growing at 7% a year becomes about $76,000, but at 6% it becomes about $57,000. The fee compounds against you, just as returns compound for you.","When comparing investments or super funds, fees deserve close attention."],["Money","Inflation halves money over time","At 3% inflation, money loses about half its buying power in roughly 23 years. The notes in your wallet stay the same, but what they can buy shrinks each year. Economists call confusing face value with real value the “money illusion”.","Cash kept idle for decades quietly loses value, even if the number never changes."],["Money","A dollar for 4.2 trillion marks","By November 1923, one US dollar was worth about 4.2 trillion German marks. During Weimar Germany’s hyperinflation, prices could double in days, and workers were paid more than once a day so they could spend before prices rose again. Some people burned banknotes for heat because they were cheaper than firewood.","Trust in money can collapse fast when governments print it to cover debts."],["Money","The worst inflation ever recorded","Hungary in 1946 suffered the worst hyperinflation ever recorded. At its peak, prices doubled roughly every 15 hours. The government printed a 100 quintillion pengő note, the highest face value of any banknote ever issued, before replacing the currency with the forint.","Hyperinflation can wipe out a lifetime of savings in weeks."],["Money","The first coins came from Lydia","Some of the earliest known coins were made in the kingdom of Lydia, in modern Turkey, around the 7th century BCE. They were stamped lumps of electrum, a natural mix of gold and silver. The stamp guaranteed their weight, so people no longer had to weigh metal for every trade.","Money works best when people trust it without checking every time."],["Money","Stone money that never moves","On the Pacific island of Yap, giant stone discs called rai served as money, some taller than a person. Large stones often stayed in place while ownership passed from one family to another by shared agreement. One stone, lost at sea during transport, was reportedly still counted as wealth.","Money is really a shared record of who owns what, much like a modern bank balance."],["Money","Debt is older than coins","Records of debts and interest were kept in ancient Mesopotamia long before coins were invented. Babylon’s Code of Hammurabi, from around 1750 BCE, even set maximum interest rates on loans of grain and silver. Clay tablets recorded who owed what to whom.","Credit and trust came first, and coins were a later convenience."],["Money","Tulip mania was probably exaggerated","The famous Dutch tulip bubble of 1637 is often told as a tale of national ruin. Historians such as Anne Goldgar have found little evidence of widespread bankruptcies, and trading involved a fairly small group of merchants. Many popular details came from moralising pamphlets and a colourful 1841 book.","Famous stories about financial madness can be exaggerated too, so check the sources."],["Money","The South Sea Bubble of 1720","In 1720, shares in Britain’s South Sea Company rose from about £128 to around £1,000 within months, then collapsed. Many investors were ruined, and Isaac Newton reportedly lost a large sum. A parliamentary inquiry later exposed bribery of officials.","Even brilliant people can be swept up when everyone around them is buying."],["Money","The 25-year recovery after 1929","After the Wall Street Crash of 1929, the Dow Jones index fell by about 89% from its peak by mid-1932. It did not return to its 1929 high until November 1954, about 25 years later. The crash helped trigger the Great Depression.","Markets can recover, but sometimes the wait is far longer than anyone expects."],["Money","Australia almost had the “royal”","When Australia planned its switch to decimal currency, the government proposed calling the new unit the “royal”. The name was so unpopular that it was dropped in favour of the dollar. Decimal currency arrived on 14 February 1966, helped by a cartoon mascot called Dollar Bill.","Public opinion can reshape even the name of a country’s money."],["Money","Australia pioneered polymer banknotes","In 1988, Australia issued the world’s first polymer banknote, a $10 note marking the Bicentenary. It was developed by the Reserve Bank of Australia with the CSIRO to beat counterfeiters. Many countries, including Canada, the UK and New Zealand, now use polymer notes.","An Australian innovation now sits in wallets around the world."],["Money","The day the dollar left gold","On 15 August 1971, US President Richard Nixon ended the right of foreign governments to swap US dollars for gold. This broke the Bretton Woods system set up in 1944. Since then, major currencies have been backed by trust in governments and central banks, not by metal.","Modern money is valued by confidence, not by gold in a vault."],["Money","Most money is created by banks","Most money today is not notes and coins but bank deposits, created when banks make loans. The Bank of England explained this plainly in 2014: when a bank lends, it creates a new deposit in the borrower’s account. Physical cash is only a small share of the money supply.","Money is mostly numbers on ledgers, and lending is what makes most of them."],["Money","Bad money drives out good","Gresham’s law says that when two forms of money have the same face value, people hoard the more valuable one and spend the other. When silver coins were debased, people kept the purer old coins and spent the new ones. It is named after Thomas Gresham, a 16th-century English financier.","People respond to hidden value, even when official prices say two things are equal."],["Money","Every choice has a hidden price","The true cost of anything includes what you give up to get it. Economists call this opportunity cost. An evening spent scrolling may cost nothing in dollars, but it costs the next best thing you could have done with that time.","Before deciding, ask “compared to what?”, because the best choice depends on the alternatives."],["Money","A dollar isn’t always a dollar","We tend to treat money differently depending on where it came from or what we label it for. Economist Richard Thaler called this “mental accounting”. A tax refund or a win may feel like “free money” and get spent more easily than wages, though every dollar is equally valuable.","Treating all money as the same pool leads to better decisions."],["Money","Now beats later, too much","People tend to overvalue immediate rewards compared with later ones, even when waiting pays much more. Economists call this present bias. It helps explain why saving, exercising and other long-term plans are so easy to postpone.","Automating good choices, like savings transfers, removes the daily battle with present bias."],["Money","The dressing gown that cost a fortune","The French philosopher Denis Diderot received a splendid new dressing gown and soon felt his old belongings looked shabby beside it. He replaced one item after another, and later wrote an essay regretting it. The term “Diderot effect” describes how one purchase can trigger a spiral of others.","Before buying an upgrade, consider what else it might make you want."],["Money","Cards make spending feel painless","In a famous 2001 study, people bidding for sports tickets offered far more when told they would pay by credit card rather than cash. Handing over cash feels like a loss, while tapping a card barely registers. Researchers call this the “pain of paying”.","If you are trying to spend less, make payments feel more real."],["Money","Why prices end in 99","A price of $9.99 feels noticeably cheaper than $10, even though the difference is one cent. Our brains read numbers from left to right and give the first digit extra weight. Researchers call this the left-digit effect.","Round prices up in your head to see what you are really paying."],["Money","Adam Smith’s pin factory","In The Wealth of Nations (1776), Adam Smith described a pin factory where ten workers, each doing one step, could make upwards of 48,000 pins a day. A single worker doing everything alone, he said, might struggle to make even twenty. This division of labour is a key source of productivity.","Specialising and cooperating can multiply what people achieve."],["Money","When a measure becomes a target","Economist Charles Goodhart observed in 1975 that a statistic used as a target tends to lose its value as a measure. Anthropologist Marilyn Strathern later summed it up: “When a measure becomes a target, it ceases to be a good measure.” People learn to hit the number instead of the goal.","Watch what a target rewards, not just what it was meant to measure."],["Money","The Hanoi rat bounty backfired","In 1902, French authorities in Hanoi paid a bounty for each rat tail handed in. People began cutting off tails and releasing the rats to breed, and some were suspected of farming rats. Historians use it as a classic example of a perverse incentive.","Incentives shape behaviour, sometimes in ways the designer never intended."],["Money","When a higher price boosts demand","Some luxury goods become more desirable as their price rises, because a high price signals status. These are called Veblen goods, after economist Thorstein Veblen. He coined the term “conspicuous consumption” in his 1899 book The Theory of the Leisure Class.","Sometimes we buy the price tag, not the product, so ask who you are really buying it for."],["Money","The commons can be saved","In 1968, ecologist Garrett Hardin argued that shared resources, like pastures, are doomed to overuse. Economist Elinor Ostrom later studied fisheries, forests and irrigation systems where communities managed shared resources well for centuries. In 2009 she became the first woman to win the economics Nobel.","Local rules and trust can protect shared resources without either privatisation or government control."],["Money","Trade helps even the less efficient","David Ricardo showed in 1817 that two countries can both gain from trade even if one is better at making everything. Each should focus on what it gives up least to produce, its comparative advantage. His example used English cloth and Portuguese wine.","Focus your time where your advantage is greatest, even if you could do everything yourself."],["Money","The first company to sell shares","The Dutch East India Company, founded in 1602, is often called the first company to offer shares to the public. Investors could buy and sell its shares in Amsterdam, which helped create one of the world’s first stock exchanges. It became one of the most powerful trading companies in history.","The idea of owning a slice of a business changed how the world funds big ventures."],["Money","All the world’s gold in one cube","All the gold ever mined would fit in a cube roughly 22 metres on each side. That is more than 200,000 tonnes, packed small because gold is extremely dense. Almost all of it still exists, as jewellery, bars, coins and electronics.","Rarity is part of what has made gold a store of value for thousands of years."],["Money","Where the word “dollar” came from","The word dollar traces back to a silver coin minted in Joachimsthal, a valley in Bohemia, in the 1500s. The coin was called a “Joachimsthaler”, shortened to “thaler”. The word spread to become the Dutch “daler” and the English “dollar”.","Even a modern currency name carries centuries of history."],["Money","Diversification: a Nobel-winning idea","Harry Markowitz showed in 1952 that combining different investments can lower risk without necessarily lowering expected returns. When some assets fall, others may hold steady or rise. His portfolio theory earned him a share of the 1990 economics Nobel.","Spreading risk is not just folk wisdom: it has a mathematical basis."]];
const MYTHS = [["The Great Wall of China is visible from space with the naked eye.",false,"It is long but only a few metres wide. Astronauts, including China’s Yang Liwei, have said they could not see it unaided from orbit."],["Goldfish have a three-second memory.",false,"Goldfish have been trained to respond to sounds and cues and remember them for months."],["Ninety percent of your brain is just sitting there idle.",false,"Scans light up almost every region over a normal day. Your brain is only about 2 percent of your body weight but burns roughly 20 percent of your energy, far too costly to leave mostly unused."],["Once lightning hits a spot, that spot is safe forever.",false,"Tall structures get hit over and over, some many times a year. US park ranger Roy Sullivan was struck by lightning seven separate times and survived them all."],["Bulls charge because the colour red enrages them.",false,"Cattle are red-green colour blind. The bull reacts to the cape’s movement, not its colour."],["Napoleon was a tiny man by the standards of his day.",false,"At around 170 cm he was average or a bit above for a Frenchman of his era. French inches were longer than English ones, and British cartoonists happily drew him as a pint-sized tantrum thrower."],["Humans have more than five senses.",true,"Beyond sight, hearing, taste, smell and touch, we sense balance, body position, temperature, pain and internal signals like hunger."],["Hair and nails keep growing after death.",false,"The skin dries and pulls back after death, which makes hair and nails look longer."],["Keep cracking your knuckles and you'll end up with arthritis.",false,"Research hasn't found a connection. Dr Donald Unger cracked only his left hand's knuckles for about 60 years, found no arthritis in either hand, and won an Ig Nobel Prize for it."],["Vikings wore horned helmets into battle.",false,"No horned Viking battle helmet has ever been found. The image comes largely from 19th-century costume design, including for Wagner’s operas."],["A sugary treat sends kids bouncing off the walls.",false,"Controlled trials where nobody knows who got sugar find no change in behaviour. The twist: parents told their child had sugar judge them as wilder, even when the drink was sugar-free."],["Chameleons change colour mainly to blend in.",false,"Their colour shifts are mostly about mood, signalling to other chameleons and regulating temperature."],["Honey stored properly can stay edible for an extremely long time.",true,"Honey is low in water and acidic, which makes it very hard for bacteria to grow. Sealed honey can last for many years."],["Toilets flush the opposite way in the Southern Hemisphere.",false,"The Coriolis effect is far too weak at that scale. The shape of the bowl and the water jets decide the direction."],["Mount Everest is not the tallest mountain from base to peak.",true,"Mauna Kea in Hawaii rises over 10,000 m from its base on the ocean floor, though most of it is underwater. Everest has the highest summit above sea level."],["Bats are blind.",false,"All bats can see. Many use echolocation too, and some fruit bats have excellent eyesight."],["Forget your beanie and most of your body heat escapes out the top.",false,"Your head sheds heat in line with its share of your skin, around 10 percent. The myth is often traced to old US Army cold-weather tests where volunteers were bundled in Arctic suits but left bareheaded."],["Shave it off and it comes back thicker and darker.",false,"A razor only cuts the dead shaft, so it can't reach the follicle that decides thickness or colour. Stubble just feels coarse because it has a blunt tip instead of a natural tapered one."],["The blood in your veins is blue until it meets oxygen.",false,"Human blood is always red: bright red when rich in oxygen, darker red when not. Veins look blue because of the way light passes through skin and is absorbed."],["An Australian mammal lays eggs and the males have venomous spurs.",true,"The platypus lays eggs, and males carry a spur on each hind leg that delivers venom painful enough to disable a dog. It’s one of very few venomous mammals."],["Going outside with wet hair gives you a cold.",false,"Colds are caused by viruses, so you need to catch one to get sick. Colds are more common in winter mainly because people crowd indoors and some viruses survive better in cool, dry air."],["Some turtles can breathe through their bottoms.",true,"Australia’s Fitzroy River turtle absorbs oxygen from water through its cloaca, the rear opening. This lets it stay underwater for very long periods."],["Taking vitamin C every day stops most people catching colds.",false,"Large reviews found regular vitamin C does not reduce how often most people catch colds, though it may slightly shorten them. It only cut cold risk in people under heavy physical stress, such as marathon runners."],["Dogs see the world only in black and white.",false,"Dogs do see colour, but fewer shades than we do. With two types of colour receptors instead of our three, they mainly see blues and yellows and struggle to separate red from green."],["A duck’s quack doesn’t echo.",false,"Acoustics researchers at the University of Salford tested this in 2003 and found a quack echoes like any other sound. The echo is just hard to notice because a quack fades gradually."],["Earth's trees outnumber the stars in our galaxy.",true,"Earth has around three trillion trees against a few hundred billion stars in the Milky Way. The same 2015 study estimated the number of trees has nearly halved since humans started farming."],["Handle a chick and its parents will abandon it because of your scent.",false,"Most birds barely notice smells and won't ditch a chick over a human touch. Feathered fledglings hopping on the ground are often fine anyway, since their parents keep feeding them there for days."],["Camels store water in their humps.",false,"A camel’s hump is mostly fat, an energy reserve for lean times. Camels survive without water thanks to efficient kidneys and blood cells that cope with dehydration."],["Humans glow in the dark.",true,"Your body gives off a faint visible light, about 1,000 times too weak for your eyes to see. Japanese researchers filmed it with ultra-sensitive cameras in 2009 and found it was brightest on the face in the late afternoon."],["A coin dropped from a skyscraper could kill someone below.",false,"A small, flat coin tumbles and quickly reaches a low top speed because of air resistance. It might sting, but it would not be deadly."],["Hippos can’t swim.",true,"Hippos are too dense to float, so instead of swimming they walk or bounce along the riverbed, pushing off the bottom to reach the surface and breathe."],["Ostriches bury their heads in the sand when they’re scared.",false,"They don’t. A threatened ostrich may lie flat with its head and neck along the ground, and parents turn their eggs in shallow ground nests with their beaks, which from a distance can look like head-burying."],["Walt Disney’s body was frozen so he could be revived in the future.",false,"Disney died in December 1966 and was cremated; his ashes are at Forest Lawn cemetery in Glendale, California. The first person ever cryonically frozen, psychology professor James Bedford, was preserved about a month later, which may have fuelled the rumour."],["The inventor of the Pringles can was buried in one.",true,"Fredric Baur, the chemist who designed the stackable can, died in 2008. At his request, his family placed some of his ashes in a Pringles can before burying them."],["Australia’s 1932 Emu War was a victory for the soldiers.",false,"Soldiers with machine guns were sent to cull emus in Western Australia’s wheatbelt. The fast, scattered birds were so hard to hit that the operation was withdrawn after a few weeks."],["Crows can remember and recognise individual human faces.",true,"In University of Washington studies, crows scolded people wearing a mask that had been worn while trapping them, years later. They even seemed to pass the warning to other crows."],["Albert Einstein failed maths at school.",false,"He excelled at it and had mastered calculus before he was 15. The myth spread after a 1935 “Ripley’s Believe It or Not!” item, and Einstein replied that he had never failed in mathematics."],["Woolly mammoths were still alive when the Great Pyramid was built.",true,"A small population survived on Wrangel Island, off Siberia, until roughly 4,000 years ago. The Great Pyramid of Giza was finished around 4,500 years ago."],["Meteorites are red-hot when they hit the ground.",false,"Only a thin outer layer melts during the fall, and it streams away as it forms. The inside keeps the deep cold of space, so meteorites found soon after landing are usually just warm, or even cool, to the touch."],["Nintendo was founded in the 1800s.",true,"Nintendo began in Kyoto in 1889, making handmade hanafuda playing cards. It moved into electronic games only in the 1970s."],["Lemmings leap off cliffs in mass suicides.",false,"Lemming numbers boom and bust, and some drown when migrating across water, but they don’t deliberately kill themselves. The myth was cemented by Disney’s 1958 documentary White Wilderness, whose filmmakers herded lemmings off a ledge into a river."],["Diamonds are formed from squashed coal.",false,"Most diamonds form about 150 kilometres or more down in Earth’s mantle, far below any coal. Many are over a billion years old, older than land plants, which coal comes from."],["An ancient Roman emperor taxed urine.",true,"Emperor Vespasian taxed the collection of urine from public toilets, which was used for laundry and tanning. The phrase “pecunia non olet” (money doesn’t stink) grew from his reply to critics."],["Humans evolved from chimpanzees.",false,"Humans and chimpanzees share a common ancestor that lived millions of years ago. Both species have been evolving separately ever since, so chimps are cousins, not ancestors."],["In Columbus’s time, educated people believed the Earth was flat.",false,"Educated Europeans had known Earth was round since ancient Greek times. The real debate was about its size, and Columbus badly underestimated it."],["Marie Antoinette said “Let them eat cake.”",false,"There’s no evidence she said it. A version of the line appears in Rousseau’s Confessions, written when she was a child in Austria."],["The first cultivated carrots were not orange.",true,"Early cultivated carrots, from around Central Asia, were mostly purple or yellow. Orange carrots became common later, especially thanks to Dutch growers in the 1600s."],["Emperor Nero played the fiddle while Rome burned.",false,"The fiddle wasn’t invented for another 1,500 years or so. The historian Tacitus says Nero was away at Antium when the fire of 64 CE began and returned to organise relief."],["Fresh pineapple contains an enzyme that breaks down protein.",true,"Pineapple contains bromelain, which digests proteins and can make your mouth tingle. It’s also why fresh pineapple stops jelly from setting."],["Thomas Edison invented the first electric light bulb.",false,"Inventors including Joseph Swan made working incandescent bulbs before Edison. His achievement, from 1879, was a practical, long-lasting bulb and the system to power it."],["Just reading about yawning can make you yawn.",true,"Contagious yawning is triggered by seeing, hearing or even reading about yawns, as psychologist Robert Provine showed. Are you yawning yet?"],["James Cook was the first European to reach Australia.",false,"Dutch navigator Willem Janszoon charted part of Cape York in 1606, over 160 years before Cook. Aboriginal and Torres Strait Islander peoples had lived there for more than 50,000 years."],["Octopuses can taste with their arms.",true,"Their suckers are packed with chemical receptors, so an octopus tastes whatever it touches. Most of its neurons are in its arms, which lets each arm explore and react partly on its own."],["“Kangaroo” means “I don’t understand” in an Aboriginal language.",false,"The word comes from “gangurru”, the Guugu Yimithirr word for a type of kangaroo, recorded by Cook’s expedition in 1770. Linguists confirmed the original meaning in the 1970s."],["Tyrannosaurus rex lived closer in time to us than to Stegosaurus.",true,"Stegosaurus lived about 150 million years ago, while T. rex lived about 68 to 66 million years ago. That puts over 80 million years between them, but only 66 million between T. rex and us."],["Peanuts are nuts.",false,"Peanuts are legumes, relatives of peas and beans, and their pods grow underground. Botanically they’re closer to a lentil than a walnut."],["One species of jellyfish can reverse its life cycle and become young again.",true,"When stressed or injured, the jellyfish Turritopsis dohrnii can turn back into its early polyp stage and grow up again. It still dies from predators and disease, but not necessarily from old age."],["Searing meat seals in the juices.",false,"Seared meat loses about as much moisture as unseared meat. Searing is still worth doing because browning creates rich flavour."],["Australia has the world’s largest population of wild camels.",true,"Camels were brought over in the 1800s to carry supplies across the outback. When railways and trucks took over, many were set free, and hundreds of thousands now roam the arid interior."],["Swallow your gum and it'll sit in your gut for seven years.",false,"Gum base can't be broken down, but your gut simply pushes it along and out within days. The only real trouble comes from swallowing big wads often, which has occasionally caused blockages in kids."],["A giraffe has the same number of neck bones as you.",true,"Both have seven neck vertebrae, like almost all mammals. A giraffe’s are simply enormous, each around 25 cm long."],["You must wait 24 hours before reporting someone missing.",false,"Australian police say there is no waiting period. If you’re worried about someone, contact police straight away, and call 000 if you think they’re in danger."],["The dot on a lowercase “i” has its own name.",true,"It’s called a tittle, from the medieval Latin titulus, a small mark. The word survives in the King James Bible’s phrase “one jot or one tittle”."],["A drink of alcohol warms you up in the cold.",false,"Alcohol widens blood vessels near your skin, so you feel warmer while actually losing heat faster. It can raise the risk of hypothermia."],["The Leaning Tower of Pisa started leaning while it was still being built.",true,"The tower began tilting in the 1170s, after the third floor was added on soft ground. Builders later made upper floors taller on one side to compensate, giving it a slight curve."],["Caesar salad is named after Julius Caesar.",false,"It’s usually credited to Caesar Cardini, an Italian-born restaurateur in Tijuana, Mexico, in the 1920s."],["The Moon has quakes, just like Earth.",true,"Seismometers left by Apollo astronauts recorded thousands of moonquakes between 1969 and 1977. Some shallow ones reached about magnitude 5 and shook for over ten minutes, because the Moon’s dry, rigid rock rings like a bell."],["People are either left-brained (logical) or right-brained (creative).",false,"Some tasks rely more on one side of the brain, but a large study of over 1,000 brain scans found no evidence people favour one side overall. Logic and creativity both use networks across both hemispheres."],["Horses can’t vomit.",true,"A strong valve at the base of a horse’s oesophagus, and the angle it joins the stomach, stops food coming back up. It’s one reason colic in horses can be so serious."],["You learn best when taught in your preferred learning style, like visual or auditory.",false,"Many people have preferences, but studies find that matching teaching to a person’s preferred style doesn’t improve learning. Matching the method to the material works better."],["A “jiffy” is a real unit of time.",true,"Scientists have defined it several ways. In physics it can mean the time light takes to travel one centimetre, about 33 trillionths of a second, while electrical engineers use it for one cycle of mains power: 1/50 of a second in Australia."],["Venting anger, like hitting a pillow, helps you let it go.",false,"Studies show venting tends to keep anger going or increase it. Calming activities and time are more effective at cooling down."],["“OK” started as a joke abbreviation of a misspelling.",true,"In 1839, a Boston newspaper used “o.k.” for “oll korrect”, part of a fad for comic abbreviations. It spread widely and became one of the world’s most used words."],["In relationships, opposites attract.",false,"Research consistently finds that people are drawn to partners who share their values, interests and background. Similarity predicts attraction and lasting relationships much better than difference."],["Bumblebees shouldn’t be able to fly, according to science.",false,"The idea came from a 1930s calculation that treated a bee’s wing like a fixed aeroplane wing. Bees actually flap about 200 times a second, sweeping their wings to create swirling air vortices that give plenty of lift."],["With practice, you can do two demanding tasks at once as well as one.",false,"For tasks that need attention, the brain switches rapidly between them rather than doing both at once. Each switch costs time and accuracy."],["“Irregardless” is listed in major dictionaries.",true,"Merriam-Webster and others include it, labelled as nonstandard. It’s a real word in use since at least the early 1900s, but “regardless” is the safer choice."],["You should never end a sentence with a preposition.",false,"This “rule” dates from the late 1600s, when writers such as John Dryden wanted English to follow Latin grammar. Great writers have always broken it, and modern style guides accept it."],["SOS stands for “Save Our Souls”.",false,"SOS was chosen in the early 1900s because its Morse code, three dots, three dashes, three dots, is simple and unmistakable. “Save Our Souls” was invented afterwards to fit the letters."],["“Ring a Ring o’ Roses” is about the plague.",false,"The rhyme first appeared in print in 1881, and the plague theory wasn’t recorded until the mid-1900s. Folklorists find no evidence linking them."],["Food dropped on the floor is safe if you pick it up within five seconds.",false,"Rutgers University researchers found bacteria can transfer in under a second. Moist foods pick up more, and time on the floor only increases it."],["Antibiotics will help you get over a cold or flu faster.",false,"Colds and flu are caused by viruses, and antibiotics only work on bacteria. Taking them when they’re not needed can cause side effects and helps resistant bacteria spread."],["You should put butter on a burn.",false,"Butter holds heat in and can raise infection risk. Australian first-aid advice is to cool the burn under running water for 20 minutes and call 000 for serious burns."],["Tilt your head back to stop a nosebleed.",false,"Tilting back can send blood down your throat. First-aid groups advise sitting, leaning forward and pinching the soft part of the nose for about 10 minutes."],["Sucking out the venom is good first aid for a snakebite.",false,"It doesn’t remove venom and can cause harm. In Australia, call 000, keep the person still, and apply a pressure immobilisation bandage."],["Early humans lived alongside dinosaurs.",false,"The non-bird dinosaurs died out about 66 million years ago. Our species appeared only around 300,000 years ago."],["Eating carrots helps you see in the dark.",false,"Vitamin A from carrots prevents night blindness caused by a deficiency, but extra carrots won’t sharpen normal night vision. Britain spread the idea in World War II, partly to explain its night-fighter pilots’ success without revealing its new radar."],["More people are alive today than have ever died.",false,"Demographers estimate around 117 billion people have ever been born. The roughly 8 billion alive now are only about 7% of them."],["Roman soldiers were paid in salt, which gave us the word “salary”.",false,"“Salary” comes from Latin “salarium”, which is linked to “sal” (salt), but no ancient source says soldiers were paid in salt. The exact connection remains unclear."],["93% of communication is non-verbal.",false,"This figure comes from 1960s experiments on how people judge feelings from single words, tone of voice and facial expressions. The researcher, Albert Mehrabian, has said it doesn’t apply to communication in general."],["The seeds are the hottest part of a chilli.",false,"The heat compound capsaicin is concentrated in the white pith that holds the seeds. Seeds taste hot mainly because they touch it."],["Spicy food causes stomach ulcers.",false,"Most ulcers are caused by Helicobacter pylori bacteria or by some pain-relief medicines. Australians Barry Marshall and Robin Warren won the 2005 Nobel Prize for discovering the bacterial link."],["The North Star is the brightest star in the night sky.",false,"Polaris is only around the 48th brightest star; Sirius is the brightest. Polaris is useful for navigation because it sits almost directly above the North Pole, and it can’t be seen from Australia."],["Private or incognito browsing hides what you do online.",false,"Private mode only stops your device saving history and cookies. Websites, your employer or school, and your internet provider can still see your activity."],["Force-closing apps on an iPhone saves battery.",false,"Apple says background apps are paused and use little or no power. Relaunching them from scratch can use more battery, so only close an app if it’s frozen."],["Microwave ovens cook food from the inside out.",false,"Microwaves only reach the outer couple of centimetres of food. The centre heats up as that warmth spreads inwards, which is why thick dishes need stirring or standing time."],["Sea otters sometimes hold hands while they sleep.",true,"Sea otters rest floating on their backs and may link paws or wrap themselves in kelp. This keeps them from drifting apart or away on the current."],["You swallow several spiders a year in your sleep.",false,"There’s no evidence for it. A sleeping person’s breathing, heartbeat and snoring create vibrations that spiders tend to avoid, and a mouth is not an inviting place for one."],["Frankenstein is the name of the monster.",false,"In Mary Shelley’s 1818 novel, Victor Frankenstein is the scientist. The creature he makes is never given a name."]];
const WORDS = [["Blurb","BLURB","noun","A short promotional description of a book, film or product.","The blurb promised a gripping thriller, but the book was a slog.","Coined in 1907 by American humorist Gelett Burgess, whose mock book jacket showed a gushing young woman he named Miss Belinda Blurb."],["Sardonic","sar-DON-ik","adjective","Grimly mocking or cynical.","Her sardonic “Well, that went well” summed up the meeting.","From Greek sardonios, later linked to a plant from Sardinia said to twist the faces of those who ate it into a deathly grin."],["Equanimity","ek-wuh-NIM-i-tee","noun","Calm and evenness of mind, especially under pressure.","She took the bad news with an equanimity that steadied everyone else.","Latin aequus (even) + animus (mind). A core Stoic ideal."],["Eudaimonia","yoo-dy-MOH-nee-uh","noun","A life of flourishing and fulfilment, not just passing pleasure.","For Aristotle, eudaimonia came from living well and acting with virtue.","Greek eu (good) + daimon (spirit)."],["Ataraxia","at-uh-RAK-see-uh","noun","A state of serene calm, free from worry and disturbance.","The Epicureans prized ataraxia above wealth or fame.","Greek, literally “not being troubled”."],["Serendipity","ser-en-DIP-i-tee","noun","A lucky find you stumble on when you weren't even trying.","Taking a wrong turn in Hobart led us, by pure serendipity, to the best fish and chips of the trip.","Coined by Horace Walpole in 1754, after a fairy tale, The Three Princes of Serendip."],["Ephemeral","ih-FEM-er-ul","adjective","Lasting a very short time.","Fame on social media is often ephemeral.","Greek ephemeros, “lasting only a day”."],["Sanguine","SANG-gwin","adjective","Optimistic, especially in a difficult situation.","Despite the setbacks, the coach remained sanguine about the season.","From Latin sanguis, blood; blood was once thought to cause a cheerful temperament."],["Perspicacious","pur-spi-KAY-shus","adjective","Quick to notice and understand things others miss.","A perspicacious editor spotted the flaw in the argument at once.","Latin perspicere, “to see through”."],["Mellifluous","muh-LIF-loo-us","adjective","Sweet and smooth to hear, like a flowing voice.","The narrator’s mellifluous voice made the audiobook a pleasure.","Latin mel (honey) + fluere (to flow)."],["Hubris","HYOO-bris","noun","Excessive pride or self-confidence, often leading to a downfall.","It was hubris to launch without testing.","In Greek tragedy, hubris provoked the gods’ punishment."],["Quixotic","kwik-SOT-ik","adjective","Idealistic in a way that is noble but unrealistic.","His quixotic plan was to reply personally to every email he had ever received.","From Don Quixote, Cervantes’ knight who tilted at windmills."],["Lethologica","leth-oh-LOJ-i-kuh","noun","The inability to remember the word you want.","A bout of lethologica left her pointing at the “thing” on the shelf.","Greek lethe (forgetfulness) + logos (word)."],["Tsundoku","tsoon-DOH-koo","noun","Buying books and letting them pile up unread.","His bedside table was a monument to tsundoku.","Japanese, combining words for “piling up” and “reading”."],["Limerence","LIM-er-ence","noun","The intense, obsessive early stage of romantic infatuation.","In the grip of limerence, he reread every message she sent.","Coined by psychologist Dorothy Tennov in 1979."],["Susurrus","soo-SUR-us","noun","A soft whispering or rustling sound.","The susurrus of the gum trees filled the evening.","Latin, “a whisper”."],["Halcyon","HAL-see-un","adjective","Denoting a past time that was idyllically happy and peaceful.","They talked about the halcyon days of university.","From a Greek myth of a bird that calmed the sea to nest."],["Vicissitude","vi-SIS-i-tood","noun","A change of fortune, usually an unwelcome one.","The business survived the vicissitudes of three recessions.","Latin vicis, “change, turn”."],["Apricity","a-PRIS-i-tee","noun","The warmth of the sun on a cold winter’s day.","They sat on the step, enjoying the apricity of a July afternoon.","A rare word from Latin apricus, “warmed by the sun”."],["Obsequious","ob-SEE-kwee-us","adjective","Too eager to please or obey.","The obsequious waiter refilled their glasses every thirty seconds.","Latin obsequi, “to comply with”."],["Defenestration","dee-fen-uh-STRAY-shun","noun","The act of throwing someone out of a window.","The 1618 Defenestration of Prague helped spark the Thirty Years’ War.","Latin de (out of) + fenestra (window)."],["Sesquipedalian","ses-kwi-puh-DAY-lee-un","adjective","Given to using long words; or, a long word itself.","The lecture was so sesquipedalian that half the room reached for a dictionary.","From Horace’s joke about words “a foot and a half long”."],["Ineffable","in-EF-uh-bul","adjective","Too great or intense to be expressed in words.","Standing under the night sky in the outback gave her an ineffable sense of calm.","From Latin ineffabilis, “unutterable”, from in- “not” and effari “to speak out”."],["Mondegreen","MON-duh-green","noun","A misheard word or phrase, especially a song lyric, that creates a new meaning.","For years he sang a mondegreen of the chorus and nobody had the heart to correct him.","Coined by American writer Sylvia Wright in 1954, who as a child misheard the ballad line “and laid him on the green” as “and Lady Mondegreen”."],["Ubiquitous","yoo-BIK-wi-tus","adjective","So common it seems to turn up absolutely everywhere you look.","On bin night, those yellow-lidded recycling bins are ubiquitous, lined up along every kerb in the suburb.","From Latin ubique, “everywhere”."],["Pulchritude","PUL-kri-tyood","noun","Physical beauty.","The poet praised her pulchritude, which is ironic, because the word itself is rather ugly.","From Latin pulchritudo, from pulcher, “beautiful”."],["Obfuscate","OB-fuh-skate","verb","To make something deliberately unclear or hard to understand.","The contract seemed designed to obfuscate the real fees.","From Latin obfuscare, “to darken”, from ob- “over” and fuscus “dark”."],["Sycophant","SIK-uh-fant","noun","A person who flatters powerful people to gain an advantage.","The manager surrounded himself with sycophants and never heard bad news until it was too late.","From Greek sykophantes, literally “fig-shower”, originally meaning an informer or slanderer; exactly why figs were involved is unknown."],["Candid","KAN-did","adjective","Honest and open, saying what you really think without softening it.","My hairdresser was candid: the fringe I wanted would never sit right with my cowlick.","From Latin candidus, “shining white”; “candidate” shares the root because Roman office seekers wore whitened togas."],["Nostalgia","nos-TAL-juh","noun","A sentimental longing for a period in the past.","The smell of sunscreen fills him with nostalgia for childhood summers.","Coined in 1688 by Swiss medical student Johannes Hofer from Greek nostos “homecoming” and algos “pain”, to describe severe homesickness as an illness."],["Melancholy","MEL-un-kol-ee","noun","A deep, lingering and often thoughtful sadness.","A gentle melancholy settled over the town once the tourists had gone.","From Greek melankholia, “black bile”, one of the four bodily humours once thought to cause gloom."],["Procrastinate","proh-KRAS-tuh-nate","verb","To delay or put off something that should be done.","I procrastinate most on the tasks that matter most.","From Latin procrastinare, from pro- “forward” and crastinus “belonging to tomorrow”."],["Akrasia","uh-KRAY-zee-uh","noun","Acting against your own better judgement; weakness of will.","Knowing I should sleep but watching one more episode is pure akrasia.","From Greek akrasia, “lack of command over oneself”, from a- “without” and kratos “power”; Socrates and Aristotle both debated how it is possible."],["Phlegmatic","fleg-MAT-ik","adjective","Calm, unemotional and not easily excited.","Her phlegmatic reaction to the flat tyre calmed everyone else in the car.","From Greek phlegma, “phlegm”, the bodily humour once believed to make people sluggish and calm."],["Avuncular","uh-VUNG-kyuh-ler","adjective","Kind, friendly and supportive towards someone younger, like a favourite uncle.","The avuncular coach knew the name of every junior player.","From Latin avunculus, “mother’s brother”, literally “little grandfather”, from avus, “grandfather”."],["Cynic","SIN-ik","noun","A person who believes people are motivated mainly by self-interest.","Even the cynics in the office were moved by her farewell speech.","From Greek kynikos, “dog-like”; Diogenes, the most famous of the ancient Cynic philosophers, was nicknamed “the Dog” for living shamelessly in public."],["Jumbo","JUM-boh","adjective","Very large; bigger than usual.","We ordered a kilo of jumbo prawns for the barbecue.","From Jumbo, a huge African elephant at London Zoo who became a celebrity and was sold to American showman P. T. Barnum in 1882."],["Mentor","MEN-tor","noun","An experienced and trusted adviser.","A good mentor tells you what you need to hear, not what you want to hear.","From Mentor, the friend of Odysseus in Homer’s Odyssey, whose form the goddess Athena takes to guide his son Telemachus."],["Nemesis","NEM-uh-sis","noun","A long-standing rival or enemy, or something that causes someone’s downfall.","Maths was my nemesis all through high school.","Named after Nemesis, the Greek goddess of retribution who punished arrogance."],["Panic","PAN-ik","noun","Sudden, overwhelming fear that often causes unthinking behaviour.","When the alarm went off, the trained staff calmly prevented a panic.","From Greek panikos, “of Pan”, the god of the wild whose sudden shouts were said to fill people and animals with terror."],["Tantalise","TAN-tuh-lize","verb","To tease or torment with the sight of something desirable that is out of reach.","The smell from the bakery tantalised us all the way to work.","From Tantalus, who in Greek myth was punished by standing in water beneath fruit trees, with the water and fruit always retreating as he reached for them."],["Maverick","MAV-er-ik","noun","An independent-minded person who refuses to follow the crowd.","The company needed a maverick to challenge how things had always been done.","From Samuel Maverick, a 19th-century Texas landowner who did not brand his cattle, so unbranded strays came to be called mavericks."],["Boycott","BOY-kot","verb","To refuse to deal with a person, business or country as a form of protest.","Shoppers vowed to boycott the brand after the scandal.","From Captain Charles Boycott, an estate manager in County Mayo, Ireland, who was ostracised by the local community in 1880 during a dispute over rents."],["Quarantine","KWOR-un-teen","noun","A period of isolation to stop a disease from spreading.","The new puppy spent ten days in quarantine before arriving in Australia.","From Venetian Italian quarantena, “a period of forty days”, the time ships were made to wait before landing during late medieval plague outbreaks."],["Muscle","MUS-ul","noun","Body tissue that contracts to produce movement.","Regular strength training helps you keep muscle as you age.","From Latin musculus, “little mouse”, perhaps because a flexing muscle looked like a mouse moving under the skin."],["Companion","kum-PAN-yun","noun","A person you spend time with or travel with.","On a long hike, the right companion matters more than the right boots.","From Late Latin companio, literally “one who shares bread with you”, from com- “together” and panis “bread”."],["Disaster","diz-AH-ster","noun","A sudden event that causes great damage or loss.","Good planning turned what could have been a disaster into a minor delay.","From Italian disastro, “ill-starred”, from dis- “bad” and astro “star”, reflecting the old belief that misfortune came from unlucky positions of the stars."],["Clue","KLOO","noun","A piece of evidence or information that helps solve a problem or mystery.","The muddy footprints were the first real clue.","From “clew”, a ball of thread, recalling the Greek myth in which Theseus used a thread to find his way out of the Minotaur’s labyrinth."],["Nice","NICE","adjective","Pleasant, agreeable or kind.","It was nice of you to remember my birthday.","From Latin nescius, “ignorant”; in Middle English it meant “foolish”, and only gradually drifted over centuries to mean “pleasant”."],["Silly","SIL-ee","adjective","Lacking good sense; foolish, often in a harmless way.","It seems silly now, but I was terrified of that dog as a kid.","From Old English gesælig, “happy, blessed”; the meaning slid over centuries through “innocent” and “pitiable” to “foolish”."],["Hectic","HEK-tik","adjective","Full of frantic, busy activity.","The week before school holidays is always hectic.","From Greek hektikos, “habitual, continuous”, first used in English for a persistent fever, then for anything feverishly busy."],["Sinister","SIN-is-ter","adjective","Giving the impression that something harmful or evil is happening.","There was something sinister about the empty house at the end of the street.","From Latin sinister, “left”, because the left side was traditionally considered unlucky."],["Nightmare","NITE-mair","noun","A frightening dream, or a very unpleasant experience.","Moving house in the middle of exams was a nightmare.","From Old English mære, an evil spirit believed to sit on sleepers’ chests and bring bad dreams; it has nothing to do with horses."],["Draconian","druh-KOH-nee-un","adjective","Excessively harsh or severe, especially of laws or rules.","The school’s draconian phone policy banned devices even at lunch.","From Draco, an Athenian lawmaker of around 621 BC whose code prescribed death for many minor offences."],["Philistine","FIL-is-tine","noun","A person who is hostile or indifferent to art and culture.","Only a philistine would paint over that mural.","From German student slang Philister for townspeople outside the university, after the biblical Philistines; popularised in English by Matthew Arnold in the 1860s."],["Pyrrhic","PIR-ik","adjective","Describing a victory won at such great cost that it is hardly worth it.","Winning the argument was a Pyrrhic victory: he lost the friendship.","From Pyrrhus, King of Epirus, whose victories over Rome in 280 and 279 BC cost him so many of his best soldiers that further wins like them would have ruined him."],["Meander","mee-AN-der","verb","To follow a winding course, or to wander aimlessly.","We meandered through the laneways with no plan at all.","From the Maeander, a famously winding river in ancient Asia Minor, now the Büyük Menderes in Turkey."],["Hygge","HOO-guh","noun","A cosy, contented feeling of comfort and togetherness.","Candles, soup and a good book: that’s my idea of winter hygge.","A Danish word, borrowed from Norwegian hygge, “wellbeing”."],["Schadenfreude","SHAH-dun-froy-duh","noun","Pleasure felt at someone else’s misfortune.","He felt a pang of schadenfreude when his know-it-all colleague got the answer wrong.","German, from Schaden “harm” and Freude “joy”."],["Zeitgeist","ZITE-guyst","noun","The defining spirit or mood of a particular period of history.","The film captured the zeitgeist of the early internet years.","German, from Zeit “time” and Geist “spirit”."],["Ennui","on-WEE","noun","A feeling of listless boredom and dissatisfaction.","By the third wet week of holidays, a heavy ennui had settled over the house.","French, from Latin in odio, as in the phrase “to be in hatred”, the same root that gave English the word “annoy”."],["Sisu","SEE-soo","noun","Quiet, stubborn determination to keep going against the odds.","Finishing the marathon after cramping at 30 kilometres took real sisu.","A Finnish word central to national identity, from sisus, “insides” or “guts”."],["Ikigai","ee-kee-GUY","noun","A sense of purpose; the thing that makes life feel worth living.","Since retiring, gardening and grandchildren have become her ikigai.","Japanese, from iki “life” and kai (softened to gai) “worth” or “benefit”."],["Kintsugi","kin-TSOO-gee","noun","The Japanese art of repairing broken pottery with gold, making the cracks part of its beauty.","He treats his old failures like kintsugi: the repairs are part of who he is.","Japanese, from kin “gold” and tsugi “joining”."],["Saudade","sow-DAH-duh","noun","A deep, bittersweet longing for someone or something absent or lost.","Old photos of her grandparents’ village filled her with saudade.","Portuguese, from Latin solitas, “solitude” or “loneliness”."],["Flâneur","flah-NUR","noun","A person who strolls around a city, unhurried, simply observing its life.","On Sunday mornings he plays the flâneur, wandering the markets with no shopping list.","French, from flâner, “to stroll” or “to saunter”; made famous by the poet Charles Baudelaire in 19th-century Paris."],["Sprezzatura","spret-suh-TOO-ruh","noun","Studied carelessness; making something difficult look effortless.","The pianist played with such sprezzatura that nobody guessed the hours of practice behind it.","Italian, coined by Baldassare Castiglione in The Book of the Courtier, published in 1528."],["Fernweh","FAIRN-vay","noun","A longing to travel to distant places; the opposite of homesickness.","Scrolling through photos of Iceland gave her a bad case of fernweh.","German, from fern “far” and Weh “ache”, modelled on Heimweh, “homesickness”."],["Grok","GROK","verb","To understand something thoroughly and intuitively.","It took a week of practice before I really grokked how the software worked.","Invented by science-fiction author Robert Heinlein in his 1961 novel Stranger in a Strange Land, as a Martian word."],["Shampoo","sham-POO","noun","A liquid soap for washing hair.","After a week of camping, the first shampoo felt like pure luxury.","From Hindi chāmpo, “press” or “knead”, first meaning a head massage; Sake Dean Mahomed popularised “shampooing” baths in Brighton, England, from 1814."],["Chortle","CHOR-tul","verb","To laugh in a breathy, gleeful way.","Grandad chortled at his own joke before he reached the punchline.","Coined by Lewis Carroll in Through the Looking-Glass (1871), probably blending “chuckle” and “snort”."],["Pandemonium","pan-duh-MOH-nee-um","noun","Wild and noisy disorder or confusion.","Pandemonium broke out when the dog got loose at the wedding.","Coined by John Milton in Paradise Lost (1667) as the capital of Hell, from Greek pan “all” and daimon “spirit”, meaning “place of all demons”."],["Utopia","yoo-TOH-pee-uh","noun","An imagined place or state in which everything is perfect.","A four-day work week sounds like utopia to most people.","Coined by Thomas More for his 1516 book, from Greek ou “not” and topos “place”, so literally “nowhere”, with a pun on eu-topos, “good place”."],["Juggernaut","JUG-er-nawt","noun","A huge, powerful force or organisation that seems unstoppable.","The small café couldn’t compete once the coffee juggernaut opened next door.","From Jagannath, a form of the Hindu god Vishnu whose image is pulled through Puri, India, each year on enormous chariots."],["Ombudsman","OM-budz-mun","noun","An official who investigates complaints against organisations or government.","When the telco ignored her complaint, she took it to the ombudsman.","From Swedish ombudsman, “representative”; Sweden created the first parliamentary ombudsman in 1809."],["Smorgasbord","SMOR-gus-bord","noun","A wide range of different things; originally a buffet of many dishes.","The festival offered a smorgasbord of music, food and art.","From Swedish smörgåsbord, from smörgås “open sandwich” and bord “table”."],["Kowtow","kow-TOW","verb","To be excessively submissive or obedient to someone.","She refused to kowtow to the loudest person in the meeting.","From Chinese kòutóu, “knock the head”, describing the act of kneeling and touching the forehead to the ground as a sign of respect."],["Tycoon","ty-KOON","noun","A wealthy, powerful person in business or industry.","The shipping tycoon started out with a single second-hand truck.","From Japanese taikun, “great lord”, a title used for the shogun in dealings with foreigners."],["Quintessential","kwin-tuh-SEN-shul","adjective","Representing the most perfect or typical example of something.","A backyard barbecue on a hot afternoon is the quintessential Australian summer scene.","From medieval Latin quinta essentia, “fifth essence”, a substance beyond earth, air, fire and water that was thought to make up the heavens."],["Cacophony","kuh-KOF-uh-nee","noun","A harsh, jarring mixture of sounds.","At dawn the cockatoos created a cacophony outside the window.","From Greek kakophonia, from kakos “bad” and phone “sound”."],["Crepuscular","kruh-PUS-kyoo-ler","adjective","Active or appearing at dawn and dusk.","Many kangaroos and wallabies are crepuscular, so drive with extra care at dawn and dusk.","From Latin crepusculum, “twilight”."],["Liminal","LIM-in-ul","adjective","Relating to a transitional stage, between one state and the next.","The weeks between finishing uni and starting work felt strangely liminal.","From Latin limen, “threshold”."],["Magnanimous","mag-NAN-i-mus","adjective","Generous and forgiving, especially towards a rival or someone less powerful.","She was magnanimous in victory and thanked her opponent first.","From Latin magnanimus, from magnus “great” and animus “soul” or “mind”."],["Pusillanimous","pyoo-si-LAN-i-mus","adjective","Lacking courage or determination; timid.","The board’s pusillanimous response let the problem grow for years.","From Latin pusillanimis, from pusillus “very small” and animus “soul”: literally “small-souled”, the opposite of magnanimous."],["Assiduous","uh-SID-yoo-us","adjective","Showing great care, persistence and attention.","Her assiduous note-taking paid off at exam time.","From Latin assiduus, from assidere, “to sit beside”, suggesting someone who stays at a task."],["Meticulous","muh-TIK-yuh-lus","adjective","Extremely careful about every little detail, leaving nothing to chance.","He's meticulous about packing his tackle box, with every lure sorted by size and colour.","From Latin meticulosus, “fearful” or “timid”, from metus “fear”; the sense shifted to being careful out of fear of making mistakes."],["Scrupulous","SKROO-pyuh-lus","adjective","Very careful to do what is honest and morally right; thorough.","A scrupulous tradie will tell you when you don’t need the expensive repair.","From Latin scrupulus, “small sharp stone”, like a pebble in the shoe that nags at you, just as a conscience does."],["Recalcitrant","ri-KAL-si-trunt","adjective","Stubbornly uncooperative towards authority or control.","Even the most recalcitrant printer eventually gives in to being turned off and on again.","From Latin recalcitrare, “to kick back with the heel”, from calx “heel”, as a stubborn horse or mule does."],["Supercilious","soo-per-SIL-ee-us","adjective","Behaving as though you think you are superior to others.","The waiter gave a supercilious glance at our choice of wine.","From Latin supercilium, “eyebrow”, evoking the raised eyebrow of disdain."],["Lackadaisical","lak-uh-DAY-zi-kul","adjective","Lacking enthusiasm and effort; careless.","His lackadaisical approach to the budget caught up with him at tax time.","From the old exclamation “lackaday”, short for “alack the day”, an expression of regret or weary sighing."],["Ruminate","ROO-mi-nate","verb","To think deeply and repeatedly about something.","Instead of ruminating over the mistake, write down one lesson and move on.","From Latin ruminari, “to chew the cud”, as cows do, bringing food back up to chew again."],["Prevaricate","pri-VAR-i-kate","verb","To avoid telling the truth by speaking evasively.","When asked where the money went, he began to prevaricate.","From Latin praevaricari, “to walk crookedly”, from prae “before” and varicare “to straddle”."],["Exacerbate","ig-ZAS-er-bate","verb","To make a problem or bad situation worse.","Scrolling late at night can exacerbate poor sleep.","From Latin exacerbare, “to make harsh”, from acerbus “harsh” or “bitter”."],["Ameliorate","uh-MEE-lee-uh-rate","verb","To make something bad or unsatisfactory better.","Planting trees along the street helped ameliorate the summer heat.","From French améliorer, from Latin melior, “better”."],["Heuristic","hyoo-RIS-tik","noun","A mental shortcut or rule of thumb that helps you make decisions quickly.","“If in doubt, leave it out” is a useful heuristic for packing.","From Greek heuriskein, “to find”, the same root as “eureka”, “I have found it”."],["Epiphany","ih-PIF-uh-nee","noun","A sudden and striking realisation.","She had an epiphany in the shower: the problem wasn’t the job, it was the commute.","From Greek epiphaneia, “appearance” or “manifestation”."],["Catharsis","kuh-THAR-sis","noun","The release of strong emotions, bringing relief.","Writing the angry letter and then deleting it was pure catharsis.","From Greek katharsis, “cleansing” or “purging”; Aristotle used it in his Poetics for the emotional release an audience feels at a tragedy."],["Nadir","NAY-deer","noun","The lowest point of something.","Losing the grand final by one point was the nadir of the club’s season.","From Arabic nazir, “opposite”, originally the point in the sky directly opposite the zenith."],["Algorithm","AL-guh-rith-um","noun","A set of step-by-step rules for solving a problem, especially by a computer.","The app’s algorithm learns what you like and shows you more of it.","From the name of al-Khwarizmi, a 9th-century Persian mathematician in Baghdad whose name was Latinised as Algoritmi."],["Palimpsest","PAL-imp-sest","noun","Something reused or altered but still bearing visible traces of its earlier form.","The old city is a palimpsest, with colonial buildings layered over far older streets.","From Greek palimpsestos, “scraped again”, describing parchment scraped clean so it could be written on once more."],["Apophenia","ap-oh-FEE-nee-uh","noun","The tendency to see meaningful patterns or connections in random information.","Believing your lucky socks win matches is a textbook case of apophenia.","Coined in 1958 by German psychiatrist Klaus Conrad, from Greek roots meaning “to make visible”."],["Pareidolia","pair-eye-DOH-lee-uh","noun","Seeing faces or familiar shapes in random things, like clouds or power sockets.","Thanks to pareidolia, the front of every car seems to have a facial expression.","From Greek para “beside” or “faulty” and eidolon “image” or “form”."],["Mudita","MOO-di-tuh","noun","Joy felt at another person’s good fortune; the opposite of envy.","Instead of envy, she felt mudita when her friend got the promotion.","A Pali and Sanskrit word meaning “joy”, one of the four virtues cultivated in Buddhist meditation."],["Phronesis","froh-NEE-sis","noun","Practical wisdom: knowing how to act well in real situations.","Rules only get you so far; phronesis is knowing when to bend them.","Greek for “practical wisdom”, a central virtue in Aristotle’s Nicomachean Ethics."],["Verisimilitude","ve-ri-si-MIL-i-tyood","noun","The appearance of being true or real.","The novel’s verisimilitude came from years the author spent working in hospitals.","From Latin verisimilitudo, from verus “true” and similis “like”."],["Garrulous","GARE-uh-lus","adjective","Excessively talkative, especially about trivial things.","The garrulous taxi driver told us his entire life story before we reached the airport.","From Latin garrulus, from garrire, “to chatter”."],["Taciturn","TAS-i-turn","adjective","Saying very little; reserved in speech.","My taciturn uncle speaks rarely, but when he does, everyone listens.","From Latin taciturnus, from tacere, “to be silent”."],["Nonchalant","NON-shuh-lunt","adjective","Appearing relaxed and unconcerned.","She was nonchalant about the job interview, but she had prepared for days.","From Old French nonchaloir, “to not be concerned”, ultimately from Latin calere, “to be warm”, so literally “not getting heated”."],["Panacea","pan-uh-SEE-uh","noun","A solution or remedy for all problems or diseases.","A new app is not a panacea for a disorganised team.","From Panacea, the Greek goddess of universal remedy, from pan “all” and akos “cure”."],["Gerrymander","JERR-ee-man-der","verb","To manipulate electoral boundaries to favour one party.","Independent commissions help stop politicians from gerrymandering their seats.","From Elbridge Gerry, governor of Massachusetts in 1812, whose party drew a district that critics said looked like a salamander."],["Kerfuffle","ker-FUF-ul","noun","A commotion or fuss, especially over something minor.","There was quite a kerfuffle over who had eaten the last Tim Tam.","From Scots curfuffle, based on fuffle, “to throw into disorder”."],["Esprit de l’escalier","es-PREE duh les-kal-YAY","noun","Thinking of the perfect reply only after the moment has passed.","Hours after the argument, esprit de l’escalier struck and I finally knew what to say.","French for “staircase wit”, from Denis Diderot, who described being unable to reply in company and thinking of the answer only at the bottom of the stairs."],["Hobson’s choice","HOB-sunz CHOICE","noun","A choice that is really no choice at all: take what is offered or nothing.","With one flight left that day, it was Hobson’s choice.","From Thomas Hobson, a 17th-century Cambridge stable owner who made customers take the horse nearest the door or none at all."],["Mnemonic","nuh-MON-ik","noun","A pattern, phrase or rhyme that helps you remember something.","“Never Eat Soggy Weet-Bix” is a classic mnemonic for the compass points.","From Greek mnemonikos, “relating to memory”, from mneme “memory”; Mnemosyne was the Greek goddess of memory."],["Oxymoron","ok-see-MOR-on","noun","A phrase that combines contradictory terms, such as “deafening silence”.","“Working holiday” sounds like an oxymoron, but it can be the best kind of trip.","From Greek oxys “sharp” and moros “dull” or “foolish”, so the word is itself an oxymoron."],["Epitome","ih-PIT-uh-mee","noun","A perfect example of a quality or type.","The old lighthouse keeper was the epitome of patience.","From Greek epitome, “abridgement”, from epitemnein, “to cut short”; the idea shifted from a summary to something that sums up a quality."],["Gaslight","GAS-lite","verb","To manipulate someone into doubting their own memory, perception or sanity.","He tried to gaslight her into believing she had imagined the conversation.","From Patrick Hamilton’s 1938 play Gas Light, in which a husband’s secret night-time searching makes the gas lamps dim, and he then insists his wife is imagining it."],["Doppelgänger","DOP-ul-gang-er","noun","A person who looks strikingly like someone else; a double.","I met my doppelgänger at the airport and we both did a double take.","German, “double-goer”, coined by the novelist Jean Paul in 1796."],["Stentorian","sten-TOR-ee-un","adjective","Very loud and powerful, especially of a voice.","The coach’s stentorian voice carried across three footy ovals.","From Stentor, a herald in Homer’s Iliad whose voice was as loud as fifty men."],["Mercurial","mer-KYOOR-ee-ul","adjective","Subject to sudden, unpredictable changes of mood.","Working for a mercurial boss means never knowing which version will turn up.","From the planet Mercury: astrologers believed people born under it were quick-witted and changeable."],["Saturnine","SAT-er-nine","adjective","Gloomy, serious and brooding in temperament.","Behind his saturnine expression was a surprisingly dry sense of humour.","From the planet Saturn, which astrologers linked with a cold, gloomy and sluggish temperament."],["Lethargy","LETH-er-jee","noun","A lack of energy and enthusiasm.","A short walk outside is often the best cure for afternoon lethargy.","From Greek lethargia, from lethe “forgetfulness” and argos “idle”; Lethe was the river of forgetting in the Greek underworld."],["Resilience","ri-ZIL-ee-uns","noun","The capacity to recover quickly from difficulties.","Resilience isn’t never falling down; it’s getting back up a little faster each time.","From Latin resilire, “to leap back” or “rebound”."],["Egregious","ih-GREE-jus","adjective","Outstandingly bad; shocking.","Charging $12 for tap water is an egregious rip-off.","From Latin egregius, from e grege, “out of the flock”; it originally meant “outstanding” in a good sense before turning ironic."],["Window","WIN-doh","noun","An opening in a wall, usually fitted with glass, to let in light and air.","Open a window for ten minutes a day to freshen the air in winter.","From Old Norse vindauga, literally “wind eye”, from vindr “wind” and auga “eye”."],["Glamour","GLAM-er","noun","Attractive and exciting qualities that make something seem special.","The glamour of the film industry hides a lot of very long days.","A Scots alteration of “grammar”: learning was linked with the occult, so “glamour” came to mean a magic spell before it meant allure."],["Mortgage","MOR-gij","noun","A loan to buy property, with the property itself as security.","Paying a little extra off the mortgage each month can save years of interest.","From Old French mort gage, “dead pledge”, because the agreement dies either when the debt is paid or when payment fails and the property is lost."],["Gossip","GOS-ip","noun","Casual talk about other people’s private lives.","A good rule: if you wouldn’t say it in front of them, it’s probably gossip.","From Old English godsibb, “godparent”; it came to mean a close friend, then someone who chatters, then the chatter itself."],["Ultracrepidarian","ul-truh-krep-i-DAIR-ee-un","noun","Someone who gives opinions on matters beyond their knowledge or expertise.","Social media is full of ultracrepidarians who became experts overnight.","From Latin ultra crepidam, “beyond the sandal”, after the painter Apelles told a cobbler not to judge above the shoe; popularised by essayist William Hazlitt in 1819."],["Pandiculation","pan-dik-yoo-LAY-shun","noun","The act of stretching and yawning at the same time, especially on waking.","The cat’s long morning pandiculation was a masterclass in not rushing.","From Latin pandiculari, “to stretch oneself”."]];
