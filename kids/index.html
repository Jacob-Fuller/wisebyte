 {"id":"electricity","title":"Zap! What is electricity?","tag":"Science","d":2,"cards":["Everything is made of tiny bits called atoms. Atoms have even tinier bits inside them called electrons.","Electricity is electrons on the move! When they flow along a wire, we call it an electric current.","Electricity needs a complete loop to flow, called a circuit. Flick a switch off, the loop breaks, and the light goes out!","Metals like copper let electricity flow easily, so they're used for wires. Plastic and rubber don't, so they wrap around wires to keep us safe.","Lightning is giant, natural electricity. Electricity from power points is strong enough to hurt you, so never play with them."],"qs":[{"q":"What does electricity need so it can flow all the way around?","o":["A complete loop called a circuit","A bucket of water","A big warm hug"],"e":"If the loop is broken, the electricity stops flowing."},{"q":"Why are wires wrapped in plastic?","o":["Plastic doesn't let electricity flow, so it keeps us safe","Plastic makes electricity go faster","So the wires look like spaghetti"],"e":"Plastic stops electricity escaping from the wire."}]},
 {"id":"light","title":"Speedy light","tag":"Science","d":1,"cards":["Light is the fastest thing there is. It zooms about 300,000 kilometres every second!","Even so, the Sun is so far away that its light takes about 8 minutes to reach us.","Light travels in straight lines. That's why you can't see around corners.","When light hits a mirror, it bounces off. That's how you can see yourself!","We see things when light bounces off them and into our eyes. In a totally dark room, you can't see anything at all."],"qs":[{"q":"About how long does sunlight take to reach Earth?","o":["About 8 minutes","About 8 years","A whole week, with a lunch stop"],"e":"Light is super fast, but the Sun is very far away."},{"q":"What does light do when it hits a mirror?","o":["It bounces off","It disappears forever","It turns into a sandwich"],"e":"Light bouncing off a mirror lets you see your reflection."}]},
 {"id":"friction","title":"Friction: the grippy force","tag":"Science","d":2,"cards":["Friction is a force that happens when two surfaces rub against each other. It slows moving things down.","Rough surfaces, like carpet or sandpaper, make lots of friction. Smooth, slippery ones, like ice, make very little.","That's why it's easy to slide across ice but hard to slide across grass.","Friction also makes heat. Rub your hands together quickly and feel them warm up!","Shoes have bumpy soles and tyres have grooves to give extra grip, so we don't slip and slide."],"qs":[{"q":"Why do your hands get warm when you rub them together?","o":["Friction makes heat","The wind blows on them","Your hands are clapping for you"],"e":"Rubbing surfaces together makes heat."},{"q":"Which surface has the least friction?","o":["Ice","Carpet","A hedgehog's back"],"e":"Ice is smooth and slippery, so things slide easily on it."}]},
 {"id":"butterfly","title":"From caterpillar to butterfly","tag":"Animals","d":1,"cards":["Every butterfly starts life as a tiny egg, laid on a leaf.","Out hatches a caterpillar, and its big job is to eat! It grows so fast that it sheds its skin several times.","Next, it makes a hard case around itself called a chrysalis.","Inside, its whole body changes. This amazing change is called metamorphosis.","At last a butterfly climbs out, pumps up its wings and flies away. Butterflies can even taste with their feet!"],"qs":[{"q":"What is the hard case a caterpillar makes called?","o":["A chrysalis","A nest","A sleeping bag"],"e":"Inside the chrysalis, the caterpillar turns into a butterfly."},{"q":"What can butterflies taste with?","o":["Their feet","Their wings","Their knees"],"e":"Butterflies have tasters on their feet."}]},
 {"id":"owls","title":"Owls: night-time hunters","tag":"Animals","d":1,"cards":["Most owls hunt at night. Their huge eyes help them see in the dark.","An owl can't move its eyes around like you can. Instead, it turns its whole head, up to about three-quarters of the way round!","Owls have amazing hearing. Some can find a mouse hidden under snow just by listening.","Their feathers have soft, fluffy edges, so owls can fly almost silently.","Australia has owls too, like the little southern boobook, whose call sounds like \"boo-book!\""],"qs":[{"q":"Why does an owl turn its whole head to look around?","o":["Its eyes can't move around","It feels dizzy","It's looking for its hat"],"e":"An owl's eyes stay still, so it turns its head instead."},{"q":"How can owls fly so quietly?","o":["They have soft-edged feathers","They hold their breath","They wear slippers"],"e":"Soft feather edges hush the sound of their wings."}]},
 {"id":"elephants","title":"Enormous elephants","tag":"Animals","d":1,"cards":["Elephants are the biggest animals that live on land.","An elephant's trunk is its nose and top lip joined together. It uses it to smell, grab food and suck up water to squirt into its mouth.","An elephant's tusks are really giant teeth that keep on growing.","On hot days, elephants flap their big ears to help cool down.","Elephants live in family groups led by the oldest female, called the matriarch."],"qs":[{"q":"What is an elephant's trunk?","o":["Its nose and top lip joined together","A very long tooth","A garden hose"],"e":"The trunk is a super nose that can grab and squirt too."},{"q":"Why do elephants flap their ears?","o":["To cool down","To fly away","To wave hello"],"e":"Flapping their big ears helps elephants stay cool."}]},
 {"id":"bats","title":"Bats: the flying mammals","tag":"Animals","d":2,"cards":["Bats are the only mammals that can truly fly. Their wings are thin skin stretched over long finger bones.","Many small bats hunt in the dark using echolocation. They make high squeaks, then listen for the echoes bouncing back.","Australia has flying-foxes, big bats that feed on fruit and nectar from flowers.","As flying-foxes travel from tree to tree, they spread pollen and seeds, helping forests grow.","Bats rest hanging upside down. Special parts in their feet lock their toes in place, so they can hang without trying."],"qs":[{"q":"What are a bat's wings made of?","o":["Thin skin over long finger bones","Feathers","Paper"],"e":"Bat wings are like stretchy skin over very long fingers."},{"q":"What is echolocation?","o":["Finding things by listening to echoes","Seeing with glowing eyes","Sending text messages"],"e":"Bats squeak and listen to the echoes to find food."}]},
 {"id":"ants","title":"The amazing ant","tag":"Nature","d":1,"cards":["Ants live together in big groups called colonies. Some colonies have millions of ants!","Most colonies have a queen. Her job is to lay the eggs.","The worker ants are all girls. They find food, look after the babies and build the nest.","Ants leave a smelly trail on the ground so other ants can follow it to food.","Ants are super strong for their size. Some can carry things many times heavier than themselves!"],"qs":[{"q":"What is the queen ant's job?","o":["To lay the eggs","To build the nest","To wear a tiny crown"],"e":"The queen lays eggs, and the workers do the other jobs."},{"q":"How do ants find the way to food?","o":["They follow smelly trails","They listen for music","They use a tiny map"],"e":"Ants leave scent trails for others to follow."}]},
 {"id":"fungi","title":"Mushrooms and fungi","tag":"Nature","d":2,"cards":["Mushrooms aren't plants! They belong to their own group of living things called fungi.","Plants make food from sunlight, but fungi can't. Instead, they feed on things like dead leaves and old wood.","The mushroom you see is only a small part. Underground, thin threads spread through the soil like a hidden web.","Fungi break down dead things and turn them back into soil, helping new plants grow. The yeast that makes bread rise is a fungus too!","Never touch or eat wild mushrooms. Some are very poisonous, so only eat mushrooms from the shop."],"qs":[{"q":"Why aren't fungi plants?","o":["They can't make food from sunlight","They are too small","They tell too many jokes"],"e":"Fungi get their food from other things, not sunlight."},{"q":"What do fungi do with dead leaves and wood?","o":["Break them down into soil","Turn them into rocks","Knit them into jumpers"],"e":"Fungi are nature's recyclers."}]},
 {"id":"trees","title":"How do trees drink?","tag":"Nature","d":2,"cards":["Trees drink through their roots, which spread out underground to soak up water.","The water travels up the trunk through tiny tubes, all the way to the very top leaves.","Leaves have tiny holes that let water escape into the air. As water leaves, more is pulled up from below, a bit like sipping through a straw!","Many trees grow one new ring inside their trunk each year, so counting the rings can tell you a tree's age.","Australia's mountain ash is the tallest flowering plant in the world. It can grow up to about 100 metres tall!"],"qs":[{"q":"Which part of a tree soaks up water?","o":["The roots","The flowers","Its pockets"],"e":"Roots soak up water from the soil."},{"q":"How can you work out how old many trees are?","o":["Count the rings in the trunk","Count the leaves","Ask it nicely"],"e":"Many trees add one ring each year."}]},
 {"id":"snails","title":"Slow and steady snails","tag":"Nature","d":1,"cards":["A snail carries its home on its back: a hard, curly shell.","The shell is part of the snail's body, and it grows bigger as the snail grows.","Snails glide along on one big foot, making slippery slime to help them move.","Garden snails have two pairs of feelers. Their eyes are on the tips of the longer ones!","Snails love damp weather. On dry days, they hide in their shells and seal the door with a layer of dried slime."],"qs":[{"q":"Where are a garden snail's eyes?","o":["On the tips of its long feelers","On its shell","On its toes"],"e":"The longer feelers have eyes on the ends."},{"q":"What does a snail's slime help it do?","o":["Glide along","Make its shell shiny","Blow bubbles"],"e":"Slime helps a snail's foot slide smoothly."}]},
 {"id":"eclipses","title":"Eclipses: when shadows cover the sky","tag":"Space","d":2,"cards":["An eclipse happens when one object in space blocks the light from another.","In a solar eclipse, the Moon passes between the Sun and Earth and blocks the Sun's light.","The Sun is about 400 times wider than the Moon, but also about 400 times further away. So they look almost the same size in our sky!","In a lunar eclipse, Earth's shadow falls on the Moon. The Moon can turn a coppery red colour!","Never look straight at the Sun, even during an eclipse. People use special safe eclipse glasses to watch."],"qs":[{"q":"What blocks the Sun in a solar eclipse?","o":["The Moon","A cloud","A giant bird"],"e":"The Moon moves between the Sun and Earth."},{"q":"What colour can the Moon turn in a lunar eclipse?","o":["Coppery red","Bright green","Purple with spots"],"e":"Earth's shadow can make the Moon glow red."}]},
 {"id":"blackholes","title":"Black holes","tag":"Space","d":2,"cards":["A black hole is a place in space where gravity pulls so strongly that nothing can escape, not even light!","Because no light gets out, black holes are invisible. Scientists find them by watching how stars and gas move nearby.","Some black holes form when a giant star runs out of fuel and collapses.","There's a huge black hole at the centre of our galaxy, the Milky Way. It's very, very far away, so it can't hurt us.","In 2019, scientists shared the first ever picture of a black hole's shadow, surrounded by a ring of glowing gas."],"qs":[{"q":"Why can't we see black holes?","o":["No light can escape from them","They are too tiny","They're hiding under the bed"],"e":"Their gravity is so strong that even light is trapped."},{"q":"How can some black holes form?","o":["A giant star collapses","Two moons crash together","A planet sneezes"],"e":"When a giant star runs out of fuel, it can collapse into a black hole."}]},
 {"id":"telescopes","title":"Looking far with telescopes","tag":"Space","d":1,"cards":["A telescope helps us see things that are very far away, like the Moon, planets and stars.","It uses lenses or mirrors to collect lots of light, making faint things look brighter and bigger.","About 400 years ago, a scientist named Galileo pointed a telescope at Jupiter and spotted four of its moons!","Some telescopes are sent into space, above our wobbly air, to take super clear pictures.","Radio telescopes, like the big dish at Parkes in New South Wales, listen for radio waves from space instead of looking at light."],"qs":[{"q":"What did Galileo spot near Jupiter?","o":["Four of its moons","A second Sun","A giant space cat"],"e":"Galileo was one of the first to see Jupiter's moons."},{"q":"Why are some telescopes sent into space?","o":["To get above our wobbly air","To be closer to the Sun","So they can go on holiday"],"e":"Above the air, pictures are much clearer."}]},
 {"id":"saturn","title":"Saturn's amazing rings","tag":"Space","d":1,"cards":["Saturn is the sixth planet from the Sun and the second biggest planet of all.","Its famous rings are made of billions of chunks of ice and rock. Some are as small as dust, and some are as big as a house!","Saturn is a giant ball of gas, so there's no solid ground to stand on.","Saturn is so light for its size that it would float in water, if you could find a bathtub big enough!","Saturn has lots of moons. Scientists have found well over 100 of them!"],"qs":[{"q":"What are Saturn's rings made of?","o":["Chunks of ice and rock","Rainbows","Spaghetti"],"e":"Billions of icy, rocky pieces circle Saturn."},{"q":"What would Saturn do in a giant bathtub of water?","o":["Float","Sink","Pull out the plug"],"e":"Saturn is so light for its size that it would float."}]},
 {"id":"caves","title":"The secret world of caves","tag":"Earth","d":2,"cards":["Many caves are made by water. Rainwater soaks into a rock called limestone and slowly dissolves it, carving tunnels over thousands of years.","Dripping water leaves behind tiny bits of rock. Over time these build up into stone icicles hanging from the roof, called stalactites.","Pointy rocks that grow up from the floor are called stalagmites. When a stalactite and stalagmite meet, they make a column.","Here's a trick: stalaCtites hang from the Ceiling, and stalaGmites grow from the Ground.","Some Australian caves are home to glow-worms, tiny insect young that light up the ceiling like stars."],"qs":[{"q":"What are the stone icicles hanging from a cave roof called?","o":["Stalactites","Stalagmites","Cave-sicles"],"e":"StalaCtites hang from the Ceiling."},{"q":"What carves out many caves?","o":["Water dissolving limestone","Strong winds","Giant moles digging"],"e":"Water slowly dissolves the rock over thousands of years."}]},
 {"id":"tides","title":"Why does the sea go in and out?","tag":"Earth","d":2,"cards":["At the beach, the sea slowly creeps up the sand, then slides away again. These changes are called tides.","Tides are mostly caused by the Moon. Its gravity gently pulls on Earth's oceans, making the water bulge.","As Earth spins, many beaches get two high tides and two low tides each day.","The Sun pulls on the oceans too. When the Sun and Moon line up, we get extra big tides.","In the Kimberley in Western Australia, the sea can rise and fall by more than 10 metres. That's some of the biggest tides in the world!"],"qs":[{"q":"What mostly causes the tides?","o":["The Moon's gravity","The wind","Whales splashing"],"e":"The Moon's pull makes the oceans bulge."},{"q":"How many high tides do many beaches get each day?","o":["Two","Ten","One hundred"],"e":"Many beaches have two high and two low tides a day."}]},
 {"id":"mountains","title":"How mountains grow","tag":"Earth","d":1,"cards":["Earth's outside is cracked into giant pieces called plates, which move very, very slowly.","When two plates push together, the land crumples and rises up, making mountains.","The Himalaya mountains are still growing a tiny bit taller every year!","The tallest mountain on land is Mount Everest, about 8,800 metres high.","Australia's tallest mountain is Mount Kosciuszko, about 2,200 metres high. Our mountains are very old, and wind and rain have worn them down."],"qs":[{"q":"What is the tallest mountain on land?","o":["Mount Everest","Mount Kosciuszko","A big pile of pillows"],"e":"Mount Everest is about 8,800 metres high."},{"q":"What makes many mountains?","o":["Plates pushing together","Rain falling from clouds","Giants stacking rocks"],"e":"When plates push together, the land crumples up."}]},
 {"id":"deserts","title":"Deserts: the dry lands","tag":"Earth","d":1,"cards":["A desert is a place that gets very little rain. Deserts aren't always hot!","Not all deserts are sandy. Many are covered in rocks, stones and gravel.","The Sahara in Africa is the biggest hot desert in the world.","Deserts can be very hot during the day but chilly at night, because there are few clouds to hold in the warmth.","Desert animals have clever tricks. Camels can go a long time without a drink, and their humps store fat, not water."],"qs":[{"q":"What makes a place a desert?","o":["It gets very little rain","It has lots of sand","It has lots of camels"],"e":"Deserts are dry places. Many aren't sandy at all."},{"q":"What does a camel's hump store?","o":["Fat","Water","Snacks for later"],"e":"The hump stores fat, not water."}]},
 {"id":"muscles","title":"Your mighty muscles","tag":"Your body","d":2,"cards":["You have more than 600 muscles in your body! They help you move, smile and even blink.","Muscles can only pull, never push. So they often work in pairs, one pulling a bone one way and the other pulling it back.","Bend your arm, and the muscle at the front pulls. Straighten it, and the muscle at the back pulls.","Your heart is a muscle too, and it never takes a break.","Your biggest muscle is in your bottom! Moving and playing helps all your muscles grow stronger."],"qs":[{"q":"What can muscles do?","o":["Only pull","Only push","Only move on Tuesdays"],"e":"Muscles pull, so they work in pairs."},{"q":"Where is your biggest muscle?","o":["In your bottom","In your little finger","In your ear"],"e":"Your bottom muscle is the biggest in your body."}]},
 {"id":"skin","title":"Your super skin","tag":"Your body","d":1,"cards":["Your skin is your body's biggest organ. It covers you from head to toe!","Skin is like a waterproof coat. It keeps water in and helps keep germs out.","When you get hot, you sweat. As the sweat dries on your skin, it cools you down.","Your skin is full of tiny sensors that feel touch, heat and cold.","Old skin flakes off all the time, and new skin grows underneath. A hat and sunscreen help protect it from the strong Aussie sun."],"qs":[{"q":"What is your body's biggest organ?","o":["Your skin","Your brain","Your belly button"],"e":"Skin covers your whole body."},{"q":"How does sweat help you?","o":["It cools you down as it dries","It makes you warmer","It makes you smell like roses"],"e":"Drying sweat takes heat away from your body."}]},
 {"id":"germs","title":"Germs: tiny invaders","tag":"Your body","d":1,"cards":["Germs are tiny living things, far too small to see without a microscope.","Some germs, like certain bacteria and viruses, can make us sick with things like colds.","But lots of bacteria are helpful! Good bacteria in your tummy help you digest your food.","Washing your hands with soap and water is one of the best ways to stop germs spreading. Scrub for about 20 seconds.","Cough or sneeze into your elbow, so germs don't fly onto other people."],"qs":[{"q":"What's one of the best ways to stop germs spreading?","o":["Wash your hands with soap and water","Blow on your hands","Wear a superhero cape"],"e":"Soap and a good scrub wash germs away."},{"q":"Are all bacteria bad for you?","o":["No, some are helpful","Yes, every single one","They're all just purple"],"e":"Good bacteria help you digest food."}]},
 {"id":"nose","title":"Your super sniffer","tag":"Your body","d":2,"cards":["Your nose can tell apart a huge number of different smells, from fresh bread to rain on a hot day.","Smells are made of tiny particles floating in the air. When you sniff, they're pulled up into your nose.","High inside your nose, special cells pick up those particles and send messages to your brain.","Smell and taste work as a team. That's why food tastes boring when your nose is blocked by a cold.","Your nose also warms the air you breathe, and its little hairs and sticky snot trap dust and germs."],"qs":[{"q":"Why does food taste boring when your nose is blocked?","o":["Smell and taste work as a team","Your tongue stops working","The food is feeling shy"],"e":"Much of what we call taste actually comes from smell."},{"q":"How does your nose deal with dust?","o":["Little hairs and snot trap it","It turns it into smells","It sends it to your toes"],"e":"Nose hairs and sticky snot catch dust and germs."}]},
 {"id":"vikings","title":"The Vikings","tag":"History","d":2,"cards":["The Vikings came from the lands we now call Norway, Sweden and Denmark, over 1,000 years ago.","They were brilliant sailors who built long, narrow wooden boats called longships. These could sail across seas and up shallow rivers.","Many Vikings were farmers, traders and craftspeople who made jewellery, tools and beautiful wood carvings.","Vikings didn't really wear helmets with horns! That idea came from costumes made hundreds of years later.","Viking explorers reached North America about 1,000 years ago, almost 500 years before Christopher Columbus crossed the Atlantic."],"qs":[{"q":"What were Viking boats called?","o":["Longships","Steamships","Pirate bathtubs"],"e":"Longships were long, narrow wooden boats."},{"q":"Did Vikings wear helmets with horns?","o":["No, that idea came much later","Yes, all the time","Only on their birthdays"],"e":"Horned helmets came from costumes made much later."}]},
 {"id":"wheel","title":"The wonderful wheel","tag":"History","d":1,"cards":["The wheel is one of the most important inventions ever, but for a very long time, people lived without it.","The oldest wheels we know about were made more than 5,000 years ago.","Some of the first wheels were used to make clay pots, spinning around as the potter shaped them.","Early wheels were solid circles of wood. Later, people invented spokes, which made wheels much lighter and faster.","Today wheels are everywhere, on bikes, cars, trains, prams and skateboards!"],"qs":[{"q":"What were early wheels made of?","o":["Solid wood","Rubber","Cheese"],"e":"The first wheels were solid wooden circles."},{"q":"What made wheels lighter and faster?","o":["Spokes","Paint","Glitter"],"e":"Spokes took away lots of heavy wood."}]},
 {"id":"printing","title":"The printing press","tag":"History","d":2,"cards":["Long ago in Europe, books were copied out by hand, one letter at a time. Making just one book could take months!","Around 1450, a German inventor named Johannes Gutenberg built a printing press with movable metal letters.","Each letter was a little block. They could be arranged into words, inked, pressed onto paper, then used again and again.","Suddenly books could be made much faster and cheaper, so many more people could learn to read.","People in China were printing even earlier, using carved wooden blocks more than 1,000 years ago."],"qs":[{"q":"How were books made in Europe before the printing press?","o":["Copied out by hand","Printed by computers","Written by clever parrots"],"e":"Every letter had to be written by hand."},{"q":"What was special about Gutenberg's metal letters?","o":["They could be moved and used again","They glowed in the dark","They were made of chocolate"],"e":"Movable letters could be arranged into any words."}]},
 {"id":"cassowary","title":"The colourful cassowary","tag":"Australia","d":1,"cards":["The cassowary is a huge bird that lives in the rainforests of far north Queensland. It can't fly.","It has a bright blue neck and a tall helmet on its head called a casque.","Cassowaries eat lots of rainforest fruit, then spread the seeds in their poo. This helps new trees grow!","The cassowary dad looks after the eggs and the stripy chicks, all by himself.","Cassowaries have very strong legs, so they're best admired from a safe distance. Never go close or feed them."],"qs":[{"q":"Who looks after cassowary eggs and chicks?","o":["The dad","The mum","A kookaburra"],"e":"Cassowary dads do all the babysitting."},{"q":"What is the helmet on a cassowary's head called?","o":["A casque","A crown","A bike helmet"],"e":"The tall helmet is called a casque."}]},
 {"id":"kookaburra","title":"The laughing kookaburra","tag":"Australia","d":1,"cards":["The laughing kookaburra is famous for its call, which sounds like loud laughter ringing through the bush.","The laughing kookaburra is the biggest bird in the kingfisher family.","But they don't mostly eat fish! They catch insects, worms, lizards and even small snakes.","Kookaburra families often laugh together at dawn and dusk, telling other kookaburras, \"This is our patch!\"","Families help each other. Older young birds often stay at home to help raise the new chicks."],"qs":[{"q":"What does a kookaburra's call sound like?","o":["Laughter","A dog barking","A doorbell"],"e":"That's why it's called the laughing kookaburra."},{"q":"Why do kookaburra families laugh together?","o":["To say \"This is our patch!\"","To call for rain","Because they told a joke"],"e":"Their laughing chorus marks out their home area."}]},
 {"id":"tasdevil","title":"The Tasmanian devil","tag":"Australia","d":2,"cards":["The Tasmanian devil is the biggest meat-eating marsupial in the world, and it's found mainly in Tasmania.","Early European settlers named it after hearing its spooky screeches and growls in the night.","Devils have super strong jaws. As well as hunting, they eat lots of animals that have already died, helping keep the bush clean.","A devil stores fat in its tail. A nice chubby tail usually means a healthy devil!","Mother devils carry their tiny babies, called joeys, in a pouch. Scientists and wildlife parks are working hard to protect them."],"qs":[{"q":"Where are Tasmanian devils mainly found?","o":["Tasmania","Western Australia","The Moon"],"e":"That's where their name comes from."},{"q":"How did the Tasmanian devil get its name?","o":["Settlers heard its spooky screeches","It has little horns","It tells fibs"],"e":"Their night-time noises sounded spooky to early settlers."}]},
 {"id":"emusky","title":"The Emu in the Sky","tag":"Australia","d":2,"cards":["For many thousands of years, Aboriginal and Torres Strait Islander peoples have studied the night sky, using the stars to tell stories, find their way and know the seasons.","Many star pictures are made by joining up bright stars. But the Emu in the Sky is made from the dark patches in the Milky Way!","The emu's head is a dark patch near the Southern Cross, and its long neck and body stretch out along the Milky Way.","Through the year, the emu seems to change position in the evening sky. For some Aboriginal groups, this shows when real emus are laying their eggs.","Different communities have their own stories about the sky. Elders pass this knowledge on through stories, songs and dance."],"qs":[{"q":"What is the Emu in the Sky made of?","o":["Dark patches in the Milky Way","Bright planets","Feathers stuck on the sky"],"e":"The emu shape is made by the dark dust clouds of the Milky Way."},{"q":"What can the emu's position in the sky tell some Aboriginal groups?","o":["When emus are laying eggs","When it will snow","When it's time for bed"],"e":"The sky works like a calendar for the seasons."}]}
]);
LIFE.push(...[
 {"id":"goal","title":"Saving for a goal","tag":"Money","d":1,"cards":["A savings goal is something special you want that costs more than you have right now.","First, find out how much it costs. Then you know how much you need to save.","Draw a picture of your goal and stick it on your money jar. It helps you remember why you're saving!","Each time you add money, colour in part of a chart so you can see how close you are.","Saving takes patience, but reaching your goal feels amazing."],"qs":[{"q":"What should you find out first when saving for a goal?","o":["How much it costs","What colour the jar is","How to spend it all today"],"e":"Knowing the price tells you how much to save."},{"q":"How can a chart help with saving?","o":["It shows how close you are","It makes money appear","It eats your coins"],"e":"Colouring in a chart lets you see your progress."}]},
 {"id":"change","title":"Getting your change","tag":"Money","d":2,"cards":["When you pay with more money than something costs, the shop gives you some back. That's called change.","If a snack costs $3 and you pay with a $5 note, you should get $2 change.","A handy trick is to count up from the price: $3, then $4, then $5. That's $2!","Always wait for your change and your receipt before you walk away.","Counting your change is smart, and it's okay to politely ask if something seems wrong."],"qs":[{"q":"A drink costs $2 and you pay with a $5 note. How much change?","o":["$3","$7","A free lollipop tree"],"e":"Count up from $2 to $5: that's $3."},{"q":"What is change?","o":["Money the shop gives back","A new haircut","The price tag"],"e":"Change is the money you get back when you pay extra."}]},
 {"id":"giving","title":"Sharing what you have","tag":"Money","d":2,"cards":["Giving means using some of your money, time or things to help others.","Remember the Share jar? It's for putting a little money aside to help someone else.","You could give to a group that helps animals, people in need or the environment. Choose one with a grown-up.","You don't need money to give. You can donate toys you've outgrown or help a neighbour.","Giving helps others feel cared for, and it gives you a warm, happy feeling too."],"qs":[{"q":"What is the Share jar for?","o":["Money to help others","Money for lollies only","Keeping spiders"],"e":"The Share jar holds money set aside for giving."},{"q":"Which is a way to give without money?","o":["Donating toys you've outgrown","Keeping everything forever","Hiding your toys"],"e":"Giving can be your time, help or things, not just money."}]},
 {"id":"brave","title":"Trying new things","tag":"Feelings","d":1,"cards":["Trying something new can make your tummy feel wobbly. That's normal!","Being brave doesn't mean you're not scared. It means you give it a go anyway.","Take a big breath and try a small step first, like dipping one toe in.","If it doesn't go well the first time, that's okay. Everyone starts as a beginner.","You might just discover your new favourite thing!"],"qs":[{"q":"What does being brave mean?","o":["Trying even when you feel scared","Never feeling scared","Running away"],"e":"Brave people feel scared too, but they give it a go."},{"q":"What's a good way to start something new?","o":["Try a small step first","Give up straight away","Close your eyes forever"],"e":"Small steps make big things easier."}]},
 {"id":"bored","title":"Beating boredom","tag":"Feelings","d":1,"cards":["Everyone feels bored sometimes. Boredom can actually help your imagination wake up!","Try making a boredom jar with lots of fun ideas written on paper. Pull one out when you're stuck.","You could build a cubby, draw a comic, read a book or invent a new game.","Getting outside helps too. Look for bugs, clouds or birds.","Being bored for a little while is okay. Great ideas often start there."],"qs":[{"q":"What goes in a boredom jar?","o":["Fun ideas on paper","Your dinner","Rain"],"e":"Pull out an idea whenever you feel stuck."},{"q":"What can boredom help wake up?","o":["Your imagination","Your socks","The neighbour's cat"],"e":"Boredom can spark creative ideas."}]},
 {"id":"thankful","title":"Thankful thinking","tag":"Feelings","d":2,"cards":["Being thankful means noticing the good things in your life, big and small.","It could be a sunny day, a yummy dinner or a friend who made you laugh.","Try thinking of three good things before bed. It's called 'three good things'.","Saying thank you to people, or writing them a note, makes them feel appreciated.","Thankful thinking can help you feel calmer and happier, even on tricky days."],"qs":[{"q":"What does being thankful mean?","o":["Noticing the good things","Only noticing bad things","Wanting more stuff"],"e":"Thankfulness is spotting the good, big and small."},{"q":"What is the 'three good things' idea?","o":["Thinking of three good things before bed","Eating three dinners","Counting three sheep"],"e":"Remembering three good things helps you feel happier."}]},
 {"id":"newfriend","title":"Making new friends","tag":"Feelings","d":2,"cards":["Making new friends can feel tricky, but lots of other kids want a new friend too.","Start with a smile and say hello. Then tell them your name and ask theirs.","Ask a question like 'What's your favourite game?' People love talking about what they enjoy.","Look for things you both like. Maybe you both love drawing, footy or dinosaurs!","Friendships grow slowly, like plants. Keep being kind and friendly, and they'll bloom."],"qs":[{"q":"What's a good way to start making a friend?","o":["Smile and say hello","Stare at them silently","Hide behind a bin"],"e":"A smile and hello is a great first step."},{"q":"How do friendships grow?","o":["Slowly, with kindness","Overnight by magic","By being bossy"],"e":"Like plants, friendships grow over time."}]},
 {"id":"address","title":"Know your address","tag":"Safety","d":1,"cards":["Your address tells people where you live: your house number, street and suburb.","Practise saying your address out loud with a grown-up until you know it by heart.","It's also smart to learn a grown-up's phone number. Try singing it like a song!","If you ever get lost, you can tell a police officer or shop worker this information.","In a real emergency, call Triple Zero (000). Knowing your address helps help arrive quickly."],"qs":[{"q":"What is in your address?","o":["House number, street and suburb","Your favourite colour","Your pet's name"],"e":"Your address says exactly where you live."},{"q":"What's a fun way to remember a phone number?","o":["Sing it like a song","Write it on a cloud","Forget it"],"e":"Songs help numbers stick in your brain."}]},
 {"id":"stormsafe","title":"Staying safe in storms","tag":"Safety","d":2,"cards":["Storms can bring strong wind, heavy rain, thunder and lightning.","If you hear thunder, head inside with a grown-up. Lightning can be close even if the storm seems far away.","Stay away from windows and stay inside until a grown-up says the storm has passed.","Never play in floodwater or near drains. Remember: if it's flooded, forget it!","Storms can feel noisy, so cuddle up with a book and a grown-up. They'll keep you safe."],"qs":[{"q":"You hear thunder while playing outside. What should you do?","o":["Go inside with a grown-up","Climb a tall tree","Fly a kite"],"e":"Thunder means it's time to head indoors."},{"q":"What's the rule about floodwater?","o":["If it's flooded, forget it","Jump in for a swim","Sail a boat in it"],"e":"Floodwater can be deep and fast, so stay away."}]},
 {"id":"safepeople","title":"My safe grown-ups","tag":"Safety","d":2,"cards":["Safe grown-ups are people you trust, like family, teachers or a close family friend.","Try counting five safe grown-ups on one hand. These are the people you can go to for help.","If something makes you feel worried, uncomfortable or unsure, tell one of your safe grown-ups.","It's okay to say 'No!' if something doesn't feel right, even to a grown-up. Then go and tell someone.","If one grown-up doesn't listen, keep telling others on your hand until someone helps."],"qs":[{"q":"Something makes you feel uncomfortable. What should you do?","o":["Tell a safe grown-up","Keep it to yourself","Tell your teddy only"],"e":"Your safe grown-ups are there to help."},{"q":"What if the first grown-up doesn't listen?","o":["Keep telling others until someone helps","Give up","Never speak again"],"e":"Keep going through your helping hand."}]},
 {"id":"lunchbox","title":"Packing a healthy lunch box","tag":"Healthy me","d":1,"cards":["A healthy lunch box gives you energy to learn and play all day.","Try to pack some veggies or fruit, like carrot sticks, grapes or an apple.","Add something filling, like a wholemeal sandwich, wrap or rice.","Cheese, yoghurt or eggs help your bones and muscles grow strong.","Don't forget a water bottle! Sometimes-foods like lollies are best kept for special days."],"qs":[{"q":"What's a great thing to pack in your lunch box?","o":["Carrot sticks or fruit","Only lollies","A bag of rocks"],"e":"Fruit and veggies give you goodness and energy."},{"q":"What's the best drink to pack?","o":["Water","Fizzy drink","Maple syrup"],"e":"Water keeps you going all day."}]},
 {"id":"bedtime","title":"Winding down for bed","tag":"Healthy me","d":1,"cards":["Sleep helps your body grow and your brain get ready for a new day.","About an hour before bed, turn off screens. Their light can trick your brain into staying awake.","Do calm things instead, like a warm bath, a story or quiet drawing.","Try going to bed at the same time each night. Your body loves a routine!","Snuggle in, take slow breaths, and let your body feel heavy and relaxed."],"qs":[{"q":"Why turn off screens before bed?","o":["Their light can keep your brain awake","They get sleepy too","So they can play alone"],"e":"Screen light can make it harder to fall asleep."},{"q":"What's a calm thing to do before bed?","o":["Read a story","Jump on the trampoline","Eat a bag of lollies"],"e":"Quiet activities help your body wind down."}]},
 {"id":"checkup","title":"Visiting the doctor and dentist","tag":"Healthy me","d":2,"cards":["Doctors and dentists are helpers whose job is to keep your body and teeth healthy.","A doctor might listen to your heart with a stethoscope or check how much you've grown.","A dentist counts and checks your teeth with a tiny mirror to make sure they're strong.","It's okay to feel nervous. You can ask questions and hold a grown-up's hand.","Only take medicine when a trusted grown-up gives it to you."],"qs":[{"q":"What does a dentist use to look at your teeth?","o":["A tiny mirror","A telescope","A fishing rod"],"e":"A small mirror helps the dentist see every tooth."},{"q":"Who should give you medicine?","o":["A trusted grown-up","A friend at school","Nobody, just help yourself"],"e":"Medicine should only come from a trusted grown-up."}]},
 {"id":"bedroom","title":"Tidying your room","tag":"Everyday","d":1,"cards":["A tidy room makes it easier to find your things and gives you more space to play.","Start by making your bed. Pull up the sheets, fluff your pillow and you're done!","Give everything a home: books on the shelf, toys in tubs and dirty clothes in the basket.","Try a speedy tidy-up race. Put on a song and see how much you can put away before it ends!","Tidying a little each day is much easier than one giant clean-up."],"qs":[{"q":"Where should dirty clothes go?","o":["In the washing basket","Under the bed","On the dog"],"e":"Dirty clothes belong in the basket."},{"q":"What's a fun way to tidy up?","o":["Race a song","Throw toys out the window","Wait for a robot"],"e":"Tidying to music makes it a game!"}]},
 {"id":"weather","title":"Dressing for the weather","tag":"Everyday","d":1,"cards":["Before you get dressed, check the weather. Look outside or ask a grown-up.","On hot, sunny days, wear light clothes and a hat that shades your face, ears and neck.","On cold days, wear layers like a t-shirt, a jumper and a jacket. You can take one off if you get warm.","When it's raining, a raincoat and closed shoes help keep you dry.","Temperature is measured in degrees Celsius. 30 degrees is hot, and 10 degrees is chilly!"],"qs":[{"q":"Why wear layers on a cold day?","o":["You can take one off if you get warm","Layers are heavy","To look like an onion"],"e":"Layers let you change as the day warms up."},{"q":"Which temperature is hot?","o":["30 degrees","10 degrees","Zero degrees"],"e":"30 degrees Celsius is a hot day."}]},
 {"id":"savewater","title":"Saving water","tag":"Everyday","d":2,"cards":["Australia is a very dry continent, so every drop of water is precious.","Turn off the tap while you brush your teeth. That can save lots of litres a day!","Short showers use much less water than long ones. Try a four-minute song as your shower timer.","Tell a grown-up if you see a dripping tap. Small drips add up to a lot of water.","Leftover water from your drink bottle can go on the garden instead of down the sink."],"qs":[{"q":"What's a way to save water when brushing your teeth?","o":["Turn off the tap","Leave it running","Brush in the bath"],"e":"Turning off the tap saves litres every day."},{"q":"Why is saving water important in Australia?","o":["It's a very dry continent","Water is too wet","Fish need it all"],"e":"Much of Australia is dry, so water is precious."}]},
 {"id":"garden","title":"Growing a garden","tag":"Everyday","d":2,"cards":["You don't need a big yard to garden. A pot on a sunny windowsill or balcony works too.","Easy things to grow include herbs, cherry tomatoes and lettuce.","Plants need sunlight, water and good soil. Poke your finger in the soil: if it's dry, it's time to water.","Wear gloves and wash your hands after gardening. Always ask a grown-up before touching any tools.","Be patient! Seeds take time to sprout, and eating food you've grown tastes extra good."],"qs":[{"q":"How can you tell if a plant needs water?","o":["Feel if the soil is dry","Ask the plant","Wait until it's winter"],"e":"Dry soil means it's time for a drink."},{"q":"What should you do after gardening?","o":["Wash your hands","Eat the dirt","Go straight to bed muddy"],"e":"Clean hands keep germs away."}]},
 {"id":"turns","title":"Sharing and taking turns","tag":"Kindness","d":1,"cards":["Sharing means letting others use something too. Taking turns means everyone gets a go.","If you both want the same toy, you could use a timer. When it beeps, it's the next person's turn.","While you wait, you can cheer your friend on or find something else to do.","Use kind words like 'Can I have a turn when you're finished?'","When everyone gets a turn, games are fairer and much more fun."],"qs":[{"q":"What's a fair way to share one toy?","o":["Use a timer to take turns","Grab it and run","Hide it in the fridge"],"e":"A timer makes sure everyone gets a go."},{"q":"What could you say to ask for a turn?","o":["Can I have a turn when you're finished?","Give it now!","Nothing, just snatch it"],"e":"Polite words help everyone share."}]},
 {"id":"listen","title":"Being a great listener","tag":"Kindness","d":1,"cards":["Good listening shows people you care about what they're saying.","Look at the person who is talking and keep your body still and calm.","Wait until they've finished before you talk. Try not to interrupt.","Nod or ask a question to show you were really listening.","When you listen well, people feel important, and you learn lots of new things."],"qs":[{"q":"What should you do when someone is talking?","o":["Look at them and wait your turn","Talk over them","Walk away"],"e":"Looking and waiting shows you care."},{"q":"How can you show you were listening?","o":["Ask a question about it","Yawn loudly","Start singing"],"e":"A good question shows you heard them."}]},
 {"id":"siblings","title":"Helping with little ones","tag":"Kindness","d":2,"cards":["Younger brothers, sisters and cousins often look up to you and copy what you do.","You can help by reading them a story, playing a gentle game or showing them how to do things.","Little kids are still learning, so be patient if they make mistakes or knock over your tower.","Remember that grown-ups are in charge of keeping little ones safe. If something seems unsafe, call a grown-up straight away.","Being a kind big kid is a special job, and little ones will remember it."],"qs":[{"q":"Your little cousin knocks over your block tower. What's a kind response?","o":["Stay patient and build together","Yell at them","Knock over their stuff"],"e":"Little kids are still learning, so patience helps."},{"q":"Who is in charge of keeping little ones safe?","o":["Grown-ups","The family cat","Nobody"],"e":"If something seems unsafe, call a grown-up."}]}
]);

/* ======================= STATE ======================= */
/* Everything stays on this device. In a native wrapper (Capacitor) the app uses the
   Preferences plugin, which the OS won't clear under storage pressure; in a browser it
   falls back to localStorage. */
const KEY="wisebyte-kids-v2",OLDKEY="wisebyte-kids-v1",MAXKIDS=4;
const CAP=()=>window.Capacitor&&window.Capacitor.Plugins||{};
function def(name="Explorer",avatar=0){return {name,age:"young",avatar,critter:"owl",stars:0,streak:0,last:null,done:{},learned:{},today:{},best:{},plan:null,earn:{}}}
let DB={kids:[def()],active:0};
function fromRaw(raw){
  if(!raw)return null;
  try{const o=JSON.parse(raw);
    if(o&&Array.isArray(o.kids)&&o.kids.length)return {kids:o.kids.slice(0,MAXKIDS).map(k=>Object.assign(def(),k)),active:Math.min(o.active|0,o.kids.length-1)};
    if(o&&typeof o==="object")return {kids:[Object.assign(def(),o)],active:0}; /* v1 single-child save */
  }catch(e){}return null}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
DB=fromRaw(lsGet(KEY))||fromRaw(lsGet(OLDKEY))||DB;
let S=DB.kids[DB.active];
function save(){
  const raw=JSON.stringify(DB);
  try{localStorage.setItem(KEY,raw)}catch(e){}
  try{const P=CAP().Preferences;if(P)P.set({key:KEY,value:raw})}catch(e){}
}
function switchKid(i){DB.active=i;S=DB.kids[i];save()}
function pruneDays(){ /* keep per-day records small: last 14 days only */
  const keep=new Set(Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return dayKey(d)}));
  DB.kids.forEach(k=>["today","earn"].forEach(f=>Object.keys(k[f]||{}).forEach(d=>{if(!keep.has(d))delete k[f][d]})));
}
function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayNum(){const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function todayDone(){return S.today[dayKey()]||(S.today[dayKey()]={})}
function yesterdayKey(){const y=new Date();y.setDate(y.getDate()-1);return dayKey(y)}
/* A streak only counts if the child played today or yesterday */
function curStreak(){return (S.last===dayKey()||S.last===yesterdayKey())?S.streak:0}

const $v=document.getElementById("view");

/* Every screen change bumps VIEW. Delayed steps (next question, reward) only run if
   the child is still on the screen that scheduled them, so closing a game really closes it. */
let VIEW=0;
const later=(fn,ms)=>{const g=VIEW;setTimeout(()=>{if(g===VIEW)fn()},ms)};
function show(html,{navOn=true,tab=null}={}){
  VIEW++;stopSpeech();closeGate();
  $v.innerHTML=html;nav.classList.toggle("hide",!navOn);
  nav.querySelectorAll("button").forEach(b=>{if(b.dataset.go===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  window.scrollTo(0,0);
  const h=$v.querySelector("h1,h2");
  if(h){document.getElementById("announce").textContent=h.textContent;h.setAttribute("tabindex","-1");try{h.focus({preventScroll:true})}catch(e){}}

/* Read-aloud: native TTS plugin in the wrapped app (Android WebViews have no speechSynthesis),
   browser speech everywhere else. */
const hasWebSpeech="speechSynthesis" in window;
const canSpeak=()=>!!CAP().TextToSpeech||hasWebSpeech;
function stopSpeech(){try{const T=CAP().TextToSpeech;if(T)T.stop();else if(hasWebSpeech)speechSynthesis.cancel()}catch(e){}}
function speak(t){
  try{const T=CAP().TextToSpeech;
    if(T){T.stop().catch(()=>{}).then(()=>T.speak({text:t,lang:"en-AU",rate:.92,pitch:1.05}));return}
    if(!hasWebSpeech)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1.05;u.lang="en-AU";
    const v=speechSynthesis.getVoices().find(v=>v.lang==="en-AU")||speechSynthesis.getVoices().find(v=>/^en/.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u)}catch(e){}}
const sayBtn=t=>canSpeak()?`<button class="say" data-say="${t.replace(/"/g,"&quot;")}">${SPEAK}Read to me</button>`:"";
$v.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)speak(b.dataset.say)});
nav.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)({home,stickers,me})[b.dataset.go]()});

/* Star rules: no stars for zero correct answers, and each activity can earn at most
   DAILY_CAP stars a day, so stickers can't be farmed by tapping through replays. */
const DAILY_CAP=5;
function award(n,taskId,act){
  const t=dayKey();
  if(act){const e=S.earn[t]||(S.earn[t]={});n=Math.max(0,Math.min(n,DAILY_CAP-(e[act]||0)));e[act]=(e[act]||0)+n}
  const before=Math.min(Math.floor(S.stars/PER_STICKER),STICKERS.length);
  S.stars+=n;
  if(n>0&&S.last!==t){S.streak=(S.last===yesterdayKey())?S.streak+1:1;S.last=t}
  if(taskId)todayDone()[taskId]=true;
  pruneDays();save();
  const after=Math.min(Math.floor(S.stars/PER_STICKER),STICKERS.length);
  return {n,capped:!!act&&(S.earn[t][act]>=DAILY_CAP),st:after>before?STICKERS.slice(before,after):[]};
}

/* Today's plan is chosen once per day per child and saved, so finishing the lesson
   ticks it off instead of swapping in the next lesson. */
const GAMES=["memory","pattern","maths","fib","odd","spell","count","dash"];
const GAME_NAMES={memory:"Memory Match",pattern:"Copy the Pattern",maths:"Quick Maths",fib:"Fact or Fib?",odd:"Odd One Out",spell:"Missing Letter",count:"Count It",dash:"Number Dash"};
const GAME_FN=()=>({memory,pattern,maths,fib,odd,spell,count:countIt,dash});
function todaysPlan(){
  const n=dayNum(),t=dayKey();
  if(!S.plan||S.plan.day!==t||!DISCOVER.some(l=>l.id===S.plan.lesson)){
    const pref=young()?1:2; /* older kids start on Stretch lessons */
    const pickL=DISCOVER.find(l=>!S.done[l.id]&&l.d===pref)||DISCOVER.find(l=>!S.done[l.id])||DISCOVER[n%DISCOVER.length];
    S.plan={day:t,lesson:pickL.id,game:GAMES[n%GAMES.length]};save();
  }
  const nextD=DISCOVER.find(l=>l.id===S.plan.lesson);
  const g=S.plan.game;
  return [
   {id:"lesson",w:"discover",label:"Discover",title:nextD.title,go:()=>lesson(nextD,"discover")},
   {id:"word",w:"words",label:"Word of the day",title:wordOfDay()[0],go:()=>words()},
   {id:"game",w:"brain",label:"Brain game",title:GAME_NAMES[g],go:()=>GAME_FN()[g]()}
  ];
}
const wordOfDay=()=>{const l=ageWords();return l[dayNum()%l.length]};
const sayingOfDay=()=>WISE[dayNum()%WISE.length];
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function banner(w){return `<button class="back" id="bk">${BACK}Home</button>

const FILTER={};
function world(w){
  if(w==="words")return words();
  if(w==="wise")return wise();
  if(w==="brain")return brain();
  const list=w==="discover"?DISCOVER:LIFE;
  const tags=[...new Set(list.map(l=>l.tag))];
  const f=tags.includes(FILTER[w])?FILTER[w]:"All";
  const left=list.filter(l=>!S.done[l.id]).length;
  show(`${banner(w)}
   <div class="chips" role="group" aria-label="Show topics">${["All",...tags].map(t=>`<button class="chip" data-tag="${t}" aria-pressed="${t===f}" style="${cv(w)}">${t}</button>`).join("")}</div>
   <p class="note">${left?`${left} of ${list.length} lessons still to discover.`:"You've finished every lesson here. Amazing!"}</p>
   <div class="lessons">${list.map((l,i)=>f!=="All"&&l.tag!==f?"":`<button class="lrow" data-l="${i}" style="${cv(w)}">
    <span class="n">${i+1}</span><span class="t"><strong>${l.title}</strong><small>${l.tag} · ${l.d===2?"Stretch":"Starter"} · ${l.cards.length} cards</small></span>
    ${S.done[l.id]?`<span class="done-badge">Done</span>`:`<span class="new-badge">+3 stars</span>`}</button>`).join("")}</div>`,{tab:"home"});
  bindBack();
  $v.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{FILTER[w]=b.dataset.tag;world(w)});
  $v.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>lesson(list[+b.dataset.l],w));

/* ---------- lesson player ---------- */
function lesson(l,w){
  let i=0;const total=l.cards.length;
  const exit=()=>world(w);
  function card(){
    const t=l.cards[i];
    show(`<div class="player" style="${cv(w)}">
     <div class="ptop"><button class="x" id="ex" aria-label="Close lesson">${XI}</button>
      <div class="dots">${l.cards.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}${l.qs.map(()=>"<i></i>").join("")}</div></div>
     <article class="card">
      ${i===0?`<span class="eyebrow">${l.tag}</span><h2>${l.title}</h2>`:`<span class="eyebrow">Card ${i+1} of ${total}</span>`}
      <p class="big">${t}</p>${sayBtn(t)}
     </article>
     <div style="display:flex;gap:10px">${i>0?`<button class="btn soft" id="pv" aria-label="Previous card">${BACK}</button>`:""}
      <button class="btn block" id="nx">${i<total-1?"Next":"Quiz time!"}</button></div>
    </div>`,{navOn:false});
    document.getElementById("ex").onclick=exit;
    document.getElementById("nx").onclick=()=>{if(i<total-1){i++;card()}else quiz()};
    const pv=document.getElementById("pv");if(pv)pv.onclick=()=>{i--;card()};
  }
  function quiz(){
    runQuiz({w,questions:l.qs,lead:l.cards.length,exit,finish:(c)=>{
      const isToday=todaysPlan()&&S.plan.lesson===l.id; /* checked before marking done */
      const first=!S.done[l.id];S.done[l.id]=true;
      const a=award(first?(c?3:1):(c?1:0),isToday?"lesson":null,"lesson-"+l.id);
      reward({a,title:c===l.qs.length?"Perfect!":"Well done!",msg:`You finished "${l.title}" and got ${c} of ${l.qs.length} questions right.`,again:()=>world(w)});
    }});
  }
  card();
}

/* ---------- quiz engine ---------- */
function runQuiz({w,questions,lead=0,exit,finish,title}){
  let i=0,correct=0;
  function q(){
    const Q=questions[i];const opts=Q.tf!=null?[{t:"Fact",ok:Q.tf},{t:"Fib",ok:!Q.tf}]:shuffle(Q.o.slice(0,LV().opts).map((t,k)=>({t,ok:k===0})));
    show(`<div class="player" style="${cv(w)}">
     <div class="ptop"><button class="x" id="ex" aria-label="Close">${XI}</button>
      <div class="dots">${Array.from({length:lead},()=>`<i class="on"></i>`).join("")}${questions.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div>
     <article class="card" style="flex:none">
      <span class="eyebrow">${title?title+" · ":""}Question ${i+1} of ${questions.length}</span>
      <p class="big">${Q.q}</p>${sayBtn(Q.q)}
     </article>
     <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABC"[k]}</span>${o.t}</button>`).join("")}</div>
     <div id="fb"></div>
    </div>`,{navOn:false});
    document.getElementById("ex").onclick=exit;
    $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];
      $v.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add("right")});
      if(o.ok)correct++;else b.classList.add("wrong");
      const last=i===questions.length-1;

function makeMaths(){
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  let a,b,op,ans;
  const kind=S.age==="young"?pick(["+","-"]):pick(["+","-","×"]);
  if(kind==="+"){const max=S.age==="young"?10:20;a=r(1,max-1);b=r(1,max-a);ans=a+b}
  else if(kind==="-"){const max=S.age==="young"?10:20;a=r(2,max);b=r(1,a);ans=a-b}
  else{a=pick([2,3,4,5,6,10]);b=r(2,10);ans=a*b}
  const set=new Set([ans]);while(set.size<3){const d=ans+pick([-3,-2,-1,1,2,3,10,-10]);if(d>=0)set.add(d)}
  return {q:`${a} ${kind} ${b}`,ans,opts:shuffle([...set])};
}

    while(set.size<nOpt&&pool.length)set.add(pool.pop());

     <p class="note" id="mf" style="text-align:center;min-height:1.5em;font-size:17px"></p></div>`,{navOn:false});
    document.getElementById("ex").onclick=brain;
    $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.a===ans;if(ok)c++;
      $v.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.a===ans)x.classList.add("right")});

      document.getElementById("mf").textContent=ok?pick(["Correct!","Great spelling!","You got it!"]):`It's spelled ${w.toUpperCase().split("").join("-")}.`;
      later(()=>{i++;if(i<N)q();else{S.best[bk("spell")]=Math.max(S.best[bk("spell")]||0,c);
        const a=award(Math.floor(c/2),c?(isTodayGame("spell")?"game":null):null,"spell");
        reward({a,title:c===N?"Spelling star!":c?"Nice spelling!":"Have another go!",msg:`You filled in ${c} of ${N} words.`,again:spell})}},ok?900:1700);
    });
  }
  q();
}

/* ---------- count it ---------- */
function countIt(){
  const N=8,things=["🐞","🐠","⭐","🍓","🐤","🌸","🍎","🦋","🐢","🍪","🎈","🐸"];let i=0,c=0;
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  function q(){
    const n=young()?r(3,10):r(8,20),e=pick(things);
    /* place items on a loose grid so none overlap */
    const cols=young()?4:5,rows=Math.ceil((young()?10:20)/cols);
    const cells=shuffle(Array.from({length:cols*rows},(_,k)=>k)).slice(0,n);
    const set=new Set([n]);while(set.size<3){const d=n+pick([-3,-2,-1,1,2,3]);if(d>0)set.add(d)}
    const opts=shuffle([...set]);
    show(`<div class="player" style="${cv("brain")}">${gameHead("Count It","Question "+(i+1)+" of "+N)}
     <div class="dots">${Array.from({length:N},(_,k)=>`<i class="${k<i?"on":""}"></i>`).join("")}</div>
     <article class="card" style="flex:none;padding:14px"><p class="big" style="text-align:center;font-size:22px">How many ${e} can you count?</p>
      <div class="cfield" style="grid-template-columns:repeat(${cols},1fr)" role="img" aria-label="A group of pictures to count">${Array.from({length:cols*rows},(_,k)=>`<span style="transform:translate(${r(-6,6)}px,${r(-6,6)}px) rotate(${r(-15,15)}deg)">${cells.includes(k)?e:""}</span>`).join("")}</div></article>
     <div class="mopts">${opts.map(o=>`<button class="opt" data-a="${o}">${o}</button>`).join("")}</div>
     <p class="note" id="mf" style="text-align:center;min-height:1.5em;font-size:17px"></p></div>`,{navOn:false});
    document.getElementById("ex").onclick=brain;
    $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.a===n;if(ok)c++;
      $v.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.a===n)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      document.getElementById("mf").textContent=ok?pick(["Correct!","Great counting!","Spot on!"]):`There are ${n}.`;
      later(()=>{i++;if(i<N)q();else{S.best[bk("count")]=Math.max(S.best[bk("count")]||0,c);
        const a=award(Math.floor(c/2.5),c?(isTodayGame("count")?"game":null):null,"count");
        reward({a,title:c===N?"Counting champ!":c?"Good counting!":"Have another go!",msg:`You counted ${c} of ${N} right.`,again:countIt})}},ok?800:1500);
    });
  }
  q();
}

/* ---------- number dash ---------- */
/* Tap the numbers in order as fast as you can. Best score is the fastest time. */
function dash(){
  const G=young()?3:4,N=G*G,fast=young()?15:30,ok2=young()?30:55;
  const nums=shuffle(Array.from({length:N},(_,k)=>k+1));
  let next=1,t0=0,timer=null,miss=0;
  show(`<div class="player" style="${cv("brain")}">${gameHead("Number Dash",`Tap 1 to ${N} in order, fast!`)}
   <div class="statrow"><span class="stat" id="nx">Find: 1</span><span class="stat" id="tm">0.0s</span></div>
   <div class="dgrid" style="grid-template-columns:repeat(${G},minmax(0,1fr))">${nums.map(n=>`<button class="dcell" data-n="${n}">${n}</button>`).join("")}</div>
   <p class="note" id="msg" style="text-align:center;font-size:17px">The clock starts when you tap 1.</p></div>`,{navOn:false});
  const stop=()=>{if(timer){clearInterval(timer);timer=null}};
  document.getElementById("ex").onclick=()=>{stop();brain()};
  const tm=document.getElementById("tm"),nx=document.getElementById("nx");
  $v.querySelectorAll(".dcell").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n;
    if(n!==next){if(next>1){miss++;b.classList.remove("oops");void b.offsetWidth;b.classList.add("oops");setTimeout(()=>b.classList.remove("oops"),400)}return}
    if(n===1){t0=Date.now();const g=VIEW;timer=setInterval(()=>{if(g!==VIEW)return stop();tm.textContent=((Date.now()-t0)/1000).toFixed(1)+"s"},100)}
    b.classList.add("hit");b.disabled=true;tone(300+n*25);next++;nx.textContent=next<=N?"Find: "+next:"Done!";
    if(next>N){stop();const s=Math.round((Date.now()-t0)/100)/10;tm.textContent=s.toFixed(1)+"s";
      const prev=S.best[bk("dash")];S.best[bk("dash")]=prev==null?s:Math.min(prev,s);
      later(()=>{const a=award(s<=fast?3:s<=ok2?2:1,isTodayGame("dash")?"game":null,"dash");
        reward({a,title:s<=fast?"Lightning fast!":"All done!",msg:`You tapped 1 to ${N} in ${s.toFixed(1)} seconds${miss?` with ${miss} wrong ${miss===1?"tap":"taps"}`:""}. ${s>fast?`Can you beat ${fast} seconds?`:"Amazing speed!"}`,again:dash})},500)}
  });
}

/* ---------- quiz quest ---------- */
function quest(){
  const seen=new Set();
  const bank=[...TRIVIA,...DISCOVER.flatMap(l=>l.qs),...LIFE.flatMap(l=>l.qs)].filter(q=>{const k=q.q.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
  const N=LV().questQs;
  const doneQs=shuffle([...DISCOVER,...LIFE].filter(l=>S.done[l.id]).flatMap(l=>l.qs)).slice(0,Math.floor(N/2));
  const qs=shuffle([...doneQs,...shuffle(bank.filter(q=>!doneQs.includes(q))).slice(0,N-doneQs.length)]);
  runQuiz({w:"discover",title:"Quiz Quest",questions:qs,exit:home,finish:(c)=>{
    S.best[bk("quest")]=Math.max(S.best[bk("quest")]||0,c);const a=award(Math.min(5,young()?c:Math.floor(c*5/N)),null,"quest");
    reward({a,title:c===N?"Quiz champion!":c?"Quest complete!":"Have another go!",msg:`You got ${c} out of ${N} right.`,again:quest});
  }});
}

/* ---------- grown-ups gate ---------- */
/* A sum a young child can't easily do, typed rather than picked. Required by Apple's Kids
   category and Google's Families policy before settings, links out or purchases. */
function closeGate(){const g=document.getElementById("gate");if(g)g.remove()}
function gate(onPass){
  closeGate();
  const a=6+Math.floor(Math.random()*4),b=3+Math.floor(Math.random()*7);let tries=0;
  const el=document.createElement("div");el.className="scrim";el.id="gate";
  el.innerHTML=`<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
    <h2 id="gt">Grown-ups only</h2><p class="note">To continue, type the answer.</p>
    <div class="mathq" aria-label="${a} times ${b}">${a} × ${b} = ?</div>
    <form id="gf" style="display:flex;flex-direction:column;gap:10px">
     <label class="sr" for="ga">Answer</label><input class="input" id="ga" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3">
     <p class="err" id="ge" aria-live="polite"></p>
     <button class="btn block" type="submit">Continue</button>
     <button class="btn soft block" type="button" id="gc">Cancel</button></form></div>`;
  document.body.appendChild(el);
  const inp=el.querySelector("#ga");setTimeout(()=>inp.focus(),50);
  el.querySelector("#gc").onclick=closeGate;
  el.addEventListener("keydown",e=>{if(e.key==="Escape")closeGate()});
  el.querySelector("#gf").onsubmit=e=>{e.preventDefault();
    if(+inp.value===a*b&&inp.value.trim()!==""){closeGate();onPass();return}
    tries++;inp.value="";
    if(tries>=3){closeGate();return}
    el.querySelector("#ge").textContent="That's not right. Please try again.";inp.focus()};
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const cols=["#2F7DE1","#1FA37A","#F26B3A","#D9407A","#7B5CE0","#FFC43D"];
  const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:pick(cols)}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
