<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wisebyte Kids</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFC43D">
<meta name="apple-mobile-web-app-title" content="Wisebyte Kids">
<style>
/* Wisebyte Kids — single bright look by choice (daytime play app) */
:root{
  color-scheme:light;
  --ground:#E6F1FF; --surface:#FFFFFF; --surface-2:#F1F6FD; --line:#CFDDF0;
  --ink:#1B2446; --ink-2:#5A6788;
  --sun:#FFC43D; --sun-deep:#E0A000; --sun-soft:#FFF1C9;
  --good:#1FA37A; --good-deep:#15805F; --good-soft:#D8F3E9;
  --bad:#E5484D; --bad-soft:#FDE2E2;
  --discover:#2F7DE1; --discover-deep:#1F5FB3; --discover-soft:#DCEAFD;
  --words:#1FA37A; --words-deep:#15805F; --words-soft:#D8F3E9;
  --life:#F26B3A; --life-deep:#C84E22; --life-soft:#FFE3D8;
  --wise:#D9407A; --wise-deep:#AE2B5E; --wise-soft:#FBDDE8;
  --brain:#7B5CE0; --brain-deep:#5A3DBB; --brain-soft:#E7E0FB;
  /* Built-in fonts only: no third-party font requests (kids-category requirement) */
  --display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Varela Round","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--discover);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:20px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:22px;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand span b{color:var(--discover)}
.brand small{display:inline-block;margin-left:4px;padding:2px 8px;border-radius:999px;background:var(--sun);color:var(--ink);font-size:13px;vertical-align:3px}
.pills{display:flex;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--c,var(--discover));color:#fff;box-shadow:0 5px 0 var(--cd,var(--discover-deep));transition:transform .08s,box-shadow .08s;margin-bottom:5px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd,var(--discover-deep))}
.btn.block{width:100%}
.btn.sun{--c:var(--sun);--cd:var(--sun-deep);color:var(--ink)}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:16px;border-radius:14px}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* hero */
.hero{display:flex;align-items:flex-end;gap:10px}
.hero .owl{width:96px;height:96px;flex:none}
.bubble{position:relative;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.bubble h1{font-size:24px}
.bubble p{color:var(--ink-2);font-size:15px}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head h2{font-size:22px}
.count,.world .meter{white-space:nowrap;flex:none}
.count{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}

.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface-2);width:100%;text-align:left}
.task .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);flex:none;color:#fff}
.task .ic svg{width:26px;height:26px}
.task .t{flex:1;min-width:0;display:flex;flex-direction:column}
.task .t small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.task .t strong{font-family:var(--display);font-weight:600;font-size:18px}
.task .tick{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.task.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.task.done .t strong{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:2px}
.task .tick svg{width:18px;height:18px}

/* worlds */
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.world{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px 14px 14px;border-radius:22px;background:var(--c);color:#fff;box-shadow:0 6px 0 var(--cd);overflow:hidden;margin-bottom:6px;transition:transform .08s,box-shadow .08s;min-height:150px}
.world:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.world:last-child{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.world .art{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.world .art svg{width:38px;height:38px}
.world h3{font-size:22px}
.world p{font-size:14px;opacity:.92}
.world .deco{position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.world .meter{margin-top:auto;font-family:var(--display);font-weight:500;font-size:14px;background:rgba(0,0,0,.14);padding:3px 10px;border-radius:999px}

.quest{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);text-align:left;width:100%;margin-bottom:6px}
.quest:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sun-deep)}
.quest .art{width:58px;height:58px;flex:none}
.quest h3{font-size:22px}
.quest p{font-size:14px;color:#5a4300}

/* pillar page */
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink-2);padding:6px 0}
.back svg{width:20px;height:20px}
.pbanner{display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;background:var(--c);color:#fff}
.pbanner .art{width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.pbanner .art svg{width:46px;height:46px}
.pbanner h1{font-size:30px}
.pbanner p{opacity:.92;font-size:15px}
.lessons{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);width:100%;text-align:left}
.lrow:hover{border-color:var(--c)}
.lrow .n{width:40px;height:40px;border-radius:12px;background:var(--cs);color:var(--cd);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.lrow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .t strong{font-family:var(--display);font-weight:600;font-size:18px}
.lrow .t small{color:var(--ink-2);font-size:13px}
.stars3{display:flex;gap:1px;flex:none}
.stars3 svg{width:18px;height:18px}
.done-badge{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border-radius:999px;background:var(--good-soft);color:var(--good-deep);flex:none}
.new-badge{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border-radius:999px;background:var(--cs);color:var(--cd);flex:none}

/* player */
.player{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 160px)}
.ptop{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none}
.x svg{width:20px;height:20px}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--c)}
.card{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center;padding:26px 22px;border-radius:26px;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 var(--line);animation:pop .28s ease}
.card .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--cd)}
.card .big{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.3}
.card h2{font-size:28px}
.say{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--cs);color:var(--cd);font-family:var(--display);font-weight:600;font-size:15px}
.say svg{width:18px;height:18px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:18px;background:var(--surface);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:500;font-size:20px;margin-bottom:4px}
.opt .k{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;color:var(--ink-2)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 4px 0 var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{padding:14px 16px;border-radius:18px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:var(--good-soft);color:var(--good-deep)}
.feedback.no{background:var(--sun-soft);color:#7a5600}
.feedback b{font-family:var(--display);font-weight:600;font-size:19px;display:block}

/* reward */
.reward{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 20px;border-radius:28px;background:var(--surface);border:2px solid var(--line)}
.reward .owl{width:130px;height:130px;animation:bounce 1.2s ease infinite}
.reward h1{font-size:34px}
.gain{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:40px;color:var(--sun-deep)}
.gain svg{width:44px;height:44px}
.newsticker{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--sun-soft);text-align:left}
.newsticker .st{font-size:44px;line-height:1}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* words */
.wotd{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.wotd .w{font-family:var(--display);font-weight:700;font-size:44px;color:var(--words-deep);line-height:1}
.wotd .type{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.wotd .ex{padding:12px 14px;border-radius:14px;background:var(--words-soft);color:var(--words-deep);font-style:italic}
.wlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wchip{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:500;font-size:18px;text-align:left;min-width:0}
.wchip span{min-width:0;overflow-wrap:anywhere}
.wchip.learned{border-color:var(--words);background:var(--words-soft)}
.wchip svg{width:18px;height:18px;flex:none;color:var(--words-deep)}

/* wise */
.saying{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:24px;background:var(--wise);color:#fff;position:relative;overflow:hidden}
.saying q{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;quotes:"\201C" "\201D"}
.saying .who{opacity:.9;font-size:14px}

/* games */
.gtiles{display:flex;flex-direction:column;gap:12px}
.gtile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);text-align:left;width:100%;margin-bottom:5px}
.gtile .art{width:62px;height:62px;border-radius:18px;background:var(--brain-soft);display:grid;place-items:center;flex:none}
.gtile .art svg{width:40px;height:40px}
.gtile h3{font-size:21px}
.gtile p{font-size:14px;color:var(--ink-2)}
.gtile .best{margin-left:auto;font-family:var(--display);font-size:14px;color:var(--brain-deep);text-align:right;flex:none}

.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--brain);box-shadow:0 4px 0 var(--brain-deep);display:grid;place-items:center;font-size:clamp(26px,9vw,44px);color:transparent;transition:transform .2s,background .2s;margin-bottom:4px;position:relative}
.mc::after{content:"?";position:absolute;font-family:var(--display);font-weight:700;color:rgba(255,255,255,.55);font-size:28px}
.mc.up{background:var(--surface);color:initial;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.mc.up::after,.mc.got::after{content:none}
.mc.got{background:var(--good-soft);color:initial;box-shadow:0 4px 0 var(--good);border:2px solid var(--good)}

.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:340px;width:100%;margin:0 auto}
.pad{aspect-ratio:1;max-width:100%;border-radius:28px;background:var(--pc);opacity:.55;box-shadow:0 6px 0 var(--pd);transition:opacity .1s,transform .1s;margin-bottom:6px}
.pad.lit{opacity:1;transform:scale(1.04)}
.pad:active{opacity:1}
.pads.wait .pad{pointer-events:none}

.mathq{font-family:var(--display);font-weight:700;font-size:56px;text-align:center;font-variant-numeric:tabular-nums}
.mopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mopts .opt{justify-content:center;font-size:28px;font-weight:700;padding:18px 8px;font-variant-numeric:tabular-nums}

.statrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.stat{padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}

/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stk{aspect-ratio:1;max-width:100%;border-radius:20px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:clamp(28px,9vw,44px);position:relative}
.stk.locked{background:var(--surface-2);border-style:dashed;font-size:0}
.stk.locked::after{content:attr(data-need);font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink-2);text-align:center;padding:4px}
.stk.fresh{animation:pop .5s ease}

/* me */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--ink-2)}
.input{padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;width:100%}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.av{width:60px;height:60px;border-radius:50%;border:3px solid transparent;padding:2px}
.av[aria-pressed="true"]{border-color:var(--ink)}
.av svg{width:100%;height:100%}
.note{font-size:14px;color:var(--ink-2);font-weight:600}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--bad-soft)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{padding:12px 8px;border-radius:16px;background:var(--surface-2);text-align:center}
.kv b{display:block;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;z-index:5}
.nav div{display:flex;gap:6px;max-width:560px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-2)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{background:var(--discover-soft);color:var(--discover-deep)}
.nav.hide{display:none}

/* topic filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}

/* profiles */
.kids{display:flex;gap:10px;flex-wrap:wrap}
.kid{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:18px;border:3px solid transparent;background:var(--surface-2);min-width:84px;max-width:120px}
.kid[aria-pressed="true"]{border-color:var(--discover);background:var(--discover-soft)}
.kid svg{width:52px;height:52px}
.kid span{font-family:var(--display);font-weight:600;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid.add{justify-content:center;color:var(--ink-2);border:2px dashed var(--line);background:var(--surface)}
.kid.add b{font-size:30px;line-height:52px;font-family:var(--display)}

/* grown-ups gate */
.scrim{position:fixed;inset:0;z-index:10001;background:rgba(27,36,70,.55);display:grid;place-items:center;padding:16px}
.gate{width:100%;max-width:380px;background:var(--surface);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.gate h2{font-size:24px}
.gate .mathq{font-size:40px}
.gate .err{color:var(--bad);font-size:15px;min-height:1.3em}
.grown{border-color:var(--sun-deep);background:var(--sun-soft)}
.linkbtn{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:16px;color:var(--discover-deep);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.policy{display:flex;flex-direction:column;gap:12px;font-weight:600}
.policy h2{font-size:20px;margin-top:6px}
.policy ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.nostars{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink-2)}

/* new brain games */
.egrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:360px;width:100%;margin:0 auto}
.ebtn{aspect-ratio:1;max-width:100%;border-radius:24px;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:clamp(48px,16vw,72px);display:grid;place-items:center;margin-bottom:5px}
.ebtn.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 5px 0 var(--good)}
.ebtn.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 5px 0 var(--bad);animation:shake .35s}
.spem{font-size:84px;line-height:1}
.spword{font-family:var(--display);font-weight:700;font-size:clamp(34px,11vw,52px);letter-spacing:.14em;text-align:center;overflow-wrap:anywhere}
.spword .blank{display:inline-block;min-width:.8em;color:var(--brain);border-bottom:5px solid var(--brain);line-height:.9}
.spword .fill{color:var(--good-deep)}
.cfield{display:grid;gap:4px;padding:8px;border-radius:18px;background:var(--surface-2)}
.cfield span{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(24px,8vw,36px)}
.dgrid{display:grid;gap:10px;max-width:380px;width:100%;margin:0 auto}
.dcell{aspect-ratio:1;border-radius:18px;background:var(--brain);color:#fff;box-shadow:0 5px 0 var(--brain-deep);font-family:var(--display);font-weight:700;font-size:clamp(26px,8vw,38px);font-variant-numeric:tabular-nums;margin-bottom:5px}
.dcell.hit{background:var(--good-soft);color:var(--good-deep);box-shadow:0 2px 0 var(--good);transform:translateY(3px)}
.dcell.oops{animation:shake .35s;background:var(--bad)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.bubble h1{font-size:21px}.hero .owl{width:78px;height:78px}.world h3{font-size:19px}}

/* App metadata must live in <head> for install prompts and home-screen icons */
document.querySelectorAll('link[rel="manifest"],link[rel="icon"],link[rel="apple-touch-icon"],meta[name="theme-color"],meta[name="apple-mobile-web-app-title"]').forEach(n=>document.head.appendChild(n));
/* ======================= CONTENT ======================= */
const WORLDS={
 discover:{name:"Discover",blurb:"Amazing facts about our world",c:"--discover"},
 words:{name:"Words",blurb:"Learn a new word every day",c:"--words"},
 life:{name:"Life Skills",blurb:"Handy things big kids know",c:"--life"},
 wise:{name:"Wise Words",blurb:"Sayings that make you think",c:"--wise"},
 brain:{name:"Brain Games",blurb:"Memory, spelling, counting and more",c:"--brain"}
};

const DISCOVER=[
 {id:"sky",title:"Why is the sky blue?",tag:"Science",cards:[
  "Sunlight looks white, but it's really all the colours of the rainbow mixed together.",
  "When sunlight zooms into our air, it bumps into tiny bits of gas, far too small to see.",
  "Blue light gets bounced around the sky much more than red or yellow light.",
  "So when you look up, blue light is coming at you from every direction. That's why the sky looks blue!",
  "At sunset, light travels through lots more air. The blue gets scattered away, and we see oranges and reds."],
  qs:[{q:"What colours is sunlight made of?",o:["All the colours of the rainbow","Just yellow","Just blue"],e:"Sunlight is a mix of every rainbow colour."},
      {q:"Why does the sunset look orange and red?",o:["The light travels through more air","The Sun gets tired","The clouds are painted"],e:"More air scatters the blue away, leaving reds and oranges."}]},
 {id:"octopus",title:"The octopus: ocean genius",tag:"Animals",cards:[
  "An octopus has three hearts! Two pump blood to its gills, and one pumps blood around its body.",
  "Its blood is blue, not red, because it uses copper to carry oxygen.",
  "An octopus has eight arms, and the suckers on them can taste whatever they touch.",
  "Octopuses can change colour, and even the bumpiness of their skin, in a flash to hide from predators.",
  "They're clever too. Some octopuses have learned to open jars to get the food inside!"],
  qs:[{q:"How many hearts does an octopus have?",o:["Three","One","Eight"],e:"Two hearts for the gills and one for the body."},
      {q:"What can an octopus's suckers do?",o:["Taste things","See things","Sing songs"],e:"Octopus suckers can taste what they touch."}]},
 {id:"bees",title:"How do bees make honey?",tag:"Animals",cards:[
  "Honeybees fly from flower to flower collecting a sweet juice called nectar.",
  "A bee can visit up to 100 flowers on one trip, storing nectar in a special honey stomach.",
  "Back at the hive, bees pass the nectar to each other and put it into little wax cells.",
  "They fan it with their wings to dry it out. As the water leaves, the nectar thickens into honey.",
  "Then they seal each cell with a wax lid to keep the honey for later, like a tiny jar."],
  qs:[{q:"What do bees collect from flowers to make honey?",o:["Nectar","Leaves","Raindrops"],e:"Nectar is the sweet juice inside flowers."},
      {q:"How do bees dry the nectar?",o:["By fanning it with their wings","By putting it in the sun","By blowing bubbles"],e:"Thousands of beating wings dry it into honey."}]},
 {id:"seasons",title:"Why do we have seasons?",tag:"Space",cards:[
  "Earth travels around the Sun once a year. That trip is called an orbit.",
  "Earth is tilted, like a spinning top leaning to one side.",
  "When your half of Earth leans towards the Sun, sunlight hits it more directly. That's summer!",
  "When your half leans away, sunlight is more spread out and the days are shorter. That's winter.",
  "That's why when it's summer in Australia, it's winter in places like England!"],
  qs:[{q:"What causes the seasons?",o:["Earth's tilt","Clouds moving around","The Moon"],e:"Earth's tilt changes how directly sunlight hits us."},
      {q:"When it's summer in Australia, what season is it in England?",o:["Winter","Summer","It's always spring"],e:"The two halves of Earth lean opposite ways."}]},
 {id:"dinos",title:"Dinosaurs are still here!",tag:"Animals",cards:[
  "Most dinosaurs died out about 66 million years ago, after a giant space rock crashed into Earth.",
  "But one group of dinosaurs survived, and you see them every day.",
  "Birds! Scientists say birds are living dinosaurs, related to dinosaurs like T. rex.",
  "Many dinosaurs had feathers, and some had hollow bones, just like birds do today.",
  "So next time you see a magpie or a chicken, say hello to a little dinosaur."],
  qs:[{q:"Which animals are living dinosaurs?",o:["Birds","Frogs","Sharks"],e:"Birds come from the dinosaur family tree."},
      {q:"What did many dinosaurs have, just like birds?",o:["Feathers","Fur","Gills"],e:"Lots of dinosaurs were feathery."}]},
 {id:"moon",title:"Our Moon",tag:"Space",cards:[
  "The Moon doesn't make its own light. It shines because sunlight bounces off it.",
  "The Moon travels around Earth about once a month. The word 'month' even comes from 'moon'.",
  "As it travels, we see different amounts of its sunny side. These shapes are called phases.",
  "There's no wind or rain on the Moon, so the astronauts' footprints from 1969 are probably still there.",
  "Twelve people have walked on the Moon. Maybe you'll be next!"],
  qs:[{q:"Why does the Moon shine?",o:["Sunlight bounces off it","It's on fire","It has lights inside"],e:"The Moon reflects sunlight like a mirror."},
      {q:"Why can footprints last so long on the Moon?",o:["There's no wind or rain","The ground is sticky","Aliens protect them"],e:"Nothing blows or washes them away."}]},
 {id:"plants",title:"How plants make food",tag:"Nature",cards:[
  "Plants can't go to the shops, so they make their own food!",
  "They drink water with their roots and take in a gas called carbon dioxide through their leaves.",
  "Using sunlight as power, they turn the water and gas into sugar. This is called photosynthesis.",
  "While they do it, plants let out oxygen, the gas we need to breathe.",
  "So every plant is a tiny food factory that helps keep us alive."],
  qs:[{q:"What does a plant use as power to make food?",o:["Sunlight","Batteries","Music"],e:"Sunlight powers photosynthesis."},
      {q:"What do plants give off that we breathe?",o:["Oxygen","Smoke","Honey"],e:"Plants release oxygen into the air."}]},
 {id:"heart",title:"Your amazing heart",tag:"Your body",cards:[
  "Your heart is a muscle about the size of your fist.",
  "It squeezes to pump blood all around your body, bringing food and oxygen everywhere.",
  "It beats about 100,000 times every single day, even while you sleep.",
  "When you run and play, your heart beats faster to give your muscles more oxygen.",
  "Put your hand on your chest. Feel that thump? That's your heart hard at work!"],
  qs:[{q:"About how big is your heart?",o:["The size of your fist","The size of a football","The size of a pea"],e:"Make a fist. That's about the size of your heart."},
      {q:"Why does your heart beat faster when you run?",o:["Your muscles need more oxygen","It's scared","It wants to win"],e:"Busy muscles need more oxygen, fast."}]},
 {id:"reef",title:"The Great Barrier Reef",tag:"Nature",cards:[
  "Off the coast of Queensland is the Great Barrier Reef, the biggest coral reef in the world.",
  "It's so big that astronauts can see it from space!",
  "Coral might look like rock or plants, but it's actually made by tiny animals called polyps.",
  "More than 1,500 kinds of fish live on the reef, plus turtles, sharks, dolphins and giant clams.",
  "Coral needs clean, cool water to stay healthy, so looking after our oceans helps the reef."],
  qs:[{q:"What makes coral?",o:["Tiny animals called polyps","Sand and glue","Seaweed"],e:"Coral is built by tiny animals called polyps."},
      {q:"Which state is the Great Barrier Reef next to?",o:["Queensland","Victoria","Tasmania"],e:"It stretches along the Queensland coast."}]},
 {id:"platypus",title:"The platypus puzzle",tag:"Animals",cards:[
  "The platypus has a bill like a duck, a tail like a beaver and webbed feet like an otter.",
  "It's a mammal, which usually means babies are born alive. But the platypus lays eggs!",
  "A platypus has no stomach! Its food goes straight from its throat to its gut.",
  "A platypus hunts underwater with its eyes shut. Its bill feels the tiny electric signals that bugs give off.",
  "Male platypuses have a sharp spur on their back legs with venom in it, so never touch one."],
  qs:[{q:"What is special about a platypus's tummy?",o:["It has no stomach at all","It has three stomachs","It glows in the dark"],e:"A platypus has no stomach. Food goes straight from its throat to its gut."},
      {q:"How does a platypus find food underwater?",o:["Its bill feels tiny electric signals","It uses a torch","It asks a fish"],e:"Its bill senses electricity from little creatures."}]},
 {id:"rain",title:"Where does rain come from?",tag:"Nature",cards:[
  "The Sun warms water in oceans, rivers and puddles.",
  "Some of that water turns into an invisible gas called water vapour and floats up into the sky. This is evaporation.",
  "High up it's cold, so the vapour turns back into tiny droplets. Millions of droplets together make a cloud.",
  "When the droplets join up and get too heavy, they fall as rain.",
  "The rain runs into rivers and the sea, and it all starts again. This is called the water cycle."],
  qs:[{q:"What is a cloud made of?",o:["Tiny drops of water","Cotton wool","Smoke"],e:"Clouds are millions of tiny water droplets."},
      {q:"What warms the water so it rises into the sky?",o:["The Sun","The Moon","The wind"],e:"The Sun's heat starts the water cycle."}]},
 {id:"volcano",title:"Volcanoes",tag:"Earth",cards:[
  "Deep under the ground it's so hot that rock melts into a runny liquid called magma.",
  "A volcano is an opening where magma can push up to the surface.",
  "When magma comes out of a volcano, we call it lava. It can be hotter than 1,000 degrees!",
  "When lava cools down, it hardens into new rock. Some islands, like Hawaii, were made this way.",
  "Queensland's Glass House Mountains are what's left of volcanoes from millions of years ago."],
  qs:[{q:"What do we call melted rock once it comes out of a volcano?",o:["Lava","Magma","Mud"],e:"Underground it's magma. Outside, it's lava."},
      {q:"What happens when lava cools?",o:["It turns into rock","It turns into water","It disappears"],e:"Cooled lava hardens into new rock."}]},
 {id:"sun",title:"The Sun is a star",tag:"Space",cards:[
  "The Sun is a star, just like the ones you see at night. It looks bigger because it's much closer.",
  "It's a giant ball of super hot gas. About a million Earths could fit inside it!",
  "Sunlight takes about 8 minutes to travel from the Sun to us.",
  "The Sun gives us light and warmth. Without it, nothing could live on Earth.",
  "The Sun is so bright it can hurt your eyes, so never look straight at it."],
  qs:[{q:"What is the Sun?",o:["A star","A planet","A moon"],e:"The Sun is our closest star."},
      {q:"Is it safe to look straight at the Sun?",o:["No, it can hurt your eyes","Yes, any time","Only at lunchtime"],e:"Never look straight at the Sun."}]},
 {id:"magnets",title:"Magic magnets",tag:"Science",cards:[
  "A magnet can pull some metal things towards it, like paperclips and fridge doors made of steel.",
  "Every magnet has two ends, called the north pole and the south pole.",
  "Put a north and a south end together and they snap close. Opposites attract!",
  "Try to push two north ends together and they push each other away.",
  "Earth is like a giant magnet. That's why a compass needle always points north."],
  qs:[{q:"What happens when you put two north ends of magnets together?",o:["They push apart","They stick together","They melt"],e:"The same poles push each other away."},
      {q:"Why does a compass point north?",o:["Earth is like a giant magnet","It's scared of the south","It's broken"],e:"Earth's magnetism pulls the needle."}]},
 {id:"koala",title:"Is a koala a bear?",tag:"Animals",cards:[
  "Koalas look cuddly like teddy bears, but they are not bears at all. They are marsupials, animals with a pouch.",
  "A baby koala is called a joey. It grows inside its mum's pouch for about six months.",
  "Koalas eat eucalyptus leaves, which grown-ups often call gum leaves. They are very fussy and choose only certain trees.",
  "Gum leaves give koalas very little energy. So koalas rest and sleep for up to about 20 hours a day!",
  "Koalas live only in Australia. Planting and protecting gum trees helps koalas have safe homes."],
  qs:[{q:"What kind of animal is a koala?",o:["A marsupial with a pouch","A type of bear","A fluffy fish"],e:"Koalas are marsupials. Their babies grow in a pouch."},
      {q:"What do koalas mostly eat?",o:["Gum leaves","Grass","Chocolate biscuits"],e:"Koalas eat eucalyptus leaves, also called gum leaves."}]},
 {id:"kangaroo",title:"How do kangaroos carry their babies?",tag:"Animals",cards:[
  "Kangaroos are marsupials. Mums carry their babies, called joeys, in a warm pouch on their tummy.",
  "A newborn joey is tiny, about the size of a jellybean. It crawls into the pouch all by itself.",
  "The joey drinks milk and grows in the pouch for months. Soon it pokes its head out to look around.",
  "Kangaroos hop on their strong back legs. Big kangaroos can hop faster than 50 kilometres per hour!",
  "A group of kangaroos is called a mob. The kangaroo is on Australia's coat of arms with the emu."],
  qs:[{q:"How big is a newborn joey?",o:["About the size of a jellybean","About the size of a cat","As big as a car"],e:"Newborn joeys are tiny, about jellybean size."},
      {q:"What is a group of kangaroos called?",o:["A mob","A flock","A band of bouncers"],e:"A group of kangaroos is called a mob."}]},
 {id:"wombat",title:"Why is wombat poo square?",tag:"Animals",cards:[
  "Wombats are chunky Australian marsupials with short legs and strong claws. They are amazing diggers.",
  "They dig long tunnels called burrows. They rest in them during the day and come out mostly at night.",
  "A wombat's pouch faces backwards. That way, dirt doesn't get in on the baby while mum digs!",
  "Wombats are famous for making poo shaped like little cubes. Scientists found their tummies squeeze it into shape.",
  "Wombats leave their cube poos on rocks and logs. This helps other wombats know who lives nearby."],
  qs:[{q:"What shape is wombat poo?",o:["Like little cubes","Like long noodles","Like tiny stars"],e:"Wombat poo comes out shaped like little cubes."},
      {q:"Why does a wombat's pouch face backwards?",o:["So dirt doesn't get in when digging","So the baby can see where they've been","So it can hold snacks"],e:"A backwards pouch keeps dirt away from the baby while mum digs."}]},
 {id:"echidna",title:"The spiky egg-laying echidna",tag:"Animals",cards:[
  "The echidna is a spiky Australian animal. Its spines are actually special, very stiff hairs.",
  "Echidnas can live for 40 years or more. That's a very long life for a small animal!",
  "A mum echidna lays one soft egg into her pouch. The baby that hatches is called a puggle.",
  "Echidnas have no teeth. They use a long, sticky tongue to slurp up ants and termites.",
  "When scared, an echidna digs down or curls into a spiky ball. Its spines keep it safe."],
  qs:[{q:"How do echidna babies start life?",o:["They hatch from an egg","They are born like a kangaroo joey","They fall from a tree"],e:"Echidnas are mammals, but they lay eggs! The baby is called a puggle."},
      {q:"What does an echidna use to catch ants?",o:["A long sticky tongue","Sharp teeth","A tiny fishing net"],e:"Echidnas have no teeth. They slurp ants up with a sticky tongue."}]},
 {id:"sharks",title:"Super sharks",tag:"Animals",cards:[
  "Sharks are fish that have lived in the oceans for more than 400 million years. That's even before the dinosaurs!",
  "A shark's skeleton isn't made of bone. It's made of cartilage, the bendy stuff in your ears and nose.",
  "Sharks lose teeth all the time, but new ones keep moving forward to take their place.",
  "The biggest fish in the world is the whale shark. It's gentle and eats tiny sea creatures called plankton.",
  "Sharks can sense tiny electric signals from other animals. This helps them find food in dark water."],
  qs:[{q:"What is a shark's skeleton made of?",o:["Cartilage, like your ears","Bone, like yours","Jelly"],e:"Sharks have skeletons made of bendy cartilage, not bone."},
      {q:"What is the biggest fish in the world?",o:["The whale shark","The great white shark","The goldfish"],e:"The whale shark is the biggest fish. It eats tiny plankton."}]},
 {id:"planets",title:"Meet the planets",tag:"Space",cards:[
  "Eight planets travel around our Sun. Together with the Sun, they are part of our solar system.",
  "In order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.",
  "Jupiter is the biggest planet. More than a thousand Earths could fit inside it!",
  "Saturn has beautiful rings made of ice and rock. Venus is the hottest planet, because its thick air traps heat.",
  "Earth is the only planet we know of that has living things. It has air, water and just the right warmth."],
  qs:[{q:"Why is Venus the hottest planet, even though Mercury is closer to the Sun?",o:["Its thick air traps the heat","It is closer to the Sun than Mercury","It is made of fire"],e:"Venus has thick air that works like a heavy blanket, trapping the Sun's heat."},
      {q:"How many planets travel around our Sun?",o:["Eight","Twelve","A million"],e:"There are eight planets in our solar system."}]},
 {id:"stars",title:"Stars and the Southern Cross",tag:"Space",cards:[
  "Stars are giant balls of very hot, glowing gas. Our Sun is a star too. It's just the closest one!",
  "Other stars are so far away they look like tiny dots. Their light takes years to reach us.",
  "Long ago, people joined stars into pictures called constellations. They used them to find their way and tell stories.",
  "The Southern Cross is a constellation you can see from Australia. Look for four bright stars shaped like a kite.",
  "The Southern Cross is on the Australian flag. Stars twinkle because their light wobbles through the moving air."],
  qs:[{q:"Why do stars twinkle?",o:["Their light wobbles through moving air","They blink on and off","Aliens are waving torches"],e:"Starlight passes through moving air on its way to us, which makes it shimmer."},
      {q:"Which constellation is on the Australian flag?",o:["The Southern Cross","The Big Dipper","The Giant Sausage"],e:"The Southern Cross is on the flag and can be seen from Australia."}]},
 {id:"iss",title:"Living in space",tag:"Space",cards:[
  "The International Space Station is a home in space for astronauts. It circles about 400 kilometres above Earth.",
  "It zooms around Earth about every 90 minutes. Astronauts can see about 16 sunrises every day!",
  "On the station, everything floats. Astronauts sleep in sleeping bags tied to the wall so they don't drift away.",
  "Astronauts do science experiments and exercise every day. Exercise keeps their muscles and bones strong in space.",
  "On a clear night, you can sometimes see the station from Earth. It looks like a bright dot moving across the sky."],
  qs:[{q:"How do astronauts sleep on the space station?",o:["In sleeping bags tied to the wall","In normal beds with pillows","Hanging upside down like bats"],e:"Everything floats, so sleeping bags are tied down."},
      {q:"About how long does the station take to go around Earth?",o:["About 90 minutes","About a week","About five seconds"],e:"The station circles Earth about every 90 minutes."}]},
 {id:"mars",title:"Mars, the red planet",tag:"Space",cards:[
  "Mars is the fourth planet from the Sun. It's called the red planet because of its colour.",
  "Mars looks red because its dust and rocks are full of rust. It's like a rusty old bike!",
  "Mars has the biggest volcano in the solar system, Olympus Mons. It's more than twice as tall as Mount Everest.",
  "Mars is much colder than Earth, and you couldn't breathe its air. It has two small moons.",
  "Robot rovers drive around Mars taking photos and studying rocks. They help scientists learn if Mars once had water."],
  qs:[{q:"Why does Mars look red?",o:["Its dust has lots of rust","It's very hot like fire","Someone painted it"],e:"Rusty dust and rocks make Mars look red."},
      {q:"What explores Mars right now?",o:["Robot rovers","Astronauts living there","Kangaroos in spacesuits"],e:"Robot rovers explore Mars. No people have been there yet."}]},
 {id:"sound",title:"How does sound work?",tag:"Science",cards:[
  "Every sound starts with something shaking back and forth very fast. This shaking is called a vibration.",
  "Touch your throat and hum. Can you feel it buzzing? That's your voice box vibrating!",
  "Vibrations travel through the air as sound waves. When they reach your ears, your brain hears a sound.",
  "Sound can travel through air, water and even walls. But in space there's no air, so it's silent.",
  "Fast vibrations make high sounds, like a whistle. Slow vibrations make low sounds, like a big drum."],
  qs:[{q:"What makes a sound?",o:["Something vibrating","Something being very still","Magic dust"],e:"All sounds are made by vibrations."},
      {q:"Why is space silent?",o:["There's no air to carry sound","Space is too dark","Aliens turned the volume down"],e:"Sound needs something like air to travel through. Space has none."}]},
 {id:"shadows",title:"Where do shadows come from?",tag:"Science",cards:[
  "Light travels in straight lines. When something blocks the light, it makes a dark shape called a shadow.",
  "Things like wood and your body block light. Clear things like glass let most light through, so their shadows are faint.",
  "Outside, your shadow changes during the day. It's long in the morning and evening, and short around midday.",
  "That's because the Sun is low in the sky early and late, and high in the middle of the day.",
  "Try making shadow puppets with a torch and your hands! Move closer to the torch to make them bigger."],
  qs:[{q:"When is your shadow shortest outside?",o:["Around the middle of the day","Early in the morning","When you are hungry"],e:"The Sun is high around midday, so shadows are short."},
      {q:"What makes a shadow?",o:["Something blocking light","Something that gives off light","A tiny dark cloud following you"],e:"Shadows form where an object blocks light."}]},
 {id:"matter",title:"Solids, liquids and gases",tag:"Science",cards:[
  "Everything around you is a solid, a liquid or a gas. These are called states of matter.",
  "Solids keep their own shape, like a block or an ice cube. Liquids flow and take the shape of their container.",
  "Gases spread out to fill any space. The air you breathe is made of gases you can't see.",
  "Water can be all three! Freeze it and it becomes solid ice. Heat it and it turns into a gas called water vapour.",
  "Heating and cooling can change a state. Always ask a grown-up before using anything hot."],
  qs:[{q:"What is ice?",o:["Solid water","A gas","Frozen lemonade from the clouds"],e:"Ice is water in its solid state."},
      {q:"What does a liquid do?",o:["Flows and takes the shape of its container","Keeps its own shape","Sings in the bath"],e:"Liquids flow and fill the shape of their container."}]},
 {id:"float",title:"Why do some things float?",tag:"Science",cards:[
  "Drop a rock in water and it sinks. Drop a leaf and it floats. Why is that?",
  "It depends on how heavy something is for its size. Light things for their size float, like corks and apples.",
  "When something goes into water, it pushes water out of the way. The water pushes back up on it.",
  "Huge steel ships float because of their shape. They push aside lots of water, and the water holds them up.",
  "It's easier to float in salty sea water than in a pool. Always swim with a grown-up watching."],
  qs:[{q:"Why can a huge steel ship float?",o:["Its shape pushes aside lots of water","Steel is lighter than water","It has invisible wings"],e:"A ship's shape pushes aside lots of water, which holds it up."},
      {q:"Where is it easier to float?",o:["In salty sea water","In a normal pool","In a bowl of custard"],e:"Salt water pushes up more strongly, so floating is easier."}]},
 {id:"rainforest",title:"Into the rainforest",tag:"Nature",cards:[
  "Rainforests are thick, green forests where it rains a lot. They are full of plants and animals.",
  "Rainforests have layers. There's the dark forest floor, the shady understorey, and the leafy canopy on top.",
  "About half of all the world's kinds of plants and animals live in rainforests.",
  "The Daintree Rainforest in Queensland is one of the oldest rainforests in the world. Cassowaries live there.",
  "Rainforest plants give us fruits, nuts and even chocolate, which comes from cacao beans. Protecting rainforests matters."],
  qs:[{q:"What is the leafy top layer of a rainforest called?",o:["The canopy","The forest floor","The roof of broccoli"],e:"The canopy is the leafy top layer of the rainforest."},
      {q:"Which rainforest is in Queensland?",o:["The Daintree","The Amazon","The Candy Forest"],e:"The Daintree is in Queensland. It's one of the world's oldest rainforests."}]},
 {id:"insects",title:"What makes an insect?",tag:"Nature",cards:[
  "Insects are small animals with six legs. Ants, beetles, butterflies and grasshoppers are all insects.",
  "An insect's body has three parts: the head, the middle called the thorax, and the back called the abdomen.",
  "Insects have no bones inside. Instead, they have a hard outer shell called an exoskeleton.",
  "Most insects have feelers called antennae for smelling and touching. Butterflies can even taste with their feet!",
  "There are more kinds of insects than any other group of animals. They pollinate flowers and clean up the ground."],
  qs:[{q:"How many legs does an insect have?",o:["Six","Eight","Forty-two"],e:"All insects have six legs."},
      {q:"What is an insect's hard outer shell called?",o:["An exoskeleton","A skeleton","A raincoat"],e:"Insects have an exoskeleton on the outside instead of bones inside."}]},
 {id:"spiders",title:"Spiders and their webs",tag:"Nature",cards:[
  "Spiders have eight legs, so they are not insects. They belong to a group called arachnids.",
  "Spiders make silk inside their bodies. They use it to spin webs, build nests and wrap up food.",
  "Spider silk is very strong for how thin it is. Each kind of spider spins its own style of web.",
  "Many spiders have eight eyes! Spiders are helpful because they eat lots of flies and mosquitoes.",
  "Some spiders in Australia can bite. Never touch a spider. Look with your eyes and tell a grown-up."],
  qs:[{q:"Why is a spider NOT an insect?",o:["It has eight legs, not six","It spins silk","It lives in gardens"],e:"Insects have six legs. Spiders have eight, so they belong to a different group called arachnids."},
      {q:"What should you do if you find a spider?",o:["Look but don't touch, and tell a grown-up","Pick it up to say hello","Put it in your pocket"],e:"Some spiders can bite, so never touch them."}]},
 {id:"quakes",title:"What causes earthquakes?",tag:"Earth",cards:[
  "The outside of the Earth is broken into giant pieces called plates. They fit together like a jigsaw puzzle.",
  "The plates move very slowly, about as fast as your fingernails grow.",
  "Sometimes plates get stuck, then suddenly slip. The ground shakes. That's an earthquake!",
  "Most earthquakes are small and people barely feel them. Scientists measure them with machines called seismometers.",
  "If the ground ever shakes: Drop, Cover and Hold On under a strong table. Then listen to a grown-up."],
  qs:[{q:"What causes an earthquake?",o:["Giant plates of the Earth slipping","Thunder from storms","Elephants jumping"],e:"Earthquakes happen when Earth's plates suddenly slip."},
      {q:"What should you do in an earthquake?",o:["Drop, Cover and Hold On","Run outside straight away","Start dancing"],e:"Drop, Cover and Hold On under something strong keeps you safe."}]},
 {id:"fossils",title:"Rocks that tell stories",tag:"Earth",cards:[
  "Fossils are the remains or traces of living things from long, long ago, saved in rock.",
  "When an animal or plant was buried in mud or sand, the layers slowly turned to stone over millions of years.",
  "Fossils can be bones, shells, leaves, or even footprints! Scientists who study them are called palaeontologists.",
  "Near Broome in Western Australia, you can find real dinosaur footprints in the rocks by the sea.",
  "Fossils help us learn what lived long ago, and how Earth has changed over time."],
  qs:[{q:"What is a fossil?",o:["Remains of an ancient living thing saved in rock","A shiny new rock","A rock that can talk"],e:"Fossils are traces of ancient life preserved in rock."},
      {q:"What is a scientist who studies fossils called?",o:["A palaeontologist","An astronaut","A fossil-nibbler"],e:"Palaeontologists study fossils."}]},
 {id:"oceans",title:"Our amazing oceans",tag:"Earth",cards:[
  "Oceans cover more than two thirds of our planet. From space, Earth looks like a big blue marble.",
  "There are five oceans: the Pacific, Atlantic, Indian, Southern and Arctic. The Pacific is the biggest.",
  "Australia is surrounded by the Pacific, Indian and Southern oceans.",
  "The sea is salty. Rivers carry tiny bits of salt from rocks into the ocean, and it builds up over time.",
  "The deepest place in the ocean is about 11 kilometres deep. Much of the deep sea is still unexplored."],
  qs:[{q:"Why is the sea salty?",o:["Rivers carry tiny bits of salt from rocks into it","It rains salt water","Fish cry salty tears"],e:"Rivers wash tiny bits of salt out of rocks and into the sea, where it builds up over a very long time."},
      {q:"How much of Earth do oceans cover?",o:["About two thirds","About one tenth","None at all"],e:"Oceans cover about two thirds of Earth."}]},
 {id:"bones",title:"Your amazing skeleton",tag:"Your body",cards:[
  "Your skeleton is made of bones. It holds you up and helps you move. Without it, you'd be floppy!",
  "Grown-ups have 206 bones. Babies are born with about 300, but some join together as they grow.",
  "Bones protect soft parts inside you. Your skull guards your brain and your ribs guard your heart and lungs.",
  "Your biggest bone is in your thigh. The tiniest bones are inside your ears!",
  "Bones are alive and can heal if they break. Milk, cheese and running around help keep them strong."],
  qs:[{q:"How many bones does a grown-up have?",o:["206","About 50","A billion"],e:"Adults have 206 bones."},
      {q:"What protects your brain?",o:["Your skull","Your ribs","Your hat"],e:"The skull is a strong bony case around your brain."}]},
 {id:"brain",title:"Your busy brain",tag:"Your body",cards:[
  "Your brain is the boss of your body. It lets you think, feel, remember and move.",
  "Your brain sends messages along nerves all over your body. They travel super fast!",
  "Your brain works all the time, even when you sleep. It keeps your heart beating and your lungs breathing.",
  "Here's a strange fact: the left side of your brain mostly controls the right side of your body, and the other way round.",
  "Every time you learn something new, your brain makes new connections. Practice makes them stronger!"],
  qs:[{q:"How does your brain send messages around your body?",o:["Along nerves","Through your bones","By text message"],e:"Nerves carry messages between your brain and body."},
      {q:"What happens when you learn something new?",o:["Your brain makes new connections","Your brain gets full and stops","Your ears get bigger"],e:"Learning builds new connections in your brain."}]},
 {id:"sleep",title:"Why do we need sleep?",tag:"Your body",cards:[
  "Every night your body needs sleep. Most kids need about 9 to 11 hours, and younger kids need even more.",
  "While you sleep, your body grows and repairs itself. It's busy even when you're resting!",
  "Your brain uses sleep to sort out what you learned during the day, so you can remember it.",
  "Dreams happen while you sleep. Everyone dreams, even if they don't remember it in the morning.",
  "To sleep well, keep a regular bedtime and turn off screens a while before bed."],
  qs:[{q:"About how much sleep do most kids need?",o:["About 9 to 11 hours","About 3 hours","None, sleep is boring"],e:"Australian guidelines say kids aged 5 to 13 need about 9 to 11 hours of sleep."},
      {q:"What does your brain do while you sleep?",o:["Sorts out what you learned","Switches off completely","Plays video games"],e:"Sleep helps your brain store memories."}]},
 {id:"pyramids",title:"The pyramids of Egypt",tag:"History",cards:[
  "The pyramids in Egypt are huge stone buildings with four sloping sides. They were built thousands of years ago.",
  "The Great Pyramid was built about 4,500 years ago as a tomb for a king, called a pharaoh.",
  "It's made of more than two million big stone blocks. Workers moved them without trucks or cranes!",
  "Thousands of skilled workers built it. For thousands of years, it was the tallest building in the world.",
  "Ancient Egyptians also wrote with picture symbols called hieroglyphs. Scientists are still learning their secrets."],
  qs:[{q:"Who was the Great Pyramid built for?",o:["An Egyptian king called a pharaoh","A Roman soldier","A family of camels"],e:"The Great Pyramid was a tomb for a pharaoh."},
      {q:"What is ancient Egyptian picture writing called?",o:["Hieroglyphs","The alphabet","Doodle-glyphs"],e:"Hieroglyphs are picture symbols Egyptians used for writing."}]},
 {id:"flight",title:"The first aeroplane flight",tag:"History",cards:[
  "For thousands of years, people dreamed of flying like birds. But no one could build a machine that worked.",
  "Two American brothers, Orville and Wilbur Wright, ran a bicycle shop. They loved to tinker and invent.",
  "In 1903, their plane flew for about 12 seconds! It was the first powered aeroplane flight that people could steer.",
  "That first flight went about 36 metres. That's shorter than a jumbo jet is long today!",
  "Now huge planes carry hundreds of people across the world. It all started with a short hop."],
  qs:[{q:"Who made the first powered aeroplane flight?",o:["The Wright brothers","Captain Cook","Two very brave ducks"],e:"Orville and Wilbur Wright flew the first powered plane in 1903."},
      {q:"About how long did the first flight last?",o:["About 12 seconds","About 12 hours","About 12 years"],e:"The first flight lasted about 12 seconds."}]},
 {id:"firstnations",title:"The world's oldest continuing cultures",tag:"Australia",cards:[
  "Aboriginal and Torres Strait Islander peoples are the First Peoples of Australia.",
  "They have lived here for more than 60,000 years. Their cultures are the oldest continuing cultures in the world.",
  "There were more than 250 First Nations languages in Australia. Some are still spoken every day, and many are being taught again.",
  "Knowledge has been passed down for thousands of years through stories, songs, dance and art.",
  "Many events begin with an Acknowledgement of Country. It shows respect to the First Peoples of that land."],
  qs:[{q:"How long have First Nations peoples lived in Australia?",o:["More than 60,000 years","About 200 years","About 1,000 years"],e:"Aboriginal and Torres Strait Islander peoples have lived here for more than 60,000 years."},
      {q:"How has knowledge been passed down for thousands of years?",o:["Through stories, songs, dance and art","Only through books","By carrier pigeon"],e:"Stories, songs, dance and art carry knowledge through generations."}]},
 {id:"uluru",title:"Uluru and Kata Tjuta",tag:"Australia",cards:[
  "Uluru is a giant rock in the middle of Australia, in the Northern Territory. It's about 350 metres tall.",
  "Uluru is made of sandstone. Iron in the rock has rusted, giving it a red colour.",
  "At sunrise and sunset, Uluru seems to change colour, glowing orange and deep red.",
  "Nearby is Kata Tjuta, a group of big rounded rocks. Kata Tjuta means 'many heads'.",
  "The Anangu people are the Traditional Owners. Out of respect for them, visitors no longer climb Uluru."],
  qs:[{q:"Why is Uluru red?",o:["Iron in the rock has rusted","It is painted every year","It is blushing"],e:"Rusted iron in the sandstone makes Uluru red."},
      {q:"Who are the Traditional Owners of Uluru?",o:["The Anangu people","The first explorers from England","The park rangers"],e:"The Anangu people are the Traditional Owners of Uluru and Kata Tjuta."}]},
{id:"croc",title:"Crocodiles: living dinosaur cousins",tag:"Animals",d:2,cards:[
"Australia has two kinds of crocodile: the freshwater croc and the saltwater croc. Salties are the biggest reptiles alive today!",
"Surprise: crocodiles are more closely related to birds than to lizards. Their long-ago cousins lived alongside the dinosaurs.",
"Crocs are cold-blooded, so they lie in the sun to warm up. They often rest with their mouths open to cool down.",
"The warmth of the nest decides whether baby crocs hatch as boys or girls. Mum guards the nest and gently carries hatchlings in her mouth.",
"In northern Australia, be croc wise. Only swim where signs say it's safe, and stay well back from the water's edge."],
qs:[{q:"Why do crocodiles lie in the sun?",o:["To warm up their bodies","To get a suntan","To dry their teeth"],e:"Crocs are cold-blooded. Their bodies can't make much heat, so they soak it up from the sun."},
{q:"What would happen if a crocodile nest got warmer or cooler?",o:["It could change whether the babies are boys or girls","The eggs would all turn into lizards","The eggs would hatch into birds"],e:"For crocodiles, the nest's warmth decides whether each baby is a boy or a girl."}]},

{id:"penguin",title:"Little penguins",tag:"Animals",d:1,cards:[
"Almost all penguins live in the southern half of the world. Australia has its very own penguin, the little penguin!",
"Little penguins are the smallest penguins of all, only about 30 centimetres tall. That's about as tall as a ruler.",
"Penguins can't fly in the air, but they 'fly' underwater, flapping their flippers like wings to zoom after fish.",
"Their dark backs and white tummies are camouflage. From above they match the dark sea, and from below they match the bright sky.",
"Little penguins waddle home up the beach after sunset, when it's safer from hungry birds. People watch them at places like Phillip Island."],
qs:[{q:"Why do penguins have dark backs and white tummies?",o:["To hide from animals above and below them","To look fancy for parties","To keep their feet warm"],e:"A dark back blends with the deep sea from above, and a white tummy blends with the bright surface from below."},
{q:"How do penguins move so fast underwater?",o:["They flap their flippers like wings","They spin their tails like a propeller","They blow bubbles out of their beaks"],e:"Penguins can't fly in the air, but their flippers work like wings in the water."}]},

{id:"whales",title:"The great whale journey",tag:"Animals",d:2,cards:[
"Every winter, humpback whales swim north from icy Antarctica, up the coast of Australia, on a journey of about 5,000 kilometres.",
"They head for warm water near the Great Barrier Reef to have their babies, called calves. Then in spring they swim back south.",
"Whales are mammals, not fish. They breathe air through a blowhole on top of their head, and calves drink their mum's milk.",
"Male humpbacks sing long, eerie songs that can travel a long way through the ocean. Scientists are still learning what they mean.",
"From about June to November, you might spot a whale's spout from an Australian headland. Look for a puff of spray on the sea!"],
qs:[{q:"Why do humpback whales swim north to warm water in winter?",o:["To have their babies there","To find icebergs to play on","To learn new songs from sharks"],e:"Humpbacks travel to warm, calm water to give birth, then return to the cold Antarctic waters where there's lots of food."},
{q:"Why do whales have to come up to the surface?",o:["To breathe air through their blowhole","To dry off in the sun","Because they're fish that need sunlight"],e:"Whales are mammals, so they breathe air, just like us. They come up to breathe through the blowhole on their head."}]},

{id:"rainbows",title:"How does a rainbow happen?",tag:"Science",d:1,cards:[
"To see a rainbow, you need two things: sunshine behind you and raindrops in front of you.",
"When sunlight goes into a raindrop, the drop bends the light. Each colour bends a little differently, so they spread apart.",
"The light bounces off the back of the raindrop and comes out towards your eyes, sorted into colours: red, orange, yellow, green, blue and violet.",
"Sometimes you see a double rainbow! The second one is fainter, and its colours are in the opposite order.",
"Try it! On a sunny day, stand with the sun behind you and spray a fine mist from a hose. Can you make a rainbow?"],
qs:[{q:"Where should the sun be when you look for a rainbow?",o:["Behind you","Right in front of your eyes","Hidden behind the Moon"],e:"The raindrops send the coloured light back towards you, so the sun needs to be behind you."},
{q:"How does a raindrop make the colours of a rainbow?",o:["It bends sunlight so the colours spread apart","It's full of coloured paint","It shines its own light like a torch"],e:"Each colour in sunlight bends a different amount inside the drop, so the colours fan out."}]},

{id:"levers",title:"Simple machines",tag:"Science",d:2,cards:[
"A machine is anything that makes work easier. Some of the best machines are so simple you might not notice them!",
"A ramp is a machine. Pushing a heavy trolley up a ramp takes less push than lifting it, but you travel a longer way.",
"A lever is a stiff bar that tips on a point. Seesaws, scissors and bottle openers are all levers.",
"The longer the lever, the easier it is to lift something. With a long enough lever, a child could lift a grown-up!",
"Wheels and pulleys are simple machines too. Look for one pulling a flag up a flagpole next time you're at school."],
qs:[{q:"Why is it easier to push a heavy box up a ramp than to lift it straight up?",o:["You use less push, spread over a longer path","The ramp makes the box lighter","The box floats on the ramp"],e:"A ramp lets you use a smaller push, but you have to go further. That trade makes heavy things easier to move."},
{q:"What would happen if you used a longer lever to lift a rock?",o:["It would be easier to lift","It would be harder to lift","The rock would get heavier"],e:"A longer lever means you need less force to lift the same heavy thing."}]},

{id:"gravity",title:"What is gravity?",tag:"Science",d:1,cards:[
"Gravity is an invisible pull. Earth's gravity pulls everything towards the middle of the planet. That's why dropped things fall down.",
"People on the other side of the world aren't upside down. Gravity pulls everyone towards Earth's middle, so 'down' is always under your feet.",
"The Moon has much weaker gravity, about six times less than Earth. There, you could jump much higher than you can at home!",
"Gravity keeps the Moon going around Earth, and Earth going around the Sun. Without it, they'd drift off into space.",
"Try it: drop a ball and a scrunched-up paper ball together. Do they land at the same time? Heavy things don't fall faster!"],
qs:[{q:"Why don't people in other countries fall off the Earth?",o:["Gravity pulls everyone towards Earth's middle","They wear sticky shoes","They hold on to trees"],e:"Gravity pulls towards the centre of the Earth, so everyone everywhere is pulled down onto the ground."},
{q:"What would happen if you jumped on the Moon?",o:["You'd go much higher, because its gravity is weaker","You'd sink into the ground","You couldn't jump at all"],e:"The Moon's gravity is much weaker than Earth's, so the same jump sends you much higher."}]},

{id:"spin",title:"Why do we have day and night?",tag:"Space",d:1,cards:[
"It looks like the Sun moves across the sky, but it doesn't. It's the Earth that's moving. We're spinning like a giant top!",
"Earth spins around once about every 24 hours. That's one day and one night.",
"When your side of Earth faces the Sun, it's daytime. When it turns away into darkness, it's night.",
"So while you're asleep in Australia, kids in England are having their day! Right now, it's night somewhere on Earth.",
"Try it: in a dark room, shine a torch at a ball and slowly turn it. Watch day and night move around!"],
qs:[{q:"What causes day and night?",o:["The Earth spinning around","The Sun switching off at night","Clouds covering the Sun"],e:"Earth spins, so your part of the world faces the Sun for daytime, then turns away for night."},
{q:"When it's night in Australia, what is happening on the other side of the world?",o:["It's daytime there","It's night everywhere","The Sun has gone to sleep"],e:"The other side of Earth is facing the Sun, so it's daytime there."}]},

{id:"meteors",title:"Shooting stars and comets",tag:"Space",d:2,cards:[
"A shooting star isn't a star at all! It's a tiny bit of space rock or dust, often no bigger than a grain of sand.",
"It zooms into our air so fast that it glows white-hot and burns up. That bright streak is called a meteor.",
"If a space rock is big enough to reach the ground, it's called a meteorite. Western Australia has a huge meteorite crater called Wolfe Creek.",
"Comets are giant balls of ice and dust. When one comes near the Sun, it warms up and grows a long, glowing tail.",
"Comets leave dusty trails. When Earth passes through one, we get a meteor shower. Ask a grown-up to watch one somewhere dark!"],
qs:[{q:"Why does a shooting star glow?",o:["It rushes into our air so fast it gets white-hot","It's a real star falling down","Someone switched on its light"],e:"The tiny rock or dust hits our air at enormous speed and heats up until it glows and burns away."},
{q:"What would make a comet grow a tail?",o:["Coming close to the Sun and warming up","Being hit by a rocket","Spinning very slowly in the dark"],e:"Near the Sun, a comet's ice warms up and releases gas and dust, which stream out into a glowing tail."}]},

{id:"frogs",title:"From tadpole to frog",tag:"Nature",d:1,cards:[
"A frog starts life as a tiny egg in water. Lots of frog eggs together look like clear jelly with dots, called spawn.",
"The egg hatches into a tadpole. It has a tail for swimming and breathes underwater through gills, like a fish.",
"Slowly the tadpole grows back legs, then front legs. Its tail shrinks away, and it starts breathing air. Now it's a frog!",
"Frogs soak up water through their skin, so they need clean, damp places to live. Australia has more than 200 kinds of frog.",
"After rain, go outside with a grown-up and listen. That croaking and peeping is male frogs calling!"],
qs:[{q:"Why do frogs need clean water and damp places?",o:["They soak up water through their skin","They like to be shiny","They're scared of the sun"],e:"A frog's skin takes in water, so dirty or dry places can make frogs sick."},
{q:"What happens to a tadpole's tail as it turns into a frog?",o:["It shrinks away","It turns into a fifth leg","It falls off and grows a new tadpole"],e:"As the tadpole grows legs, its tail slowly shrinks until it's gone."}]},

{id:"seeds",title:"How a seed grows",tag:"Nature",d:1,cards:[
"A seed is like a lunchbox with a baby plant inside. It carries its own food to help the baby plant start growing.",
"To wake up, most seeds need water, warmth and air. They don't even need light at first!",
"First a root pokes out and grows down. Even if you plant a seed upside down, the root still finds its way down.",
"Seeds travel to new places. Some float on the wind, some stick to animal fur, and some are eaten in fruit and pooed out!",
"Try it: put a bean on a wet paper towel in a clear jar. Watch the root and shoot appear over a few days."],
qs:[{q:"What does a seed need to start growing?",o:["Water, warmth and air","Only darkness and ice","A bath in lemonade"],e:"Most seeds wake up when they have water, warmth and air. They use their own stored food to start."},
{q:"Why do plants have ways to spread their seeds far away?",o:["So new plants have their own space to grow","So the seeds can go on holiday","Because seeds don't like their parents"],e:"Spreading out means new plants aren't crowded, so they get more light, water and space."}]},

{id:"storms",title:"Thunder and lightning",tag:"Earth",d:2,cards:[
"Lightning is a giant spark of electricity that jumps inside a storm cloud, or between the cloud and the ground.",
"A lightning bolt is incredibly hot, even hotter than the surface of the Sun! It heats the air so fast the air bursts outwards.",
"That burst of air makes the booming sound we call thunder. Light travels much faster than sound, so we see the flash first.",
"Count the seconds from flash to boom. Every three seconds means the storm is about one kilometre away.",
"When thunder roars, go indoors! Stay away from trees and water, and wait inside with a grown-up until the storm has passed."],
qs:[{q:"Why do we see lightning before we hear thunder?",o:["Light travels much faster than sound","Thunder is shy and waits","Our ears are slower than our eyes"],e:"Light zooms to us almost instantly, but sound takes longer to travel, so the boom arrives later."},
{q:"What should you do if you hear thunder while you're outside?",o:["Go indoors with a grown-up","Shelter under the tallest tree","Go for a swim"],e:"If you can hear thunder, lightning is close enough to be dangerous. A building is the safest place."}]},

{id:"ice",title:"Antarctica: the frozen continent",tag:"Earth",d:2,cards:[
"Antarctica is the coldest, windiest place on Earth. It's also a desert, because very little new snow falls there each year.",
"It's covered in a gigantic sheet of ice, in places more than four kilometres thick. That ice holds most of the world's fresh water.",
"In summer, the Sun doesn't set for weeks. In winter, it can stay dark all day and night.",
"Emperor penguin dads keep their egg warm on their feet all through the freezing winter, while mums go to sea to feed.",
"Nobody lives there all the time, but scientists visit. Australia has research stations there, called Casey, Davis and Mawson."],
qs:[{q:"Why is Antarctica called a desert, even though it's covered in ice?",o:["Very little new snow or rain falls there","It's full of sand dunes","It's very hot in the middle"],e:"A desert is a place that gets very little rain or snow. Antarctica's ice has built up slowly over a very long time."},
{q:"Why do people only visit Antarctica instead of living there?",o:["It's extremely cold and hard to live in","It's too crowded with people","There are no penguins to talk to"],e:"Antarctica is so cold, windy and dark in winter that only scientists stay there for a while, in special stations."}]},

{id:"eyes",title:"How your eyes see",tag:"Your body",d:1,cards:[
"You can see things because light bounces off them and into your eyes. Every time you blink, a thin layer of tears washes your eyes clean and keeps them wet!",
"The black dot in the middle of your eye is called the pupil. It's actually a hole that lets light in!",
"In the dark your pupils grow bigger to let in more light. In bright light they shrink to protect your eyes.",
"The back of your eye sends messages to your brain, and your brain works out what you're seeing. Your eyes and brain are a team!",
"Try it: look at your eyes in a mirror in a dim room, then turn on the light. Watch your pupils shrink!"],
qs:[{q:"Why do your pupils get bigger in the dark?",o:["To let more light into your eyes","Because your eyes are scared","To make your eyes look pretty"],e:"When there's not much light, your pupils open wide to catch as much light as they can."},
{q:"How are you able to see a ball?",o:["Light bounces off the ball into your eyes","Your eyes shoot out beams at the ball","The ball whispers to your brain"],e:"Light hits the ball and bounces into your eyes, and your brain turns that into a picture."}]},

{id:"lungs",title:"Your breathing lungs",tag:"Your body",d:1,cards:[
"You have two lungs in your chest. They're soft and spongy, like balloons made of sponge.",
"When you breathe in, your lungs take a gas called oxygen from the air. Your blood carries it all around your body.",
"When you breathe out, your lungs get rid of a waste gas called carbon dioxide. Plants love it!",
"A big muscle under your lungs, called the diaphragm, pulls down to help you breathe in. Hiccups happen when it suddenly jumps!",
"Try it: put your hand on your tummy and take a slow, deep breath. Can you feel your diaphragm pushing your tummy out?"],
qs:[{q:"Why do we need to breathe in?",o:["To get oxygen for our bodies","To make our hair grow","To fill up our tummies with air"],e:"Our lungs take oxygen from the air, and our blood carries it everywhere in the body."},
{q:"What is the diaphragm?",o:["A big muscle that helps you breathe","A bone in your nose","A kind of breakfast cereal"],e:"The diaphragm is a strong muscle under your lungs. It pulls down to help air rush into your lungs."}]},

{id:"tummy",title:"Food's amazing journey",tag:"Your body",d:2,cards:[
"Digestion starts in your mouth! Your teeth mash your food and your spit makes it soft and slippery.",
"When you swallow, muscles squeeze the food down a tube to your stomach. They work so well you could even swallow upside down!",
"Your stomach churns food with strong juices until it's like a thick soup.",
"Next comes the small intestine. In a grown-up it's about six metres long, all coiled up! Here the goodness from food moves into your blood.",
"Last, the large intestine soaks up water, and what's left becomes poo. The whole trip can take a day or more."],
qs:[{q:"Why is it a good idea to chew your food well?",o:["It makes the food easier to digest","It makes the food taste like chocolate","It makes the food disappear"],e:"Chewing breaks food into small, soft pieces, so the rest of your body can digest it more easily."},
{q:"How does the goodness from food get around your body?",o:["It moves into your blood from the small intestine","It floats out of your ears","It stays in your stomach forever"],e:"In the small intestine, the useful parts of food pass into your blood, which carries them everywhere."}]},

{id:"rome",title:"Ancient Rome",tag:"History",d:2,cards:[
"More than 2,000 years ago, the city of Rome in Italy ruled a giant empire that stretched across Europe and beyond.",
"The Romans built long, straight roads to move soldiers and goods. Some Roman roads are still used today!",
"They built channels called aqueducts, some on tall stone bridges, that carried clean water into their cities from far away, using a gentle downhill slope.",
"Crowds of about 50,000 people could watch shows at a huge stadium in Rome called the Colosseum. You can still visit it.",
"Romans spoke Latin, and lots of English words come from it. July is named after Julius Caesar, a famous Roman leader!"],
qs:[{q:"Why did the Romans build aqueducts?",o:["To carry clean water into their cities","To keep their horses dry","To race boats across the sky"],e:"Big cities needed lots of clean water, so aqueducts brought it in from rivers and springs far away."},
{q:"Why were long, straight roads useful to the Romans?",o:["Soldiers and goods could travel quickly","They were good for skateboarding","They kept the rain away"],e:"Good roads meant armies and traders could move fast across the huge empire."}]},

{id:"castles",title:"Knights and castles",tag:"History",d:1,cards:[
"Hundreds of years ago in Europe, lords built castles with thick stone walls to keep their families and people safe.",
"Many castles had a moat, a deep ditch often full of water, and a drawbridge that could be pulled up to keep attackers out.",
"Arrow slits were narrow on the outside and wider on the inside, so archers could shoot out but were hard to hit.",
"Knights trained for years. A boy might start as a page at about seven, then become a squire, and finally a knight.",
"Castle toilets often just dropped into the moat below. Yuck! If you built a castle, what would you add to keep it safe?"],
qs:[{q:"Why did castles have a drawbridge?",o:["So it could be lifted to keep attackers out","So the king could go fishing","To let the moat drain away"],e:"When enemies came, the drawbridge was pulled up, leaving a deep moat between them and the castle door."},
{q:"Why were arrow slits narrow on the outside?",o:["So archers inside were hard to hit","To save money on stone","So birds couldn't fly in"],e:"A narrow gap is hard to aim at from outside, but the wide inside let archers move and shoot."}]},

{id:"apollo",title:"The first people on the Moon",tag:"History",d:2,cards:[
"In July 1969, a spacecraft called Apollo 11 carried three astronauts from America all the way to the Moon. The trip took about four days.",
"Neil Armstrong was the first person to step onto the Moon. Buzz Aldrin followed, while Michael Collins circled above in their spaceship.",
"Hundreds of millions of people around the world watched on TV. Radio dishes in Australia, at Honeysuckle Creek and Parkes, helped send the pictures.",
"The astronauts collected Moon rocks and dust to bring home, so scientists on Earth could study them.",
"Back on Earth, the astronauts were heroes. Tonight, look up at the Moon and imagine standing where they stood!"],
