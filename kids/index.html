qs:[{q:"How did Australia help with the Moon landing?",o:["Big radio dishes helped send the TV pictures","Australia built the rocket","An Australian drove the Moon buggy"],e:"Radio dishes at Honeysuckle Creek and Parkes picked up signals from the Moon and helped share the pictures with the world."},
{q:"Why did the astronauts bring Moon rocks back to Earth?",o:["So scientists could study them","To use as paperweights","To plant them in gardens"],e:"Studying Moon rocks helps scientists learn what the Moon is made of and how it formed."}]},

{id:"outback",title:"The Australian Outback",tag:"Australia",d:1,cards:[
"The Outback is the huge, dry middle part of Australia. Not many people live there, but it's full of life.",
"Towns in the Outback can be very far from a hospital. If someone gets very sick, the Royal Flying Doctor Service can fly a doctor to them in a plane!",
"The thorny devil lizard can collect water with its skin! Tiny grooves carry water from its body right to its mouth.",
"Camels were brought to Australia long ago to carry things across the desert. Now hundreds of thousands of wild camels roam the Outback.",
"Some Outback kids live so far from a school that they learn over the internet, with School of the Air."],
qs:[{q:"How can a doctor reach a sick person far out in the Outback?",o:["The Flying Doctor comes in a plane","They ride a camel for a whole month","They post a letter by kangaroo"],e:"The Royal Flying Doctor Service uses planes to bring doctors and nurses to people who live far from a hospital."},
{q:"Why do some Outback kids go to School of the Air?",o:["They live too far away from a school","They don't like desks","Their school is on a plane"],e:"Some families live so far from a town that kids learn from teachers over the internet instead."}]},

{id:"gums",title:"Gum trees",tag:"Australia",d:2,cards:[
"Gum trees are also called eucalypts. There are hundreds of kinds, and almost all of them grow naturally only in Australia.",
"Crush a gum leaf and sniff. That strong smell is eucalyptus oil. The oil in the air helps give the Blue Mountains their blue haze.",
"Many gum leaves hang down sideways, so the hot midday sun hits only their edges. That helps the tree save water.",
"After a bushfire, many gum trees sprout new green shoots from buds hidden under their bark. They're amazing at bouncing back!",
"Gumnuts are little woody cases that hold the tree's seeds. Next time you're in a park, see how many kinds you can find."],
qs:[{q:"Why do many gum leaves hang downwards?",o:["So the hot sun hits only their edges","So koalas can reach them","Because they're too sleepy to stand up"],e:"Hanging leaves catch less of the harsh midday sun, which helps the tree keep cool and save water."},
{q:"How can many gum trees grow back after a bushfire?",o:["New shoots sprout from buds under their bark","They grow new trunks from their leaves","Birds glue them back together"],e:"Many gums have buds protected under their bark that burst into new shoots after a fire."}]}
];

const LIFE=[
 {id:"money",title:"Coins and saving",tag:"Money",cards:[
  "In Australia we have 5c, 10c, 20c, 50c, $1 and $2 coins.",
  "The $2 coin is small and gold, but it's worth the most of all our coins!",
  "If you want something that costs more than you have, you can save up for it.",
  "Saving means putting some money away each week instead of spending it all.",
  "A great trick is three jars: one to Spend, one to Save, and one to Share."],
  qs:[{q:"Which Aussie coin is worth the most?",o:["The $2 coin","The 50c coin","The 5c coin"],e:"Small but mighty: the gold $2 coin."},
      {q:"What does saving mean?",o:["Keeping money for later","Spending it all today","Hiding it and forgetting"],e:"Saving is putting money aside for something later."}]},
 {id:"friend",title:"Being a good friend",tag:"Feelings",cards:[
  "Good friends listen when you talk, and you listen back.",
  "Taking turns and sharing makes games more fun for everyone.",
  "If someone is sitting alone, asking 'Do you want to play?' can make their whole day.",
  "Everyone makes mistakes. Saying sorry, and meaning it, helps fix things.",
  "Being kind makes other people feel good, and it makes you feel good too."],
  qs:[{q:"Someone is sitting alone at lunch. What's a kind thing to do?",o:["Ask them to join you","Walk past them","Laugh at them"],e:"A simple invitation can change someone's day."},
      {q:"You bumped into a friend by accident. What should you say?",o:["Sorry, are you okay?","Nothing at all","That was your fault"],e:"A real sorry helps fix things."}]},
 {id:"road",title:"Crossing the road safely",tag:"Safety",cards:[
  "Roads can be dangerous, so always cross with a grown-up until they say you're ready.",
  "Stop at the edge of the footpath, one big step back from the kerb.",
  "Look right, then left, then right again, and listen for cars.",
  "Use a pedestrian crossing when you can, and wait for the green walking person.",
  "Walk, don't run, and keep looking both ways as you cross."],
  qs:[{q:"In Australia, which way do you look first?",o:["Right","Up at the sky","Behind you"],e:"Right, left, then right again."},
      {q:"At a crossing, when is it your turn to walk?",o:["When the green walking person shows","When the red person shows","Whenever you like"],e:"Green person means go, carefully."}]},
 {id:"teeth",title:"Super teeth",tag:"Healthy me",cards:[
  "Brush your teeth twice a day: in the morning and before bed.",
  "Brush for two whole minutes. That's about as long as a whole song.",
  "Use a pea-sized blob of toothpaste and brush every tooth: front, back and top.",
  "Sugary drinks and lollies feed germs that make holes in teeth, called cavities.",
  "Visiting the dentist helps keep your smile healthy and strong."],
  qs:[{q:"How many times a day should you brush?",o:["Twice","Once a week","Never"],e:"Morning and night keeps teeth strong."},
      {q:"What feeds the germs that cause cavities?",o:["Sugar","Water","Carrots"],e:"Germs love sugar. Your teeth don't!"}]},
 {id:"calm",title:"Balloon breathing",tag:"Feelings",cards:[
  "Sometimes big feelings, like being angry or worried, can feel like a storm inside.",
  "Slow breathing is a superpower that helps the storm pass.",
  "Breathe in slowly through your nose and fill your belly up like a balloon.",
  "Then breathe out slowly through your mouth, and let the balloon go down.",
  "Do it five times. Notice how your body starts to feel calmer."],
  qs:[{q:"In balloon breathing, where does the air go?",o:["Into your belly","Into your ears","Into your shoes"],e:"Fill your belly like a balloon."},
      {q:"When can slow breathing help?",o:["When you have big feelings","Only when you're asleep","Never"],e:"It helps calm the storm inside."}]},
 {id:"time",title:"Telling the time",tag:"Everyday",cards:[
  "A clock has two main hands. The short hand points to the hour.",
  "The long hand points to the minutes.",
  "When the long hand points straight up at 12, it's o'clock. Short hand on 3? It's 3 o'clock.",
  "When the long hand points down at 6, it's half past. The hour is half done.",
  "There are 60 minutes in every hour."],
  qs:[{q:"Which hand shows the hour?",o:["The short hand","The long hand","Neither"],e:"Short hand for hours, long hand for minutes."},
      {q:"How many minutes are in one hour?",o:["60","12","100"],e:"Sixty minutes make an hour."}]},
 {id:"hands",title:"Germ-busting hands",tag:"Healthy me",cards:[
  "Germs are tiny living things, too small to see, and some of them can make us sick.",
  "Our hands touch lots of things, so they pick up lots of germs.",
  "Wash your hands before you eat and after you go to the toilet.",
  "Use soap and water and scrub for 20 seconds. That's about as long as singing Happy Birthday twice.",
  "Don't forget your thumbs, between your fingers and under your nails!"],
  qs:[{q:"How long should you scrub your hands?",o:["About 20 seconds","1 second","One hour"],e:"Sing Happy Birthday twice while you scrub."},
      {q:"When should you wash your hands?",o:["Before eating and after the toilet","Only on birthdays","Never"],e:"Before food and after the toilet, every time."}]},
 {id:"sunsafe",title:"Sun safe",tag:"Safety",cards:[
  "The Australian sun is strong, and it can burn your skin even on cloudy days.",
  "Slip on a shirt that covers your shoulders.",
  "Slop on SPF 50+ sunscreen, and Slap on a hat that shades your face, ears and neck.",
  "Seek shade under a tree or umbrella, and Slide on some sunglasses.",
  "Slip, Slop, Slap, Seek, Slide. Five steps to keep you sun safe!"],
  qs:[{q:"What does 'Slap' mean in Slip, Slop, Slap?",o:["Slap on a hat","Slap your knees","Slap on some socks"],e:"Slap on a hat to shade your face and neck."},
      {q:"Can you get sunburnt on a cloudy day?",o:["Yes","No","Only at night"],e:"The sun's rays can get through clouds."}]},
 {id:"help",title:"Getting help in an emergency",tag:"Safety",cards:[
  "An emergency is when someone is badly hurt, there's a fire, or someone is in danger.",
  "If there's a grown-up nearby, get them to help straight away.",
  "In Australia, the emergency number is triple zero: 000. It's free to call from any phone.",
  "Only call 000 in a real emergency. Stay calm, answer the questions, and don't hang up until they say so.",
  "Practise saying your full address with a grown-up, so you can tell helpers where you are."],
  qs:[{q:"What number do you call in an emergency in Australia?",o:["000","123","999"],e:"Triple zero, 000, for police, fire or ambulance."},
      {q:"Why is it good to know your address?",o:["So helpers can find you","To win a prize","It isn't useful"],e:"Helpers need to know where to come."}]},
 {id:"beach",title:"Safe at the beach",tag:"Safety",cards:["The beach is heaps of fun! Before you swim, look for two flags that are red and yellow.","Always swim between the red and yellow flags. That's where lifesavers are watching and the water has been checked.","Never swim alone. Always swim with a grown-up watching you, even if the water looks calm and shallow.","If you get tired or scared in the water, stay calm. Float on your back and put one arm up high.","Putting your arm up tells the lifesavers you need help. They are there to keep everyone safe."],
  qs:[{q:"Where should you swim at the beach?",o:["Between the red and yellow flags","Wherever the waves look biggest","Far away from everyone else"],e:"Lifesavers watch the water between the red and yellow flags."},{q:"What can you do if you need help in the water?",o:["Stay calm, float and put one arm up","Swim as fast as you can out to sea","Hide under the water and wait"],e:"Floating keeps you safe, and a raised arm tells lifesavers you need help."}]},
 {id:"rainbow",title:"Eat a rainbow",tag:"Healthy me",cards:["Did you know you can eat a rainbow? Fruits and vegies come in lots of bright, beautiful colours.","Red tomatoes, orange carrots, yellow corn, green peas, and purple grapes. Each colour helps your body in different ways.","Healthy food gives you energy to run, play, learn and grow big and strong.","Treats like lollies and chips are okay sometimes, but they are not everyday foods.","Try adding a new colour to your plate this week. Crunchy capsicum or sweet berries could be your new favourite!"],
  qs:[{q:"Why is it good to eat lots of different coloured fruits and vegies?",o:["Each colour helps your body in different ways","They make your hair change colour","Only red foods are healthy"],e:"Different colours have different goodies that help your body."},{q:"Which is an everyday food?",o:["An apple","A bag of lollies","A big chocolate cake"],e:"Fruit is an everyday food. Lollies and cake are sometimes treats."}]},
 {id:"drink",title:"Water is best",tag:"Healthy me",cards:["Your body is made up of lots of water. You need to drink water every day to feel your best.","Water helps you think clearly, keeps you cool, and gives your body what it needs to work.","When you run and play, or on hot days, you lose water as sweat. So drink a bit more then.","Feeling thirsty is your body saying, Please give me a drink! Water is the best drink for you.","Sugary drinks like soft drink and cordial are not everyday drinks. Carry a water bottle to school and sip often."],
  qs:[{q:"What is the best drink for your body every day?",o:["Water","Soft drink","Cordial"],e:"Water is the best everyday drink. Sugary drinks are only sometimes."},{q:"When might you need to drink a bit more water?",o:["On hot days and when you run and play","Only when you are asleep","Never, one sip a day is enough"],e:"You lose water as sweat when it's hot or you're active."}]},
 {id:"laces",title:"Tying your shoelaces",tag:"Everyday",cards:["Tying shoelaces is tricky at first, but with practice you can do it all by yourself!","First, cross the two laces over each other, tuck one under, and pull tight. That's the starting knot.","Next, make a loop with one lace. It looks like a bunny ear!","Wrap the other lace around the bunny ear, then push it through the hole to make a second loop.","Hold both loops and pull them tight. You did it! Keep practising and it gets easier every time."],
  qs:[{q:"What does the first loop look like in the bunny ears way?",o:["A bunny ear","A big circle on the floor","A star"],e:"You make loops that look like bunny ears."},{q:"What helps you get better at tying laces?",o:["Practising again and again","Only trying once","Wearing shoes on your hands"],e:"Every time you practise, your fingers learn a little more."}]},
 {id:"online",title:"Safe online",tag:"Safety",cards:["The internet has fun games and videos. Just like crossing a road, there are some rules to stay safe.","Keep private things private. Never share your full name, address, school or photos with people online.","Some people online are not who they say they are. Only chat with people you know in real life.","If something online makes you feel worried, scared or confused, stop and tell a trusted grown-up straight away.","You will never be in trouble for telling. Grown-ups are there to help you stay safe."],
  qs:[{q:"Which of these should you keep private online?",o:["Your address and school","Your favourite colour in a drawing game","Nothing, share everything"],e:"Your name, address and school are private. Keep them off the internet."},{q:"What should you do if something online feels wrong?",o:["Stop and tell a trusted grown-up","Keep it a secret","Reply and ask for more"],e:"A trusted grown-up can help. You won't be in trouble for telling."}]},
 {id:"worry",title:"When you feel worried",tag:"Feelings",cards:["Everyone feels worried sometimes, even grown-ups. Worry can feel like butterflies in your tummy.","Worry is your brain trying to keep you safe. But sometimes it worries about things that probably won't happen.","Talking helps. Tell a grown-up you trust what's worrying you. Sharing a worry can make it feel smaller.","Try slow, deep breaths. Breathe in through your nose, and out slowly through your mouth.","You can also think of a happy place, or give a teddy a squeeze. Worries come, and worries go."],
  qs:[{q:"What can make a worry feel smaller?",o:["Talking to a grown-up you trust","Keeping it all to yourself forever","Worrying even harder"],e:"Sharing a worry with someone you trust often makes it feel smaller."},{q:"Who feels worried sometimes?",o:["Everyone, even grown-ups","Only babies","Nobody ever"],e:"Worry is a normal feeling that everyone has sometimes."}]},
 {id:"anger",title:"Cooling down anger",tag:"Feelings",cards:["Feeling angry is okay. Everyone gets angry sometimes. What matters is what we do with the angry feeling.","When you're angry, your face might get hot and your hands might clench. That's your body's warning sign.","Stop before you act. Hitting, yelling or breaking things can hurt people and make things worse.","Try to cool down. Count slowly to ten, take big breaths, or walk away for a little while.","When you feel calmer, use your words. Say, I feel angry because... and ask a grown-up for help."],
  qs:[{q:"What is a good way to cool down when you're angry?",o:["Count slowly to ten and take big breaths","Throw your toys across the room","Yell as loud as you can at someone"],e:"Counting and breathing help your body calm down."},{q:"Is it okay to feel angry?",o:["Yes, but we choose kind ways to handle it","No, you should never feel angry","Yes, and hitting is fine"],e:"Anger is a normal feeling. We just need safe ways to let it out."}]},
 {id:"sorry",title:"Saying sorry",tag:"Kindness",cards:["Everyone makes mistakes. Even grown-ups do! What matters is how we fix them.","If you hurt someone or break something, a real sorry can help. Look at them and say it kindly.","A good sorry says what you did. I'm sorry I knocked over your tower.","Then try to fix it. You could help rebuild the tower, or ask, How can I make it better?","Saying sorry takes courage. And when someone says sorry to you, try to be kind and forgive them."],
  qs:[{q:"What makes a good sorry?",o:["Saying what you did and trying to fix it","Saying sorry while laughing","Saying sorry, then doing it again"],e:"A real sorry names the mistake and tries to make things better."},{q:"What can you do after saying sorry?",o:["Help fix the problem","Run away and hide","Blame someone else"],e:"Helping to fix things shows you really mean it."}]},
 {id:"sport",title:"Good winners and losers",tag:"Kindness",cards:["Playing games is great fun. Sometimes you win, and sometimes you lose. That's part of playing!","A good winner doesn't show off. They smile, say good game, and are kind to the other players.","A good loser feels disappointed, and that's okay. But they still say well done to the winner.","Nobody likes a player who cheats, sulks or throws the pieces. It spoils the fun for everyone.","Remember, the best part is having fun together. And every game helps you get a little better."],
  qs:[{q:"What does a good winner do?",o:["Says good game and is kind","Brags loudly and teases others","Takes everyone's toys"],e:"Good winners are kind and don't show off."},{q:"What does a good loser do?",o:["Says well done to the winner","Throws the game pieces","Says the game was cheating"],e:"It's okay to feel disappointed, but we still congratulate the winner."}]},
 {id:"recycle",title:"Recycling and the bins",tag:"Everyday",cards:["Every day, homes throw away lots of rubbish. Recycling means old things get turned into new things!","In many Australian homes, the yellow lid bin is for recycling, like clean bottles, cans, paper and cardboard.","The red lid bin is often for general rubbish that can't be recycled, like chip packets.","Some places have a green lid bin for garden clippings, and sometimes food scraps too.","Bins are different in different places, so check with a grown-up. Recycling helps look after our planet!"],
  qs:[{q:"What does recycling mean?",o:["Turning old things into new things","Throwing everything into the ocean","Riding your bike in circles"],e:"Recycled things like cans and paper can be made into new things."},{q:"Which of these can usually be recycled?",o:["A clean cardboard box","A dirty chip packet","An old sock"],e:"Clean cardboard usually goes in the yellow lid recycling bin."}]},
 {id:"pets",title:"Looking after pets",tag:"Kindness",cards:["Pets are part of the family! They need us to look after them every single day.","Pets need fresh water, healthy food, and a safe, cosy place to sleep.","Be gentle. Pat softly, never pull tails or ears, and let pets rest when they walk away.","Dogs need walks and playtime. Before patting someone else's dog, always ask the owner first.","After patting or feeding a pet, wash your hands. And if a pet seems sick, tell a grown-up."],
  qs:[{q:"What should you do before patting someone else's dog?",o:["Ask the owner first","Run up and hug it","Grab its tail"],e:"Always ask the owner, because not every dog likes being patted."},{q:"What do all pets need every day?",o:["Fresh water and food","A bubble bath","Lollies and chips"],e:"Pets need fresh water and healthy food every day."}]},
 {id:"chores",title:"Helping at home",tag:"Everyday",cards:["A home is like a team. When everyone helps a little, all the jobs get done faster.","Kids can help in lots of ways! You can make your bed, feed a pet, or set the table.","Putting your toys away and your dirty clothes in the basket are great jobs too.","Helping makes your family happy. It also teaches you skills you'll use when you're grown up.","Ask a grown-up, How can I help today? Then enjoy the proud feeling when your job is done!"],
  qs:[{q:"Which is a good job a kid can do at home?",o:["Put toys away","Drive the car","Cook on the stove alone"],e:"Putting toys away is a great way to help."},{q:"Why is it good to help at home?",o:["The family works like a team","So you never have to play","Because pets do all the jobs"],e:"When everyone helps, the jobs get done and everyone has more time for fun."}]},
 {id:"manners",title:"Magic words",tag:"Kindness",cards:["Some words are so powerful they feel like magic. They make people feel happy and respected!","Please is a magic word. Say it when you ask for something. Can I have a drink, please?","Thank you is another. Say it when someone helps you or gives you something.","Excuse me is useful when you need to get past someone or want to talk while others are talking.","Good manners also mean waiting your turn and not interrupting. Kind words help everyone get along."],
  qs:[{q:"What should you say when someone gives you something?",o:["Thank you","Give me more","Nothing at all"],e:"Saying thank you shows you appreciate what they did."},{q:"What can you say when you need to get past someone?",o:["Excuse me","Move it","Get out of my way"],e:"Excuse me is a polite way to ask."}]},
 {id:"fire",title:"Fire safety",tag:"Safety",cards:["Fire is hot and can be dangerous. Matches and lighters are tools for grown-ups only.","Smoke alarms beep loudly if there is smoke. If you hear one, tell a grown-up and get outside.","Smoke rises, so the cleaner air is down low. Remember: Get down low and go, go, go!","If your clothes ever catch fire, remember: Stop, drop and roll. Cover your face and roll until it's out.","Once you're outside, stay out. A grown-up will call Triple Zero. Ask your family to make an escape plan together."],
  qs:[{q:"What should you do if there's smoke in the house?",o:["Get down low and go, go, go outside","Hide under your bed","Go back for your toys"],e:"Cleaner air is low down, so crawl low and get outside fast."},{q:"What do you do if your clothes catch fire?",o:["Stop, drop and roll","Run around fast","Jump up and down"],e:"Running makes fire bigger. Stop, drop and roll puts it out."}]},
 {id:"helmet",title:"Bike helmets",tag:"Safety",cards:["Riding a bike or scooter is so much fun! But your head is precious, so it needs protecting.","A helmet is like a strong shell for your head. If you fall, it helps keep your brain safe.","In Australia, the law says kids riding bikes must wear a helmet. Wear one on your scooter and skateboard too.","A helmet should sit level on your forehead, not tipped back. Clip the strap so it's snug under your chin.","Ask a grown-up to check your helmet fits. Then you're ready to ride. Have fun!"],
  qs:[{q:"Why do we wear a bike helmet?",o:["To protect our head if we fall","To keep our hair tidy","To make us ride faster"],e:"A helmet helps protect your head and brain if you fall."},{q:"How should a helmet sit?",o:["Level on your forehead with the strap clipped","Tipped right back with the strap undone","Hanging on the handlebars"],e:"A helmet only works properly when it's on straight and clipped up."}]},
 {id:"needs",title:"Needs and wants",tag:"Money",d:1,cards:["Needs are things we must have to live and be healthy, like food, water, clothes and a safe home.","Wants are things that are nice to have, like toys, lollies or a new game. They're fun, but we can live without them.","Grown-ups pay for needs first. Then, if there is money left over, some of it can go on wants.","When you want something, ask yourself: Is this a need or a want? It's a clever money question.","Next time you're at the shops, spot three needs and three wants. Can you tell which is which?"],
  qs:[{q:"Which one of these is a need?",o:["Healthy food to eat","A new toy car","A packet of lollies"],e:"We need food to live and grow. Toys and lollies are wants."},{q:"You have some money and your family needs bread. What should come first?",o:["The bread, because it's a need","A toy, because it's more fun","Nothing, just keep the money forever"],e:"Needs come first. Wants can wait until the needs are covered."}]},
 {id:"prices",title:"Spending wisely",tag:"Money",d:2,cards:["Before you spend, stop and think. Money you spend is gone, so it's worth choosing carefully.","Check the price tag. The same thing can cost different amounts in different shops.","Ask three questions: Do I really want it? Can I afford it? Will I still like it next week?","Try the wait-a-day rule. If you still want it tomorrow, it might be a good choice. If not, you saved money!","Next time you want something, compare two prices with a grown-up and see which is the better deal."],
  qs:[{q:"You see a toy you want right now. What's a smart thing to do?",o:["Wait a day and see if you still want it","Buy it straight away without looking at the price","Spend all your savings on the first toy you see"],e:"Waiting a day helps you check it's something you really want."},{q:"Two shops sell the same ball. One costs $5 and one costs $8. Which is the better deal?",o:["The $5 ball","The $8 ball","They are exactly the same deal"],e:"It's the same ball, so paying less leaves you more money for later."}]},
 {id:"earn",title:"Earning money",tag:"Money",d:2,cards:["Money doesn't grow on trees! Most grown-ups earn money by going to work and doing a job.","Nurses, builders, farmers, teachers and shopkeepers all earn money by helping people or making things.","When someone pays you, they are swapping money for your time, effort and skills.","Kids can earn money too, like doing extra jobs at home or running a lemonade stand with a grown-up.","Ask a grown-up about their job. What do they do, and what do they like about it?"],
  qs:[{q:"How do most grown-ups get money?",o:["By working at a job","By picking it off trees","By asking the bank for free money"],e:"Most grown-ups earn money by working and doing a job."},{q:"You want to earn some money. What could you do?",o:["Offer to do an extra job at home","Take coins from someone's wallet","Wait for money to appear in your pocket"],e:"Doing extra jobs, with a grown-up's okay, is a great way to earn money."}]},
 {id:"sad",title:"When you feel sad",tag:"Feelings",d:1,cards:["Everyone feels sad sometimes, even grown-ups. Feeling sad is okay. It's a normal feeling.","You might feel sad when you lose something, miss someone, or when plans change.","Crying is okay too. Tears can help let the sad feeling out, and then you might feel a bit better.","Talking helps. Tell someone you trust how you feel. A hug, a cuddle with a pet, or drawing can help too.","Sad feelings don't last forever. If you feel sad a lot, tell a grown-up you trust."],
  qs:[{q:"Is it okay to feel sad sometimes?",o:["Yes, everyone feels sad sometimes","No, you should always be happy","Only babies ever feel sad"],e:"Sadness is a normal feeling that everyone has, even grown-ups."},{q:"You feel sad because your friend moved away. What could help?",o:["Talk to someone you trust about it","Keep it all inside and never tell anyone","Pretend you don't care at all"],e:"Sharing a sad feeling with someone you trust can help it feel smaller."}]},
 {id:"jealous",title:"Feeling jealous",tag:"Feelings",d:2,cards:["Jealous is the feeling you get when someone has something you want, like a toy, a prize or attention.","Jealousy can feel prickly and grumpy inside. It's a normal feeling, and everybody has it sometimes.","The feeling is okay, but being mean is not. Grabbing, teasing or sulking won't make it better.","Try this: notice it, name it, then think of something good you already have. I feel jealous, but I have...","Next time you feel jealous, try saying, Well done! Being happy for others is a real superpower."],
  qs:[{q:"Your friend got a new bike and you feel jealous. What's a good thing to do?",o:["Say well done and think of good things you have","Tease your friend about the bike","Try to take the bike away"],e:"Being happy for your friend and remembering what you have helps the feeling pass."},{q:"Is feeling jealous sometimes okay?",o:["Yes, but we should be kind about it","No, only mean people feel jealous","Yes, and it means you can be mean"],e:"Everyone feels jealous sometimes. What matters is being kind while you feel it."}]},
 {id:"yet",title:"The power of yet",tag:"Feelings",d:2,cards:["Have you ever said, I can't do it? There's a tiny word that can change everything. That word is yet.","I can't ride a bike... yet. I can't read this word... yet. Yet means you're still learning.","Your brain is like a muscle. Every time you practise and try, it grows a little stronger.","Mistakes are part of learning. Even the best footy players and scientists made lots of mistakes first.","Think of something tricky you're learning. Say, I can't do it yet, then have one more go!"],
  qs:[{q:"You can't swim across the pool. What's a 'yet' way to say it?",o:["I can't swim across the pool yet","I will never be able to swim","Swimming is too hard, so I'll stop"],e:"Adding yet reminds you that you're still learning and can get there with practice."},{q:"You made a mistake in your maths. What does that mean?",o:["You are learning, so keep trying","You are bad at maths forever","You should give up on maths"],e:"Mistakes are a normal part of learning. They help your brain grow."}]},
 {id:"lost",title:"If you get lost",tag:"Safety",d:1,cards:["Sometimes kids get separated from their grown-up, like at the shops or a busy park. If this happens, try to stay calm.","Stop and stay where you are. It's much easier for your grown-up to find you if you don't wander off.","Need help? Ask a safe adult. A shop worker with a name badge, a police officer, or a parent with kids are good choices.","Learn your grown-up's name and phone number. Then a helper can call them for you.","Before you go somewhere busy, choose a meeting spot with your grown-up. Practise saying their phone number today!"],
  qs:[{q:"You can't see your grown-up at the shops. What should you do first?",o:["Stop, stay calm and stay where you are","Run off to look everywhere for them","Walk out to the car park by yourself"],e:"Staying put makes it much easier for your grown-up to find you."},{q:"Who is a good person to ask for help if you're lost?",o:["A shop worker with a name badge","Nobody, just keep looking on your own","A pigeon on the footpath"],e:"Shop workers, police officers, and parents with kids are good people to ask."}]},
 {id:"secrets",title:"Surprises and secrets",tag:"Safety",d:2,cards:["A surprise is a happy secret that gets told soon, like a birthday present. Surprises are fun to keep!","Some secrets don't feel good. They might make you feel worried, confused or yucky inside. Those secrets should be told.","Your body belongs to you. If anything makes you feel unsafe or uncomfortable, it's always okay to tell.","Tell a trusted grown-up, like a parent, carer or teacher. If they don't listen, keep telling until someone helps.","You will never be in trouble for telling. Count five grown-ups you trust on one hand today."],
  qs:[{q:"Someone asks you to keep a secret and it makes you feel worried. What should you do?",o:["Tell a grown-up you trust","Keep it secret forever","Just try to forget about it"],e:"Worried feelings mean it's a secret to tell. Trusted grown-ups are there to help."},{q:"Which one is a surprise that's fine to keep?",o:["A present for Mum's birthday","Something that makes you feel yucky","Something that makes you feel scared"],e:"Surprises are happy and get told soon. Secrets that feel bad should be told."}]},
 {id:"pool",title:"Water safety at home",tag:"Safety",d:1,cards:["Swimming pools are heaps of fun, but water can be dangerous. We always need a grown-up watching.","Never go near a pool, dam or river without a grown-up. Always ask first.","Pools in Australia have fences to keep little kids safe. Never prop the pool gate open or climb the fence.","Make sure the pool gate clicks shut behind you. Water left in buckets or baths can be risky for babies too.","Learning to swim is a great skill. Ask a grown-up about swimming lessons, and always swim with an adult watching."],
  qs:[{q:"You want to go for a swim in the pool. What should you do?",o:["Ask a grown-up to come and watch you","Jump in quickly while nobody is looking","Climb over the fence by yourself"],e:"Always have a grown-up watching whenever you're near water."},{q:"What should happen to the pool gate?",o:["It should always click shut","It should be propped open with a chair","It doesn't matter if it's open"],e:"A closed pool gate helps keep little kids safe from the water."}]},
 {id:"move",title:"Move your body",tag:"Healthy me",d:1,cards:["Your body loves to move! Running, jumping, dancing and climbing help your heart, muscles and bones grow strong.","Kids need at least 60 minutes of active play every day. That's one whole hour!","The best kind gets you huffing and puffing, like chasey, footy, skipping, swimming or riding your bike.","Moving your body also helps you feel happy, sleep well and learn better at school.","Your hour can be split up. Ten minutes here, twenty there! What active game will you play today?"],
  qs:[{q:"How much active play do kids need each day?",o:["At least 60 minutes","Just 5 minutes","None, sitting is enough"],e:"Kids need at least an hour of active play every day to grow strong and healthy."},{q:"It's a sunny afternoon and you're bored. What's a great choice for your body?",o:["Play chasey or ride your bike outside","Sit still on the couch all afternoon","Lie in bed until dinner"],e:"Active play gets you huffing and puffing, which is great for your body."}]},
 {id:"sneeze",title:"Catch your cough",tag:"Healthy me",d:1,cards:["When you cough or sneeze, tiny germs fly out of your nose and mouth. They can make other people sick.","Try to cough or sneeze into a tissue. Then put the tissue straight in the bin.","No tissue? Cough or sneeze into the inside of your elbow, not into your hands.","Afterwards, wash your hands with soap and water, or use hand sanitiser if a grown-up says it's okay.","Remember: Catch it, bin it, wash it! Practise your elbow sneeze now."],
  qs:[{q:"You need to sneeze but you don't have a tissue. What should you do?",o:["Sneeze into your elbow","Sneeze into your hands","Sneeze towards your friend"],e:"Your elbow catches the germs so they don't end up on your hands."},{q:"What should you do with a used tissue?",o:["Put it straight in the bin","Put it back in your pocket","Leave it on the table"],e:"Binning tissues straight away stops germs from spreading."}]},
 {id:"screens",title:"Screen time balance",tag:"Healthy me",d:2,cards:["Screens like tablets, phones and TVs can be fun. But too much screen time isn't good for growing bodies and brains.","Health experts in Australia say kids should have no more than two hours of fun screen time each day.","Try to balance screens with active play, reading, building, drawing and time with family and friends.","Screens before bed can make it harder to fall asleep. Switch them off well before bedtime.","Help make a screen plan with your grown-up. When it's time to stop, say, Okay! and find something else fun."],
  qs:[{q:"Your screen time is up but you want to keep playing. What should you do?",o:["Turn it off and find something else fun","Hide the tablet and keep playing","Get cross and refuse to stop"],e:"Stopping when it's time helps keep your screen time balanced."},{q:"Which is a good thing to do before bedtime?",o:["Read a book with a grown-up","Play games on a tablet in bed","Watch lots of videos until late"],e:"Screens can make it hard to sleep. A book is a calm choice before bed."}]},
 {id:"calendar",title:"Reading a calendar",tag:"Everyday",d:2,cards:["A calendar shows the days, weeks and months of the year. It helps us remember birthdays and plans.","There are 7 days in a week: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday and Sunday. Saturday and Sunday are the weekend.","There are 12 months in a year, from January to December. Most months have 30 or 31 days, but February is shorter.","A year has 365 days. Every four years, February gets an extra day, making a leap year with 366 days!","Find today's date on a calendar. Can you count how many sleeps until your birthday?"],
  qs:[{q:"How many months are in a year?",o:["12","7","52"],e:"There are 12 months in a year, from January to December."},{q:"Today is Friday. What day will it be tomorrow?",o:["Saturday","Thursday","Monday"],e:"Saturday comes after Friday. It's the start of the weekend!"}]},
 {id:"schoolbag",title:"Ready for school",tag:"Everyday",d:1,cards:["Mornings go smoothly when you have a plan. Getting ready for school is a skill you can learn!","Pack your bag the night before. Check for your lunchbox, water bottle, hat and library book.","In the morning: get dressed, eat breakfast, brush your teeth and put your shoes on.","A picture checklist on the fridge can help you remember each step, all by yourself.","Tonight, pack your own school bag. Then tick it off and feel proud and ready!"],
  qs:[{q:"When is a good time to pack your school bag?",o:["The night before","Right as the bell rings","You don't need to pack it"],e:"Packing the night before means a calmer, less rushed morning."},{q:"It's a sunny day and you're packing your bag. What should you check for?",o:["Your hat and water bottle","Your pyjamas","Your bike helmet and swimmers"],e:"A hat and a water bottle help keep you sun safe and feeling good at school."}]},
 {id:"upstander",title:"Be an upstander",tag:"Kindness",d:2,cards:["Bullying is when someone keeps being mean to someone on purpose, again and again. It's never okay.","A bystander just watches. An upstander helps! You can be an upstander in safe ways.","You can say, Stop, that's not kind. Or ask the person being picked on to come and play with you.","Tell a teacher or another grown-up you trust. That's not dobbing. It's helping someone stay safe.","If it happens to you, tell a grown-up. Today, be kind to someone who might need a friend."],
  qs:[{q:"You see a kid being teased every lunchtime. What should you do?",o:["Tell a teacher and be kind to the kid","Just watch and laugh along","Join in so they don't pick on you"],e:"Telling a grown-up and being kind is what an upstander does."},{q:"Is telling a teacher about bullying the same as dobbing?",o:["No, it's helping someone stay safe","Yes, so you should never tell","Only if the teacher sees it too"],e:"Telling a grown-up about bullying helps keep people safe."}]},
 {id:"different",title:"Different is great",tag:"Kindness",d:1,cards:["Look around. Everyone is different! We have different faces, hair, families, languages and favourite things.","Some people use wheelchairs, glasses or hearing aids. Some families celebrate different special days. Differences make the world interesting.","We are all the same in important ways too. Everyone wants to feel safe, liked and included.","If someone is different to you, be curious and kind. Ask nicely to learn more, and never tease.","Find someone who is different to you and learn one new thing about them this week."],
  qs:[{q:"A new kid at school speaks a different language. What's a kind thing to do?",o:["Smile and invite them to play","Laugh at how they talk","Ignore them because they're different"],e:"A smile and an invite help anyone feel welcome, whatever language they speak."},{q:"Why are differences a good thing?",o:["They make the world more interesting","They mean some people are better","They mean we can't be friends"],e:"Differences make life interesting, and we can be friends with all kinds of people."}]}
